front:
  text: 夷白齋藁卷之二十八
  hash: sha256:e58b1549f90c8568e849e6d70adbcd16ba8f8a2dccfd3431364785cda64766b8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_028-1a}
body:
  text: 臨海陳基著金華戴良編記聽雪齋記西夏塢密公寓第在吳門天宫里其東偏有屋六楹朴而不陋公即南榮為小齋西為壁北為户疏其東南以楮承之中無長物左右琴書晏如也歲方冬公端居肅容虛心無為與造物者遊俄聞中庭桂樹間索索然有聲起而視之則積雪在地皓然矣公因援琴鼓之客有候公于門者公揖使坐且謂之曰客亦知好此乎客曰僕東海之鄙人也何足以知之雖然公所鼓白雪之曲也僕不敏請為公和之客逡巡􅈬席因歌曰白雪兮交下美人兮獨處歲晏兮何所娛撫陽春兮容與陽春兮遲遲白雪兮飛飛彼美人兮勞我思巾余車兮往從之端余居兮正余襟若有聞兮青桂林桂樹兮後凋撫白雪兮逍遙時至正十四年十二月也風林亭記延陵徐君元度起家儒林為時名卿擢司農為都事身顯而家益貧其嗣子仲剛勉焉能以幹蠱克家自奮田疇之荒者治之室屋之敗者葺之問又屬余為文以記其無錫里苐之風林亭余不得辭也無錫為州在東南山水間物崖之夥最于他壤百里之內第宅園池甲乙相望譬諸木焉斧斤弗侵而牛羊之牧罕至深仁厚澤休養生息于承平之曰久矣及貪冒之蠹萌于中掊刻之􅖈攻于外加以武斷之斧斤蹂以椎剽之牛羊而百年之植夲深而末茂者殆將翦而棄之卒未知所以扶持之者斯亭也都事君之所釣逰而其風林之薈蔚水木之清華則所謂異時承平之植也都事君以官為家出入中外垂二十年其間田園第宅百里相望庶幾萬一不鞠為斧斤牛羊之墟者幾何人哉都事君以此計彼孰得孰失固巳較然不置毫髮芥蒂於胸臆間矣庸詎知貴介子弟有能卓然自振不與流俗淪胥于委靡之中治田葺屋式克負荷而其餘力又足以灑掃園池以待都事君之老如仲剛者乎昔唐韋應物百世之士也入則應制參扈從出則揚節為刺史秩比漢二千石亦可謂顯矣然每休沭或不知所于歸退與諸生假寓僧廬單衾陶器悠然自適而所謂共愛風滿林云者乃其居善福精舍時詩語也今都事君為天子職文書贊大農等而上之則於韋侯也何有異日倦逰請老解章綬還朝廷角巾南邁旦暮從賔客子弟攬清風于家林觀生意之流動而承平百年休養生息之僅存于牛羊斧斤之餘者某丘某水尚幸無恙此則君之所有而韋侯之所無也余雖未獲登斯亭然嘗辱與都事君逰既喜君之有子又慶其將有以歸老也故為之記使刻之亭中以伺焉皥皥齋記余友陳季周氏嘗謂余曰吾生于泰伯仲雍之鄉而讀周公孔子騶孟氏之書蓋士之為學亦貴王賤霸而已因自題其所居之齋曰皥皥齋旌吾志也子幸為吾記之昔者泰伯仲雍適吳吳民義而從之斯民也蓋殺之而不怨利之而不庸日遷善而不知為之之民也及文武成康之德洽乎四海周公孔子之教後先繼作而吳之君子至有北學于中國而得聖人之一體者余嘗浮三江道五湖登夫椒望洞庭訪三讓之祠弔虞山之墓意畔田鑿井擊壤而䛴帝力者蓋猶有先王之遺民焉嘗試問之而未之見也今蓽門圭竇唅菽緼絮之民乃有絃歌周公詠歎孔子充然若有所得而不知其所以然而然如季周者斯非遺民之俊秀者乎余乃今失之于彼而得之于此矣蓋君子所過者神上下與天地同流故舜耕歷山而田者讓畔陶河濵而器不苦窳孔子之立之斯立道之斯行綏之斯來動之斯和皆莫知所以為之者也吳為泰伯端委治禮之國則其所過而化所存而神者冝何如哉噫孔子既沒百有餘歲而騶孟氏作貴王賤霸之學幸而復明不幸而不得致齊梁之君為湯武變歡虞之民為皥皥然百世之下有志之士讀其書而論其世者尚知舍歡虞而趨皥皥則其過化存神之見于詞氣間者不徒為空言而已矣方今聖神在上堯父舜子而周孔其臣舉一世而甄陶之而詩書六藝之化彬彬也季周以泰伯仲雍遺民之秀讀周公之書誦孔子之言而學騶孟氏之學豈直以其皥皥者自得而已亦將褒然舉首思以貴王賤霸之説獻之天子而與斯民同皥皥也此騶孟氏憂世之心而有志之士所冝勉焉者故為之記使書于齋之壁以為季周告云種德堂記君子之種德猶農夫之種榖視地肥磽而糞之時其蚤晚而藝耨之凡豐草稂莠螟􅏑賊蝝之為苗害者必謹耰鋤錢鏄祈禳而務去之人徒見其秋而穫冬而藏養老而長幼渴飲而飢食生生而不匱而不知其終歲之勤曽不以水旱凶災而輟其來耜也故曰居一歲種之以榖十歲樹之以木百歲來之以德蓋人非榖無以為食非木無以備器用非德無以遺子孫故種德非君子不能而君子有貴有賤有顯有隱其迹雖不同而其所以遺子孫則一而巳𥘉世祖皇帝以好生之德涵煦六合時則用帷幄儒臣而參以黃帝雷公之術施鑱石針刺以濟人之夭死天下號為神人者故內翰廣平竇文正公其人也遊其門者曰金華王鏡潭氏小心謹畏十有六年而始得傳其術及其倦逰歸江南鋭意以活人為事因即蘭臯舊隱扁其堂曰種德雖浮湛里閈不事造請然人以疾求之者日衆間近之旁郡或逺則過浙水西户外之屨所至輒無所容竇氏之學遂大行東南不問貴賤皆曰王鏡潭今之竇公也蓋鏡潭之業既精而處心尤不苟惟精也故能活人惟不苟也故以德自許余雖不及識鏡潭幸嘗辱與其子珍國瑞逰見其按滎腧辨脈絡引針􅌊艾以療人之疾往往萎者起僂者伸噢咻呻吟者更釋焉以泰猶農之茀豐草剃稂莠祛蟊賊除螣蝝而嘉榖之頴者實堅者好焉然後知鏡潭之後有人而竇氏之傳未艾也且竇公以術而顯鏡潭以術而隱其活人雖巳衆然身不都好爵口不享厚祿出不乘髙車居不御華卷其所以遺子孫者安在君子曰厚施而不食其報必有興者嗚呼王氏其可量哉國瑞俾余為之記乃推夲其先世之所以遺子孫者𣸪之詩云子子孫孫勿替引之敢申以為國瑞告云同樂堂記吳陵謝侯從義由檇李移守錢塘假老氏開元宫東偏之廬以寓焉且題其顔曰同樂堂徴余文以記之昔者孟子因齊宣王之好樂謂樂無古今之殊而民則有欣戚之異者由與民同樂不同樂故也余則以為孟子之言不獨謂樂也謂凡踵行喙息之民莫不皆有飲食男女聲色之欲使為之上者皆能與之同焉則民亦將以其所欲同于上矣苟顓一己之奉而視民之休戚不啻如越人視秦人之肥瘠則亦將以秦越人視其上此三代之民所以至戰國時不以三代之君親其上者由其不以三代之民畜其下也三代而降南靣之君慨然知誦孟子之遺書務懲戰國之覆轍而𣣔以三代之民畜其民者漢宣帝其君也其言曰庶民所以安其田里而無歎息愁恨之心政平訟理也與我共此者其惟良二千石乎嗚呼民無歎息愁恨之心則樂矣然亦非必寒而衣之飢而食之勞而佚之也亦平其政使遂其性理其訟勿戾其生而止爾苟政之不平訟之不理則民不堪命雖日奏韶濩而舞干羽適足以滋其疾首而蹙頞爾尚何同樂之有哉漢宣承武帝之後海內虛耗獨能先民之憂後巳之奉謂守令為吏民之夲因久任而責成之卒用是以致中興之盛焉然當是時號稱良吏如朱邑龔遂之流所謂與帝共此者也亦不過躬行儉約使民安土樂業而已今天下兵興生民罷弊其閔閔焉望治之心猶農夫之望歲也錢塘為東南一都會由吳越錢氏及宋三百年以至國家混一以來休養生息非一朝夕其屋邑市井之蕃珠玉綺繍之冨侯固不得而見之矣而資梁屝屨兵械什器百物之需則未有甚于斯時者也侯寅而入酉而歸食不暇甘于其口寢不遑安于其席亦可謂勤且疩矣然上也日以漢宣之業望其君下也不敢以秦越之人視其民而中也則諰諰焉以昔之良吏責其身使左而右之張而翕之勿替而引之則政平訟理其效可變歎息為謳歌易愁恨為鼓舞亦在于上之人責成何如爾夫使中興之業不顓于漢良吏之盛無愧于朱邑龔遂之流未必不由生民樂業致也侯尚勉乎哉因為記其名堂之義使凡遊于斯宴于斯者知侯之志蓋有在云侯刻躬儉約忠厚信讓蓋詩之所謂豈弟君子也至正二十年夏五月戊子臨海陳基記夷白齋藁卷之二十八
