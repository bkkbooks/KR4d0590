front:
  text: 夷白齋稿輔遺
  hash: sha256:cf1a9d82632d5b1e7888610504ffd9e7d11e792a2b0d7a3611a57f82826dbf68
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_041-1a}
body:
  text: 樂府詠歸操吳人沈仲説搆亭曰詠歸每服田之暇輒絃歌其中蓋將有感于曽點氏之言意也為一闋俾絃而歌以自適云我朝于田我暮于室曷以自娛有琴有瑟我服惟春我樂惟親我欲浴乎沂濆匪舟兮孰先我津我欲風乎舞雩匪若人兮孰為我徒我葺我廬我讀我書我啜有菽我饌有𬞞我非悅此新搆我詠歸兮匪夕伊晝我非愛彼流水吾褰衣兮欲沿其沚聖如可作兮吾從夫子玉山辭為顧仲瑛作山嵁嵁兮磅礴太古木蔥蔥兮雲英英而欲雨日朝出兮在户先輝輝兮水流其下匪君子兮夫誰與處采我蘭兮為佩褰我荷兮為蓋從子于山兮聊逍遙以卒歲望仙詞為陸叔陽道士作木蕭蕭兮中洲雲慘慘兮山幽仙之人兮其耒逰卑真詮兮慰所求翩然駕鶴兮不可以久留倚天風兮特悵望以夷猶吳儂謡至正十四年吳歲飢秋七月海道都漕運萬户府逹魯花赤明善公為糴米賑之吳民感德歌是以頌城上日出行且趨吳民負米歡且呼漕府君侯長萬夫糴米食儂如哺雛君侯運粟輸京都都人食稅復衣租又以餘力蘇焦枯連年和糴喧九衢吳儂有粟不得餔遂令斗米如斗珠不貴楮幣貴青蚨鄉村白屋多逃逋尫羸操瓢行塞途微矦哀儂釡生魚嗷嗷枵腹多作莩昨日兒飢泣嗚嗚今日飰飽走匍匍君侯長漕非剖符不忍赤子坐艱虞使君歸朝掌訏謨濟世升平樂有餘天下米賤酒可沽上及父母下妻孥天子行當錫鋒車君侯幸勿遲其驅逺歸曲陸乘車水乘舟關河何綿綿波浪復悠悠車行阻雪舟阻氷陸憂豺狼水鯢鯨我生不學慿河術奈何欲與重險爭朝辭舟暮辭馬鶺鴒相呼在原野白魚可烹雀可炙諼草羅生滿堂下離倫婦有婦見夫久貧辭去後夫至顯宦感而作我弗干人兮我讀我書日不能具餐兮又無完𥜗雖云至貧兮匪謂之病何以自腴兮惟道之為信爾婦誠愚兮不見燕燕之于飛胡違乎大倫兮乃甘學買臣之妻我一日官榮兮印綬赫若爾母我尤兮我不爾怍吁嗟宋女兮何遼以邈群珠碎傷吳帥潘元紹衆妾作潘七妾皆青年絶色善纂組歌詞因潘出軍恐致疑皆自經繡紋刺綺春纎長蘭膏􆁖鬢瓊肌香芳年艷質媚花月三三兩兩紅鴛鴦翠靴踏雲雲帖妥海棠露濕胭脂朵冶情紛作蝶戀春新曲從翻玉連瑣畫堂銀燭天沉沉揚眉一笑輕千金明珠買得緑珠心欲揮魚腸掃妖彗主君勿疑心似醉一宵痛擊群珠碎門前鐵騎嘶寒風竒勳解使歸元戎俠客行俠客雙鹿盧鵜膏淬銛鍔試舞出嚴城群寇膽盡落從軍行關河鼎沸慘民生志士粗豪氣不平誓掃攙搶安郡邑長驅鐡騎事􅌹征古詩五言京回徐翁招飲園亭初歸自神京歷碌辭逺道適過故人居嘉樹蔭芳草􅋢此時雨歇緑隂淨如掃君子謝軒冕泉石遂幽討清吟對琴尊暢飲還自考逹哉松雲翁逍遙詎知老秋日鄭明德林居匹馬走城市不知秋巳深晨興訪南郭落葉滿空林窈窕藜藿徑蕭條松桂林相逢遂忘返白雪有餘音分題劍池送夏副樞劍斫山石石斷餘劍痕靈池泄海眼絶壁拔天根鹿盧卷晴若崑崙翻積厚早彌冽汲深夕不渾上馴伏丘乕下飲垂澗猿君行心不渝瑩徹鑑兹源分得萬字送王副樞匠石收棟梁所貴得楨幹君侯廊廟具拔一勝千萬夙膺國士知食郎官飯真純謝雕琢俶儻去崕岸宥密佇勳賢行哉慰宵旰送髙郵縣尹何士敬淮海作邑還故鄉故鄉百戰餘四野草茫茫我嘗過維舟湖傍充腸拾生藜𬒳體無完裳日求魚蝦利夜依蘆葦目非人形見此心孔傷非無親戚人遭兵盡逃亡貴者為乘車事侯五賤者􅊢殘卒負戈服戎行貴賤各有役衣食刀窮老不休息遑恤懷舊疆近蒙新有司督課劇驅羊吾餘脫身向乕狼骨肉雄僅存魂魄尚驚惶所覬在矜閔憲章今君尹兹邑錦衣晝生光撫摩宜有術字育豈無創痍輩大小安農桑未春給牛種先秋謹堤防寬猛務緩急斯允臧勿令厭鄊里勿令輕善良坐收平易功令聞堂秋風吹江漢吳楚渺相望丈夫貴樹立跋涉諒何妨送謝元功有引豫與桐川錢君成夫同在江浙分省幕君與豫言浙東西所交之賢必首及謝元功今年豫自淮南使吳越過杭詢元功巳為故祕書卿宣城貢公寓苐之在海寧者因公𥘉捐館有師弟之義為經紀其喪也悵怏不及相見比豫還吳門元功不逺數百里訪豫于旅寓手録其為詩文示讀乃知君之言可信豫遊四方所相知而好者貢公所與同幕而相得者錢君今公巳矣錢君又在淮楚江湖寂寞之濵方以契元功為喜兹又告別不能留而巳夫情也賦以送之故覼縷云士生穹壤間所需莫如友豫與錢貢遊紅顔今白首貢公青雲器聲價齊北斗平生經濟略棄置十八九緘封天人榮遺言殆芻狗錢君廊廟姿不在宣城後髙科𥘉拾芥大雅超擊缶吐氣騰虹霓落筆粲瓊玖連年辱同事南北共奔赱情深肺腑親勢劇左右手謝于兩卿間氣誼無薄厚生者各異縣死者未丘首求我衰老際歡甚忘新久纍然大布衣言若不出口坐論當世事往往辰及酉哆若囊出物巨細無不有袖中文一編渾淪却雕鏤置之几席間光彩生甕牖前徴桐川言可以慰衰朽今晨忽告別纜解吳門柳將行謁上相慷慨攄抱負移書分省垣誰能甘畎畝我病弗克餞話酌河梁酒黽勉納鄙詞中悁聊為剖訪北寺無言講主秋風日蕭爽散䇿入空林有竹心巳清無言意彌深雜花不容把踈磬有餘音逍遙毗盧境落景駐遙岑小丹丘對雨懷元功大掾玄懿大魁江湖秋巳深城郭氣彌欎晨興獨延佇雲容四郊密急雨灑空際長風恣飄忽爽氣浮四簷秋聲肅群物黃葵神獨王時菊情更逸物理有虧盈人情互信屈二子殊未來興懷詎云畢興懷寄元善經歷敬甫郡司晨興寓公館獨居無與儔撫事感時邁懷人慨川流髙子瓌偉器倜儻富材猷王君卓越姿精白動王侯兩兩瑛璚瑶一一珊瑚鈎持以奉君子永言無悔尤使莭感于邁邊城肅豼貅多病去請告却掃謝鳴騶獨慙樗散質黽勉副咨諏昔為倚玉葭今為無匹儔踽踽孰余侣倀倀良自羞仲夏積霪潦涼飈颯驚秋征斾行復還采薪亦巳􅪜既為卿相知寧忌社稷憂按牘紛鞅掌吏卒日呀咻遲君同料理肅駕勿遲留與戴叔能遊寶積山寺宿西方丈上冢桃塢原尋僧寶華麓舟泛石湖清茗煮韽泉緑山空木巳落天髙氣彌肅松月有餘輝共向西巖宿次韻張士行陳庶子天平山中三題山居有餘樂縱逰良不孤生多濟勝具豈辭足力劬處處青蓮座人人僧寶珠雨花無宿蒂玉樹盡新株品題經閣老人境兩俱殊勞生局形迹矯首謾踟蹰昭明寺我覽天池作名篇如刻珉蹇豫亦何為未嘗造其濵清時入朗詠灑然清我神何當託髙翮去訪解空人天池田家近芒種客至巳黃昏開門列芳席稍稍羅盤飧忠厚有餘訓詩書彌所敦琴詠衡門下聊復却塵煩范莊詠楊山人號山鄰城市恆苦隘入山卜佳鄰不求言語好自愛風土淳與山日相親便是擇里仁知翁折行輩近得離世人自云喪亂久俱非太平民所願休兵甲耕鑿不辭貧別周文逹録判僕本匪才承乏江浙樞府都事今杭録事判官周文逹以簿書從事幕下將十稔為至正乙巳僕奉丞相命校藝秋闈而文逹實給事焉事竣將還吳門文逹惓惓焉兾一言為別因賦古選四韻塞其意云黃葉滿洲渚秋風生薄寒今夕復何夕弭棹浙江干顧我今皓首羡子尚紅顔戀戀綈袍意臨分重倚闌竹里子猗歟竹里子幾世家擕李晝永竹成林林深淨無滓清風日蕭森鳴鸞多好音平安有消息歲寒同此心伍大夫祠官祭作惟孝可報親惟忠可匡君忠孝在天地千古猶生存故國有遺廟血食吾吳民椒漿肅致奠恍覩貞烈魂九月十二日感懷示姪麟流光巳深秋重陽過三日衡門寡儔侶獨坐誰與適豈無妻與妾亦復少顔色賴有阿咸賢相知共休戚柳胥水墅何為名緑楊繞堤滸哀哉伍大夫忠魂吊無所空遺江上潮悶氣作吞吐回望闔閭城蒼茫隔煙霧古詩七言送髙元善太守卦任杭州髙侯別我錢唐去雨暗江城秋欲暮憶從傾蓋楚公門握手論交如有素羡君家世為牧守出典方州人􅋢慕楚公賔客君最先日把詩書佐神武折衡師旅文字間飲馬長江竟飛渡戲下三軍皆乕勇幕中一掾驚鸞翥開口瀾翻説劉項抵掌縱橫論遷固我時落魄大布衣公亦招徠俾馳騖西樞上馬常並轡南省聞雞復聮步我曽記侯松雲巢侯亦醉我芙蓉署交情過辱如兄弟話別愁聞戒徒御南風九月無秋聲積雨三吳靄氛霧侯乘髙車駕五馬方靣公卿加禮數錢唐兵革嗟屢經民社誅求尚無度省中郎署盡知巳左右樞機當要路雖云勢分有上下若語同寅實親故古來太守二千石今則藩翰深倚注東南所重在保障繭絲區區何足務曲令市井復承平莫遣湖山廢逰豫為謝分垣馬左司使便無令惜書疏宋劉凝之騎牛圖穎川劉翁厭騎馬去作匡廬牧牛者手招五老日㗸山腳踏烏犍泥沒踝天聖君臣仁且賢翁獨胡為甘棄捐致君堯舜荷時傑尚友巢許安吾天翁朝出逰歸巳暮醉插山花向何處柳隂殘照尚分明安用蒼頭導前路蒼頭引牛翁不知牛亦無心隨所之醒時不記醉歸路翁心自信無他岐當時好事圖蹤迹千載流傳增歎息如今馬上看青山不似騎牛有顔色虞克用山居圖克用一字勝伯雍公之玄孫學士之從姪也玉堂仙人虞學士家住青城洞天裏一隨雲霧起從龍遂掌絲綸佐天子五色製成雲錦章黼黻王度虞唐自騎黃鵠歸帝鄉霓旌羽蓋參翺翔空留舊宅青城下草木猶含雨露香諸孫久作東吳客每憶青城歸未得故人焦粲妙丹青為寫山居張素璧學士今陪石與丁往來多在芙蓉城五嶽文人時送迎他年或復遊人世應與諸孫宴㡢亭西老園圖神仙中人世稀有少小結交今白首昔年同謁西王母飲以不死長生酒酒醉只嫌穹壤窄翻身少試經綸手却尋女媧輔天處彌縫罅隙填諸漏紛紛濁世混臧否豈耰鋤與箕帚酒醒一笑忘妍醜天地為家日月牖我昔住近空明天紅塵失腳五十年與君道學無始先謾取蓮花作酒船蕊珠官中鶴息仙結習同探玄中玄相從宴坐西老園脫離世故追羲軒本長老秋山圖青山青入空紅樹照山紅白雲掩冉青蓮官得非天台華頂峰太古削出金芙蓉上人深居山幾重足迹不與人間通邇來流漫天南東與世髙談臨濟宗時時飛錫洞庭野或東或西無定屣我欲從之渺何許昨日寄書索吾語披圖恍欲凌風雨上人無心我無句有山便與山作主無山亦可隨方住吾為上人作是觀物我相忘吾與汝詩巢杜侯嗜詩久成癖所得名萹如拱璧起居飲食與詩俱自以詩巢號居室我聞上世皆巢居未有詩書誰與娛耕田鑿井無知識渴則飲兮飢則食杜侯仕宦遊廟廊出有車馬居髙堂何用取巢之逼側無乃嗜詩如稻梁古詩三百淳且古上述陶唐訖神禹後來作者非不多律以康衢無足取杜矦所尚今非古大義人人存肺腑苟能以古律今人孰謂塗人異堯禹杜矦杜矦爾誠賢坐我與侯聽取無臭無聲萹提兵餘杭作黃埃漲天𪷟曜靈夜吠天犬如雷聲掃空攙搶五百丈四海鼎沸何由平孫吳穰苴早昧學忍擲宣毫事橫槊本憐墊溺垂手援危事那堪務掎角勉呼卒旅結陳行什什伍伍分干旌雖云兵者古凶器詎敢黷武窮蒼生鳥翔蛇蟠紛起陸御枚火攻機貴速勦除魁醜一鼓桴立決雌雄奚待卜夥哉萬命繇元戎長驅凱旋非是功要令郡邑總寧謐辟穀自甘從赤松桂珠謡一名桫欏子至正壬辰九月望夜半從空墮下廣寒宫前秋色老桫欏子結虬枝杪剛風吹顫玉蟾丹桂經霜香似掃雪㕙提杵𫾣丁東驚落蠙璣銀闕空羿妃孀居不遑惜蚌胎撒下塵寰中五絲可穿雲纚纚顆顆圎明蕩秋水若逢湘女採蘭逰定向波心綴成珮月光如練鋪晴霄世人拾玩英瓊瑶樹根吳質睡未醒粉霞綬冷花飄遙律詩五言送梅同知任杭籍甚梅通守才名屬盛年官聮唐刺史家世漢神仙郡有湖山勝身承雨露偏新吟與遺􅋢到處共流傳和庶子學士靈巗山即事二首髙山凌絶頂習靜借僧房湖繞涵空閣雲埋響􅓏廊數朝人迹斷千載伯圖荒吊古并書景吟詩送夕陽雲山靜飬痾禪榻倚松蘿每見青猊座無聞白苧歌琴臺惟鳥哢劇浩波律詩七言次韻懷華幼武滑滑春泥滿郡城出門騎馬不堪行未能學道從緱母且復忘憂對麯生流水小池垂釣影春風深巷賣花聲停雲賦罷心如渴安得滄浪濯我纓送馬易之代祀海嶽老矣文園馬長卿九重天上直承明長門賦罷黃金賤宣室歸來白髮生海嶽祝釐紆使節江湖懷友劇心旌十年一見非今雨買得鱸魚為子烹次韻謝參政送錢參軍淮南不為桂枝留老我曽同李郭舟漢將又開新幕府桐川寧憶舊莵裘功名同倚匡衡切詞賦深知庾信愁一片孤雲是親舍定依楚尾望吳頭秋日與張士行遊虎丘十五年前此地遊化人城闕俯滄洲靈池有眼還通海頑石無心亦點頭故國山川吳伯業名家臺沼晉風流明朝又上涵空閣一攬江湖萬里秋送劉郎中吳下衣冠盡楚材隴西勳業冠雲臺郎官幕府芙蓉秀霸主江山錦繡開地勢東南吞百粵天威咫尺近三台從容延閣論思舊早晚鋒車趣召來山中與戴叔能對榻楞伽石湖上也六朝古寺白雲封黃葉堆門路幾重下界煙雲秋一棹上方鐘鼓月千峰道人語默天機熟詞客從橫賦茟雄老我平生貪佛日一龕蕭灑慕何顒登吳橫山望東洞庭一上堯峯望洞庭東山咫尺勢堪凌橘林霜老金千顆紺闕雲藏翠幾層吊古獨耒尋晉宋酌泉誰與別淄澠戴顒自是忘機者相約同參大小乘登楞伽千尺懸崖手自攀上方塔廟倚孱顔村村黃葉寺邊寺處處白雲山外山車馬趨城塵泱漭煙霞鋪地錦斕斒東南勝槩秋如畫賸得山翁倒載還石湖上觀音巖輔陀山枕海波寬古洞誰移此地安巖下碧潭長浸月雲根瑶草不知寒棲篁鸚鵡呼人語伏澗蜿蜒聽法蟠嵲屼石橋方廣路也須一度恣盤桓石湖與戴叔能同舟懷雪坡大參乘時祭掃匪遊盤故舊相携盡楚冠兵革戰爭雖未息湖山陶寫有餘歡輞川賔客惟裴迪江左功名獨謝安想見鳯皇池上路秋風吹珮玉珊珊至正乙已四月草七日與家兄上冡石湖洎逰諸山石湖解纜日髙㫪同上靈巗最上峰紺闕下臨波萬頃琴臺髙入翠千重客因弔古頻登閣僧為迎官誤擊鐘一碧五湖如鏡淨扁舟歸計不難從右登靈巗古木蒼藤開寺門清泉白石駐華軒丹青不改天平廟閥閲猶知慶曆尊四靣峯巒旗鼓列一村桑柘子孫蕃皇皇卷服餘生氣再拜令人愧後昆右天平謁范祠舟中與家兄敘別經年兄弟隔吳淞一日相思意萬重上冡石湖欣共載尋僧山寺復相從新墳已灑春前淚舊物猶餘劫後松公事相牽又離别江湖何處採芙蓉聞庶子遷城居二老相看如弟兄十年事主况同盟不誇迹黍金閨近最喜班聮玉署清焚却銀魚當遂隱騎歸白鹿有餘榮鑑湖一曲他年事期看荷花靣面生送嘉定偰知州偰家公子狐白裘兩度出為江海州誅求不廢農桑業撫字曽分社稷憂公勤守職古能吏清白傳家漢列侯老我叨居玉堂署送君欲泛練川舟歸吳送信道元還吳興楊墳寺千里歸來滿靣塵垂虹亭下覔間人自慙元亮為官懶却喜湯休淂句新夜雨西窗談舊約春風南浦問通津他年翔鳳山居裏㝎借禪床寄幻身長律春日泛石湖木蘭人穩載出郭蕩鷗沙碧浪重湖滿青山疊岸賖望簾懷竹葉舉槳撥桃花落絮魚吹逺遊絲燕拂斜蘋香含宿雨杏艷奪朝霞恰恰聞鶯侣纎纎透荻芽東風騁吟興聊爾答年華絶句古意折栁繫離舟栁短舟難繫賴有枝上花風吹送君去採桑女採桑葉盈筐蠶飢歸恐晚鴛機羅錦𥜗生世不經眼天屏山龍門兩崖竪棖臬峭若鬼斧鑿神魚此飛過蜿蜒露頭角靈巖山琴臺峯頂鼓絲桐韻雜松風瀉至今千載餘猶有烏啼夜支硎山寒泉一派銀潢流浸濕雲根冷風逆皺文漪瀉下青天影花鹿山石屋山骨作棟梁莓苔畫青緑八窗夜不扃借與白雲宿夾浦松江頭起處笠澤波相連自昔輿梁圯誰來一濟川石塘湖波渺無極鯨背跨長虹不假秦鞭力終成抵障功石門千室緣隄次邪嬴聚石門青簾招逺睇繫棹緑楊根畫逺峰隔塵喧間花淡心素翛然竹數竿引涼娛晝坐江邉梅裏心抱貞素江雪立挺挺無從寄逺人照水淡寒影陳惟允畫逺別匡廬雲雅冝事耕耘農隙坐樹底讀書疑似君夢醒夢醒西齋曉懷人正寂寥不堪窗外雨滴滴在芭蕉渡江千里長風萬斛舟帆飛天塹浪花秋中原烽燧消耒未擊楫空慙祖豫州過石湖千頃微茫一棹秋白鷗叢裡謾夷猶蒹葭兩岸山如許何處堪尋范蠡舟登楞伽慿舁登登紫翠巔此身髙出萬家煙群峰陡立湖波上玉井明開太華蓮五月調兵赴杭嘉等處五月農家正力耕不堪田鼠食苗萌羽書昨報轅門急情感元戎合調兵肅肅兵行餉糗儲可容野掠不寧居拯民水火須當亟要息風塵大憝除令符五月領三軍拂拂南薰解垢氛從此蚩尤旗盡捲炎荒一掃犬羊群暑炎南國熱如湯鎧甲師徒整伍行盻及凱還拋重負吳山結屋卧方床雞冠不是長安鬪血鮮猩紅露洗暮秋前司晨不解惟呈色空戴峩然古進賢次韻虞隱君堪潘閫掾穀雨中見寄十絶虞卿潘令總能文契結情親若弟昆昨日雨中能過我憶君無語到黃昏吳箋新製玉鸞紋衝雨殷勤寄蓽門燕子不來人獨立自拈湘管認啼䀶東風吹雨冷蕭齋數日泥深無賣柴何必民心怨枯稿九重膏澤降天街柳條緑妥水平堤茅屋隂隂濕燕泥自料封侯巳無分煙蓑雨笠合幽棲鏡中短髮日毿毿情緒如絲未吐蠶杳杳旌旗愁欲破兩年有警在淮南􅔄事東皇苦吝晴眼中春色可憐生夜來一覺羅浮夢翠羽梅梢故故鳴東家結屋朝築基西家織錦夜鳴機人生活計不可缺我獨纍纍無所歸我家舊在赤城傍數畝山田一草堂記得雪中隨射獵弋鳬掩兔過崇岡曽隨射獵過崇岡薄暮歸來煮酒香豈料青山不相識草堂煙滅石田荒春水漪漪漾麴塵春郊花柳織成茵明朝寒食清明近愧我東西南北人謝沈仲説送酒次費圜韻雙榼青衣饋合􅌚羅浮春色照杯柈梅花窗下東風別今夜吹人不敢寒送江西丁省郎赴京奏捷西省郎官定百蠻黃苑瘴裡喜生還盡平南海鯨鯢窟歸奏中天虎豹關本長老紅蕉圖霞絢酣紅勝海榴層層蓮瓣出重樓道人色相皆成幻翠葉從渠不奈秋劉司馬山居機雲入洛名為纍賈誼浮湘志莫酬何似當年陶靖莭一官彭澤便歸休至正乙未志異九月十日也日光畫晦黑雲堆甲騎虗空似往回又有流星西北墮大如盤磬響如雷由范莊過天平范家門巷緑隂濃棟樹花飄幾信風自笑微官苦羈縛看山惟獨後諸公至南峰放鶴亭天峯紫翠列天屏石徑苔花汚屐青為念仙禽羈不得縱他飛去剩孤亭豫卧病吳中家兄命從子慶來省巳因歸賦此送之猶子吾家千里駒窮冬問疾到中吳明朝又鼓松江舵離思紛紛滿五湖汝叔今年五十強姪兒十九氣方剛經書自是傳家事要見丹山出鳳皇至正甲辰憶橫山親墓石湖僧舍親葵吳山歲巳深秋霜春露每驚心青青長養松杉樹牧子樵童幸莫侵山護招提紫翠連湖光一鏡到門前白頭便盍拋塵鞅來向禪房借榻眠贊戴九靈先生像贊仁義為飾身之具忠信為奉國之資飫乎詩書其旨也永發乎文章其聲也希天將以其藴至和之粹則必擁腫其本而卷曲其枝陶當世之懿則必翔而後集覽德輝而下之若人也蓋將視時為去就而以道為樞機者歟雜著鄉飲田先王之道見于記禮家書蓋其迹爾鄊飲酒其一也三代以降好名之君不求其本竊竊然徒舉其迹而行之世之知禮者固巳執筆而議其後矣宋三百年文治之盛蓋彬彬焉君子猶以為未能復古其流風遺俗之見于鄉者蓋猶足徴如四明飲酒有田是也及運去物改禮壞樂崩為民上者徴求而已耳召發而巳耳關決趣辦而巳尓至于鄉飲禮類以為老生之常談時政之不足務而鄉飲之田寧兼併于浮屠氏之手而弗顧好禮者雖欲復覩先王之迹而不可得庸詎知蔡君彥文起家郡吏乃能毅然以禮為已任而浮屠氏亦不得不以田來歸禮之可以服人也如是哉田既歸矣又庸知後之君子不因是而復覩先王之迹也哉然則君之于禮蓋義形于色者也等而上之使得為其所得為凡禮之所在其有不毅然者乎故余于是田重有感于先王之迹刑平編志豫觀刑平一編見君子有憂世之志焉蓋刑者民之司命祖宗之所哀矜而惻怛者也承乎之日有司務守文墨姦吏因緣為市率舞智飾巧以徼一切之利由是曲直混殽是非紕謬而獄市日益以煩司隸不必問御史不必言而薦紳先生顧諰諰焉操董狐之筆斷士師之案信已枉罰餘辜毅然以懲往勸來為已任如故學士承旨長沙歐陽公侍講學士豫章揭公其于斯世一何憂之至耶天曆中詔修經世大典而歐陽公以藝文少監揭公以奎章閣授經郎實預執筆屬在秋官因攟托國𥘉以來記載若令申諸書及文武百司吏牘之可徴者作憲典草有二篇上稽唐律旁引百家而卒折之以經義炳如也方是時執翰劄以從者皆天下文學之選而今禮部貟外郎新安程君尤雅為二公所器重諸所論著悉與聞而掦榷焉二公既沒君乃手輯遺稿草有五章并五刑獄空等論六章為一卷題曰刑平尋自為之引杭郡守吳陵謝侯請刻置西湖書院屬豫序之三代而降言治者無如漢唐或大綱舉或萬目張要其歸皆以經術參律令也文影之間貞觀之日幾致刑措蓋亦盛矣今二公之修憲典折衷衆議一本諸經務以是是非非公天下其憂世之志殆欲使吾君為堯舜由此推之則刑措之效豈直漢唐而巳哉然則二公之志非是編不著是編也非程君不存刻而傅之則謝侯又將樂與天下共之是固皆有憂于斯世者若夫二公論著之旨與刑平之説見于程君所自引兹不著著君子憂世之志與侯刻梓歲月傳之學官則豫不敢多讓于是書頌沈蘇州泰山喬柯遇般郢則堂而建都邑冀北良乘遭方歅則追飈風而躡浮雲之人也冠以蟹豸而不能信其骨鯁委之銅虎而未能攄其拊循是猶松之遇般郢馬之遭方歅也然二千石不足以大其設施三尺法不足以騁其精神必也任重之器為棟梁于大厦致逺之姿豈可服鹽車而居後塵耶評華莭婦守莭難于死莭良以守者身未亡而心先亡與其殞身于頃刻未若死心于悠久故曰慷慨殺身易也華婦陳守莭青年以抵老其艱􅉝無賴亦備嘗矣蘇屬國北海十九稔文丞相兵馬司五祀同一死其心者傳云忠臣烈女不二天庸併論之序通鑑續編序宋司馬文正公編次資治通鑑斷自周威烈王訖于五代其旨微矣考亭朱夫子因通鑑舊文別定義例為綱目以正百王之大統由是千三百六十二年理亂廢興之迹世儒所嘗論議而不能無異者至是而後有以折其衷此著作之事學者所冝世守而勿失者也近世東陽金先生病劉氏外紀之不本于經而是非或繆于聖人乃􅫵托通鑑以前由威烈王上至唐堯者篡為前編出入經史百氏而一以尚書為主其事著矣若夫盤古以下逮于髙􅉝述作之家類為世逺而難言然百家所記豈無近理而可徴者自五代而降宋三百年度越漢唐而其世運有盛衰夷夏有消長帝王將相禮樂刑政有得有失此後之君子所宜執筆而為之論著者也然非貫穿古今不足以涉群籍之涯非捴括機要不足以綜萬事之統非深造義理之微不足以識是非之正此吾友陳君子經續編之作所以為不苟也蓋子經之先大父祕監公以宋遺老隱居四明山中嘗推宗綱目著書以紀歷代之統其先君子教授表章家學訓釋惟謹子孫束髮受是書即知先志所屬嘗甲以為圖傳諸同志且敷為筆記一百卷藏于家矣今又上論盤古逮于髙􅉝下據三史會于有宋或近理而有徴或損繁以致約前乎唐堯者既有以輔其未備後乎五代者又有以嗣其方來北事于通鑑較義于綱目斟酌前編而不必苟同至于尊正統以定萬世之大分則考亭夫子之特筆祕監府君之遺意子經父子世守而罔敢失焉者其考核之精取舍之審固非區區謏聞者所能盡識然舉其一而其餘者可以類見昔司馬遷論太史公所次舊聞成一家言後世稱為良史子經此萹豈非師古人而明先志乎傅之學者當為前編並存然則序而歸之以伺知者余固不得以苟讓為也送張州尹序常熟言子遊氏之鄉也子遊當春秋之季列國爭衡而其為武城宰獨尊信孔子之言弦歌禮樂以教之及漢興收秦民于百戰之餘而相國曹參獨師事蓋公用其清靜之説以治齊而齊大治夫清靜之説與君子之道不同然馴而致之亦足以勝殘去殺與民休戚則夫學子遊之學仕子遊之鄉而所以迓續愛人之休烈于變易使之淳風顧不益簡且易乎然百戰之鋒或不戢于秦漢爭衡乏勢或不殺於列國于斯時也欲治之以清靜而不先教之以禮樂乎則機軸其空瘡痍未復故今日之務莫要于教民莫艱于拯民苟非仁足以周撫字智足以遏強禦才足以綜繁劇廉足以律頑貪而又將之以老成強之以精力如保定張侯庸道者亦烏足以守北門之鎖鑰奠水陸之咽喉卵翼生民股肱藩省也哉今日用侯與侯之為今日用殆非徇其名而巳蓋將有以收其實也吾聞之十室之邑必有忠信常熟為吳大州薦紳之徒豈無忠信非公事不至尹之室如淡臺子羽者乎斯行也吾知不待蓋公而州治矣申公有云為治不至多言顧力行何如耳矦尚勉乎哉送虞勝伯序故宋太師虞雍公以雄姿偉略佐宋中興出入將相垂三十年其經國大業之著于章疏忠貞氣節之形于奏對太史氏所録蓋班班焉有志之士聞其風者猶足以興起而况覩其全書者乎其書舊刻蜀中巳而燬于兵四世孫寶慶通判將復刻之湖南弗果五世孫參政當國𥘉尤篤意于此會故人眉州史孝祥守興化聞黃伯固家實有之求之不能得至六世孫學士遭逢盛際復以文章致位通顯其侍書奎章閣時嘗屬閩校官謝中物色之中至閩適閩武官有購得之者將資以見學士未幾學士歸田里尋捐館舍自是書之存亡無復以為意者矣與豫友者曰堪字勝伯于公為八世孫一介布衣困窶無聊自其以上居吳吳子弟之與儕輩者往往厭棄筆硯不屑事父兄故習自負以班仲叔者無慮十六七否則亦竊自緣飾為公孫子不成其敝猶足以舞文巧詆與鄉里少年爭長雄勝伯之計顧不出此獨折節以紹隆家學經紀遺書為巳任間聞松江俞子中為吳理官時得其書于魯人賈景莊氏將親往求之斯行也天或未喪于斯文乎必有以遂其賢子孫之所求矣吾聞之君子之澤五世而斬勝伯去公八世矣斯文也猶將賴之以弗墜韓愈氏有言莫為之後雖盛而不傳勝伯所謂善為人後者非耶于其行吳之能言者率為詩以相之屬豫序之送劉廷傑序嘉興判官劉君廷傑將之官與之遊者咸賦詩以餞余因酌之酒而為之言曰里人有生子而甚愛之者求善嫗字之而得鄰婦焉婦以身任愛子之託于人凡子之飽飢燠寒喜戚笑啼一是以其父母之心為心子有不獲其所欲而癢痾痛疾或從而萌焉則其責悉歸于婦而婦蓋不得以鄰自狎而或敢少措幾微不滿之辭于其間哉是婦也不過受傭于人傭直滿則復去為鄰非若士大夫委質為臣屬則終身焉如女子之事其夫然者則夫受民社之寄于時而民之飽飢燠寒喜戚笑啼視鄰婦之字夫人之愛子者為何如哉蓋一郡之責在於長吏苟得其人則或無所事乎其佐苟用其人而未得則為之佐者可不慎選乎此廷傑之行所以為不苟也廷傑世為肅慎氏少宿衛鎮南王藩邸今從平章政事吳陵公出入文武兩府以材能為公所器重凡將相公卿四方聘問之使之往來與夫薦紳士夫之修容于公之門者必廷傑乎將命或進或退或先或後得其宜則尊卑有序緩急稱情而輕重無或乖乎分不得其宜則禮失其序事戾乎情而言與分乖故非習於禮練於事逹乎分者莫克為之今廷傑于此蓋恢恢乎有餘也然則舉是措之于郡其復有出于尊卑緩急輕重之外者乎矧嘉興之民飢者待哺寒者待衣戚而啼人或莫知其所恤喜而笑人或莫知其所勸日夜喁喁焉開口以望慈父母求善嫗以字之也久矣廷傑行哉吾知不待長吏而東南郡佐以治行稱者必廷傑也今之從政而以鄰自狎者皆是尚烏足為廷傑告云詩凡若干首繫于下方至正庚子九月壬辰序和靖先生年譜序故宋侍講尹和靖先生嘗寓平江虎丘之西庵後人因築祠祀之國𥘉祠廢有司遷麗郡城尋請署額為書院因名曰和靖且置師弟子貟以先生之道教之而先生之道見於門人祁君寬所記語録若干卷前山長沈維時既巳刻之書院矣其出處始終言行本末著于黃君士毅所纂年譜顧未之刻焉今山長葉顒實始出俸廪為之倡而儒士陸寧因率同志若干人裒錢以相之用是譜與語録並傳而先生之道益著矣初先生棄舉子之業而從程叔子也豈非𣣔聞聖賢之道乎及遭難靖康脫身劉豫間關百罹誓死不屈當是時也知不辱師門而已焉太師張公浚趙公鼎之倫交口論薦不絶于朝玄纁束帛之使趣召赴闕者相屬于道蓋非先生之志也及屢召屢辭卒辭弗獲遂以布衣入侍經帷為帝者師其勸講也每齋宿而後進深覬所言悟主以利天下此則師門之志而先生奉以周旋蓋所謂不失其正者也然張趙二公去位秦檜以議和竊柄而君子小人遂與夷夏同盛衰而宋之為宋蓋可知巳先生獨毅然不顧上疏切諌且移書責檜皆不報此其自任以天下之重何如也而道之不行蓋非先生之不幸也于戲先生之道不必行于秦檜先生之譜不必不傳于後世蓋譜傳則道傳秦氏之子其如天下後世哉先生家世爵里與師友授受之懿在列傳墓志伊洛淵源語録皆可考是譜也蓋攟托諸書參以已聞而先後次苐之俾百世之下誦其詩而讀其書者觀乎此亦可以由階及户而窺其奧矣維時顒皆鄉貢進士云至正􅉝丑二月癸未序送鎦治中詩序自兵興以耒所在文武百司知守章程恤民隱夫田婦桑不廢生聚者吳越數郡而已彼城邑丘墟蒿萊蔽野豺狼虎貙之屬呼曹命群以荐食生人者又何其烈也將相公卿日夜身先士旅沐雨櫛風以與此類﨑嶇百戰者夫豈為室家計哉列郡長佐所與周旋駿奔視百戰雖不同然附摩有重輕設施有緩急非素與國家同休戚謹法度而識情偽者則或未足以勝其任也姑以杭秀二郡言之吳陵謝矦豈弟溫文有良吏之風故俾守杭以股肱藩國而京口鎦君出儒入墨機辨疏通故俾為治中以副之而杭以治秀之為郡在蘇杭之間負海控江出其租庸以佐軍國蓋重地也僉謂永嘉陳君師古􅋢人篤信不回委以民社宜無與讓遂由行中書貟外郎擢同知都事又以鎦君為賢俾去杭與共治焉夫豈故為是紛更也哉亦以父兄子弟夫婦長幼安生聚力田桑務其什一以供公上恢復之基庶幾在此戰之力也然戰可以捍患不可以致治任致治者其惟大夫士乎彼驅民于豺狼虎貙之口者其不仁亦甚矣今欲反其不仁而治之無他亦在于輕重緩急之間而已鐂君嘗協恭所以與謝侯收治效于杭其于緩急輕重蓋習聞而身試焉者今去而之秀使協恭陳君其無異謝矦則治秀如治杭無二道也謝矦方入參帷幄與公卿將相左權衡右規矩以激昻文武百司之執事鎦君敡歷二郡有如疇庸考績宜不在他有司之後况以武捍患以文致治譬猶使舟人操舟車人御車苟各務盡其所長則未有一日而不千里者也鎦君勉乎哉與君善者咸分題賦詩以華之余不佞故為之序至正辛丑二月丁酉贈盛斷事詩序余辱以末僚承乏吳陵公幕下其所以比肩而從事者行中書省貟外郎桐川錢君行樞密院都事秦郵盛君會稽蔡君也三四人者生不同里閈業不共師友喜怒􅋢憎不均嗜欲一旦共官守服官政論議趨舍舉措謀為亦何有于世哉顧不苟同以徇勢不求異以徼名譬之五音必調以琴瑟則怗懘消而和平作矣蓋天下之事是是而非非固無所容其心也公方合四方俊英瓌傑之士率貙乕驃悍梟雄之將苦心勞思誓先天下為社稷生民削除􅍔孽非細務也吾等出焉不能擐甲胄操干櫓與猛士鋭卒爭一決之鋒于疆圉間入焉不能興利除害進賢退不肖效微勞于廊廟之上又可不協恭盡力去嫌逺疑黜比昵布公道庶幾禆輔絲毫于幕下乎蓋公之奉國與吾等事公以勢分言則子弟之于父兄也以休戚言則心腹肘腋衆竅百骸無一非要害者此吾三四人所素同心榮瘁死生以之自信不疑非一朝夕矣黽俯鞠躬夜以繼旦然而不敢自必其或濟否也今年秋盛兄由都事擢斷事官仍以職事􅊢杭分樞府實公所論也蓋國之大事在兵兵之大紀在法法之得失在人苟得人矣則綱而理之其要舉于上張而翕之其事存於下然屬任之顓責成之厚非素清謹明恕守正不回如君者亦或未足以堪其命也由是而言則銓量豫奪或輕或重視幕府為何如哉雖然凡文武百度巨細緩急幕府莫不預聞而畫諾焉今君所職固前日相與協恭盡力所謂以琴瑟調五音消其怗懘底于和平者也彼同舟遇風吳越相救况子弟之事父兄肘腋之衛腹心在吾等實不啻乎推是道也雖不敢必其或濟與否然無所容心于是是非非在此而不在彼吾等與君尚敢不益務自勉乎哉同幕之士用韓詩分韻賦五言六韻為君贈而錢君倡之臨海陳基序之至正􅉝丑七月甲子也詩曰銀鞍白玉珂絲鞚黃金絡同趍紫薇署共入紅蓮幕衆馬敢睎驥纍鷙不如鶚一舉空冀群再舉翀寥廓天髙霜力徑日淨秋容薄君家漢廷尉朂哉諒無怍送邵同知序越在禹貢掦州之域距杭裁百里前代士大夫厭居侍從者多求輔外服而好事者又多喜杭越山川風物之勝其能言者又各為詩文誇美之如唐元白諸公是也國家承平百年尤慎守倅之選然士大夫求輔外者或多喜請越至語杭則或有難色蓋杭在東南號為一都會天下所謂聲色伎巧竒珍綺麗之物可以娛耳目適口體者舉集其市然物盛人衆姦偽亦滋出股肱近臣或枋政藩輔或持部使者節威行福隨聲與勢角守倅吏民之本也今進則承風旨徇要束退則具文書備稽考又退則送往勞來或恕失一醉飽之􅌚于人是務士大夫起布衣至守倅亦榮矣然時異事殊慎黜陟者固莫嚴于守倅為守倅者槩莫難于杭杭豈遽不如越哉勢有使之然者則其流風不得不與之俱靡爾及四方有變杭亦荐遭兵燹向之所謂耳目口體之奉舉集其市者至此亦澌盡于是而愛吏民之寄視承平無事時宜益難矣淮南邵君師賢由治中進同知郡事其閔閔焉日與執事最下者協恭守長拊摩瘡痍內則實儲偫餽邊外則繕城壘戒非常供億紏紛以夜繼旦殆四閲寒暑矣然而未始有難色者蓋方靣將相以生人欣戚為己任其率下也不務苟承風旨具文書賔客往耒亦不敢屑屑焉責醉飽之􅌚于有司其鞠躬盡瘁者惟民所好惡時其緩急而先後之此今日之務將相之所責成而師之所不敢不勉也師賢亦何容其心哉亦盡其在已者而巳爾今年春將相多其能復舉之倅越越與杭雖皆楊州之域相去僅百里然其人有老死不識聲􅊶伎巧珍綺靡麗者尤其賢者服詩書賤者力田畒老老而長長百世不能易也于戲越其猶有先王之遺風乎故承平以來越最號易治任寄守倅者亦最號得人今越與杭民力俱澌盡然為之上者信能因其俗而以義使之則易治之風越猶有不待嘗而後勸者師賢勉乎哉于其行為賦詩送之而書以為序送湯都事序吳與越唇齒之國也承平無事時修二千石職貢而已一旦群醜怙終所至騷動吳獨不愛三江五湖之利結歡四方豪雋折莭與士大夫同勞苦戮力方面股肱天下賴之越以勾踐遺民日夜𬒳堅執鋭與猛士徑卒爭先赴死以捍禦浙水東上流逋誅之敵如浙西有警輒提枹鼓走聽約束雖蹈水火弗顧也越中或有緩急則鐵騎戈船水陸赴援恐後蓋天下以吳為股肱吳以越為唇齒越以將為司命而幕府又將之肘腋心膂也然為越選重將易為將求賢佐難蓋舉古者或迂于事守文者或繆于情知常者未必知變善斷者不必善謀兼是數者之長而又俶儻知大體敡歷樞省受知公卿而不矜為苟同者其惟行樞密都事湯君乎君字仲舉淮南人昔為行省屬椽時會越有變嘗攘臂起行問出萬死不顧一生倉卒決利害以定之今也從容赴越將任肘腋心膂之寄于幕府視昔倉卒定變之時事勢不同然使主將總大綱湯君理百度言聽計納克盡所長將事或曰州視縣雖巳崇然同知為二職縣視州雖益卑然尹為長吏尹之職固顓矣然自辰及酉弊弊焉率以事􅊢大府雖飢渴不暇飲食久之僅得以最考稱于時由是言之為尹孰與佐州為二職亦較然明矣夫鞠躬州縣與偃蹇布衣出處固大不侔矣然使事親讀書無或慊于心又庸知造物者非所以玉成之也哉又曰夫祿所貴子逮養者以其能推以及民也德常為縣治行可稱其殆知所推乎自兵興以來芻糧器械水陸戰攻之具取給于州者不一而足而姦吏並緣為市又貿貿焉日夜侵牟朘剝乎其間田里之民噢咻呻吟而卒未知所休息者由上之人不知所以推之之道也德常既知推之于縣矣則夫舉而錯之于州譬之醫者之用藥取其巳驗之方而試之則必未有痿而不起傴而不信者也德常勉乎哉吾恐是州同知之席不暇暖而有司者將不得以尋常繩尺較歲月于德常矣豫與德常善故于其行以或者之言告之然不以頌而以規者蓋知之深所以望之厚也送禇士文序始豫未識禇士文氏見其手書宋真文忠公所撰居官四針筆力峻整私竊􅋢重之及與士文友又知其言行文學皆不苟也篆隸于書為最古習之者必其人之師古者也濮陽吳孟思師故吾衍子行子行之書號師古孟思學之終身不變士文之書于孟思不少讓孟思巳矣今之所謂師古者非士文其誰歟余生也後不及見子行幸嘗與孟思善孟思以書知名貧約自將平居鄉里獨喜赴人之急世之知孟思者獨其書而已至其為人知者或鮮也孟思沒吾乃今得士文焉士文于書取法秦相斯漢中郎雍唐令陽冰諸家罷精神二十年為人書古今文章刻金石往往傳諸好事者夫篆􅊢書之不絶如線士文師古獨不懈嗟乎慕古人而不巳見有師古人者如見古人焉此余之所以愛重士文者乎士文以書遊公卿大夫間公卿大夫之為詩為文稱道其為人者口相屬聲相和也然則世之不知士文者蓋鮮矣余雖不足以知士文然方資士文以師古而士文持州判官牒將赴官海寧而余不得留也士文嘗以蔡氏書融會成章所謂舉子業試有司不利間用薦者授鄱陽邑丞尋以材略佐軍中朝廷録其勞授之今職士文之行也謂余曰吾方有吏責于時子幸愛厚我獨無一言以辱私我乎余應曰諾蓋余與士文皆師古者而士文之書獨為著稱夫文忠公百世之師也而士文又雅好書其針其言曰廉曰仁曰公曰勤此四三言者實律已撫民存心蒞事者之規矩權衡也士文書其辭則必師其心師其心者善師古者也以此為吏不既茂矣乎與士文交往者率賦詩以贈余因為之序記吳縣修學記平江屬縣麗郡城者二縣皆有學而今三皇廟實宋景祐間吳縣與學官舊址也其徙今郡城西賔興坊廟序齋庖凡四十餘楹則紹定初縣令趙善翰實改卜焉淳祐之際縣令趙汝趾更繕完之國朝混一郡縣通祀孔子而吳縣學至正七年逹魯花赤馬祖憲嘗一修葺十九年縣尹張經斫石作櫺星門甚偉而廟學更十餘寒暑摧圯就壓槩未遑有植其仆而剔其螙者兹縣尹楊侯由行中書掾史以闓敏亮達膺是選甫下車即謁先聖先師環視內外慨然以振興為巳任顧教官方虗席而學廪告乏且久適鄉貢進士吳興莫孜客吳郡侯雅知其賢因折節以學事委之遭時多故民罷于力役侯徒手于百廢之餘計未知所出間謂孜曰吳民雖困悴苟以義勸之冝無不用命者賢父兄察侯意所屬咸奮曰吾侯為政殆知所謂後先緩急者乎夫禮義之可以為國也久矣矦今不鄙夷吳民而欲以禮義畜之甚盛舉也故宋太師魏國文正公九世孫范廷珍等率緡錢合五千有竒為修學費未幾縣之浮屠氏靈巖寺住持標等謂其徒曰吾與儒者雖異師然衣且食焉日與編户之氓俱以什一之賦徭于縣幸天惠賢侯非唯編户者有賴吾徒亦竊有休利焉彼編户者不敢自愛其力以佐矦興學吾等獨敢私愛其力乎亦相勉以資若干緡來助侯曰吾事其殆庶幾矣乃擇縣曽勤練有幹局者司其出納侯辰入暑縣事退輒至學親較百工惰勤以程督之中為大成殿後為明倫堂傍為兩廡為齋廬規制大略悉遵紹定之舊而以堅撤腐以直支傾材必貞工必良視馬侯所修或有間矣其周之而為官墻履之而為階戺缺者輔之漏者覆之隉阢者填之使安夷之使平其丹堊之漫漶者飾而新之兩序從祀先賢像剝落而􅘬昧者更繪而神明之于是上棟下宇內垣外墉奠者益崇以嚴弊者益完以好入其廟儼乎其有臨也升其堂肅乎其有容也師生教飬秩乎其有序也經始至正甲辰蠟月壬寅訖于明年如月甲子既竣事侯率僚佐行釋奠禮退集師弟子貟講六藝之文因歎曰吳為縣地方百里學官與縣治俱麗郡城而境內之人散處山澤有不得朝夕肄業於學者亦多矣乃呼其父兄而告之若曰吾欲俾若里有社社有學學有師以教若子弟可乎皆應曰諾居無何百里之內孩頌相聞口誦詩書而身踐儒行者相屬於道鄰州吳江之民曰奚士龍聞而慕之割私田九十畝有竒來歸以繼廩稍于學侯亦弗之拒也訓導鄧德基黃本疏其事請書于石吾聞學校廢興視守令之賢否此古今確論也承平以來為守若令者不駿奔于期會則攘臂于賦斂鞠躬于簿書蓋八十年于此矣其不以文具視學校者幾何人哉及天下有變向之所謂駿奔攘臂且鞠躬焉者卒莫知所以救之楊侯起家為材掾一命縣長吏當百戰創痍之際視承平所不暇者若可以少緩而侯顧汲汲焉束帶詣學正色一呼應者如響而異端之徒鄰州之民不謀而至者恐後禮義之足以感人也蓋若是方是時郡守馬君以師帥之職綱理乎其上楊矦以縣大夫與丞鄭翀簿王造典史舒昉劉惟志勸相乎其下上下一德求學校之無興不可也使凡職守令者皆知不以文具待學校而長民者必以禮義先天下而天下有不足平者矣楊矦為縣未期月而善政類此者不一而足以不繫于學故不書侯名彛字好德鄱陽人董是役者縣曹史李質沈瑞學吏樊龍也至正二十四年五月辛巳言巳常熟州修學記常熟儒學宋端平𥘉縣令王爚實重修距今若干歲而常熟升縣為州又若干年矣至元皇慶間州人楊麟楊鳯曹南金再力新之自是又若干年至正庚子教授天台陳聚以教養餘力莭縮衆費即其弊螙者而繕且葺焉越二年今守禦元帥兼知州事海陽盧侯視事之日即謁先聖先師環睹廟學思有以振其廢墜方是時兵興民困侯知其不堪命乃呼麾下而謂之曰吾與若屬扞兹土方面將相不以吾為不省辱委之民社而民社所先者曰學校吾將用若屬力斯事其無乃以吾為厲巳乎皆曰斯盛舉也敢不唯命于是輸財運甓執斧操墁者奔走後先惟侯所欲為凡前人之所巳葺而不能不圯缺與未及修而在所不容巳者冝其緩急而次苐之內而禮殿論堂傍而兩廡齋舍外而櫺星學戟門與夫丹陽公洎后土氏之有祠采芹之有亭小大畢舉該費錢如干緡皆捐巳俸與學官無所與庀役如干工悉給軍伍而民不知擾工既訖功侯率同僚以時奠謁享獻有容師弟子貟教飬有所士民具瞻咸曰始侯為州將首繕州城以衛吾父兄令領邦伯又飾儒宫以教吾子弟侯有德于吾州甚厚盍有紀述以圗不朽乎乃伐石來徴文為記竊嘗觀春秋之法常事不書非常事而後大書特書屢書不一書之常熟在古為要荒之地在春秋為丹陽公言偃子遊之鄉在今為吳甸名邑凡郡縣通禮孔子而常熟由宋端平迄今廟學亦幾贋矣然承平之日海內晏安民無戰鬪之虞邑無桴鼓之警搢紳君子仕文學之里役易使之民其視今日為何如及天下兵興所在城邑為墟生民淪胥水火其幸而免者不鞠為魚肉足矣尚遑恤夫學校之廢興也哉矦起家武辨身擐甲胄手執干戈戮力與仇讐戰甃完城堡為國藩屏此其職也至于學校承平大夫尚或有所不暇而矦于多事之秋乃能不煩學官不勤民力親率師徒致力于此而完且速若是是非所當書者乎吾聞州之民有利學田而奪之者聞侯之風其必有興感者焉夫正其經界謹其出納使祭祀以時教飬有方此矦有繫于學者謹述之以示也他美政亦夥當委之載茟者兹不悉云守約齋記聖人之道髙矣逺矣七十子之徒學焉而僅得其一體曾氏之子專用心于內觀其言行之存于問答者殆以守約為本乎守約云者反而求諸巳之謂也夫為學而不知反而求之其不務為空虛髙逺者幾希太尉府掾史淮南姚君伯升以守約名其居南行臺治書侍御史周公伯溫既為篆其顔以余辱有一日之雅又俾文申其義豫以為聖人之道如天之髙也如日月之逺也三千之徒莫不峩冠裒衣濟焉將焉以並遊乎申夭之際日夜俯焉孜卒不過各得其一躰而曾氏之子在三千之徒獨以魯稱顧知以約自守悛焉以夜繼旦不敢少有騖髙忽近之心故一貫之旨卒用是而心領神會于一唯之頃然則守約云者曽氏之子所以學聖人之律令歟始吾辱與伯升遊逮今且十閲寒暑矣而其容貌之魁偉望之者知其為逺大君子也久而與之處則持心也謹而恪操已也卑而讓出詞也謙而退修已也果而鋭其反而求之于巳也益篤施之於事也益謙舉而措之于物也益恕所謂君子篤已之學或其庶矣乎嗚呼聖人不復作矣士生乎百世之下欲求聖人于百世之上舍曽氏之子吾無望焉然欲學曽氏之學者盍以守約為權衡姑用為記小丹丘記豫五世祖由永嘉徙台之臨海距城百里而逺臨海之山大率自天台支分綿綿延延若萬馬東奔而飲于海豫家實在焉豫蚤孤不逮事先君子甫兒時即有四方之役道過天台不復能記憶少長閲天下圖經所載始知天台為名山而豫家去山之逺近了不能隃度也豈惟山哉宗族姻黨親疏稚耊要亦不能盡悉鄉人有自東而西遊偶與之接者聲相勞苦乃或始知其疏戚逺近否則不相知者十七八豫少以貧賤役四方久居于吳婚娶于吳育子女于吳衣帛食稻于吳母沒葬于吳之壤㒒妾厮飬皆吳人盡室皆吳語而豫獨操越音于其間豫所處亦豈得巳乎哉羇旅四方食飲服御與吳人異者或鮮矣四方之人遂皆以吳人目之而豫老且仕不出吳境吾自視亦吳人而已乎今年春豫於所居西偏治廢圃可半畝即其中陋屋三數椽稍治葺之因扁曰小丹丘昔晉孫興公賦天台有曰仍羽人于丹丘後之人遂以丹丘為天台之別稱豫今扁之蓋猶有昔人不忘其土之意乎豫生於台台之戚姻少長不必親也豫長於四方而吳之家室子女不必疏也而治圃也何以丹丘為哉且豫五世祖家臨海而五世之上不必知也豫今居吳而後于豫者亦不必其知也凡人五世而親盡親盡則塗人而巳自豫以往未能為塗人則或猶用知者故豫于圃焉發之豫于圃不遑締搆之事屋上棟下宇皆仍舊稍加塗墍者豫所能也江湖好事者或持梧桐篠簜橘柚芭蕉薝蔔萱蘭之屬耒則雜藝于圃客自淮海遺以兩鶴甚潔白可玩同門友起居郎金華戴叔能善為古文詞豫求為之記而又自志云云者恐人不知豫非吳人而後之人不知吾為台之人故詞繁而不暇略爾墓志銘鄭國公并夫人合葬墓志銘公諱懋字德懋宋末避難通州因占籍焉父道榮贈參知政事榮陽郡公母王氏榮陽郡夫人公少負氣豪宕以信義稱于人妻夫人戴諱妙寧嚴重寡言執蠶織麻枲以奉祭祀賔客號盡婦道今吳王居鄉時公常從之遊夫人間竊視知其非凡謂其子元明曰此人豪也盍謹事之且為次子元紹求昏至正癸巳王舉義兵江淮間公首率元明等居麾下夫人內則綜家事給餉餽親製戰士之服窮晝夜不倦外則撫士卒如已子人皆樂為之用今江浙左丞吕公珍來自興化夫人見其俶儻因為公言公與語大恱即分授以兵使事楚國公俾居左右而屬任之無何公以疾卒秦郵之東郭年六十有四元明以兵事嚴藁葬海陵之茅山及師渡江元明等奉夫人居吳時年幾六十祁寒盛暑織絍不廢雖貴且富服御飲食如平時獨好施豫鄰里有不給者賑之恐後呼元明等誨之曰若等由布衣起畎畝遭遇非常克有今日吾聞之大丈夫所自許者忠與義耳爾苐盡力事上母曠乃職貽吾憂以至正甲辰正月得疾元明元紹朝夕侍湯藥弗違左右夫人力疾語之曰我疾殆無他若等受重寄勿以我故怠乃事也乙巳八月有司論功封爵公贈榮祿大夫淮南行中書省右丞追封鄭國公夫人封鄭國太夫人命下病已亟即呼元明等曰妻祔于夫禮也若父權厝淺土其將有待乎今仕于吳若等親則胏附任則股肱義不可去墓在泰非吾所以即安也我死必與若父合葬于吳此吾志也是年十月草五日卒于正寢享年六十有六子男十人長元明榮祿大夫江浙等處行中書省右丞兼同知樞密院事次元紹昭勇將軍江浙行樞密院判官餘皆先卒孫男十三人女六人元明等告遷公柩遵治命也𥘉夫人之卒也基赱弔焉右丞與院判奉其客樞密都事會稽薑漸之狀泣拜而言曰元明之先實宋魏王廷美十世孫宋亡避地通州當是時先祖年甫十三匿姓潘氏所因以為嗣戴亦宋宗室外孫元明等遭時多故未遑請於上復姓氏今不幸先夫人奄棄諸孤雖纍然齊絰不敢忍死去苫塊然合葬之命不敢忘也今謹奉先公之柩至矣卜以是年十一月甲申合葬于長洲縣習義鄉上苧之原幸吾子哀而銘之基觀自古豪傑舉事率不階尺土而妻勉其夫父勸其子卒以義氣相許與成大業兹因公夫婦父子而觀今之世豈偶然哉乃按狀為銘曰奕宋胄匿姓民間低佪草野備嘗艱艱提擕二季擇主而從曰有內助克昌厥宗子服戎行母躬蠶織以給餽餉以供矢石有來孔武視如已子曰惟二季無間兄弟天啓吳邦臣忠母貞生膺顯爵殁垂令名我作銘詩以告來裔上苧之原有崇弗替王處士墓志銘至正二十六年歲次丙午六月庚辰王處士卒于盤門之寓廬基蒲服赱就位哭弔王遣內史咨議某元禮典喪事越六日元禮以狀授豫為銘維夏五處士寢疾王命基走其門問狀時處士巳不能言顧侍旁老婢使億度欲言之意若曰臣幸老王土死無憾矣基以其言復王哀之即命善醫候疾今不幸由是不起而基官太史銘固其職不敢辭乃序而銘之處士諱鑑字明卿姓王氏世為真定晉州之安平人曽祖用祖彬考瑁台州寧海丞妣畢氏處士少侍父官江南遂隱居吳門娶李氏子男一人曰淳先草五年卒故今無子處士病且革以畢夫人弟之孫為後名繼善于是處士年七十有三矣王命有司買地吳縣靈巖鄉穔山之原葬之時七月丁酉也初江南內附中原士大夫多不樂仕南方寧海府君以將仕郎任吉安路安逺縣丞獨歎曰臣子豈可以卑小官憚逺涉而使逺人不蒙朝廷之惠乎即馳至縣縣入爭裒金銀以獻府君謝不受召其人慰遣之三年遷平江吳縣尹以善理民著稱未幾會京部以前除州縣官多躐等著令咸降二等府君巳受七品秩因改授將仕佐郎徽州路休寧縣主簿遭母喪時丁憂未著令君曰吾于母而不盡吾情何以教民乎即解官持服去服闋轉登仕郎台州寧海縣丞治行如在吳縣時府君年未五十即謝事居吳時天下承平南服無事四方衣冠皆樂居吳中處士日侍府君左右入則躬定省職溫清出則從搢紳諸老講經義為文詞俊邁機警為同輩所推服及基遊吳時處士年已五十餘議論風采髙明倜儻朋友過門無少長皆樂與傾盡家貧無甔石之儲應門獨一老婢客至輒扣鄰家門問酒酒至輒對客劇飲酒盡再謀雅善談論然不及時事亦未始以一毫私已事干人如此者終其身處士少與弟鈞同學于燕至順改元鈞舉進士及第終沈丘縣尹府君以鈞貴追贈從仕郎真定路安平縣尹妣畢氏封宜人處士遁迹江湖隱德彌耀中外論薦前後章皆不報處士平生博學為文章多不留稿特􅋢唐人近體詩時有所賦詠皆平實沉毅如其為人晚年貧益甚莭益堅閉門獨居足迹不出門者二十年晏如也王初入吳獨求處士之廬而訪之處士與言皆仁義為得民心之本甚嘉納焉嘗語人曰王處士吾友也故其卒之日用深悼之且曰王處士以節義髙天下然貧無以為喪凡送葬恤家有司悉任之嗚呼此處士之所以髙天下也是宜銘曰鳴呼處士受材孔良出言允臧遇興廟廊而不膺棟梁懷璧而藏嗚呼其可傷傳傳古民傳傅古民者金華人也善方數尤邃針術里中長者如故侍講黃公最慎許可顧折節與古民善在朝與公卿言輒稱道古民古民亦雅欲逰京師行至毗陵會公請老歸江南古民亦弗果行遂以醫知名蘇常間倫輩因往往推重古民遇竒疾必引與參決每議論出入靈樞太素言無所讓人用益多之初古民至會稽見老翁病僂伏行市中甚苦群兒聚觀狎笑之古民惻然曰此所謂戚施不能仰者也顧蒼頭耴針砭視其俞刺之有頃翁徐起信背掉臂挺然以去若無所甚苦者時宣城貢公泰甫為郡理官聞而異之已而貢女之子病風搦亟迎視之古民曰此客熱干正氣法當􅌊以散之用其言而愈去年冬豫婦有疾候古民疹之曰此胃口蓄熱故病脾痛善嘔而食不下噎炙中脘砭上脘尋交􅌊以輔瀉之時方雨雪或難之古民曰此拘士之論逹者不耴也由是病旋已古民療疾多竒驗類此古民性簡直不苟合至用其術鮮或能過之也夷白子曰宋南渡時金華傅氏聚族數百口緦服同㸑世稱為義門國初有以嵊縣尹致仕與里人王鏡潭俱淂針法于故竇文正公者蓋古民之先大父也王氏有子亦克世其業然論五診乃適度量規矩權衡繩墨以別百病傅氏尤有所授云夷白齋稿輔遺
