front:
  text: 夷白齋藁卷之三
  hash: sha256:02f8c909bf0be30341a99e5f5a0633fd9ed7ae1f0425f4f06b0d34ddad636f1b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_003-1a}
body:
  text: 臨海陳基著金華戴良編古詩五言彂吳門少壯不解武衰老却從軍將相北出師部伍各駿奔伐鼓震城闕樹羽隱秋旻水師歘龍驤鐵騎紛雲屯軍容亦已肅士氣悉欲伸載詠東山什感激為逡巡顧余麋鹿姿辱參羆虎群頺然介胄間見此逢掖臣微祿不逮養匪材胡足珍驅馳寵辱途俯仰愧君親秋風吹海濤落木滿江津去去勿踟蹰浩歌天宇新大江夏后道九川江源起西極想當疏鑿際毫髮無遺力奔流赴東海吐納潮與汐萬古天塹雄洶湧限南北時秋八月望煙霧四開闢皓月麗中天華星列東壁俯擊亂流楫仰送搏風翮眼空牛渚舟氣傲南樓席平生臨深戒所至每兢惕此夕獨踈狂四顧無與敵風伯引輕帆百怪皆辟易前瞻狼五山亭亭倚秋碧狼山狼山一何竒崛起大江滸橫截捍奔濤離列成四五人言秦皇帝鞭石走中土意𣣔跨東溟候彼神仙侣此石乃其遺為山􅌂狼顧斯事雖云誕傳説自前古我疑融結𥘉磅薄元氣聚地脈引東南歘吸不可覩層顛屹浮屠下瞰吳岫雨行行入淮甸此勝無與伍通州渡江潮始平入港濤巳落泊舟狼山下逺望通州郭前行二舍餘四野何漠漠近郭三五家慘淡帶藜藿到州日停午餘暑秋更虐市井復喧囂民風雜南朔地雖江海裔俗有魚鹽樂如何墟里間生事𣸪蕭索原隰廢不治城邑斳可託良由兵興久羽檄日交錯水陸飛芻粟舟車互聮絡生者負戈矛死者棄溝壑雖有老弱存不足躬錢鏄我軍實王師耕戰冝並作惟仁能養民惟善能去惡上官非不明下吏或罔覺每觀理亂原愧乏匡濟略撫事一興慨悲風􅏒寥廓如臯縣曉行過如臯草露凄已白井邑無人煙原野有秋色緇褐兩三人牢落徒四壁侣訝官軍至拱立衢路側伊昔淮海陬土俗勤稼穡潟滷盡桑麻閭閻皆貨殖及兹值兵燹道路紛荆棘十室九逃亡一顧三嘆息王師重拯亂主將加隱惻戒吏剪蒿菜分曺理鹽䇲眷眷恤瘡痍遲遲歷阡陌上天合助順九土期載闢白首忝戎行臨風增感激海安淮海水為利轉運有常程積渠如積金守防如守城近聞渠堤壞水決劇建瓴我軍賴神速􅓍力障頺傾舊防幸已復新備亦冝興古人重舉衆日費千金并剋敵務因糧足邉資力耕矧兹淮甸間沃野冨吳荆草菜日加闢餽餉嵗彌增勿使土遺利坐令儲偫贏東南力可舒根夲計非輕𣣔弘中興業新事力當行陋儒無長算觸物有深情冉冉趨畏塗戚戚慎宵證爛泥洪猛虎尚可摶蛟龍亦易屠惟有爛泥洪蚊虻天下無蚊觜甚蠍螫虻聲殷雷如壯士不敢觸觸者無完膚一齧使筋露載齧令骨枯牛馬齧盡死矧兹氓者軀造物仁萬類稔此獨奚需得非庶草蕃變化劇蚍蜉譬如蟣與虱所貴日􅐡梳否則必滋蔓蔓草古難圗我𣣔訴真宰憤切擬􅊶胥上帝必震怒下令致天誅蓐收將中軍風伯為前驅一鼓清八極斯醜諒安逋尓虻法必殱尓洪理難瀦聽氓秉耒耨庶草悉誅鋤要令衆蚋都化為粳稻區作貢奉明祀庶足報錙銖泰州吳陵古名邦利盡揚州域奮城雖丘墟新城如鐵石昔為魚鹽聚今為用武國地經百戰餘士耻一夫敵征人還舊鄉下馬問親戚蹢躅慨蒿藜徘徊認阡陌桓桓霍將軍出入光百辟位重言益卑㓛髙志彌抑誓𣣔報仇讎不肯懷第宅人羡過家榮驚喜爭太息白日照旌旗閭里有顔色皓首太玄經雖勤竟何益上樂夕次泰州郭朝行上樂里密雨灑兼葭秋風落菰米頤聞承平際魚鹽賤如水簫鼓樂叢祠謳歌動成市中原正格鬪擊柝聞四鄙官道日榛蕪生人等螻蟻依依煙際舟兩兩舟中子來注賣魚蝦出入官軍裹生長離亂間不識紈與綺失喜見王師𬒳服多華靡買物不論錢僕僕更拜起何當罷戰伐萬國收戎壘山河歸帶礪車書復文軌有地盡蠶桑無人不冠履腐儒亦何需歸山守松梓擊壤盡餘年此樂無窮已令丁鎮水路轉下樂逺赴令丁鎮落日淡平蕪荒村帶寒磷平時冨魚稻稅薄民不困蓮芡亦時豐足以禦飢饉江湖歲或艱老弱行蠢蠢相携􅈬淮食不得辭逺近四野今盡荒百畒無一墾鞠為鳬鴈區無復限封畛師行輜重隨士飽筋力奮經費固有常變通亦冝論吾聞古賢將羊陸開吳晉食足邉備多髙標邈千仞務子角頻嵗事行邁敢辭筋力衰官軍渡淮海父老迓旌旗騎士盡貙􅍑舟師皆水犀踴躍趨敵埸謳歌雜華夷行行務子角所過悉瘡痍草木未黃落風露已凄其僕夫跽謂我歲暮寒無衣故鄉日以逺道路日崎嶇我方戒徒侣師行有程期貴賤皆形役遑敢恤其私賴有同𫀆彥議論各瓌竒有酒即共飲聊𣸪慰羇離髙郵秦郵水為國層城髙鬱鬱三面阻重湖深湟中蕩潏常憐秦太虛材兼文武術慷慨談孫吳議論每竒崛遨逰二蘇間文采尤駿彂平生英邁風想像見倣佛顧余亦何知僶俯從戰伐歲晚過其鄉徘徊為終日憶昔元祐際中國久寧謐二虜獨猖狂公心常憤切中原屬塗炭四野多白骨使公當此時豈惜焦毛髮秋風次淮甸征騎四馳突九原不可作悲歌暮蕭瑟寶應縣秋風日蕭颼百草各憔悴零露泣寒螿客子心𣣔碎寶應古名邑喪亂生聚廢市井皆官軍道路盡蕭艾主將行邉鄙遺民望旌斾共碩早休兵還鄉供負米述老嫗語歲暮􅍱淮海不辭行路難從軍豈不樂即事每長嘆老嫗八十餘日晡未朝餐自云遭亂離零落途路間豈無子與孫充軍皆不還男戰陷賊壘孫存隔河山數月無消息安能顧飢寒語畢雙淚垂使我心悲酸上天未悔祻豺􅍑方搆患近聞山東變世路𣸪多端悠悠顛沛人何時即平安淮安此邦惟椘州水陸居四逹因淮以為塹天險不可忽昔聞里中人㓛蓋天下傑能受市見辱羞與絳灌列常憐躡足際事與追亡别赱鹿既已擒狡兔安足恤疾風吹空郊露下芳草歇行過寄食地尚想還鄉日王孫迹已陳漂母名未滅遙望濟岱間風塵正騷屑九日從陳醫師所寓得甘井課童子分汲世亂逺為客迢迢淮海濵空城百戰餘多非舊人民十井無一甘憂心渴生塵蕭條值九日無酒亦無親偶過同宗友欵笑意何真為我修茗事芳潔無與鄰一啜喉吻潤再啜肺腑新三啜衆體平四啜百慮伸連啜至五六髙談如有神吾宗和緩流豈遇蘇耽倫得非上池水沾丐及時人呼童抱瓶盎赱汲勿辭勤飢餐及渴飲它井棄勿論澤我枯稿容滋我衰病身沃我冰炭腸餘潤及朋賔古人飲菊水其夀及千春今余遇菊日飲此樂欣欣裁詩謝宗友勿以叨見嗔傷菊終歲事行役所歷厭蒿蓬偶過衛子廬庭有幽菊叢淮海風日髙秋葩粲黃中擺落凡近態綽有靖者風自負文人行肯為兒女容卓然搖落際見兹群卉雄是時嵗將晏不意有此逢繾綣去復廽眷若情愛鍾衛子屬它適我亦闕過從屋廬既易主庭菊廢無蹤鞠為雞豕區腥穢産蛆蠱我聞長太息扼腕為忡忡尓菊雖植物正色映霜空氣含逸世韻力著扶衰㓛託根君子庭誓言期始終中道或改度殘賊遘貞凶物理有屈伸世故無終窮悲傷亦何益極目送飛鴻夷白齋藁卷之三
