front:
  text: 夷白齋藁卷之三
  hash: sha256:02f8c909bf0be30341a99e5f5a0633fd9ed7ae1f0425f4f06b0d34ddad636f1b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_003-1a}
body:
  text: 臨海陳基著金華戴良編古詩五言彂吳門少壮不觧武衰老却從軍将相北出師部伍各駿奔伐鼓震城闕樹羽隐秋旻水師歘龍驤銕騎紛雲屯軍容亦已肅士氣悉欲伸載詠東山什感激為逡廵頋余麋鹿姿辱叅羆虎群頺然介胄間見此逢掖臣微禄不逮養匪材胡足珎驅馳寵辱途俯仰媿君親秋風吹海濤落木滿江津去去勿踟蹰浩謌天宇新大江夏后道九川江源𧺫西極想當䟽鑿際毫髮無遺力奔流赴東海吐納潮與汐萬古天塹雄洶湧限南北時秋八月望烟霧四開闢皓月麗中天華星列東壁俯撃亂流檝仰送搏風翮眼空牛渚舟氣傲南樓席平生臨深戒所至每兢惕此夕獨踈狂四頋無與敵風伯引輕帆百怪皆辟易前瞻狼五山亭亭倚秋碧狼山狼山一何竒崛𧺫大江滸横截捍奔濤離列成四五人言秦皇帝鞭石走中土意𣣔跨東溟候彼神僊侣此石乃其遺為山􅌂狼頋斯事雖云誕傳說自前古我疑融結𥘉磅薄元氣聚地脉引東南歘吸不可覩層顛屹浮屠下瞰呉岫雨行行入淮甸此勝無與伍通州渡江潮始平入港濤巳落泊舟狼山下逺望通州郭前行二舎餘四野何漠漠近郭三五家慘澹帶藜藿到州日停午餘暑秋更虐市井復喧囂民風雜南朔地雖江海裔俗有魚塩樂如何墟里間生事𣸪蕭索原隰廢不治城邑斳可託良由兵興乆羽檄日交錯水陸飛芻粟舟車互聮絡生者負戈矛死者棄溝壑雖有老弱存不足躬錢鏄我軍寔王師畊戰冝並作惟仁能養民惟善能去惡上官非不明下吏㦯㒺覺每觀理亂原媿乏匡濟略撫事一興慨悲風􅏒寥廓如臯縣曉行過如臯草露凄已白井邑無人烟原野有秋色緇褐兩三人牢落徒四壁侣訝官軍至拱立衢路側伊昔淮海陬土俗勤稼穡潟滷盡桒麻閭閻皆貨殖及兹值兵燹道路紛荆棘十室九逃亡一頋三嘆息王師重拯亂主将加隐惻戒吏剪蒿菜分曺理塩䇲眷眷恤瘡痍遲遲歴阡陌上天合助順九土期載闢白首忝戎行臨風増感激海安淮海水為利轉運有常程積渠如積金守防如守城近聞渠堤壊水决劇建瓴我軍頼神速􅓍力障頺傾舊防幸已復新備亦冝興古人重舉衆日費千金并剋敵務囙糧足邉資力畊矧兹淮甸間沃野冨吴荆草菜日加闢餽饟嵗弥増勿使土遺利坐令儲偫贏東南力可舒根夲計非輕𣣔弘中興業新事力當行陋儒無長筭觸物有深情冉冉趋畏塗戚戚慎宵证爛泥洪猛虎尚可摶蛟龍亦易屠惟有爛泥洪蟁蝱天下無蟁觜甚蠍螫蝱聲殷雷如壮士不敢觸觸者無完膚一齧使筋露載齧令骨枯牛馬齧盡死矧兹甿者軀造物仁萬類稔此獨奚需得非庶草蕃變化劇蚍蜉譬如蟣與虱所貴日􅐡梳否則必滋蔓蔓草古難圗我𣣔訴真宰憤切擬􅊶胥上帝必震怒下令致天誅蓐収将中軍風伯為前驅一鼓清八極斯醜諒安逋尓蝱法必殱尓洪理難瀦聽甿秉耒耨庶草悉誅鋤要令衆蜹都化為秔稻區作貢奉明祀庶足報錙銖泰州吳陵古名邦利盡揚州域奮城雖丘墟新城如銕石昔為魚塩聚今為用武國地經百戦餘士耻一夫敵征人還舊郷下馬問親戚蹢躅慨蒿藜徘徊認阡陌桓桓霍将軍出入光百辟位重言益卑㓛髙志彌抑誓𣣔報仇讎不肯懐第宅人羡過家榮驚喜争太息白日照旌旗閭里有顔色皓首太玄經雖勤竟何益上樂夕次泰州郭朝行上樂里宻雨灑兼葭秋風落菰米頣聞承平際魚塩賤如水簫鼓樂叢祠謳謌動成市中原正格闘擊柝聞四鄙官道日榛蕪生人䓁螻蟻依依烟際舟两两舟中子来注賣魚蝦出入官軍裹生長離亂間不識紈與綺失喜見王師𬒳服多華靡買物不論錢僕僕更拜𧺫何當罷戦伐萬國収戎壘山河歸帶礪車書復文軌有地盡蚕桒無人不冠履腐儒亦何需歸山守松梓撃壌盡餘年此樂無竆已令丁鎮水路轉下樂逺赴令丁鎮落日淡平蕪荒村帶寒燐平時冨魚稲稅薄民不困蓮芡亦時豐足以禦饑饉江湖歲或艱老弱行蠢蠢相携􅈬淮食不得辞逺近四野今盡荒百畒無一墾鞠為鳬鴈區無復限封畛師行輜重随士飽筋力奮經費固有常變通亦冝論吾聞古賢将羊陸開吳晉食足邉備多髙標邈千仞務子角頻嵗事行邁敢辞筋力衰官軍渡淮海父老迓旌旗騎士盡貙􅍑舟師皆水犀踴躍趋敵埸謳謌雜華夷行行務子角所過悉瘡痍草木未黄落風露已凄其僕夫跽謂我歲暮寒無衣故郷日以逺道路日崎嶇我方戒徒侣師行有程期貴賤皆形役遑敢恤其私頼有同𫀆彦議論各瓌竒有酒即共飲聊𣸪慰覉離髙郵秦郵水為國層城髙欝欝三面阻重湖深湟中蕩潏常憐秦太虚材兼文武術慷慨談孫吳議論每竒崛遨逰二蘇間文采尤駿彂平生英邁風想像見彷彿頋余亦何知僶俛從戦伐歲晚過其郷徘徊為終日憶昔元祐際中國乆寜謐二虜獨猖狂公心常憤切中原属塗炭四野多白骨使公當此時豈惜焦毛髮秋風次淮甸征騎四馳突九原不可作悲謌暮蕭瑟寳應縣秋風日蕭颼百草各顦顇零露泣寒螿客子心𣣔碎寳應古名邑丧亂生聚廢市井皆官軍道路盡蕭艾主将行邉鄙遺民望旌斾共碩早休兵還郷供負米述老嫗語歲暮􅍱淮海不辭行路難從軍豈不樂即事每長嘆老嫗八十餘日晡未朝湌自云遭亂離零落途路間豈無子與孫充軍皆不還男戦䧟賊壘孫存隔河山數月無消息安能頋飢寒語畢雙淚垂使我心悲酸上天未悔祻豺􅍑方搆患近聞山東變世路𣸪多端悠悠顛沛人何時即平安淮安此邦惟椘州水陸居四逹囙淮以爲塹天險不可忽昔聞里中人㓛盖天下傑能受市見辱羞與絳灌列常憐躡足際事與追亡别赱鹿既已擒狡兔安足恤疾風吹空郊露下芳草歇行過寄食地尚想還郷日王孫迹已陳漂母名未㓕遥望濟岱間風塵正騷屑九日從陳醫師所寓得甘井課童子分汲世亂逺爲客迢迢淮海濵空城百戦餘多非舊人民十井無一甘憂心渇生塵蕭條值九日無酒亦無親偶過同宗友欵咲意何真為我脩茗事芳㓗無與隣一啜喉吻潤再啜肺腑新三啜衆體平四啜百慮伸連啜至五六髙談如有神吾宗和緩流豈遇蘇耽倫得非上池水沾丐及時人呼童抱瓶盎赱汲勿辭勤飢飡及渇飲它井棄勿論澤我枯槁容滋我衰病身沃我冰炭腸餘潤及朋賔古人飲菊水其夀及千春今余遇菊日飲此樂欣欣裁詩謝宗友勿以饕見嗔傷菊終歲事行役所歴厭蒿蓬偶過衛子廬庭有幽菊叢淮海風日髙秋葩粲黄中擺落凡近態綽有靖者風自負文人行肯為児女容卓然揺落際見兹群卉雄是時嵗将晏不意有此逢繾綣去復廽眷若情愛鍾衛子属它適我亦闕過從屋廬既易主庭菊廢無蹤鞠為雞豕區腥穢産蛆蠱我聞長太息扼腕為忡忡尓菊雖植物正色映霜空氣含逸世韵力著扶衰㓛託根君子庭誓言期始終中道或改度殘賊遘貞㓙物理有屈伸世故無终窮悲傷亦何益極目送飛鴻夷白齋藁卷之三
