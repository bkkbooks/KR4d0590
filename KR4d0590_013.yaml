front:
  text: 夷白齋藁卷之十三
  hash: sha256:b1b40765d7a32826121493a92fd2f47dad8d9386d5e2e67985dd89c37a47a4f0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_013-1a}
body:
  text: 臨海陳基著金華戴良編序逰虎丘圖詩序至正十年秋翰林待制宣城貢公泰甫使江南眀年春使還過吳而聞國子司業之命遂避傳舍寓白鶴之真館不終日而吳之大夫君子修容于下執事者冠蓋相屬于暮之春風日柔暢相與登海湧峰俯劒池坐生公之臺據小吳之軒覽長洲之故苑撫姑蘇之臺榭而瑶林緑甸川魚雲鳥之出沒飛動者皆在欄楯之下于是却匏竹進翰墨酣歌淋漓竟夕忘返公既屬睢陽朱澤民氏筆之為圖復用澤民壁間舊題五言四韻為詩以倡之而苕溪郯九成沈自誠新安胡茂深赤城鄭蒙泉公之壻張士恭甥阮文鋭余伯氏敬德咸屬和焉揔凡若干首尋以首簡授余曰子冝為序公以經濟之學為天子顧問之臣雄文碩望師表儒林海內之士仰喬嶽瞻景星之曰久矣吾黨徒用區區文藝乃得接餘論于山水間不亦盛乎且會合之不可常昔之人蓋有當歡而悲者矣今環橋門而望公者殆百榖之于甘雨也吾徒未能脫鱗介生羽翰又安得久從公遊乎雖然唐楊少尹之歸自朝廷也好事者誇其餞之盛謂其繪以為圖而當時君子又嘉其去就類漢兩疏作為文章榮耀千載今公之司業成均楊少尹之職也而其功名事業人且望其等兩疏而上之則異日請老而歸也尚能從君于某丘某水以觀都門祖張之圖而為公賦之也至正十一年夏四月朔旦序玉山名勝集序中吳多宴遊之勝而顧君仲瑛之玉山佳處其一也顧氏自辟疆以來好治園池而仲瑛又以能詩好禮樂與四方賢士大夫遊其涼臺燠館華軒美榭卉木秀而雲日幽皆足以彂人之才趣故其大篇小章曰文曰詩間見曽出而凡氣序之推遷品彚之回薄晴晦明之變幻叵測悉牢籠摹狀于更倡迭和之頃雖復體製不同風格異致然皆如文繒貝錦各出機杼無不純麗瑩縟酷令人愛仲瑛既會稡成卷名之曰玉山名勝集復徴余文以為序夫世之寄情山水間者多矣然好事者于昔人别墅獨喜稱王氏之輞川杜氏之樊川豈非以當時物象見于倡酬者厯厯在人耳目乎然輞川賔客獨稱裴迪而樊上翁則不過時召昵密往逰而已今仲瑛以世族貴介雅有器局不屑于進取而力之所及獨喜與賢士大夫盡其歡而其操觚弄翰觴詠于此視樊上翁蓋不多讓而賔客倡酬之盛較之輞川或者過焉嗟乎後之視今亦猶今之視昔使異曰玉山之勝與兩川别墅並存于文字間則斯集也詎可少哉于是乎言送黃德廣序余與黃君德廣同以東州之人逰中吳山水間吳之大澤曰具區周回五百里灝溔潢漾混無端倪而其山則洞庭夫椒靈巖天平之屬髙卑俯仰為態不一而皆出沒掩映乎其上朝光暮景與雲物爭變化蓋東南之竒觀也吳為郡物盛人衆賦夥而訟繁凡隸其土者率鞠躬盡瘁不遑夙雖有好事者亦不能輟餘晷而樂山水也四方之道吳者冠蓋相屬然非北之燕薊則南適閩越又孰能齎糗糧以事無益之逰乎故窮吳中山水之勝自非卑間無事如吾兩人則舉莫之能也余嘗與德廣泛舟過梅里登海虞出三江之口顧瞻山川之蒼茫俯仰千載于須臾而聖賢之遺迹厯厯可考也蓋江湖之間厥土塗泥踵行喙息之民罷耒耜而給餉餽恆弊弊以終日則吾兩人之適非惟其賔客者不能雖其父兄子弟亦不暇以為也人常苦于貧賤而吾乃以賤貧得自肆于山水而德廣固非久貧且賤者也今年秋德廣有力者為之先將脫鱗介生羽翰去我而弗顧也噫向也舉吳之人不得為吾兩人之遊今也非惟吾不能強德廣而留之德廣雖欲為吾留不可也然則出處離合非惟吾兩人不能自知雖古之君子亦不能必也德廣行矣余將入山益深入林益密他日德廣以其抱負有所遇而歸或者不忘而欲求余于藜藋之下則以是為之旌矣因書以貺之送丁經歷序吳在禹貢揚州之域其藪則具區土地塗泥而田則下下也吳之土不如雍州之黃壤其田不及豫州之中上而其賦視梁州乃在下之上者徒以人工修之而其水淺土薄固自與中州大不侔也庸詎知古今殊時風氣異冝塗泥之土貢倍于黃壤下下之田賦浮于上上而人之工果足以勝地力哉夫息人工以飬人善為國者也窮地力以害人賊夫國者也吳之不愛其工以奉上也久矣而其害有若長蕩華蕩之屬積水為陂激風濤黿鼉蛟螭率醜類居之卵育子孫以専其利使神農執未后稷秉耜亦末如之何而有司什一之征歲有常算驅民于不測之淵為之上者縮手弗顧而經歷丁君獨閔然思有以極之推是心也其殆古之所謂遺愛乎𥘉君之至吳也民有歌者曰吳之土兮淖而卑吳之田兮淪為湖陂我田于湖兮官剝我肌昔神禹兮手駢足躓將以厚吾之生兮今反病之我欲上訴兮天不可躋我欲淪死兮不忍子與妻吁嗟儂兮何以生為君聞之曰有是哉吾聞苛政猛于虎此非虎之尤者乎夫使田野無愁歎之聲二千石之職也今吾來佐長吏布恩澤而民困若是將何以上報天子乃獨疏其事上之巳而上詔郡國除民所疾苦而吾獨賴君之言有所休息又歌曰原則有黍水則有魚昔云不足今乃有餘隰則有粳水則有魴人言之臧我以為慶又胡可忘于是皆以君為長者而吳猶有泰伯仲雍之遺民焉于君之代而歸也書以志吳人之意至正十一年九月甲子送劉志伊序山川之秀鍾于物者為珠玉鍾於人者為文章然求玉者必于昆崘流沙萬里之外求珠者必于南海蛟龍不測之淵不如是則無以擇其精而致其多而文章在天地間尤難精而不易得者也三代而降文章與時髙下而秦漢魏晉唐宋之文見于文選文粹文鑑者後人即其成書上下千數百年以觀其制作之變而不知當時采托之精有不易以歲月計也然則搜羅纂述以為一代人文之乘而欲與前代之成書並存不廢而不之乎文章之昆崘作者之南海求之而能盡大觀而無憾也難矣國家以三光五嶽混一之氣涵煦六合而百年文物之盛著于文類者亦可以概見然夜光之璧照乘之珠縱不橫委于道亦豈無待賈而未售者此冝春劉君志伊所以北赱亰師南浮江淮上而朝廷之著作下而山林之論述兼儲並録日益月增如猗頓之于貨不埓富于王公不已也噫志伊之用心亦勤巳哉然尚勿為鄭人買櫝而還珠亦勿為魏人之以玉為石而棄之則所得誠精且多矣于其歸也序以贈之橫山紀行詩序吳郡沈仲説甫由長洲先塋鼓拖而西出胥門過石湖省母夫人之墓于橫山之陽道路所厯輒顧瞻哀慕而其低佪窹歎之形諸言者皆成韻語時余辱與同載間亦有所賦其甥吕彥貞悉手録之揔若干首夫吟詠情性莫過於詩然三百篇皆夲性情而尤感人者無如蓼莪蓋父母之德昊天罔極人子蒸蒸色飬尚不足以報其萬一而况乎不得終飬者其心為何如此君子所以三復流涕而不忍讀之也今仲説天性醇孝篤學好問而又邅時太平克承世澤其視􅖋莪之時不侔矣然而既怙且恃以鞠拊畜育者仲説皆蚤失之而其顧焉復焉腹焉者獨賴祖母之存今亦已矣雖𣸪生事死葬無或遺憾而仲説豈忍一日忘其親哉是以顧冡舍于長洲踐雨露于橫山仰天宇之澄鮮撫原野之夷曠而風木寒泉之感見于銜恤茹哀者雖欲不為詩不可也嗚呼之為用在于成孝敬厚人倫彼百煆為字千錬成句勤則勤矣于情性何有哉昔孫興公賦詩以伸罔極之痛識者謂有􅖋莪之遺思焉而歐陽叔弼居憂君子蓋有督其作詩者余雖非識者仲説固興公之徒歟世有君子如蘇長公則仲説賢于叔弼矣余既因彥貞所録用崔正言紀行詩體編彚之又喜仲説所作夲于性情于是乎書送粹上人詩序粹上人由天台絶海泝江歷參浙水西諸名山而雅喜與賢士大夫逰聲稱藉甚余嘗見其風神秀朗如寒潭秋月進退作止修整間暇固已私竊異之矣久之將還山讀書密邇親舍庶幾朝夕以報顧復之恩其徒不能奪之也榗紳先生聞其行爭為歌詩以偉之以余辱與上人交俾為之序昔之知言君子謂浮圖氏之書過于莊墨申韓而與易論語合余嘗竊疑之及觀其大報恩諸篇則其教人率先孝敬乃知世之論佛類以其怪幻訑慢而其徒好略文字以為髙去孝敬以為逹者皆過也今上人學禪而不略文字為釋而知孝且敬又將歸而益求其所以與易論語合以充其大報恩云者蓋五常之道不二之法未始不本于人心茍究其歸雖同其中而異其外可也上人勉乎哉庸敢敘贈詩者之意書之首簡以授之夷白齋藁卷之十三
