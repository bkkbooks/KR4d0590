front:
  text: 夷白齋藁卷之三十四
  hash: sha256:7948ac5d2b6ca13635824bd2f8fd877639a3d8b4f39e56a024f70b3931791179
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_034-1a}
body:
  text: 臨海陳基著金華戴良編傳湯婆傳湯婆者臨賀人也其先妵錫氏世傳當殷時嘗媵有莘氏與伊尹鼎爼同事湯因更以湯為氏周成王時太公立九府圜法其族有配金父之長男為適婦者嘗得異術于上清童子夫婦俱衣五銖服以通于神眀最為世所貴後漢有錫光者蓋其苗裔也子孫生産桂陽山谷間往往出而效用于世日煆月煉大小方圜惟人意所欲以故皆器重之獨􅊞婆之業者不問貴賤至今猶妵湯或曰上世以湯泉郡為其湯沐邑故以地為氏然不可考婆銀色而鉛質皤腹縮項體肥白如瓠􅒏淡泊不嗜黍稷五味每祈寒獨好飲熱水飲畢即屏氣默默擁𬒳就床蓐鰥寡老人見其溫燠寡言率喜親習之最善煦嫗人足足抵之盎然如春故又號之曰腳婆云旦日開喙倒腹罄所有為人傾寫輒見肺腑無隱惟不喜近年少人雅有度量絶口不言人過歲且夏竹夫人擅寵輒虛心退避廢處靜室無幾微不滿意或有叩之者婆曰吾誓與人共歲寒彼以涼德側媚一時縱得幸如晚莭何卒不與之較其不忮有容類如此贊曰湯氏之先昉見于殷周之際尚矣婆稟中和之德潔已事人能視時為進退世態炎涼不一動其心殆所謂厚施不食其報者非耶其視鴟夷徒用區區酒德見稱于楊子雲氏有間矣周處士傳周處士名允成字允叔吳人也元貞𥘉從其父逰武林寓公毛宣慰素軒見而器重之延為其子師嘗讀法家書慨然有用世志以夙病足不良于行遂浮湛里閈晚復好佛老氏之説日與鄉社耆年者遊人因以靜樂處士稱之吳中子弟以律學受指畫者皆傳以古義其或舞知為深文見利乾沒不顧事是非陷人于不測者則必痛絶之子弟改乃許雅重然諾為人謀必忠最喜揚人之善不善亦不能茍容鄉人有為不韙者必相戒曰慎勿使周處士知也諸有爭訟曲直就處士質之必極陳利害以諭之往往有感窹者故其居雖湫隘户外之屨恆滿焉處士蚤孤家素貧常所往來者有所饋遺亦視義而後受獨喜赴人之急顧已力不逮則以告鄉之好義者然未始以一毫私已事干人人用是益多之咸相謂曰周處士無儋石之儲而有髙世之行奉母氏八十餘而終無間言孝也事寡嫂三十餘年有禮弟子也送兄姊妹若干喪義也撫兄子如己子慈也今年愈髙家愈貧身後之責獨不在吾黨乎乃爭以錢買地長洲豫營夀藏處士聞之顧謂子壻曰諸君子以吾為贅世翁耶生且不知吾之有我死又遑恤其它然業己辱諸君子髙義乃以勝曰持酒共飲其上嘯歌竟日人又咸服其逹云贊曰太史公云法家嚴而少恩周處士法家者流顧廩廩有長者風士固有墨名而儒行者其處士之謂歟史孝子傳史孝子者名𢡟祖字時可鄞人也宋丞相忠㝎越王諱七世孫朝請郎知賀州諱齊卿之曽孫修職郎紹興府新昌縣主薄諱賀孫之孫主簿生五子而𢡟祖則其次子公麟之子也公麟娶越餘姚趙氏久無子因禱焉已而有娠生懋祖甫三歲而趙氏卒未幾父亦卒祖庶母莫氏與兩叔公燾公秀及懋祖二妹獨存𥘉主簿有田八千畞為錢唐浮屠所侵主簿與公麟相繼訴官不能直家用益落至莫氏復携公燾公秀與𢡟祖二妹訴江浙行中書益僒不能歸乃棄懋祖及二妹于人懋祖再轉為時貴家奴方髫稚即能知其世家而痛其孤窮少長服勤所事惟謹歲往來朔漠備嘗勞苦時貴亦用是善遇之每獨思其親輒嗚咽泣下至夜率淚漬其枕如是者十有七年時貴以罪廢懋祖因得放還江南莫氏洎公燾公秀尚無恙家徒四壁勢不自存懋祖盡鬻衣裝竭力為養父骨殯僧廬四十年至是始買山營葬葬之曰泣血如𥘉喪莫氏俄傷足病卧床蓐晝夜呻吟不絶聲懋祖扶持醫療數月乃愈尋又仆于火體糜潰者殆半復侍療如𥘉踰半載而瘥莫氏因歔欷感歎且曰吾愧弗能撫若之幼庸詎知垂老顧得若力乎懋祖聞之孝敬愈篤懋祖自念賴祖父之靈復見鄉里親戚而所恃以奉蒸嘗者惟田爾田不復祖父之志未信也乃奮力與浮屠爭于官史氏素畏憚浮屠之勢無敢助懋祖者會捴管范公察其實悉斷歸之懋祖得田即以班諸叔弟其有失身為浮屠氏者命反𥘉服擇良家子配之公燾公秀莫氏物故獨身任其責喪祭各盡禮閨門雍睦子亦克肖云贊曰至元間金華人俞器之年十六𬒳兵虜至北方公卿大夫哀其儒家子及長用薦者得官越十有九年歸為諸暨州判官至家則親戚無在者內翰黃公為布衣時實為之傳史懋祖以忠㝎越王之後焭焭孤稚轉為人奴其隱忍困窮有甚于器之者其歸雖不能得官然及事其祖庶母二叔買山葬其父以孝子稱嗟乎陵谷變遷世家子孫困踣流落者何限其能生還故鄉振復先業如懋祖者蓋求十一于千百也君子曰人不􅍱難則智不眀吾于史懋祖俞器之尤信沈母傳沈母姓徐氏名淑清字貞子世為湖州武康下渚里人至元間父昌徙城迎春里生貞子少長躬織紝組繡以事父母父母篤愛之許納同郡烏程沈氏子文名之為壻未幾母閔疾貞子竊聞有言婚者即詣父泣曰不幸母病為大人憂有如不可諱罔極之痛也且婚􅊚不備貞女不行彼世俗鄙薄茍然而已者尚忍為之乎及母沒號慟幾絶既免喪乃成婚逾年父遘疾貞子方産亟超視醫膳藥必嘗而後進如是者彌月父竟不起哀慕隕絶曰就羸篤猶哭不輟聲姑嘗有疾剔股肉食之乃愈夫喪明朝夕涕泣竭力治療不能􅪜乃自綜理其家事夫教子內外無間言子明逺服母訓受業鄉先生所從遊皆瓌瑋之士過明逺必請拜其母貞子不計家有無輒為酒俾盡歡乃已明逺篤學蔚然以文藝稱人謂沈氏有子云論曰昔晉汝南李氏從父兄謂事貴族為門户計其後以子周顗等貴克成其志今貞子于母病之際毅然自持者徒以禮耳非欲為門户計也然卒教其子以儒為業又庸知興沈氏者非貞子乎樂間處士傳樂間處士吳人也妵陸氏蓋唐甫里先之後恂恂寡言平居不見喜怒少年時與其兄俱讀法家書見其言慘礉少􅒚嘗太息曰士不冨貴則貧賤而已何乃自從刀筆吏遊乎且深文巧詆以陷人不測吾不忍為也遂去與兄居里巷間絶口不言爵祿以樂間自號中歲厭居市㕓謂妻子曰吾家有耒耜經甫先生所以遺子孫者畚鍤茠刺固吾事也吾將躬耕笠澤往來江湖復散人故事以終吾志矣即束書載家具竟往不返間著鹿皮冠衣褐衣從畸人逸士扁舟夷猶翛然有世外風或謂處士曰天職覆地職載日月職晝夜人居兩間朝作夕休幼學壯仕斯職也彼以名器不可多耴則假道于仁託宿于義以逰于逍遙之墟食于苟簡之田斯不有其職者也仁義固先王之籧廬乎處士以間為樂其逍遙之徒耶抑茍簡之流耶處士曰吾朝作夕休無異衆人吾學不敢後吾仕則有命焉吾仰則天之覆俯則地之載吾畫夜則日月之明吾仁則願求之義則願由之吾所不茍耴者與器而已爾間者吾之所有吾安其有而樂之其職也逍遙茍簡非吾所敢知夷白子聞之曰隱者也夷白齋藁卷之三十四
