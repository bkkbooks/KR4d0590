body:
  text: 跋四庫著錄夷白齋藁三十五卷外集一卷此爲戴良原編卷數相同稿本藏葉林宗家錢遵王嘗見之曾從其摹寫一本事詳讀書敏求記此出明人手鈔爲延令季氏藏書黃刻季氏書目所載元鈔五本是也今歸常熟瞿氏鐵琴銅劍樓按四庫總目載朱存理樓居雜著跋文稱得是稿鈔本於王東郭家臨寫一部計二百九十六番是本葉數正同又跋拾遺一篇稱尙寶李公前修郡乘時先得海虞人家本一册復有遺文三十五篇予悉錄之今得王氏本相校異同於海虞本錄出爲拾遺一卷是本外集有序十三記十書一題跋九傳一哀辭一凡三十五篇當卽朱氏所見然尙有詩一百十七首則朱跋未之及也明弘治張習刊本跋云敬初有文集名夷白者三十四卷留吳下士大夫家祕不傳習慕先生嘗抄數篇於卷册間邇聆一士有而靳不肯假用購之猶逸其半聞陳思耘得先生手筆數十篇又於友處借百篇倂爲十二卷躬錄諸梓是張氏未見戴良原編其書由多方採集而成故編次不同篇數亦有出入是本較張刻增詩五十二首文三十五首各於目錄本題下加一小圈爲識狼山港寄淮安分省同官一首有目無詩亦有張刻有而是本闕者詩九十八首樂府九五古十九七古八五律三七律十六排律一五絕十三七絕二十九文二十三首贊一雜著四序十一記四墓誌銘二傳一今摘爲補遺並吳人尤義所撰陳基傳附印於後鈔本中本源禪院記五言律八里莊寄吳中兄弟洛口二首七言律題陸氏別業一首絕句倦繡圖一首與張本異同甚多頗疑張氏所見與寫本不同出一源寫本故有校訂多與張本相合茲復對勘一過摭其遺漏者若干條並錄校記附後此集庶可稱善矣敬初別有夷白齋尺牘見海虞藝文目詢之虞邑友人云已不傳特附識之民國紀元二十五年二月崑山胡文楷
