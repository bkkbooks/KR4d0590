body:
  text: 臨海陳基著金華戴良編古詩四言題朱買臣負薪讀書圖古詩五言妾薄命春曰江上彂大都涿州任丘獻州阜城凌州荏平榖城山舊縣汶上施家莊徐州益都子龍橋婦分韻得老字送王本𥘉縣尹兼簡本中知州清樾堂詩為沈君仲説賦釣月軒東原行古詩七言題趙千里江山秋晚圖七月望曰值雨宿窖中贈黃瑞卿詩并序潼關送陳仲寶還江州題畫二首南歸道中作律詩五言八里莊寄吳中兄弟㝎陶夏夜懷李尚志土壕題閿鄉驛用故翰林宋顯夫先生韻二首函關三首永昌陵􅍑牢關江二首久雨二首晴金山寺又雨安國寺㝎陶晴洛口白楊河崔鎮次韻答陸養正律詩七言題陸氏别業題龍門山圖至正丁亥四月草三日允常御史有事于先塋甫竣事而甘雨作人以為孝感所致皆為賦詩而屬豫為之倡丁亥歲河南自正月至七月無雨流民相屬于道哭聲滿野不忍聞興慶池陳留睢州雪中用允常御史韻徐州至曰淮隂道上瓜州題江風山月亭送琳上人歸南嶽江上客舍江上對雨寄鄭山人江邊聞道送人之南江月樓寄了即休長老五月五日淮隂舟中河陰􅍑牢開洛口法王寺崇福宫承天宫轘轅嵩髙次韻鋼字為拜太古運使賦次韻酬鄭彥章運使東平道上濟州彭城吕梁邳州淮隂侯廟過楊子江憶亰師故人草堂碧梧翠竹堂漁莊次韻答陸養正留别錢伯行留别陸養正送干子都赴陕州同知長律上西臺大夫韓公二十韻江亭送錢伯舉録判衢州絶句題水殿納涼圖戲嬰圖蜀葵花圖雞冠花圖桃花翡翠圖倦繡圖竹雀圖􅖋花雪姑圖田橫墓中牟杞縣序玉山草堂分韻詩序尊賢堂分韻賦詩序送長洲縣遷家訥縣丞代歸詩序送施掾史詩序送髙進道序雙蹊詩序送髙孟賔歸永嘉後序送申屠彥德序送鄭君舉遊金陵序送葛子充序嚴氏逰靈巖圖詩序送趙平甫序送李崇道詩序記萬壑松濤軒記緑隂亭記聽雪齋記志靜齋記悠然亭記嘉樹軒記范氏復祖塋記崇勳堂記桃源小隱記知還亭記書與沈存齋書題跋書石抹氏家譜後書故御史鄭公從之嵩山五詩後書中書除目御書𣪚官後書太古字説後跋學齋侍御張掖劉公洛陽懷古詩跋張彥輔畫拂郎馬圖跋西園雅集圖跋康里承旨遺墨
