body:
  text: 臨海陳基著金華戴良編古詩四言題朱買臣負薪讀書圖古詩五言妾薄命春曰江上彂大都涿州任丘献州阜城凌州荏平榖城山舊縣汶上施家荘徐州益都子龍橋婦分韻得老字送王本𥘉縣尹兼簡本中知州清樾堂詩為沈君仲說賦釣月軒東原行古詩七言題趙千里江山秋晚圖七月望曰值雨宿窖中贈黄瑞卿詩并序潼関送陳仲寳還江州題畵二首南歸道中作律詩五言八里荘寄吳中兄弟㝎陶夏夜懐李尚志土壕題閿郷驛用故翰林宋顯夫先生韻二首函関三首永昌陵􅍑牢関江二首乆雨二首晴金山寺又雨安國寺㝎陶晴洛口白楊河崔鎮次韻荅陸養正律詩七言題陸氏别業題龍門山圖至正丁亥四月廿三日允常御史有事扵先塋甫竣事而甘雨作人以為孝感所致皆為賦詩而属予為之倡丁亥歲河南自正月至七月無雨流民相属扵道哭聲滿野不忍聞興慶池陳㽞睢州雪中用允常御史韵徐州至曰淮隂道上瓜州題江風山月亭送琳上人歸南岳江上客舎江上對雨寄鄭山人江邊聞道送人之南江月樓寄了即休長老五月五日淮隂舟中河陰􅍑牢開洛口法王寺崇福宫承天宫轘轅嵩髙次韻鋼字為拜太古運使賦次韻酬鄭彦章運使東平道上濟州彭城吕梁邳州淮隂侯廟過楊子江憶亰師故人草堂碧梧翠竹堂漁荘次韻荅陸養正㽞别錢伯行㽞别陸養正送干子都赴陕州同知長律上西臺大夫韓公二十韻江亭送錢伯舉錄判衢州絶句題水殿納涼圖戯嬰圖蜀葵花圖鷄冠花圖桃花翡翠圖倦繡圖竹雀圖􅖋花雪姑圖田横墓中牟杞縣序玉山草堂分韻詩序尊賢堂分韻賦詩序送長洲縣遷家訥縣丞代歸詩序送施掾史詩序送髙進道序雙蹊詩序送髙孟賔歸永嘉後序送申屠彦徳序送鄭君舉㳺金陵序送葛子充序嚴氏逰靈巖圖詩序送趙平甫序送李崇道詩序記萬壑松濤軒記綠隂亭記聽雪齋記志静齋記悠然亭記嘉樹軒記范氏復祖塋記崇勲堂記桃源小隐記知還亭記書與沈存齋書題䟦書石抹氏家譜後書故御史鄭公從之嵩山五詩後書中書除目御書𣪚官後書太古字說後䟦學齋侍御張掖劉公洛陽懐古詩䟦張彦輔畫拂郎馬圖䟦西園雅集圖䟦康里承旨遺墨
