front:
  text: 夷白齋藁卷之三十
  hash: sha256:b18274294f5199908943ccd0de397363063b91bd7979eea44299aae60b6eaa59
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_030-1a}
body:
  text: 臨海陳基著金華戴良編記重修三皇廟記自國都至于郡縣前代所通祀者社稷孔子而巳其祀伏羲神農黃帝為三皇建廟立師一倣儒學祭用春秋之季月而以醫者主之則國朝之制也平江為東南甲郡廟之𥘉創顧不足以稱神眀之居大德辛丑郡侯嶽烈始即吳縣故址遷而大之至順􅉝未郡推官李君德真至正丁亥郡守蕭君義更相繕葺而廟與學遂為他郡之冠至正戊戍今江浙行中書省左右司郎中吳陵周侯仁實守吳郡吏肅民勸為時良牧而尤以興學報夲為先務醫學教授郡人林君以義奉以周旋將事惟謹几祭祀之品物師徒之廩稍與夫金帛之出納周侯責成乎其上林君克任乎其下而銖黍之積絲寸之纍幸粗有嬴則又諰諰然圖所以興其廢而輔其弊由丁亥至今蕭李二君之所經營塗塈中之而為殿堂旁之而為兩廡為先賢祠為齋舍為庖湢前之而為三門為靈星之門為宫墻為井亭覆者腐柱者蠧而甃者亦疏以缺矣由是修其大不遺乎其細治其內必務乎其外其為役也靈星之門為最巨門舊以木為之今則易之以石閎偉尊嚴人用改觀而神眀之居至是而益稱矣庀工于二十年庚子四月戊子告成于八月戊申事既就竣學之人相與伐石來徴文以為記昔者孔子刪書斷自唐虞以下及繫周易則歷序庖犧神農黃帝而太史公所紀三皇氏見于史記與今之所祀者不同然自書契以來所謂上古聖神繼天立極開物成務復有盛于繫辭之所稱者乎國家損益百王修崇祀典而醫家者流因得奉牲幣粢盛籩豆百物之儀與郡邑守長駿奔升降薦獻廟廷如博士諸生之事先聖先師者始于國都逹于天下而周侯職長承宣林君事顓醫教能以其力之所及為其所得為而人存政舉足以迓續前猷風勵來哲若此是皆有可書者用不辭而為之記俾歸而刻之杭州路重修仁和縣記杭屬縣附郭者二仁和與錢塘也仁和在吳越時為錢江縣宋興國𥘉始易今名縣故在餘杭門之內紹興間縣令孫廷直嘗徙治招賢坊其遷麗大府之南左偏而與錢唐縣四隅録事司並列為東西序則皇朝大德之際也至元仍紀元之五年己丣縣逹魯花赤密兒可馬嘗因其舊而繕完之距令蓋二十餘年矣上棟下宇內垣外墉騫撓陊剝凛乎其將壓而卒未有剔其蠹而支其傾者至正二十年庚子捴管吳陵謝侯莭修舉庶政務以先後為次苐環視列𪠘所冝振而新之者殆莫斯為甚爰命度材賦㓛而逹魯花赤北庭伯嘉訥侯韙之同知捴管府事邵君勝祖治中劉君克忠同力而贊之中為治事之廳旁為兩廡右為架閣庫前為縣門屋以間計者二十有三其增創則退食之堂居廳之後幕賔之舍居廳之左屋以間計者九傳階為闌楯周于外者為之墉以丈計者一百五十有竒椅榻之具皿器之需與凡所冝有者莫不畢備是役也經始于閏月丙寅告成于九月庚申工以日計者一百一十有五用錢以緡計者若干董其事者主簿王欽謁文以為記者縣逹魯花赤長安尹髙搏也杭為東南會府省憲百執事實涖焉承平以來聀守令而司民社者非無器望材能之選也然往往鞠躬于簿書駿奔于期會攘臂于賦斂獄訟紏紛之末而弊弊焉覬歲月以俟踐更者相望也由是視公宇不啻如傳舍尚遑恤其危且壓哉乃今公不重費民不勤勞而植撓扶騫剔蠧而支傾者顧有待于兵革荐興之際蓋往者之所忽來者之所戒政之善訓也侯既不以傳舍視官府矣居其居而職其職者苐毋以踐更玩吏民則仁和其庶幾乎書以卑之俾刻諸石嗣而葺之者尚有考云松雲巢記松可巢乎曰可上古未有宫室民居橧巢之上則松可巢也雲可巢乎曰可昔李白樂廬山五老之勝嘗賦詩曰吾將此地巢雲松則松與雲皆可巢也夫巢于未有宫室之世則有巢氏之民皆是矣後世既易之以宫室而其人復有巢者乎堯之時有巢父焉堯之野無遺賢彼父者惡得而巢乎蓋上有堯為之君下有舜咎繇為之臣父雖賢列之百執事亦八元八愷之倫爾矧其時己治其民已安如父者非不得己而後巢者也以堯之世為可巢而巢焉斯其所以為善也若白者又惡乎而巢耶尚論其世則白去父逺矣夷考其人則亦百世之士也使白居百執事之間則黼蔽人文彌綸帝載雖未足以致其君于唐虞然傳之後世亦豈易以淺近窺哉惟其一遇時君遂擯不用于是與賀知章司馬子微之屬汗漫于江湖神逰乎八極此其得已非得已蓋可知矣然五老松雲一經品題千載之下膾炙人口是以世之瓌瑋闊逹閎曠而不羈者每誦其詩若見其人雖復迹顯勢崇而蟬蛻汙濁之心未嘗不與造物者遊于有巢氏之始就余所知而言如髙侯元善敡歷樞省其迹顯矣名利勳賢其勢崇矣然室居委巷而不以為隘地逼郛鄙而不以為陋方構亭鑿池環藝花竹且自題曰松雲之巢每退自休沭輒彈琴賦詩徜徉乎其中而禽魚下上光景出沒不越户庭而城市山林翛然異觀侯將自附于李白歟則率百執事之賢日遊廊廟之上其出處與白異矣將自託于巢父之流歟則飲食起居未或一日而去宫室也然則巢惡乎而在蓋侯之巢不松而髙不雲而深不上古而安不五老而勝而亦未始不偃仰于松雲逍遙于上古而超然于五老也蓋居廊廟之崇而志在林壑處宫室之奧而情寄物表故以侯為附李白者固失之矣以侯為託巢父者亦未為得也余將杖䇿以從侯于不夷不惠之間侯其許之乎侯應曰諾因書以為記矦燕人也今為淮南行中書左右司郎中余則韋羌山人陳基云六柳莊記昔者陶靖節既已不屑為縣令浩然賦歸與造物者遊于羲皇之上矣其視世之軒裳圭組聲色子女與夫宫室狗馬之奉不啻如腥羶穢腐蟬蛻而去之唯恐其或染已也然而猶以五柳自號彼五柳者亦何與乎靖節重輕哉近世徐節孝以至行髙天下所居有二栁因自比靖節而流風遺韻至今不衰檇李沈君逹卿起家儒林踐􅏡臺省由丞相掾再遷拜南行臺監察御史尋職法行中書為理官其出處與靖節異矣所居有六栁亦遂以名其廬曰六栁莊其于靖節亦豈聞其風而興起者乎逹卿由布衣拔畎畒靖莭以世胄樹風烈莭孝以至行立師道皆人所難能者逹卿為親而仕且三十寒暑矣其識量髙明論議倜儻蓋古之遺直也今以三尺為己任出入廟堂廷爭曲直面折是非務必當而後己其為事蓋亦人所不易者而逰卿處之如公輸引繩動中程度然退則蕭然一室左琴右書間與賔友引觴酣嬉上下古今而言不及世事于是六栁者亦遂將與二栁相望于五栁間由是而觀雖子其同而黜其異可也且靖節百世之士也世不得而用之莭孝獨行之士也世莫得而遺焉逹卿用世之士也顧所用何如爾古今人不必同不必不同要其歸卒無不同者君子亦同其心而巳矣逹卿殆所謂善學栁下惠者非耶或曰莭孝之栁捐于靖莭者三逹卿之栁多于節孝者四其不同較然矣而子獨以為同何也嗟乎栁豈以多少為哉顧所以相望于栁之外者非或者所知也逹卿曰善遂記之夷白齋藁卷之三十
