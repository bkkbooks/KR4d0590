front:
  text: 夷白齋藁卷之四
  hash: sha256:8679b29ecd7531ec97c92760950b6a6bbebcd0e8ffab601925461d8875833388
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_004-1a}
body:
  text: 臨海陳基著金華戴良編古詩五言公退述懷雞鳴戒徒御日入返柴荆素無希世心亦復勞其形間關用武日百役有期程空言不足施退省汗沾纓中衢積塗潦滑滑不堪行振轡策羸馬一步一凌兢入門無它慮偃卧就南榮永愧逃名侣冥栖無所營成夫修所居屋成赱筆戲贈我昨戾東椘君方客中吳我至已授館君來始營居我屋雖湫隘可以置琴書並軒五六尺種菊三四株公退即就寢或擬陶潛徒君居擇髙明塗塈加􅕋蒢背隂而面陽中密而外疏昔聞真如室八寶羅明珠天女散妙花綽約麗且姝今𣣔人其人必且廬其廬去草當去根愛屋庸愛烏我器若鉊刀僅堪一割需君材如太阿可制千于莬利鈍逈不侔趣舍冝爾殊雖居市門里內各在東西隅朝遊或同幕暮歸仍異塗終然念羇旅時𣸪枉軒車摘我黃金英浮君白玉壷議輪天人際笑傲羲皇𥘉麯生有妙理不飲𣸪何如次韻答趙夲𥘉肅肅霜露下蕭蕭鴻鴈征春從越城戍秋隨淮甸行解却紫霞佩换得曼胡纓覬酬一飯恩遑恤千載名新詩辱逺寄金石鏗有聲𣣔報乏瑶玉臨風空𣸪情海安過閘得風出爛泥洪舟過海安閘路轉爛泥洪水行九十里泱􅐯趨秦潼月黑星漢髙四顧無人蹤縱有百丈彈不如數尺蓬是時天宇霽餘霞散晴空篙師無它術仰面呼南風夜久水鳥鳴出沒西𣸪東其聲類人嘔見者思挽弓吾聞亦駭異莫究吉與凶得非卑濕區池汙蚊蚋鍾暑夕噆人膚蜂蠇尚可容此鳥號蚊母吐蚊利于蜂往往陂澤內雌呼命其雄春氣一以和託巢蘆葦叢此鳥信可憎彼蚊欣未逢所憂亡命徒手刃匿草中晝伏夜狙伺為毒甚斯蟲我方事師旅禁暴哀人窮此輩倘不除癘民安有終所過戒吏卒反覆開盲聾尓實備官守責在兵與農自古處邉圍盜戢商乃通陽德始彂生人事冝肅雍簡書雖有程我行憂慮從歎息長路人何由辭轉蓬聽歌水調有感江流清復清江草接江亭何人歌水調餘韻入青冥歌者不知苦聽者有餘情坐令離别客白髮鏡中生翠雨亭華構帶修竹竊窕清湖潯時雨積空翠綺疏生晝隂飛蓋集芳侣鳴珂雜春禽中有孤栖鳯懷哉多好音下塘道中謝村舟行謝村路却訪義橋營妖骨埋荒草秋風洗𣸪腥青山不改色紅樹逺含情當日聞風鶴俱疑是晉兵塘西牽舟復搖櫓日出還亭午風遞五林秋雲挾塘西雨盈盈採蓮槳坎坎迎神鼓對此𣣔忘歸停撓更容與東阡喧呼東阡道蒼皇競明彂萬斧入中林千夫編巨筏關山日憔悴世路增騷屑此物諒何尤徒以材見伐南潯南潯古名鎮鬱為商賈區今日留兵戍壁壘控江湖遙空含鴈鶩秋波秀芙蕖此地為邉圉何方非畏塗荷葉蒲昔年荷葉浦椎剽伏蒲萑日夕相狙伺承平為禍患兹辰乃夷坦悉歸耕釣間但聞明月夜時唱采菱還中塘道中鳯口溪塢晚含風山營夜依谷栖鳥息復驚歸雲斷還續畫舸止宵征連艫㗸尾宿戍鼓雜鳴笳秋聲一何肅東塘輕舟下溪口却轉東塘路雞犬近相聞漁樵逺城戍雖經喪亂後漸有承平趣處處白蘋花家家紅槿樹大麻大小兩麻村中藏萬家塢樹連超山雲草著髙亭雨地力本冝農民風近知武欲問漢文翁何時復淳古􅊶家堰依依楊栁津靡靡􅊶家堰水出鳯溪口山聳臨平面地經兵甲餘人似官軍健往歲羽書頻今年魚米賤上塘道中尹山人傳周吉甫遺墓在勾吳蕭條入墟里泱􅐯帶煙蕪豈伊姬臣裔散落處江湖負耒林丘下容非隱者徒吳江城邑帶秋水盈盈笠澤湄西風一夜起鴻鴈盡南飛晉日東曺掾唐朝左拾遺長揖謝軒冤悠悠千載期垂虹橋出郭雨如注入舟天𣣔低飛梁跨雲渚嵽嵲亘長霓三江風水急五湖煙月迷夙昔鴟夷子扁舟此入齊平望下田不憂旱髙田正冝雨四野己足霖三吳復無暑盂酒及豚蹄盤羞雜雞黍擊鼓樂社翁燒燈御田祖嘉禾鬱鬱由拳縣亭亭檇李城秦漢相吞噬吳越競戈兵靡靡風露夕離離禾黍生千載陸夫子遺書昭日星石門迢迢石門路冉冉煙村暮眇眇棹歌聲泠泠不知處水宿信風波宵征犯霜露自愧匪賢勞何由拯黎庶崇德崇川據四衝城郭開莾蒼水陸飛芻粟軒車遞英蕩民和州牧賢雨足田苗長我欲艤芳舟相尋慰懷想長安上堰如上山下堰如下陵躋攀劇分寸傍徨加戰兢有形必有役無寵亦無驚為謝津頭吏誰是魯連生題蘇昌齡西澗詩意啚圖乃黃子久所畫子久自識云華陽逋客作逍遙西澗翁汗漫華陽客渴飲杖頭瓢醉卧溪畔石澄觀無聲趣默聽寧有迹舉目雲鳥飛側耳川流激人籟靜踰聞天機動彌寂冥搜屬意匠繪寫遺刻畫此客不可作斯翁老無敵窹寐西澗啚令人心莫􅊇題黃侍講所著王友樵先生墓銘後隱君千載士太史百世師刻辭銘友樵其言玉無疵我觀讀騷作古道殊未衰斯人不可見斯文其永垂夷白齋藁卷之四
