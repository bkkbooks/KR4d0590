body:
  text: 臨海陳基著金華戴良編卷之一賦别知賦送王子充蟬賦樂府白鴈操鴻鵠操崇丘寄倪元鎮山髙寄陸玄素春草辭為延陵華彥清作鴈孤飛為徐夫人作慈烏曲為仲説作黃雀行雞鳬行白頭公辭刈草行新城行見月行裁衣曲征夫歎征婦怨邉城曲卷之二古詩四言九月夀沈毋也西村之墅美德方甫也古詩五言秋懷七首讀國語二首詠史三首懷美人次韻答友人待王子充不至夏日喜友見訪投贈同志次韻吕彥真分省與同幕諸君小集梅南書隱為上虞俞氏賦夏日齋居用蔡都事彥文韻分省早集懷錢貟外蔡都事湯管勾樓居彥文點兵餘杭冨陽新城道上賦詩見示因次韻四首分署望鳯凰山次韻彥文古詩三首西齋對雨池上對菊送卲同知分韻得來字次韻沈仲説答蔣子中遺山水便面詩卷之三古詩五言發吳門大江狼山通州如臯縣海安爛泥洪泰州上樂令丁鎮務子角髙郵寶應縣述老嫗語淮安九日從陳醫師所寓得甘井課童子分汲傷菊卷之四古詩五言公退述懷成夫修所居屋成赱筆戲贈次韻答趙本初海安過閘得風出爛泥洪聽歌水調有感翠雨亭下塘道中謝村塘西東阡南潯荷葉浦中塘道中鳯口東塘大麻􅊶家堰上塘道中尹山吳江垂虹橋平望嘉禾石門崇德長安題蘇昌齡西澗詩意圖啚乃黃子久所畫子久自識云華陽逋客作題黃侍講所著王友樵先生墓銘後卷之五古詩七言椘州舊將歌東臯隱者詩為范思賢作次韻玉山倡和詩次韻垂虹橋泊舟倡和分題賦得太湖送鄭同夫送毛生歸越織錦篇青絲絡馬頭送李彥章送李景先録判送讓還吳謝從義參軍自亰師還言中書危參政見問且訝無書因述詩寄謝孟冬觀淮水鄭遂昌以趙魏公所題髙尚書畫遺沈東林要豫賦詩題五王遊春圖題馬都事夀椿堂卷之六古詩雜言沈孝子行送醫師沈伯新煮雪窩為玉山作我今有所思寄于山人空明山人歌烏夜啼引玊笙引律詩五言興福院會秦文仲文學古二首送謝參軍次韻答髙元善送鎦治中癸丣二月十二日常熟阻雨寄吳門分省同官琴川懷古十六日開􅊑值北風大作復泊北門二十一日渡江三塔寺訪寬老訪夲覺欲長老不遇時欲公在南堂退居留别仲銘二首送姪讓從軍武安二首卷之七律詩七言秋日雜興五首寄沈仲説二首次韻金上人見詒寄家兄敬德次韻吕彥貞西園同遊歸燕用秋日雜興作遊仙詩五首寄玊山次韻鄭遂昌奉謁范魏公祠白芙蓉次韻錢伯行白芙蓉婁江即事二首次韻仲説喜陳叔方過東林隱居二首次韻鄭遂昌喜雪二首簡白野監司送曺宗爰次韻懷彥成次韻待琦上人不至次韻懷玉山陸氏别業寄仲説寄玉山二首水木清華亭小酌仲説留陳公原余往訪之留宿陳公原題陳公原仲説所居壁卷之八律詩七言次韻鄭有道喜王季野府判南歸二首次韻伯行投贈存齋三用韻喜季野歸寄季野次韻劉德方經歷送徐勉之慈湖書院山長送錢士能建昌知州送王夀翁歸閩次韻答文仲二首婁江雜詩二首與文學古秦文仲遊至正觀次韻答文仲郭羲仲聮句見寄次韻錢都事誠夫海上書事送誠夫使吳門督漕事兼寄分院同幕諸公春日邵氏園池送胡宣使赴都進表送髙起文歸越兼簡陳伯昻王彥強二首寄楊文舉經厯寄顧仲贄次韻謝捴管送梅州判還昆山次韻謝侯寄梅州判次韻謝侯書懷十一月晦與同幕諸公登南髙峰因過湖上小集賦詩二首正月五日省院諸公飲吳南城泊舟垂虹橋訪南北兩山寺候蔡都彥文次韻彥文寄謝省院諸公二首次韻孟天偉郎中看潮十首卷之九律詩七言次韻髙元善郎中見寄律詩二首元善嘗俾豫記其所居松雲巢繼辱以詩為謝因次韻答之舟中讀漢武帝紀次韻葉德新江上觀兵三塔寺過夲覺寺懷欲了庵長老寄顧髙士寄鄭明德過三塔灣留題再用韻答鄭先生用韻答沈仲説寄錢誠夫貟外寄蔡彥文都事九日九日簡同幕諸公兼寄吳中兄弟阻風仲舉舟中小酌墻角種菊三四夲頗可觀淮隂雜詩五首寄吳中分幕諸同志寒菊遍開可喜寄唐伯剛斷事官寄陳庶子參軍兼簡饒介之郎中寄謝從義參軍兼簡唐伯剛斷事寄周信夫王叔明二長史寄錢伯行檢校葉德新長史寄沈逹卿陳子方二理問和周太常貢祕卿詩五首卷之十律詩七言送彌陀保丗衡聞人德機二解元赴省試送丁太𥘉嘉德常二貢士赴省試送牛述善郎中還朝自淮安使江南舟次通州寄同幕諸公首由通州渡江福山港口待潮癸丣二月十一日官軍彂吳門二十日福山港寄省院諸友舟中看虞山有感二十二日狼山口觀兵逰狼山寺三首狼山港寄淮安分省同官寄朱佑之經歷寄張長年都事二十六日自通州赴淮安寄夏仲信太守韓璧翁經歷姚伯升照磨髙郵湖夜行天明過寶應二十九日至淮安城南十五里述懷到南鎮寄分省同官三月十五日由淮安使江南别同官三月二十五日由吳門使杭閏三月四日夏仲信太守邀遊飛來峯和顧子經照磨韻二首分省諸公邀西湖宴集閏三月七日過三塔寺留别寬老閏三月七日泊舟三塔寺新仲銘長老出城相看吳江𥘉八日阻風宿吳江無礙寺西寺送信元長老還吳興楊墳寺次韻謝元懿移居見寄二首卷之十一長律送顧用之知階州送謝參軍十八韻安童右丞挽詩郜同知挽詩聮句至正十一年正月一日遂昌鄭元祐龍門僧良琦臨海陳基聮句送匡廬道士于彥成歸越兼簡蕭靖復盧益倄絶句髙郵湖次韻吳江道中次韻臨平道中題柯博士畫竹題宋陵梅竹圖題摩癢馬圖題寒林讀書圖題畫馬圖題倪元鎮畫次韻劉德方經歷次韻送彥成玉山二首戲和玉山韻二首東林蘭若題謝仲和墨竹二首絶句五言題蒲桞鶯鶺圖題畫山茶折枝題月季花折枝圖臨平騷倬鶴文代弔嶽飛文弔徐節孝先生文清暉樓辭歸鶴解卷之十二頌平江路逹魯花赤西夏六十公紀績碑頌海道都漕運萬戶府逹魯花赤脫因公紀績頌銘頥菴銛貞白室銘吳興沈仲説得蘇長史奮硯銘緩軒銘針潛心閣針贊劉文正公小像贊謝參政小像贊蘇昌齡小像贊月上人畫像贊雜著原器贈葉照磨德新諭圃文説舟贈謝從義諭童文丁彥明字説鶴瓢説卷之十三序逰􅍑丘圖詩序玉山名勝集序送黃德廣序送丁經歷序送劉志伊序橫山紀行詩序送粹上人詩序卷之十四序送鄭同夫歸豫章分題詩序趙泰州平反冤獄詩序送金西白上人逰方序浮青閣詩序送煜上人序陸仲洲字序徐公逺字序贈葛孟顒序卷之十五序贈宋太醫序送王季境詩後序馬千户遺愛詩序乾坤草亭詩序江月樓詩序送強彥栗北上詩序送宋縣尹詩序卷之十六序送張郎中詩序白羊山紀遊詩序送卲知州序送徐仲剛詩序送郯九成詩序送塗叔良序贈盧仲章詩序卷之十七序顧友文字序李僉事政迹序雀衢州政迹詩序送陳惟允序送李德中序卷之十八序送鄒掾史還江西序送夲上人東歸序送張知事序友迂軒文集序奉親圖詩序贈曽彥魯序卷之十九序送陳景𥘉序送哲上人序送陳希文北上序朱氏格致餘論序送韋道寧詩序左丞潘公射吳江佛寺浮圖詩序卷之二十序陳惟寅字序瞻雲軒詩序送浦朝宗序南臺御史大夫西夏永年公勳德詩序丁仲德歸養詩序卷之二十一序送覺上人序贈醫學提舉張性之序送周信夫序西湖書院書目序弔徐節孝先生詩序卷之二十二序程禮部集序孟待制文集序金他稡編序飛雲樓詩并序安素堂詩并序息耕亭詩有序送脫歡參政詩有序卷之二十三記雪屋記愛日堂記崑山州重建城隍廟記虛齋記思順堂記卷之二十四記春暉樓記佩韋齋記存存齋記靜逺齋記梓軒記貞吉齋記卷之二十五記蓬萊山房記緑筠樓記斡勒氏續祭田記雅會堂東軒記竹間居記庸德堂記卷之二十六記思善堂記鍊雪軒記本源禪院記省委官河南杜君政迹記天惠賢首教寺記卷之二十七記書紳齋記水雲亭記光福觀音顯應記白雲窗記虞麓精舍記卷之二十八記聽雪齋記風林亭記皥皥齋記種德堂記同樂堂記卷之二十九記三笑軒記憶親堂記清嘯軒記蠢菴記松泉亭後記卷之三十記重修三皇廟記杭州路重修仁和縣記松雲巢記六桞莊記卷之三十一記退思齋記志學齋記卧雲軒記深雪軒記卷之三十二題跋跋陳汝資先生書其弟汝泉詩後跋李伯時追彘圖跋蘭亭序跋同别峯講師所藏蘇文忠公帖跋饒參政草書後跋蘇文忠公自書前赤壁賦書朱雲傳後書趙冀公墨梅後卷之三十三碑精忠廟碑墓志銘陳隱君墓志銘處士袁君基志銘姪天騏壙銘墓表秦君墓表卷之三十四傳湯婆傳周處士傳史孝子傳沈毋傳樂間處士傳卷之三十五祭文祭故平章榮祿張公文祭斡勒廉使文右夷白齋藁合肆伯伍拾肆篇通奉大夫內史臨海陳先生所著良既訪之先生盡得其藁而編次之以為三十五卷而復序其篇目曰世道有叔降風氣有盛衰而文運隨之故自周衰聖人之遺言既熄諸子雜家並起而汩亂之漢興董生司馬遷揚雄劉向之徒出而斯文始近于古逮其後也曺劉沈謝之刻鏤王楊盧駱之纎豔又靡然于當時至唐之久而昌黎韓子以道德仁義之言起而麾之然後斯文幾于漢奈何元氣僅還而剝喪戕賊己浸淫于五代之陋直至宋之劉楊猶務抽青嫓白錯綺交繡以自衒後七十餘年廬陵歐陽氏又起而麾之而天下文章復侔于漢唐之盛未幾歐志弗克遂伸學者又習于當時之所謂經義者分裂牽綴氣日以卑而南渡之末卒至經學文藝判為專門士風頺弊于科舉之業而宋遂亡矣文運隨時而髙下概可見焉我朝與地之廣曠古所未有學士大夫乘其雄渾之氣以為文者固未易以一二數然自天曆以來擅名于海內惟蜀郡虞公豫章揭公金華栁公黃公而已蓋方是時祖宗以深仁厚澤涵養天下垂五六十年而戴白之老童兒幼稚相與鼓舞于里巷之間晏然無以異于漢唐宋之盛時故一時作者率皆涵淳茹和以鳴太平之盛治其摛辭則擬諸漢唐説理則本諸宋氏而學問則優柔于周之末衰學者咸宗尚之並稱之曰虞揭栁黃而夲朝之盛極矣繼是而起以文名家者猶不下數人如莆田陳公之俊邁則有得于虞公新安程公之古潔則有得于揭公臨川危公之浩博則又兼得夫四公之指授者郁郁彬彬何可及哉近年以來獨危公秉筆居中朝自餘數公常想見其風采習聞其謦咳邈然其不可接者久矣于是淪謝殆盡而得先生以紹其聲光先生黃公之髙第弟子嘗負其所有􅍱濤江遊吳中久之又自吳踰淮泝黃河而北逹于燕趙留輦轂之下久之于時雖未有所遇然自亰師及四方之士不問識與不識見其文者莫不稱美之不置則其得之黃公者深矣豈惟黃公蓋自虞揭而下數公亦皆得而師友之故其為文雍容紆餘如冠冕珮玉之周旋堂陛之上馳騁操縱如風雲蛇鳥之按行兵陳之間而音節曲折則與向之數公如出一律也後由亰師還吳居無何我吳王聞其學即以樞府都事起于家不數年間遂以屢遷而長其省幕其後調太尉府參軍由參軍升內史迹愈顯而文愈工國家之制作及四方之求之者皆隨而應之蓋沛乎其無窮矣夫自周衰以來至于今幾二千載其􅍱世非不逺也厯年非不久也能言之士非不夥且衆也斯文能自振拔以追于古者惟漠唐及宋及我朝此四世而已而四世之中士之卓卓可稱者又常不過數人焉何世之不數而人之難得若是歟于此有人焉能以卓卓可稱者自期待又幸遭逢于時而得大肆其所作世其可不為之貴重之歟良于先生之文讀之纍月曽莫有所去取于其間雖片言半簡咸附而録之者所以眀先生于一字畫之徽皆可為斯世之貴重也先生為人溫良慈惠其從政寬易愛人與人交于恩意最篤雖遇臧獲亦未嘗有遽色疾言平居蓋雍雍如也若先生豈所謂有德有言者耶夫誦其詩讀其書不知其人可乎故于序先生之文而併及其大要可紀者如此先生名基字敬初夷白齋乃自其號也故以題其藁云至正二十四年歲在甲辰夏五朔同門生金華戴良書夷白齋藁目録卷終
