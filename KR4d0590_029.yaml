front:
  text: 夷白齋藁卷之二十九
  hash: sha256:6a5bd62c399092782e96232c6db9d5c8b455a40ed8595241093b46aaa7ea26ff
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_029-1a}
body:
  text: 臨海陳基著金華戴良編記三笑軒記夷白子寓杭觀橋之觀巷屋弊瓦腐夜雨或暴至張蓋就寢亦不顧嘗自扁其東偏之室曰三笑軒左右或􅏜之夷白子曰余娶婦二十載未有胤嗣令年四十有七老且至矣方更得女此一可笑也承平盛年余嘗三至亰師覬得微祿以為親養間用薦者入朝同進見忌尋引避還江南令親沒巳久齒髮變衰自以為無𣸪有用于世矣屬南北用兵乃始叨塵仕版此二可笑也平居讀書至申韓衛鞅之用法輒嘻然曰是何不如周公之平易也見人攘臂談孫吳辨論鋒出甚可喜而自幸其不能今忝備官使辱遊樞幕朝夕從事乃不離二者之間此三可笑也左右曰夫憂莫憂于無子喜莫喜于得祿榮莫榮于處機要此人之情也今子中年得祿雖不逮養然幸居機要固可以歡然自笑矣若夫久娶無子老更得女親戚故舊無不為子憂者今也顧亦自喜而笑無乃與人異情乎哉夷白子曰汝以為喜者吾以為懼汝以為榮者吾以為恐汝以為憂者吾則以為不必憂吾自謂同于人者莫己若而汝獨以為異此其所以為可笑也汝亦嘗聞東門吳之喪子乎東門吳有子而喪與無子同今吾得女孰與喪子故不必憂夫爵以待賢祿以勸㓛機要所以處文武非常之士今不賢而都好爵幸而貴者也無㓛而享厚祿苟而冨者也無文武非常之材而處機要不知耻者也况非素習而任其事為濫官非所能而居其職為竊位不逮親而飬妻子為蠧國令吾一舉而犯不韙者六惴惴焉若緣顛崖墜深谷石𣣔墮而壓之者汝以為榮且喜焉此又可笑之尤者也左右曰無子不憂亦有師乎曰有吾師東門吳也得祿而返懼處機要而加恐亦有師乎曰有昔向子平讀易損卦而知冨不如貧貴不如賤此吾師也吾將從若人者朝遊名山暮栖五嶽榮辱不足以纍其身喜懼不足以屑其意汝以為何如左右曰善夷白子曰若是則可以索我于三笑之外矣因録其言書于壁伺大方之家決焉時至正二十年夏五月也憶親堂記江浙行中書省左右司郎中淮南夏君仲信扁其所寓之室曰憶親堂間謂余曰吾少也孤毋夫人不以為不肖俾奉先君子遺體夙夜不敢遑寧用克底于成人及備官外朝仕有祿秩而先君子不待矣頃歲辱以樞屬斷事官分治吳下用是由秦郵里苐不逺千里迎毋夫人來江南竊自念祿既不逮先君子矣而朝夕之養幸母夫人壽康又得就官不敢不竭力以庶幾無沗于君之賜乎未幾行省命下又自以為由蘇至杭僅三百里因扶持而行其視秦郵冝益册難者及致請而母夫人乃不樂去吳吾既莫之敢強而官守有常又不得以時歸覲于是㝎省之禮滫瀡之奉乃反不逮吳下時此堂之所以命名也夫秦郵吾母夫人之邦也蘇與杭吾官所也由秦郵至吳千里而逺由蘇至杭三百里而近吾母寧樂去秦郵而不樂去吳而吾又不能強焉吾豈固以吳為吾土哉亦重違毋志爾子幸為吾記之古之君子善養親者莫如曽子而其憶親也莫如狄公然曽子嘗南逰而仕于楚矣而其親固未嘗去魯也狄公嘗因使而登太行矣而其親固未嘗去河陽也然後世言養志者必曰曽子而狄公之于曽子蓋異世而同心者也方白雲孤飛眷戀不巳此其心顧安忍一日去其親乎及公勳業冠唐中興有識之士固已于其登太行之時見之矣仲信俶儻瓌琦臨義有勇其宦遊蘇杭敡厯樞省殆曽子之仕楚狄公之事唐也嗟乎事親得如二子亦可矣然曽子不強其親以去魯狄公不強其親以去河陽今仲信之親不樂去吳門顧安得而強之乎惟其不敢強于其親故移以事君也順移以事君也順故資以飬親也安苟安矣則今日之吳門即異時之河陽也尚奚以吾土非吾土為哉然則親之逮不逮天也居之近不近時也不可得而強者安時以適志也曽子我師也狄公豈欺也哉庸以是復仲信因書以為記至正二十年夏五月戊申清嘯軒記河東唐君伯剛少從鄉先生令內翰張公受業博雅好古論議恢逹有魏晉間人風氣嘗至亰師以能詩知名性樂昜不喜事邉幅或勸之仕不應遂長嘯賦歸與畸人靜者耕田讀書從子弟射獵逐麋鹿以卒歲意有所感輒然以嘯自適屬南北用兵將相承制以人材為己任伯剛遂不得以不仕自髙既巳進位機近猶復不廢清嘯故所至率以命軒間謂余曰願有記也夫嘯非君子之所得已昔阮籍終身嘯而不厭蓋籍負曠世不羈之材懷瓌傑宏放之器方其慟哭于窮途長歎于廣武作詩八十餘篇以詠所懷籍之嘯𥘉未嘗忘乎世也及至蘇門與隱者孫登長嘨相和遂歸而著大人先生論然後籍之嘯始與世非籍之志也嘯豈籍之所得己哉或曰籍好老莊者也故以嘯自得豈信然歟初伯剛由亰師賦歸耕田射獵亦欲以清嘯自終矣庸詎知以人材為任者乃不容其自附于阮藉之流乎及當塗掌事得君子之時亦可以不必嘯矣然每休沭輒與嚮之畸人靜者或投壼或撫琴或玩弄商彜周鼎古法書名畫嘯詠終日人謂伯剛退不溺意于丘壑進不嬰情于軒冕其嘯也非得巳亦非不得巳伯剛以嘯自得非附籍而後嘯也苟得嘯之道矣雖不附籍猶嘯伯剛自處其殆不夷不惠之間非耶古今人雖不同又庸知靜者之徒無大人先生如蘇門隱者乎顧余何足以見之姑為記其不夷不惠之説書之軒中與世之知嘯者商略云至正二十年閏月甲子記蠢菴記客有問蠢庵主者曰子之名庵亦有所本乎曰無有吾之生也與物之蠢動者同其天耳方其孩提也雷霆震而弗恐虎兕駭而弗懼鐘磬管籥聲之和也聽之如弗聞膏梁膾炙食之珍也享之如無味黼黻絺繡色之麗且文也視之如弗見斯蠢耶非耶而吾不自知也及其長也教之以六藝習之以詩書陶之以禮樂威之以刑辟于是存與亡相仍得與失相尋是與非相形情與欲相生行必擇利害動必慮吉凶言必徴善惡事必逺嫌疑然後聞雷而知恐見虎而知懼耳非五音不聽口非五味不享目非五色不視而蠢之天鑿矣昔老子之徒黜聰眀去健羡非禮學薄仁義鴻飛于青冥蟬蛻于穢濁以冨貴為機穽爵祿為銜勒車服圭組為桎梏若將溷己而弗之顧者蓋欲不雕不鑿以全其天也今考存亡于詩書稽得失于六藝酌是非于禮樂虞情欲于刑辟擇利害于機穽慮吉凶于銜勒徴善惡逺嫌疑于桎梏由是奔尺寸赱絲毫如蟻之附腥羶蛾之投爝火或突梯或鴟夷或如脂或如韋或睢睢或盱盱入則廣厦而居出則列駟而馳所至則舍者避席焬者避竈而弗恐弗懼弗聞弗視無味之天至是蓋不一鑿而止矣夫倏與忽一鑿而渾沌死今既鑿之又鑿之不一鑿之雖欲不亡得乎此其所以名菴吾不知其所夲客曰子以詩書六藝鑿子之天猶華子以魯儒生之治其忘疾乃更操戈而逐之也使詩書六藝而可逐也則子又將操戈以從其後矣雖然菴也者古之所謂籧廬今之所謂􅊇旅也人皆可以託宿而去豈子之所得私哉故愚如顔子淵魯如曽子輿拙如周茂叔亦未嘗不以六藝為户禮樂為序詩書為府刑辟為輔也若夫處冨貴而不事突梯踐爵祿而不務鴟夷乘車𬒳服而不睢不盱執玉紆組而不脂不韋固未嘗不蟬而蛻不鴻而飛此不夷不惠楊子雲之謂可否之間其殆庶幾者也由是而觀則子之天鑿耶未嘗鑿耶亡耶未嘗亡耶夫置是菴于可否之間昔舍者避席煬者避竈今則與之爭席矣則未始鑿亦未始亡也子以為不知所夲豈欺也哉豈欺也哉或曰菴在具區松江之上去魯數千里而與泰伯仲雍所逃荆蠻之地相近至者朱妵或曰陶朱公之後也客則韋羌山人夷白子云是歲上章困敦閏月甲子記松泉亭後記𥘉周君德新之居淮西也曰與搢紳子弟讀書彈琴于松泉之間自以為天下之樂無以加于此矣及出遊四方而金陵錢唐武夷天台皆以山水之勝名天下慮無不窮深極幽以肆其所歷而松泉所見亦巳廣矣然未嘗不解鞍徘徊停策踟蹰終曰不能去巳而擢官省垣從事機幄朝夕所與將相公卿上下以周旋者皆軍國生民之務也自是率居無寧歲出無常所然松泉之勝則未嘗不往來于懷故所至輒以命亭御史孟侯既為文以記之矣間又謂余曰不可以無言也昔人有隱于逍遙谷者天子問以所須曰茂松清泉臣所須也夫既巳隱矣而所須猶有待于松泉而松泉也固隱者之所得私乎德新在淮西時以所居松果不足以盡大觀故去而遊于天下山水之邦以極其勝今既出而仕矣其所待以適其適者冝若與隱者異須然所寓猶以松泉命亭而人或弗諭也余則為之解曰茂松清泉世之所賤軒裳圭組人之所貴昔天子問隱者以所須蓋欲以所貴易所賤也而隱者不屑焉今德新既已有其所貴而猶不忘其所賤雖所處與隱者異須而所樂與隱者同趣此惟逰于物之外者為能然也方天下多故淮西最先𬒳兵而松泉之廬得無已鞠為榛莾狐兔之墟否乎而嚮之所謂山水之勝如金陵武夷天台者又舉目有風煙之異雖欲如曩時窮深極幽以肆其所厯不可復得而東南都會莫盛于錢塘然山川人民僅存于百戰之餘者蓋亦憔悴無聊久矣此德新所以不得以其胸中所素抱負者自髙于軒裳圭組之外而其入則贊廟謨出則參機畫鞠躬夙夜弗遑寢處者其志蓋將左右公卿將相披荆棘剗榛莾逐狐兔而殱之天其或者復使斯民有所休息則山水之勝庶幾復可以解鞍停策窮其深而極其幽然後脫軒裳解圭組還之朝廷乞身歸老而茂松清泉隱者不得私也嗚呼天下之樂復有加于此者乎然非逰于物之外者不能知也故余申其説為後記書之亭中以伺且以釋或者之弗諭云至正二十年六月乙巳記夷白齋藁卷之二十九
