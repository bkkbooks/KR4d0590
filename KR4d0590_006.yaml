front:
  text: 夷白齋藁卷之六
  hash: sha256:2657b9b2b9bbba4fd277b10a2b71c549abce96b63d9dc8cf82bcdb25d5f25b5f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_006-1a}
body:
  text: 臨海陳基著金華戴良編古詩雜言沈孝子行送醫師沈伯新吳淞江來自天目山奔流倒海無時窮川原藪澤似棊布雞鳴犬吠俗與太古同郡人沈孝子築室居其中辛勤自食己之力仰事祖母年九十黃髮兒齒顔如童日出適田省耕作日入歸家奉溫凊一室之內慈孝敬愛宛有齊魯風暇日閉户讀書史閨門上下皆肅雍省身齋戒喜且懼飲膳湯藥必先嘗此心謂可對昊穹至正十年夏六月祖母遘疾在床蓐涕泣側息憂忡忡再拜躬迎伯新甫醫貴三世術乃攻伯也切脈不用藥急進臘黍甘如餳以意取效超庸工起居食飲𣸪如故妙術隂與孝感通夀為五福首孝乃百行宗醫師掌百藥為人恤􅘃痌吾聞孝子丗積德慈愛固應天所鍾如何俞扁去己久世上𣸪有太倉公我歌孝子行送君勿匆匆但願人皆躋夀域樂有孝子心融融嗚呼樂有孝子心融融煮雪窩為玉山作草堂之仙人隱居玊山陲平生盜泉不肯飲惡木不肻栖􅈬山為窩煮山雪雪勝玉泉茶勝芝煮以􅌲蠢彭亨之石鼎然以蹙縮擁腫之樹枝恍聞松風洶湧出澗壑化作雲氣爛熳干虹霓匡廬道士來會稽嬉笑怒罵皆成詩尋常一飲即一石踏破甕中天地皆醯雞不厭陶家滋咮薄却愛玉川文字竒舉碗猛吸如鯨鯢悠然相對孰賔主窩中自來無町畦乃知渾沌鑿不破縱使先天之子亦莫窺端倪逍遙笑殺南華老夢與胡蝶隨春迷我今有所思寄于山人我今有所思乃在越山陲越山遙遙青入海秦望特起上與浮雲齊客有匡廬虗白子昔如吳門歸會稽口誦黃庭經頭戴白接㒿往來倐忽不可知上下風雨騎虹蜆仰參赤松子俯接青牛師左手揖廬敖古手招安期醉援北斗酌滄海長嘯濯足脫巾挂在扶桑枝我嘗遇之玉山下要我八極同逰嬉塵緣未割妻子纍一去不得相追隨天台仙人馬子徴陽明洞天曾見之遺書逺報雪巢子煙波萬里來無時扁舟我𣣔東南歸鑑湖之水清漣漪授豫玊匱書茹子苗山芝逍遙廣莫超希夷翩然却笑賀狂客為誰白首居鴻禧空眀山人歌丹丘子空明生結髮為吏千公卿懸河之辨從𣸪衡法家之書刑與名少年騎馬入公府白首尋真歸赤城赤城仙人下青冥手奉寶籙遙相迎虛皇勑住委羽洞服事劉郎為弟兄劉郎乘風朝紫清雲為旗兮霓為旌盡留瓊田教種玊約以不死三千齡三千齡在何許來往東吳𣸪西椘看成珠樹著三花笞鳯鞭鸞却輕舉烏夜啼引閩人王䴚為淮東元帥府奏差𬒳誣繫獄部使者使泰州尹趙子威讞之平反其冤烏夜啼在庭樹烏啼啞啞天欲曙阿兒被誣身繫獄盡室煩冤受茶毒烏啼胡為繞吾屋下堂喚婦起聽烏忽喜淮南兒有書書中報道兒罪説此樂欣欣天下無兒歸拜母為母説泰州使君當世傑執法霜臺舊司臬眀如青天皎如月冤獄平反解縲紲已死得生誣得雪海可枯山可裂使君之德不可滅烏啼愛我庭樹枝我愛使君君不知使君歸朝奉天子日日聽烏為君喜玉笙引金華仙人周子竒能吹三十六琯之參差疏音間節傳自女媧氏上引浮丘公下接王子晉來往伊水之濵雒水湄緱氏山頭雜宫徴龍吟鳯噭能使鬼神上下莫得窺端倪昔年西王母翩翩會瑶池親遣侍女董雙成學得妙曲崑丘歸至今縹渺十二之玉城餘音長繞蟠桃琪樹枝請君休汗漫我欲與尓期若非鈞天即洞庭仰參軒轅帝俯友虞庭夔後天而老不死長追隨周子竒此曲莫向人間吹律詩五言興福院會秦文仲學古二首蘭若臨江次層城壯海壖地通重譯貢門泊孝廉船人事桑田後春光榖雨前未忘栖遁迹來此𣣔逃禪兵革艱虞際思君減帶圍折衝存爼豆贊畫忝樞機交義陳雷古㓛名管晏微江城花爛熳莫惜典春衣送謝參軍參軍趨府日父老借恂時重為蒼生起當酬國士知㓛名君不沗筋力我將衰送别春城暮深杯莫厭持次韻答髙元善迹忝芙蓉幕心依虎豹關老驚詩鬢短貧覺酒尊慳特逹髙書記清新庾子山多情憑塞鴈時寄一書還送鎦治中椘楚平津彥翩翩千里駒起家參上郡振轡騁康衢别駕恩非沗巖君德不孤青雲有知已寧許戀南湖癸丣二月十二日常熟阻雨寄吳門兮省同官一棹琴川路頻年此往還海風寒挾雨戍火夜連山澤國龍分節邉城􅍑據關故人南省幕退食佩珊珊琴川懷古揖讓思虞仲弦歌憶子遊學文須到魯議禮必宗周爼豆今如此干戈苦未休慚非割雞子安敢話屠牛十六日開船值北風大作𣸪泊北門風急江難渡春寒雪更飄濟川雖有楫跨海恨無橋使節辭吳近官軍去椘遙北門仍繫纜山雨夜蕭二十一日渡江渡江風日好挂席近扶桑萬古天為塹中流葦可航導川思夏后跨海詫秦皇跋􅍱艱危地低頭愧孟光三塔寺訪寬老禪人世難行路禪房獨掩扉鶴飛知客至雨歇見龍歸天地干戈滿江湖故舊稀愧非韓刺史臨别更留衣訪夲覺欲長老不遇時𣣔公在南堂退居來訪南堂老扁舟興盡還耳聾猶説法地僻謾投間掃竹逢春雨開門見逺山題詩託端叟為報鬢毛班留别仲銘二首南國新開士前身休上人賦詩追鮑謝揮翰擬梁陳雨歇水西寺花飛劫外春相逢又相别離思滿江津方外碧雲句人間白雪歌江湖相見少塵世别離多水宿隨鳬鴈岩栖憶薜蘿何當謀一壑老我共婆娑送姪讓從軍武安送尓徐州去秋風幾日程水通彭子國山擁椘王城虎帳氍毹暖犀船五兩輕從軍古云樂今我不勝情世亂難為别他鄉𣸪暮秋愧余叨入幕念尓獨登舟季子裘空弊班生筆誤投恨無田二頃歸老石湖頭夷白齋藁卷之六
