front:
  text: 夷白齋藁卷之二十一
  hash: sha256:5ade00c4547484f7cdf89024e31598c1826546f0686af5723e3a0c3a90ff39a2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_021-1a}
body:
  text: 臨海陳基著金華戴良編序送覺上人序昔内翰袁文清公之歸老四明也章甫搢紳與夫佛老氏之徒仰喬岳而瞻景星者慮無不登其門焉盖其學問之博洽議論之源委文章之雄且深蔚然師表一世而吾郷覺上人宗聖實與及門者也公既厭棄人間丗上人挈瓶錫西􅍱錢唐聞大浮屠忻公咲隐倡道金陵因不逺数千里徃從之㳺方是時中朝鉅人執法南行臺如濟南張公夢臣東平王公繼學並慕晋宋王謝孫許習鑿齒之倫與支道林釋道安軰往来文采之相輝聲詩之迭和亦一時儒釋流風之勝也㢤上人扵是獲望其精光閒其餘論退而叅之以儒墨慱之以騷雅間以所長簸弄雲月陶冩性靈徃徃為諸公所稱賞始侍故侍講金華先生黃公扵錢唐㑹上人自金陵来觧行李出所作余從而諷詠之飄飄然有凌虚御風之意余故以心敬而貌随之矣未㡬余從北方囬寓吳門聞上人居錢唐佛寺衣麤食糲晝夜脩持甚力㦯長跪頂佛竟夕不寐其刻苦猜嚴如此囬視向来罷精神雕琢世諦語言為文詞将厭悔且不暇又安知世間所謂榮瘁寵辱為何如事耶今年夏上人来自吴興年且六十矣與之坐道舊故語離濶乃知其徒強上人主寺廣化山而非其志也頃之尋還吴興徵言以為别自文清以来數十年間諸老淪謝殆盡而金華先生亦不可復作矣其門人賔客散之四方兵後相見亦有如吾兩人者乎上人始以文字為禅恱終以脩持為義諦又終也不能不為其徒所強吾聞之安時䖏順古之所謂縣觧也上人歸見吳興陸使君吳别駕為我謝曰治郡甚勞苦外過從欲得詩僧齊已之流信道原覺宗聖其人也至正十八年夏五月夷白道人陳基序贈醫學提舉張性之序先王設醫師掌醫之政令與冢宰之属並隷天官歲終則稽其醫事而以十全為上其責亦甚重矣漢興史官論次百家而李柱國所校醫方事術亦得與六藝之文並守扵王官及宋蘇長公軰論秦漢間得失引醫為諭而卒歸之扵清净天下至今誦之近世河間劉氏戴人張氏東垣李氏二三子者作推明漢張太守之學上逹扵淳于公秦越人而卒折之以黃帝岐伯之書然其術不務為苟同盖時之先後㦯殊人之氣禀亦異治之之法譬之兵焉曰攻曰守未昜以一律論也大江之南士以醫名家者冝莫盛扵呉而劉李二三子者之傳亦莫盛扵今日余獨恠夫公侯将相薦紳大夫與夫編户之氓無問智賢愚不肖凡語醫必曰張君性之行省承制拜官又獨署性之提舉江浙醫學俾掌醫政而守王官物議無不韙之者盖以性之之醫事稽之則其收全功扵人者非一日矣今年夏行樞宻断事官淮南唐侯伯剛病憤懣舌本強澁手足痺不仁㦯以為中風性之診之曰此痰蓄扵中浸淫扵脉絡赱注扵四肢莭宣失度天和錯繆故病蹷耳非中風也法當理氣氣理則升降條逹憤懣自平如其言而愈盖性之用藥如唐侯之用法法貴乎防未然藥貴乎治未病昔子産治鄭孔明治蜀寛猛嚴恕酌時之中以防範庶民猶扁鵲之伎随俗為變以虞人之夭札也今性之治侯疾亦猶侯不劲捍以徼一切之功不猗違以徇難犯之勢視民所毒螫者謹除而去之噫性之固難能矣唐侯亦豈易為㢤盖論病以及國原診而知政此醫之善物也序而傳之豈徒以溢羙性之而巳盖将質之唐侯而與吾黨從政者揚搉焉此余之所不敢以苟譲為也至正十八年七月丙辰序送周信夫序太尉府妙蕳属僚淮南周君信夫由行樞宻断事官經厯進辟掾史至正十八年八月二日也断事官夏侯仲信唐侯伯剛旦日赱樞府揖吾黨而進之曰僕䓁辱待罪樞属頋所資以辰入酉歸鄮鄮焉曰與攘臂乎桎梏枘鑿間求所以折其衷而不可以斯湏㦯輒者周君也今引而叔諸三事之庭知人之眀則信無遺鑑矣然吾獄有所可疑事有所未允是非紛黒白混殽将奚所諮决乎語未既臨海陳基與經歴髙君元善都事王君敬甫謝之曰侯之言固當矣而㦯者猶有所未喻也夫操黜陟以進退一世之人物者𥘉奚容其心㢤亦曰公而巳爾昔者信夫甞以摳府掾與吾黨從事平章榮禄公矣其䖏心也恕其率已也嚴以鞠躬以趋事也整而暇其執筆以疇容議法賞必公罰必當殆權之輕重度之扵長短而規矩之扵方圎也文深而無害事脩而不伐正色而不可干以私及署經厯司畫諾俾羽翼侯䓁不啻如左右手此榮禄公之所属任而信夫之所奉以周旋者也今太尉以武濟時以文經國不愛玉帛與馬招来賢俊四方竒俛之士聞風而至者相望也列辟庶僚乃有忠謹老成如信夫者譬猶國馬之在范廐材木之産鄭林步驟中鸞和之音曲直適鈎縄之数而不使之叅緑耳以騁康荘友豫章而薦宗廟不㡬乎貴逺而賤迩徇其名不閱其實乎况馬蹄可以踐霜雪歲寒然後知松栢此掾史之辟其属任有重扵經歴者故不暇為侯䓁計也夫物理有輕重人事有長短應務有方圓執權度規矩之中而将之以嚴恕申之以整暇信夫其有彼此之間㢤泰之𥘉九㧞茅茹以其彚征吉伯樂在前侯䓁不能狎信夫而㽞之矣匠石在後信夫行有待扵諸公也侯曰子之言辯矣冝述以為序扵是乎書西湖書院書目序杭西湖書院宋季太學故阯也宋渡江時典章文物悉􅊞汴亰之舊既巳裒集經史百氏為庫聚之于學又設官掌之今書庫板帙是也徳祐内附學廢今為肅政廉訪司治所至元二十八年故翰林學士承旨東平徐公持浙西行部使者節即治所西偏為書院祀先聖先師及唐白居易宋蘇軾林逋為三賢後為講堂旁設東西序為齋以䖏師弟子貟又後為尊經閣閣之北為書庫實始収拾宋學舊板設司書掌之宋御書石經孔門七十二子畫像石刻咸在焉書院有田歲收其入以供二丁廩膳及書庫之用事逹中書卑以今額且署山長司存與他學官埓扵是西湖之有書院書院之有書庫實昉自徐公此其大較也由至元迄今嗣持部使者莭扵此者春秋朔望𫐠徐公故事未之或改也獨書庫歲乆屋弊板闕或有所未暇抗民好事者間以私力𥙷治之而事尋中止至正十七年九月尊經閤壊書庫亦傾圯今江浙行中書平章政事兼同知行樞宻院事吳陵張公甞力而新之頋書板散失埋沒所得瓦礫中者徃徃刓毀蠧剥至正二十一年公命釐𥙷之俾左右司貟外郎陳基錢用壬率其事尤工扵是年十月一日所重刋經史子集欠闕以板計者七千八百九十有三以字計者三百四十三萬六千三百五十有二所繕𥙷各書損裂澷滅以板計者一千六百七十有一以字計者二十萬一千一百六十有二用粟以石計者一千三百有竒木以株計者九百三十書手刋工以人計者九十有二對讀校正則餘姚州判官宇文桂山長沈𥙿廣徳路學正馬盛紹興路蘭亭書院山長凌雲翰布衣張庸齋長宋良陳景賢也明年七月二十三日訖工飾司書秋徳桂杭府史周羽以次編類􅍥之經閣書庫秩如也先是庫屋洎書架皆朽敗至有取而為薪者今悉告完既竣事公俾為書目且序其首并刻之庫中夫經史所載皆厯古聖賢建中立極脩己治人之迹後之為天下國家者必扵是乎取法焉傳曰文武之道布在方冊不可誣也下至百氏所述必有禆世教然後興聖經賢傳並存不朽秦漠而降迄唐至于五季上下千數百年治通有得失享國有短長君子皆以為繫乎書籍之存亡豈欺也㢤宋三百年大儒彬彬軰出務因先王之跡推而明之其道大著中更靖康之變凡詩書禮樂百王相沼以為軌範者随宋播越㽞落東南國初收拾散亡僅存十一扵千百斯文之緒不絶如綫西湖書院庫其一也承平以来士大夫家誦而人習之非一朝夕矣海内兵興四方騷動天下簡冊所在㦯存㦯亡盖未可知也杭以崎嶇百戦之餘而宋學舊板卒頼公不亡基䓁不佞亦辱與事者手訂而目讐之惟謹可謂幸矣嗟乎徐公收拾扵北南寧一之時今公繕完扵兵革搶攘之際天之未丧斯文也或尚在乎序而傳之以告来者不敢讓也至正二十二年八月丙子序弔徐莭孝先生序至正二十二年歲壬寅臨海陳基辱與桐川錢用壬俱以右司貟外郎待罪江浙行中書秋九月同叅平章吳陵公軍事扵淮陰冬十月十五日同率僚友出郡東門行三数里謁古儒先生莭孝徐公之墓偕行者江浙行樞宻院㫁事官秦都元輔行摳宻都事淮南湯鼎江浙行中書通事西夏王相嘉世禮掾史吴陵楊揖洎淮南行中書照磨惟揚劉惟敬實在焉城事甫觧嚴積雨乍霽霜氣始肅周視原野皆遺燹廢壘異農村漁市樵蹊牧徑與販夫賈竪相徃来通有無貿易者四皆是也今鞠為丘墟平䠂望坡陀𧺫伏皆殘阡敗冢狐兔岀没無禁古今陵谷變遷不知更㡬亂離其生食厚封都顯爵建旄樹纛以貴冨誇當時没以侯王公卿禮葬者不知㡬人矣百世之下頋獨求前代一老儒先生丘墓所在匍匐載拜奉牲酒薦享如弟子北面事其師然恐後荒榛莾蒼間㫁刻将仆相與赱其下藉草跪誦三復欷歔不能休至有感慨泣下者日且暮各上馬歸明日相見猶歎慕不輒口好事者形扵詠歌得詩若干首属基為之序夷白齋藁卷之二十一
