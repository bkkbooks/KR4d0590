front:
  text: 夷白齋藁卷之二十一
  hash: sha256:5ade00c4547484f7cdf89024e31598c1826546f0686af5723e3a0c3a90ff39a2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_021-1a}
body:
  text: 臨海陳基著金華戴良編序送覺上人序昔內翰袁文清公之歸老四明也章甫搢紳與夫佛老氏之徒仰喬嶽而瞻景星者慮無不登其門焉蓋其學問之博洽議論之源委文章之雄且深蔚然師表一世而吾鄉覺上人宗聖實與及門者也公既厭棄人間丗上人挈瓶錫西􅍱錢唐聞大浮屠欣公笑隱倡道金陵因不逺數千里往從之遊方是時中朝巨人執法南行臺如濟南張公夢臣東平王公繼學並慕晉宋王謝孫許習鑿齒之倫與支道林釋道安輩往來文采之相輝聲詩之迭和亦一時儒釋流風之勝也哉上人于是獲望其精光間其餘論退而參之以儒墨慱之以騷雅間以所長簸弄雲月陶寫性靈往往為諸公所稱賞始侍故侍講金華先生黃公于錢唐會上人自金陵來解行李出所作余從而諷詠之飄飄然有凌虛御風之意余故以心敬而貌隨之矣未幾余從北方回寓吳門聞上人居錢唐佛寺衣粗食糲晝夜修持甚力或長跪頂佛竟夕不寐其刻苦猜嚴如此回視向來罷精神雕琢世諦語言為文詞將厭悔且不暇又安知世間所謂榮瘁寵辱為何如事耶今年夏上人來自吳興年且六十矣與之坐道舊故語離濶乃知其徒強上人主寺廣化山而非其志也頃之尋還吳興徵言以為别自文清以來數十年間諸老淪謝殆盡而金華先生亦不可復作矣其門人賔客散之四方兵後相見亦有如吾兩人者乎上人始以文字為禪恱終以修持為義諦又終也不能不為其徒所強吾聞之安時處順古之所謂縣解也上人歸見吳興陸使君吳别駕為我謝曰治郡甚勞苦外過從欲得詩僧齊已之流信道原覺宗聖其人也至正十八年夏五月夷白道人陳基序贈醫學提舉張性之序先王設醫師掌醫之政令與冢宰之屬並隸天官歲終則稽其醫事而以十全為上其責亦甚重矣漢興史官論次百家而李柱國所校醫方事術亦得與六藝之文並守于王官及宋蘇長公輩論秦漢間得失引醫為諭而卒歸之于清淨天下至今誦之近世河間劉氏戴人張氏東垣李氏二三子者作推明漢張太守之學上逹于淳于公秦越人而卒折之以黃帝岐伯之書然其術不務為苟同蓋時之先後或殊人之氣稟亦異治之之法譬之兵焉曰攻曰守未昜以一律論也大江之南士以醫名家者冝莫盛于吳而劉李二三子者之傳亦莫盛于今日余獨怪夫公侯將相薦紳大夫與夫編户之氓無問智賢愚不肖凡語醫必曰張君性之行省承制拜官又獨署性之提舉江浙醫學俾掌醫政而守王官物議無不韙之者蓋以性之之醫事稽之則其收全功于人者非一日矣今年夏行樞密斷事官淮南唐侯伯剛病憤悶舌本強澀手足痺不仁或以為中風性之診之曰此痰蓄于中浸淫于脈絡赱注于四肢莭宣失度天和錯繆故病蹶耳非中風也法當理氣氣理則升降條逹憤悶自平如其言而愈蓋性之用藥如唐侯之用法法貴乎防未然藥貴乎治未病昔子産治鄭孔明治蜀寬猛嚴恕酌時之中以防範庶民猶扁鵲之伎隨俗為變以虞人之夭札也今性之治侯疾亦猶侯不徑捍以徼一切之功不猗違以徇難犯之勢視民所毒螫者謹除而去之噫性之固難能矣唐侯亦豈易為哉蓋論病以及國原診而知政此醫之善物也序而傳之豈徒以溢美性之而巳蓋將質之唐侯而與吾黨從政者揚榷焉此余之所不敢以苟讓為也至正十八年七月丙辰序送周信夫序太尉府妙蕳屬僚淮南周君信夫由行樞密斷事官經厯進辟掾史至正十八年八月二日也斷事官夏侯仲信唐侯伯剛旦日赱樞府揖吾黨而進之曰僕等辱待罪樞屬顧所資以辰入酉歸鄮鄮焉曰與攘臂乎桎梏枘鑿間求所以折其衷而不可以斯須或輒者周君也今引而叔諸三事之庭知人之眀則信無遺鑑矣然吾獄有所可疑事有所未允是非紛黑白混殽將奚所咨決乎語未既臨海陳基與經歷髙君元善都事王君敬甫謝之曰侯之言固當矣而或者猶有所未喻也夫操黜陟以進退一世之人物者𥘉奚容其心哉亦曰公而巳爾昔者信夫嘗以摳府掾與吾黨從事平章榮祿公矣其處心也恕其率已也嚴以鞠躬以趨事也整而暇其執筆以疇容議法賞必公罰必當殆權之輕重度之于長短而規矩之于方圎也文深而無害事修而不伐正色而不可干以私及署經厯司畫諾俾羽翼侯等不啻如左右手此榮祿公之所屬任而信夫之所奉以周旋者也今太尉以武濟時以文經國不愛玉帛與馬招來賢俊四方竒俯之士聞風而至者相望也列辟庶僚乃有忠謹老成如信夫者譬猶國馬之在范廄材木之産鄭林步驟中鸞和之音曲直適鈎繩之數而不使之參緑耳以騁康莊友豫章而薦宗廟不幾乎貴逺而賤邇徇其名不閲其實乎况馬蹄可以踐霜雪歲寒然後知松柏此掾史之辟其屬任有重于經歷者故不暇為侯等計也夫物理有輕重人事有長短應務有方圓執權度規矩之中而將之以嚴恕申之以整暇信夫其有彼此之間哉泰之𥘉九拔茅茹以其彚征吉伯樂在前侯等不能狎信夫而留之矣匠石在後信夫行有待于諸公也侯曰子之言辨矣冝述以為序于是乎書西湖書院書目序杭西湖書院宋季太學故址也宋渡江時典章文物悉􅊞汴亰之舊既巳裒集經史百氏為庫聚之于學又設官掌之今書庫板帙是也德祐內附學廢今為肅政廉訪司治所至元二十八年故翰林學士承旨東平徐公持浙西行部使者節即治所西偏為書院祀先聖先師及唐白居易宋蘇軾林逋為三賢後為講堂旁設東西序為齋以處師弟子貟又後為尊經閣閣之北為書庫實始收拾宋學舊板設司書掌之宋御書石經孔門七十二子畫像石刻咸在焉書院有田歲收其入以供二丁廩膳及書庫之用事逹中書卑以今額且署山長司存與他學官埓于是西湖之有書院書院之有書庫實昉自徐公此其大較也由至元迄今嗣持部使者莭于此者春秋朔望𫐠徐公故事未之或改也獨書庫歲久屋弊板闕或有所未暇抗民好事者間以私力輔治之而事尋中止至正十七年九月尊經閣壞書庫亦傾圯今江浙行中書平章政事兼同知行樞密院事吳陵張公嘗力而新之顧書板散失埋沒所得瓦礫中者往往刓毀蠧剝至正二十一年公命釐輔之俾左右司貟外郎陳基錢用壬率其事尤工于是年十月一日所重刋經史子集欠闕以板計者七千八百九十有三以字計者三百四十三萬六千三百五十有二所繕輔各書損裂漫滅以板計者一千六百七十有一以字計者二十萬一千一百六十有二用粟以石計者一千三百有竒木以株計者九百三十書手刋工以人計者九十有二對讀校正則餘姚州判官宇文桂山長沈𥙿廣德路學正馬盛紹興路蘭亭書院山長凌雲翰布衣張庸齋長宋良陳景賢也明年七月二十三日訖工飾司書秋德桂杭府史周羽以次編類􅍥之經閣書庫秩如也先是庫屋洎書架皆朽敗至有取而為薪者今悉告完既竣事公俾為書目且序其首并刻之庫中夫經史所載皆厯古聖賢建中立極修己治人之迹後之為天下國家者必于是乎取法焉傳曰文武之道布在方册不可誣也下至百氏所述必有禆世教然後興聖經賢傳並存不朽秦漠而降迄唐至于五季上下千數百年治通有得失享國有短長君子皆以為繫乎書籍之存亡豈欺也哉宋三百年大儒彬彬輩出務因先王之迹推而明之其道大著中更靖康之變凡詩書禮樂百王相沼以為軌範者隨宋播越留落東南國初收拾散亡僅存十一于千百斯文之緒不絶如線西湖書院庫其一也承平以來士大夫家誦而人習之非一朝夕矣海內兵興四方騷動天下簡册所在或存或亡蓋未可知也杭以崎嶇百戰之餘而宋學舊板卒賴公不亡基等不佞亦辱與事者手訂而目讐之惟謹可謂幸矣嗟乎徐公收拾于北南寧一之時今公繕完于兵革搶攘之際天之未喪斯文也或尚在乎序而傳之以告來者不敢讓也至正二十二年八月丙子序弔徐莭孝先生序至正二十二年歲壬寅臨海陳基辱與桐川錢用壬俱以右司貟外郎待罪江浙行中書秋九月同參平章吳陵公軍事于淮陰冬十月十五日同率僚友出郡東門行三數里謁古儒先生莭孝徐公之墓偕行者江浙行樞密院斷事官秦都元輔行摳密都事淮南湯鼎江浙行中書通事西夏王相嘉世禮掾史吳陵楊揖洎淮南行中書照磨惟揚劉惟敬實在焉城事甫解嚴積雨乍霽霜氣始肅周視原野皆遺燹廢壘異農村漁市樵蹊牧徑與販夫賈竪相往來通有無貿易者四皆是也今鞠為丘墟平楚望坡陀起伏皆殘阡敗冢狐兔出沒無禁古今陵谷變遷不知更幾亂離其生食厚封都顯爵建旄樹纛以貴冨誇當時沒以侯王公卿禮葬者不知幾人矣百世之下顧獨求前代一老儒先生丘墓所在匍匐載拜奉牲酒薦享如弟子北面事其師然恐後荒榛莾蒼間斷刻將仆相與赱其下藉草跪誦三復欷歔不能休至有感慨泣下者日且暮各上馬歸明日相見猶歎慕不輒口好事者形于詠歌得詩若干首屬基為之序夷白齋藁卷之二十一
