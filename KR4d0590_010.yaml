front:
  text: 夷白齋藁卷之十
  hash: sha256:c5928c083028810d03e7a7524d6c92b7a61f6a7da7229c93639db26e143ac068
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_010-1a}
body:
  text: 臨海陳基著金華戴良編律詩七言送彌陀保世衡聞人德機二解元赴省試一舉收㓛古戰場計偕同上𬗋薇傍手攀明月分仙桂足躡青雲見玉皇髙第世推唐甲乙直言人比漢賢良明年晝錦歸來日一色恩袍雨露香送丁太𥘉嘉德常二貢士赴省試兩賢携手上南宫挂席關河得便風欲把妵名題甲乙須將文字決雌雄一經昔向江東學萬里今看兾北空遙想殿頭臚唱畢五雲佳氣鬱蔥蔥送牛述善郎中還朝萬栁亭邊酒一杯馬蹄踏雪上金臺天門星應郎官至海岱春隨使節回宣室𣸪陪前席問上林曽壓衆芳開諸公若話東南事楚澤無冰有草萊一自淮安使江南舟次通州寄同幕諸公頻年共入嫖姚幕此日先乘使者舟海色曉迎龍虎莭天光寒動鷫鸘裘山川咫尺分吳楚河漢尋常近斗牛南鎖堰頭官栁樹春風相約繫驊騮狼山山色碧崔嵬秋半從軍臘底回夀酒欲歸吳下獻使星新自楚州來江城見月思聮句驛路逢春擬寄梅只待年頭便相會賸拌懷抱為君開由通州渡江白首輕拋種樹書謾陪帷幄強馳驅半竿紅日辭淮甸一席清風上海虞欲向中流安砥柱恨無長劒斬鯨魚晚投言子祠前路坐聽弦歌意有餘福山港口待潮吳山如畫楚江平消得孤帆半日程潮落沙頭才一尺舟停江口復三更時清不識風波險世亂方知性命輕坐擁貂裘待明彂臨流空愧魯連生癸卯二月十一日官軍彂吳門去年移戍秋將半今歲渡江春正分晉國偏禆歸宿將漢庭旗鼓屬元勳戈船十萬盡犀弩鐵騎三千皆虎賁却笑髙陽老狂客謾慿口舌下齊軍二十日福山港寄省院諸友漢將西征肅羽儀簡書日日有程期東溟潮上犀船彂南斗星橫虎莭移青入楚封山點點白添吳鏡雪絲絲美人宴罷芙蓉署一色銀花翠壓枝舟中看虞山有感一望虞山一悵然楚公曽此將樓船間關百戰捐軀地慷慨孤忠罵冦年填海欲銜精衛石驅狼願假祖龍鞭至今父老猶垂淚花落春城泣杜鵑二十二日狼山口觀兵官軍野次狼山口鐵騎犀船盡虎貙杼軸萬家供餽餉旌旗千里亘江湖膝行擬伏諸侯將面縛行申兩觀誅淮海父兄爭鼓舞將軍恐是漢金吾逰狼山寺三首天風吹上狼山頂看見扶桑日出𥘉淮海北來吞兩楚江湖南去控三吳珠宫貝闕馮夷宅古木蒼藤帝釋居為訪祖龍鞭石處拇窠履迹㝎何如鯨波渺渺四無涯閶闔天低手可排一塔倚空凌浩劫兩潮爭港撼層崖半晴半雨龍歸海衝暖衝寒鴈度淮安得乞身依佛日遍尋靈迹訪齊諧五峯相顧若枝撑力障狂瀾與海爭下界人居龍伯國上方僧住𣑽王城佛庖香訝山無蕨公膳腥嫌市有蟶王事匆匆騎馬去落花啼鳥揔關情寄朱佑之經歷老我思歸卧𬗋霞多君能賦吐天葩十年迹忝嫖姚幕千里身輕博望槎楚甸風髙塵沒馬蘇堤春暖栁藏鴉何時共喚西湖酒爛醉孤山處士家寄張長年都事南省郎官也好竒文章欲以古為師獨來楚澤從戎地長憶吳門並馬時二月西湖春爛熳百年北海酒淋漓此心頗與君同調一曲荷花歲晚期二十六日自通州赴淮安海虞城外經旬泊狼五山前信宿留六計西來思撓楚三軍左袒願安劉龍光夜吐雌雄劒魚尾朝銜甲乙舟今白南風催挂席浪花飛雪打船頭寄夏仲信太守韓壁翁經歷姚伯叔照磨淮海從征道路長美人千里遙相望無錢太守客盈座好事郎官書滿床花氣曉迷三竺寺栁隂晴繫六橋航懸知小隊行春處露􅊜馬蹄芳草香髙郵湖夜行天明過寶應秦郵城外望安冝帆飽風輕似馬馳三十六湖春欲暮一千餘里客來時背人鴻鴈歸何急近海魚鹽利不資農事及時兵有律便無神寶尓何疑二十九日至淮安城南十五里述懷欲向江湖覔釣磯此心長與事相違添丁未辨盧同計算老空知伯玉非淮甸草肥宛地馬楚州人著漢官衣將軍奏罷平西捷還許山翁倒戴歸到南鎖寄分省同官故人近在淮隂郡未見先馳尺素書知已每漸齊鮑叔論文只許漢相如便須為我占烏鵲不用呼童烹鯉魚自笑近新頭盡白強顔騎馬事穰苴三月十五日由淮安使江南别同官三月淮南栁色深相看去住兩關心鶯因求友聲逾切鴈為離群思不禁芳草將春青楚甸暮雲含雨碧吳岑遂初亦有平生賦何事驅馳雪滿簮三月二十五日由吳門使抗昔年戍浙今移楚新歲趨吳𣸪使杭南北此身皆客計東西何處是吾鄉野花送别紛紛落官桞縈愁故故長謾道五湖春色好為誰銷得鬢邊霜閏三月四日夏仲信太守邀逰飛來峯和顧子經照磨韻千岩萬壑響奔雷分得西天小朵來雲氣滿林山韞玉松隂繞寺榻生苔煙霞逺迹何當遂猿鶴留人未擬回今日使君蘇白輩醉歸城路近三台飛蓋今朝天笁寺泛舟昨日小蓬萊五馬旌斾三月暮四山煙霧一時開蒼藤古木藏靈鴛絶壑奔流吼怒雷使節行行趨兩楚碧雲回首鬱崔嵬分省諸公邀西湖宴集湖上相逢宴屢開𬗋薇花下約同來水光釀緑凝歌袖山色分青入酒杯蛺蝶影隨羅扇動琵琶聲逐畫船回獨憐英骨埋芳草南拱枝頭蜀鳥哀閏三月七日過三塔寺留别寬老軺車來往每匆匆此夕相看一笑同軒外竹添千箇緑樹頭花吐萬年紅茶烹日鑄龍分水榻近雲巢鶴語風梔子雨肥蕉葉大恨無佳句續韓公閏三月七日泊舟三塔寺新仲銘長老出城相看我愛水西新仲銘道空諸友説無生出城看客意最古把筆賦詩才更清杜若洲邊春𣣔暮鴛鴦湖上雨初晴十載間闊重相見深杯寧惜為君傾吳江釣雪灘頭暫艤舟晴虹千尺飲長流吐吞日月天無際出沒魚龍地欲浮濟世誰當扶砥柱乞身吾盍老滄洲裁書為問天隨子𣏌菊荒來又幾穐初八日阻風宿吳江無礙寺龍伯留人暫艤舟偶過西寺得詩流僧窗煙景五湖晚澤國雨聲三月秋我欲棄官來釣雪誰能作賦共登樓此身何日都無礙共向毗盧性海逰西寺送信道元長老還吳興楊墳寺翔鳯山前水亂流垂虹亭畔月如鈎賦詩不數湯休輩入社獨慙元亮儔夜雨西窗重剪燭春風南浦共維舟它年一榻封禺下笑傲能容此客否次韻謝元懿移居後見寄羡君早學公孫龍堅白因時辨異同狡兔窟多寧逺害鷦鷯技小不禁風山林夢寐隨麋鹿賔主情懷類駏蛩賴有平生周閣老時時分祿餉而翁手種新松引舊蘿人間得失等南柯粟儲已罄琴書在家具不如車兩多短屐肯嫌苔徑滑髙軒時向席門過新詩惠我皆珠玉報乏瓊瑶奈若何夷白齋藁卷之十
