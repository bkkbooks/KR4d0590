front:
  text: 夷白齋藁卷之十五
  hash: sha256:f19ba54bc7f44a2bf15513143db2dff0696e842cd6d685f5c55d0dce3a0656d9
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_015-1a}
body:
  text: 臨海陳基著金華戴良編序贈宋太醫序先王設醫師以待邦之有疾者其軄周官其書神農子儀其術扁鵲倉公也吾觀扁鵲之治醫如良農之治稼無他亦去夫為苗之害者而巳故醫之有藥石鍼砭毒熨也猶農之有耒耨錢鎛耰耡也而其為人祛疾也猶農之禾去稂莠也稂莠之不去雖有甘雨不得以為澤癘疾之不祛雖有梁肉不得以為味甚矣㢤醫有類扵良農也雖然人情之所慎者藥石所懼者鍼砭所不喜者毒熨非有甚弗獲巳孰肯以三者加扵父母所不忍之身如宋君之扵吾兄㓜子之瘍也㢤盖父母之望子猶農夫之望歲也父母不以梁肉而廢藥石良農不以甘雨而廢耰耡今使吾家児秀如苗頴如榖而堅且好焉宋君之施亦侈矣詩云無言不詶無徳不報若宋君者其可以已扵言乎不可已扵言而言者詩人之意也宋君字伯亨吾兄則敬徳父云送王季境詩後序昔江折行中書省叅知政事浮光王公紹隆閩國公世家群公子皆温文醖藉李境尤特以精白柔毅俶儻有器識流聲扵人今年春将北上亰師中吴大夫士非先公賔客之選則昆弟交從之彦咸為詩為文以貺季境臨海陳基復為之言曰先參政以公輔魁宿之材遭國家承平之運部符授鉞揚莭秉麾致位政府出入中外餘五十年廩廪有君子風季境結髮侍公左右雅不喜弄絲竹􅊞紈綺為華靡事朝夕之所薫蒸耳目之所漸漬皆勤王字民與社稷同休戚之道夫千里之駒超乗之足生扵范鞅之廐長扵造父之手既彂軔閫外復振䇿周行而伯樂之徒又持千金中九衢以俟其售為國馬也無疑矣雖然所貴世家公子者以能纂乃舊服如先叅政之扵閩國公叅政公之流風善政沒世不忘太常冝有謚國史冝有傳神道冝有碑季境瑰瑋克肖人方慶公有子則其所以為公不朽計者冝在斯行也基不倿敢以此私扵季境亦庶㡬贈言之遺意云尓馬千户遺愛詩序松陵扵和仲来致崇徳父兄之言曰前鎮守邳州萬户府左翼千戸馬侯有徳扵吾州其去也樹豊碑記遺愛而嗟歎之不足又形扵謌詩盖公好惡詩人之情也願為之序余雖不識馬侯而崇徳之人為可信其意若曰馬侯在鎮兵不敢耴民草一束粟一升戍卒不敢椎畊牛聚博徒縦私鹺徃来它營軍不敢無故輒入境旗鼓壁壘百倍常時而為民病者息使商者安扵市畊者安扵野皆侯之賜也侯亦務盡其職而已非欲使吾不忘而吾不能不侯是思此詩之所以作也嗟夫馬侯職不過千夫長食不過五品禄一鎮崇徳而徳之在人若此荀卿有言善附民者乃善用兵者也使執干戈以衛社稷者皆如侯焉民有不附者乎侯勲閥爵里與夫立官從事見扵碑者茲不著著其作詩之意囙和仲以授崇徳之人為我謝曰大丈夫戮力取封侯多在軍旅間吾聞志扵㓛名者富貴不足以動其心侯有文武才願自愛乾坤草亭詩序余熟西昌鄭氏之賢乆矣今年春鼎夫由天台棄官與其從子士亨過吳始相識鼎夫宦㳺四方聲稱藉甚薦紳大夫為文為詩以述其乾坤草亭之勝鏗乎金石之奏粲乎黼繢之陳也以余不佞俾為之序余嘗恠古今室屋之盛冝莫如金張衛霍而有志之士恒獨慕夫南陽之草廬瀼西之草堂而乾坤草亭云者盖草堂詩語也昔諸葛孔眀躬畊隆中自許不頋仲樂毅杜子羙獨慨然以伊吕伯方之及其自比又直以為稷契盖二人之用舎不同出䖏亦異然百世之下頌其詩讀其書而其忠君愛國之心繾綣惻怛之意雖與日月争光可也然則南陽之廬瀼西之堂風聲氣烈曠世相望不以其人乎鼎夫瓌瑋闊逹尚志千古開口論當世利害爛焉如龍泉太阿人莫其鋒退而察之未始不中肯綮也今引身髙蹈将歸草亭益乎子羙所以方孔眀與其所以自謂而充其忠君愛國之心焉異日出䖏或者不詭昔人則斯亭之在乾坤庸知不与南陽瀼西者相望乎囙推夲其歸草亭之意為之序若夫締􅌟之儉檏花竹之敷秀見扵詩若記者兹可以略云江月樓詩序金山天下竒觀也浮圖寳坊特起大江之中而江月樓在焉樓為龍江浩上人安禪之所而其扁則故江浙行中書叅知政事浮光王公之所書且賦詩者也至正𥘉元寺菑而樓不能以獨存上人歸自吳門實始重構規制之偉視昔有加而江左之峯巒淮南之烟樹與夫海霞島霧風颿浪舶變化出沒扵飛簷曲檻之外者盖無時而不可愛至扵江空月白以天為際一波不興萬動俱滅而所謂天下之竒觀不越几席而盡得之則斯楼也金山之最勝者乎曩歲集賢學士張掖劉公崇文少監鄱陽周公代祀南鎮還過朱方而余辱與郡推官金華張君率性從二公至其䖏覧山川之雄酌中􅍽之泉上下古今竟日而去未㡬上人命善盡者繪樓為圖凡嗣王公而賦詩者咸以次録之且以書抵吳門俾余為之序夫上人居光明之蔵㳺浩劫之始湛乎太清與智同圓一碧萬頃與性同軆又豈世諦語言所能擬議㢤然詩家者流詞源足以灌七澤筆力足以驅三江彂揮造化之微凌厲鬼神之表而景外之景象外之象牢籠漱滌靡有遺思然則世諦語言雖不足為上人道而意外之旨天機朗詣非上人亦何足以知之頋余㳺乎方之内扵斯樓也未能盡大觀又烏足以語江月乎然俯仰三數年張掖公以甘肅行中書左丞出奠西土鄱陽方入踐䑓閣張君近擢官海虞而上人亦去主名刹扵浙水東望関山之蕭條撫流光之徘徊而疇昔之思寕無介然扵胸中乎是則不可以無言也扵是乎書送強彦栗北上詩序至正十三年春主上用宰相之請命省臣兼大農太府出泉幣開墾西山保㝎河間檀順之田遣使諭江淮有能募農入畊者以多寡授官有荖吳人強君強栗以故衣冠家畊學練川里中年盛有識量間歲家燬扵盗刻苦奉父母自樹立為人喜事聞使者且至則欣然曰此盛舉也吾欲㳺亰師乆矣今此其時乎乃白父母募良農具名上使者即日取常熟州判官告身以歸遂戒行李率農人偕使者北上祖道闔閭城外吴大夫士與彦栗逰者爭為歌詩餞之夫士之出䖏用舎視時何如耳方今聖天子紹隆丕基賢宰相捴文武大政前年治河決去年平徐㓂四方萬國日􅈬厎寜今又除草莱辟田野崇本抑末敺㳺食之民轉而歸之農使各自食其力變潟鹵為稲梁收干戈為耒耜興富安長乆之利建萬世不㧞之業嗚呼盛㢤此有志之士戮力就㓛名之秋也彦栗行矣天子不吝爵以勸士宰相不斳財以劭農勞心者身榮勞力者家給将見漳水之利不專扵鄴泾水之㓛不私扵雍倉廩實禮義興而頌聲作矣事㓛告成明年彦栗自北方歸拜父母吳大夫士舉酒相慶尚能為彦栗賦之送宋縣尹詩序至正改元余客亰師清江宋君子與赴贑州從事中朝能言之士上而公卿大夫下而布衣韋帶爭為詩文餞之子與瓌竒博逹誦詩書六藝百家之言攻詞章有器識由成均上舎生入藝文監為令史聲稱藉甚其出為郡從事也再遷而為常山縣尹行次吳門吴門之能言者復争為謌詩餞之以余辱有一日之雅俾為之序夫十數年間兩送子與赴官皆得操觚弄翰為文詞以厠羣贈言之末余豈能言者㢤特以常山之得賢令長甚扵贑州之得賢從事雖欲巳扵言不可也盖子與為從事時枹鼓不驚田野無事官閑政暇得以詩酒從郡太守優㳺山水之樂非若常山之民飢者待哺寒者待衣疾苦顛連噢咻呻唫者之待拊摩煦嫗扵子與也嗟乎縣令與從事不侔今曰與曩時亦異然不遇盤根錯莭無以别利器士大夫𧺫諸生為縣令亦可以行其志矣子與瓌竒博逹而行之以豈弟将見䖏縣令如從事視今日如曩時而常山之民猶赤子之得慈父母矣政成民和吾恐朝廷不以子與私常山而能言之士将不止為文詞送子與為牧宰而巳余雖不敏尚能執筆厠群公以俟至正十三年三月庚寅序夷白齋藁卷之十五
