front:
  text: 夷白齋藁卷之八
  hash: sha256:7c4d666215e4d8db021d9f96c9fe8b1c420af19f83fe658ca49ab1d3f59c2e4c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_008-1a}
body:
  text: 臨海陳基著金華戴良編律詩七言次韻鄭有道喜王季野府判南歸二首故人日下拜官歸河水南來似帶圍策馬逺遊天府勝食魚偏愛錦江肥蠶叢故國山猶在望帝荒祠鳥自飛萬里欲將慈母線芙蓉城裏製春衣海榴花放客南歸喬木參雲揔十圍緑蟻奉親浮臘味黃羊充饌割秋肥恩承閩國榮三釡心切灤都望六飛錦里它年須報政中天風露􅊜朝衣次韻伯行投贈存齋風捲浮雲雨滅埃栁隂池館白蓮開放舟有客尋源至問字何人載酒來剡曲願從安道隱茂陵空歎長卿才角巾歲晚東林下短策逍遙步𬗋苔三用韻喜季野歸手攬繁弱接忘歸燕山射獵雪打圍駝鳴關口曉風急馬牧原頭春草肥鄉樹喜瞻親舍近蜀人爭候使皇飛慷慨平生王子贛奮身叱馭肯沾衣寄季野積雨東臯如早秋公子不來令我愁題詩每憶許玄度賣藥敢期韓伯休栁隂繫纜水數尺竹裏讀書風滿樓長夏林塘何所似浣花溪上瀼西頭次韻劉德方經歷綺席無塵宴景光佳人宫樣學時粧座傳白雪髙難和澗采香芹淨可湘緑水紅蓮新漕幕𬗋薇青瑣舊朝郎鳯凰城裏曽聮騎一路看花到上陽送徐勉之慈湖書院山長兩度秋風刷羽儀一官江海尚棲遲簿書舊屈諸侯掾經術今為學者師天上文章回北斗人間聲教極東夷殷勤束帶叔堂日絶學慿將已易推送錢士能建昌知州建昌使君能且賢青春結客五雲邊致身得近二千石事主巳垂三十年天削匡廬開菡蓞月明彭蠡浸嬋娟行春處處花如錦𥜗袴歌中咽管弦送王夀翁歸閩十日輕飈送海舟七閩南去近東甌掉頭欲學孔巢父飬子不慚陳太丘蠣房石暖隨時采崖蜜風酣帶露收故園歸老平生願殊勝官封萬户侯次韻答秦文仲二首艤舟復向三江口載酒欣逢二仲來丘園束帛已加璧將相求賢無棄才栁色緑欺頭上雪桃花紅映掌中杯也應别後無知已從此柴門不浪開婁江繫纜巳十日故舊獨逢秦與文氣壓元龍餘子服賦髙司馬九重聞西山拄笏聊容我東閣招賢欲待君解却金貂換官酒賞花時節正春分婁江雜詩二首畫鷁東來肅斾旌郊原十日喜春晴彎弓看墮雲邊翮騎馬同登海上城欲向草萊詢隱德每因稼穡見民情自慚肉食還無輔慟哭空悲漢賈生百雉堅城鎮海頭霜風中夜肅貔貅乾坤浩蕩鯨波息井邑蒼茫蜃氣浮民瘼東來皆可念妖氛西望未全收將軍莫負黃金印一鼓歸封萬户侯與文學古秦文仲逰至正觀西郭維舟水滿津從容鄭圃得尋真蓬萊路隔人間世桃李花開劫後春風雨或聞蛟杼響弦歌曽與草堂鄰交遊不沗羊求輩歲晚相期迹未泯次韻答秦文仲郭羲仲聮句見寄客路尋常江海上春光強半雨聲中習池無酒醉山簡蓮社有心期逺公香燼旋溫婆律火茶煙輕揚石楠風不因二仲聯詩至安得從容一笑同次韻錢都事誠夫海上書事左掖郎官漢客卿樓船頻􅍱海濤平夢騎鸞鵠三山近膽落鯨鯢一劒橫南斗星移天使下東吳兵振島夷驚須君早決平妖策仗節歸朝奉聖明送誠夫使吳門督漕事蒹寄分院同幕諸公挂帆南斗略扶桑奉使寧辭道路長轉漕𣸪輸滄海粟勤王爭羡𬗋藢郎風生漢節蛟龍避花繞吳宫雨露香同幕故人如見問為言相憶鬢毛蒼春日邵氏園池寂寞園林帶夕暉昔年曽此戀芳菲栁塘水暖鴛鴦浴花徑風酣蛺蝶飛蔓草拂衣人不翦畫梁無主燕空歸洛陽池館關興廢我欲春山賦采薇送胡宣使赴都進表使者樓船上九天鯨波不動一帆懸表章入奏三千里海宇中興億萬年夏后山川仍職貢漢家勳業重安邊遙知此去多恩澤帽壓宫花錫宴還送髙起文歸越兼簡陳伯昻王彥強昔年同客百花洲繡幕朱簾映綺樓歲月幾何成契闊兵戈相見獨綢繆開樽坐對吳山雨挂席行歸禹穴秋最憶吾宗陳伯子笑談真有晉風流甫里祠前憶舊盟朝餐把菊暮􅐜羔忘形直到葛天氏共飲况有申屠生古來結交貴知已亂後離别難為情西風又鼓濤江柂王衍為君雙眼明寄楊文舉經歷會稽從事獨逶迤拄笏西山秀入眉欲振家聲遵伯起不將文法泥宗師風塵此日淹騏驥霄漢它年見羽儀一曲桓伊江上笛夜深應有老龍知寄顧仲贅為問平生顧文學離居近日𣸪如何秋髙禹穴宦情薄雨過越山詩興多久客念君髭未白從君老我鬢先皤鑑湖一曲元無恙歲晚相期載酒過次韻謝捴管送梅州判還崑山畫船檛鼓待潮回山色留人不受催官酒醉淹羅袖􅊜離筵愁聽竹枝哀秋風老憶淮南桂暑雨晴收海上埃莫學君家子真叟變稱名姓不歸來次韻謝侯寄梅州判昔日吾宗陳太丘為言梅福政偏優陳都事元禮嘗權知崑山州事魚鹽爭集海市曉雞犬不驚田社秋奕世羡君仍吏隱一㕓老我欲歸休裁書更謝錢塘守佳句難將雜佩酬次韻謝侯書懷使君五馬早承恩𥜗袴聲傳逺近村可為長生居鄭圃每因清嘯過蘇門香凝燕寢秋將肅露浥銀床井不渾同樂堂中賔客盛旋烹新茗當開尊十一月晦與同幕諸公登南髙峯因過湖上小集二首共上南屏第一層海風吹鬢雪鬅鬙山盤地脈來天目城抱江流似蔣陵近郭晝行多畏􅍑並湖寒盡未收冰倚闌間説承平事知是昆明劫外僧落日湖頭艤畫船買魚沽酒不論錢共過天下登臨地却憶國家全盛年緣水映霞紅勝錦逺山凝黛淡如煙相携此夕干戈際一聽笙歌一慨然正月五日省院諸公飲吳南城每因公事少從容今日傳杯興頗濃飲散城南催畫鷁夢回江上聽踈鐘長風萬里飄歸鴈疊浪千層駭蟄龍同幕故人期不至曉山回首鬱巃嵸泊舟垂虹橋訪南北兩山寺候蔡都事彥文泰伯城中不少留垂虹橋畔却維舟佛燈下照蛟龍宅蓮社平分寫鶩洲王事有程塵沒馬僧心無垢月涵秋多情為待同袍者遍倚闌干不下樓次韻彥文寄謝省院諸公二首西山雪後色愈妍拄笏相看每自憐豈有異才參廟略謾陪時俊列賔筵玉笙錦瑟留人醉翠葉銀花壓帽偏却笑當年潘騎省為誰雙鬢早皤然此日東吳接勝逰風流欲與古人儔城南官酒春𥘉熟湖上魚罾晚未收才愧機雲還入洛切髙絳灌重安劉謀參帷幄輸公輩巢父歸歟盍掉頭次韻孟天偉郎中看潮十首海上初看一線低須臾排突與山齊平吞百粵天為塹雄障全吳石作堤浩浩鯨波流似帶紛紛蝸角鬪如雞世間别有風濤險莫向平途信杖藜天風吹海恣崩奔一擲坤維勢欲翻正尓斷鼇安地軸可容持鼓過雷門驚濤怒激英靈氣斜日潛銷壯士魂却笑故都間士女治逰歸去近黃昏江源來自歙山幽潮勢慿陵江上頭𬗋蓋黃旗收王氣素車白馬踏清秋至今故老猶興慨自古忠臣不自謀渺渺雲邊孤鳥沒豈知人世有恩讎八月十八怒潮生猛于突騎白於繒風掀雲島神龍化雷吼天門赤鯉騰樓船入海仙難問鴟革浮江史可徴揚旗勇踏濤頭去除却吳兒世不能千古英雄恨未銷海風吹上浙江潮怒驅貔􅍑誰能敵雄壓鯤鯢不敢驕踏浪掀旗空逺迓臨流捐𬒮若為招扁舟浩蕩身先退輸與陶漁共采樵雪湧潮頭萬疊多秋風奰贔吼靈鼉直疑碧海金鼇擲𣸪恐隂山鐵騎過勾踐㓛名今寂寞麻姑消息近如何慿君更闡神明力翻却蓬萊弱水波秋風釃酒待潮生渾似羅江吊屈平地下有靈驅海若人間無主聽阿衡恩讐莫辨君親分忠倿難逃今古評寂寞長洲赱麋鹿不堪眀月棹歌聲千古東南詫海潮摩挲強弩未全銷氣乘日月分盈縮聲振山河欲動搖擊楫中流歌慷慨倚闌斜日鬢飄蕭錢塘官酒秋仍緑更與靈胥酹一瓢風起城南思慘悽獨携長劒倚長堤未談秋水驚河伯先跨濤江掣海鯢力障狂瀾扶砥柱手揮妖祲豁坤倪東流不盡憑闌意長笑歸來日已西每因潮候卜災祥今歲潮頭百尺強千犀弩彂鯨鯢吼兩乳峯開龍鳯翔乘槎直欲訪河鼓懸水不須誇吕梁徙倚江亭吾已老海風吹面髮蒼浪夷白齋藁卷之八
