front:
  text: 夷白齋卷之二十
  hash: sha256:324527c85a2fdcd8486b31c446f8b994b6d1f9be7e324fe95061cd75aeadfcd8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_020-1a}
body:
  text: 臨海陳基著金華戴良編序陳惟寅字序豫章陳氏二丈夫子奉母夫人居吳門貧而善飬曰汝秩字惟寅者其長也間謂余曰吾名與字夲乎虞書命伯夷作䄮宗之言蓋寅者敬也子幸為吾序之昔唐虞君臣告戒之際反覆丁寧不越乎敬而已方其命九官也有司空而降凡二十有二人其言敬者不一而足然至于䄮宗則先之以夙夜惟寅申之以直哉惟清終之以欽哉此三言者雖若專為伯夷而彂然推而言之則自灑掃應對至于窮理正心由修身齊家逹于治國平天下未有不以敬為夲者也經禮三百曲禮三千一言以蔽之曰母不敬故居則如對越上帝出則如見大賔坐則如尸立則如齋行則如執玉如奉盈無時而不敬也近之事親逺之事君內之于兄弟外之于交友入之于州里出之于蠻貊舍則善其身用則顯其親無事而不敬也蓋敬以直內則清明在躬伯夷以之交神明禹以之宅百揆后稷以之播百榖契以之敷五教臯陶以之明五刑夔以之諧八音以至于垂于益于龍莫不皆然故曰敬也者君子所以成始成終也彼受玉不敬晉侯之所以無後執幣不敬若敖氏之所以滅將事不敬郤氏之所以亡受脤不敬成子之所以不反嗚呼敬哉不可不務也惟寅年甚富行甚方植志而不回強學而有文于其字非直美稱謂而已蓋將奉以周旋焉故余申其義以告之詩云夙夜匪懈惟寅其尚懋哉瞻雲軒詩序吳郡金伯祥氏家故士族而好施豫其以善士稱于鄉沒而葬吳江久詠鄉之韓墅者伯祥之先君子也其改葬吳縣橫山之吳巷村內翰金華先生黃公實志其墓焉伯祥居松江笠澤間力田教子益務以善世其家家去韓墅財數百武然水淺土薄四顧皆陂田塗潦沮汝滲溢耒耜之塗牛羊之徑又出沒旁午在五患之所必遷者也橫山在太湖上與郡西南衆山相旁礡距笠澤不下七十里然土益厚水益深草木益豐茂蓋樂丘也伯祥始不忍委其親于五患之區遷而得善地終舍近􅈬逺又非其所得已者每歲時上塜㗸哀茹恤踐霜露撫松梓輒徘徊不忍去嗟乎人子之于親所謂不能自已者蓋至此而後見焉既結廬墓旁以備風雨又即其南榮為軒曰瞻雲是雲也即狄公登太行而望河陽之雲也河陽之雲親之所舍橫山之雲親之所藏古今殊時存沒異感然雲之所在親之所在也親之所在雖亡猶存雖古猶今也彼觸石而起膚寸而合不崇朝而雨于天下無它亦和氣之所積爾和氣之積在天為慶雲為甘雨在人為忠臣為孝子唐有狄公猶天之有元氣也金氏世積善曽大父嘗舉進士金華先生曰引而勿替必有興者然則覽是軒而賦詩者豈直山川草木一泉一石之勝而巳哉力田足以追飬教子足以厚本積之也久彂之也漸先生之言其尚有徴乎詩凡若干首為之序者韋羌山人陳基也送浦朝宗序余嘗讀太史公書見其傳仲尼弟子獨子遊為吳人蓋泰伯仲雍未逃吳時吳為古要荒之地其俗蓋可知矣及泰伯端委辨冕而以禮治之其後延陵季子又承其流風讓國春秋時觀其聘魯而聞樂審賢而知政魯衛齊晉之大夫蓋未有或之先者降至子遊北逰洙泗比肩七十子之徒北面以事孔子而與卜子夏同以文學得聖人之一體則吳之多士其所由來者久矣吾聞之學莫乎近其人子遊已矣其嘉言善行見于聖門師友之問答千世之下四海之內凡讀其書者皆知有所興起况生乎其鄉者乎况弦歌其文學以教其子弟者乎此浦君朝宗之行君子所以樂為之道也夫子遊之文學非今之所謂文學也朝宗蓋嘗觀其論子貢之門人而求其夲之則無之旨矣夲者何聖賢大學之道所謂正心修身推而至于治國平天下者也子遊之鄉實惟海虞仲雍之墓在焉朝宗今受文學精舍之聘率其子弟出則從仲雍之遺民入則誦孔氏之遺書而觀其師友之問答先其小者近者而其大者逺者弗外焉則子遊之文學其庶幾乎書曰惟斆學半朝宗其勉之南臺御史大夫西夏永年公勳德詩序集慶古秣陵之地控扼險阻外連江淮內據湖海自昔三光五嶽之氣瓜分幅裂而經營四方者未嘗不恃此以為根夲國家奄有六合方嶽所在維藩維翰而集慶尤為要會之地于是建行臺置執法由御史大夫而下設官眂中臺控制三省綱紀十道責至重也自江淮盜起兵連不解資糧器械軍旅百需悉仰東南而東南所賴以為長城之勢者行臺爾行臺之所倚藉如衣之有領繼之有綱者御史大夫爾用是今江南等處行御史大夫西夏永年公由淮南行中書平章蕳在上衷特膺是命時至正十五年夏四月也甫下車凡前政之不便于民者悉更張之六月淮西寇渡江攻陷太平縱兵四劫潛趣集慶攻南門屬方盛暑官無見糧公晝夜申嚴約束躬擐甲胄冒矢石誓戮力與城始終賊因逡巡蹙縮相率引去秋七月賊復至又敗之九月賊大至圍城四面凡七日公身先士卒出萬死不顧一生且戰且守賊鋒大銼先是淮西義兵元帥陳也先率其徒渡江屯集慶城南之板橋行臺用言者計命也先與官軍並征太平已而我師失利也先陷賊賊質其妻子使為先鋒務必取集慶也先素服公威信輸密欵願擒首賊以自效衆皆疑其詐公獨決聽之無惑下俾官軍與也先表裏合攻遂生擒偽元帥郭張二人及其餘偽官甚衆殺死者無算因乘勝逐北鼓行趣太平且旦暮克復而也先為鄉兵誤殺舉軍痛惜之公命訪其尸收葬且録其子弟贍其徒衆士氣復大振公沈默寡言寬厚有器識度量絶人年十五六時出入帷幄輒負公輔之望二十有三出長饒州路惠政大著民至今頌之不衰敡厯臺省出臨方面遇大事決大謀雍容片言無不厭服其在行臺風厲各道屏除姦慝廪廪大人君子之風每軍中獻捷必面引俘囚詳録之無狀者戮詿誤者縱之使復業民賴以全活者不可勝計嗚呼國家承平無事時公卿大臣無事可見一旦亡命之徒盜弄庫兵掩我不備所至披靡而公以元勳世胄獨當東南一面紀綱之寄蜂蟻小醜乘釁窺伺而能先之以威信申之以持重隱然長城之勢自若也使秉國之鈞端捴庶政所謂垂紳正笏不動聲氣而措天下于泰山之安蓋入則周公召公出則方叔名虎非公其誰與歸東南大夫士嗟嘆不足而詠歌之者在公特一事爾然舉一事而公經國大略可以類見此詩之所以作也詩不可以無序于是乎書至正十五年十二月甲子謹序丁仲德歸飬序吳郡丁仲德氏以儒術緣飾吏事嘗遊昆山幕府尋給事漕臺屬僚之香糯所雖浮湛簿書而能隨事委曲機括轉旋如駿馬在前輕車在後而王良造父為之左右焉嘗因漕事至集慶龍灣鎮江寧國嘉興諸郡咸為文以旌其能用是合漕臺官屬既益賢仲德且爭欲食之以祿任之以事而仲德辭弗􅈬或問之仲德曰吾母老矣使舍朝夕之飬以從公卿大夫求升斗之祿顧不足以為吾親一日之膳耶夫祿者聖世所以食賢材非徒以飬人之有親者也今吾賢不如古人材不如今人而徒幸有老母苟焉不顧義而􅈬之夫食人之食當事人之事苟食矣而或怠焉親之食其將吐之乎此吾之所以安吾菽水之飬飬雖薄不猶愈于吐之者乎君子聞之莫不多仲德之善飬而能言者皆喜為之賦詩吾聞猗頓之冨侯王莫尚也至于飬則不如曽子焉季子之祿動以萬鍾曽子委而弗顧然後世未有以無祿議曽子者君子之飬苟以祿則五鼎之味厚于菽水曽氏之子其從季氏久矣仲德結髮遊州縣出入漕臺又幸有知已欲食之以祿常人之情孰不藉此以為父母歡仲德獨計不出此而竊竊然以材不及為解蓋仲德之飬不在祿顧母志何如爾以志飬志此猗頓之所以不及曽子也世蓋有善學枊下惠者丁氏之子其殆庶幾乎詩凡若干首繫于左夷白齋藁卷之二十
