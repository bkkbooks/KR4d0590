  text: 夷白齋藁外集
  hash: sha256:c2e6b1ec4237c83fee414c4320e90cd6ec37a12737b32942a1974b77ea36f96d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_038-1a}
body:
  text: 臨海陳基著金華戴良編古詩四言題朱買臣負薪讀書圖我樵于山我負于路讀書自娛匪􅏯伊暮靡咈尔心重失我度我印既纍我綬斯若尓毋我尤我不尓怍彼羙宋女亦遼以邈古詩五言妾薄命妾本良家女錢塘江上居生来不出户只學繡羅𥜗父母偏愛惜無異掌中珠十八許隣里二十㑹葭莩低頭奉箕箒和顔事舅姑誰知輕薄婿零落在中途結髮願偕老寜不共馳驅昔如梁上燕託身君子廬今如水上萍飄泊任江湖自嗟妾命薄忍死亦湏臾生女為人婦願嫁得其夫嫁夫一失所不如棄路隅春曰江上海宇属清宴乾坤大無垠慿髙騁遐觀臨流滌煩塵雲曰湛初霽山水蕩餘春陽徳舒柔和品彚競妍新矯矯雲端翮洋洋藻中鱗感彼翔泳適窹兹涵煦均良時不再得芳年難重臻願言乗清飈邈㢤霄漢津彂大都結髮事書史及壮服冠裳逺逰至亰師永言觀國光叨逢堯舜時㧞擢登眀堂佩以眀月珠𬒳之雲錦章驅車未及門平地生太行丈夫慕前脩出䖏豈有常但念平生友惜别衢路旁惟願各弩力矯首永相望涿州仲冬過漁陽風日正淒厲嗟此豪侠窟自古稱壮麗煌煌神堯業𧺫自艱難際柰何至中葉四海皆鼎沸良由開元主養􅍑以自噬惜㢤曲江公忠言諒何濟居人一何幸属此承平世耕牧畿甸門聖澤湛汪􅐮連山接神臯旭日生爽氣獨憐去國人南征從此逝任丘迢迢去亰國行行適任丘城郭何蕭條関山良阻脩日入就􅊇旅燈火稍綢􅓎薄酒不堪飲何以銷我憂冥冥天際鴻汎汎波上鷗往者固莫追来者當自謀獻州驅車官道傍四野積隂沍中路忽改轍前行屢囬頋遥瞻獻州城未至日己暮﨑嶇丘隴間足趼不容錯湏臾近烟火謂可慰情慮不覩主人面返遭邑犬怒僕夫亦己疲黽俛羞草具飢来罄一飡已飽復何慕阜城憶昔曰下歸己甘栖遯迹胡為負𥘉志三歲四行役我馬不及秣我僕不遑息荏苒歲月暮展轉憂患逼朝行過阜城原野霜露白一身如鴻毛苦厭天地窄凌州曉出凌州南晝行泥淖中一步一踟蹰四頋心忡忡牽車者誰子自言業為農頻歲值大水田廬為之空家有白髮親曰食憂不充辛苦事商旅庶以供飱饔維人生兩間所貴親愛鍾貧賤茍知養奚必禄位豐文夫畏天命敢不哀人窮生世苦不偶何由恤􅟂痌荏平客行荏平道日出天皎皎泰山何巖巖雲開豁穹昊生逢全盛時悲謌出燕趙䟦渉雖苦辛愛此風日好関河路緜緜江湖雲眇眇歎息梁父吟慷慨令人老榖城山晨興發東阿薄暮至榖城黄石去已乆茲山尚峥嶸伊昔秦漢際豪傑紛從横卓㢤張㽞侯視秦如孩嬰奮椎博浪沙賁育莫敢争頋獨取公履俛焉若諸生授書何必多怳愡通神眀卒為帝者師㓛成遂遺榮飄飄逺㳺子天寒獨遐征徘徊撫松柏俯仰有餘情舊縣披衣聽鷄鳴膏車待眀彂蕭條古東阿遺堞帶殘月䊸餘入空谷躑躅尋舊轍前瞻閴無人四頋皆積雪悲風泱􅐯至僕夫慘不恱驅馳二十里晴旭生木末稍欣山色佳緩轡行復輟我生一何愚奔赱恒挈挈賦命與仇謀艱險難備說蹉跎三十餘益歎身世拙豈無浮海志實恐甘旨闕𬗟懐古聖賢感激膓内熱汶上我行汶水上觧纓濯煩塵閔子安在㢤流波尚潾潾子昔當衰世不肻從陪臣我今遭盛時言歸事吾親泰山雖云髙希之在其人恭惟無間言敢不書諸紳施家荘陸行已兼旬歲暮誠勞苦積雪兼層冰跬步憂齟齬暝投施家荘居民喜相語累曰隂沍消舟行了無阻勇辞所乗車側耳聽柔櫓櫂謌雜吳謳頗𣸪慰覉旅人言前年夏洪河走平䠂漕渠當其衝澷漶不可禦民廬悉漂沉桒田眇何許所以亡命徒潜蹤匿蘆渚乗間作盗賊往往遭殺虜我方為飢驅願言適樂土中原不稼穡去去復何所徐州一昨始入舟遙望徐州郭水行已信宿甫至城下泊洪濤蹴長空驚風怒相薄乾坤無端倪雲水互叅錯𥘉疑鯨鯢闘復恐蛟鼉躍篙師為蒼黄客子俱駭愕傷㢤䠂君臣伯圖已寂寞空餘蘇公樓突兀倚寥廓徐人昔恃公安若山與岳文章與元氣萬古相磅礴大河失故道崩奔勢逾虐生人化魚鼈中州廢畊鑿安得不世才為君拯民瘼九原何茫茫可愛不可作益都子倀倀益都子牽車渡河水河水結成冰亂石森齒齒父後子居前父輊子輒軒寒風切肌骨手足為拘攣躋攀上平路不敢復囬頋未憂子力疲當念父辛苦龍橋婦婉孌龍橋婦空閨何惻惻夫婿弱冠餘南征死鋒鏑但見隣人歸不知夫蹤跡委身奉舅姑誓志如金石朝采陌上桒暮向窓間織織成錦囬文無䖏寄消息織成雙鴛鴦無復合歡夕何如織縑素裁剪信刀尺為舅作衣裳為姑為飲食分韵得老字華軒列綺席嘉樹䕃芳草愛此時雨歇綠隂浄如掃君子謝軒冕逍遥遂幽討有瑟復有琴自鼔還自考逹㢤松雲翁狂謌不知老送王本𥘉縣尹兼簡本中知州憶昔至正初北㳺客亰師辱交伯仲間日夕相追随磊落青雲器聮翩丹鳯姿愧無髙山調酬君白雪辭俯仰八九載南歸滄海涯竊聞霜臺上風猷肅綱維允矣伯氏賢克當眀主知仲氏貳安陸重為人所推中朝名公後復始非君誰前年復至亰伯也官扵磁治州如室家拊民若嬰児靈草毓三秀瑞麦生兩岐伯也置不言獨詠豐年詩凛凛君子風不啻先公為政成報天子寵錫有光輝人言古循吏龍黄邈難追孰知忠厚化昔聞今見之仲也復為邑鄆城欝巍巍朝廷重守宰簡書有程期一門双南金共下白玉墀又如兩騏驥為主効驅馳河水昔横溢生人四流移乗間為冦􅔯觸罪姦有司坐令齊魯俗化為蠻與夷今君寄民社所念當在茲願試父兄術為民療蒼痍君服亦已華君佩何陸離朝彂江之滸暮宿河之湄行當見伯氏為我道睽違清樾堂詩為沈仲說賦君子締新構樂此静者心徳陽一以亨衆木欝成隂攬物感流景當軒理鳴琴永懐烏鳥情肻為逰子吟囬飈薄煩暑靈雨洒中林為君賦行葦願言酬徳音時仲說祖夫人年九十𬒳賜帛之㤙故末章及之釣月軒開門得新月褰衣􅍱芳沚我意不在魚投竿聊尓耳素娥一何好姢姢暎秋水重惜此流輝徘徊殊未已東原行天寒曰晷促車行何轆轆大車利宵征小車冝早宿使君徒從多使君號今肅何如原野間年豐秋有粟古詩七言題趙千里江山秋晚圖秋山遥遥秋水闊秋風冉冉生蘋末夕陽逺樹集歸鴉慘澹人家帶林樾我聞趙家父子工丹青劃然見此心目俱開眀人間何䖏有此境無乃瀟湘與洞庭白波青嶂天冥冥熟視彷彿聞秋聲依微暝色生浦溆又佀滄浪謌濯纓東呉陸君好竒古何從得此歸嚢禇我亦從之時一睹為君題詩三太息良工良工心獨苦七月望日值雨宿窖中西逰復入河東路複巘重岡愁屢度﨑嶇五里不到河忽雷椎山雨如注湏臾百水争怒流澒洞忽若龍騰湫熊羆遁蔵􅍑豹伏魑魅亂呌狐狸愁我馬在前僕在後我行一步一囬首隂風吹人股為慄破㡌籠頭衣露肘疾呼東来皓首翁問勞慰我心忡忡相延入谷己暝黒下馬共栖營窟中不知今夕復何夕俯仰人間長太息勞生何必為形役歸有衡門且容膝贈黄瑞卿詩并序禄命有書尚矣唐太常博士嘗刋㝎而叙之然論長平坑卒南陽貴士則深黜其三刑六合之非至昌黎韓子扵李虚中則盛稱其以人始生年月所直日辰推其貴賤夀夭百不失一然則果何如㢤盖博士之論夫子罕言命之意也韓子之說則不知命無以為君子之意也然五行之變化支干之相生孰為勝衰孰為休咎苟能精之則其理有足徴者雖所罕言而亦詎可不知也㢤松陵黄瑞卿以祿命之術㳺江湖間予既贈之以詩又推夲其說扵其左其詩曰客有談天姓黄氏沛若銀河瀉秋水五星歴歴方寸間指掌人生䆒終始曽将異術千王公一過兾北凡馬空識人湏識貧賤中豈以世態論窮通九重方貴凌雲賦我獨胡為守環堵便将出䖏問黄生不用長安尋季主潼関河渾渾関崿崿太古己来神禹鑿前車未行後車却去馬一鳴来馬愕自從􅍑視繼龍興周道不復如䂡平至今惟有秦川路千里秋風落葉聲送陳仲寳還江州陳君五十頭未白邂逅都門始相識陸乗車馬水乗船䟦􅍱山川共南適苦甘飢飽朝暮同語黙寝興情性通萬里相将弥兩故郷西㳺我昔驅羊腸披圗萬里心茫茫人生出䖏古莫必憂樂相乗寕有常君不見重耳當年伯業昌險阻艱難曽備嘗文夫有事在四方蓬矢桒弧那可忘連山髙髙上無極仰視青天不盈尺俯覧可以窮九域我疑山靈應上訴帝遣夸娥運神力又疑蓬莱脫左股萬里飛来倚空碧乾坤一色雲冥冥急霰始集雪又零依依度橋者誰子隐隐操舟如送迎萬壑千巖深且窈兩兩相将事幽討若非淮南訪八公㝎是匡廬尋五老意匠經營妙入神披圖爛熳皆天真人間何䖏有此境我欲從之一問津律詩五言八里荘寄呉中兄弟晚泊清淮口臨風一振衣長河吞鉅海平楚沒斜暉未覺鯨波險唯憂羽檄飛故園兄與弟歡樂我多違㝎陶世路仍多患斯人劇倒懸虚移河内粟實苦汶陽田聖主憂民曰諸公奉使年萬方心佀渇雨露尚中天夏夜懐李尚志蟋蟀己在壁煩暑猶未歇離居感時序憂端難㫁絶綠樹含微風明河湛𥘉月念子行末歸徘徊至明發土濠夕憇土壕村主人顔色温子孫供洒掃兄弟具盤飱故國甘棠在名家棣蕚序相傳唯孝悌珎重乆弥敦題閿郷驛用故翰林宋顯夫先生韵二首匹馬秦川道西㳺柰逺何客星秋入斗候舘夜臨河地勢関頭險秋光嶽面多永懐楊太尉清白志難磨為問西来使長安去㡬何檄書飛𤏡道征戍動交河鸚鵡承㤙舊莆萄入貢多平生二鳥賦感慨未能磨函関三首水宿煩津吏山行信舘人度関車躑躅入谷馬逡廵石戴泥中轍風驚塞外塵憂時非肉食華髮為誰新萬里西㳺客歸期趂早鴻澗泉明曉練山果落秋紅鳥度烟嵐外人行泥淖中前途逢驛使立馬問關東稍稍聞人語遲遲進馬蹄雨深分陕路雲隔度関雞間道曽歸壁交情獨戀綈蕭條王伯略惆悵入詩題永昌陵洛水南来近嵩髙北望遥墓無羣木拱山罷百靈朝玉碗人間出金鐙地下銷夕陽扵越路烟草更蕭蕭􅍑牢關匹馬東歸客﨑嶇過􅍑牢地分周鄭險天入宋梁髙俯視泥無轍前驅牽載膏慇懃關下吏相送出城臯江二首澤國長雲雨春山半有無江源𧺫巴蜀地勢控荆吳客舎依鮫舘蠻商雜賈胡眀時方利􅍱吾道未乗桴江漢思神禹乾坤仰帝堯信知滄海大能受百川朝萬國車書廣三吳地利饒獨憐南浦鴈箇箇上雲霄乆雨二首自從甲子雨不見有晴時南國皆雲氣陽臺眇夢思蛟龍争窟宅鳥雀戀藩籬去去扶搖上飛騰有所之乆雨妨農事那堪夜復晨雲浮滄海曰花誤洞庭春行路悲㳺子匡時仰大臣未甘栖遯跡霄漢有通津晴雨後江逾綠春深天尚寒晴光分浦溆曉色變峯巒海内長為客天涯獨倚䦨封書寄鴻鴈聊以報平安金山寺突兀金山寺蕭條古佛居雲堂依水府花雨散空虚方丈諸天外浮屠浩刼餘十年㳺此地今日重躊躇又雨春草碧芸芸春江日易曛鮫人長織杼神女又行雲風水随鷗宿烟沙與鴈分逺逰頭欲白慚愧卓文君安國寺古寺依脩竹春池帶綠蒲世塵無䖏著僧迹與雲孤日暖烏争樹風輕燕引雏乆知方外樂来此一踟蹰㝎陶今日南風正揚帆過㝎陶郊原連薺麦井邑帶波濤衆鳥晴争宿孤舟晚更操裁詩聊自慰不必問香醪晴風雨夜来急波濤今復平路從関下險山向洛中眀歲稔征徭薄時平去就輕愧無封禪䇿聊欲頌河清洛口不學尸郷隐重為宛洛逰波光依岸轉㠶影帶雲収豈有相如賦空餘季子裘青雲有知己意氣若為酬白揚河晚泊白楊河堅冰柰尓何畏途愁落景歸夢隅滄波古渡淮人語商船䠂客謌晨興羞攬鏡白髮近来多崔鎮草草趍崔鎮悠悠憶帝郷星辰依魏闕風土入淮陽逐客行無馬居人飯有魴年華催獻歲歸得拜髙堂次韵荅陸養正之子過從乆情