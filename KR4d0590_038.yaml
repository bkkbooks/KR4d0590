  text: 夷白齋藁外集
  hash: sha256:c2e6b1ec4237c83fee414c4320e90cd6ec37a12737b32942a1974b77ea36f96d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_038-1a}
body:
  text: 臨海陳基著金華戴良編古詩四言題朱買臣負薪讀書圖我樵于山我負于路讀書自娛匪􅏯伊暮靡咈爾心重失我度我印既纍我綬斯若尓毋我尤我不尓怍彼美宋女亦遼以邈古詩五言妾薄命妾本良家女錢塘江上居生來不出户只學繡羅𥜗父母偏愛惜無異掌中珠十八許鄰里二十會葭莩低頭奉箕帚和顔事舅姑誰知輕薄壻零落在中途結髮願偕老寧不共馳驅昔如梁上燕託身君子廬今如水上萍飄泊任江湖自嗟妾命薄忍死亦須臾生女為人婦願嫁得其夫嫁夫一失所不如棄路隅春曰江上海宇屬清宴乾坤大無垠慿髙騁遐觀臨流滌煩塵雲曰湛初霽山水蕩餘春陽德舒柔和品彚競妍新矯矯雲端翮洋洋藻中鱗感彼翔泳適窹兹涵煦均良時不再得芳年難重臻願言乘清飈邈哉霄漢津彂大都結髮事書史及壯服冠裳逺逰至亰師永言觀國光叨逢堯舜時拔擢登眀堂佩以眀月珠𬒳之雲錦章驅車未及門平地生太行丈夫慕前修出處豈有常但念平生友惜别衢路旁惟願各弩力矯首永相望涿州仲冬過漁陽風日正淒厲嗟此豪俠窟自古稱壯麗煌煌神堯業起自艱難際奈何至中葉四海皆鼎沸良由開元主養􅍑以自噬惜哉曲江公忠言諒何濟居人一何幸屬此承平世耕牧畿甸門聖澤湛汪􅐮連山接神臯旭日生爽氣獨憐去國人南征從此逝任丘迢迢去亰國行行適任丘城郭何蕭條關山良阻修日入就􅊇旅燈火稍綢􅓎薄酒不堪飲何以銷我憂冥冥天際鴻泛泛波上鷗往者固莫追來者當自謀獻州驅車官道傍四野積隂沍中路忽改轍前行屢回顧遙瞻獻州城未至日己暮﨑嶇丘隴間足趼不容錯須臾近煙火謂可慰情慮不覩主人面返遭邑犬怒僕夫亦己疲黽俯羞草具飢來罄一餐已飽復何慕阜城憶昔曰下歸己甘栖遁迹胡為負𥘉志三歲四行役我馬不及秣我僕不遑息荏苒歲月暮展轉憂患逼朝行過阜城原野霜露白一身如鴻毛苦厭天地窄凌州曉出凌州南晝行泥淖中一步一踟蹰四顧心忡忡牽車者誰子自言業為農頻歲值大水田廬為之空家有白髮親曰食憂不充辛苦事商旅庶以供飱饔維人生兩間所貴親愛鍾貧賤茍知養奚必祿位豐文夫畏天命敢不哀人窮生世苦不偶何由恤􅟂痌荏平客行荏平道日出天皎皎泰山何巖巖雲開豁穹昊生逢全盛時悲歌出燕趙跋涉雖苦辛愛此風日好關河路綿綿江湖雲眇眇歎息梁父吟慷慨令人老榖城山晨興發東阿薄暮至榖城黃石去已久茲山尚峥嶸伊昔秦漢際豪傑紛從橫卓哉張留侯視秦如孩嬰奮椎博浪沙賁育莫敢爭顧獨取公履俯焉若諸生授書何必多恍愡通神眀卒為帝者師㓛成遂遺榮飄飄逺遊子天寒獨遐征徘徊撫松柏俯仰有餘情舊縣披衣聽雞鳴膏車待眀彂蕭條古東阿遺堞帶殘月紆餘入空谷躑躅尋舊轍前瞻閴無人四顧皆積雪悲風泱􅐯至僕夫慘不恱驅馳二十里晴旭生木末稍欣山色佳緩轡行復輟我生一何愚奔赱恆挈挈賦命與仇謀艱險難備説蹉跎三十餘益歎身世拙豈無浮海志實恐甘旨闕𬗟懷古聖賢感激腸內熱汶上我行汶水上解纓濯煩塵閔子安在哉流波尚潾潾子昔當衰世不肻從陪臣我今遭盛時言歸事吾親泰山雖云髙希之在其人恭惟無間言敢不書諸紳施家莊陸行已兼旬歲暮誠勞苦積雪兼層冰跬步憂齟齬暝投施家莊居民喜相語纍曰隂沍消舟行了無阻勇辭所乘車側耳聽柔櫓棹歌雜吳謳頗𣸪慰羇旅人言前年夏洪河走平楚漕渠當其衝漫漶不可禦民廬悉漂沉桑田眇何許所以亡命徒潛蹤匿蘆渚乘間作盜賊往往遭殺虜我方為飢驅願言適樂土中原不稼穡去去復何所徐州一昨始入舟遙望徐州郭水行已信宿甫至城下泊洪濤蹴長空驚風怒相薄乾坤無端倪雲水互參錯𥘉疑鯨鯢鬪復恐蛟鼉躍篙師為蒼黃客子俱駭愕傷哉楚君臣伯圖已寂寞空餘蘇公樓突兀倚寥廓徐人昔恃公安若山與嶽文章與元氣萬古相磅礴大河失故道崩奔勢逾虐生人化魚鱉中州廢耕鑿安得不世才為君拯民瘼九原何茫茫可愛不可作益都子倀倀益都子牽車渡河水河水結成冰亂石森齒齒父後子居前父輊子輒軒寒風切肌骨手足為拘攣躋攀上平路不敢復回顧未憂子力疲當念父辛苦龍橋婦婉孌龍橋婦空閨何惻惻夫壻弱冠餘南征死鋒鏑但見鄰人歸不知夫蹤迹委身奉舅姑誓志如金石朝采陌上桑暮向窗間織織成錦回文無處寄消息織成雙鴛鴦無復合歡夕何如織縑素裁剪信刀尺為舅作衣裳為姑為飲食分韻得老字華軒列綺席嘉樹蔭芳草愛此時雨歇緑隂淨如掃君子謝軒冕逍遙遂幽討有瑟復有琴自鼓還自考逹哉松雲翁狂歌不知老送王本𥘉縣尹兼簡本中知州憶昔至正初北遊客亰師辱交伯仲間日夕相追隨磊落青雲器聮翩丹鳯姿愧無髙山調酬君白雪辭俯仰八九載南歸滄海涯竊聞霜臺上風猷肅綱維允矣伯氏賢克當眀主知仲氏二安陸重為人所推中朝名公後復始非君誰前年復至亰伯也官于磁治州如室家拊民若嬰兒靈草育三秀瑞麥生兩岐伯也置不言獨詠豐年詩凛凛君子風不啻先公為政成報天子寵錫有光輝人言古循吏龍黃邈難追孰知忠厚化昔聞今見之仲也復為邑鄆城鬱巍巍朝廷重守宰簡書有程期一門雙南金共下白玉墀又如兩騏驥為主效驅馳河水昔橫溢生人四流移乘間為冦􅔯觸罪姦有司坐令齊魯俗化為蠻與夷今君寄民社所念當在茲願試父兄術為民療蒼痍君服亦已華君佩何陸離朝彂江之滸暮宿河之湄行當見伯氏為我道睽違清樾堂詩為沈仲説賦君子締新構樂此靜者心德陽一以亨衆木鬱成隂攬物感流景當軒理鳴琴永懷烏鳥情肻為逰子吟回飈薄煩暑靈雨灑中林為君賦行葦願言酬德音時仲説祖夫人年九十𬒳賜帛之恩故末章及之釣月軒開門得新月褰衣􅍱芳沚我意不在魚投竿聊尓耳素娥一何好姢姢映秋水重惜此流輝徘徊殊未已東原行天寒曰晷促車行何轆轆大車利宵征小車冝早宿使君徒從多使君號今肅何如原野間年豐秋有粟古詩七言題趙千里江山秋晚圖秋山遙遙秋水闊秋風冉冉生蘋末夕陽逺樹集歸鴉慘淡人家帶林樾我聞趙家父子工丹青劃然見此心目俱開眀人間何處有此境無乃瀟湘與洞庭白波青嶂天冥冥熟視倣佛聞秋聲依微暝色生浦溆又似滄浪歌濯纓東吳陸君好竒古何從得此歸囊禇我亦從之時一睹為君題詩三太息良工良工心獨苦七月望日值雨宿窖中西逰復入河東路復巘重岡愁屢度﨑嶇五里不到河忽雷椎山雨如注須臾百水爭怒流澒洞忽若龍騰湫熊羆遁藏􅍑豹伏魑魅亂呌狐狸愁我馬在前僕在後我行一步一回首隂風吹人股為栗破帽籠頭衣露肘疾呼東來皓首翁問勞慰我心忡忡相延入谷己暝黑下馬共栖營窟中不知今夕復何夕俯仰人間長太息勞生何必為形役歸有衡門且容膝贈黃瑞卿詩并序祿命有書尚矣唐太常博士嘗刋㝎而敘之然論長平坑卒南陽貴士則深黜其三刑六合之非至昌黎韓子于李虛中則盛稱其以人始生年月所直日辰推其貴賤夀夭百不失一然則果何如哉蓋博士之論夫子罕言命之意也韓子之説則不知命無以為君子之意也然五行之變化支干之相生孰為勝衰孰為休咎苟能精之則其理有足徴者雖所罕言而亦詎可不知也哉松陵黃瑞卿以祿命之術遊江湖間豫既贈之以詩又推夲其説于其左其詩曰客有談天姓黃氏沛若銀河瀉秋水五星歷歷方寸間指掌人生究終始曽將異術千王公一過兾北凡馬空識人須識貧賤中豈以世態論窮通九重方貴凌雲賦我獨胡為守環堵便將出處問黃生不用長安尋季主潼關河渾渾關崿崿太古己來神禹鑿前車未行後車却去馬一鳴來馬愕自從􅍑視繼龍興周道不復如砥平至今惟有秦川路千里秋風落葉聲送陳仲寶還江州陳君五十頭未白邂逅都門始相識陸乘車馬水乘船跋􅍱山川共南適苦甘飢飽朝暮同語默寢興情性通萬里相將彌兩故鄉西遊我昔驅羊腸披圗萬里心茫茫人生出處古莫必憂樂相乘寧有常君不見重耳當年伯業昌險阻艱難曽備嘗文夫有事在四方蓬矢桑弧那可忘連山髙髙上無極仰視青天不盈尺俯覽可以窮九域我疑山靈應上訴帝遣夸娥運神力又疑蓬萊脫左股萬里飛來倚空碧乾坤一色雲冥冥急霰始集雪又零依依度橋者誰子隱隱操舟如送迎萬壑千巖深且窈兩兩相將事幽討若非淮南訪八公㝎是匡廬尋五老意匠經營妙入神披圖爛熳皆天真人間何處有此境我欲從之一問津律詩五言八里莊寄吳中兄弟晚泊清淮口臨風一振衣長河吞巨海平楚沒斜暉未覺鯨波險唯憂羽檄飛故園兄與弟歡樂我多違㝎陶世路仍多患斯人劇倒懸虛移河內粟實苦汶陽田聖主憂民曰諸公奉使年萬方心似渴雨露尚中天夏夜懷李尚志蟋蟀己在壁煩暑猶未歇離居感時序憂端難斷絶緑樹含微風明河湛𥘉月念子行末歸徘徊至明發土濠夕憩土壕村主人顔色溫子孫供灑掃兄弟具盤飱故國甘棠在名家棣蕚序相傳唯孝悌珍重久彌敦題閿鄉驛用故翰林宋顯夫先生韻二首匹馬秦川道西遊奈逺何客星秋入斗候館夜臨河地勢關頭險秋光嶽面多永懷楊太尉清白志難磨為問西來使長安去幾何檄書飛𤏡道征戍動交河鸚鵡承恩舊莆萄入貢多平生二鳥賦感慨未能磨函關三首水宿煩津吏山行信館人度關車躑躅入谷馬逡巡石戴泥中轍風驚塞外塵憂時非肉食華髮為誰新萬里西遊客歸期趂早鴻澗泉明曉練山果落秋紅鳥度煙嵐外人行泥淖中前途逢驛使立馬問關東稍稍聞人語遲遲進馬蹄雨深分陕路雲隔度關雞間道曽歸壁交情獨戀綈蕭條王伯略惆悵入詩題永昌陵洛水南來近嵩髙北望遙墓無羣木拱山罷百靈朝玉碗人間出金鐙地下銷夕陽于越路煙草更蕭蕭􅍑牢關匹馬東歸客﨑嶇過􅍑牢地分周鄭險天入宋梁髙俯視泥無轍前驅牽載膏殷勤關下吏相送出城臯江二首澤國長雲雨春山半有無江源起巴蜀地勢控荆吳客舍依鮫館蠻商雜賈胡眀時方利􅍱吾道未乘桴江漢思神禹乾坤仰帝堯信知滄海大能受百川朝萬國車書廣三吳地利饒獨憐南浦鴈箇箇上雲霄久雨二首自從甲子雨不見有晴時南國皆雲氣陽臺眇夢思蛟龍爭窟宅鳥雀戀藩籬去去扶搖上飛騰有所之久雨妨農事那堪夜復晨雲浮滄海曰花誤洞庭春行路悲遊子匡時仰大臣未甘栖遁迹霄漢有通津晴雨後江逾緑春深天尚寒晴光分浦溆曉色變峯巒海內長為客天涯獨倚闌封書寄鴻鴈聊以報平安金山寺突兀金山寺蕭條古佛居雲堂依水府花雨散空虛方丈諸天外浮屠浩劫餘十年遊此地今日重躊躇又雨春草碧藝藝春江日易曛鮫人長織杼神女又行雲風水隨鷗宿煙沙與鴈分逺逰頭欲白慚愧卓文君安國寺古寺依修竹春池帶緑蒲世塵無處著僧迹與雲孤日暖烏爭樹風輕燕引雛久知方外樂來此一踟蹰㝎陶今日南風正揚帆過㝎陶郊原連薺麥井邑帶波濤衆鳥晴爭宿孤舟晚更操裁詩聊自慰不必問香醪晴風雨夜來急波濤今復平路從關下險山向洛中眀歲稔征徭薄時平去就輕愧無封禪䇿聊欲頌河清洛口不學尸鄉隱重為宛洛逰波光依岸轉帆影帶雲收豈有相如賦空餘季子裘青雲有知己意氣若為酬白揚河晚泊白楊河堅冰奈尓何畏途愁落景歸夢隅滄波古渡淮人語商船楚客歌晨興羞攬鏡白髮近來多崔鎮草草趍崔鎮悠悠憶帝鄉星辰依魏闕風土入淮陽逐客行無馬居人飯有魴年華催獻歲歸得拜髙堂次韻答陸養正之子過從久情親若輔車衣冠雖混俗詩禮貴承家舟泊松江雨門連笠澤霞十年來往地俯仰一興嗟律詩七言題陸氏别業夾溪揚柳恣欹斜流水春來淺帶沙韋曲桑麻如杜曲魏家池館接姚家髙低亂舞風前蝶紅白爭開而後花安得草堂江上住爛題新句送年華題龍門山圖曽過龍門山下寺畫圖渾似昔年遊秋聲夜動千尋木雲氣時騰百文湫魏國祠前煙草緑逺公巖畔石泉流隱君最有登臨趣拄枤相期到上頭至正丁亥四月草三日允常御史有事于先塋甫竣事而甘雨作人以為孝感所致皆為賦詩而屬豫為之倡佳城窈窕白雲中華表前瞻一徑通千載有㓛歸紀信九原無計起文翁龍門春湧桃花浪洛浦秋含麥秀風近日繡衣來拜掃孝思欣至雨𪷟𪷟丁亥歲河南自正月至七月無雨流民相屬于道哭聲滿野不忍聞慟哭秋原何處人哭聲直上徹蒼旻謀生不及官倉鼠轉死終為客路塵憔悴幾家猶貢蜜蒼皇諸硐又爭銀緑衣陳事無年少徒尓區區索鬼神阿㜷抱子婦將車骨肉誰甘棄道途使有賈生應慟哭惜無鄭俠為傳圖身拋田里魂俱喪目斷關山淚巳枯自笑腐儒難用世謾將餘論擬潛夫興慶池層城佳氣日髙浮花蕚樓臺在上頭鶴駕六盤猶避暑龍池九月未知秋青山排闥當窗見金水飄香入地流麋鹿不收瑶草碧太平恩澤滿秦州陳留人物東都迹已陳行過古邑為逡巡石經每愛中郎字墊角猶傳處士巾曠世逸才名在耳百年眀哲道全身飄零笑我成何事慚愧九原泉下人睢州雪中用允常御史韻隱隱髙城下五更飄飄墜雪細聞聲花開草木春輸巧光粲樓臺月讓眀太史豫占年穀瑞先農應報歲㓛成誰知萬里關山外親伴觀風使者行徐州日上彭城獨倚樓關河迢水空流不因躍馬江東去安得歌風沛上逰草帶虞姬亡日淚山餘亞父病時愁如何舞罷鴻門劒不向咸陽一少留至日淮隂道上年年至日在庭闈令歲飄零獨未歸雲物不殊鄉國異江山雖好故人稀檄飛河隴仍防冦兵振衡陽未解圍憂國腐儒頭欲白倚闌無語立斜暉瓜州題江風山月亭結屋髙臨揚子津江風山月坐相親魚龍未啓煙波蟄鴻鴈先驚關塞春有客貢琛來海島何人挂席上峨岷江心五夜鐘聲動喚起扶桑曰一輪送琳上人歸南嶽髙人二月歸南嶽共向東風折栁枝萬里故山飛錫近一江春水渡杯遲碧雲不賦湯休句班竹應過帝子祠尚恐諸方參未遍葛洪川上重為期江上客舍曉來江上雨濛𪷟煙火蕭條客舍中風急最憐巢幕燕春寒猶滯寄書鴻紛紛洲渚魚鹽聚厯厯東南貢賦通萬里乾坤一羇旅濁醪今夕與誰同江上對雨寄鄭山人蕭蕭風雨動經旬二月江城未見春鴻寫不傳天末信煙波愁絶渡頭人誰家揚栁啼黃鳥何處汀洲采白蘋慚愧江南庾開府暮年詞賦轉清新江邊二月東風鶯喚人踏青逰女滿江濵栁迷楊子津頭路山掩潤州城裏春望斷碧雲情縹眇歌殘緑水意逡巡無由一向江南去相伴汀洲采白蘋聞道聞道出師湘水頭東南賔主盛才猷勿今下失蒼生望實恐上貽黃屋憂雨裛漢旌休漫濕瘴深蠻硐未全收致身報主男兒事莫信平生馬少遊送人之南江南春水浴飛鳬柳葉半青楊葉踈送客又逄巫峽雨移家莫就武昌魚鷓鴣啼處難行路鴻寫歸時好寄書若過長沙逢賈傳慿君為我問何如江月樓中天樓閣鬱嵯峨良夜其如水月何雪浪逺從三峽至露華偏傍九霄多道人宴坐修禪觀遊子登臨聽掉歌曽是水晶宫裏客倚闌來此重婆娑寄了即休長老耽耽浮玉倚滄洲八十髙人在上頭不向終南通捷徑要將砥柱鎮中流世間豈識維摩病方外真從慧逺逰明日匆匆過江去尺書聊以寄綢􅓎五月五日淮隂五月五日淮陰郡半雨半晴城上樓菖蒲泛酒吾無分楊柳繫船君且留西日照人生别思南風吹笛帶邊愁眀朝又上洪河去欲采芙蓉不自由舟中束書又入李膺舟共遡黃河最上流自笑久為吳下客誰期重向洛陽遊關山雨足天無暑原野風髙麥有秋永夜雲霄看不厭相從還欲問牽牛五月平原百草香泊舟髙岸己斜陽河流浩蕩來西極山勢逶迤接太行墅老張燈風雨夕商童吹笛水雲涼共憐此地頻來往把酒髙歌一慨慷河隂蕭條城郭河陰縣泝水乘船似泛槎峭壁有人居洞穴平川無土種桑麻滿天急雨寒欺客捲地長風夜赱沙回首太行山下路豈無騏驥困鹽車昨夜關河風雨橫今朝涼思颯成秋沙頭浪湧千堆雪山頂人牽百丈舟願與王遵同叱馭不隨庾亮謾登樓君看平地風波惡積石猶應是穩流虎牢關連山回抱鬱嶔崟百戰英雄不可尋西極河流行地逺中州風氣入關深逢時豈乏留侯䇿事主難忘紀信心千載虎牢形勝地慿髙回首一長吟洛口今朝掇棹清河口却上髙丘望孟津多情芳草似南國滿目好山如故人文愧陸機還入洛才非范叔漫遊秦袖中獨有河清頌莫惜吹噓上紫宸法王寺白雲相送度髙岡行盡松聲到上方山掩地靈秋寂寂天開嶽色曉蒼蒼石根藥采菖蒲秀林下經翻貝葉香乞取龍溪泉一勺仰嵩堂上禮空王崇福宫西風吹老碧天秋𣪚策尋真處處遊太室山前逢􅢳母少姨峯下候浮丘穿林雲逐丹光起出洞泉和藥氣流白髮祠官談往事夕陽西玄水悠悠承天宮四面雲開翡翠屏路隨飛鳥入青冥巢由隱去山增秀申甫生時嶽降靈露采松花秋作釀風翻蘂笈夜談經何當結屋蒼崖曲手種菖蒲九節青轘轅逺逰重到洛陽城又向登封道上行路入轘轅秋更險雲收太室雨初晴千重灌木漫山碧百道飛泉繞澗鳴欲訪巢由渺何許空餘潁水照人清嵩髙厚德巍巍鎮土中一元磅礴氣鴻𪷟靈雲作雨秋歸硐列嶂朝真曉映空利澤四時周品物精英千古㣧貞忠重尋漢武登封處御道西風有路通次韻鋼字為拜太古運使賦平生貞義結中腸力剸蛟犀始見鋼水部分曺仍按節尚書入奏擬懷香暫垂鴻鵠青冥趐不負蒹葭白露霜咫尺星辰催聽履肯教供奉殿西廊次韻酬鄭彥章運使使君擬卜水南居負郭良田二頃餘但使有溪堪種竹不愁無地可藏書衣冠洛社期諸老祖帳都門憶二踈頭戴角巾收芋栗秋風吾亦愛吾廬東平道上客客東平聽曉鐘出門殘月尚朦朧一輪紅日生滄海萬丈丹霄聳岱宗不為山靈廽俗駕敢從漁父問形容何當結屋岩岩下學種徂徠百尺松濟州蕭蕭僕馬别神州俯仰乾坤一弊裘慷慨不為投筆計飄零空作曳𥚑逰雲飛故國無來鴈冰解長河有去舟此日山東無李白不妨携酒獨登樓彭城關山歲晚日隂隂獨上彭城思不禁河水東來非禹迹民風南去雜淮隂英雄己墮陳平計志士長憐亞父心自古人臣難去就悲歌一曲倚嶔崟吕梁扁舟又向吕梁歸浩蕩中流看翠微濁浪滿河冰亂赱黃雲垂地雪交飛奉身誤叱王遵馭涉世頻沾阮籍衣日暮不須吹短笛沙鷗猶恐未忘機邳州邳州城下片帆收滿眼山川生古愁人間客子復來此圯上老翁何處遊青冥無路逐黃鵠滄海有波隨白鷗浩歌擊楫江南去孰謂赤松非我儔淮陰侯廟慷慨論兵笑沐猴盡將生死付鄼侯手提漢鼎歸真主眼見黃旗出偽遊此日王孫空故國何年漂母葬荒丘英雄自古多遺恨腸斷秋風楚水流過揚子江憶亰師故人一别神亰歲己闌故人廽首路漫漫淮南美酒誰同飲江左青山獨自看滿地波濤紅閃日中天樓閣翠生寒吳關入望庭闈近欲問飛仙借羽翰草堂隱君家住玉山阿新築茅堂接薜蘿翡翠飛來春雨歇麝香眠處落花多竹枝已聽巴人調桂樹仍聞楚客歌眀日扁舟入州府不堪離思隔蒼波碧梧翠竹堂玉山窈窕地仙居翠竹參差間碧梧夜靜簾櫳人度曲春深庭院鳯將雛瑶華散席侵棋局瓊露分香落酒壷見説秋來更瀟灑四􅉉虛籟雜笙竽漁莊何處林塘好卜鄰清江繞屋淨無塵㝎巢新燕渾如客泛渚輕鷗不避人揚栁飛花香作雪鱸魚上釣句于銀春風無限滄浪意欲向汀洲賦采蘋次韻答陸養正幽居瀟灑傍溪湄雅好惟收魏晉碑千樹好花間對酒一簾春雨細論詩耽書尓欲師玄晏鼓棹吾將學子皮滿地緑陰春寂寂永歌伐木眇豫思留别錢伯行落花時節下江潯掃榻相延竹滿林盡日雄談驚四座百年髙義重千金挂帆南浦春風起剪燭西窗夜雨深别後相思隔城市五湖煙樹碧森森留别陸養正我愛陸郎才思清新詩落筆使人驚不材􅓎忝為師友髙義多慚若弟兄江上煙波催去鷁雨餘春樹亂啼鶯㝎知眀日空齋裏坐對停雲憶士衡送干子都赴陕州同知公子承家列俊髦尚書奉國著賢勞棠餘分陕千年樹水落洪河萬里濤地勢下窺崤澠固天文西入斗牛髙關東故舊如相問委羽山深學種桃南歸道中作陸乘車水乘舟關河何綿綿波浪復悠悠車行阻雪舟阻冰陸憂豺狼水鯢鯨我生不學馮河術奈何欲與重險爭朝辭舟暮騎馬鶺鴒相呼在原野白魚可烹雀可炙諼草羅生滿堂下長律上西臺大夫韓公二十韻昭代推賢佐眀公最絶倫異材鍾海嶽間氣育星辰世濟忠貞美身膺寵數頻棟梁元有器社稷豈無臣暫出司天憲遄歸秉國鈞鋒車朝象闕玉漏下雞晨膚寸雲初起茫洋氣已勻風霜成雨露秋日變陽春出入方周召㓛名邁甫申廟謨惟密勿王業在經綸近拔囊中頴旁羅席上珍但令材並入行見俗還淳葑菲秋仍緑菁莪晚更新髙明誠樂育幽側會求伸上客爭趨薊鯫生獨過秦朅來瞻泰華直欲小峨岷江漢成漂泊丘園愧隱淪新豐徒有酒亰洛漫多塵五鳯深黃閣三台亞紫宸扶搖難自致搔首望髙旻江亭江水出峨岷江亭俯要津諸侯皆職貢百粵漫風塵恩詔傳中使遐方倚外臣出師勞上將入幕冨嘉賔聞道元戎死頻傷義士神三軍冝雪耻百戰莫憂身巫峽長多雨瀟湘己暮春鼎魚何足制奏凱勿逡巡送錢伯舉録判衢州客舍依慈母多君若弟兄庭闈交㝎省閭巷遁逢迎夜雨敦朋好春風動宦情金樽深綺席玉漏下層城吏隱當平世㓛曺足令名不徒拓爽氣直欲樹風聲滄海鯤鵬化朝陽鳯鳥鳴明時須弩力應不負平生絶句題水殿納涼圖白苧衣裳懶自裁手搖羅扇此徘徊水晶宫殿涼風少欲勸君王築露臺戲嬰圖懷抱提携笑語溫好花折得帶晴暾后妃别有房中樂冝尓螽斯樂子孫蜀葵花圗水晶宫裏是仙鄉新製黃裳怯嫩涼獨倚西風無與語漫將心事訴朝陽題雞冠花圗緑陰亭下露華晞一色猩紅映舞衣疑是仙家丹熟後靈雞服得也能飛桃花翡翠圖落花庭院墮遊絲春在小桃人未知翡翠飛來成久立太平風景日遲遲倦繍圖宫門深鎖晝偏長懶把春雲繡作裳恨不將身化胡蝶長隨飛絮近君王蓼花雪姑圖紅蓼花開水滿洲西風吹夢捴成秋㗸泥不及三春燕兩兩巢君翡翠樓田橫墓一門兄弟王齊中耻與羣臣事沛公五百餘人同日死也勝匹馬向江東中牟客路茫茫曰易晡白沙衰草下飢烏為詢今日中牟令曽有飛蝗入境無𣏌縣杞縣南來麥未青馬蹄無奈曉凌兢問君今日寒多少雨過園林盡木冰竹雀圖兩兩野田雀雄鳴顧其雌青春風日好來哺竹間兒序玉山草堂分韻詩序豫與玉山隱君别四三年聞其與會稽揚鐵崖遂昌鄭有道匡廬于鍊師苕溪郯九成吳僧琦元璞曰有詩酒之娛而其更倡迭和之見于篇什者往往傳誦于人而豫也以汗漫之役遡河洛上嵩華厯關陕北逰而客亰師度居庸計其所跋􅍱不啻萬餘里方挈挈焉觸寒暑犯霜露之不暇又何由持杯酒濡翰墨詠歌揮灑以厠諸君子之列耶今年孟春豫還自北方隱君首以書見拓過草堂為旬日之留于是鐵崖去講春秋于松江泖澤之上有道隱居吳城天宫里元璞亦歸天平山之龍門而九成則出入漕臺執文牘以理公家之事朝夕與豫為侶者主則隱君客則練師也豫竊念三數年來馳驅辛苦幸而來歸而隱君能以水竹琴書相慰藉而諸君子者乃復出處不齊不能復如疇昔雅集之盛方俯仰窹歎慨然興懷而豫章熊松雲婁江陸良貴適至隱君乃列綺席設芳爼于碧梧翠竹間相與投壺雅歌飲酒甚歡且即席賦詩而以碧梧棲老鳯凰枝為韻豫探得老字餘則各有所屬詩皆輒成獨松雲子飲酣長嘯上馬馳去得棲字不賦云尊賢堂分韻賦詩序玉山髙士世為中吳巨族居崑山界溪之陽其先君子好道家清淨之説嘗以所居為真館髙士嗣葺之年未及老輒委家事于其子退治一室環以水竹中蓄琴書圖畫古玩器之屬而扁曰尊賢堂逍遙宴處意泊如也髙士少負竒才既不屑于用世及耴黃帝老子之書讀之而奉釋氏不殺生之戒惟謹每遇生辰輒不茹葷不飲酒杜門謝客焚香清坐歲以為常今年孟春豫過其處適值其謝客之日髙士以豫辱有雅故且姻故獲與觀其長幼登降儀容之盛蓋髙士之子仲瑛晉道皆能文而好禮而其孫元臣則又豫友于君彥誠之髙弟弟子也相與舉酒稱慶禮畢有頃姆抱三歲子奉巵酒跪進髙士前芝蘭玉雪未足以論其秀蓋髙士之曽孫也于是髙士命左右實爼豆潔罍斝相與為文字飲髙士既歡甚而其子若孫班班就序長者舉觥少者起舞髙士亦忘其為尊且老談笑之不足則彂為謳歌至夜分乃巳于是仲瑛請分韻賦詩以紀其事豫竊以為髙士享有五福樂及曽孫顧不為其所得為而乃味道德之腴樂仁者之靜寶之以儉行之以慈而仲瑛昆季又能躬行孝弟以志為養則其度越流俗豈不萬萬哉因以洪範所謂夀福康寧攸好德為韻豫得康字既為之詩又為之序云送長洲縣遷家訥縣丞代歸詩序夫褒衣峩冠乘堅䇿肥馳鶩仕宦之林而有貴夫世之佳公子者蓋以其習聞于家庭者非忠于其君則孝于其親也非弟于其長則信于其友也其周旋于朝夕則威儀之度進退之容射御之文應對之節又皆可以涖官而臨民之人也使之出而從改殆猶駕熟路之車騁康衢之駿而豫也又于長洲丞西夏遷嘉訥君見之蓋君之上世鳴玉紆組垂休邁烈代不乏人而君用其先大夫之澤效官倉庾而來也始則人敬之終則人愛之去則人思之胡為其能尓哉蓋長洲為邑麗于大府賦夥而訟煩丞之為職所以二令位髙而勢逼前人之處于是者鮮不以難而君也佐煩夥之邑不急以盩民不緩以敗事居勢逼之位不嫚以長傲不阿以耴辱三年之間不強民以敬而民敬不徼民以愛而民愛不要民以思而民思嘻善之足以動物也若是乎君顧不以習聞于家庭者為已足周旋于朝夕者為已至而諰諰焉若將益充其所以孝所以忠與夫弟且信者蓋將以雲漢為康衢朝廷為熟路而其所謂不負丞者蓋未足為君頌也然詩者所以宣有德序者所以彂其趣吳之大夫士于君亦厚矣故豫不敢讓而為之書送施掾史詩序國家世臣賞田多在吳歲有廩人之事則遣使督之至正十二年丞相府選監修國史府掾史淮南施君克讓乘傳至吳謹其事也既竣事明年春戒遷薦紳大夫咸賦詩以美之其意若曰丞相勳足以輔成王業㓛足以保衛社稷力足以制法成治而智足以尅敵出竒既登名太常則賞田之法冝有加無征此國家所以勸大臣丞相所以奉祭祀者也其使人于此豈直責以廩人之事而己哉亦將因此以視年之豐凶人之休戚益思𢡟厥㓛以垂休無窮也然則美克讓者非私克讓也美丞相之善使人也丞相使人不直責以廩人之事而事集此克讓所以為賢乎方今丞相枋國立賢無方薄海內外士之負才實者並升中朝蓋彬彬焉克讓年盛志鋭而材又最良其從事相府也蓋所謂生于伯樂之廄長于匠石之園矣其進而顯融也殆鷙鳥舉而風迫之矣它日乘堅策駿鳴珂曵紱復以使事南還薦紳之在吳者尚能執巵酒為克讓歡以慶丞相之得士也十三年癸巳三月既望序送髙進道序聊城髙君晉道侍其先大夫貟外公寓吳最久公中朝宿望風裁峻整居家尤儼肅晉道兄弟侍立終日非有故不輒去左右當是時搢紳先生謝官于朝而休老于吳者相望然皆推公為前輩無日不相過從部使者及四方宦遊之士道經吳率就造見户屨至不可容于是進道兄弟雍容于揖讓尊爼間動以矩度而進道又特以博古好學雅為諸公所知間欲屈置掾曺辝弗就及公捐館一時諸老亦相繼淪謝其子弟往往通顯莫不交薦進道進道方僦居水竹間環堵蕭然貧窶日甚人以為難而進道彈琴誦書自若也今年夏廣西部使者不逺數千里移書采吳辟進道為書吏于是常所往來者相與具車馬勸進道行而進道慨然若有不屑焉者乃相與言曰先大夫以閎毅正直之材有志當世不幸廢于疾及門之士資話言而往猶足以濟時善俗况進道以克肖之子朝夕奉先訓而周旋者乎然隱居不仕豈先大夫所以有志于當世之意乎且經邦之道莫先于風紀而風紀之要莫難于得人今聖天子得賢部使者于廣西部使者又得賢寮吏于幕下進道行矣推事親之道以事君推修身之道以治人將見進道無負于部使者而部使者無負于聖天子矣于是勸進道行者咸賦詩以華之而屬天台陳基為之序雙溪詩序豫鄉去城百五十里而逺大率深山長谷土田之利薄歲所入自供公上之外僅足以給衣食以故民無嬴餘而得盡力于畎畞暇日鄉之老者率其子弟相與誦詩讀書而其人皆知講説周公孔子以相尚豫生九年而孤又九年出逰四方不得安于田里以朝夕承教及粗有知而歸先生長者多己謝世其遺風餘韻幸而可見者尚賴其詩之存蓋豫于雙溪而有得焉豫既手録其詩乃從而歎曰嗟乎古者天子之巡狩也蓋太師陳詩以觀民風焉是以孔子刪詩凡行役之大夫放逐之臣子閭巷婦女芻蕘遺逸之辝悉耴而列諸國風者將使人因其情性本其風土而觀其習俗之美惡政事之得失也周衰聖人不作采詩之官廢作者始自成家家自為法辭愈工而氣愈蹙世愈降而情愈偽尚何俗之可觀政之可考哉故豫歷觀近世之詩重有感于吾鄉諸老雙溪之作者蓋以其彂于喜怒哀樂之正本乎習俗風土之美歌詠周公孔子之言以教其子弟親其親而長其長樂其樂而事其事遡而求之古詩之源可見也豫以不得親登其門為憾又惜采詩之官未設序而藏之以俟知者送髙孟賔歸永嘉後序古者男子有所事也其所事在于天地四方故其生也桑弧蓬矢以射天地四方者志其所有事也是故成童而教先幼儀而後六藝既冠而成人則責以男子之事故三十則理男事焉男事理則可以出而行其志故四十始仕則方物出謀彂慮五十則服官政七十則致仕焉然則人之生也無一日不教其長也所一日而不學及其措諸事也亦無一日而非其所教所學者是故近而君臣父子夫婦昆弟朋友之所以為懿詩書禮樂之所以為教逺而天地日月星辰之所以運行風雨霜露隂陽寒暑之所以變化江海河嶽之所以為大皆其躬行實履深眀熟察而非有待于外者也故曰參其化于天地而無悖行其道于四方而無惑男子之始終其所事不既備矣乎今之人則不然其所謂幼儀父兄不必知也所謂六藝先師宿儒不必能也而况于其所事乎况于無悖無惑乎嗚呼教之不行學之不講亦已久矣士之生于斯世茍有志于天地四方以求其所事其可不自力乎是故弗教則已茍教焉非古之所教弗教也弗學則已茍學焉非古之所學弗學也茍教矣學矣而猶有所未自信者則出而遊于通都大邑天下人物之所會交于豪傑卓絶之士以增益其所未至者焉然後求其所事于天地求其所事于四方其庶幾不悖不惑乎余嘗有志于是矣而未能致其力吾友永嘉髙君則誠博學而強志其弟孟賔哷東歸海上蓋所謂歸而求之有餘師者其行也故以是諗之孟賔之得于其兄者亦有以教我乎因書于末簡以致豫私焉送申屠彥德序祕書少監金華黃先生之宦遊浙東西也四方學者各以本經來受業會稽申屠彥德則以春秋之學為髙苐基登先生之門也後先生稱彥德不置而基固願與之遊已及來吳門訪故鑒書博士柯公敬仲而彥德客于其所始相識于是修同門之好甚歡也方是時士罷科舉之習一時作者以古雅相尚而彥德詩文一出爭相傳誦然日不廢三傳及諸儒所為説以研精聖人筆削之旨及賔興之制復行彥德挾所有以往每方出場屋同輩各以其文相示莫不推服彥德而有司者顧屈之于次搒僅以恩例署為歙縣教諭夫士之為學亦正義不謀利明道不計㓛而已故其得所願于時則進而行其志其未得所願也則退而求諸已茍去而奉籩豆玉帛周旋聖人之庭深衣大帶率諸生誦其詩讀其書于朱夫子之里則又君子之所不讓也且基嘗遊歙矣歙之為邦在萬山中水清而駚故家遺俗喬木相望文獻有足徴者而其人于當世儒宗尤深慕金華先生之文足以彂眀朱夫子之道故以豫之愚亦幸因先生而不見鄙夷于歙而况彥德乎顧以朝夕之養不能一日舍去以從彥德于歙而修基之所不逮也于其行輒序以送之且以謝不敏于歙之大夫士云送鄭君舉遊金陵序昔六朝之都金陵也皆南北分裂之餘士生其間蓋欲為司馬子長萬里之遊而不可得庸詎知千數百年之後天下混一車書大同有如今日者而能文好遊之士過其故都徘徊躑躅以吊其殘煙衰草之墟乎然秋髙氣清登石城而望長江西來朝宗于海而湘潭巴蜀之山雲影出沒至于淮南草樹青青如薺秦淮晴波縈縈如帶猶足以想見昔時龍蟠虎踞之勝固一時之壯哉况大江而南物盛人衆天子命執法大臣臨而治之以至繡衣峨豸之英皆極一時之選實東南人物之之都會也而其所職又以進賢退不肖為務是以山林之士有志當世者莫不願與之交此永嘉鄭君舉所以遊金陵也吾聞王良善御馬者也然非千里之馬雖良亦無所用其御矣今有千里之馬于此良其舍之哉雖然遊金陵者衆矣固有登髙覽古慷慨悲歌隱于桑樞甕牖以樂周公孔子之道有欲御之而不可得者君舉試一訪焉它日歸而為豫道也送葛子充序金華周君子有宦遊吳郡俄病暍而舌黑醫者以為不治其友龍君師德更迎豫里人葛君子充視之則曰此在醫書顧諸公不察耳以法治之隨愈子有既深德子充因俾豫序以送之夫醫固儒者之事乎素問內經雖不能必其出于黃帝岐伯之手然五臟百骸脈絡血氣之在人身而與天地隂陽五行寒暑相為禪續消息其言至精而理至密蓋去􅒏命為不逺也秦和扁鵲倉公華他之書雖不盡見然張長沙論述于其前劉河間張宛丘李東垣彂明于其後此四君子者皆以博學審問之㓛而造夫神聖工巧之域天下之能事畢矣故為醫者不讀劉張諸子之書則何以推明長沙之論不明長沙之論則何以求素問內經之旨素問內經之不察則夫所謂五臟百骸脈絡血氣與夫天地隂陽五行寒暑相與禪續而消息焉者何從測其微而探其頥哉吁為是術者亦不易矣世之庸工俗師自號以醫専門者不過以舊時亰局古方相授受而已求其如子充者豈易得哉蓋子充之醫本于素問內經上下于四三君子之書豪分縷析以明夫天地隂陽五行寒暑之襌續而察夫五臟百骸血氣之消息其用心亦精矣猶以為未足則遍遊四方博求名士相與講磨其所未至故其診脈處方譬之養由基之于射不彂則已發則無不破的焉此周君子有所以深德子充也夫雖然吾聞子充之治醫始以事親而終以濟人固未始一日而非儒者之事也然其活人亦衆矣何獨子有德之之深乎夫貪㓛責報與夫背恩而反讎焉者固無大相逺然以醫自専而終至于殺人者聞子充之風亦可以少愧矣豫既重周請又嘉子充之醫本于儒者于是乎書嚴氏遊靈巖圖詩序中吳以水為國而靈巖獨髙出雲漢之表珠宫紺闕浮屠氏實有之然琴臺硯池􅓏廊香徑所以資耳目之勝者尚厯厯吳宫之舊慿髙而望則姑蘇之麋鹿長洲之煙草逺在指顧中而天平之朝嵐暮靄太湖之風帆浪舸變化而出沒者又近在履舄之下蓋東南之偉觀也歲二月嚴君景安與其族人子弟泛舟海上西行百餘里侍其季父來遊時雨既降草木暢逹長幼提携相與攀髙雲蔭密樹而歡欣愛洽之情油然于山水間則斯遊也又非唯以窮耳目之勝而已冝其賔客觀感一時之趣從旁執筆畫以為圖而能詩者又從而賦之也蓋景安仁而好禮尤厚于族人想其歲時蠟社宴集于家披是圖而玩則所謂珠宫紺闕太湖天平或髙出雲漢之表或俯視履舄之下者皆可坐而致之于是慨時序之代謝追登臨于往昔而愛洽歡欣彂于其情者如水之增不能自己則凡覽之者皆將為之賦詩而况于其賔客者哉基越絶之鄙人也奔走千里弗克盡其歡欣愛洽于親戚者亦多矣故尤不能不申一言以致其歎慕之私焉至正六年龍集丙戌五月既望陳基序送趙平甫序州與縣均之為民父母也然昔為縣而今或以州升之則其勢既隆而其責加厚故由大府史而賔于州者恆什百于縣之典史于是有假典史之選而賔于縣由縣而𣸪升于州者焉夫自大府積勞而賔于縣又自縣積勞而賔于州之人也佐其長吏處既隆之勢任加厚之責蓋不難矣然而老于刀筆者或髙下其三尺使民不得通其情迫于衰耄者惟知避害而趨利不復顧事之得失有能惠然以民之休戚為己任使其長吏不失譽于上而其民無怨讟于下則人之賢不肖何如哉吳興趙君平甫試吏其鄉厯蘇杭府史為杭録事司及眀象山縣典史今以都目選賔于越之諸暨州夫給事于三大府更一司一縣悉著賢能聲今去而之山水之邦佐其賢良之長而治夫淳美之俗攄其應劇之才而施之以間暇將見其賢聲大行于越而流于東南其可書者當不止于一司一縣而已彼拘于刀筆牽于利害者又豈同曰而語哉于其行吳士善詩者咸歌以餞屬豫為之序送李崇道詩序豫客洛陽識李君崇道于御史斡勒君允常座中見其風神秀整舉止不凡意其為貴遊公子也退而察其所職乃知其為儒家子用父廕而為河南司獄且三年于此矣豫固益器重之蓋河南居土中而其民號為近古然自飢饉荐臻始有失業而麗于法者兼旁近山谷産物為白金亡命之徒相聚而冶于其上歲不下數萬人往往因利而競輒白晝相賊甚至血流洛水盡赤然則司獄于此自非老于事者鮮不以為難矣今李君徒以一介儒生而年又甚少顧乃處之以間暇不啻遊刃于有餘之地者亦必有其道矣豫嘗見洛人謂君廉而不矯惠而不近名民之逮繫者率哀矜而善處之疾與之藥飢與之食寒暑為之備多出私橐久而不倦恆誦儒先君子茍存心于濟物之言以自勉且曰氓之獲戾而至于斯彼固不幸也亦豈有司者之幸哉吾今奉吾公而巳又遑恤其它嗚呼其所以為吾李君乎未幾以秩滿將謁選天官洛人以其必顯融于時也咸賦詩以贈屬豫為之序記萬壑松濤軒記郜君彥清宦遊東南樂吳興山水之勝卜築辨山之陽而名其宴休讀書處曰萬壑松濤夫天地之氣噫而為風其始也彂于太虛終也周于六合而其噓吸于衆竅也蓋吹萬不同然而霜露既降溪谷蕭條其鬱然森茂挺然髙出雲漢之表者殆莫與松為伍于是湱乎其相激沛乎其莫之遏渢渢乎耾耾乎如百水之源崩迸洶歘奔流而入巫峽轉瞿唐下江漢浩乎其莫知所極也于斯時也吾知彥清仰而聽俯而視庶幾與南郭子綦隱几而遊于灝氣之初將嗒焉不知孰為松孰為吾而豫也又何足以知之哉雖然夫鼓元氣而成萬彚者果孰為之機括乎故張之則溢萬壑而不以為有餘翕之則不盈一掬而不以為不足然要其歸則未始張未始翕而亦未始不張且翕也今彥清以英邁之氣勇往之姿出而周旋乎世故酬酢乎萬變蓋不離于物而亦不撓于物也及其退于休沭茲焉逍遙淡乎其相忘泊乎其無為其殆有合于此者是則不可以無記也若夫風土之夷曠煙雲之吐納與夫嘉花美竹芬敷恱茂以冝于四時者它曰從彥清遊尚能為之賦云緑隂亭記緑隂亭者界溪顧君進道宴遊之亭也晉道中吳故衣冠之族好學嗜靜而不屑于祿仕其所居雖逺去城邑而無髙山深林之阻于是引水以為池聚石以為山嘉木美竹之植既扶疏而蔥蒨竒花異卉之茂又數秀而靚深于是不出户庭而得園池之勝者惟斯亭為然蓋寒暑之時不同昏旦之氣亦異攬清輝而撫流芳于此者固隨物而寓懷即景以成趣然而春夏之交時雨霽而風曰好芳草淨而林館邃則緑隂之勝又為斯亭之最焉冝晉道角巾藜杖曰與二三友生逍遙于此或彈琴或吹簫或飲酒或賦詩而凡世間之所謂榮辱得失不少置毫髮于胸中也夫景勝則神超神超則理融晉道蓋嘗學道而造于此乎使晉道而果造于此則其充然自得于禽飛魚泳之際者殆與造物生生之妙流行于無窮蓋無時不在緣隂間也豈特春夏之交而已哉雖然陽德方亨草木咸若晉道得以仰事俯育之餘優遊無事為亭以留連其光景于故園喬木之下者亦知其所自乎然則晉道之以緑隂為樂而吾黨又能執筆以陶寫其所以為樂者皆幸生太平之時也是不可以無述因書以為記聽雪齋記顧君仲瑛飾藏修之室于所居小東山之左亰兆杜徴君用􅊢古題其顔曰聽雪齋間徴記于豫豫惟天地之氣舒而為陽慘而為隂潤而為雨露凝而為霜雪而其所以舒所以慘而凝且潤者亦何與于人而夫人之情見雨露之濡則神夷覩霜雪之嚴則神肅此必有為之真宰于其間者矣且歲聿云暮雨霰交集君子于此冝感時序之代謝慨物候之變遷退而居重幄􅊞兼裘徴纎歌選妙舞厲金石之響諧絲竹之音以樂其樂今也則不然斂容以處其獨潛聰以察其微超超然若逃乎虛空薄冨貴而樂枯橋者夫豈所謂瀌瀌奕奕霏霏脈脈揚霙而屑玉緣甍而入隙者果足以恱其耳而懌其心乎蓋歲㓛既成嘉瑞時應出無羇旅跋􅍱之役入有琴書詠歌之娛而又仰足以致其養俯足以盡其育蓋𥙿于己者不役于物足于內者無待于外于是施施焉衎衎焉與葛天氏之民並遊于熙洽之世嗚呼居太平之時聽豐歲之雪其得于天者亦厚矣冝其不以人之所樂者以為樂而以己之所適者以自適然則非仲瑛亦何足以與于此哉雖然吾聞井龜不可語海夏蟲不可以語冰蓋拘于虛者猶篤于時也今仲瑛處𥙿而不嗇居盈而不矜持虛以守實主靜以制動蓋庶幾于不溺此不泥彼而能與物推移者故豫樂為之道也是為記志靜齋記亰兆杜徴君嘗過會稽朱子安氏于吳門而題其所居之室曰志靜齋客有見而疑之以為子安方與吳人雜處于賈區中其丹樓畫閣鱗次而櫛比眀珠文貝誇多而鬪靡者非金張之家則陶朱之里也加以車服軒冕之旁午歌姬舞女之雜遝子安于此冝朝夕弊弊焉疲精神役心思競得失較銖黍之不暇而其心之所之顧不在于彼而在于此吁此烏足以知子安哉夫逃乎空虛形稿木而心死灰者舍動以求靜者也應事物而接人情迹闤闠而心山林者主靜以制動者也舍動以求靜者其㓛足以善其身主靜以制動者其效足以及于物子安蓋嘗求隂陽五行于黃帝岐伯之書徴工巧聖神于秦和越人之術其用將以善身乎抑以及物乎夫及乎物者不物于物者也不物于物者非志于靜者不能也况子安之左琴右書何慊于金張茟床茶竈何羡于陶朱法書名畫之卷舒何慕于軒冕商彛周鼎之離列何事于歌舞則其不容一物于常惺惺之際者其亦主于一而無它適焉爾豫懼疑者之終不釋也故為之記使書于徴君所題之左以示焉悠然亭記毗陵錢君士元博雅好古世居馬迹山之內閭其地濵太湖而與夫椒之山相望士元既樂與其親戚賔友者遊則作亭其間而以悠然名之故浙東元帥白野公兼善實為之篆燕人昔正卿氏士元之姻而白野公之客也每過士元飲酒亭上仰見其扁則思白野公焉余雖未識士元而白野公之遇余猶正卿也間屬以記余弗敢辝夫士元之生後靖節千歲而近其居去靖節千里之逺而名亭獨耴其詩之語景而慕之不以其人乎斯亭也近俯太湖之蒼茫逺覽夫椒之嵯峨飛鳥往還與山氣相回薄悠然之頃宛有真趣此靖節所謂欲辨己忘言者也蓋象外之象景外之景自然無名太虛無迹言之不足以盡其意默之則足以全其天噫靖節其殆天遊者非耶余于白野公無能為役而正卿顧欲為士元推靖節之忘言者而為之記豈忘言之中猶有可言者乎吾聞之能言者固難而忘言者為尤難惟其忘言也而後得其趣之真得其趣矣而猶不能已于言蓋終身不言而未嘗不言固莊周氏之所謂和以天倪而非余之所敢知也雖然白野公已矣吾將從正卿舍斯亭賦靖節飲酒詩以酒觴士元相與乘和平之氣逰無何有之鄉而後忘言之境可庶幾也正卿曰善因書以為悠然亭記至正十三年秋八月辛丑記嘉樹軒記山隂朱君子安所居之庭有嘉樹焉天台陳基見而美之子安曰子亦知夫樹乎方其産于山林也莫不萌于尺寸而至千尋為匠氏所知則耴而用之為明堂為宗廟不為匠氏所知則老于丘壑而已或者又厄于山石困于巖穴蹙縮擁腫卷曲逼仄而不得遂其性否則病于戕賊欲效其用如柤梨橘柚漆桂而不可得均之為樹也而有幸不幸焉今斯樹之植于庭雖未必其為匠氏所耴然亦逃于擁腫蹙蹜逼仄卷曲與夫戕賊之患而愛護之㓛均于造物溉灌之勤饒于雨露縱未能上直霄漢蔽虧日月然視老于丘壑者亦或有間矣基聞其言而感之蓋士之晦于空谷有乘風雲之會佐時龍之運巍然而立于廊廟者有德行以培其本禮樂以逹其枝而光華潤澤又彂而為文章之盛然不獲推之于時以致其所以扶顛而持危者有不材而克終其天年如商丘之木有以材為患中道而夭于斧斤如宋􅍮氏之楸者此其幸不幸視彼何如哉今也託根于君子之庭始不厄于山石終靡困于巖穴養之以深仁而不徒為商丘之夀沃之以厚澤而不忍為宋荆氏之夭庸知其異日不千尋乎又庸知其不為匠氏所耴乎然則産于山林而有幸不幸者在于樹之遇弗遇也託于君子之庭而有耴不耴者在于人之養弗養也吾知養而已又遑恤其耴不耴乎子安曰旨哉使吾因彼而有得于此者子之言也夫乃謝曰敢不封植此樹以無忘角弓因書以為記范氏復祖塋記故宋贈太師魏國范文正公以上三世墳墓在吳門之天平山至公之薨始葬洛陽萬安山母氏謝夫人之兆其子監簿忠宣恭獻侍郎以下三世皆祔焉中更靖康之亂子孫之在吳者弗獲以時展墓唯顧瞻山河北嚮流涕而已我世祖皇帝混一四海列聖相承誕敷文德而尤惓惓焉致意于古今忠臣烈士有㓛于名教者故公克與天下之名山大川前代之聖帝眀王並登祀典每歲仲丁有司祗奉中牢致祭惟謹可謂盛矣然亦不過即天平之白雲以寓其髙山仰止之意而萬安之原至大中八世孫國俊僅一至其處同知徐君景孺為復侵地亦存什一于千百自是又三十九年為至正七年國俊從弟將仕佐郎文英謂其子崑山州教授廷方曰嗚呼自陵谷變遷以來故家喬木零落殆盡吾子孫幸生聖明以孝治天下之時慿藉餘澤食有義田居有義宅教有義孰凡飬生送死可以無憾而祖宗二三百年之丘隴所恃以為藏者鞠為芻牧之區徐君所封亦已侵削尚安在其為子孫哉洛陽土風號為近古豪民無知可以德化不可以力勝吾聞御史斡勒君允常居里第曰以吾先文正公濟貧活族之仁自勉而僉事李君公平分憲于洛又嘗執筆而為公之傳者誠以狀白之必有以矜吾之志也廷方即曰具資糧屝屨不逺數千里致其父之命于是李君首出俸金為之倡斡勒君率鄉黨與同知郭君文鼐判官董君鉉奉牲幣為文以祭于墓下所謂豪民之無知者觀感而化卒復徐君所封之舊而其地以畞計者若干焉既繚以周垣益之壤樹又築室六楹使其甥趙氏廬其上甫竣事以基嘗與觀籩豆玉帛之盛俾書之于石竊惟文正公以間生之氣王佐之才致位將相為宋宗臣百世之下誦其詩讀其書者可以立忠信而尊君父興王道而致太平故其少而肄業長而從政所至之地遺愛不忘率繪象以為祠刻銘以頌德顧是窀是穸在其父子平生官居衣冠禮樂之鄉而使斧斤耒耜日相尋于其中豈國家所以尸而祝之以待先賢之意乎繼自今兹為子孫者如文英之不忘其本處里閈者如斡勒君之雅尚古道居風紀者如李君之知所勸相為有司者如郭君董君之克恭所事則萬安之松楸將人人為之封殖益久而不廢尚何斧斤耒耜之患乎哉公父子世濟忠直太史有傳神道有碑家乘有載兹不敢以瀆書書其復塋歲月以為方來告云是歲丁亥十月丙子記崇勳堂記遼之右族歷金入國朝惟石抹氏之後為最盛支分蔓衍散處北南若河南都府所屬千夫長元善君者其一也君上世佐太祖皇帝起翔方俊㓛偉㓛不可殫紀逮世祖皇帝平一海內爰命武臣分鎮天下要害處顧惟河南地大以逺且據四方之中昔人所恃以為金城湯池者雖皆鞠為草莾然表裏山河自若也故既立萬夫長俾元勳揔蒙古軍世守之又以􅍑符金章職長千夫授君上世其責任不亦隆且重乎此其先大父所以即所居之堂而名曰崇勳也今年夏五月豫與御史斡勒公允常過君于洛水之南遙望喬木參天穹墉傑屋巋焉其中及至君衣疏布出肅客無毫髮貴介習于是方居先夫人之憂而先大夫即世久矣暨升其堂見垂白之親坐堂上則君之祖夫人也因相率舉酒為夀有頃君之女出拜客禮畢退立太夫人之側婉婉有度又頃之姆抱幼子甫三歲秀眉廣顙楚楚不凡則君之子也坐㝎太夫人從容間勞悃悃欵欵精神氣貌如五十許人時已年八十有六矣樽豆既設君周旋降登上奉太夫人下接賔客而歡欣愛洽之情藹然于威儀動作間雖素韋布之士有所不及也世言三代為將道家所忌然鄧禹將百萬之衆未嘗妄殺一人自謂後世必有興者自是纍世寵貴卒如其言方國家經營四方神武不殺君上世以忠事君克有樹立升平既久子孫祗承世祿以孝事親上棟下宇俯仰無怍引而弗替崇勳之澤未艾也彼若考作室既底法厥子乃弗肻堂矧肻構者亦可以知所愧矣至正七年五月甲子陳基記桃源小隱記界溪距吳城之東五十里其水深厚其土肥衍民有耕于其上者自號界溪生人亦從而稱之而不及其姓嘗讀晉人所記桃花源而慕之且曰安得若人者與之逰乎于是環其廬皆種桃而扁曰桃源小隱客有過而為之賦者曰仲春之月桃始敷風曰晴美其蒸如霞既穠且郁天彂其葩灼灼麗姝爛雲錦以為居此豈避秦之子而彼美人者得以挹其芳而玩其華耶生乃止客耴酒劇飲曰且暮俱藉草卧花下須臾月白風露在草樹間夜氣􅊞人生因暫起有頃復覔顧客而客忽不見潦水時至生往率農人田于其野至暮而歸則聞有鼓枻夷猶于煙波莾蒼外者生乃歌陶淵明詩以和之然其人卒不可得而見或謂向者之客蓋仙云嗚呼若生者亦豈仙之徒與生又好經史百氏與夫法書名畫古玩器之屬左右離列日與其友徜徉其中雖復昏旦異氣寒暑殊時而水木禽魚之趣無時而不寓于目意有所適則彂為詩詞間有傳于人者又若以幸生太平無事時粗以衣食有餘相與共樂于此者皆上之所賜然終莫知其為何如人也赤城樵者聞于虛白子故述而記之知還亭記西夏吉祥文卿謝官茶陵居洛陽里第扁其燕休之亭曰知還蓋耴晉陶靖節之言也翰林待制大梁吳公以小篆題其榜求豫文以記之夫以靖節之脫頴不羈博學厲操使出而致用則其效可以返淳風於千古振大雅于末俗所謂羲皇之上者不止北窗之下矣不幸而遇衰世仕不足以屑其意則寧浮遊塵埃之外以庶幾夫不逺復之義夫豈其獲已哉今文卿生靖節所不可得之時而又器局過人鳴珂曳組世有膴仕顧不乘清飈慿灝氣去而參鵷鴻于九重友鸞鳯于阿閣而乃遺榮髙蹈浩然賦歸左右琴書沾沾自適是蓋學靖節而過焉者固非流俗徇祿忘返者所可同曰而語也雖然方今聖明在上求賢如不及非若彼時有一靖節而不為用是以山林有志之士莫不以㓛名自奮思有所樹立矧文卿家世顯融年甫強仕固冝以退為進不冝遽自棄也若夫優哉遊哉聊以卒歲庸伺它日奚晚乎因書以為記至正七年六月翔旦書與沈存齋書昔者魏公子無忌食客三千人名冠諸侯及其為趙赴秦軍也無一人為公子畫策而謀却秦以存趙者獨夷門監者侯生生固不受公子財者也嚴仲子以諸侯之卿相不逺千里奉百金為軹深井里人聶政之母夀政不肻受趙亡四十萬之衆不能解邯鄲之圍魯仲連以東海布衣掉三寸舌與魏將軍新垣衍極言帝秦之害秦軍聞之為却五十里平原君奉千金為夀不受而去嗚呼三子者玄以謀或以勇或以口辨較其所為雖或未合于大義然其奮不顧死生為人排患解紛報仇讎使天下後世想慕其為人欣欣然願為執鞭而不可得者徒以不受人之財與金耳某也身處布衣之賤迹過抱關之陋困亦甚矣然幸不鼓刀市井為狗屠得以句讀訓故為人童子師旦夕備甘膬養老母不啻足矣顧以年兼喜懼人子之心有不忍言者間託友人某買山擬預營夀藏不自意聞之執事執事不謀親友遂探私帑得錢若干緡介朱君犯炎暑冒風雨西赱橫山購得之執事之義髙矣執事周人之急類此亦多矣執事讀古人書豈聞魏公子之風而興起乎然執事寡嗜欲薄冨貴樂恬靜方將棄田宅挈妻子入山林躬耕采藥蟬蛻穢濁以浮遊塵埃之外使世復有侯生者流執事將無所用之然吾觀執事必不屑以魏公子輩自期而某亦豈敢妄以侯生之流自待哉然侯生不以監門困故而受財魯連不以却秦有㓛而受金彼固皆天下之士也而某何敢望焉若夫聶政市販因汙之人耳卒不以母故而受人之金某自揔角從父師誦詩書習聞前言往行粗知貴義賤利之説執事于某非有葭莩之親某于執事非有纎芥之勞徒以家貧母老念先事為備遂辱執事遺以山山之直雖不及百金然人有德于其親則于金何有向也知貴義而賤利今也利執事之山而受之執事不暇顧傷惠而與某某又不暇恤傷廉而耴之執事且傷廉之事市販之人不肻為執事師古人學古道豈冝以某之故而受傷惠之名乎執事視財甚輕視義甚重然吾聞之義莫大于愛人執事愛人以德而使某蹈傷廉之非而為軹井深里人所笑亦豈執事意乎今以山錢若干并據文納上執事幸聽其言察其心歸其錢于私帑然後乞以據文見與則執事之賜厚矣否則并其文不敢望懇懇之私惟執事悉焉題跋書石抹氏家譜後昔金源氏代遼有國嘗易其貴族之姓𫐠律為石抹氏其子孫策勛天朝散處四方率以武㓛顯若今雲南元帥存道公及平江萬户伯璣公是已然存道公蓋嘗持文衡于四川行省及其請于朝而復妵也故國子監丞莆田陳公衆仲序之甚詳今伯璣之妵雖未及復然其譜而存之豈亦有所待也夫凡其世次之隆勳代之盛諸公論之備矣豫獨推本而言之者蓋亦表其妵之所自云耳書故御史鄭公從之嵩山五詩後右嵩山五詩故監察御史洛陽鄭公從之棄官學道之時手書其所作也昔漢梅子真為南昌尉數上書譏刺權姦不見納遂棄妻子去九江時人傳以為仙公當至元全盛時非若西都之季而時相用事非有元始顓政之大惡其為御史又非南昌尉所可同日而語顧以直道見幾輒亦棄妻子著道士服為黃冠師終其身不還鄉里其去就之際視子真有甚焉者然子真之議論風旨見于漢書班班可考千載之下尚想見其為人今公之所建明未知太史氏悉得書之與否尚幸其蟬蛻穢濁髙世絶人之槩見于詩者直與嵩髙之氣相盤薄世之側媚耴容持祿固位者聞公之風亦可以少愧矣雖然子真去後人或見其變妵名為吳市門卒者庸知公不與司馬子微之流注來人間乎顧安得而見之也書中書除目御書𣪚官後右中書除目凡六人所賜𣪚官實仁宗皇帝親御翰墨為之書而故蔡國文憲公臣郭貫時由治書侍御史遷禮部尚書以從五品秩超授嘉議大夫而居其首一時氣象見于雲章奎畫藹然虞庭命官之意儒臣之寵未有盛于此者蓋國家以神武不殺奄有四海而典章文物至仁皇而大備鴻儒碩彥遭際聖明並列庶位而臣貫尤以文學老成蒙𬒳優擢如此書曰知人則哲能官人又曰夙夜惟寅直哉惟清然則非仁皇之聰明睿智弗能以知臣貫非臣貫之寅亮直清不足以堪上命故其厯事三朝致位廊廟卒為名臣豈非簡注有素而自積者厚乎嗚呼鼎湖之龍既逺九原亦不可作抱遺弓而悲風木者尚知以孝為忠思所以引而弗替哉至正七年十月庚辰布衣臣陳基拜手稽首謹識書太古字説後河東運使髙昌拜住公字太古中朝諸名公為文為銘為詩以彂明其義無餘藴矣復俾基一言以申其説基聞公曽大父鞏昌王大父安懿王咸以純一無偽之德歷事纍朝卒致端拱之治至公之父平章公季父御史大夫祗遹先猷為世大臣而公又克承世澤致位通顯其在中臺為良御史行部為賢使者庸田司復著能聲而任鹺臺也又一時之慎選然則所以紹其家業者亦豈外于純一無偽純一無偽者何太古之道也夫名者實之賔而字所以敬名也公方嚮用于時所以奮庸熙帝之載以光于前人則于敬名以稱夫實乎何有公尚勉之哉跋學齋侍御張掖劉公洛陽懷古詩右洛陽懷古詩一首西臺侍御張掖劉公之所賤也公以學問政事方用于時而其為詩清新雅麗有則至以周公卲子對言則先儒之微意而公之學有所本也刻而傳之豈惟洛陽之盛事而巳哉跋張彥輔畫拂郎馬圖至正壬午豫客亰師而拂郎之馬適至其龍鬃鳯臆磊落而神駿者既入天廄備法駕而其繪以為啚傳諸好事者則永嘉周冰壷道士張彥輔並以待詔尚方名重一時然氷壷所作識者固自有㝎論至于彥輔以其解衣盤礴之餘自出新意不受羇紲故其超逸之勢見于毫楮間者往往尤為人所愛重而四方萬里亦識九重之天馬矣此卷乃其最得意者俯仰八九年復于顧仲瑛氏處見之追懷疇昔重為增慨韓文公有云千里馬常有伯樂不常有吁世豈惟無伯樂哉雖欲求如彥輔之圖寫俊骨亦不可復得仲瑛其可不寶而玩之乎跋西園雅集啚故宋駙馬都尉王公晉卿西園之集亦盛矣蓋非駙馬之賢不足以致諸老非諸老不足以成西園之勝然則戚畹之貴不足為駙馬榮而其名垂不朽者政以其能文好士耳吁自昔王公大臣孰無園池水竹之樂百世之下能使人臨文興慨甚謂世道之盛衰人物之消長于是乎在則夫斯圖之見重于世又豈惟以西園而巳哉跋康里承旨遺墨古故翰林學士承旨康里公遺墨四帖其後兩帖乃公在宣文閣時所書以遺基而基轉以豫顧君仲瑛者今年孟春過玉山草堂仲瑛出以見示伏而玩之恍如見公與王右軍父子翺翔于天門鳯閣之上而蛟龍鸞鵠為之先後也九原不可復作尚幸數從仲瑛遊時一披展俯仰今昔得不重為增慨乎跋貫酸齋書歸去來辭酸齋公如冥鴻逸驥不受矰􅌳羈靮而其蟬蛻穢濁逍遙放浪而興造物者遊近世蓋未有能及之者其自謂平曰不寫古今人詩章而獨慕陶靖節之為人而書其歸去來辭觀者殆不可以尋常筆墨蹊徑求之也至正十年五月二日臨海陳基識傳傳道人傳傳道人者名道清字隱陽燕人也嘗以皂􅊢給事中書刑部積勞當食九品祿會河南有以詿誤徴繫請室者若干人道人獨哀其非辜每加存恤未幾詔赦出之尋許令還官于是皆私德道人而道人亦雅知河南風土之勝又幸有東道主乃謀于父兄妻子不逺千里謁告往訪之既至爭迓之于門相與道舊故甚歡又將有以厚餽之居無何偶行關陕間值黃冠師而與之語因請寓宿師與之端坐竟夕不寐俄默然若有會于其心者乃賦五字詩二首語皆超悟所謂黃冠師不知其為何如人也旦日遂易𥘉服還謝舍主人悉辝其所餽不受且曰吾平生雖未始讀書然亦嘗聞漢之絳侯矣勇足以將百萬之軍而怯不堪一獄吏榮為萬乘之卿相而辱不逮一匹夫此無它知進不知退也子等固非絳侯之倫然不幸而逮捕則無以異使吾以嚮之侵辱絳侯者以侵辱子獨不得千金歸遺父兄妻子乎顧義有所不忍也吾聞古之有道者祿以萬鍾位之上卿而不顧今吾徒用一皂􅊢舍去繩墨質鈇之役而以虛無為本清淨為宗其自視雖不敢遽與古之有道者齒然去就輕重孰與勇怯榮辱相尋于死生得喪而不知者嗚呼吾尚安用君之所餽為哉乃去入嵩山受隂符道德南華諸書于陳錬師居八年不與父兄妻子音問相接父兄妻子亦莫知其所在也洛陽之三井洞實故劉尊師錬丹處道人輒因故址築環堵坐其中率百餘日不出好事者或往候之亦不與之語獨見御史斡勒公允常環偉特逹器識絶人心竊慕焉而公亦喜其不務為詭異之行誕幼之言以驚世駭俗因折節與之交公嘗語之曰吾非好為是驅馳也徒以君親之恩未報耳他日倘遂吾初心則葛巾杖屨相從于山顛水澨不難矣道人方闢真館于洛城之東則欣然曰大夫進足以為邦家之光退不失于泉石之榮故曰㓛成名遂身退天之道後三十年當候公于此矣時豫客公所因與道人善見其語默止作無異庸衆人然不飲酒不茹葷而神全氣澤其中之所存蓋有異于人者故豫樂為之道也贊曰昔金源氏之時有健卒曰颵腿王者𥘉不識字一旦舉筆成章時人以為得道稱之曰王先生平章趙公間間名重當世尤雅敬之今道人之出處大略與先生相近而御史公之學問政事與夫㓛名未艾視趙公且將無愧然急流勇退之志哉者過焉故豫並著于篇以伺云哀辭葉孝墅哀辭並序葉孝墅世居天台少孤雅志好學既冠遊亰師見項君子虛子虛與葉氏世有姻好而孝墅執子弟之禮惟謹相與甚歡子虛儒者而隱于黃老以醫名亰師亰師之人無貴賤賢愚皆趨之孝墅與之周旋應接竟曰不倦而能安淡泊服勤苦聲色勢利服玩宴樂舉無所嗜獨尚儒術善楷書好醫藥錬金石草木為丹劑號能精絶不輕售人子虛甚器重之孝墅既早失父母幸有兄弟然皆未有子去年兄若弟不逾月俱喪訃至孝墅哀慟歐血仆地頃之復蘇然竟以是弗起子虛亦固知其不可救而生之之心未已尚恐已見或弗及欲致它醫孝墅曰使世無良醫則巳如有之豈復有賢于秦醫緩者耶然膏肓之疾雖緩有所不能為公今之緩也吾之疾公莫之為况它醫耶夫人窮則號父母吾今無父母矣公獨非吾父母顧力有不可為者豈非天耶獨念吾兄弟無後吾死亦無後吾宗亦何至是耶雖然是亦天耳吾之命信懸于天矣尚何言耶尚何言耶嗚呼何其言之悲乎始余居里巷時聞葉氏世有令德及與孝墅友又信其為佳子弟俱留亰師見其趣舍之不苟言行之有制未嘗不與子虛稱之而人亦莫不稱之也意其必有所樹立克享前人之德乃今不幸而兄弟相繼以死夫有佳子弟如孝墅而弗克夀世有令德如葉氏而弗克有後此天者之所以不可必而君子之所哀也故為作哀辭世之知孝墅者固已同豫哀矣其不知者尚因辭以見之其辭曰爾車非不利兮又循循其擇路既膏舝又挾輈兮馬􅋮首其欲鶩鼂出門以就軌兮夕亡輻而失馭何殃慶之不以其類兮俾若人而弗祚生何恃而何怙兮死曷往而曷歸尚魂氣之流通兮覽舊丘而下之哀若人而不可復見兮耿豫懷而增悲夷白齋藁外集卷終
