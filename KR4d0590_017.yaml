front:
  text: 夷白齋藁卷之十七
  hash: sha256:2169b91d565d52aae80e8645f7879f72c427438be49b8bb002a49290e00e8f6a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_017-1a}
body:
  text: 臨海陳基著金華戴良編序頋友文字序吳下縛茟生曰顧輔字友文其縛筆視近世吳興諸名家不多譲間請余講其字而序之其名若字盖夲乎魯曽子所謂君子以文㑹友以友輔仁之言也曽子之言尚矣余請􅈬生之業而為之說可乎昔之善言書者盖以刀稍喻筆焉故揚子雲曰刀不利筆不銛而獨加諸砥信乎刀不利雖有桓公之葱文王之録太公之闕闔閭之干将莫耶曽不足以刜秋蓬剪腐卉尚奚耴其㫁犀象屠蛟龍而鋒不剉乎筆不銛雖有文犀之植象齒之管秋兎之翰豊狐之柱縁飾則不啻侈矣以之為書則偃仰乖方向背離軆從横牽掣舉不適人意而書之道㡬息矣然則砥削者固輔刀筆之羙器也士之為士也亦然不博之以文則學無所殖不輔之以友則徳無從立故詩曰朋友攸攝攝以威儀孔子曰朋友切切偲偲楊子曰朋友以磨之友也者其又士之砥削乎甚矣㢤生之業克稱乎其字也是故非學不足以為士非友不足以立徳非言不足以垂世非筆所傳者不博而筆也者又士之所以羽之翼之左之右之以圖不朽者也噫生也不徒名其名将思有以行其行不徒字其字将思有以事其事不徒藝其藝将思有以試其試吾聞之有為者亦若是生之業既切扵士之用生之字復切扵士之學則余以士勉生世之樂与人為善者得無以為過乎昔者庖丁好道而進扵技今生之業非直觧牛者比也又庸知其非好道者然則余勉之也非過也李僉事政蹟序至正十二年春朝鮮李公仲善以浙西道㢘訪僉事分憲吴下督行省兵禦海㓂未㡬淮右妖㓂竊彂屠郡縣殺守宰攻䧟湖㐮蔓延江東西羽書絡繹告急無虚日人心震懾吳為江表大郡介居水陸之衝東濵鉅海南控甌粤西連荊䠂無髙山大谷以為之阻東南所賦水土百物吳為特盛倉廩府庫之所儲偫歲輸亰師以供天地神明之祀軍國之須與夫民人之所恃以為存者當務之急宜莫如城而吳城故閎壮周餘四十里舊阯僅存謀繕完之伇最鉅承平曰乆民習宴安不可與慮始議下衆口交怨公乃因父老而諭之曰國家以熈洽之仁汪濊之澤休飬生息尔父兄子弟乆矣一旦盗𧺫倉猝淮䠂間環地數千里生民塗炭其故何㢤城郭廢而兵革不戒也今吾受天子命除民所疾苦目睹無城之害而不與尔父兄圖之有如事不可測噬臍之咎将誰任之吾聞之備豫不虞政之善訓也故曰有備無患今吾用尔力新尔城深尓池整齊守具豈惟倉廪府庫是頼尓子子孫孫将永其利乃計城文尺視民貲多寡募工分築有差民始翕然趋事施楨幹審榘度萬杵齊奮殷若雷動公不憚暑暍親出入版築間勞撫士卒以恵濟威以勤率惰鉅萬之費非常之㓛三月而畢公既率有司筮日告神又具牛酒犒士卒謹成事禮也方是時㓂入杭繼入湖入常燒民廬劫庫蔵縦兵剽掠烽燧四𧺫鉦鼔之聲接吳壤浙右騷動吳獨以公故無恐公忠貞㢘㫁行事適機冝晝申嚴約束夜循行井里㰱血誓衆務戮力以身徇國用命者賞無状者誅慷慨激昂士氣大振吳民老弱相慶有謌者曰公城我城公厲我兵公用法平又歌曰公保我妻帑公衛我室家公我父母報公何有君子曰李公其古之遺愛乎何輿人誦之如子産也天子聞之賜公爵優二等盖将囙是而大公之施始扵吳逹扵天下而輿人之誦史且不勝書矣噫李公其誠古之遺愛乎乃論次公政蹟為之序以慰吳人之意以傳之四方以侈公之恵而樂為天下道也十三年春三月序崔衢州政蹟詩序淮右妖㓂首難禍延江東西守吏號能執干戈衛社稷者衢有崔侯焉𥘉賊䧟徽饒乗勝入衢之開化㩀縣治燒民廬放兵劫以安邑父兄既刻石紀侯勲蹟復相謂曰侯始通守吳邦属四方無事首興學校以教吾子弟歲旱則禱雨祈榖以活吾老弱㓂至親擐甲胄冐矢石出萬死不頋一生以捍衛吾郷邑侯治郡為賢牧守討賊為良将帥進不貪㓛退不頋私不毒無辜不專威福折衝果毅而濟之以㢘平侯之徳非石不傳盖詩所以羙盛徳謌休㓛而告来裔也嗟乎衢之父兄亦可謂善頌矣國家承平日乆民不知兵一旦變𧺫不測所在肝腦塗地井邑丘墟禍亦慘矣誠使撫字得人政平訟理則民入有父母出有司命而金湯之固不在乎堅城深池而天下人安矣今衢有賢侯誠冝璽書褒勸増秩賜金以風天下然嗟嘆不足而詠謌之其尔有待扵觀風之使乎吾聞賊在開化時獨不毀崔侯之碑衢城火侯之苐獨無恙豈天之眷佑賢侯将使人感之如􅻠使君而反風㓕火之異又将愛之如劉太守耶余不佞敢論著作詩者之意為之序以遺衢父兄夫豈以侯之故㢤亦樂為天下道也十三年八月既望序送陳惟允序余友陳惟允世家閬州七世祖宋宣和間進士至朝散大夫居南康遂為南康人其先君子天倪甫師事故内翰臨川吴文正公誦詩書百家之言以隐徳終扵吳家徒四壁獨遺書數百卷母夫人日夜督惟允與兄惟寅誦習之二子復以儒業其家從容文藝出入綰紳大夫間而惟允尤善鼔琹擬古人摹冩山水樹石為屏障瑰詭恠竒可喜今年春将去吳適金陵囙北上亰師從四方名人魁士振纓儒林揚鑣藝苑以其所能自奮母兄樂其志既束装筮日以戒其行尋以余同妵且雅知其兄弟賢願貽一言以為别噫世之厭梁肉􅊞紈綺入則穹居廣厦岀則連車列騎者果何如人㢤然不易世子孫或羸寒困餒為屠販為奴隷甚至為溝中之瘠者又孰使之然㢤盖冨貴無常不足恃也陳氏由閬州徙南康又由南康至吳門俛仰数世徒以朝散府君遺澤綿綿延延至惟允兄弟孤犖貧窶亦甚矣然猶知讀父書躬孝友悛悛信譲能詞章工文藝號佳子弟先民有言損之而益敗之而成䖈之而樂此造物者之扵人所謂礪鏃而栝其羽也今陳氏以孝友為鏃以文藝為羽以孤㷀為礪以貧窶為括其材精其氣利其去而與英畯角伎能殆飬由基之扵射彂則無不破的者惟允行㢤嗣先君子之業飬母夫人之志迓續朝散府君之餘緒常所徃来者咸為詩以稱顯之矣余不佞敢申以為序今年為至正十四年春二月甲午送李徳中序國家歲漕東南之粟毎春夏由吳門抵直沽以億萬計今年夏漕府史宣城李君徳中以次當行吴之君子與徳中善者咸送之婁江之上且賦詩以華之盖徳中以江左衣冠家少從其郷先生今兵部貢公伯仲逰且親精敏肅給刻已清謹事賢漕長為僚吏有多士之譽斯行也當見兵部公為我謝曰聖君賢相紹隆大業廓滄溟為餉道利舟揖為車馬其視秦之飛芻輓粟漢之負檐千里唐之陸運水行率数十鍾而致一石者其得失不啻千萬矣間者又大興農政遣使江淮募民入畊大河之南遼水之東皆置庸田漕運司不使地有遺利民有餘力㓛成事集将見中土之粟又百倍東南矣今歲遂省夏運若干萬分饟淮䠂因時變通以便漕事此千載一時有志之士扵是執文書賛幕府誓先士大夫戮力海道如徳中者兵部公頋不喜歟况公以班馬之倫居列卿之位且世為太史氏感明良之相逢覩庶政之畢舉宜與中朝能言者並為文章頌吾君之徳羙吾相之㓛鏗鍧炳耀垂示無極嗚呼休㢤斯人臣之盛際也徳中行矣漕事告竣讌勞禮畢從兵部公優㳺詠歎當筆授以歸遺東南人共謌之余不佞亦何幸竊覧焉至正十四年五月朔旦夷白齋藁卷之十七
