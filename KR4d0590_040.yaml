body:
  text: 陳基傳吳人尤義撰陳基字敬初台之臨海人父祥多聞好學而尤善老子清淨之説平居常黃冠鹿裘與方士遊沒時基年甫九歲越五年母夫人薑氏即命與兄聚從師于杭又四年從金華黃文獻公溍受業至正仍紀元之元年從文獻遊京師授經筵檢討其徒有為御史者以言責􅖴于基謂並后為致亂之本因草諌章力陳其失兾君覺悟以正始也而上方溺愛詰知其由欲置基于罪怒且不可測遂引避南歸于鄉奉母夫人西至吳教授諸生備養惟謹為詞必務上法三代下軼漢唐東南聲文為之丕變逺近學者爭師之户外之屨恆滿屬南州用兵朝廷開行樞密府鎮撫南服起基為都事轉江浙行中書省貟外郎俄升郎中時平章張士信統兵鎮杭基以本職參佐道之以正杭有嶽飛墳蕪穢弗恭久矣基追慕興慨以狀請于朝俾與厯代忠臣並列春秋致祭尋自為文刻石墓上以表其功西湖書院舊有經史書板兵後零落無幾即白平章出官錢若干補綴成帙夫以天理民彛泯亂之秋干戈相尋日不暇給基乃贊佐餘力為其所得為使聖經賢傳復明于當時崇德報功無愧于往昔雖武夫悍卒聞下風而望餘光亦知有所興起擴而充之是大有功于名教也未幾由杭來吳參太尉軍府事及太尉自王于吳群下同聲賀之而基獨諌止太尉欲殺之不果巳而超授內史遷學士院學士階通奉大夫覃恩二代凡飛書走檄碑銘傳記多出于其手基每以為憂而未敢以為榮也今國家命將平吳臣多見誅戮而晏然無恐朝論多基之能尋名入預修元史書成賜金而還洪武三年十月壬午以疾卒于常熟縣河陽里之寓舍得年五十有七娶王氏先四年卒無子以弟之子訥為後女四人長適吳昱次車允次幼皆庶出基平居慎重寡默與物無競家人㒒􅊢未嘗見其疾言遽色宗族故舊自浙東來依率飬育奬勸俾各有成士有才可用必引而進之有喪不能舉者為買棺斂恩意過于平生方太尉僚屬強占民廬基獨以巳俸買宅天心里即舊屋數楹稍加塗塈環藝花卉之屬號小丹丘休沐之暇輒與客尚羊其中啜茗清吟議論古今出入經史百氏危坐終日歲時有事于祖禰始殺牲以展其孝敬𥘉非薄于友也吳國將亡食肉者咸惴焉恐蹈鼎鑊君子謂基宜保終吉巳而果然噫父母全而生之子全而歸之若基者其亦可謂克全而無憾者今藏于家有夷白齋稿二十卷觀其文雄而氣髙可以黼黻皇猷敷陳帝業而乃使留滯江湖之上驅馳戎馬之間竟賫志以沒兹其可惜也夫
