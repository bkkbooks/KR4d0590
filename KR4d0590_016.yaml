front:
  text: 夷白齋藁卷之十六
  hash: sha256:3583780a52c92284a08da4839e04fa561abe94c582f8ca2c9bb601b6ac404169
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_016-1a}
body:
  text: 臨海陳基著金華戴良編序送張郎中詩序户部郎中大名張君師允以銓選使江西也道過吳吳大夫士之從户部君遊者冠蓋相望户部君皆折莭禮下之及其將西行也大夫士之能言者各賦詩合古今體凡若干首俾余為序以送户部君禮也昔户部君以進士取科甲蓋嘗擐忠信之甲胄執禮義之干櫓用其全鋒以與天下士決勝負矣其裒然而舉首也雖有勇如賁育急與之角力不敢暇其入翰林為史官由太常拜御史秉筆㝎褒貶執法論是非廪廪乎良史諍臣之風雖劫之以衆沮之以兵弗變也及遷户部為尚書郎不逺數千里使江西右持衡左執權以銓量行省之人物其輕重豫奪皆懸户部君之手是行也意其必乘堅車擁髙蓋連駟結靷負弩矢先驅以夸耀四方乃今屏徒從撤儀衛悛悛卑讓自視若諸生日以禮接大夫士殷勤之歡惴惴焉惟恐失其心是懼夫力能以布衣決髙科魁天下士秉茟為史官執法為諍臣而不能以尚書郎天子使者而失大夫士之心豈大夫士之力勇于賁育其威加于兵衆哉蓋大夫士禮之所在也噫禮之可以為國也久矣使充不失大夫士之心舉而措之則操輕重以豫奪天下之人物蓋恢恢乎其有餘也然士有不以豫奪為輕重而以禮為去就者豫章徐孺子其人也户部君行矣銓選事畢舍車而徒間行豫章以觀孺子之遺風復有下榻如陳仲舉者乎詩云髙山仰止景行行止户部君能以禮接大夫士則陳仲舉不得專美千載矣至正十三年三月甲午序白羊山紀逰詩序勾吳沈髙士仲説澄靖寡欲誦詩書百家之言以孝義稱于鄉居祖夫人憂廬于墓側既終喪隱居耕釣以山水自娛每衣鹿裘著葛巾過天平謁范魏公祠徘徊不忍去間行其傍林塢得地曰白羊山而樂之將結廬讀書以求其志乃三月既望携所知楚人朱安道舟行數十里至其處仰瞻天宇之髙俯覽時物之暢詠泰伯之遺風望闔廬之故墟引茟賦詩捴凡若干首余得而屢讀之既愛其舂容間逺有髙世絶俗之思又念不得從仲説蔭長松藉豐草歌考之詩賦伐木之章以寄情煙雲水石間然魏公之流澤未泯天平之白雲可攀他日命車白羊之麓欵門處士之廬而某丘某水將因詩以索其勝則詩也不可以無序于是乎書送邵知州序吳郡屬部由縣而升州者吳江其一也雖地方百里大抵具區之濵重湖復陂浸淫湠漶引三江而歸之海水之所不及者然後人得以樹藝其上故必謹堤防設機械率老弱疲筋力弊弊焉日與水爭利幸天無淫雨歲之所入僅以輸租賦給徭役否則溝塍畎澮淪為洪濤人困力殫而有司十一之征上下交病矣其州治又居水陸之咽喉璽莭羽書旁午絡繹防虞供億百倍他州故任師帥于此者視他州亦難其人必德足以宣化教才足以寄民社眀足以聽獄訟敏足以備軍儲而又濟之以廉行之以恕如前知州燕山邵侯而後可也𥘉侯之下車也當國家責成守令之時侯首勸農桑均賦役勉學校蕳民訟以崇本抑末為務設施次苐恪守章程及南北徴兵調彂無虛日侯鞠躬夙夜弗遑啓處而民不廢耕桑官不闕餽餉使車驛傳擐甲胄援枹鼓之屬肩相磨而踵相接者不失勞來之禮噫侯可謂克副責成之意矣三年政孚解印綬戒車馬言還而聖君賢相方綜核名實厲精為治若侯者疇庸考績將進而與中朝公卿大夫接武周行以熙庶務皆分內事也此不敢為侯道獨論次侯在官得賢師帥之職既以餞侯之行以慰州人之思禮也送徐仲剛詩序無錫兩君子其一曰徐君元度仕為王官居亰師有聲其一曰倪君元鎮隱居著書求志不回余皆辱皆辱交焉仲剛徐君之子倪君之壻也徐君俶儻好義博雅有識度與名公巨卿遊許與意氣有國士風倪君讀古人書忘渴飢為文章有魏晉間人氣韻其髙不仕之莭雖漢東都士大夫弗過也兩人者所趨不同要其歸皆激卬底厲不與流俗同乾沒然兩家是用日益貧徐君以祿自飬倪君以書自娛其子弟各習知二父意仲剛獨瓌竒敏給好禮而文居則從婦翁學為詩出則從父官于朝夫生為名父之子長娶名父之女出處問學不離二父間仲剛之得于天者夥而決于人者鮮如是哉雖富貴利逹不足為仲剛道然奉以周旋弗敢失墜此季文子所以為魯之賢大夫也仲剛勉乎哉凡與兩君子好者咸賦詩以贈仲剛屬余為之序送郯九成詩序至正十三年夏五月海漕彂吳門漕府史吳興郯君九成實贊幕府吳之君子皆喜為詩以道其行且曰去年春海寇犯昆山􅊞餫餉慿陵作氣勢以抗􅊇官軍淮右狂孽蔓延江浙羽書徵彂絡繹道路無虛日人心洶洶久矣賴天子神聖賢相枋國命貞忠廉毅之臣捴漕事分遣將帥出師四討蚊蚋蟻蟲蠢尓無知者以次殱蕩海寇聞風率醜類逃匿傍徨蹙縮願宥罪自新用是人心之憂者更釋然以喜九成學古通今器局閎博論議慷慨為詩章有作者風乃今職文書贊海漕進無金革矢石之虞退無父兄妻子之憂左川后右海若風恬浪平一日千里而億萬之粟上以祀天地宗廟百神下以祿三公九卿百執事內以給宿衛外以足軍旅者不日逹亰師春餫甫至夏餫踵來此國家萬世無疆之福臣子戮力報效之秋也上尊之賜宮錦之榮視昔有加而九成仰則瞻都邑之雄俯則覽山河之壯感聖澤之汪􅐮侈文物之鋪張所謂詩章九成之所長者將與中朝能言之士嗟歎不足而詠歌之以極陳所遭之盛異日南還解行李出所有吾黨好事者將爭先睹之為快九成尚無以謙讓未遑為辝也送塗叔良序豫章塗君叔良從其鄉先生楊顯民氏學在亰師也客翰林待制武威余公所而雅與新安程君以文善余雖不識顯民幸因程君而識武威公武威公視顯民雖出處不侔要與程君皆強志篤行為文章不詭仁義叔良逰三君子間悛悛言行讀書作古今體詩不蹈常人軌轍及武威公出僉浙東憲事未幾去官居淮西余亦親老還江南叔良與程君留亰師京師之士非程君行輩則與叔良年相埓率彬彬嚮用程君仕宦二十年業愈精身愈困而志不少衰需次翰林為屬官老且至矣叔良學顯民氏學為武威公客又從程君居輦下借勢王公巨人希進耴冝無難者獨辛苦憔悴由亰師行數千里過吳門將歸豫章不果又復如亰師噫是固學古道者也吾聞古之道不足耴于今豈信然乎雖然深山之木巨細林立匠石撡斧斤過之必取其堅實美澤適廊廟都邑之用者而木之堅實美澤恆出于風霜摧枯拉毁之餘蓋損者益之夲敗者成之基此造物者之所以玉成萬物也士之羈窮憂患頓踣無憀所以動其心忍其性庸巨知非造物之意乎方今聖君在上賢相在下左繩墨右規矩以待天下之人棟梁桷榱各隨其器而任使之岩穴之材如顯民者將不得自棄于斧斤之外則摧而愈堅枯而彌實拉毀而益美且澤者為何如也然則造物之所以為司繩墨職規矩者之計久矣庸因叔良行以此謝程君遂以為叔良贈云贈盧仲章詩序天台盧仲章以能刻金石為印章知名大夫士間大夫士之樂道仲章者咸寵之以詩仲章亦何能致多若是哉夫工商梓匠邦國之用器械之備飬生送終之不可以或闕者也必服牛馬越川谷逹陵陸窮深致逺以交乎中國而後可以通有無利器用而宫室具焉然商不得齒於大夫士工不得與于衣冠之末何哉所業不同而所趨者異也今仲章之藝以為工乎則大夫士之所齒以為商乎則衣冠之所樂道而與進之不服牛不駕馬無陵陸之虞無川谷之險而亦以其藝交于中國其為用雖若無與于飬生送終然大夫士之家不可以少焉噫仲章之藝亦善矣古者諸侯謂之章大夫謂之印今者夫人而用之仲章以其藝逰于夫人之間而獨竊然從大夫士以求其言為務大夫士固異于夫人也哉于其有請于豫也書以贈之夷白齋藁卷之十六
