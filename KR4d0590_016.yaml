front:
  text: 夷白齋藁卷之十六
  hash: sha256:3583780a52c92284a08da4839e04fa561abe94c582f8ca2c9bb601b6ac404169
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_016-1a}
body:
  text: 臨海陳基著金華戴良編序送張郎中詩序户部郎中大名張君師允以銓選使江西也道過吳吴大夫士之從户部君㳺者冠盖相望户部君皆折莭禮下之及其将西行也大夫士之能言者各賦詩合古今軆凡若干首俾余為序以送户部君禮也昔户部君以進士取科甲盖甞擐忠信之甲胄執禮義之干櫓用其全鋒以與天下士决勝負矣其裒然而舉首也雖有勇如賁育急與之角力不敢暇其入翰林為史官由太常拜御史秉筆㝎襃貶執法論是非廪廪乎良史諍臣之風雖劫之以衆沮之以兵弗變也及遷户部為尚書郎不逺數千里使江西右持衡左執權以銓量行省之人物其輕重予奪皆懸户部君之手是行也意其必乗堅車擁髙盖連駟結靷負弩矢先驅以夸耀四方乃今屏徒從撤儀衛悛悛卑譲自視若諸生日以禮接大夫士慇懃之歡惴惴焉惟恐失其心是懼夫力能以布衣決髙科魁天下士秉茟為史官執法為諍臣而不能以尚書郎天子使者而失大夫士之心豈大夫士之力勇扵賁育其威加扵兵衆㢤盖大夫士禮之所在也噫禮之可以為國也乆矣使充不失大夫士之心舉而措之則操輕重以予奪天下之人物盖恢恢乎其有餘也然士有不以予奪為輕重而以禮為去就者豫章徐孺子其人也户部君行矣銓選事畢舎車而徒間行豫章以觀孺子之遺風復有下榻如陳仲舉者乎詩云髙山仰止景行行止户部君能以禮接大夫士則陳仲舉不得專羙千載矣至正十三年三月甲午序白羊山紀逰詩序勾吳沈髙士仲說澄靖寡欲誦詩書百家之言以孝義称扵鄉居祖夫人憂廬扵墓側既終䘮隐居畊釣以山水自娛每衣鹿裘著葛巾過天平謁范魏公祠徘徊不忍去間行其傍林塢得地曰白羊山而樂之将結廬讀書以求其志乃三月既望携所知䠂人朱安道舟行數十里至其䖏仰瞻天宇之髙俯覧時物之暢詠泰伯之遺風望闔廬之故墟引茟賦詩捴凡若干首余得而屢讀之既愛其舂容閑逺有髙世絶俗之思又念不得從仲說䕃長松藉豊草歌考之詩賦伐木之章以寄情烟雲水石間然魏公之流澤未泯天平之白雲可攀他日命車白羊之麓欵門䖏士之廬而某丘某水将因詩以索其勝則詩也不可以無序扵是乎書送邵知州序吳郡属部由縣而陞州者吳江其一也雖地方百里大抵具區之濵重湖複陂浸淫湠漶引三江而歸之海水之所不及者然後人得以樹藝其上故必謹堤防設機械率老弱疲䈥力弊弊焉日與水争利幸天無淫雨歲之所入僅以輸租賦給徭役否則溝塍畎澮淪為洪濤人困力殫而有司十一之征上下交病矣其州治又居水陸之咽喉璽莭羽書㫄午絡繹防虞供億百倍他州故任師帥扵此者視他州亦難其人必徳足以宣化教才足以寄民社眀足以聴獄訟敏足以備軍儲而又濟之以㢘行之以恕如前知州燕山邵侯而後可也𥘉侯之下車也當國家責成守令之時侯首勸農桒均賦役勉學校蕳民訟以崇本抑末為務設施次苐恪守章程及南北徴兵調彂無虚日侯鞠躬夙夜弗遑唘䖏而民不廢畊桒官不闕餽餉使車驛傳擐甲胄援枹鼓之属肩相磨而踵相接者不失勞来之禮噫侯可謂克副責成之意矣三年政孚觧印綬戒車馬言還而聖君賢相方綜核名實厲精為治若侯者疇庸考績将進而與中朝公卿大夫接武周行以熈庶務皆分内事也此不敢為侯道獨論次侯在官得賢師帥之職既以餞侯之行以慰州人之思禮也送徐仲剛詩序無錫兩君子其一曰徐君元度仕為王官居亰師有聲其一曰倪君元鎮隐居著書求志不囬余皆辱皆辱交焉仲剛徐君之子倪君之壻也徐君俶儻好義博雅有識度與名公鉅卿㳺許與意氣有國士風倪君讀古人書忘渇飢為文章有魏晋間人氣韻其髙不仕之莭雖漢東都士大夫弗過也兩人者所趋不同要其帰皆激卬底厲不與流俗同乾沒然兩家是用日益貧徐君以禄自飬倪君以書自娱其子弟各習知二父意仲剛獨瓌竒敏給好禮而文居則從婦翁學為詩出則從父官于朝夫生為名父之子長娶名父之女出䖏問學不離二父間仲剛之得扵天者夥而决扵人者鮮如是㢤雖富貴利逹不足為仲剛道然奉以周旋弗敢失墜此季文子所以為魯之賢大夫也仲剛勉乎㢤凡與兩君子好者咸賦詩以贈仲剛属余為之序送郯九成詩序至正十三年夏五月海漕彂吳門漕府史吳興郯君九成實賛幕府吳之君子皆喜為詩以道其行且曰去年春海㓂犯崐山􅊞餫饟慿陵作氣勢以抗􅊇官軍淮右狂孽蔓延江浙羽書徵彂絡繹道路無虚日人心洶洶乆矣頼天子神聖賢相枋國命貞忠㢘毅之臣捴漕事分遣将帥岀師四討蚊蚋蟻蟲蠢尓無知者以次殱蕩海㓂聞風率醜類逃匿傍徨蹙縮願宥罪自新用是人心之憂者更釋然以喜九成學古通今器局閎博論議慷慨為詩章有作者風乃今職文書賛海漕進無金革矢石之虞退無父兄妻子之憂左川后右海若風恬浪平一日千里而億萬之粟上以祀天地宗廟百神下以禄三公九卿百執事内以給宿衛外以足軍旅者不日逹亰師春餫甫至夏餫踵来此國家萬世無疆之福臣子戮力報効之秋也上尊之賜宮錦之榮視昔有加而九成仰則瞻都邑之雄俯則覧山河之壮感聖澤之汪􅐮侈文物之鋪張所謂詩章九成之所長者将與中朝能言之士嗟歎不足而詠謌之以極陳所遭之盛異日南還觧行李出所有吾黨好事者将争先睹之為快九成尚無以謙譲未遑為辝也送涂叔良序豫章涂君叔良從其郷先生楊顯民氏學在亰師也客翰林待制武威余公所而雅與新安程君以文善余雖不識顯民幸囙程君而識武威公武威公視顯民雖出䖏不侔要與程君皆強志篤行為文章不詭仁義叔良逰三君子間悛悛言行讀書作古今軆詩不蹈常人軌轍及武威公出僉浙東憲事未㡬去官居淮西余亦親老還江南叔良與程君㽞亰師京師之士非程君行軰則與叔良年相埓率彬彬嚮用程君仕宦二十年業愈精身愈困而志不少衰需次翰林為属官老且至矣叔良學顯民氏學為武威公客又從程君居輦下借勢王公鉅人希進耴冝無難者獨辛苦顦顇由亰師行数千里過呉門将歸豫章不果又復如亰師噫是固學古道者也吾聞古之道不足耴扵今豈信然乎雖然深山之木鉅細林立匠石撡斧斤過之必取其堅實羙澤適廊廟都邑之用者而木之堅實羙澤恒出扵風霜摧枯拉毁之餘盖損者益之夲敗者成之基此造物者之所以玉成萬物也士之覊窮憂患頓踣無憀所以動其心忍其性庸鉅知非造物之意乎方今聖君在上賢相在下左繩墨右規矩以待天下之人棟梁桷榱各随其器而任使之岩穴之材如顯民者将不得自棄扵斧斤之外則摧而愈堅枯而弥實拉毀而益羙且澤者為何如也然則造物之所以為司縄墨軄規矩者之計乆矣庸囙叔良行以此謝程君遂以為叔良贈云贈盧仲章詩序天台盧仲章以能刻金石為印章知名大夫士間大夫士之樂道仲章者咸寵之以詩仲章亦何能致多若是㢤夫工商梓匠邦國之用器械之備飬生送終之不可以㦯闕者也必服牛馬越川谷逹陵陸窮深致逺以交乎中國而後可以通有無利器用而宫室具焉然商不得齒於大夫士工不得與扵衣冠之末何㢤所業不同而所趋者異也今仲章之藝以為工乎則大夫士之所齒以為商乎則衣冠之所樂道而與進之不服牛不駕馬無陵陸之虞無川谷之險而亦以其藝交扵中國其為用雖若無與扵飬生送終然大夫士之家不可以少焉噫仲章之藝亦善矣古者諸侯謂之章大夫謂之印今者夫人而用之仲章以其藝逰扵夫人之間而獨竊然從大夫士以求其言為務大夫士固異扵夫人也㢤扵其有請扵予也書以贈之夷白齋藁卷之十六
