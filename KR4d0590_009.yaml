front:
  text: 夷白齋藁卷之九
  hash: sha256:9b369fab7ff94954095f367b54141d846e6b7718d5625fd070bfaf4c676fa242
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_009-1a}
body:
  text: 臨海陳基著金華戴良編律詩七言次韻髙元善郎中見寄律詩二首憶昔同參寫鶩群每將騷雅佐人文詩成嶰谷鳴風竹琴罷瀟湘夢水雲南浦離情波浩渺北山歸思日紛紜可憐滿地秋如錦只有黃花好寄君詩酒相從歲已賖幽居人擬地仙家別來九陌風塵外望斷五湖煙水涯書􅈬蜀箋文勝錦宴歸漢署帽簮花它年或遂投竿志著我穐江倚釣槎元善嘗俾余記其所居松雲巢繼辱以詩為謝因次韻答之蕭蕭素髮魯東家豈有文章競綵霞髙世羡君期太白寓言容我詫南華神栖五老仙為侣夢繞三珠玉作葩為問松雲在何許此中非近亦非賖舟中讀漢武帝紀髙皇馬上爭天下丞相飬民方致賢帝業不曽階尺土兒孫何以算緡錢長生始誤神仙術巫蠱終虧父子天可惜春秋二三策獨留龜鑑後人傳次韻葉德新江上觀兵一水朝宗控百川著鞭此日許誰先手麾貔虎風生海膽落鯨鯢劒倚天潮汐怒隨龍變化雲山髙作鳯飛騫元戎一鼓收南服持奉吾君億萬年三塔寺江湖四月半隂雨山寺今朝方喜晴杖錫入城非避客琅玕繞屋正啼鶯寶樹著花當座落蒼龍分水入厨清為留一榻雲深處共話三生石上盟過夲覺寺懷欲了庵長老三過堂前歲屢過阿師行道近如何僧中此日如公少方外向來名輩多一室寶煙飄艾納六時花雨落芬陀寺門晝掩如廷尉滿地松隂覆雀羅寄顧髙士每憶吳門顧辟強舊開池館帶滄浪緑波芳草盟鷗鷺錦瑟玉笙悲鳯凰座客詩成誰最好故人酒後我多狂扁舟來往鵷湖上老倒猶能賦草堂寄鄭明德牢落乾坤獨鄭虔丘園風雨故依然腹藏元晏書千卷身受滕君宅一門里雲卧蝶迷遺世夢林居鶴避煮茶煙楊雄自昔多竒字老我猶乘載酒船過三塔灣留題緑水灣頭維畫舫白雲堆裏訪禪林上方樓閣丹青古下界蛟龍窟宅深五月鶯聲山寂寂一簾雨氣竹森森地靈不受昆眀劫留得長松捴十尋再用韻答鄭先生錬石無心輔漏天幽栖環堵獨蕭然松蘿雨後生朝菌藜藿年深沒故門里足濯滄浪池上水衣薰豕蝨竇中煙林居似厭城南淺重擬歸乘谷口船用韻答沈仲説結客東吳憶盛年多君燕處每超然千金昔棄朱公産一畞今無許子門里濯足洞庭天拍水挂帆笠澤栁含煙相逢一笑榮枯外猶勝虛乘訪戴船寄錢成夫貟外千里從軍客楚州故人吳下獨維舟關山别後鄉書少淮海平來相業優龍虎帳中勞逺望鳯凰池上莫多留平生愛殺韓司馬老我何妨讓一頭寄蔡彥文都事蔡子才多病亦多尺書千里慰蹉跎同逰暫阻紅蓮幕相寄慚無𬗋玉珂交義人人推管鮑新詩字字擬隂何淮南賔客如君少未許淹留桂樹歌九日百年鼎鼎成何事九日匆匆不在家莫遣秋風吹短帽羞將白髮對黃花詩因排悶聊時賦酒為銷愁爾謾賖欲向楚城髙處望不堪離思滿天涯九日簡同幕諸公兼寄吳中兄弟官舍蕭條淮水濵一樽九日謾相親那知黃菊籬邊客不笑𬗋薇花下人秋鬢白嗔烏帽側衰顔紅愛緑醅新中吳兄弟應相憶悵倚秋風北望頻阻風仲舉舟中小酌千里旌旗映日紅一天秋雨忽𪷟濛鄉書未有東南信客路不堪西北風泛水芙蓉依繡幕背人鴻寫避雕弓淮南酒薄猶堪飲時𣸪相從共一中墻角種菊三四夲頗可觀一官迢遞客天涯頗覺穐來興味佳有菊便同陶令宅無錢誰笑杜陵家幽叢密護霜前葉嫩蘂輕含雨後花賴有新詩相料理淮南酒薄不堪賖淮隂雜詩五首千里相逢淮海濵一枝誰寄嶺梅春老來易感山陽笛年少休輕跨下人失侣寫如秦逐客畏寒花似楚遺民每過百戰瘡痍地立馬西風為損神匹馬淮隂秋𣸪冬每尋陳迹不匆匆下鄉賔客貧無行南郭先生老病聾漢室㓛髙羞絳灌射陽門貴擬騫弓至今七尺城東墓一酌寒泉感慨中落木蕭蕭鴈度河西風嫋嫋水增波甘羅營裏秋聲急韓信城頭月色多淮市有魚聊可食楚山無桂不須歌古今無限關心事付與當年春夢婆江左妖氛掃未清山東豺虎又縱橫欲令斥堠收烽火須挽天河洗甲兵老馬獨嘶時北望賔鴻相喚盡南征腐儒愧乏匡時術搔首風前百感生兵火燒殘百草根人煙無𣸪萬家村黃金莫鑄忠臣骨白馬空招帝子魂易水有情人巳逝睢陽無援事難論何當親斬樓蘭首仗莭歸朝報至尊寄吳中分幕諸同志故人入幕蘇臺上老我從軍楚澤隈江海十年同聽雨關山千里獨持杯邊書到日多慿鴈驛使來時好寄梅慙愧𬗋薇花畔侣却依南斗望三台寒菊遍開可喜謾向鄰翁覔菊栽晚花踈蘂一時開寒欺楚澤三秋露暖透山陽十月雷多事狂蜂忙采去惱人輕蝶競飛來蕭齋對此渾無賴莫怪頻傾濁酒杯寄唐伯剛斷事官寒菊花開照眼新客窗風物未全貧旋賖陶令樽中酒敢比羲皇世上人官事有程仍笑傲鄉書無便任因循故人十月錢塘路誰謂城西探小春寄陳庶子參軍兼簡饒介之郎中楚天漠漠水迢迢千里懷人不自聊帷幄喜聞延曲􅊇行間竊恭事嫖姚江空不采芙蓉寄歲暮唯歌桂樹招華蓋仙翁如見問為言髀肉近都銷寄謝從義參軍兼簡唐伯剛斷事江左風流謝使君賦詩渾似鮑參軍一麾舊作錢塘守萬里新空冀北群官栁枝枝垂楚岸賔鴻箇箇入吳雲題書為報西樞彥十月山陽尚有蚊寄周信夫王叔眀二長史帷幄賢勞夙夜賔古今儒律兩彬彬漢庭重厚唯斯老江左寧馨尚幾人霜落吳門天接水雷鳴楚澤雨連旬黃梁酒熟淮魚白南國穐風不愛􅐜寄錢伯行檢校葉德新掾史少日錢君同汗漫中年葉掾共翶翔北窗坐傲羲皇世南省行陪漢署郎笠澤芙蓉秋萬頃楚天鴻鴈日千行幼輿若許歸巖壑便結茅齋野水傍寄沈逹卿陳子方二理問二妙相看如弟兄白鷗波上忝同盟老來轉覺襟期好别後令人鄙吝生萬里貔貅方北戍九秋鴻鴈盡南征洞庭橘熟香醪嫩心渴應憐阮步兵和周太常寄貢祕卿詩五首兩翁臺閣廽翔日千載文章全盛時太史世家羣彥服中郎筆法九重知西清近識天顔喜南海遙分漢節持經幄論思深有待未容采藥訪安期二老故鄉江漢東兩家文獻夙相同吳關望闕聮歸轡閩海勤王謝轉蓬禮秩漢郊修雍畤道宗魯國仰龜蒙共將千古文章印力障狂瀾洗陋風世路間關嘆百離斯文誰與挈綱維近聞東觀除書下未覺南冠寵數卑政倚叔孫興禮讓終知汲黯繫安危漢廷獻納須公等一代儀刑奕世垂詞源變化共神謀一洗人間蚍與蜉老來頗厭干戈盛此去㝎分宵旰憂館閣經傳劉向業關河人望李膺舟白首自慚無寸輔謾隨行伍事防秋平生筆諌栁公權鶴髮還朝各皓然榱桷棟梁收恐後麒麟鸞鳯覩爭先太常議禮推王肅金匱紬書待馬遷慚愧當年秦逐客只慿魂夢到鈞天夷白齋藳卷之九
