front:
  text: 夷白齋藁卷之二十五
  hash: sha256:4ae405db80223c049845c2c4e008e09746d19195df6f2acf21c22d1707e93f9d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_025-1a}
body:
  text: 臨海陳基著金華戴良編記蓬莱山房記余嘗登越之蓬莱閣誦唐人倡和詩頋瞻踟蹰俯仰千載而其山川之清羙風氣之淳古猶有勾踐之遺民焉盖其服田扵野采樵於山脩禊扵水濵放舟扵湖上渇飲而飢食優㳺以卒歲雖海中之神山不能過也而其邦之人朱子安氏頋挈妻子挟方術賣藥於呉㑹一室之内左靈樞右太素匡床曲几琴瑟在焉入其室者殆不知在闤闠中囙扁之曰蓬莱山房盖不忘其土者人之情也然古之良醫或在齊在趙或在周在秦亦曷嘗一曰安乎其土㢤子安之去越居吳亦将随俗為變而其家多禁方錬金石草木為丹劑足以起人之疾却人之老或謂其嘗遇道者授以幽經祕録不死之藥盖亦不可知也雖然吾聞黄帝侯神之舘實在越上徐市之流徒駕楼船望弱水俳佪而忘返而不知有道之士乗雲氣御飄風往来扵人間世乆矣子安誠幸遇之而得夫秦漢所不見之書方士所莫致之藥亦豈其所得私㢤盍亦獻之天子使斯人胥躋仁壽之域享無為之治而退然一室若将逃名如韓伯休者又非余之所敢知也始為記其山房以質之扵有道者云緑筠樓記浮屠景蒙師即松江南禪寺所居為樓扁曰緑筠介余友頼善卿氏徴文以為記夫筠者何鄭司農曰竹之青皮也然扵潜僧以緑筠命軒蘇長公為之賦詩景蒙之名樓其亦有所本乎昔者九方臯之相馬也以牡為牝以驪為黄盖得其精者忘其麄在内者忘其外識者以其有天機焉然則以筠為緑其殆真知竹者乎然此亦自夫有竹者而言之尓自夫未始有竹者而言則物我未形境智俱㓕青且不有而况扵緑乎昔之上人盖有不起宴坐而㳺扵物之終始者而楼宴坐之䖏也景蒙即毗盧之境闢靈照之户豈徒追逐雲月嘯弄風日自以為髙世而巳㢤亦必天機悟入上下始終自有竹而至扵未始有竹而後昔人可庶㡬也此盖蘇長公引而不彂扵潛僧之所未聞者輒敢囙善卿以為景蒙告佛之徒有香嚴師者真知竹者也請以吾言質之至正十二年歲直壬辰三月甲子記斡勒氏續祭田記河南斡勒氏自太中公宦居浙東西而其子故湖州路學儒學教授君博雅好禮克世其家其卒扵越之蕭山也夫人皇甫氏與其子溥洀沂潚卜地錢唐大慈山之原葬焉既奉㐮大事遺業悉均之諸子而以田若干畞在蕭山者為墓廬祭祀百事之需前經筵撿討豫章鄒君魯望實為之記而公賦有常歲用不足凡冡舍祭器壌樹神道碑碣所冝有之属用皆闕如夫人念諸子從宦北南而大慈之原不有以増緝防範之懼乆益廢乃以其田若干畞所資以自老者期扵終飬并歸祭田以圖永乆飭子孫母毫髮敢漁取或私相質鬻廢墜墳墓餒厥祖禰以蹈不肖之辜囙命其子来取文為續祭田記歸而刻諸余聞之禮曰有田禄者先為祭服斡勒氏肅慎右族世階膴仕而教授君又名知禮者則其有祭田冝矣而追飬厚本謹封樹備不虞人子之事也夫人頋先諸子推其所在巳為其所得為異日使大慈松楸不鞠為蒭牧之區斡勒氏不為若敖氏之鬼若夫人者其殆禮之所謂慮事不可以不預者乎為厥子孫歲時来歸怵惕霜露比時具物扵禮不可以不備則田冝益治祀冝豐土冝益厚樹冝益茂而凡夫人所以圖永乆者勿替引之而教授君之澤未艾矣彼思以其木為材以其榛棘為薪者且貽譏扵君子而况祭田乎此冝馬醫夏畦之子所不忍為者固無庸為知禮子孫告也是為記雅㑹堂東軒記雅㑹堂者徐孟逹甫宴好賔客之所而其東軒則余之所寓也余辱與孟逹㳺而其子緬以余有一日之長執弟子禮從余正句讀訓故以求夫詩書禮樂之說夫居髙則軆夷則神鬯神鬯則所業也勤故即雅㑹而弦且謌者孟逹将以責勤其子也由是撤匏竹薦几格經史百氏㫄午聮絡朝夕相與紬繹磨礱扵其中然有不督而自勤者豈居之移氣遽如是㢤盖栁子所謂交相賛者固不得專羙戴氏時歲之秋風日始癘環視堂下水潦之盛者日以縮卉木之華者日以實而余與緬仰則觀夫陰陽之運化俯則䆒夫物理之盈虚而風雨霜露之教昭昭也盖道之大原岀扵天而聖人純乎天者也今余與緬入則求之扵詩書禮樂出則見之扵風雨霜露天也聖人也豈欺我㦲且人莫不知教其子也而其教皆始扵句讀訓詁然而止扵句讀訓詁而已者非余之所聞也令余之所與語緬者豈徒私扵緬㢤亦囙以自朂云尓遂書扵壁以為雅㑹堂東軒記至正十二年八月甲子記竹間居記余聞吳興張濟和氏家多羙竹其里人沈君自誠余友也間以趙侯仲穆所為書竹間居三篆字示余且俾為之記余扵張氏雖未有一日之雅然其居吴興山水之國而嗜竹則其為人可知矣夫竹之時用亦逺矣昔揚州之産曰篠簜曰􅙪簵而其為貢視瑶琨齒革織貝璣組與夫三品之金九江之龜盖侔重焉秦漢間有竹竿萬箇者可比千乗之家而其利與酤釀醯醤牛羊榖帛文采狐貉金錢䓁盖鏃焉而矢可以征不庭篾焉而席可以展孝敬穴焉而管可以和人神而其下為筒為竿為椽為藩者雖不一而足要其歸均之為用也後世好事者㽞連光景嘯弄風日或構亭山阿㦯築舘水裔徃徃以有竹為清無竹為俗雖其取舎与彼㦯殊然亦未足以言真嗜竹也今張氏之扵竹不苟焉規利以埒冨千乗而其足以効貢如瑶琨如齒革如織貝如璣組如亀如金者亦非翦焉自棄鞠為榛翳之區盖有為矢為席為管之具而事有不屑焉則亦将全竹之天而與造物者㳺扵筒竿椽藩之外而樹徳則視其夲執禮則視其筠礪行則視其莭較其所獲奚啻十百扵酤釀牛羊榖帛金錢之属也㢤吾聞之君子比徳扵竹若張氏者其殆真知嗜竹也夫遂為之記囙自誠而俾之至正十二年歲壬辰八月甲子記庸徳堂記松陵鄒仲彬氏䔍實人也嘗以所居之堂請名扵余余名之曰庸徳堂又求余申其義而記之余不得辞也昔者子思子記夫子之言有曰庸徳之行釋之曰庸平常也人之庸徳見扵事父事君兄交友者夫人能之也而夫子自謂未能者謂夫未能盡為子為臣為弟為友之道而責人以孝以忠以弟以信此聖人之所未能也古之善事君父者莫如舜善言事兄者莫如平仲善交朋友者莫如子輿然亦非有毫髮加扵職分之内而其安而行之為聖人勉而行之為賢人亦愚夫愚婦之所能知能行者也彼以平常為不足務而更為險僻之行自以為雄桀如尹諧潘正華士鄧析少正夘之徒亦終為成湯文王太公子産孔子之所僇而已不亦惑之甚歟仲彬扵此誠能循循乎平常之塗惴惴乎險僻之徑悛悛乎軄分慥慥乎言行恒自厚扵已毋求多扵人則吾又将見其不止扵䔍實之人而已傳曰甘受和白受采忠信之人可以學禮是為記夷白齋藁卷之二十五
