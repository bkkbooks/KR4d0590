front:
  text: 夷白齋藁卷之二十三
  hash: sha256:f2ef96bcaeb3e20267b825cee716eee9ffcb14bb676b0ce1f658358baef5d271
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_023-1a}
body:
  text: 臨海陳基著金華戴良編記雪屋記顧君進道寓書笠澤之上而謂豫曰吾幸以太平之民獲于耕釣之餘從事某丘某水之樂而其所謂水竹禽魚凡以資耳目之玩者子嘗執筆而賦之矣今吾即所居東偏闢室曰雪屋杗楶不斫尚朴也丹雘不施尚質也覆而為宇環而為堵疏而為牖密而為奧皆飾以堊者尚素也入吾屋者晃然如積雪之爛于目焉因以為名者尚白也然未有為之記者敢復以煩執事者可乎夫雪之時義亦逺矣詩詠之春秋書之風人賦之慮無不極其旨而豫也又何以加焉顧惟進道實吳巨族環溪而居甲第相望故家喬木之下孰不以華靡事歸之而其寒暑昏旦所恃以為藏修遊息者曽不以雕斫丹臒為美而上棟下宇專勝于桐軒藥砌緑隂翠而之中者不過曰朴曰質曰素曰白而巳至比物興諭又獨有取于玄冬之雪吁何所尚與人異哉况鳴玉紆朱乘堅策駿上可以狎聲勢于王公下可以振光耀于閭黨進道皆不屑為之而退焉一室偃蹇肥遁章甫逢掖之與俱雅曲素琴之是適其貞風靖操殆將蟬蛻溷濁而與詩之所詠春秋之所書風人之所賦者歸潔于歲寒而後已其視同流合汙檏遬淟涊而不知反其𥘉服者若將凂焉又詎可以同時而語哉此其所謂雪屋庶幾進道之志也吾聞有道者之端居也無所待于外而虛室生白焉進道蓋嘗與有道者遊尚何以豫言為哉請以是為記愛曰堂記松陵于和仲躬耕以飬其父母豫友錢君伯行題其所居曰愛曰堂且徴豫文以記之昔者揚雄氏有言事父母自知不足者其舜乎不可得而久者事親之謂也故孝子愛曰美哉乎何其言之不詭于聖人也夫天下孰有親于父母而戚于人子者乎然父毋之年有喜有懼而人子之心則有幸有不幸焉故曽子之善飬志者能知其不可復者而先施也季路之興感于風木者欲致飬而親不待也與其冨貴而不待孰若貧賤而先施此孝子之心所以不能自己也蓋注而復來者日也衰而不可復盛者人也往而復來者無紀極衰而不可復盛者猶須臾知此則百歲之中無非可愛之曰一曰之內無非致愛之時是心也夫人有之聖人獨先得其所同然耳彼具聖人所同然之心而弗知踐焉不有其身者也不有其身者自暴自棄者也今既不甘于自暴亦不安于自棄而又遭世承平安居畎畞出不驅馳于王事入遂承顔于朝夕上棟下宇俯仰具慶而溫凊滫瀡之職無慊焉昔之仁人孝子克全斯樂者蓋鮮矣和仲抑何其幸歟然天下之幸不可以久居人子之心不可以不懼知懼然後知愛然後知不足此揚雄氏所以善原聖人之心而錢君又善私淑楊氏而錫類于和仲也吾聞顔淵之孝精於猗頓含菽緼絮美于紆朱懷金和仲其尚勉哉至正十年夏五月戊午崑山州重建城隍廟記江南既入職方而崑山實吳壯邑元貞初縣升為州皇慶中徙治太倉而城隍之神寓祠于興德廟延祐丙辰夏旱判官馬祥禱雨輒應乃改祠于海寧寺經藏殿泰㝎甲子逹魯花赤道僧實始建廟然亦草創而已至正丁丑史侯元章來為是州首恤民隱均賦役嚴教條期月之間威肅惠鬯凡前政號為難理者侯皆優為之而崑山之治遂為江南州牧稱首于是大新孔子廟修州治增創常平際留之倉皆不勞而事集乃相神宇爰圖改作而州人顧瑛以故衣冠家耕隱界溪之陽人以長者稱之聞侯之意則欣然以廟事為已任蓋前十年時瑛嘗夢與神接神語若曰歲在攝提龍御于斗必有良牧式康式阜吾宫當犬汝其左右汝尚識旃及是適符所夢然則廢興之故神者固己㝎之久矣先是州治之前無正路侯至始除地為平橋以通車馬之往來而廟故在州之東南地既湫隘制亦簡陋乃更擇地西南卜曰以遷焉度材庀工經始于至正十年月落成于月前為正殿後為神寢棟宇穹如門廡翼如昔所未備令皆完美神明之居于斯為稱為屋若干楹而所費一出于瑛焉州人士因爭持牲酒來享且曰吾州非惟生齒之衆貢賦之夥甲于郡而地瀕大海風檣浪舶出沒島夷卉服之境朝彂而夕至蓋要􅊣之地也今天幸惠賢俠既飾署居以衛我復興學校以教我蓄義粟以活我吾方恃侯以為金城湯池而侯顧以金湯之固神而明之式佑民社垂休無窮鄉之善士又能聞義而起趨事如歸是使吾父兄子弟世世依神以徼福者皆侯之賜也乃相與伐石來求文以為記豫聞城隍之神肇自吳越其來久矣崑山由縣升州且從治要害地神之為祠冝不可緩然上下數十年而始大于今豈所謂廢興之故神者㝎之已久而史侯之賢不獨生民是依而神者亦從有賴乎史侯為州設施次第要為審所重輕者然廟為伇最巨而瑛也獨奮不煩有司而成之速工之美若此蓋上以善勸下下以善應上感孚之理固自有不可遏也史侯善政可書者不一其不繫于廟者兹得以略云是歲庚寅月記虛齋記有為黃老之學曰虛齋者莫知其為何許人也或見而難之者曰夫積氣為天風雨霜露寒暑皆天也積塊為地山川丘陵草木皆地也人具百骸九竅以屈伸呼吸乎兩間殆與積塊者同類耳果何獨以為虛乎虛齋曰嘻若何言之悖乎夫人囿形于兩間固無異于山川丘陵草木也其所以屈焉伸焉呼焉吸焉于其中而能與造物者超鴻濛混希夷遊于太無之家而周流于風雨霜露寒暑之表者蓋必有神而眀之者矣神而明之者何虛以待物者也故曰唯道集虛此吾所以齋其心乎此吾所以一厥志聽止于耳心止于符乎此吾所以虛室生白其猶日月星宿之有光耀于積氣之中者乎是道也顔氏之子得于仲尼者也莊周氏所以浮遊乎人間世者也若何言之悖乎客唯而退虛齋子亦倏焉不知其所在或云匡廬道士有曰于太虛者世傳以為異時將家子好俠任氣有口辨能文章于書無所不讀自以為才髙不為世用遂著道士服為黃冠師注來吳越最為玉山隱君所知吁此豈即其人非耶豫聞其言之合于道也故録以記思順堂記吳郡袁氏居長洲之蛟龍浦者世為衣冠之族與吾友者曰可立實能以勤儉好學自振先人之廬悉以讓其昆弟而自卜築吳江之同里奉母氏居焉既名其堂曰思順又屬豫彂其義以記之昔者聖人繫易至大有之上九曰天之所助者順也人之所助者信也履信思乎順又以尚賢也是以自天祐之吉無不利也蓋上九處大有之極而能下從六五君子象之則克以盈滿為戒謙退自將况天之所助恆在于崇善而崇善之至又莫大于尚賢乎且君子居大有之時固當用其剛眀之德出時遏惡揚善代天工飬庶類然非大車以載如九二公用享于天子如九三匪其彭如九四厥孚交如如六五則不若𥘉九之無交害上九之自天祐也今可立以頴拔之姿駿彂之氣使其明目張膽髙視闊步如名駒利器得以折衝馳騁于大有為之世則其材足以任重忠足以守莭謙足以制盛孚足以交上下昔人所以駕輕車就熟路遇盤根錯莭而鋒不少銼者非若人之徒歟乃今逺去江湖卜居清曠蓄書數千卷樂與賢大夫士考論前言往行以飬親教子為務察其心之所思殆將仰獲助于天迹其身之所履又將俯獲助於人斯堂也蓋所謂固忠厚以為基闢仁義為戶樹禮讓以為墉廣孝敬以為奧守之以恭儉恃之以悠久而積善之慶庶幾日與父父子子兄兄弟弟夫夫婦婦周旋于壼閾之中而天者且弗能以奪之而况于人乎然有大者不可以盈故受之以謙今可立既克以大有而作室其子復知以謙為肯構則思順之澤如水之有源其來也孰得而禦之乎詩曰樂只君子保艾爾後又曰子子孫孫勿替引之是為記夷白齋藁卷之二十三
