front:
  text: 夷白齋藁卷之二十四
  hash: sha256:0cb1543664f371e659f448fe107269be4536adcc54eaf4945c31e2971816f27e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_024-1a}
body:
  text: 臨海陳基著金華戴良編記春暉樓記吳郡崑山之界溪有園池曰玉山佳處隱君子顧仲英甫之别業也山之西為草堂堂之北為春草池跨池為屋以藏法書名畫如昔人之舫齋者舫上構重屋曰春暉樓與所謂湖光山色者相值仲英曰率其子若孫為壽于其親畢輒與賔客者沉吟六義為詩以適登臨之趣嘗誦唐貞曜先生孟郊氏遊子吟而有感焉既以春暉名樓且徴豫文以為記嗟乎世之難遇者太平人之至樂者具慶故風人之歎恆不足于所遭而天下之情莫不願于逮飬彼重堂層軒廽廓復館與夫珍禽異卉世之好事者皆可以力致至于俯仰四世具慶一門行無羇旅之思居有園池之勝盡天下逮飬之樂無風人不足之歎此蓋非人之所能必者雖萬乘之卿相不可強而致也然則太平之士如仲瑛者亦可謂樂其心不違其志矣而登臨容與顧猶有感于春暉豈所謂愛日之心自知不足者乎然是樓也廣不四楹髙不十仞近則綽阜之坡陀馬鞍之崷崒逺則海虞之綿延揚城之巨浸與夫洞庭陽山朝光暮景出沒變化凡為其賔客者皆執筆而賦之矣余獨推夲名樓之義而為之記云至正十年十一月甲子也佩韋齋記吳興郯九成氏以瓌瑋博辨遊公卿間而其為詩清峻粹密有作者之遺音焉嘗自以狷急思所以懲艾而庶幾夫書紳之義者其要莫如緩乃即所居闢室為齋曰佩韋蓋尚志西門氏范萊蕪之所以垂休千載者也以豫辱有一日之雅俾為文以記之余聞之目短于自見故觀面者必以鏡智短于自知故正己必以道人受天地之中以生性固無不善也然古之君子必佩玉器物必有銘亦以氣稟之或拘而所以謹其非辟之入者必託物以為警也然則西門氏之于佩韋其猶正鬚髮者之于鏡乎抑柔不茹剛不吐仲山甫之見稱于尹吉甫而寬猛相濟孔子之所以善鄭子産者也君子亦中庸而己特逺云乎哉况思無邪者詩之善經也溫柔敦厚詩之善教也九成蓋嘗優柔詠歎而有得夫六義之旨冝邇之事父逺之事君無適而不得性情之正而託物為鑑顧猶有待于韋則其所以窮窮乎擇地而趨而敬以為輿恂恂乎捫舌之規而禮以為樞其于言行悔尤何如哉嗚呼西門氏之為莫欺范萊蕪之貞莭絶俗固百世之賢大夫君子也前志有之以長續短以有餘輔不足九成以之因書以為佩韋齋記存存齋記沈君仲説隱居于吳會耕學于笠澤廬於陳公之原而皆名其室曰存存齋蓋取易大傳之語而陳公原之廬朴而不陋簡而有容甍不加雕椽不加斫而室之制具焉蓋沈氏世有詩書之澤而其先隴所在土厚水深松柏薈蔚斯齋也在墓之左環以流水繚以林薄遙岑緑野星拱繍錯而歲時霜露之感油然于寒泉風木間仲説曰子盍為吾記之蓋余辱以賔友之末嘗執巵酒為祖夫人壽及夫人年終九帙仲説持承重之喪于此又嘗即其處而吊焉俯仰生事死葬之際敬飬至而哀禮盡仲説所以培其夲而濬其源者非一日矣且成性存存道義之門聖人讃易之辭釋之者曰知禮存性而道義出蓋學以知之知也孝以履之禮也性由此存道由此出而行之皆適于冝吾概於仲説事親之始終見之則于斯齋也可無言乎噫以簡朴之室廬居深厚之水土仲説所以永孝思也以存存之聖謨承詩書之世澤仲説所以垂後昆也後之人第毋以華易朴以繁易簡則沈氏之興未艾矣是為記至正十一年秋七月癸酉靜逺齋記吳郡于正夫少喜醫方術其壯也遂以醫名家搢紳大夫樂其慎于術也題其居曰靜逺齋人因以靜逺稱之成都府判官浮光王季野甫由其先公參政賜第于吳因家吳中尤折莭與正夫遊且屬余為文以彂明靜逺之義而記之夫所謂非寧靜無以致逺諸葛武侯戒其子以修身飬德成學廣才者也百世之下讀其書者至取其言以為學者之標的吁豈欺也哉正夫醫家者流其為務非必修身飬德成學廣才而名其齋者顧有耴于靜逺之旨豈有説乎蓋聖人立醫師掌醫之政令而與天官冡宰並列于周禮其事則出于宓羲神農黃帝其書則存于太素靈樞皆聖人仁民愛物之心所寓也夫以五味五榖五藥飬其病以五氣五聲五色視其生死兩之以九竅之變參之以九藏之動此豈慆慢險躁者之所能倣佛哉故必靜以致之精以研之而後深且逺者可庶幾也吾聞上醫醫國其次醫人又聞逹則為良相不達則為良醫三代而降以良相而醫國者武侯也以良醫而醫人者扁鵲也武侯以道靜以修身扁鵲以術隨俗為變昔者庖丁好道而進于技使正夫之于術亦猶庖丁之治牛則其去道且不逺而扁鵲乎何有因書以為靜逺齋記梓軒記吳郡徐君孟逹東野之南榮有樹曰梓因名其軒曰梓軒昔孟達之先外舅陸君靜逺以儒起家為徽州路學教授東野乃其釣遊之處也是樹也余蓋見其手植俯仰二十餘年其拱把者忽鬱然數十尺矣夫梓殷人上之詩人詠之周書以之命萹周禮以之命工夫豈以其為木之長其材貞其質實而不剝乎是故為棟梁則可以營都邑建眀堂為琴瑟則可以奏韶武薦郊廟然非遇夫良工則亦操斧過之而弗顧耳吁梓之時用亦大矣且始也吾與公遊而見其萌今也吾與其子若壻逰而見其長使雨露之飬克遂乎其天培植之㓛不戾乎其性則其堅密美澤益壽且孳世有經國如梓材辨器如梓人則其貞且不剝者或者不與樗櫟同棄于操斧之手亦未可知然棄與不棄物之幸不幸存焉吾獨愛其春而榮夏而茂秋而落冬而實而吾與二三子鳴琴讀書于此庶幾充然若有得于生物之妙者則前人之封殖以庇其夲根豈直所謂無忘角弓而巳哉詩云維枽與梓必恭敬止因為乏記使二三子知其植之之自至正十一年冬十月也貞吉齋記吾友陸飬正飾宴休之處于寢室之側西東為户北南為牖中設匡牀而屏其東琴書圖畫筆牀茶竈古玩好之屬參差離列而嘉木之植曰橙曰石楠敷榮恱茂無不可愛蓋室雖不廣而其資以為藏修遊息者慮無不備以余辱有一日之雅俾審其其義而扁之余以為飬正之名若字皆出于易象之頥是齋也冝扁曰貞吉飬正曰善因請余記之夫易之言貞吉蓋不止于頥然盈天地之間凡有血氣者莫不有待于飬而聖人實財成輔相而左右之故頥之道在于莭飲食慎言語蓋飲食以飬體言語以飬德其事至近而所係甚大君子之所以莭且慎者欲其所飬皆適于正己者正則及于物者無不正矣此頥之貞吉所以為可尚也且物畜然後可飬故受之以頥今飬正之所恃以為飲食男女百物之需者皆前人之所畜也前人之所以遺飬正豈徒充口體恱耳目宴安其起居而巳哉飬正于此誠能彈琴讀書詠歌古人以師其行義左圖右史想像古人以法其威儀而其動息莭宣無適不由于正則所謂貞吉者將日周旋于飲食男女言語動作之間而前人之所遺引而勿替而其所以自飬者又可推以及人矣夫吉者何福也劉子曰能者飬之以福飬正其尚勉之若夫推明震下艮上之義以告之則余既為序矣兹不復云至正十一年十一月甲子記夷白齋藁卷之二十四
