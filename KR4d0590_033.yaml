front:
  text: 夷白齋藁卷之三十三
  hash: sha256:23a7dd296192173e38c6c2675c204fcc87026416b5f86d509ee68c4626375249
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_033-1a}
body:
  text: 臨海陳基著金華戴良編碑精忠廟碑自古將相㓛臣身任社稷安危而存沒始終之際廩然有君子風百世之下至以其墳廟廢興觀時政之得失如故宋太師忠武嶽鄂王者豈非以其人死而不朽而人心天理固自不可泯哉𥘉王之沒也蓋二十有一年孝宗嗣位實始以禮葬王父子于杭錢唐縣西湖之北山王之孫制帥甫尚書珂相繼請于朝賜㓛德寺曰褒忠衍福且創祠墓側賜額曰精忠尋置田若干畞蘇之崑山以奉蒸嘗咸淳戊辰四世孫運幹通復置吳興田若干畞命僧甲乙主之運去物改寺廟亦廢大德卒丑子孫之在江州義興者相與裒財率力繕葺復完久之疏屬有為浮圖氏者盡翦棄前人所封殖而歲時所恃以追養厚本者至是復委地矣泰㝎改元寺主僧可觀獨以祠事不復為已憂朝夕扶服赱公卿士庶間蓋十有三年為至元仍紀元之六年庚辰郡經歷李全𥘉嘉其義募郡人力而新之蓋亦勤矣至正十九年己亥十二月妖寇犯杭先是行省左丞相逹實帖木兒公與太尉吳陵張公以兵屬本省平章政事兼同知行樞密事張公鎮杭由冬及春寇百方攻城不利乃縱兵四掠燒民廬彂冡墓三月􅉝丑大戰數合是夕寇潰斬首數千級生擒者以萬計寇平吳陵公命即故址作新廟經始于月日落成于月日中為正寢凝土為王像而配享者子則宋忠州防禦使繼忠侯雲將則宋閬州觀察使文烈張憲而下各就序前闢廟門東西為兩廡後為燕寢則祀王父母洎夫人餘四子武略郎雷中大夫霖朝奉郎震修武郎霆女與諸孫咸仕焉閎邃靚嚴視前有加而栖僧之廬候賔之館昔之所嘗有者今無不備仍命僧甲乙守之而蘇湖之田則俾郡守謝莭量其出納著成規刻之碑隂毋令擅有侵耗焉甫竣事平章公率僚佐致祭廟廷且曰世以鄂王㓛名位望與張魏公浚等並為中興名將至論文武仁智用兵如神慨然以恢復之㓛自任忠義之言流出肺腑則諧葛武侯以來不多見也當其長驅中原轉戰千里此其心豈忍斯須忘君父之辱哉使天而克終其志則祖豫州不足多道而秦檜乃忍使其自壞萬里長城如劉宋之殺檀道濟于是兩宫魂魄卒從晉懷敏于地下而神州宗社鞠為丘墟此誰之罪歟我國家恩覃異代王父子以至部將既巳疏封列爵光賁泉壤而太史氏又論次其行事列而為傳矣獨其忠貫日月勳重丘山始終大節事關世教在祭法所當尸而祝之社而稷之者蓋闕如也乃上疏朝廷請與山川群望歷代賢聖忠烈之在祀典者並著令甲所以照往烈勸方來禮也公俾書廟廢興歲月于石基不敢辭乃作詩併刻之其詞曰昔宋中葉國步危宗廟共守九鼎移兩宫蒙塵四海悲王獨自誓扶起之河潰華坼徒手支長驅中原屢搴旗敵氣巳奪赱且罷讎執耻雪復舊畿忠孝要與靈胥期讒臣居中肆罔欺勳業垂成俄復墮長城自壞大厦欹耿耿忠誠天地知西湖之曲北山陲鬼神護此南拱枝爰作新廟倚翠微子祔而食將校隨白蘋為羞雜江蘺吳田有稷牲膾肥擊鼓考石吹參差王乘雲車駕文螭左右列祖參兩儀麾叱靈霳命雨師福澤下土年榖滋鈞天無讒究厥施盍配羣望歆無違墓志銘陳隱君墓志銘隱君諱謙字子平妵陳氏吳人也甫兒時即知事父母三十始受室悛悛色養退則率諸生講説周孔孟荀一是以修身事親為務年踰五十父母尚無恙父疾革思鱖隱君進鱖父沒遂終身不忍食鱖事兄訓謹甚訓字師敬為吏不務苟同在兩浙醝臺時嘗粥所乘馬書畫器物屬錢所知贏什一自給所知死妻操錢子母歸師敬師敬謝曰生享其利死餒其孤此市道吾弗為乃悉以錢丐之及書滿徒步歸吳下則甚窶隱君曰吾兄能若是復何憂乃力苦周旋惟兄所欲為人謂師敬為吏廉君實有以左右之亰口孫子翼與隱君為忘年交貧有女不能嫁隱君許助之後十餘年孫病篤隱君曰吾死欲見孫君地下即持資赱亰口為畢嫁事𥘉隱君事林處士寬寬強隱君以業試有司隱君勉就場屋屬吏卒搜撿懷挾者待士甚無狀因歎曰道喪至此尚可以徼幸失得為哉即罷歸盡棄舉子習折莭屏除世好潛心六藝旁攬百家而卒守之以約嘗從師敬北客揚潤南寓杭纍數歲不與人事接獨日從搢紳髙世之士揚確論議為文章馳騁上下尤善古賦及古今體詩詭麗春容詞辨鋒出不少讓故內翰蜀郡虞公金華黃公今晉寧張公與諸老之在朝者交口論薦隱君冝在著廷與鳴太平之盛隱君力謝乃心行省承制署師敬由掾史升照磨佐分省軍事于常之無錫間謁告歸里第會郡事蹙語妻曰吾分必死矣謂隱君汝無官守冝自為計隱君曰兄在吾何所之有頃兵突至迫師敬隱君以身翼蔽之兵怒斥引出隱君復求入見師敬已殪即匍匐伏尸哭甚哀遂并遇害師敬妻王氏與老奴王乙亦自經死旦日門人范文絅訪其鄰知隱君兄弟皆死狀因泣求尸所得之篠橋下水中猶兄弟相倚立故人成元章白其事幕府為具棺斂且求其子詒屬陳氏于是隱君年六十七矣文絅奉二君葬吳縣天平山先隴側實至正丙申二月癸亥也隱君娶顧氏亦篤婦道先卒生子一詒女二長適范伯皓次適阮文通隱君所著述甚冨兵後散亡獨所著周昜解詁及古今雜詩二十四首得之灰燼中不燬越七年詒奉文絅狀來請銘基哭曰隱君兄弟存時時人為之語曰陳氏之子一儒一吏孝友豈弟今不幸俱遇兵死豈善不足恃哉且人孰不死而人獨哀隱君者哀其義不苟生死不求幸而免也嗚呼隱君之志亦烈矣乃論次其言行為銘銘曰其學也匪榖其集也擇木載翔載伏而巢以義覆孰仁其雛猗德不孤我作銘詩以敦薄夫不亦悲夫處士袁君墓志銘處士諱德昌字子潤妵袁氏其先汴人宋𥘉以進士起家曰仲賢仲賢之後有提點亰西刑獄者于處士為六世祖建炎間渡江居吳今長洲之蛟龍浦有東袁有西袁蓋以其所居别之東袁有靜春先生博學好著書家居不言祿實處士之諸父處士則所謂西袁者也曽大父諱邁大父諱義父諱英彂處士身長七尺狀貌甚偉天性醇厚讀書務眀大義縱觀前史知古今理亂人物賢愚遭時治平雅意肥遁世居沃壤深病流俗侈靡之習嘗曰吾家夲儒業賴祖宗餘澤有屋可以蔽風雨薄田可以供祭祀遺書可以教子孫浮湛鄉里偃仰卒歲不啻足矣獨念先大父好施豫今力雖不及幸歲無水旱螟螣公上之須粗畢追飬之禮不闕子弟之教不廢尚能莭衣食為親朋一日之歡每歲時伏臘斗酒相勞雖無兼珍之膳殺雞飯黍亦足以娛親屬有不能自振者周之無吝色嘉時吉日則與所知放舟吳淞甫間尋前代名賢遺迹逍遙容與有曠世相感之意嘗誦仲長統樂志論而歎曰人生行樂耳縱冨貴何為哉至正六年卒于家得年五十有五以九年葬吳縣胥臺鄉穹隆山職塢之原娶朱氏子男三人曰禮曰信曰良女二人適葛大𥙿朱珍孫男五人稷穆穰稚种女三人仲子信好學而尚文雅處士既葬之明年信奉清江李衍之狀來乞銘南渡以來中故家如袁氏者固不少然求其處身修德苟可以及其親屬朋友者掇口體之養為之恐後用此終其身如處士者蓋將以是遺其子孫也夫嗚呼是冝􅖳銘曰維逢也時有藴弗施維藏也固有蔚斯樹維銘也弗忘有後斯永慶姪天騏壙銘天麒陳氏子年十九其父伯淳命至杭見其族伯父基時同來者叔姪九人留而不歸者五人天麒最少而知務學問基于伯淳同髙祖而天麒之祖諱屺為人信厚以言行重州里天麒兄弟三人天麒實嫡且長其來杭也基擇師俾習舉子業未幾基使吳門屬天麒受詩于會稽趙夲𥘉俄得軟腳疾即卧不能行金華醫者趙以德侯之曰此痿痺少年得老疾雖多投藥無益冝耴􅭀蘞草九蒸暴為丸服之藥未成而疾告革基使還急召醫治之百方不能得竟死即寓舍買棺斂屬時用兵又暑熾甚用是不免于水火函骨寄慈濟僧廬尋葬杭北山嶽武穆王墓傍若干步于是年二十矣死以至正二十二年六月二十一日葬以明年月日銘曰芝蘭斯植霜露委之璞玉甚美伊孰燬之生非不淑命有短修葬近忠烈庶亦無尤嗚呼哀哉墓表秦君墓表淮南秦君沒葬昆山惠安鄉南岡之原門人私諡曰孝友先生監察御史張君士堅題其墓曰孝友先生之墓君諱玉字德卿其先鹽城人四世祖統制府君慶扈宋南渡因家崇明東沙曽大父棟大父梁遊太學為上舍生父庚咸淳末試通州第一入國朝徙居昆山之太倉遂隱不仕君八歲孤即知家世夲末既長浸淫經史百氏獨不喜為舉子業家居講授二十年事母兄盡子弟道母顧氏終未葬比卒哭里中遺火逼君廬君伏柩號絶火為自滅族有據其田者君弗與較更歸之劵嘗道得遺金亟訪還其主僕間執盜之竊布帛者君縱之使去于是皆伏君為長者所論著有詩繤例大學中庸標説雜録漫藁若干卷州部使者察君卓行將疏上褒旌論薦之君意不屑也至正四年三月二十有四日卒于家年五十有三配顔氏子男二人曰約有文學曰璧先卒女二人長適某次先卒秦氏自統制府君而降皆能世其學君雖晦弗售然卒以孝友為鄉先生亦無憾矣余雖不及識君辱與其子約逰約泣謂余曰先君子之墓未有表表先君子墓者莫子為冝遂為之書以告其後人云夷白齋藁卷之三十三
