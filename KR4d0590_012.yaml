body:
  text: 臨海陳基著金華戴良編頌平江路達魯花赤西夏六十公紀績碑頌今天子御極之十有七年為至正六年詔公卿輔弼之臣若曰朕將以天下之治責成守令尓尚各舉所知以稱朕意于是皆拜手稽首曰幸甚臣等不佞敢不慎擇其人以無負聖天子嘉惠元元之意乎既退咸以四方萬國至于荒外守圡之臣莫不各以其職宣布上恩時莭貢水土百物以供郊廟社稷神眀之祀而平江為郡控帶楚越所部四州二縣地方千里海陸之産饒於古國家所恃以為奉祀根夲所繫實異他壤職師帥任保釐于此者尤難其選居久之有以西夏六十公子約之賢為言者宰相曰是故同知濠州有德于民者乎此長者可以復眀詔矣即奏為平江路達魯花赤時至正九年也公方持江西部使者莭命下即由豫章趣吳郡長民者方臨人以嚴而刀筆吏規規守文不知大體公因憮然歎曰此風其可長乎不戢將敗吾政乃以旦日謁先聖先師飭學官增弟子貟禮聘名師用月書季考之法程試之取其中式者輔郡曺吏尋飾學宫墻廣倉庾以儲廪粟買學宫南廢囿作靈星門以正廟貌公餘政隙輒呼吏屬鴈行立從容為言修身理人之術出入經史上下古今亹亹不倦日以為常郡諸生化之爭自激卬以眀經取進士髙第者至是彬彬焉公方務與民興利除害會有詔罷長生牛水深圍長蕩之屬省憲遣官與公循行其地而崑山嘉㝎瀕海事故之由病民者為尤甚公因自念使民安其田里而無愁歎之聲者二千石之事也今聖天子下寬大之詔茍不以斯時悉除民所疾苦後悔將焉及因疏其害力請而免之吳介居東南道路之咽喉有田者常賦之外又以餘苗供郡城與吳江平望水陸驛傳勞來之需公曰此非政之善者也乃以歲餘官糧變錢為子毋月耴其贏以次責郡曺吏主其費號曰祇待民大稱便海運梗於盜行省諉公按兵昆山之劉家港公身先士卒􅓍力海事春夏兩􅒩皆以時逹亰師淮石冦竊彂攻陷江東西郡縣浙右騷動省憲督吳郡募民大興築城之役周餘四十里費且巨萬然皆不仰之官屬方盛暑公不忍其重困語及輒泣下且時身出入版築間勞苦之海盜復犯昆山公募民為兵選官吏之家居者分守郡城時門之啓閉以備非常𥘉冦之入杭也行省徴冨民引兵入援公曰蘇杭唇齒不應禍且及應之則民不堪命因彂所募義兵五百人赴之未幾冦陷常繼入湖烽燧漲空鉦鼓四起羽書告急者相望資糧兵械什器之求絡驛道路人心恟恟公晝則關決趣辨供億紛紜夜則申嚴約束以死自誓民賴以無恐居久之朝廷除行省臣不逺數千里率蒙古軍備禦吳郡巳而省臣調他省江浙行中書因􅊾公兼制軍事公鞠躬夙夜與士卒同勞苦然不動聲色而賞罰號令視前十倍居民安業逺近稱之使者間奉詔募民輸粟佐江西軍視多寡輔官有差列郡承風應募比至吳公懇懇為使者言吳民困于和糴百需米價踴貴斗至錢若干緡小民艱食無賴方彂官倉振糶之實無以應募使者感公言遂以所餘告身還朝廷時論偉之先是榷酤官止收其稅後公私宴賀更耴酒酤户吏徒並緣乘隙甚者至破民之産公議立罷之征止常稅而已公學醇識正性尚寬和聽政決獄務夲經義而參之以章程秉志忠貞刻身廉恕而將之以勤敏起家諸生官至二千石而退然身若不勝衣始公之下車也士仰其德久之吏服其能其能終也民安其業宰相奏公治行最東南詔嘉之特命增公秩復公位三年吳人室家相慶曰聖天子以公保艾我百妵三載告終引例當代復詔以公私我使吾入有父毋出有司命俯仰六載夷險一莭晏然不與鄰郡之民俱冒矢石殞鋒鏑膏血塗野草者聖天子之賜也盍刻石載德以昭示無極且公旦暮入參廟廊進升臺閣勳隨位崇爵與德稱其大書特書屢書不一書者太史氏之聀也乃具狀授余俾論著公治吳善政刻而頌之以無忘聖天子之賜公以成均上舍生釋褐授濠州同知調南平浦城二縣長轉南陽府同知冨寧庫提舉尋改同知都漕運事由歸德知府拜監察御史又江西廉訪副使除今職云頌曰明明天子子惠兆民孰宣上恩曰在守臣芒芒強理廣禹舊迹孰先農人布時黍稷濟濟在廷奉詔拜手慎肅乃僚傍求逺取九州立牧施及八荒各聀方物時莭來王眷兹吳會東南奧區厥土塗泥化為上腴豈伊人㓛勝于地力諄諄德音斯民之則孰將明命往綏兹土抱其嬰孩授之父母宰相薦公天子曰冝彼誠長者朕用勿疑始而吳政逞以刑罰始而吳吏拘以文法公寬理之訓之經義大者賔興小者試吏詵詵多士更化翕然飾其儒宫以表化源公教既施民瘼斯究田疇淪胥驛犒何有公承寬詔上疏貸租使者勞來責之吏胥海冦梗漕公威却之船粟億萬往實亰師蠢尓妖冦蜂起蟻聚蔓沿江南屠州陷府公城郡載髙其雉公厲郡兵載奮其士吳城匪城公仁可慿吳兵匪兵公義可乘公哺我飢公拯我溺去其蟊賊滋我稼穡羽擊交馳以急告公徴求調彂斯萬不同公曰恤哉此皆王事敢不鞠躬夙興夜寐有卓治行上逹九重天子曰都子懋乃功有臣若斯冝在左右重憂吳人失賢太守詔增公秩詔復公位以公私吳實天子意公之為吏如漢龔黃公嬰其變彼適治康公之愛民如鄭國僑始不忍欺終安其教公留拊我公勿去我公不我遺我忍公舍公惠在人公勳在石天子用公視此成績海道都􅒩運萬户府達魯花赤脫因公紀績頌天下之本在亰師亰師所仰在海運海運所恃在舟楫舟楫之利所以濟不通然振古以來有天下者未有道海為渠轉漕東南億萬之粟灌注天府以備粢盛祿稟軍旅之儲如今日之盛者也蓋世祖皇帝閎規大略所以為聖子神孫萬世無疆之計殆天授之非人力也一旦有司撫字乖方鯨波鼓怒􅊞我糧道堅舟利楫蒼黃失錯鞠為灰燼于斯時也軍國大計茍非得人以濟之則祖宗七八十年振古所未有之利將有臨流浩歎而巳顧何益于事哉此海道都漕運萬户府達魯花赤脫因公所冝大書特書屢書不一書者也𥘉海道之失利也聖天子圖新漕政而難其人廷議奏曰今樞密院斷事官臣脫因俶儻喜事忠謹絶人讀書知古今達事變曩執法御史府讜論不回天下偉之臣等敢昧死請以漕事屬脫因詔曰可時至正十二年三月也先是每兩􅒩事竣􅒩民率以􅒩隙備器械舟弊必先期輔製謹風信也自海道有變糧艘陷沒者參半會公下車申嚴約束且迫􅒩期衆皆廪廪不知所為公乃下令俾買吳楚商船往來江湖之碩售者并日兼工益小為大且戒曰事貴神速慮多決少兵家所忌此漕事吾以軍法治之敢有不用命者乎兩􅒩賴之􅌰皆以時達直沽公用事精勇類如此上大恱詔賜上尊酒副之束帛公曰此特事之權爾非經久利也易曰通其變使民不倦今漕民告病舟楫不飭危道也變而通之其在斯乎乃移文平江嘉興湖州松江諸路府選民力之勝任者輔充漕户是時鯨波告息新漕之民利涉無虞因為之用而軍國大計所謂萬世無疆者克復舊常褒勸之禮視前有加而公之事集矣公雖任專海道然茍以惠生民利社稷者知無不為去歲秋吳民阻飢公彂漕帑糴粟以振之今年春陽山愚民竊彂縱火剽掠鼓行趨郡西門公身先有司從數騎出萬死不顧一生殺獲甚衆居民按堵省憲聞之皆遣使來賀十五年八月詔拜公為江浙行中書參政事捴制軍民保釐東吳仍督漕運事寵賚優渥昭懋績也漕民因有作而言者曰公糴粟振民民誦之以詩公殄賊安民民刻之以石公重興漕政恢復海道制權冝如裴耀卿謀經久如劉晏處身清潔仕不廢學如韓滉唐有三人倚為鄼侯皆以􅒩運致位宰相公今之鄼侯也三人之長公實兼之而頌聲不作非曠典歟且公居􅒩臺則功在海運位執政則志存藩省異日登台輔秉機要則又將以德加天下區區之頌于公何有哉雖然無言不酬無德不報詩之善經也乃礱徴文論著公􅒩政頌之公字眀善世為蒙古部人頌曰昔秦挽粟漕運乃興一石之利百斛費并漢唐治之陸運水行負簷操舟乘湍跨陵其一或穿褒斜或歷底柱或鑿三門或役女婦百險備更萬夫疾首庸錢千計得不盈釜其二大哉皇元天闢漕渠匪陸以阻弗川以紆于廓靈海括坤之區噓吸百源卑以自居其三維皇道之濟險以德海若駿奔馮夷􅓍力掖我靈䑼贊我文鷁一波不興萬里斯息其四直沽之口析木之津糧艘會同伐鼓􅞹􅞹六軍騰歡萬妵交欣飽我糗粻樂此冨殷其五大略宏規善建不拔詒謀無疆振古莫越孰揚鯨波百怪並彂其六燔我樓櫓梗我糧道出沒濤風犯我城堡彼方雷咆此寧電掃孰乖拊循致此俶擾其七既劫之舟又􅟃之粟上闕粢盛下虧稟祿軍無見糧民食半菽憂貽當寧議諏秉軸其八事有非常得人斯濟孰實堪之惟脫因氏昔居諌垣抗言不諱使長漕臺庶展才智其九君命既加公責斯厚金符虎莭銀章龜紐秩長萬夫勢崇列守公辰在公公退及酉其十公行雷動公止山立公令一申公事畢集以兵治􅒩以權濟急勇輸軍儲注實亰邑其十一帝命偉之寵錫有加公曰斯權經久則那法貴變通户别等荖損上益下斥寡􅈬多其十二􅒩民核實舟楫利完春餽夏餉風往浪旋轉粟如山弗危以顛佽飛在後陽侯在前其十三昔焉效􅊇今則助順威德所加載以眀信威德伊何不驕不吝眀信伊何克廉克慎其十四天子曰嘉事立㓛成授以執政叔諸外廷拜命分曺督餉治兵公文且武公允且平率我漕事衛我蒼生其十五公今在外保釐吳土邑有長城民有父母公行居中進位台輔室有棟梁榖有甘雨其十六邑傳輿誦野播民謡或聞鄉校或采芻蕘謳歌㓛德喜歎賢勞爰勒貞珉永繼風騷其十七銘頥菴銘山下有雷其象謂何曰維頥爾二陽四隂中虛外實下動上止天地飬物洪纎動植莫之有紀財成輔相聖人之㓛亦正而巳莫不飲食君子莭之其生也舒莫不言語君子慎之其德不孤上棟下宇動息莭宣式燕以居在已則𥙿及物斯溥惟聖之徒茍舍其龜又拂厥經征言滋惑居則觀象動則玩占惟吉是適勿朵爾頥寧捫尓舌貞哉不忒我作銘詩敢告執事庶幾無斁貞白室銘并序昔江浙行中書參知政事太原王公以忠貞清白勤勞王家其嗣季野用世家子入備宿衛未幾以恩授成都府判官需次于吳即笠澤别業治燕止之室髙為尺者九廣加髙之一尺環室之內皆飾以楮西北南設小榻而以吉貝之精好者為簾于其東出入者由焉季野夙興冠衣謁家廟禮畢趣退而休于斯圖書琴策惟意之所適而雅喜與搢紳章甫者商確今古詠歌風雅曰以為常入其室者如在在積雪之中而幽懷靜趣殆不知有塵世也因題其顔曰貞白屬其友韋羌山人陳基為銘銘曰其心貞其室白端厥居匪徒飾不緇磷視其迹勒斯銘永無斁吳興沈仲説得蘇長史舊硯名滄浪池臨海陳基為之銘有蘇滄浪之硯泓乎池方以􅈬矩圎弗規潤為文章炳其垂惟説尚友不詭隨尚寶用旃永弗墮緩軒銘并序吳郡隱君子沈仲説甫以訥名齋既自為之針復以緩名其軒屬余為之銘曰古之君子夙夜孜孜居則三省行則再思下堂而傷足者數月猶有憂色佩韋以自戒者百世而名不衰既恂恂乎捫舌之誨復凛凛乎履冰之規勿行而使手足無措勿言而使駟馬莫追故奔車之上無仲尼覆舟之下無伯夷我思古人勤謹是飭濟以和緩剛柔兼克我行勿趨篤敬以為輿我言勿尤執禮以為樞勿亟勿徐以道乎中庸之塗嗚呼非若人是朂而誰與針潛心閣針并序吳郡陸飬正扁其齋閣曰潛心徴言于余因誦所聞為針以告之曰物無二夲人無二心孩提之童純乎堯舜也兔罝武夫文王莫欺逹巷黨人孔子莫違也飛廉惡來非不足箕子比干非有餘也道之則蒼舒庭堅反是則檮杌叨餮也君子潛心注行前言善乎吾師不善吾戒也楊墨學仁義似是而實非老子言道德紅𬗋之亂朱也必出門使民如雍之事斯語參前倚衡如師之書諸紳嗚呼敬之其殆庶幾也贊劉文正公小像贊并序丗祖皇帝有帷幄之臣曰故太保劉文正公間關金季處君子之所不得已則裂冠剃髮寄迹浮圖老子法中亦有所不顧一旦乘風雲之會邅興王之運一言稱旨則不顧萬死一生以野服冒艱險備顧問亦有所不避及大勳已集四海一家坐而論道得君子之時則建國號㝎都邑頌章服立朝儀事無巨細以身任之亦有所不讓蓋公之學內聖而外王公之道逃佛而歸儒其事業則尊主而芘民也祖宗以馬上得天下而公首以詩書基治道國家以百戰㝎萬方而公獨以不殺啔上衷中統至元以來開國元老出處始終追配古人天下識與不識皆曰王佐之材則公也雖欲謙退不居可乎自古王伯之業有君而無臣固不可有臣而無君亦不可故非世祖之雄略英斷不能以用公非公之應變博聞不足以佐世祖噫古之所謂窮則獨善其身逹則兼善天下非公而誰歟今淮南行中書省照磨曰惟敬者公之裔也以公小像示余余作而歎曰九原可作吾從之矣乃載拜而贊曰心晉道安迹唐李泌道該百氏而通學究天人而祕齊有夷吾則稱伯漢有子房則成帝始逃佛老蓋無為而無不為終佐唐虞亦正其義不謀其利置之丘壑則赤松為朋巢由為徒居乎廟堂則黃河如帶泰山如礪不知者求公圖畫之間其知者索我形骸之外嗚呼蓋未易以測其際也謝參政小像贊觀其容豈有憂于斯世也察其心蓋有求于千載也其行也若思其遊也若有所之受君之赤子而乳哺之其樂也熙熙其處若默其出也惟道是適故論于帷幄也弗忒其見善也如有所弗及其好賢也如有所弗立故施于廊廟也弗以緩而先急紹乃烈祖友時卿輔左文右武以復王土人之望也如百榖之于甘雨嗚呼吾聞迹雖纓于軒冕心不忘于山林若人也斯可與齊得喪而同古今矣乎月上人畫像贊以上人為天台氏耶則赤手搏空了無所著以上人為非天台氏耶則開口説教無非糟粕當其雨華堂上聽赤髭大士授記則百年老蚌出眀珠及白玉峯頭為一切衆生説法則萬古冰輪湧寥廓此為伯眀月公之相豈可以世諦語言隃度耶蘇昌齡小像贊以方寸之心而苞括宇宙以七尺之軀而馳騁古今聳聱名于廟朝之上匿光耀于西澗之潯舍兾北空群之足而弗御棄鄧林擎天之幹而弗尋豈伯樂之志而匠石之心也耶雜著原器贈葉照磨德新天下之器有大小而其為制有程度宫室聱樂衣服舟車皆器也先王之制宫室其用材也必使大者為柱小者為楔長者為榱短者為楶為侏儒而後上棟下宇之器備至于聱樂衣服舟車之器亦莫不皆然否則琴瑟乖張柱楔異施布帛􅓎用水陸易置以之居則不能除風雨調則不能和音吕服則不能禦寒暑乘之則不能任重以逹諸天下而器非其器矣先王之制國也亦然人之為人也不一其材而國之用材也不一其能視其長短大小旁羅而並蓄之使職其職者各盡其力而責其成善制國者也吾為天下誦斯言久矣鄱陽葉君德新結髮讀父兄書既長以六藝百家自緣飾從東諸侯遊為郡府史藉藉有聲流輩間吾嘗聞其在甌越時佐郡理官治獄活不當死者數百人甌越間人至今稱之及余以樞密都事左右司貟外郎待罪江浙行文武兩府而德新由漕史辟掾行中書辱同在幕下德新出則操章程參紀律從將相征討不廷雖犯霜露冒矢石不避入則與郎吏百執事進退廟堂鞠躬盡疩務是是非非以忠所事俯仰六七年如一日未嘗以利害為趨舍余嘗為之語曰德新有用之器也今年將相多其勞承制擢德新行中書賔屬為照磨余又欣然謂僚友曰方面大臣夙興夜寢思欲與四方士大夫共天下股肱之寄猶宫室之于材木聱樂之于琴瑟衣服之于布帛舟車之于水陸不啻也德新以其所抱負從容于其規矩尋尺抑揚輕重之中殆琴瑟之適耳柱楔之中度布帛之便躰舟車之服習有素者乎充是以往等而上之蓋無施而不可也嗟乎使天下之制國者舉能使大小適度長短中程職其職者各得盡其能則士之如德新者不可勝用矣作原器至正二十二年六月庚子臨海陳基𫐠諭圃文永嘉余唐卿父寓于越治圃號菜薖夷白子為著諭圃文俾執事者歲時申圃政備菜薖氏掌故之一菜薖氏之圃在越桐桂里歲仲春土膏脈起將有事焉先期具畚鍤羞酒事明日盛服謁后土氏東嚮立召圃之老者拊茠具告之若曰嗚呼若知菜之為用乎先王為耒耜教樹藝五榖五𬞞實並殖焉太史公書稱千畒薑韭其人等封君龔遂令民種蔥夲五十韭薤畦各一宋宇種菜品三十閔仲叔飯友無菜仲叔固誠貞士哉夫圃與農㓛角故歲無榖曰飢無菜曰饉甚矣水旱蟲厲凡以賊吾圃者弗可以弗戒又曰若屬老吾圃習圃事勿恣捕兔敗吾瓜勿私利盜錢耗吾薑勿縱逸馬踐吾葵勿茍媚馬齒苦苣辱吾嘉𬞞俾芹可以獻吾君菜可以享吾師韭可以餉吾賔蘋蘩可以􅗲福于我鬼神吾用有常慶若亦永與有利又曰吾貴弗逮龔葛氏敢忘此味冨弗擬封君曷敢慢此色貧弗讓仲叔氏之徒曷敢少斯圃然有圃貴有政無政則捕兔弗禁暴于水逸馬弗虞烈于旱盜竊弗戢酷于蟲癘馬齒之害弗勝茂草歲不告饉而圃巳墟矣嗚呼禍福若是其昭昭也吾申用顯告若尚慎聽毋忽往率乃屬力圃事用底有秋以無諭童文有序陳子之居有畜犬日走雞群衝冒馳突縱橫自肆雞不勝其橫則蒼黃鼓翼錯愕呌號若求哀于人者陳子閔焉命童設間以衛之僮或懈則其橫愈甚乃為文諭僮俾母忽以貽雞害其辭曰后皇育物莫靈者人惟人配天莫貴者仁人必有家家必有畜彼畜焉依隸于僮㒒惟犬司夜厥警有常惟雞司晨厥聲孔臧晝夜是需有如水火所貴相生不取相禍昔人有犬乳而求食雞哺其兒以朝以夕今我有雞三五為曺恃僮為命載啄載遨僮食主祿當役主役惟是犬雞豈有僮職犬夜而號人誰爾憎雞旦而鳴人誰弗興雞或失旦其責斯厚犬而失盜其罪孰宥今雞孔時人焉是賴犬而暴之僮忍弗戒惟犬與雞固皆人畜飲不同牢食不共粟昔更哺兒今更相賊豈余匪德抑僮罔飭僮而弗恭雞犬乃攻攻而弗禁咎則由僮僮職不修雞失其所主不率僮怨將誰處爾犬與雞于僮何有一安于栖一謹于竇我非私雞僮勿縱犬以是示諭僮敢不勉説舟贈謝從義吳陵謝侯守杭之三年擢讃太尉府為咨議參軍其赴吳也臨海陳基合僚若千人耴杭湖山之瓌麗與前代名蹤勝迹之可賦者分題迭詠餞侯于舟因指舵而告之曰侯亦知舟之為用乎夫舟所以􅍱川而濟險者也其所任亦重矣然必有所需而後可以致其用焉舟之所需其類不一而曰楫曰檣曰帆皆有職于舟者也舉是數者各職其職矣然而不聽命于舵則進而或却行而或掣未見其能濟也夫舵者固舟之司命乎天下之涉海者必由江河彼瞿唐灔澦龍門底柱其尤險者也雖有兼舟利楫而所需或勿備茍備矣而操之或不得其要則亦不敢以言濟其或幸而濟焉非舟之福也夫川有逺近而舟則有小有大舟之大者其任重川之逺者其人衆彼吳越之人相救如左右手者操之得之要也舟中之人皆敵國者不得其要而操之而移左置右又或不能無偏重也蓋操舟固難而無偏重者為尤難非惟古為然也今則尤然也謝侯文武忠孝為國股肱既以身先舟人鼓枻于吳興停撓于檇李矣及弭擢于錢唐夷猶于藩方播循良以為風泳豈弟以為波而淪胥于溝壑者莫不待侯而后濟而侯蓋未始有難色也今也輒師帥之良任帷幄之崇又將身先舟人操江河司命之舵運吳越左右之手救中流遇風之人以􅍱諸海舉焉而措之冝益無難者矣蓋任重而不偏則致逺也不泥雖或龍門在前灔澦在後然使綏以將之翕而張之重以持之險而夷之未必非舟福也凡分題賦詩以壯矦之行者皆同舟之人期必濟于侯者也侯尚無以不難為難也哉至正二十一年二月丁酉郡東門舟中寫丁彥眀字説淮南丁公彥明問其字之義于余余為之説曰君明鑑鑑所以辨妍媸也人情莫不喜妍而惡媸彼鄒忌之美不及徐公亦逺矣然內而妻妾外而賔客或私焉或畏焉或有求焉􅌰莫敢為質言者及窺鑑而視則其不及也瞭焉夫鑑𥘉何容其心哉亦無私無畏無所求而已前志有之以銅為鑑可正衣冠以古為鑑可知興替以人為鑑可眀得失彼鄒忌之鑑何鑑也曰人鑑也何以知之蓋事之有是非人之有善惡猶貌之有妍媸也彼辨妍媸者必以鑑猶察是非擇善惡者必以理理者天之所以豫人人之所以為鑑也明者無所容心于是是非非善善惡惡之天也嚮使鄒忌朝服而衣冠緣飾而自矜興焉而不窺鑑寢焉而不自思則忌也將終身以美驕天下而齊之君臣未可知也及一旦窺鑑而妻妾賔客舉不足以蔽其天而齊國因庶幾矣燕趙韓魏聞之于是相率朝齊而六國之臣皆自以其明不如忌忌之鑑夫豈異于人哉亦不蔽其天者而已丁君結髮從戎受之將相起家列校服勞王官而未嘗以材武器能自表襮其鑑之得于天者厚矣盍嘗觀于內外疏戚亦有私已畏已有求于已者乎反而窺之亦無所容心于其天者乎古之君子或佩弦或佩韋或銘諸器物皆所以去其蔽于人而充其得于天者也今也奉以周旋不假諸物而是是非非善善惡惡之天不過因其名字而充之不益親且切乎揚子雲有言晞驥之馬亦驥之乘也晞顔之人亦顔之徒也彥明其尚睎哉至正二十一年五月甲子説鶴瓢説瓢與鶴非同類也而鶴之稱烏乎始始乎形之肖爾瓢之種瓠也而瓢之制烏乎始始乎始用瓢者尓均之為瓢也然使其種大而實五石祗見其瓠落無所容未必其能用也惟其小也而又肖夫鶴蓋小者人之所易習鶴者人之所同愛以易習肖同愛嗚呼吾知其弗棄矣吳門李士明得鶴瓢于青城山道士道士以瓢自隨𥘉不虞其豫士眀士眀之未始與道士接亦不虞其得是瓢瓢乎果孰生尓孰肖尓而去􅈬亦孰主張尓乎吾聞昔有辭天下而受瓢者夫以天下易一瓢其所耴亦廉矣然亦不以有瓢為樂而卒棄之今士眀之得是瓢既服用之又圖其狀詠歌之不少置若將終身樂有是瓢者士眀之于瓢誠厚矣雖然藏舟于壑夜半有力負之而走士眀之弗棄瓢士眀之責也士眀亦知自盡其責而已尓而其責有弗在士眀者亦不暇于瓢計也夷白齋藁卷之十二
