front:
  text: 夷白齋藁卷之二
  hash: sha256:fb3fd3474ac00176cf504bb612c9a2a0f4d44952edebb82e61ba77d0e19bfde3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_002-1a}
body:
  text: 臨海陳基著金華戴良編古詩四言九月夀沈母也十年九月草有九日沈氏大母為歲九十歲事告成登黍與稷孫進裳衣婦具酒食母衣維何天子賜帛母食維何伊帝之力母升于堂朝日有光崇殽于爼實酒于觴孫拜起舞婦與在行酒旨殽嘉母樂且康中堂何有有絲有竹琴瑟管䈁繁音妙曲間以金石鏘之佩玉黃苟鮐背維母是祝載彈載詠再歌載弦母醉且飽母笑且言母曰孫孝母曰婦賢冝尓蠶于室梧桐墮金井寒螿栖露叢離居在萬里一夕生秋風秋風忽巳暮離居邈何處獨寐在重幃相從乃中路秋夜何迢迢迢迢不能寐起坐彈孤琴寫此千古意鳴鳯久寂寥猗蘭亦憔悴注聖既莫作後賢孰當繼獨憐商山翁去去𣸪遐逝空谷亦何有紫芝聊可餌如何末路中亦墮留侯計羽翼倘不成鴻鵠將垂趐苟可利生民寧辭暫紆轡區區後世名于翁胡足記秋水不可􅍱美人安得從眷彼芙蓉花盈盈秋水中非無舟與楫所畏蛟與龍臨流不能采零落委芳叢群動夜已息秋聲適何從仰視天宇髙微雲浩無蹤眀月在庭户河漢上橫從既莫知所始何由究其終我獨弦我琴微風入踈桐寫作清啇調感激意無窮昨日苦炎暑端居厭煩渴手短河漢髙井深轆轤折此夕秋已清一洗塵世熱紈扇委深笥輕羅换疏葛天運無停機人生自悲恱急景一以遷流芳遂衰歇洞庭生微波眀河湛𥘉月落葉辭故枝驚鴻亦飄忽為謝同心友胡為久離别我有一樽酒獨飲不成歡豈無骨肉親悠悠隔河山亦有平生友合併良獨難古人千載上世逺不能舉何如與明月徘徊松桂間月既知愛我流輝照衰顔我亦知愛月託心同歲寒長碩玉宇淨河漢生微瀾四海仰餘照親友各平安夜夜見明月人人無苦艱此月不可負此樽不可乾天地等􅊇旅流年劇驚湍古人雖云逺其言若芝蘭舉觴以和之對月更盤桓讀國語二首成周昔重幣欲以母權子用此實王府為計無乃鄙塞川以為潢川竭潢亦毀至哉單穆公論列一何偉當世不見用後王冝鑒此厲王怒聞謗乃使衛巫監欲逞一已欲兾彼萬口箝防民甚防川川壅冝蚤決民言苟不宣禍至無乃烈先王置謗木政恐有闕遺瞽史與矇䏂賦誦左右規百工及庶人人賤言不廢聖亦擇芻蕘賢當受耆艾詠史三首百金購馬首為計良已踈如何不嵗間一至三馬俱燕昭亦中主謀國乃不愚一聽郭隗言虛心闡良圖黃金築髙臺束帛走中區瑶房間曲館窈窕貯名姝五鼎列珍饌駟馬駕髙車今年迎樂毅明年迓由余秦恃百二險六國日丘墟燕小獨後亡得士諒非虛昔者智襄子獨擅六晉強一舉滅范氏再舉圍晉陽韓魏為執轡意氣何揚揚以水灌人邑自負力莫當誰知躡踵間身死國亦亡恃力不務德覆滅乃其常吾憐晉陽圖沉竈且産蛙不沒僅三板民志卒無它乃知蘭絲利不如保障多邯鄲非不實民膏鬱峩峩赱逺不趨近君子意則那先王有所屬尹鐸與民和智氏不好德獨奈晉陽何懷美人次韻答友人出門日𥘉昕入門日已隂懷彼千載人勞我一寸心歲月忽云邁江湖一何深北度限太行南逰阻桂林既負慷慨懷肯羡詭遇禽感此獨繭絲中有太古音寫作梁甫調歎息淚沾襟待王子充未至屏迹去城闕幽栖向林阿永懷同心友褰衣起婆娑憶昨走亰邑彌年阻關河結客燕趙間頗𣸪許悲歌逸驥謝羈紲冥鴻辭網羅所念聖哲逺中心良匪它夏屋廕嘉木芳池彂新荷須君此弭莭日夕共委他夏日喜友見訪兀兀少寤語悠悠多逺懷斂迹􅍱僧夏凝神企心齋美人忽至止良友與之偕閴然類逃虛跫尓覯所諧迹邇志彌愜情敦禮無乖衣褐貴懷璧屬辭慚類俳積雨霽𥘉夕清飈掃餘霾碩言念幽獨日此憩髙􅼥投贈同志仲夏暑氣溽平居愛髙明奈此西日炎四壁鬱如蒸鳥雀亦苦熱群飛繞簷楹念彼縞衣侣引吭一長鳴諒匪丘樊姿𬗟懷霄漢情髙槐鬱成幄稍稍清風生嘉卉亦自媚為我顏色頳攬物感時序興言劇心旌美人一水間纍日廢逢迎投此以贈之聊𣸪慰屏營次韻吕彥貞衛國不好士養鶴皆乘軒夏禹后之聖匍匐拜昌言峨峩十二樓上有孤鳯鶱覽德一下之顧肯栖于樊世無倜儻人嗟此復誰論洪河西北來萬里日崩奔學海有源委黽勉冝自敦况有典刑在共此北海尊分省興同幕諸君小集日出詣公館眷言𣣔何為名法非素習吏櫝漫紛披况當兵戈際生民屬瘡痍愧匪適時器徒蒙君子知今夕復何夕群彥辱追隨繫馬及亭午開軒納涼颸須臾急雨至四座却蒲葵呼吸異舒慘俯仰閲盈虧開尊酌芳酒聊此慰衰遲知已諒難酬厚顔祗忸怩梅南書隱為上虞俞氏賦草木本何心人情殊所託豈伊同臭味政尓髙風格眷彼東山陲貞葩爛林壑攬此亦奚為幽棲逺城郭玉立衆芳先氣壓群卉弱詒謀豈無意迓續斯有覺圖書日前陳琴瑟時間作窹寐賢聖俱起坐塵坌却故俗仰堯封名山餘禹鑿擬赴歲寒期莫負東家約夏日齋居用蔡都事彥文韻徽生一世間俯仰異今昨嘯傲羲軒際慷慨孫吳略趣舍雖或殊浮湛得無怍含靈屬憔悴畏途乃盤錯仰天河漢髙涉海蛟黿惡三􅏙日蕭蕭五湖煙漠漠浩蕩魚鳥性偃蹇麒麟縛衆卉萋更碧孤芳紛已落動植迭榮疩崇深互飛躍回觀靜中趣却慕方外樂况非軒冕姿誤嬰葑菲託已與向平期終赴名山約分省早集懷錢貟外蔡都事湯𬋩勾間歲􅍱戎旅終年廢丘壑一為塵網嬰竟負煙霞約今晨適公署時暑秋巳薄山翠落簷楹湖光映簾幕同袌二三侶分携異今昨畏途屬賢勞端居念離索蹉跎愧衰暮僶俯參畫諾臨事每參差憂時空謇誇覽此山水勝寫我情慮惡遲子早還歸開樽共斟酌樓居樓居屬朱夏宴寢冝清晝微雨散空靄遙峰獻餘秀深巷頗紆轍良朋亦時覯尚論黃虞前足以彂蒙陋何當稅塵鞅逺迹栖雲岫為謝荷鋤翁遲種南山豆彥文點兵餘杭冨陽新城道上賦詩見示因次其韻四首出門難行路四郊人迹疏畏􅍑如畏賊餐米如餐珠驅車候眀彂點兵歷邉隅誓將剪妖虜聞者喜𣸪歔誰能行伍間奮身先萬夫使者有所適陸行復乘流迢迢餘杭道泛泛富陽舟盡瘁乃明訓宴安匪良謀不貴徇名祿所期無悔尤自古君臣際同樂必同憂天髙河漢秋月白風露涼引弓激長矢願言射天狼仰視叱熒惑却立麾攙搶誓此七尺軀為彼百夫防孤忠一以奮萬死庸何傷生人屬塗炭群妖方弄兵大將肅旗鼓三軍嚴視聽所重致天討慎勿妨農耕鯨鯢塗兩觀虎羆行四征弩力平南服持之奉聖明分署望鳯凰山秋氣日以佳微雲不成雨青山天際來與我為賔主飛龍及舞凰突兀在庭户須臾霧靄收草樹粲堪數謇豫麋鹿姿詎意嬰圭組蹙縮匪天真驅駝漫塵土偶坐屬無喧晴容湛空宇𣣔去𣸪踟蹰此意當誰與次韻彥文古詩三首西齋對雨江雨水雲國隂晴無定期靡靡歲將晏悠悠夜何其驚飈一以徑落葉漫紛披人情異舒慘物運互推移君子懷端居玄覽久忘疲客至即共飲酒行勿停巵奕勝不計速句巧寧厭遲霜橙眩餘緑秋菊含晚姿豈不念儔侶日夕共委蛇所覬葆沖默勿𣸪費煩思池上空池納光景皎皎無緇𥻘性潔不容滓體虛能照人古人以水鑑鑑心不遺身所以解纓侶亦𣣔濯其塵纓解復可結塵汙不可親凝觀池上者當知清濁因對菊我有舊栽菊蕪穢北山隅朅來三十載誰𣸪護根株非但歲月久况兹川路殊憶昔少壯時親愛日歡娛每逢佳節至掇英泛尊壷持觴送飛鳥飲畢卧蘧蒢今辰屬遲暮目斷歸雲孤終然嗜真賞時復過君廬送邵同知分韻得來字我折錢塘栁君上越王臺越臺今寂寞昔人安在哉空餘鏡湖水蕩漾小蓬萊千巖雨新霽萬壑淨氛埃山色時時好荷花面面開流芳殊未歇爛熳待君來次韻沈仲説答蔣子中遺山水便面詩端居宴修景尚論天人際紈扇逺寄將咫尺山水麗出入懷袖中盈盈落空翠樂此虞舜琴傲彼羲皇丗穆穆來清風妙與天者契夷白齋藁卷之二
