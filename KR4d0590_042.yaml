body:
  text: 夷白齋藁校勘記卷次葉次行次本書張刻本日録二二後三繼是而起起作後後六四公之指授者者下有耶字後十一泝黃河而北無黃字二三前四雍容紆餘餘作徐前六如出一律律下有雜乎並奏四字前六至八居無何我吳王聞適值兵興藩翰不次其學用賢前八九不數年間遂以屢後又用之省幕用之遷而長其省幕其公府後調太尉府參軍前十一國家之制作及四人之求之者方之求之者前十二蓋沛乎其無窮矣沛作粲無窮作可觀後八貴重之歟無之字後十二恩意最篤最作尤二四前四故以題其藁云藁作集一一前七齊魯之郊齊作鄒前十出國門而南鶩兮鶩作騖後七維歲行之在丣丣作未二前四恆不利爾軀利下有於字前十一蓋進則揚於聲明聲作高後八船人船作舟後九其有以夫以作似後十一崇丘寄倪元鎮丘下有操字三前二山高寄陸玄素高下有曲字前五爾曷從之之作思前九且著春衣春作斑前十樂無殃無殃作未央四前五綺翼離褷褷作披後七原上秋風吹百草秋作春五前二北賈販南賈作商二一前十一黃苟鮐背苟作耉後一式如母之年無之字後四以仁我賓侶侶下空一格後六以我釐牟作蕺牟下空一格後十俯仰金復茲金作念似當作今二前三迢迢不能寐迢迢作搖搖前十一我獨弦我琴弦作彈後一昨日苦炎暑苦作值後四為謝同心友友作人三後二吾憐晉陽圖圖作圍四前一日夕共委他他作蛇前二夏日喜友見訪友作鄭明德三字後七况當兵戈際兵作干後十芳酒酒作醑五前八含靈屬憔悴屬作致前九涉海蛟黿惡黿作􅜹六前七弩力平南服弩作努前十二謇豫麋鹿姿謇作蹇後一驅駝漫塵土駝作馳晴容湛空宇晴作喑三二後九勿使土遺利利作物三前二載齧令骨枯齧作咂前六下令致天誅致作行後四密雨灑兼葭兼作蒹四前十二三面阻重湖三作二後一材兼文武術材作才五前十一十井無一甘十作千前十二蕭條值九日九日作重九後九綽有靖者風靖作靜四二前二縱有百丈彈丈作尺不如數尺蓬蓬作篷三前十二山營夜依谷山作小四後七軒車遞英蕩英作泱五前三人籟靜踰聞人作天五一後四五百年義重黃金輕黃金作金為二後三聲名萬古齊伊周齊作跟後五躬耕湖上湖上作甫里三前四人間乃多離別苦乃作怪後一閶門柳枝短枝作尚後四送讓還吳送下有姪字四前五削去涯岸無猜嫌涯作崖六一前六天目山山作峯二前七醉援北斗援作扳後一空明山人歌山作道後五盡留瓊田留作耕三前十一縹渺十二之玉城之玉作樓五後三秦文仲學古仲下有文字四前二送鎦治中治作子前十慚非割雞子子作者後八訪本覺欲長老無欲字後十鬢毛班班作斑七一後五鱸熟蓴香熟作美三後五生氣渾如未死時未死作有宋後六頻瞻出牧旗牧作守後八白芙蓉蓉下有次錢伯行韻五字下一首不另列題四前七風燈照人不數點人作岸前十二次韻仲説韻下有沈字五前六次韻懷彥誠懷下有于字前十一杖錫相從海上留海上作湖海六前九水木淸華亭水木淸華作華氏栖碧後一仲説留陳公原原下有別業二字後十二携棊棊作琴八二後四答秦文仲仲下有文學古三字三前九迹未泯泯作塵四前三送胡宣使使下有布字前八昔年同客客作醉五後二却憶國家國作官後五飮吳南城飮下有餞字後六催畫鷁鷁作舫六後十二秋風贔贔作贔屭九一前八可憐滿地秋如錦錦作畫一二折後十二前一持奉吾君吾君作君王二前十一錦瑟玉笙玉作瑤前十二悲鳳凰悲作協三前十二交義義作誼後九秋風秋作西四前十每尋陳迹不匆匆不作故後九歸朝歸作還後十一寄吳中分幕諸同諸同志作張思廉陳志惟允諸友後十二江海江作湖五前八風物物作景樽中酒酒作物前十誰謂城西探小春謂作共六前六洞庭橘熟香醪嫩嫩作美後五此去定分宵旰憂定作應十一後七頻年頻作昔後十狼山狼作淮二後一福山港寄省院諸院下有張思廉陳惟友允六字五前四五馬旌斾三月暮暮作盡後一茶烹日鑄龍分水日鑄作石鼎鶴語風語作唳後五十載載作年後六深杯寧惜為君傾寧惜深杯一醉傾十一一後五浩蕩十年客客作過二前一垂死猶憂主死作殁前九兼簡蕭靖靖作靜前十二別袂慘莫把莫作難四後十為問出谷心心作嬌八前五美荀瓌之純孝瓌作環疑瓌之誤前十目反顧目作睛前十一眄翠竹以喑喑眄作倚顧睽離之莫任顧作奈十二二前五郡城城作邑三前十一入參廟廊廟廊二字乙轉四前二飾其儒宮飾作飭宮作官五後十二處身淸潔潔作儉六前五部人空格作左字前十二糧艘會同同作萃七後十二陳基為銘銘曰不重銘字十一前八是是非非是下有而字後十一羞酒事事作殽十二前七吾用有常慶慶作度十五前十初不虞其豫士明虞作意豫作與前十一瓢乎果孰生爾重瓢乎二字十三二前七晴晦明之變幻晴下有雨字後八灝溔潢漾溔作瀚五前三魏人之以玉為石無之字玉下有而字十四一前九龍門琦上人琦上人作釋良琦後七其文學才藝學作章後十二泰州尹尹作守三前一間弄翰翰下有墨字前五母氏察知其衷無氏字五後十二而子孫猶襲衣冠無而字十五二後八民有不附者乎民下有其字後十一願自愛愛下有以凝功名之大於今日也序以俟之十四字四後六檀順之田檀作澶募農入耕者入作人十六二前六廬於墓側無側字隱居耕釣以山水隱居耕釣以作志於自娛隱約以耕釣前八以求其志以下有益字前十二歌考槃之詩詩作什後七弊弊焉弊上有貿貿二字後九人困力殫殫作疸後十又居水陸之咽喉咽喉作喉襟三後三忘渴飢渴飢二字乙轉四後六尚無以尚作幸五後一岩穴之材如顯民無岩穴之三字者後三庸因叔良行無庸字六前四而獨竊竊然不重竊字十七二前四分憲吳下下作中後二淮楚間環地數千無環地二字里三後十一鼓行過富樓富作當四前十二衢城火城下有不戒於三字後八復以儒業其家其作鳴後十可喜喜下有可愕二字後十一十二母兄樂其志母上有若字兄上有與字樂上有胥字五前五至惟允兄弟至作逮前九英畯畯作俊十八一後一褒然舉首褒作褒疑褒之誤後五教授君雖死死作逝後七而人曾不知擾而作四後九十抑和糴以備軍餉無此十九字其事急其勢逼有不得不爾耶二後十一老者死死作逝三前七與徽饒義興饒義興作宣廣德後四又僻在泖陂泖作陀非川陸之咽喉川作水後八戶部郎中師允允作光後十二而融顯光大融顯二字乙轉咸賦無咸字五前三亦且足以取徵矣無且字前九悅堂禪師顏公無禪師二字後三其為養如平生平作事十九五後十為僚從從作屬後十一屬余為之序屬作授六前八故無飛衛衛下有養叔二字雖有燕角之弧朔弧朔蓬作弓荆柘蓬之簳二十一前六豫章陳氏豫章作南康二前十一無松梓梓作柏四前一至正十五年夏四十五年夏四月作乙月也未夏五前五賊復至無賊字賊大至賊作寇前十衆皆疑其詐無皆字公獨決聽之決作采後一公命訪其尸無命字後八盜弄庫兵掩我不盜弄庫兵掩作僣弄備神器撓後十一不動聲氣氣作色五前十求升斗之祿祿作粟前十二聖世所以食賢材聖世作朝廷二一一前十欣公笑隱欣作欣二前三治郡甚勞苦外過外過從作盍往散適從後八性之診之曰性上有請字後十故病蹶耳蹶作厥三前二侯不徑捍捍作悍四前一鄭林鄭作鄧步驟中鸞和之音鸞和二字乙轉前七信夫而留之夫下有顧字後七畀以今額畀作俾後十一兼同知無兼字五後八惟人實參之無惟字後九是以為秉彝無以字六後五參政元鼎公鼎下有脫歡二字後七親與士大夫大夫作卒後九道由淮楚由作經二三二後八九精於猗頓含菽縕親而親之安其孝也絮美於紆朱懷金飮水甘於列鼎縕袍華於佩玉三前五創常平際留之倉際作濟前十二至正十年月空格作蠟朏二字後一落成於月於下有明年如三字月下有望字後十徙治要害地害下有之字後十二而神者無者字四前四庚寅月空格作暢朒二字後二心止於符乎符作無五後九孰得而禦之乎無乎字二四二前四故正己必以道己下有者字前七西門氏之於佩韋氏之於作萊蕪之前十一宜邇之事父宜下有乎字後三以有餘補不足足下有依乎中庸而已六字三後七太素靈樞樞下有內經二字四前四東野之南榮東上有於字因名其軒軒作居前六乃其釣遊之處也無之字後六知其植之之自自下有爾字二五一前九顧挈妻子顧作爰前十一室之內一上有其字後至不死之藥死作老後五而不知而作殊後九十以質之於有道者無於字云下有至云正壬辰玄月甲子八字二前十一以為景蒙告佛之告下有也學二字徒有香嚴師者真知師者下有在松江殆竹者也四字三前四歲時來歸歸作登後一居高則體夷則神當重體夷二字鬯四前四余於張氏張氏作濟和前五吳興山水之國吳興作江南國作奧前十可以和人神人神二字乙轉後一今張氏之於竹張氏作濟和二六一後九其尚念之之下有哉字二後二而心味之不暇重之字後九距黃巖州治之南無之字有山曰龜山無山曰二字後九十禪師定公定禪師後十十一州人李竹心氏黃無此三十一字克仁氏許野夫氏孟寂菴氏皆慕師之風往來精舍為方外遊後十一至順二年辛未無二年二字桑門契如如作山三前一州之信女金氏周州信女金周氏徐氏黃氏前二世以甲乙守之無此六字前三而律不嚴律作傳前六以貴胄從學考亭業儒出仕朱子且姻而師也生稟淑靈無也稟二字前七幼篤慈忍少長事事親克孝祖及父兄孝且恭前八於杭之南屛願以無此十四字初服而師事焉山前九年二十有八有作又具戒具領戒言首謁無涯際公首作次於婺之智者無此五字一言懸解言作語前十繼見鐵山璚公繼作更前十一以至正元年辛巳正作元無辛巳二字八月二十四日委二十作草委化作化示寂珠圜玉潤潤作潔前十二遂建塔山之西麓塔下有於字夏臘夏作僧後一己丑師之上首弟無己丑師之上首六子一恆字弟子作其徒不遠千里無此四字後二出處大槩無大槩二字徵文為記為記作記之勒諸貞石以昭示無此九字方來後四云有真人云作古世家舊族舊作右即有入空懷寶無即字懷作探後四五厥躬退藏於蜜無厥躬二字蜜作密下有之志二字後七由天台鴈蕩無此五字職此可徵職作觀後八吁夫豈偶然而已無吁夫而已四字哉服師之服居師之無此八字居甲乙之傳乙作剎後十因恆之請而為之無因恆之請而五字書其末也其作抑後十一是歲七月既望無此六字四前三舊邑澉浦舊作屬前四有司防禦防作備前五勇果果作智前九怙終稔惡終作強前十二鹽策之正正作征後十並勒之石之作諸二七一前八砥厲激卬砥厲作砥礪前九讀書之舍舍作齋書紳齋無齋字後四循之如矩彠矩彠作矩矱後十一審度於矩彠矩彠作矩矱二前一以行蠻貊者無者字皆書紳書下有諸字前三在於言行之間而無矣字已矣三前十二作諸佛寺寺作事後一文書訥拜淮南行訥下有適字省後九寫銅像銅作斯古者古上有嘗考二字四前三蓋無所祈穀實所作非前三聖天子養天作世五後一公懋賢懋下有之字二八一前八歲方冬方下有隆字後八室屋之敗者屋作廬後十二掊刻之􅖈􅖈作孽加以武斷之斧斤武斷作戕斫二後十皡皡齋無齋字子幸為吾記之無幸字三後八以為季周告云云下有至正庚子辜月朔七字後十一螟􅏑賊蝝􅏑作蟊四