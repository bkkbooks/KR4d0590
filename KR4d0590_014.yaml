front:
  text: 夷白齋藁卷之十四
  hash: sha256:9abd4b472343b73adac6bb9ea58bc67e0af5e82e0ac71b66f01c825f38c1c8e6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_014-1a}
body:
  text: 臨海陳基著金華戴良編序送鄭同夫歸豫章分題詩序余辱與鄭文學同夫遇于吳之隐君子頋仲瑛氏所以仲瑛素多賔客而同夫與余相值未暇問妵字邑里行李所從来輒舉酒為壽獻酬雜遝亦不計年齒貌蒼老坐上坐飲酣鼓舞各以所長自適扵是吳與郯九成沈自成龍門琦上人赤城金敬徳錢塘俞在明皆以能詩為仲瑛文字友而九成素不善畫捉筆作山水圖輒爛澷竒詭坐客嘖嘖称歎同夫首為賦詩仲瑛率衆賔和之而敬徳𧺫行酒放謌作廬山髙亹亹有梁䠂間人氣調同夫囙歡甚頋余曰吾自北方来行數千里親舊䟽數固自有不同然飲酒之樂未有如今曰吾行且歸矣諸君能無乎余然後乃知同夫為豫章人甞登清江范公蜀郡虞公酆城揭公之門而余故人危君太樸掲君伯坊楊君季子邹君魯望張君宣仲皆其友也嗟乎余恨不及識范虞二公而幸嘗獲接掲公之下風而聴其餘論見其文章九原不可復作而其郷之士如同夫者其文學才藝一何似公之甚也同夫歸矣太樸諸君子皆以其父兄師友之學相繼登䑓閣頋余無似与仲瑛賔客咲傲三江五湖之上以吳中山水分題得詩若干首為同夫贈余辱為之序囙以謝不敏扵諸君云趙泰州平反冤獄詩序至正十年二月泰州尹真㝎趙公子威平反王㽘冤獄事聞中吳士大夫皆曰偉㢤趙使君真長者也囙相率著爲聲詩以羙之揔凡若干首㽘故江浙行中書叅知政事浮光王公之子也以才選爲淮東帥閫奏差叅政公當世名臣㽘以佳子弟給事閫中雅爲長官所信重然性直不能容人之過人有善亦未始不以身下之㑹閫帥飲酒髙㑹膳夫有具茗飲弗謹者㽘以軄督責之命杖之者廿膳夫歸越五日死疫揚州錄事判官有與㽘有郄者欲因中傷之遂嗾膳夫妻訴㽘踼傷其夫右脇㽘逮繫五毒備至不勝苦䠂遂誣服淮閫居南北之衝而㽘又名家子以故人莫不知其冤者具獄上大府莫敢決乃更以属趙公讞之始盡膳夫所以死状而謀中傷㽘及凡誣證者皆伏辜扵是㽘之冤遂明白𥘉㽘之繫獄也士大夫皆曰叅政公平生所至用法號平允其子不冝坐此使世無守法者則巳如有之㽘其不死扵獄乎及其平反也則又皆曰㽘不死矣世復有守法者矣扵是相賀曰趙使君一治泰州而法為之平使天下皆如趙使君則人有冤死者乎趙使君真長者昔漢張釋之為廷尉其言曰法者天子所與天下公共者也故在漢獨釋之號守法不阿意天下至今稱之今公召歸禁林人且望公顯用如張廷尉廷尉天下之平也公其尚自愛乎吾聞召伯之教明扵南國既去而人思之其詩曰蔽芾甘棠勿翦勿伐召伯所苃今既望公為張廷尉又愛公如召伯何㢤盖多公守法不止扵活一無罪㽘而吾愛公則因㽘而重有所感也然則咏謌之彂乎情者其可巳乎是不可無以序作者之意扵是乎書送金西白上人逰方序吳僧金西白上人幼為天台氏之學既研精祕義又紬繹孔氏百家之書間弄翰為文章從容識軌轍及沉吟六義漱滌萬類扵煙雲水月間復鏘應金石妙􅍱風旨今年秋将鼓柂松陵振錫天笁絶濤江訪靈越過四明因度石橋探鴈蕩迤邐至金華求大比丘䆒其所謂出世間法頋母氏年邁無他兄弟備飬霜露載塗欲行復止母氏察知其衷則為之言曰吾聞親者遺軆之所自岀也佛者慧命之所由存也奉遺軆以續慧命頋惟輕重所在汝尚勿以吾私愛眷眷為也上人扵是問津扵江上丈人歛裳于邁若矢斯激搢紳之老章甫之英自鄭有道而下爭為詩文追貺之天台陳基復進而執上人之手語之曰浮屠氏其道有三曰律曰教曰禪然皆以慈悲為宗孝敬為本上人先䆒上乗後趋禪觀冝其曲意頋飬雅好懿徳在其法中可謂學知次苐由相入空者矣世之號居名教者往往扵佛氏之言恠駭舛􅊇及退而察之則所行有媿扵上人者多矣故予扵上人之去就不能無所感也雖然昔有浮屠師嘗躬織蒲為屦鬻以飬毋其徒至今髙之歲云暮矣白雲斯邈上人尚無忘織屨師翩翩其来歸㢤至正十年八月甲辰序浮青閣詩序越以山水名天下雲門又盡得越山水之勝而浮青之閣在焉盖自晋唐歴宋以来桒門上首之居雲門者皆統合儒釋妙攝空有樂与賢士大夫逰故其崇䑓廣厦金碧相錯縁崖架壑挟雲月而臨風雨如千峯閣者往往而在尚可想見異時登覧吟嘯之適遺音逸響猶隐隐林谷中斯閣之作扵時雖有不同然自吳興趙公耴眀教大師嵩公之語為為書之扁蜀郡虞公為文以記之賦詩以倡之繼而作者皆一時知名之士扵是所謂浮青者遂與前代之名踪偉迹競爽千載可謂盛矣且秦望抜起羣山四從髙卑俯仰之状窮竒極秀扵千岩萬壑之表每雨止風收天澄日鮮而浮青之勝丹青意匠所不能彷彿者唯詩人得之盖詩者所以模状物態陶冩性靈然非天機悟入神觀夐絶搜抉幽閟与造物争巧者亦何足以語此㢤予嘗從吾郷銒石庭上人獲見群公之作爛然如雲錦張鏗然如金石奏雜然如衆籟鳴雖未獲登斯閣固巳飄飄然若薾飛霞陵顥氣而㳺乎華嚴毗盧之境頋惟王謝之流風既逺支許之聲塵莫追雖欲復從趙虞二公㳺亦不可得徒見其清標雅韻扵諸名勝篇翰間重為興感而已上人俾予序之固辭弗獲乃為書其歎慕之㮣而歸之上人綂合儒釋妙攝空有者也其以予言為何如至正十年八月丁未序送煜上人序古之為浮屠氏者以戒為墉以恵為户以法界為宇以性海為郷以度門道品為族属菩薩大士為戚婣故求其法者不渉内外不泥中間不以語言不以文字必心空諸漏法同夢幻無得無證然後謂之觧脫予嘗竊觀自摩訶迦葉以佛所付心法相授受而逹摩以天竺名王子獨得其宗當梁武甘心佛氏人莫不以其造寺書經度僧為奉佛之至時逹摩甫至東土獨毅然以其諸所有為特人天小果實無㓛徳得其傳者有五曰可曰璨曰信曰忍曰能而能不出族姓不居華夏奮起井臼之中而得佛衣扵五祖忍焉及其說法曺溪大闡宗旨為天人師唐武后仄席嚮風敕書徴諭力辝不赴其視榮名為何如耶夫以逹摩屣棄王官印契佛心能以疋夫頓超佛䖏一則面譏梁武而空學顯一則身辞武后而宗風振卒使百世之下學佛者必以曺溪為津梁嗚呼盛㢤後世為浮屠氏者以權勢為墉以苞苴為戸以金碧為宇以貴富為郷尚言語者以謌罵佛祖為能攻文字者以嘯弄雲月為事甚至弊弊焉奔赱扵利害得䘮之塗而不知止使度門道品菩薩大士如果有知将怒而咎之之不暇尚肻俯而以族属戚婣接之耶吾郷煜上人弱歲出家學其學扵湖之道埸志甚銳及主蔵鑰扵杭之净慈遂為其徒所推且善讀唐人詩時有所作粲然可觀今年秋過予吳門與之語亹亹終曰予既嘉其逺去郷邑無父兄師友而能卓然自立如此又懼其乆而或流扵令之所謂浮屠氏者故推原其祖以瀆告之盖以吾同郷而私扵上人也然世豈無大比丘如曺溪者上人試以吾言質之其以為然否乎陸仲淵字序中吳多舊族其子孫克世積善之澤如甫里陸氏者代不乏人余所與逰者曰仲淵其少也嘗及見吳興趙魏公公為大書仲淵二字間以示余且曰願為之序盖仲淵名源源者水之夲而淵者水之深也天下之水其源皆出扵西北其流皆趋扵東南然西北之水莫大扵江河而東南之水莫深扵海方其濫觴扵崐崘經始出扵岷山也盖可以徒􅍱及其衝底柱下龍門絶巴梁轉巫峡率百川以委輸扵海然後浟湙㳽澷浺瀜滉瀁朝夕汐與時消息暑不加盈寒不加縮天吳魍象介鯨水兕之属朋從醜附竒詭變恠莫之端倪其有夲者若是乎人之扵積善也亦然孝弟以導之忠順以浚㳟儉以将之醇謹以持之積之以乆彂之以漸紆餘衍迤更數十百年而子孫猶襲衣冠躬禮譲浸滛乎忠厚之波涵泳乎深淳之涯窮力質行有長者風吁善之足以慿藉也如是夫仲淵之名若字其殆知夲也吾聞仲淵上世皆享髙壽而仲淵年垂六十齒髮不少衰其所謂孝弟忠順㳟儉醇謹盖出扵天性引而勿替殆将如河之衝底柱江之轉巫峡其勢必委輸扵海而後已也傳曰三王祭川先河而後海或源也㦯委也此之謂務夲為其後者使益勉焉則甫里之澤其未艾乎庸不辝而為之序徐公逺字序吳郡徐君孟逹命其子緬從余㳺緬𥘉名勉以與蕭梁時宰相東海徐勉同名乃易為勔而宋倖臣朱勔雖非同姓而同郡又易為緬盖其字公逺而緬之為言逺也扵是皆以為冝且請余序其說吾聞司馬長卿慕藺相如之為人更名相如後世無㦯非之者盖異姓而賢扵禮無所嫌也徐脩仁顯梁氏而勵志慎行事君不阿意苟合身都宰輔為時宗臣而以清白遺其後其視朱勔𧺫賤微徒以草木恠石媚人主鬻㤙毁法以固寵者萬萬不侔矣是故易勉為勔者尊同姓也易勔為緬者别邪人也昔之同姓也尚知尊而避其名則其扵親親可知矣昔之邪人也尚知别而嫌其名則其扵自脩可知矣尊同姓仁也别邪人知也惟仁也而後公無私惟知也而後眀而逺彼知能使後世不敢名其名與夫不屑其名以為名者仁與不仁知與不知而已矣緬乎其尚𢡟之贈葛孟顒序㑹稽王仲麟氏讀法家書為吳属曺史嘗有疾求醫扵吳郡葛氏扵是孟顒為診脉曰是謂内傷得之岀入飲食哀樂以藥治之而瘉仲麟多其為乃徵文扵余曰詩云無言不讎無徳不報幸吾子圖之乃為之言曰吾聞葛氏雖以醫名家而其上世夲儒者人無貴賤賢愚皆敬而称之曰可乆者孟顒之父也可乆甫誦詩書百家之言為文章竒偉博辨而卒歸之扵六藝然為醫視古人無媿也孟顒以家庭習聞之素出而𧺫人之疾又復有父風何葛氏之多賢也㢤昔者秦和論疾推本五色五味五聲必原扵天其說與周禮合鄭子産博物君子也而論莭宣之道又黙與和契吁醫豈易言㢤故必通詩書六藝百家之言如可乆甫者而後可也然漢臨菑人陽慶不以禁方傳其子孫而悉予太倉長淳于意今葛氏儒者而父子身方相授受而孟顒起人之疾盖不止扵仲麟就吾所知而言則葛氏之賢豈不信㢤余媿非博物君子願聞秦和之說與周禮合者而孟顒父子豈余斳㢤姑因仲麟之請而為之序夷白齋藁卷之十四
