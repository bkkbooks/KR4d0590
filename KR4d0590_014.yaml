front:
  text: 夷白齋藁卷之十四
  hash: sha256:9abd4b472343b73adac6bb9ea58bc67e0af5e82e0ac71b66f01c825f38c1c8e6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_014-1a}
body:
  text: 臨海陳基著金華戴良編序送鄭同夫歸豫章分題詩序余辱與鄭文學同夫遇于吳之隱君子顧仲瑛氏所以仲瑛素多賔客而同夫與余相值未暇問妵字邑里行李所從來輒舉酒為壽獻酬雜遝亦不計年齒貌蒼老坐上坐飲酣鼓舞各以所長自適于是吳與郯九成沈自成龍門琦上人赤城金敬德錢塘俞在明皆以能詩為仲瑛文字友而九成素不善畫捉筆作山水圖輒爛漫竒詭坐客嘖嘖稱歎同夫首為賦詩仲瑛率衆賔和之而敬德起行酒放歌作廬山髙亹亹有梁楚間人氣調同夫因歡甚顧余曰吾自北方來行數千里親舊疏數固自有不同然飲酒之樂未有如今曰吾行且歸矣諸君能無乎余然後乃知同夫為豫章人嘗登清江范公蜀郡虞公酆城揭公之門而余故人危君太朴揭君伯坊楊君季子鄒君魯望張君宣仲皆其友也嗟乎余恨不及識范虞二公而幸嘗獲接揭公之下風而聽其餘論見其文章九原不可復作而其鄉之士如同夫者其文學才藝一何似公之甚也同夫歸矣太朴諸君子皆以其父兄師友之學相繼登臺閣顧余無似與仲瑛賔客笑傲三江五湖之上以吳中山水分題得詩若干首為同夫贈余辱為之序因以謝不敏于諸君云趙泰州平反冤獄詩序至正十年二月泰州尹真㝎趙公子威平反王䴚冤獄事聞中吳士大夫皆曰偉哉趙使君真長者也因相率著為聲詩以美之揔凡若干首䴚故江浙行中書參知政事浮光王公之子也以才選為淮東帥閫奏差參政公當世名臣䴚以佳子弟給事閫中雅為長官所信重然性直不能容人之過人有善亦未始不以身下之會閫帥飲酒髙會膳夫有具茗飲弗謹者䴚以職督責之命杖之者草膳夫歸越五日死疫揚州録事判官有與䴚有郤者欲因中傷之遂嗾膳夫妻訴䴚踼傷其夫右脅䴚逮繫五毒備至不勝苦楚遂誣服淮閫居南北之衝而䴚又名家子以故人莫不知其冤者具獄上大府莫敢決乃更以屬趙公讞之始盡膳夫所以死狀而謀中傷䴚及凡誣證者皆伏辜于是䴚之冤遂明白𥘉䴚之繫獄也士大夫皆曰參政公平生所至用法號平允其子不冝坐此使世無守法者則巳如有之䴚其不死于獄乎及其平反也則又皆曰䴚不死矣世復有守法者矣于是相賀曰趙使君一治泰州而法為之平使天下皆如趙使君則人有冤死者乎趙使君真長者昔漢張釋之為廷尉其言曰法者天子所與天下公共者也故在漢獨釋之號守法不阿意天下至今稱之今公召歸禁林人且望公顯用如張廷尉廷尉天下之平也公其尚自愛乎吾聞召伯之教明于南國既去而人思之其詩曰蔽芾甘棠勿翦勿伐召伯所苃今既望公為張廷尉又愛公如召伯何哉蓋多公守法不止于活一無罪䴚而吾愛公則因䴚而重有所感也然則咏歌之彂乎情者其可巳乎是不可無以序作者之意于是乎書送金西白上人逰方序吳僧金西白上人幼為天台氏之學既研精祕義又紬繹孔氏百家之書間弄翰為文章從容識軌轍及沉吟六義漱滌萬類于煙雲水月間復鏘應金石妙􅍱風旨今年秋將鼓柂松陵振錫天笁絶濤江訪靈越過四明因度石橋探鴈蕩迤邐至金華求大比丘究其所謂出世間法顧母氏年邁無他兄弟備飬霜露載塗欲行復止母氏察知其衷則為之言曰吾聞親者遺體之所自出也佛者慧命之所由存也奉遺體以續慧命顧惟輕重所在汝尚勿以吾私愛眷眷為也上人于是問津于江上丈人斂裳于邁若矢斯激搢紳之老章甫之英自鄭有道而下爭為詩文追貺之天台陳基復進而執上人之手語之曰浮屠氏其道有三曰律曰教曰禪然皆以慈悲為宗孝敬為本上人先究上乘後趨禪觀冝其曲意顧飬雅好懿德在其法中可謂學知次苐由相入空者矣世之號居名教者往往于佛氏之言怪駭舛􅊇及退而察之則所行有愧于上人者多矣故豫于上人之去就不能無所感也雖然昔有浮屠師嘗躬織蒲為屨鬻以飬毋其徒至今髙之歲云暮矣白雲斯邈上人尚無忘織屨師翩翩其來歸哉至正十年八月甲辰序浮青閣詩序越以山水名天下雲門又盡得越山水之勝而浮青之閣在焉蓋自晉唐歷宋以來桑門上首之居雲門者皆統合儒釋妙攝空有樂與賢士大夫逰故其崇臺廣厦金碧相錯緣崖架壑挾雲月而臨風雨如千峯閣者往往而在尚可想見異時登覽吟嘯之適遺音逸響猶隱隱林谷中斯閣之作于時雖有不同然自吳興趙公耴眀教大師嵩公之語為為書之扁蜀郡虞公為文以記之賦詩以倡之繼而作者皆一時知名之士于是所謂浮青者遂與前代之名蹤偉迹競爽千載可謂盛矣且秦望拔起羣山四從髙卑俯仰之狀窮竒極秀于千岩萬壑之表每雨止風收天澄日鮮而浮青之勝丹青意匠所不能倣佛者唯詩人得之蓋詩者所以模狀物態陶寫性靈然非天機悟入神觀敻絶搜抉幽閟與造物爭巧者亦何足以語此哉豫嘗從吾鄉鈃石庭上人獲見群公之作爛然如雲錦張鏗然如金石奏雜然如衆籟鳴雖未獲登斯閣固巳飄飄然若薾飛霞陵皓氣而遊乎華嚴毗盧之境顧惟王謝之流風既逺支許之聲塵莫追雖欲復從趙虞二公遊亦不可得徒見其清標雅韻于諸名勝篇翰間重為興感而已上人俾豫序之固辭弗獲乃為書其歎慕之概而歸之上人統合儒釋妙攝空有者也其以豫言為何如至正十年八月丁未序送煜上人序古之為浮屠氏者以戒為墉以惠為户以法界為宇以性海為鄉以度門道品為族屬菩薩大士為戚姻故求其法者不涉內外不泥中間不以語言不以文字必心空諸漏法同夢幻無得無證然後謂之解脫豫嘗竊觀自摩訶迦葉以佛所付心法相授受而逹摩以天竺名王子獨得其宗當梁武甘心佛氏人莫不以其造寺書經度僧為奉佛之至時逹摩甫至東土獨毅然以其諸所有為特人天小果實無㓛德得其傳者有五曰可曰璨曰信曰忍曰能而能不出族姓不居華夏奮起井臼之中而得佛衣于五祖忍焉及其説法曺溪大闡宗旨為天人師唐武后仄席嚮風敕書徴諭力辝不赴其視榮名為何如耶夫以逹摩屣棄王官印契佛心能以匹夫頓超佛處一則面譏梁武而空學顯一則身辭武后而宗風振卒使百世之下學佛者必以曺溪為津梁嗚呼盛哉後世為浮屠氏者以權勢為墉以苞苴為戶以金碧為宇以貴富為鄉尚言語者以歌罵佛祖為能攻文字者以嘯弄雲月為事甚至弊弊焉奔赱于利害得喪之塗而不知止使度門道品菩薩大士如果有知將怒而咎之之不暇尚肻俯而以族屬戚姻接之耶吾鄉煜上人弱歲出家學其學于湖之道埸志甚鋭及主藏鑰于杭之淨慈遂為其徒所推且善讀唐人詩時有所作粲然可觀今年秋過豫吳門與之語亹亹終曰豫既嘉其逺去鄉邑無父兄師友而能卓然自立如此又懼其久而或流于令之所謂浮屠氏者故推原其祖以瀆告之蓋以吾同鄉而私于上人也然世豈無大比丘如曺溪者上人試以吾言質之其以為然否乎陸仲淵字序中吳多舊族其子孫克世積善之澤如甫里陸氏者代不乏人余所與逰者曰仲淵其少也嘗及見吳興趙魏公公為大書仲淵二字間以示余且曰願為之序蓋仲淵名源源者水之夲而淵者水之深也天下之水其源皆出于西北其流皆趨于東南然西北之水莫大于江河而東南之水莫深于海方其濫觴于昆崘經始出于岷山也蓋可以徒􅍱及其衝底柱下龍門絶巴梁轉巫峽率百川以委輸于海然後浟湙瀰漫浺瀜滉漾朝夕汐與時消息暑不加盈寒不加縮天吳魍象介鯨水兕之屬朋從醜附竒詭變怪莫之端倪其有夲者若是乎人之于積善也亦然孝弟以導之忠順以浚恭儉以將之醇謹以持之積之以久彂之以漸紆餘衍迤更數十百年而子孫猶襲衣冠躬禮讓浸淫乎忠厚之波涵泳乎深淳之涯窮力質行有長者風吁善之足以慿藉也如是夫仲淵之名若字其殆知夲也吾聞仲淵上世皆享髙壽而仲淵年垂六十齒髮不少衰其所謂孝弟忠順恭儉醇謹蓋出于天性引而勿替殆將如河之衝底柱江之轉巫峽其勢必委輸于海而後已也傳曰三王祭川先河而後海或源也或委也此之謂務夲為其後者使益勉焉則甫里之澤其未艾乎庸不辝而為之序徐公逺字序吳郡徐君孟逹命其子緬從余遊緬𥘉名勉以與蕭梁時宰相東海徐勉同名乃易為勔而宋幸臣朱勔雖非同姓而同郡又易為緬蓋其字公逺而緬之為言逺也于是皆以為冝且請余序其説吾聞司馬長卿慕藺相如之為人更名相如後世無或非之者蓋異姓而賢于禮無所嫌也徐修仁顯梁氏而勵志慎行事君不阿意苟合身都宰輔為時宗臣而以清白遺其後其視朱勔起賤微徒以草木怪石媚人主鬻恩毁法以固寵者萬萬不侔矣是故易勉為勔者尊同姓也易勔為緬者别邪人也昔之同姓也尚知尊而避其名則其于親親可知矣昔之邪人也尚知别而嫌其名則其于自修可知矣尊同姓仁也别邪人知也惟仁也而後公無私惟知也而後眀而逺彼知能使後世不敢名其名與夫不屑其名以為名者仁與不仁知與不知而已矣緬乎其尚𢡟之贈葛孟顒序會稽王仲麟氏讀法家書為吳屬曺史嘗有疾求醫于吳郡葛氏于是孟顒為診脈曰是謂內傷得之出入飲食哀樂以藥治之而愈仲麟多其為乃徵文于余曰詩云無言不讎無德不報幸吾子圖之乃為之言曰吾聞葛氏雖以醫名家而其上世夲儒者人無貴賤賢愚皆敬而稱之曰可久者孟顒之父也可久甫誦詩書百家之言為文章竒偉博辨而卒歸之于六藝然為醫視古人無愧也孟顒以家庭習聞之素出而起人之疾又復有父風何葛氏之多賢也哉昔者秦和論疾推本五色五味五聲必原于天其説與周禮合鄭子産博物君子也而論莭宣之道又默與和契吁醫豈易言哉故必通詩書六藝百家之言如可久甫者而後可也然漢臨災人陽慶不以禁方傳其子孫而悉豫太倉長淳于意今葛氏儒者而父子身方相授受而孟顒起人之疾蓋不止于仲麟就吾所知而言則葛氏之賢豈不信哉余愧非博物君子願聞秦和之説與周禮合者而孟顒父子豈余斳哉姑因仲麟之請而為之序夷白齋藁卷之十四
