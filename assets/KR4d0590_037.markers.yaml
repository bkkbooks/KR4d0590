  - {type: variant, offset: 3, length: 0, content: '', WYG: 某辱知君特厚義當銘其壙銘曰維孟達父世吳人有才弗施善其身托人遺孤力千鈞之死無怍勒貞珉有孔勿替在後昆夷白齋稿巻三十五欽定四庫全書夷白齋稿外集巻上元陳}
