  - {type: variant, offset: 138, length: 0, content: '', WYG: 陳君五十頭未白邂逅都門始相識陸乗車馬水棹舟跋涉山川共南適苦甘飢飽朝夕同語黙寢興情性通萬里相將彌兩月君住西江我浙東况我與君同姓氏長者稱兄少為弟舟中不必分楚越席上惟應敘年齒君言我鄉風俗淳義門亦有同宗人祖孫共居已九世伯仲相親如一身男耕女織嵗復嵗不減昔日張公藝一牢犬食毎相呼仁信真能馴異類我聞此語喜不忘把酒酌君謌忼慷平生亦有敦睦志心實念之身未遑此日與君言復别君向潯陽我歸浙一尊何處又相逢回首關山見明月}
