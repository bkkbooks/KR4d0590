  - {type: variant, offset: 122, length: 0, content: '', WYG: 西游復入河東路複巚重岡愁屢度崎嶇五里不到河忽雷椎山雨如注須叟百水爭怒流澒洞有若龍騰湫熊羆遁藏虎豹伏魑魅亂呌狐狸愁我馬一步一回首陰風吹人股為慄破㡌籠頭衣露肘疾呼東來皓首翁問勞慰我心忡忡相延入谷已暝黑下馬共栖營窟中不知今夕復何夕俯仰人間長太息勞生何苦為形役歸有衡門可容滕}
