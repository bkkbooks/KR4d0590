  - {type: variant, offset: 23, length: 0, content: '', WYG: 我樵于山我負于路讀書自娛匪鼂伊暮靡咈爾心重失我度我印既纍我綬斯若爾毋我尤我不爾怍彼美宋女亦遼以邈}
