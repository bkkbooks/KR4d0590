  - {type: variant, offset: 84, length: 0, content: '', WYG: 憶昔至正初北遊客京師辱交伯仲間日夕相追隨磊落青雲器聨翩丹鳯姿愧無高山調酬君白雪詞俛仰八九載南歸滄海涯竊聞霜臺上風猷夙綱維允矣伯氏賢克當明主知仲氏貳安陸重為人所推中朝名公後復始非君誰前年復至京伯也官于磁治州如室家拊民若嬰兒靈草毓三秀瑞麥生兩岐伯也置不言獨咏豐年詩凜凜君子風不啻先公為政成報天子寵錫多光輝人言古循吏龔黃邈難追孰知忠厚化昔聞今見之仲也復為邑鄆城鬱巍巍朝廷重守宰簡書有程期一門雙南金共下白玉墀又如兩騏驥為主効驅馳河水昔橫溢生人四流移乗間為冦攘觸罪姦有司坐論齊魯俗化為蠻與夷今君寄民社所念當在兹願試父兄術為民瘳瘡痍君服亦已華君佩何陸離朝發江之滸暮宿河之湄行當見伯氏為我道暌違}
