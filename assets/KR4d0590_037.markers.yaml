  - {type: line-break, offset: 0, content: '', id: KR4d0590_SBCK_037-1a01}
  - {type: variant, offset: 0, length: 0, content: '', WYG: 祭故平章榮禄張公文嗚呼謂天無為而生公耶則公之器量超乎等夷謂天有為而生公耶則公之事業不宜僅止于斯夫力足以任天下之重而明足以燭事理之㣲竒謀足以坐制千里之敵而英畧足以立决兩陣之機謙讓足以延攬四方之俊而威武足以雄驅百勝之師恩信足以得三軍之死力而仁義足以極萬姓之顛危而天不愸遺痛罹此極使千尋之木弗能扶大厦之傾萬斛之舟弗克濟蒼生之溺此天道之所以不可必而君子之所以長吁而太息鸞鳯豈不祥于梟獍麒麟豈不仁于虎狼蛟龍豈不神于螻蟻莨莠豈足侔于稻粱今妖鳥得以賊祥禽醜􅖈得以辱仁類蠕動得以凌介族之長惡草得以為佳禾之害豈天未厭亂而仁者不必夀耶抑民之無禄而淪胥以死者不必救耶何公之不幸一至于此而蒼蒼彼天竟孰尸其咎耶然公能以貴下賤而不肯屈身以從賊能以仁伐不仁而不能臨難而辱國能厲聲罵賊而不能與之俱生能視死如歸而不能食不義之食盖公之生也民有父母君有股肱公之死也豪杰失倚賴君子失依憑獨忠肝義膽通神明而貫金石英聲盛烈掀宇宙而震雷霆上可以爭光于日月下可以垂休于汗青此所謂沒而不朽者在公可以無憾矣然復讐之義不舉則終天之恨不平四郊之冦壘不除則九泉之目不瞑某等之所以痛哭流涕而不能自已者以首見招于麾下繼辱荐于朝廷義雖均于僚佐恩難忘于死身既不能漆身吞炭報知于國士又不能奮椎操匕効死于賊庭惟鞠躬盡瘁恪勤于王事夙興夜寐勉强以力行臨風一奠上以為軍國慟而下以哭吾軰之情祭沃哷亷使文嗚呼哀哉公止斯耶豈天惡正直神好詭隨耶讜言無避者恒不利于世而秉心忠亮者不必期頤耶將蒼蒼不足問而吉凶禍福初莫知其所尸耶公之剛腸嫉惡得于天者獨厚及以言得罪戾于人者又何其顛且危耶如使正色以立朝明目而張膽則英風偉節夫豈補其缺而拾其遺耶及權倖悞國是非乃明而天不假年果孰嗇其施耶豈謇謇匪躬者道不昌皎皎不汚者數必竒耶凡有識之士莫不聞風而扼腕况某也辱知于公又特殊于等夷耶托交二十餘年契濶三千餘里始終疏逖如一朝夕豈非生同年學同業而道同師耶持節南來庶幾相見以慰饑渴又豈非以一葦可杭在浙水之東西耶豈期一疾不起遽罹此痛而終天永訣孰謂魂氣無所不之耶夫忠義足以正風紀氣節足以厲亷隅此所謂没而不朽者將百世以為期耶顧親老子㓜而琴亡人逝質之天道則仁者有後固不可得而欺耶某也義當匍匐撫棺就次以哭知已之私念竊忝王官駿奔戎旅所不能自致者死者豈必無知耶銜哀致誠徃申一奠天乎痛哉孰使涕泣之漣洏耶尚饗原闕}
