  - {type: indent, offset: 41, content: 　　　　, id: KR4d0590_krp_037-bkkind17}
  - {type: variant, offset: 41, length: 1, content: 献, WYG: 迢迢去京國行行適任丘城郭何蕭條關山良阻修日入就逆旅燈火稍綢繆薄酒不堪飲何以消我憂㝠㝠天際鴻沈沈波上鷗往者固莫追來者當自謀獻}
  - {type: substitution, offset: 41, original: 献, replacement: 獻, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-17562}}
