  - {type: variant, offset: 113, length: 0, content: '', WYG: 秋山遙遙秋水濶秋風冉冉生蘋末夕陽逺樹集歸鴉慘淡人家帶林樾我聞趙家父子工丹青劃然見此心目俱開明人間何處有此境無乃瀟湘與洞庭白波青嶂天冥冥熟視彷彿聞秋聲依微曙色生浦漵又似滄浪歌濯纓東吳陸君好竒古何從得此歸囊楮我亦從此時一覩為君題詩三太息良工良工心獨苦}
