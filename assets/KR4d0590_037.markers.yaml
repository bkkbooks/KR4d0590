  - {type: variant, offset: 49, length: 1, content: 榖, WYG: 客行荏平道日出天皎皎泰山何巖巖雲開豁穹昊生逢全盛世悲歌入燕趙跋踄雖辛苦愛此風日好關河路緜緜江湖雲渺渺嘆息梁父吟慷慨令人老穀}
  - {type: 'kr:newline', offset: 52, content: '

      ', id: KR4d0590_krp_037-bkkkrnewl17}
  - {type: line-break, offset: 52, content: '', id: KR4d0590_SBCK_037-1b05}
  - {type: indent, offset: 52, content: 　　　　, id: KR4d0590_krp_037-bkkind22}
  - {type: variant, offset: 52, length: 0, content: '', WYG: 晨興發東阿薄暮抵穀城黃石去已久兹山尚崢嶸伊昔秦漢時豪杰紛縱橫卓哉張留侯視秦如孩嬰奮椎博浪沙賁育莫敢爭顧獨奉公履俛焉若諸生授書何必多恍惚通神明卒為帝者師功成業顯榮飄飄逺遊子天寒獨遐征徘徊撫松柏俛仰有餘情}
