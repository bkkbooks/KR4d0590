  - {type: variant, offset: 43, length: 0, content: '', WYG: 驅車官道旁四野積陰沍中路忽改轍前行屢回顧遙瞻獻州城未至日已暮﨑嶇丘隴間足趼不容錯須臾近烟火謂可􅇺情慮不覩主人面反遭邑犬怒僕夫亦已疲黽勉羞草具飢來罄一飡已飽復何慕}
