  - {type: variant, offset: 126, length: 0, content: '', WYG: 有序禄命有書尚矣唐太常博士嘗刋定而敘之然論長平坑卒南陽貴士則深斥其三刑六合之非至昌黎韓子於李虚中則盛稱其以人始生年月所值日辰推其貴賤壽夭百不失一然則果何如哉蓋博士之論夫子罕言命之意也韓子之說則不知命無以為君子之意也然五行之變化支干之相生相尅孰為勝衰孰為休咎茍能精之則其理有足徴者雖所罕言而亦詎可不知也哉松陵黃瑞卿以禄命之術游江湖間予既贈之以}
