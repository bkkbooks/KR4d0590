  - {type: variant, offset: 3, length: 2, content: 藁外, WYG: 稿拾遺徐君孟達壙銘吳人徐君孟達諱元震世居嘗熟之虞山考諱敬益陽知州妣虞氏封東海郡君初益陽府君之官于朝也君以俊乂游成均為博士弟子員精敏瑋琦最為府君所鍾愛故徽州路儒學教授甫里陸公徳元時客京師見而竒之元統初府君出知明之昌國州需次里中君以佳子弟周旋府君左右進止不凡教授見而喜曰此子真千里駒也吾屬意乆矣遂納以為婿陸氏家素淳儉教授公尤慎重務以詩書承家君既入贅事教授公如事府君克意承順委曲偹至且以時節省府君於昌國尋丁郡君之憂哀毁盡禮居久之教授公捐舘君獨以身任遺孤之責保抱扶持俾娶且有子而陸氏之業因賴以弗墜人謂教授公有後君之力也及府君以疾終益陽扶柩歸塟常熟之先隴親朋送者雲}
  - {type: page-break, offset: 3, content: '', id: KR4d0590_WYG_035-5b, image: WYG1222/WYG1222-0355b.png}
  - {type: variant, offset: 6, length: 2, content: 目錄, WYG: 凡塟祭百需視禮所得為哀禮兼盡君俶儻有卓識雅重然諾樂應人之急遇事立决機警絶人而以仁厚將之雖委身閭里不屑仕進而英風駿望卓然于縉紳公卿間與人交不以疏數為厚薄臨財不茍惟義之所在方營别業于松江笠澤之上聚書教子歲時伏臘幸麤有餘將與所知優游以卒歲不幸一疾不起以至正十五年七月七日卒于家得年四十有七妻名仲端有婦徳子男二人長曰緬果毅好學次曰朂㓜而克肖女一人適同郡曺元越七日丁酉緬朂奉柩塟于吳縣靈岩鄉陳灣東横山之原嗚呼君托人之孤周人之急刻身砥行始終無怍而天不假年夀不稱徳此君子所以哭之慟也}
  - {type: page-break, offset: 6, content: '', id: KR4d0590_WYG_035-6a, image: WYG1222/WYG1222-0355c.png}
