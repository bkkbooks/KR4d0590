  - {type: indent, offset: 47, content: 　　　　, id: KR4d0590_krp_037-bkkind20}
  - {type: variant, offset: 47, length: 0, content: '', WYG: 曉出凌州南晝行泥淖中一步一踟蹰四顧心忡忡牽車誰氏子自言業為農頻嵗值大水田廬為之空家有白髪親日食憂不充辛苦事商旅庶以供饔飱維人生兩間所貴親愛鍾貧賤茍知養奚必禄位豐丈夫畏天命敢不哀人窮生世苦不偶何由恤瘝痌}
