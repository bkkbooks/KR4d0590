  - {type: indent, offset: 37, content: 　　　　, id: KR4d0590_krp_037-bkkind15}
  - {type: variant, offset: 37, length: 0, content: '', WYG: 結髪事書史及壯服冠裳逺遊至京師永言觀國光叨逢堯舜時拔擢登明堂佩以明月珠被之雲錦章驅車未及門平地生太行丈夫慕前修出處豈有常但念平生友惜别衢路旁惟願各努力矯首永相望}
  - {type: page-break, offset: 37, content: '', id: KR4d0590_WYG_036-2b, image: WYG1222/WYG1222-0357b.png}
  - {type: 'kr:newline', offset: 39, content: '

      ', id: KR4d0590_krp_037-bkkkrnewl10}
  - {type: line-break, offset: 39, content: '', id: KR4d0590_SBCK_037-1a11}
  - {type: indent, offset: 39, content: 　　　　, id: KR4d0590_krp_037-bkkind16}
  - {type: variant, offset: 39, length: 0, content: '', WYG: 仲冬過漁陽風日正凄厲嗟此豪俠窟自古稱壯麗煌煌神堯業起自艱難際奈何至中葉四海皆鼎沸良由開元主養虎以自噬惜哉曲江公忠言亦何濟居人一何幸屬此承平世畊牧畿甸門聖澤湛汪濊連山接神皋旭日生爽氣獨憐去國人南北從此逝}
  - {type: page-break, offset: 39, content: '', id: KR4d0590_WYG_036-3a, image: WYG1222/WYG1222-0357c.png}
