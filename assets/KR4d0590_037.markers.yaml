  - {type: variant, offset: 61, length: 1, content: 益, WYG: 一昨始入舟遙望徐州郭水行已信宿甫至城下泊洪濤激長空驚風怒相薄乾坤無端倪雲水互叅錯初疑鯨鯢鬭復恐蛟鼉躍篙師為蒼茫客子俱駭愕傷哉楚君臣霸圖已寂寞空餘蘇公樓突兀倚寥廓徐人昔恃公安若山與岳文章與元氣萬古相磅礴大河失故道崩奔勢逾虐生人化魚鼈中州廢耕鑿安得不世才為君拯民瘼九原何茫茫可愛不可作蓋}
