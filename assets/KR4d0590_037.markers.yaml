  - {type: variant, offset: 34, length: 1, content: 彂, WYG: 居生來不出户只學繡羅繻父母偏愛惜無異掌中珠十八許隣里二十㑹葭莩低頭奉箕帚和顔事舅姑誰知輕薄壻零落在中途結髪願偕老寧不共馳驅昔有梁上燕托身君子廬今如水上萍飄泊任江湖自嗟妾命薄忍死亦須臾生女為人婦願嫁得其夫嫁夫一失所不如棄路隅春日江上海宇屬清晏乾坤大無垠憑高馳遐觀臨流滌煩塵雲日湛初霽山水蕩餘春陽徳舒桑和品彚競妍新矯矯雲端翮洋洋藻中鱗感彼翔泳適悟茲涵煦均良時不再得芳年難重臻願言乗清颷邈哉霄漢津發}
  - {type: page-break, offset: 34, content: '', id: KR4d0590_WYG_036-2a, image: WYG1222/WYG1222-0357a.png}
