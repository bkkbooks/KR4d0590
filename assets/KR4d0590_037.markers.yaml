  - {type: variant, offset: 45, length: 1, content: 凌, SBCK: 􅇒}
  - {type: variant, offset: 45, length: 0, content: '', WYG: 憶昔日下歸已甘棲遯跡胡為負初志三嵗四行役我馬不及秣我僕不遑息荏苒嵗月暮展轉憂患迫朝行過阜城原野霜露白一身如鴻毛苦厭天地窄}
  - {type: 'kr:newline', offset: 47, content: '

