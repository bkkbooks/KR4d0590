  - {type: variant, offset: 0, length: 4134, content: 夷白齋藁目錄臨海陳基著金華戴良編卷之一賦别知賦送王子充蟬賦樂府白鴈操鴻鵠操崇丘寄倪元鎮山髙寄陸玄素春草辭為延陵華彦清作鴈孤飛為徐夫人作慈烏曲為仲說作黄雀行鷄鳬行白頭公辭刈草行新城行見月行裁衣曲征夫歎征婦怨邉城曲卷之二古詩四言九月夀沈毋也西村之墅羙徳方甫也古詩五言秋懐七首讀國語二首詠史三首懐羙人次韻荅友人待王子充不至夏日喜友見訪投贈同志次韻吕彦真分省與同幕諸君小集梅南書隐為上虞俞氏賦夏日齋居用蔡都事彦文韵分省早集懐錢貟外蔡都事湯管勾樓居彦文點兵餘杭冨陽新城道上賦詩見示因次韵四首分署望鳯凰山次韵彦文古詩三首西齋對雨池上對菊送卲同知分韵得来字次韻沈仲説荅蔣子中遺山水便面詩卷之三古詩五言發吳門大江狼山通州如臯縣海安爛泥洪泰州上樂令丁鎮務子角髙郵寳應縣述老嫗語淮安九日從陳醫師所寓得甘井課童子分汲傷菊卷之四古詩五言公退述懐成夫脩所居屋成赱筆戯贈次韻荅趙本初海安過牐得風出爛泥洪聽歌水調有感翠雨亭下塘道中謝村塘西東阡南潯荷葉浦中塘道中鳯口東塘大麻􅊶家堰上塘道中尹山吳江垂虹橋平望嘉禾石門崇徳長安題蘇昌齡西澗詩意圖啚乃黄子乆所畫子乆自識云華陽逋客作題黄侍講所著王友樵先生墓銘後卷之五古詩七言椘州舊将謌東臯隠者詩為范思賢作次韻玉山倡和詩次韻垂虹橋泊舟倡和分題賦得太湖送鄭同夫送毛生歸越織錦篇青絲絡馬頭送李彦章送李景先録判送譲還吳謝從義叅軍自亰師還言中書危叅政見問且訝無書囙述詩寄謝孟冬觀淮水鄭遂昌以趙魏公所題髙尚書畫遺沈東林要予賦詩題五王㳺春圖題馬都事夀椿堂卷之六古詩雜言沈孝子行送醫師沈伯新煑雪窩為玉山作我今有所思寄于山人空明山人謌烏夜啼引玊笙引律詩五言興福院㑹秦文仲文學古二首送謝叅軍次韻荅髙元善送鎦治中癸丣二月十二日常熟阻雨寄吳門分省同官琴川懐古十六日開􅊑值北風大作復泊北門二十一日渡江三塔寺訪寛老訪夲覺欲長老不遇時欲公在南堂退居㽞别仲銘二首送姪譲從軍武安二首卷之七律詩七言秋日雑興五首寄沈仲説二首次韻金上人見詒寄家兄敬徳次韻吕彦貞西園同㳺歸燕用秋日雜興作㳺仙詩五首寄玊山次韻鄭遂昌奉謁范魏公祠白芙蓉次韻錢伯行白芙蓉婁江即事二首次韻仲說喜陳叔方過東林隐居二首次韵鄭遂昌喜雪二首簡白野監司送曺宗爰次韻懐彦成次韻待琦上人不至次韻懐玉山陸氏别業寄仲說寄玉山二首水木清華亭小酌仲說㽞陳公原余往訪之㽞宿陳公原題陳公原仲說所居壁卷之八律詩七言次韻鄭有道喜王季野府判南歸二首次韻伯行投贈存齋三用韻喜季野歸寄季野次韻劉徳方經歴送徐勉之慈湖書院山長送錢士能建昌知州送王夀翁歸閩次韵荅文仲二首婁江雜詩二首與文學古秦文仲㳺至正觀次韵荅文仲郭羲仲聮句見寄次韵錢都事誠夫海上書事送誠夫使吴門督漕事兼寄分院同幕諸公春日邵氏園池送胡宣使赴都進表送髙𧺫文歸越兼簡陳伯昻王彦強二首寄楊文舉經厯寄頋仲贄次韵謝捴管送梅州判還崐山次韻謝侯寄梅州判次韻謝侯書懐十一月晦與同幙諸公登南髙峰因過湖上小集賦詩二首正月五日省院諸公飲吴南城泊舟垂虹橋訪南北兩山寺候蔡都彦文次韻彦文寄謝省院諸公二首次韻孟天偉郎中看潮十首卷之九律詩七言次韻髙元善郎中見寄律詩二首元善嘗俾予記其所居松雲巢繼辱以詩為謝囙次韵荅之舟中讀漢武帝紀次韻葉徳新江上觀兵三塔寺過夲覺寺懐欲了庵長老寄頋髙士寄鄭明徳過三塔灣㽞題再用韻荅鄭先生用韵荅沈仲說寄錢誠夫貟外寄蔡彦文都事九日九日簡同幙諸公兼寄吳中兄弟阻風仲舉舟中小酌墻角種菊三四夲頗可觀淮隂雜詩五首寄吳中分幙諸同志寒菊遍開可喜寄唐伯剛㫁事官寄陳庶子叅軍兼簡饒介之郎中寄謝從義叅軍兼簡唐伯剛㫁事寄周信夫王叔明二長史寄錢伯行檢校葉徳新長史寄沈逹卿陳子方二理問和周太常貢祕卿詩五首卷之十律詩七言送彌陁保丗衡聞人徳機二觧元赴省試送丁太𥘉嘉徳常二貢士赴省試送牛述善郎中還朝自淮安使江南舟次通州寄同幙諸公首由通州渡江福山港口待潮癸丣二月十一日官軍彂吳門二十日福山港寄省院諸友舟中看虞山有感二十二日狼山口觀兵逰狼山寺三首狼山港寄淮安分省同官寄朱佑之經歴寄張長年都事二十六日自通州赴淮安寄夏仲信太守韓璧翁經歴姚伯升照磨髙郵湖夜行天明過寳應二十九日至淮安城南十五里述懐到南鎮寄分省同官三月十五日由淮安使江南别同官三月二十五日由吳門使杭閏三月四日夏仲信太守邀㳺飛来峯和頋子經照磨韻二首分省諸公邀西湖宴集閏三月七日過三塔寺㽞别寛老閏三月七日泊舟三塔寺新仲銘長老岀城相看吴江𥘉八日阻風宿吳江無礙寺西寺送信元長老還吳興楊墳寺次韻謝元懿移居見寄二首卷之十一長律送頋用之知階州送謝叅軍十八韵安童右丞挽詩郜同知挽詩聮句至正十一年正月一日遂昌鄭元祐龍門僧良琦臨海陳基聮句送匡廬道士于彦成歸越兼簡蕭靖復盧益倄絶句髙郵湖次韻吳江道中次韻臨平道中題柯愽士畫竹題宋陵梅竹圖題摩癢馬圖題寒林讀書圖題畫馬圖題倪元鎮畫次韻劉徳方經歴次韻送彦成玉山二首戯和玉山韻二首東林蘭若題