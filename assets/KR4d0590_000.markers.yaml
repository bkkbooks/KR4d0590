重之歟良扵先生之文讀之累月曽莫有所去取扵其間雖片言半簡咸附而錄之者所以眀先生扵一字畫之徽皆可為斯世之貴重也先生為人温良慈恵其從政寛易愛人與人交扵㤙意最篤雖遇臧獲亦未甞有遽色疾言平居盖雍雍如也若先生豈所謂有徳有言者耶夫誦其詩讀其書不知其人可乎故扵序先生之文而併及其大要可紀者如此先生名基字敬初夷白齋乃自其號也故以題其藁云至正二十四秊歲在甲辰夏五朔同門生金華戴良書夷白齋藁目錄卷终, WYG: ''}
