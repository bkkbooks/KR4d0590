  - {type: variant, offset: 2647, length: 0, content: '', WYG: 欽定四庫全書夷白齋稿巻十七元陳基撰序顧生文字説序吳下縛筆生曰顧輔字友文其紥筆視近世吳興諸名家不多讓間請予説其字而序之其名若字盖本乎魯曽子所謂以文㑹友以友輔仁之言也曽子之言尚矣余且就生之業而為之説可乎昔之善言書者盖以刀弰喻筆焉故揚子雲曰刀不利筆不銛而獨加諸砥信乎刀不利雖有桓公之慈文王之琢太公之闕闔閭之干將莫耶不克以剸秋蓬剪腐卉尚奚取其斷犀象屠蛟龍而鋒不剉乎筆不銛則雖文犀之植象齒之管秋兎之毫豐狐之腋縁飾亦云侈矣以之為書則偃仰乖方向背失體縱横牽掣舉不適人意而書之道幾息矣然則砥削者固輔刀笔之美器也士之為士也亦然不博之以文則學不能殖不輔之以友則徳無從立故詩曰朋友攸攝攝以威儀孔子曰朋友切切偲偲揚子曰朋以磨之友也者其為士之砥削乎甚矣哉生之業克稱乎其字也是故非學不足以為士非友不足以立徳非言不足以埀世非筆所傳則不博而筆也者又士之所以羽之翼之左之右之以圗不朽者也噫生也不徒名其名將思所以行其行不徒字其字將思所以事其事不徒藝其藝將思所以試其試吾聞之有為者亦若是生之業既切於士之用生之字復切於士之學余且以是為生勉世之樂與為善者得無以為過乎昔庖丁好道而進乎技今生之業非直解牛者比也又庸知其非好道者然則予勉之也非過也李僉事政績序至正十二年春朝鮮李公仲善以浙西道廉訪僉事分憲吳下督行省兵禦海冦未幾淮右妖孽竊發屠郡邑殺守宰攻䧟湖襄蔓江東西羽書旁午告急無虚日人心洶洶吳為江表大郡界居水陸之衝東濱巨海南控甌粤西連荆楚無髙陵大谷以為之阻東南所賦水土百物吳為特盛倉廩府庫之所儲塒嵗輸京師以供天地神明之祀軍國之需與夫民社之所恃以為重者當務之急宜莫如城而吳城故閎壯周圍四十里舊址頽圮謀繕完之役最巨承平日久民習宴安不可與更始議下衆口交怨公乃集父老而諭之曰國家以熈洽之仁汪濊之澤休養生息爾父兄子弟久矣一旦冠起倉卒淮楚間環地數千里生民塗炭其故何哉城郭廢而兵革不飭也今吾奉天子命軫民生疾苦目惻無城之害而不與爾父兄圗之如事勢叵測噬臍之悔將誰任之吾聞備禦不虞政之善訓也故曰有備無患今吾用爾力新爾城深爾池整飭守具豈惟倉廪府庫是頼爾世世子孫將永利之乃計城丈尺視民產多寡募工分築有差民翕翕然趋事設楨幹審矩度萬杵齊奮殷若雷動公不憚暑暍親出入版築間勞撫士卒以恵濟威以勤率惰巨萬之費非常之功三月而竣公既統有司筮吉告神又具牛酒犒士卒報成事禮也方是時冦入杭繼入湖常燒民廬舎刦庫獄縱四掠熢燧熾甚退猶亡匿山谷間侯曰民不復業邑誰與守即馳至縣招集撫慰而赦其脇從者奉詔㫖也市井無頼勒取民財弗得則誣以賊執送之官侯察知其奸悉放之民用無寃死者尋督兵討捕獲首賊張嗣七等餘党復散入徽饒出沒不常其壤地與衢犬牙相錯開化為衢之咽喉浙東有衢猶門之有户也侯以開化失守則衢存亡未可保乃益募兵分守要害地已而賊復至侯率兵拒戰破之七月侯還至郡分省以冦未平復檄侯追捕八月敗賊於茗坑殺賊百餘首生擒十有二人分省多侯功賞勞有加九月賊勢復盛鼓行過富樓侯督軍民夾擊斬首四百餘獲方普徳一百十九名賊勢乃衰衢得以安邑父兄既刻石紀侯之績復相謂曰侯始通守吳邦屬四方多故首興學校以教吾子弟嵗旱則禱雨祈穀以活我老稚冦至則躬擐甲胄冐矢石出萬死不顧一生以捍衛我井邑侯治郡為賢牧守討賊為良將帥進不貪功退不狥私不虐無辜不專威福折衝果毅而濟之以廉和侯之徳非石不傳盖詩所以美盛徳歌休功而鉦鼓}
