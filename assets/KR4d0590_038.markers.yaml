  - {type: variant, offset: 2232, length: 19167, content: 逰復入河東路複巘重岡愁屢度﨑嶇五里不到河忽雷椎山雨如注湏臾百水争怒流澒洞忽若龍騰湫熊羆遁蔵􅍑豹伏魑魅亂呌狐狸愁我馬在前僕在後我行一步一囬首隂風吹人股為慄破㡌籠頭衣露肘疾呼東来皓首翁問勞慰我心忡忡相延入谷己暝黒下馬共栖營窟中不知今夕復何夕俯仰人間長太息勞生何必為形役歸有衡門且容膝贈黄瑞卿詩并序禄命有書尚矣唐太常博士嘗刋㝎而叙之然論長平坑卒南陽貴士則深黜其三刑六合之非至昌黎韓子扵李虚中則盛稱其以人始生年月所直日辰推其貴賤夀夭百不失一然則果何如㢤盖博士之論夫子罕言命之意也韓子之說則不知命無以為君子之意也然五行之變化支干之相生孰為勝衰孰為休咎苟能精之則其理有足徴者雖所罕言而亦詎可不知也㢤松陵黄瑞卿以祿命之術㳺江湖間予既贈之以詩又推夲其說扵其左其詩曰客有談天姓黄氏沛若銀河瀉秋水五星歴歴方寸間指掌人生䆒終始曽将異術千王公一過兾北凡馬空識人湏識貧賤中豈以世態論窮通九重方貴凌雲賦我獨胡為守環堵便将出䖏問黄生不用長安尋季主潼関河渾渾関崿崿太古己来神禹鑿前車未行後車却去馬一鳴来馬愕自從􅍑視繼龍興周道不復如䂡平至今惟有秦川路千里秋風落葉聲送陳仲寳還江州陳君五十頭未白邂逅都門始相識陸乗車馬水乗船䟦􅍱山川共南適苦甘飢飽朝暮同語黙寝興情性通萬里相将弥兩故郷西㳺我昔驅羊腸披圗萬里心茫茫人生出䖏古莫必憂樂相乗寕有常君不見重耳當年伯業昌險阻艱難曽備嘗文夫有事在四方蓬矢桒弧那可忘連山髙髙上無極仰視青天不盈尺俯覧可以窮九域我疑山靈應上訴帝遣夸娥運神力又疑蓬莱脫左股萬里飛来倚空碧乾坤一色雲冥冥急霰始集雪又零依依度橋者誰子隐隐操舟如送迎萬壑千巖深且窈兩兩相将事幽討若非淮南訪八公㝎是匡廬尋五老意匠經營妙入神披圖爛熳皆天真人間何䖏有此境我欲從之一問津律詩五言八里荘寄呉中兄弟晚泊清淮口臨風一振衣長河吞鉅海平楚沒斜暉未覺鯨波險唯憂羽檄飛故園兄與弟歡樂我多違㝎陶世路仍多患斯人劇倒懸虚移河内粟實苦汶陽田聖主憂民曰諸公奉使年萬方心佀渇雨露尚中天夏夜懐李尚志蟋蟀己在壁煩暑猶未歇離居感時序憂端難㫁絶綠樹含微風明河湛𥘉月念子行末歸徘徊至明發土濠夕憇土壕村主人顔色温子孫供洒掃兄弟具盤飱故國甘棠在名家棣蕚序相傳唯孝悌珎重乆弥敦題閿郷驛用故翰林宋顯夫先生韵二首匹馬秦川道西㳺柰逺何客星秋入斗候舘夜臨河地勢関頭險秋光嶽面多永懐楊太尉清白志難磨為問西来使長安去㡬何檄書飛𤏡道征戍動交河鸚鵡承㤙舊莆萄入貢多平生二鳥賦感慨未能磨函関三首水宿煩津吏山行信舘人度関車躑躅入谷馬逡廵石戴泥中轍風驚塞外塵憂時非肉食華髮為誰新萬里西㳺客歸期趂早鴻澗泉明曉練山果落秋紅鳥度烟嵐外人行泥淖中前途逢驛使立馬問關東稍稍聞人語遲遲進馬蹄雨深分陕路雲隔度関雞間道曽歸壁交情獨戀綈蕭條王伯略惆悵入詩題永昌陵洛水南来近嵩髙北望遥墓無羣木拱山罷百靈朝玉碗人間出金鐙地下銷夕陽扵越路烟草更蕭蕭􅍑牢關匹馬東歸客﨑嶇過􅍑牢地分周鄭險天入宋梁髙俯視泥無轍前驅牽載膏慇懃關下吏相送出城臯江二首澤國長雲雨春山半有無江源𧺫巴蜀地勢控荆吳客舎依鮫舘蠻商雜賈胡眀時方利􅍱吾道未乗桴江漢思神禹乾坤仰帝堯信知滄海大能受百川朝萬國車書廣三吳地利饒獨憐南浦鴈箇箇上雲霄乆雨二首自從甲子雨不見有晴時南國皆雲氣陽臺眇夢思蛟龍争窟宅鳥雀戀藩籬去去扶搖上飛騰有所之乆雨妨農事那堪夜復晨雲浮滄海曰花誤洞庭春行路悲㳺子匡時仰大臣未甘栖遯跡霄漢有通津晴雨後江逾綠春深天尚寒晴光分浦溆曉色變峯巒海内長為客天涯獨倚䦨封書寄鴻鴈聊以報平安金山寺突兀金山寺蕭條古佛居雲堂依水府花雨散空虚方丈諸天外浮屠浩刼餘十年㳺此地今日重躊躇又雨春草碧芸芸春江日易曛鮫人長織杼神女又行雲風水随鷗宿烟沙與鴈分逺逰頭欲白慚愧卓文君安國寺古寺依脩竹春池帶綠蒲世塵無䖏著僧迹與雲孤日暖烏争樹風輕燕引雏乆知方外樂来此一踟蹰㝎陶今日南風正揚帆過㝎陶郊原連薺麦井邑帶波濤衆鳥晴争宿孤舟晚更操裁詩聊自慰不必問香醪晴風雨夜来急波濤今復平路從関下險山向洛中眀歲稔征徭薄時平去就輕愧無封禪䇿聊欲頌河清洛口不學尸郷隐重為宛洛逰波光依岸轉㠶影帶雲収豈有相如賦空餘季子裘青雲有知己意氣若為酬白揚河晚泊白楊河堅冰柰尓何畏途愁落景歸夢隅滄波古渡淮人語商船䠂客謌晨興羞攬鏡白髮近来多崔鎮草草趍崔鎮悠悠憶帝郷星辰依魏闕風土入淮陽逐客行無馬居人飯有魴年華催獻歲歸得拜髙堂次韵荅陸養正之子過從乆情親若輔車衣冠雖混俗詩禮貴承家舟泊松江雨門連笠澤霞十年来往地俯仰一興嗟律詩七言題陸氏别業夹溪揚柳恣欹斜流水春来淺帶沙韋曲桒麻如杜曲魏家池舘接姚家髙低亂舞風前蝶紅白争開而後花安得草堂江上住爛題新句送年華題龍門山圖曽過龍門山下寺畫圖渾佀昔年㳺秋聲夜動千尋木雲氣時騰百文湫魏國祠前烟草綠逺公巖畔石泉流隐君最有登臨趣拄枤相期到上頭至正丁亥四月廿三日允常御史有事扵先塋甫竣事而甘雨作人以為孝感所致皆為賦詩而属予為之倡佳城窈窕白雲中華表前瞻一徑通千載有㓛歸紀信九原無計𧺫文翁龍門春湧桃花浪洛浦秋含麦秀風近日繡衣来拜掃孝思欣至雨𪷟𪷟丁亥歲河南自正月至七月無雨流民相属扵道哭聲滿野不忍聞慟哭秋原何䖏人哭聲直上澈蒼旻謀生不及官倉䑕轉死終為客路塵憔悴㡬家猶貢蜜蒼皇諸硐又争銀綠衣陳事無年少徒尓區區索鬼神阿㜷抱子婦将車骨肉誰甘棄道途使有賈生應慟哭惜無鄭侠為傳圖身抛田里魂俱䘮目㫁関山淚巳枯自咲腐儒難用世謾将餘論擬潜夫興慶池層城佳氣日髙浮花蕚樓臺在上頭鶴駕六盤猶避暑龍池九月未知秋青山排闥當窓見金水飄香入地流麋鹿不收瑶草碧太平㤙澤滿秦州陳㽞人物東都迹已陳行過古邑為逡廵石經毎愛中郎字墊角猶傳䖏士巾曠世逸才名在耳百年眀哲道全身飄零咲我成何事慚愧九原泉下人睢州雪中用允常御史韵隐隐髙城下五更飄飄墜雪細聞聲花開草木春輸巧光粲樓䑓月譲眀太史豫占年糓瑞先農應報歲㓛成誰知萬里関山外親伴觀風使者行徐州日上彭城獨倚樓関河迢水空流不囙躍馬江東去安得歌風沛上逰草帶虞姬亡日淚山餘亞父病時愁如何舞罷鴻門劒不向咸陽一少㽞至日淮隂道上年年至日在庭闈令歲飄零獨未歸雲物不殊郷國異江山雖好故人稀檄飛河隴仍防冦兵振衡陽未觧圍憂國腐儒頭欲白倚䦨無語立斜暉瓜州題江風山月亭結屋髙臨揚子津江風山月坐相親魚龍未啓烟波蟄鴻鴈先驚関塞春有客貢琛来海島何人掛席上峨岷江心五夜鐘聲動喚起扶桒曰一輪送琳上人歸南岳髙人二月歸南岳共向東風折栁枝萬里故山飛錫近一江春水渡杯遲碧雲不賦湯休句班竹應過帝子祠尚恐諸方叅未遍葛洪川上重為期江上客舎曉来江上雨濛𪷟烟火蕭條客舎中風急最憐巢幕燕春寒猶滯寄書鴻紛紛洲渚魚塩聚厯厯東南貢賦通萬里乾坤一覉旅濁醪今夕與誰同江上對雨寄鄭山人蕭蕭風雨動經旬二月江城未見春鴻㕐不傳天末信烟波愁絶渡頭人誰家揚栁啼黄鳥何䖏汀洲采白蘋慚愧江南庾開府暮年詞賦轉清新江邊二月東風鸎喚人踏青逰女滿江濵栁迷楊子津頭路山掩潤州城裏春望㫁碧雲情縹緲謌殘綠水意逡廵無由一向江南去相伴汀洲采白蘋聞道聞道出師湘水頭東南賔主盛才猷勿今下失蒼生望實恐上貽黄屋憂雨裛漢旌休澷濕瘴深蠻硐未全收致身報主男児事莫信平生馬少㳺送人之南江南春水浴飛鳬柳葉半青楊葉踈送客又逄巫峡雨移家莫就武昌魚鷓鴣啼䖏難行路鴻㕐歸時好寄書若過長沙逢賈傳慿君為我問何如江月樓中天樓閣欝嵯峨良夜其如水月何雪浪逺從三峡至露華偏傍九霄多道人宴坐脩禪觀㳺子登臨聽掉謌曽是水晶宫裏客倚䦨来此重婆娑寄了即休長老躭躭浮玉倚滄洲八十髙人在上頭不向終南通捷徑要将砥柱鎮中流世間豈識維摩病方外真從慧逺逰明日怱怱過江去尺書聊以寄綢􅓎五月五日淮隂五月五日淮陰郡半雨半晴城上樓菖蒲汎酒吾無分楊柳繋船君且㽞西日照人生别思南風吹笛帶邊愁眀朝又上洪河去欲采芙蓉不自由舟中束書又入李膺舟共遡黄河最上流自咲乆為吳下客誰期重向洛陽㳺関山雨足天無暑原野風髙麦有秋永夜雲霄看不厭相從還欲問牽牛五月平原百草香泊舟髙㟁己斜陽河流浩蕩来西極山勢逶迤接太行墅老張燈風雨夕商童吹笛水雲涼共憐此地頻来徃把酒髙謌一慨慷河隂蕭條城郭河陰縣泝水乗船佀汎槎峭壁有人居洞穴平川無土種桒麻滿天急雨寒欺客捲地長風夜赱沙囬首太行山下路豈無騏驥困塩車昨夜関河風雨横今朝涼思颯成秋沙頭浪湧千堆雪山頂人牽百丈舟願與王遵同叱馭不随庾亮謾登樓君看平地風波惡積石猶應是稳流虎牢関連山囬抱欝嶔崟百戦英雄不可尋西極河流行地逺中州風氣入関深逢時豈乏㽞侯䇿事主難忘紀信心千載虎牢形勝地慿髙囬首一長吟洛口今朝掇棹清河口却上髙丘望孟津多情芳草佀南國滿目好山如故人文媿陸機還入洛才非范叔澷㳺秦䄂中獨有河清頌莫惜吹嘘上紫宸法王寺白雲相送度髙岡行盡松聲到上方山掩地靈秋寂寂天開嶽色曉蒼蒼石根藥采菖蒲秀林下經翻貝葉香乞取龍溪泉一勺仰崧堂上禮空王崇福宫西風吹老碧天秋𣪚筞尋真䖏䖏㳺太室山前逢􅢳母少姨峯下候浮丘穿林雲逐丹光𧺫出洞泉和藥氣流白髮祠官談往事夕陽西玄水悠悠承天宮四面雲開翡翠屏路随飛鳥入青冥巢由隐去山増秀申甫生時岳降靈露采松花秋作醸風翻蘂笈夜談經何當結屋蒼厓曲手種菖蒲九節青轘轅逺逰重到洛陽城又向登封道上行路入轘轅秋更險雲収太室雨初晴千重灌木澷山碧百道飛泉繞澗鳴欲訪巢由渺何許空餘潁水照人清嵩髙厚徳巍巍鎮土中一元磅礴氣鴻𪷟靈雲作雨秋歸硐列嶂朝真曉暎空利澤四時周品物精英千古㣧貞忠重尋漢武登封䖏御道西風有路通次韻鋼字為拜太古運使賦平生貞義結中膓力剸蛟犀始見鋼水部分曺仍按節尚書入奏擬懐香蹔垂鴻鵠青冥趐不負蒹葭白露霜咫尺星辰催聽履肯教供奉殿西廊次韵酬鄭彦章運使使君擬卜水南居負郭良田二頃餘但使有溪堪種竹不愁無地可蔵書衣冠洛社期諸老祖帳都門憶二踈頭戴角巾収芋栗秋風吾亦愛吾廬東平道上客客東平聽曉鐘出門殘月尚朦朧一輪紅日生滄海萬丈丹霄聳岱宗不為山靈廽俗駕敢從漁父問形容何當結屋岩岩下學種徂徕百尺松濟州蕭蕭僕馬别神州俯仰乾坤一弊裘慷慨不為投筆計飄零空作曳𥚑逰雲飛故國無来鴈冰觧長河有去舟此日山東無李白不妨携酒獨登樓彭城関山歲晚日隂隂獨上彭城思不禁河水東来非禹蹟民風南去雜淮隂英雄己堕陳平計志士長憐亞父心自古人臣難去就悲謌一曲倚嶔崟吕梁扁舟又向吕梁歸浩蕩中流看翠微濁浪滿河冰亂赱黄雲垂地雪交飛奉身誤叱王遵馭渉世頻沾阮籍衣日暮不湏吹短笛沙鷗猶恐未忘機邳州邳州城下片㠶収滿眼山川生古愁人間客子復来此圯上老翁何䖏㳺青冥無路逐黄鵠滄海有波随白鷗浩謌撃檝江南去孰謂赤松非我儔淮陰侯廟慷慨論兵笑沐猴盡将生死付鄼侯手提漢鼎歸真主眼見黄旗出偽㳺此日王孫空故國何年漂母葬荒丘英雄自古多遺恨腸㫁秋風䠂水流過揚子江憶亰師故人一别神亰歲己䦨故人廽首路澷澷淮南羙酒誰同飲江左青山獨自看滿地波濤紅閃日中天樓閣翠生寒吳関入望庭闈近欲問飛仙借羽翰草堂隠君家住玉山阿新築茅堂接薜蘿翡翠飛来春雨歇麝香眠䖏落花多竹枝已聽巴人調桂樹仍聞䠂客謌眀日扁舟入州府不堪離思隔蒼波碧梧翠竹堂玉山窈窕地仙居翠竹叅差間碧梧夜静簾櫳人度曲春深庭院鳯将雏瑶華散席侵棋局瓊露分香落酒壷見說秋来更瀟洒四􅉉虚籟雜笙竽漁荘何䖏林塘好卜隣清江繞屋净無塵㝎巢新燕渾如客汎渚輕鷗不避人揚栁飛花香作雪鱸魚上釣句扵銀春風無限滄浪意欲向汀洲賦采蘋次韻荅陸養正幽居瀟洒傍溪湄雅好惟収魏晋碑千樹好花閑對酒一簾春雨細論詩耽書尓欲師玄晏皷棹吾将學子皮滿地綠陰春寂寂永謌伐木眇予思㽞别錢伯行落花時節下江潯掃榻相延竹滿林盡日雄談驚四座百年髙義重千金掛㠶南浦春風𧺫剪燭西窓夜雨深别後相思隔城市五湖烟樹碧森森㽞别陸養正我愛陸郎才思清新詩落筆使人驚不材􅓎忝為師友髙義多慚若弟兄江上烟波催去鷁雨餘春樹亂啼鸎㝎知眀日空齋裏坐對停雲憶士衡送干子都赴陕州同知公子承家列俊髦尚書奉國著賢勞棠餘分陕千年樹水落洪河萬里濤地勢下窺崤澠固天文西入斗牛髙関東故舊如相問委羽山深學種桃南歸道中作陸乗車水乗舟関河何緜緜波浪復悠悠車行阻雪舟阻冰陸憂豺狼水鯢鯨我生不學馮河術柰何欲與重險争朝辞舟暮騎馬鶺鴒相呼在原野白魚可烹雀可炙諼草羅生滿堂下長律上西臺大夫韓公二十韻昭代推賢佐眀公最絶倫異材鍾海岳間氣毓星辰世濟忠貞羙身膺寵數頻棟梁元有噐社稷豈無臣暫出司天憲遄歸秉國鈞鋒車朝象闕玉漏下鷄晨膚寸雲初𧺫茫洋氣已匀風霜成雨露秋日變陽春出入方周召㓛名邁甫申廟謨惟宻勿王業在經綸近㧞嚢中頴旁羅席上珎但令材並入行見俗還淳葑菲秋仍綠菁莪晚更新髙明誠樂育幽側㑹求伸上客争趋薊鯫生獨過秦朅来瞻泰華直欲小峨岷江漢成漂泊丘園愧隐淪新豐徒有酒亰洛澷多塵五鳯深黄閣三台亞紫宸扶搖難自致搔首望髙旻江亭江水出峨岷江亭俯要津諸侯皆軄貢百粤漫風塵㤙詔傳中使遐方倚外臣出師勞上将入幕冨嘉賔聞道元戎死頻傷義士神三軍冝雪耻百戦莫憂身巫峡長多雨瀟湘己暮春鼎魚何足制奏凱勿逡廵送錢伯舉錄判衢州客舍依慈母多君若弟兄庭闈交㝎省閭巷遁逢迎夜雨敦朋好春風動䆠情金樽深綺席玉漏下層城吏隐當平世㓛曺足令名不徒拓爽氣直欲樹風聲滄海鯤鵬化朝陽鳯鳥鳴明時湏弩力應不負平生絶句題水殿納涼圖白苧衣裳懶自裁手揺羅扇此徘徊水晶宫殿涼風少欲勸君王築露臺戯嬰圖懐抱提携咲語温好花折得帶晴暾后妃别有房中樂冝尓螽斯樂子孫蜀葵花圗水晶宫裏是仙郷新製黄裳怯嫰涼獨倚西風無與語漫将心事訴朝陽題鷄冠花圗綠陰亭下露華晞一色猩紅暎舞衣疑是仙家丹熟後靈鷄服得也能飛桃花翡翠圖落花庭院堕㳺絲春在小桃人未知翡翠飛来成乆立太平風景日遲遲倦繍圖宫門深鎻晝偏長懶把春雲繡作裳恨不将身化胡蝶長随飛絮近君王蓼花雪姑圖紅蓼花開水滿洲西風吹夢捴成秋㗸泥不及三春燕兩兩巢君翡翠樓田横墓一門兄弟王齊中耻與羣臣事沛公五百餘人同日死也勝疋馬向江東中牟客路茫茫曰易晡白沙衰草下飢烏為詢今日中牟令曽有飛蝗入境無𣏌縣杞縣南来麦未青馬蹄無柰曉凌兢問君今日寒多少雨過園林盡木冰竹雀圖兩兩野田雀雄鳴頋其雌青春風日好来哺竹間児序玉山草堂分韻詩序予與玉山隐君别四三年聞其與㑹稽揚銕厓遂昌鄭有道匡廬于鍊師苕溪郯九成吳僧琦元璞曰有詩酒之娱而其更倡迭和之見扵篇什者往往傳誦扵人而予也以汗漫之役遡河洛上嵩華厯関陕北逰而客亰師度居庸計其所䟦􅍱不啻萬餘里方挈挈焉觸寒暑犯霜露之不暇又何由持杯酒濡翰墨詠謌揮灑以厠諸君子之列耶今年孟春予還自北方隐君首以書見拓過草堂爲旬日之㽞扵是銕厓去講春秋扵松江泖澤之上有道隐居吳城天宫里元璞亦歸天平山之龍門而九成則出入漕臺執文牘以理公家之事朝夕與予爲侶者主則隐君客則練師也予竊念三數年来馳驅辛苦幸而来歸而隐君能以水竹琴書相慰藉而諸君子者乃復出䖏不齊不能復如疇昔雅集之盛方俛仰窹歎慨然興懐而豫章熊松雲婁江陸良貴適至隐君乃列綺席設芳爼扵碧梧翠竹間相與投壺雅謌飲酒甚歡且即席賦詩而以碧梧棲老鳯凰枝爲韻予探得老字餘則各有所属詩皆輒成獨松雲子飲酣長嘯上馬馳去得棲字不賦云尊賢堂分韻賦詩序玉山髙士世爲中吳鉅族居崑山界溪之陽其先君子好道家清净之說嘗以所居爲真舘髙士嗣葺之年未及老輒委家事扵其子退治一室環以水竹中蓄琴書圖畫古玩器之属而扁曰尊賢堂逍遥宴䖏意泊如也髙士少負竒才既不屑扵用世及耴黄帝老子之書讀之而奉釋氏不殺生之戒惟謹每遇生辰輒不茹葷不飲酒杜門謝客焚香清坐歲以為常今年孟春予過其䖏適值其謝客之日髙士以予辱有雅故且婣故獲與觀其長㓜登降儀容之盛盖髙士之子仲瑛晉道皆能文而好禮而其孫元臣則又予友于君彦誠之髙弟弟子也相與舉酒称慶禮畢有頃姆抱三歲子奉巵酒跪進髙士前芝蘭玉雪未足以論其秀盖髙士之曽孫也扵是髙士命左右實爼豆潔罍斝相與為文字飲髙士既歡甚而其子若孫班班就序長者舉觥少者𧺫舞髙士亦忘其為尊且老談咲之不足則彂為謳謌至夜分乃巳扵是仲瑛請分韵賦詩以紀其事予竊以為髙士享有五福樂及曽孫頋不為其所得為而乃味道徳之腴樂仁者之静寳之以儉行之以慈而仲瑛昆季又能躬行孝弟以志為養則其度越流俗豈不萬萬㢤囙以洪範所謂夀福康寜攸好徳為韻予得康字既為之詩又為之序云送長洲縣遷家訥縣丞代歸詩序夫襃衣峩冠乗堅䇿肥馳鶩仕䆠之林而有貴夫世之佳公子者盖以其習聞扵家庭者非忠扵其君則孝扵其親也非弟扵其長則信扵其友也其周旋扵朝夕則威儀之度進退之容射御之文應對之節又皆可以涖官而臨民之人也使之出而從改殆猶駕熟路之車騁康衢之駿而予也又扵長洲丞西夏遷嘉訥君見之盖君之上世鳴玉紆組垂休邁烈代不乏人而君用其先大夫之澤效官倉庾而来也始則人敬之終則人愛之去則人思之胡為其能尓㢤盖長洲為邑麗扵大府賦夥而訟煩丞之為職所以貳令位髙而勢偪前人之䖏扵是者鮮不以難而君也佐煩夥之邑不急以盩民不緩以敗事居勢偪之位不嫚以長傲不阿以耴辱三年之間不強民以敬而民敬不徼民以愛而民愛不要民以思而民思嘻善之足以動物也若是乎君頋不以習聞扵家庭者為已足周旋扵朝夕者為已至而諰諰焉若将益充其所以孝所以忠與夫弟且信者盖将以雲漢為康衢朝廷為熟路而其所謂不負丞者盖未足為君頌也然詩者所以宣有徳序者所以彂其趣吳之大夫士扵君亦厚矣故予不敢譲而為之書送施掾史詩序國家世臣賞田多在吳歲有廩人之事則遣使督之至正十二年丞相府選監脩國史府掾史淮南施君克譲乗傳至吳謹其事也既竣事明年春戒遷薦紳大夫咸賦詩以羙之其意若曰丞相勲足以輔成王業㓛足以保衛社稷力足以制法成治而智足以尅敵出竒既登名太常則賞田之法冝有加無征此國家所以勸大臣丞相所以奉祭祀者也其使人扵此豈直責以廩人之事而己㢤亦将囙此以視年之豐㓙人之休戚益思𢡟厥㓛以垂休無窮也然則羙克譲者非私克譲也羙丞相之善使人也丞相使人不直責以廩人之事而事集此克譲所以為賢乎方今丞相枋國立賢無方薄海内外士之負才實者並升中朝盖彬彬焉克譲年盛志銳而材又最良其從事相府也盖所謂生扵伯樂之廐長扵匠石之園矣其進而顯融也殆鷙鳥舉而風迫之矣它日乗堅筞駿鳴珂曵紱復以使事南還薦紳之在吳者尚能執巵酒為克譲歡以慶丞相之得士也十三年癸巳三月既望序送髙進道序聊城髙君晉道侍其先大夫貟外公寓吳最乆公中朝宿望風裁峻整居家尤儼肅晉道兄弟侍立終日非有故不輒去左右當是時搢紳先生謝官扵朝而休老扵吳者相望然皆推公為前軰無日不相過從部使者及四方䆠㳺之士道經吳率就造見户屨至不可容扵是進道兄弟雍容扵揖譲尊爼間動以矩度而進道又特以博古好學雅為諸公所知間欲屈置掾曺辝弗就及公捐舘一時諸老亦相繼淪謝其子弟往往通顯莫不交薦進道進道方僦居水竹間環堵蕭然貧窶日甚人以為難而進道弹琴誦書自若也今年夏廣西部使者不逺數千里移書采吳辟進道為書吏扵是常所往来者相與具車馬勸進道行而進道慨然若有不屑焉者乃相與言曰先大夫以閎毅正直之材有志當世不幸廢扵疾及門之士資話言而往猶足以濟時善俗况進道以克肖之子朝夕奉先訓而周旋者乎然隐居不仕豈先大夫所以有志扵當世之意乎且經邦之道莫先扵風紀而風紀之要莫難扵得人今聖天子得賢部使者扵廣西部使者又得賢寮吏扵幕下進道行矣推事親之道以事君推脩身之道以治人将見進道無負扵部使者而部使者無負扵聖天子矣扵是勸進道行者咸賦詩以華之而属天台陳基為之序雙谿詩序予郷去城百五十里而逺大率深山長谷土田之利薄歲所入自供公上之外僅足以給衣食以故民無嬴餘而得盡力扵畎畞暇日郷之老者率其子弟相與誦詩讀書而其人皆知講說周公孔子以相尚予生九年而孤又九年出逰四方不得安扵田里以朝夕承教及粗有知而歸先生長者多己謝世其遺風餘韵幸而可見者尚頼其詩之存盖予扵雙谿而有得焉予既手錄其詩乃從而歎曰嗟乎古者天子之廵狩也盖太師陳詩以觀民風焉是以孔子刪詩凡行役之大夫放逐之臣子閭巷婦女蒭蕘遺逸之辝悉耴而列諸國風者将使人囙其情性本其風土而觀其習俗之羙惡政事之得失也周衰聖人不作采詩之官廢作者始自成家家自為法辭愈工而氣愈蹙世愈降而情愈偽尚何俗之可觀政之可考㢤故予歴觀近世之詩重有感扵吾郷諸老雙溪之作者盖以其彂扵喜怒哀樂之正本乎習俗風土之羙謌詠周公孔子之言以教其子弟親其親而長其長樂其樂而事其事遡而求之古詩之源可見也予以不得親登其門為憾又惜采詩之官未設序而蔵之以俟知者送髙孟賔歸永嘉後序古者男子有所事也其所事在扵天地四方故其生也桒弧蓬矢以射天地四方者志其所有事也是故成童而教先㓜儀而後六藝既冠而成人則責以男子之事故三十則理男事焉男事理則可以出而行其志故四十始仕則方物出謀彂慮五十則服官政七十則致仕焉然則人之生也無一日不教其長也所一日而不學及其措諸事也亦無一日而非其所教所學者是故近而君臣父子夫婦昆弟朋友之所以為懿詩書禮樂之所以為教逺而天地日月星辰之所以運行風雨霜露隂陽寒暑之所以變化江海河嶽之所以為大皆其躬行實履深眀熟察而非有待扵外者也故曰叅其化扵天地而無悖行其道扵四方而無惑男子之始終其所事不既備矣乎今之人則不然其所謂㓜儀父兄不必知也所謂六藝先師宿儒不必能也而况扵其所事乎况扵無悖無惑乎嗚呼教之不行學之不講亦已乆矣士之生扵斯世茍有志扵天地四方以求其所事其可不自力乎是故弗教則已茍教焉非古之所教弗教也弗學則已茍學焉非古之所學弗學也茍教矣學矣而猶有所未自信者則出而㳺扵通都大邑天下人物之所㑹交扵豪傑卓絶之士以増益其所未至者焉然後求其所事扵天地求其所事扵四方其庶㡬不悖不惑乎余嘗有志扵是矣而未能致其力吾友永嘉髙君則誠博學而強志其弟孟賔哷東歸海上盖所謂歸而求之有餘師者其行也故以是諗之孟賔之得扵其兄者亦有以教我乎因書于末簡以致予私焉送申屠彦徳序秘書少監金華黄先生之䆠㳺浙東西也四方學者各以本經来受業㑹稽申屠彦徳則以春秋之學爲髙苐基登先生之門也後先生稱彦徳不置而基固願與之㳺已及来呉門訪故鍳書博士柯公敬仲而彦徳客扵其所始相識扵是脩同門之好甚懽也方是時士罷科舉之習一時作者以古雅相尚而彦徳詩文一出争相傳誦然日不廢三傳及諸儒所爲說以研精聖人筆削之㫖及賔興之制復行彦徳挟所有以往每方出塲屋同軰各以其文相示莫不推服彦徳而有司者頋屈之扵次搒僅以㤙例署爲歙縣教諭夫士之爲學亦正義不謀利明道不計㓛而已故其得所願扵時則進而行其志其未得所願也則退而求諸已茍去而奉籩豆玉帛周旋聖人之庭深衣大帶率諸生誦其詩讀其書扵朱夫子之里則又君子之所不譲也且基嘗㳺歙矣歙之為邦在萬山中水清而駚故家遺俗喬木相望文獻有足徴者而其人扵當世儒宗尤深慕金華先生之文足以彂眀朱夫子之道故以予之愚亦幸囙先生而不見鄙夷扵歙而况彦徳乎頋以朝夕之養不能一日舎去以從彦徳扵歙而脩基之所不逮也扵其行輒序以送之且以謝不敏扵歙之大夫士云送鄭君舉㳺金陵序昔六朝之都金陵也皆南北分裂之餘士生其間盖欲為司馬子長萬里之㳺而不可得庸詎知千數百年之後天下混一車書大同有如今日者而能文好㳺之士過其故都徘徊躑躅以吊其殘烟衰草之墟乎然秋髙氣清登石城而望長江西来朝宗于海而湘潭巴蜀之山雲影出沒至扵淮南草樹青青如薺秦淮晴波縈縈如帶猶足以想見昔時龍蟠虎踞之勝固一時之壮㢤况大江而南物盛人衆天子命執法大臣臨而治之以至繡衣峨豸之英皆極一時之選實東南人物之之都㑹也而其所軄又以進賢退不肖為務是以山林之士有志當世者莫不願與之交此永嘉鄭君舉所以㳺金陵也吾聞王良善御馬者也然非千里之馬雖良亦無所用其御矣今有千里之馬扵此良其舎之㢤雖然㳺金陵者衆矣固有登髙覧古慷慨悲謌隐扵桑樞甕牖以樂周公孔子之道有欲御之而不可得者君舉試一訪焉它日歸而為予道也送葛子充序金華周君子有宦㳺呉郡俄病暍而舌黒醫者以為不治其友龍君師徳更迎予里人葛君子充視之則曰此在醫書頋諸公不察耳以法治之随愈子有既深徳子充囙俾予序以送之夫醫固儒者之事乎素問内經雖不能必其出扵黄帝岐伯之手然五臓百骸脉絡血氣之在人身而與天地隂陽五行寒暑相為禪續消息其言至精而理至宻盖去􅒏命為不逺也秦和扁鵲倉公華他之書雖不盡見然張長沙論述扵其前劉河間張宛丘李東垣彂明扵其後此四君子者皆以博學審問之㓛而造夫神聖工巧之域天下之能事畢矣故為醫者不讀劉張諸子之書則何以推明長沙之論不明長沙之論則何以求素問内經之㫖素問内經之不察則夫所謂五臓百骸脉絡血氣與夫天地隂陽五行寒暑相與禪續而消息焉者何從測其微而探其頥㢤吁為是術者亦不易矣世之庸工俗師自號以醫専門者不過以舊時亰局古方相授受而已求其如子充者豈易得㢤盖子充之醫本扵素問内經上下扵四三君子之書豪分縷析以明夫天地隂陽五行寒暑之襌續而察夫五臓百骸血氣之消息其用心亦精矣猶以為未足則遍㳺四方博求名士相與講磨其所未至故其診脉䖏方譬之養由基之扵射不彂則已發則無不破的焉此周君子有所以深徳子充也夫雖然吾聞子充之治醫始以事親而終以濟人固未始一日而非儒者之事也然其活人亦衆矣何獨子有徳之之深乎夫貪㓛責報與夫背㤙而反讎焉者固無大相逺然以醫自専而終至扵殺人者聞子充之風亦可以少媿矣予既重周請又嘉子充之醫本扵儒者扵是乎書嚴氏㳺靈巖圖詩序中呉以水為國而靈巖獨髙出雲漢之表珠宫紺闕浮屠氏實有之然琴䑓硯池􅓏廊香徑所以資耳目之勝者尚厯厯呉宫之舊慿髙而望則姑蘇之麋鹿長洲之烟草逺在指頋中而天平之朝嵐暮靄太湖之風㠶浪舸變化而出沒者又近在履舄之下盖東南之偉觀也歲二月嚴君景安與其族人子弟汎舟海上西行百餘里侍其季父来㳺時雨既降草木暢逹長㓜提携相與攀髙雲蔭宻樹而懽忻愛洽之情油然扵山水間則斯㳺也又非唯以窮耳目之勝而已冝其賔客觀感一時之趣從旁執筆畫以為圖而能詩者又從而賦之也盖景安仁而好禮尤厚扵族人想其歲時蜡社宴集扵家披是圖而翫則所謂珠宫紺闕太湖天平或髙出雲漢之表或俯視履舃之下者皆可坐而致之扵是慨時序之代謝追登臨扵往昔而愛洽懽忻彂扵其情者如水之増不能自己則凡覧之者皆将為之賦詩而况扵其賔客者㢤基越絶之鄙人也奔走千里弗克盡其懽忻愛洽扵親戚者亦多矣故尤不能不申一言以致其歎慕之私焉至正六年龍集丙戌五月既望陳基序送趙平甫序州與縣均之為民父母也然昔為縣而今或以州陞之則其势既隆而其責加厚故由大府史而賔扵州者恒什百扵縣之典史扵是有假典史之選而賔扵縣由縣而𣸪陞扵州者焉夫自大府積勞而賔扵縣又自縣積勞而賔扵州之人也佐其長吏䖏既隆之势任加厚之責盖不難矣然而老扵刀筆者或髙下其三尺使民不得通其情迫扵衰耄者惟知避害而趋利不復頋事之得失有能恵然以民之休戚為己任使其長吏不失譽扵上而其民無怨讟扵下則人之賢不肖何如㢤呉興趙君平甫試吏其郷厯蘇杭府史為杭錄事司及眀象山縣典史今以都目選賔于越之諸暨州夫給事扵三大府更一司一縣悉著賢能聲今去而之山水之邦佐其賢良之長而治夫淳羙之俗攄其應劇之才而施之以間暇将見其賢聲大行扵越而流扵東南其可書者當不止扵一司一縣而已彼拘扵刀筆牽扵利害者又豈同曰而語㢤扵其行吳士善詩者咸謌以餞属予為之序送李崇道詩序予客洛陽識李君崇道扵御史斡勒君允常座中見其風神秀整舉止不凡意其為貴㳺公子也退而察其所軄乃知其為儒家子用父廕而為河南司獄且三年扵此矣予固益器重之盖河南居土中而其民號為近古然自饑饉荐臻始有失業而麗扵法者兼旁近山谷産物為白金亡命之徒相聚而冶扵其上歲不下數萬人往往囙利而競輒白晝相賊甚至血流洛水盡赤然則司獄扵此自非老扵事者鮮不以為難矣今李君徒以一介儒生而年又甚少頋乃䖏之以間暇不啻㳺刃扵有餘之地者亦必有其道矣予嘗見洛人謂君㢘而不矯恵而不近名民之逮繫者率哀矜而善䖏之疾與之藥飢與之食寒暑為之備多出私橐乆而不倦恒誦儒先君子茍存心扵濟物之言以自勉且曰氓之獲戾而至扵斯彼固不幸也亦豈有司者之幸㢤吾今奉吾公而巳又遑恤其它嗚呼其所以為吾李君乎未㡬以秩滿将謁選天官洛人以其必顯融扵時也咸賦詩以贈属予為之序記萬壑松濤軒記郜君彦清䆠㳺東南樂呉興山水之勝卜築弁山之陽而名其宴休讀書䖏曰萬壑松濤夫天地之氣噫而為風其始也彂扵太虚終也周扵六合而其嘘吸扵衆竅也盖吹萬不同然而霜露既降溪谷蕭條其欝然森茂挺然髙出雲漢之表者殆莫與松為伍扵是湱乎其相激沛乎其莫之遏渢渢乎耾耾乎如百水之源崩迸洶歘奔流而入巫峽轉瞿唐下江漢浩乎其莫知所極也扵斯時也吾知彦清仰而聽俯而視庶㡬與南郭子綦隐几而㳺扵灝氣之初将嗒焉不知孰為松孰為吾而予也又何足以知之㢤雖然夫鼓元氣而成萬彚者果孰為之機括乎故張之則溢萬壑而不以為有餘翕之則不盈一掬而不以為不足然要其歸則未始張未始翕而亦未始不張且翕也今彦清以英邁之氣勇往之姿出而周旋乎世故酬酢乎萬變盖不離扵物而亦不撓扵物也及其退扵休沭茲焉逍遥澹乎其相忘泊乎其無為其殆有合扵此者是則不可以無記也若夫風土之夷曠烟雲之吐納與夫嘉花羙竹芬敷恱茂以冝扵四時者它曰從彦清㳺尚能為之賦云綠隂亭記綠隂亭者界溪頋君進道宴㳺之亭也晋道中吳故衣冠之族好學嗜静而不屑扵禄仕其所居雖逺去城邑而無髙山深林之阻扵是引水以為池聚石以為山嘉木羙竹之植既扶䟽而䓗蒨竒花異卉之茂又數秀而靚深扵是不出户庭而得園池之勝者惟斯亭為然盖寒暑之時不同昏旦之氣亦異攬清輝而撫流芳扵此者固随物而寓懐即景以成趣然而春夏之交時雨霽而風曰好芳草净而林館䆳則緑隂之勝又為斯亭之最焉冝晋道角巾藜杖曰與二三友生逍遥扵此或彈琴或吹簫或飲酒或賦詩而凡世間之所謂榮辱得失不少置毫髮扵胸中也夫景勝則神超神超則理融晉道盖嘗學道而造扵此乎使晉道而果造扵此則其充然自得扵禽飛魚泳之際者殆與造物生生之妙流行扵無窮盖無時不在緣隂間也豈特春夏之交而已㢤雖然陽徳方亨草木咸若晉道得以仰事俯育之餘優㳺無事為亭以㽞連其光景扵故園喬木之下者亦知其所自乎然則晉道之以綠隂為樂而吾黨又能執筆以陶冩其所以為樂者皆幸生太平之時也是不可以無述囙書以為記聽雪齋記顧君仲瑛飾蔵脩之室扵所居小東山之左亰兆杜徴君用􅊢古題其顔曰聽雪齋間徴記扵予予惟天地之氣舒而為陽慘而為隂潤而為雨露凝而為霜雪而其所以舒所以慘而凝且潤者亦何與扵人而夫人之情見雨露之濡則神夷覩霜雪之嚴則神肅此必有為之真宰扵其間者矣且歲聿云暮雨霰交集君子扵此冝感時序之代謝慨物候之變遷退而居重幄􅊞兼裘徴纎謌選妙舞厲金石之響諧絲竹之音以樂其樂今也則不然歛容以䖏其獨潜聡以察其微超超然若逃乎虚空薄冨貴而樂枯橋者夫豈所謂瀌瀌奕奕霏霏脉脉颺霙而屑玉縁甍而入隙者果足以恱其耳而懌其心乎盖歲㓛既成嘉瑞時應出無覉旅跋􅍱之役入有琴書詠謌之娛而又仰足以致其養俯足以盡其育盖𥙿扵己者不役扵物足扵内者無待扵外扵是施施焉衎衎焉與葛天氏之民並㳺扵熈洽之世嗚呼居太平之時聽豐歲之雪其得扵天者亦厚矣冝其不以人之所樂者以為樂而以己之所適者以自適然則非仲瑛亦何足以與扵此㢤雖然吾聞井龜不可語海夏蟲不可以語冰盖拘扵虚者猶篤扵時也今仲瑛䖏𥙿而不嗇居盈而不矜持虚以守寔主静以制動盖庶㡬扵不溺此不泥彼而能與物推移者故予樂為之道也是為記志静齋記亰兆杜徴君嘗過㑹稽朱子安氏扵吳門而題其所居之室曰志静齋客有見而疑之以為子安方與吳人雜䖏扵賈區中其丹樓畫閣鱗次而櫛比眀珠文貝誇多而闘靡者非金張之家則陶朱之里也加以車服軒冕之旁午歌姬舞女之雜遝子安扵此冝朝夕弊弊焉疲精神役心思競得失較銖黍之不暇而其心之所之頋不在扵彼而在扵此吁此烏足以知子安㢤夫逃乎空虚形槁木而心死灰者舎動以求静者也應事物而接人情迹闤闠而心山林者主静以制動者也舎動以求静者其㓛足以善其身主静以制動者其効足以及扵物子安盖嘗求隂陽五行扵黄帝岐伯之書徴工巧聖神扵秦和越人之術其用将以善身乎抑以及物乎夫及乎物者不物扵物者也不物扵物者非志扵静者不能也况子安之左琴右書何慊扵金張茟床茶竈何羡扵陶朱法書名畫之卷舒何慕扵軒冕商彛周鼎之離列何事扵謌舞則其不容一物扵常惺惺之際者其亦主扵一而無它適焉爾予懼疑者之終不釋也故為之記使書扵徴君所題之左以示焉悠然亭記毗陵錢君士元博雅好古世居馬跡山之内閭其地濵太湖而與夫椒之山相望士元既樂與其親戚賔友者㳺則作亭其間而以悠然名之故浙東元帥白野公兼善寔為之篆燕人昔正卿氏士元之婣而白野公之客也每過士元飲酒亭上仰見其扁則思白野公焉余雖未識士元而白野公之遇余猶正卿也間属以記余弗敢辝夫士元之生後靖節千歲而近其居去靖節千里之逺而名亭獨耴其詩之語景而慕之不以其人乎斯亭也近俯太湖之蒼茫逺覧夫椒之嵯峨飛鳥往還與山氣相囬薄悠然之頃宛有真趣此靖節所謂欲辯己忘言者也盖象外之象景外之景自然無名太虚無迹言之不足以盡其意黙之則足以全其天噫靖節其殆天㳺者非耶余扵白野公無能為役而正卿頋欲為士元推靖節之忘言者而為之記豈忘言之中猶有可言者乎吾聞之能言者固難而忘言者為尤難惟其忘言也而後得其趣之真得其趣矣而猶不能已扵言盖終身不言而未嘗不言固荘周氏之所謂和以天倪而非余之所敢知也雖然白野公已矣吾将從正卿舎斯亭賦靖節飲酒詩以酒觴士元相與乗和平之氣逰無何有之郷而後忘言之境可庶㡬也正卿曰善因書以為悠然亭記至正十三秊秋八月辛丑記嘉樹軒記山隂朱君子安所居之庭有嘉樹焉天台陳基見而羙之子安曰子亦知夫樹乎方其産扵山林也莫不萌扵尺寸而至千尋為匠氏所知則耴而用之為明堂為宗廟不為匠氏所知則老扵丘壑而已或者又厄扵山石困扵巖穴蹙縮擁腫卷曲偪仄而不得遂其性否則病扵戕賊欲効其用如柤棃橘柚漆桂而不可得均之為樹也而有幸不幸焉今斯樹之植扵庭雖未必其為匠氏所耴然亦逃扵擁腫蹙蹜偪仄卷曲與夫戕賊之患而愛護之㓛均扵造物溉灌之勤饒扵雨露縦未能上直霄漢蔽虧日月然視老扵丘壑者亦或有間矣基聞其言而感之盖士之晦扵空谷有乗風雲之㑹佐時龍之運巍然而立扵廊廟者有徳行以培其本禮樂以逹其枝而光華潤澤又彂而為文章之盛然不獲推之扵時以致其所以扶顛而持危者有不材而克終其天年如商丘之木有以材為患中道而夭扵斧斤如宋􅍮氏之楸者此其幸不幸視彼何如㢤今也託根扵君子之庭始不厄扵山石終靡困扵巖穴養之以深仁而不徒為商丘之夀沃之以厚澤而不忍為宋荆氏之夭庸知其異日不千尋乎又庸知其不為匠氏所耴乎然則産扵山林而有幸不幸者在扵樹之遇弗遇也託扵君子之庭而有耴不耴者在扵人之養弗養也吾知養而已又遑恤其耴不耴乎子安曰旨㢤使吾囙彼而有得扵此者子之言也夫乃謝曰敢不封植此樹以無忘角弓囙書以為記范氏復祖塋記故宋贈太師魏國范文正公以上三世墳墓在吳門之天平山至公之薨始葬洛陽萬安山母氏謝夫人之兆其子監簿忠宣㳟獻侍郎以下三世皆祔焉中更靖康之亂子孫之在呉者弗獲以時展墓唯頋瞻山河北嚮流涕而已我世祖皇帝混一四海列聖相承誕敷文徳而尤惓惓焉致意扵古今忠臣烈士有㓛扵名教者故公克與天下之名山大川前代之聖帝眀王並登祀典每歲仲丁有司祗奉中牢致祭惟謹可謂盛矣然亦不過即天平之白雲以寓其髙山仰止之意而萬安之原至大中八世孫國俊僅一至其䖏同知徐君景孺為復侵地亦存什一扵千百自是又三十九年為至正七年國俊從弟将仕佐郎文英謂其子崑山州教授廷方曰嗚呼自陵谷變遷以来故家喬木零落殆盡吾子孫幸生聖明以孝治天下之時慿藉餘澤食有義田居有義宅教有義塾凡飬生送死可以無憾而祖宗二三百年之丘隴所恃以爲蔵者鞠爲芻牧之區徐君所封亦已侵削尚安在其爲子孫㢤洛陽土風號爲近古豪民無知可以徳化不可以力勝吾聞御史斡勒君允常居里第曰以吾先文正公濟貧活族之仁自勉而僉事李君公平分憲扵洛又嘗執筆而爲公之傳者誠以状白之必有以矜吾之志也廷方即曰具資糧屝屨不逺數千里致其父之命扵是李君首出俸金爲之倡斡勒君率郷黨與同知郭君文鼐判官董君鉉奉牲幣爲文以祭扵墓下所謂豪民之無知者觀感而化卒復徐君所封之舊而其地以畞計者若干焉既繚以周垣益之壤樹又築室六楹使其甥趙氏廬其上甫竣事以基嘗與觀籩豆玉帛之盛俾書之扵石竊惟文正公以間生之氣王佐之才致位将相爲宋宗臣百世之下誦其詩讀其書者可以立忠信而尊君父興王道而致太平故其少而肄業長而從政所至之地遺愛不忘率繪象以為祠刻銘以頌徳頋是窀是穸在其父子平生官居衣冠禮樂之郷而使斧斤耒耜日相尋扵其中豈國家所以尸而祝之以待先賢之意乎繼自今兹為子孫者如文英之不忘其本䖏里閈者如斡勒君之雅尚古道居風紀者如李君之知所勸相為有司者如郭君董君之克恭所事則萬安之松楸将人人為之封殖益乆而不廢尚何斧斤耒耜之患乎㢤公父子世濟忠直太史有傳神道有碑家乗有載兹不敢以瀆書書其復塋歲月以為方来告云是歲丁亥十月丙子記崇勲堂記遼之右族歴金入國朝惟石抹氏之後為最盛支分蔓衍散䖏北南若河南都府所属千夫長元善君者其一也君上世佐太祖皇帝𧺫翔方儁㓛偉㓛不可殫紀逮世祖皇帝平壹海内爰命武臣分鎮天下要害䖏頋惟河南地大以逺且㩀四方之中昔人所恃以為金城湯池者雖皆鞠為草莾然表裏山河自若也故既立萬夫長俾元勲揔蒙古軍世守之又以􅍑符金章軄長千夫授君上世其責任不亦隆且重乎此其先大父所以即所居之堂而名曰崇勲也今年夏五月予與御史斡勒公允常過君扵洛水之南遥望喬木叅天穹墉傑屋巋焉其中及至君衣䟽布出肅客無毫髮貴介習扵是方居先夫人之憂而先大夫即世乆矣暨升其堂見垂白之親坐堂上則君之祖夫人也囙相率舉酒為夀有頃君之女出拜客禮畢退立太夫人之側婉婉有度又頃之姆抱㓜子甫三歲秀眉廣䫙䠂楚不凡則君之子也坐㝎太夫人從容間勞悃悃欵欵精神氣貌如五十許人時已年八十有六矣樽豆既設君周旋降登上奉太夫人下接賔客而懽忻愛洽之情藹然扵威儀動作間雖素韋布之士有所不及也世言三代為将道家所忌然鄧禹将百萬之衆未嘗妄殺一人自謂後世必有興者自是累世寵貴卒如其言方國家經營四方神武不殺君上世以忠事君克有樹立升平既乆子孫祗承世祿以孝事親上棟下宇俯仰無怍引而弗替崇勲之澤未艾也彼若考作室既底法厥子乃弗肻堂矧肻構者亦可以知所愧矣至正七年五月甲子陳基記桃源小隐記界溪距吳城之東五十里其水深厚其土肥衍民有畊扵其上者自號界溪生人亦從而稱之而不及其姓嘗讀晋人所記桃花源而慕之且曰安得若人者與之逰乎扵是環其廬皆種桃而扁曰桃源小隐客有過而為之賦者曰仲春之月桃始敷風曰晴羙其蒸如霞既穠且郁天彂其葩灼灼麗姝爛雲錦以為居此豈避秦之子而彼羙人者得以挹其芳而翫其華耶生乃止客耴酒劇飲曰且暮俱藉草卧花下湏臾月白風露在草樹間夜氣􅊞人生囙蹔𧺫有頃復覔頋客而客忽不見潦水時至生往率農人田扵其野至暮而歸則聞有鼓枻夷猶扵烟波莾蒼外者生乃謌陶淵明詩以和之然其人卒不可得而見或謂向者之客盖仙云嗚呼若生者亦豈仙之徒與生又好經史百氏與夫法書名畫古玩器之属左右離列日與其友徜徉其中雖復昏旦異氣寒暑殊時而水木禽魚之趣無時而不寓扵目意有所適則彂為詩詞間有傳扵人者又若以幸生太平無事時粗以衣食有餘相與共樂扵此者皆上之所賜然終莫知其為何如人也赤城樵者聞扵虚白子故述而記之知還亭記西夏吉祥文卿謝官茶陵居洛陽里第扁其燕休之亭曰知還盖耴晉陶靖節之言也翰林待制大梁吳公以小篆題其㮄求予文以記之夫以靖節之脫頴不覊博學厲操使出而致用則其效可以返淳風於千古振大雅扵末俗所謂羲皇之上者不止北窓之下矣不幸而遇衰世仕不足以屑其意則寕浮㳺塵埃之外以庶㡬夫不逺復之義夫豈其獲已㢤今文卿生靖節所不可得之時而又器局過人鳴珂曳組世有膴仕頋不乗清飈慿灝氣去而叅鵷鴻扵九重友鸞鳯扵阿閣而乃遺榮髙蹈浩然賦歸左右琴書沾沾自適是盖學靖節而過焉者固非流俗徇禄忘返者所可同曰而語也雖然方今聖明在上求賢如不及非若彼時有一靖節而不為用是以山林有志之士莫不以㓛名自奮思有所樹立矧文卿家世顯融年甫強仕固冝以退為進不冝遽自棄也若夫優㢤㳺㢤聊以卒歲庸伺它日奚晚乎囙書以為記至正七年六月翔旦書與沈存齋書昔者魏公子無忌食客三千人名冠諸侯及其為趙赴秦軍也無一人為公子畫筞而謀却秦以存趙者獨夷門監者侯生生固不受公子財者也嚴仲子以諸侯之卿相不逺千里奉百金為軹深井里人聶政之母夀政不肻受趙亡四十萬之衆不能觧邯郸之圍魯仲連以東海布衣掉三寸舌與魏将軍新垣衍極言帝秦之害秦軍聞之為却五十里平原君奉千金為夀不受而去嗚呼三子者玄以謀或以勇或以口辯較其所為雖或未合扵大義然其奮不頋死生為人排患觧紛報仇讎使天下後世想慕其為人欣欣然願為執鞭而不可得者徒以不受人之財與金耳某也身䖏布衣之賤迹過抱関之陋困亦甚矣然幸不鼓刀市井為狗屠得以句讀訓故為人童子師旦夕備甘膬養老母不啻足矣頋以年兼喜懼人子之心有不忍言者間託友人某買山擬預營夀蔵不自意聞之執事執事不謀親友遂探私帑得錢若干緡介朱君犯炎暑冐風雨西赱横山購得之執事之義髙矣執事周人之急類此亦多矣執事讀古人書豈聞魏公子之風而興𧺫乎然執事寡嗜欲薄冨貴樂恬静方将棄田宅挈妻子入山林躬畊采藥蟬蛻穢濁以浮㳺塵埃之外使世復有侯生者流執事将無所用之然吾觀執事必不屑以魏公子軰自期而某亦豈敢妄以侯生之流自待㢤然侯生不以監門困故而受財魯連不以却秦有㓛而受金彼固皆天下之士也而某何敢望焉若夫聶政市販因汙之人耳卒不以母故而受人之金某自揔角從父師誦詩書習聞前言往行粗知貴義賤利之說執事扵某非有葭莩之親某扵執事非有纎芥之勞徒以家貧母老念先事為備遂辱執事遺以山山之直雖不及百金然人有徳扵其親則扵金何有向也知貴義而賤利今也利執事之山而受之執事不暇頋傷恵而與某某又不暇䘏傷㢘而耴之執事且傷㢘之事市販之人不肻為執事師古人學古道豈冝以某之故而受傷恵之名乎執事視財甚輕視義甚重然吾聞之義莫大扵愛人執事愛人以徳而使某蹈傷㢘之非而爲軹井深里人所咲亦豈執事意乎今以山錢若干并㩀文納上執事幸聽其言察其心歸其錢扵私帑然後乞以㩀文見與則執事之賜厚矣否則并其文不敢望懇懇之私惟執事悉焉題䟦書石抺氏家譜後昔金源氏代遼有國嘗易其貴族之姓𫐠律爲石抺氏其子孫筞勛天朝散䖏四方率以武㓛顯若今雲南元帥存道公及平江萬户伯璣公是已然存道公盖嘗持文衡扵四川行省及其請于朝而復妵也故國子監丞莆田陳公衆仲序之甚詳今伯璣之妵雖未及復然其譜而存之豈亦有所待也夫凡其世次之隆勲代之盛諸公論之備矣予獨推本而言之者蓋亦表其妵之所自云耳書故御史鄭公從之嵩山五詩後右嵩山五詩故監察御史洛陽鄭公從之棄官學道之時手書其所作也昔漢梅子真為南昌尉數上書譏刺權奸不見納遂棄妻子去九江時人傳以為僊公當至元全盛時非若西都之季而時相用事非有元始顓政之大惡其為御史又非南昌尉所可同日而語頋以直道見㡬輒亦棄妻子著道士服為黄冠師終其身不還郷里其去就之際視子真有甚焉者然子真之議論風旨見扵漢書班班可考千載之下尚想見其為人今公之所建明未知太史氏悉得書之與否尚幸其蟬蛻穢濁髙世絶人之槩見扵詩者直與嵩髙之氣相盤薄世之側媚耴容持祿固位者聞公之風亦可以少媿矣雖然子真去後人或見其變妵名為吳市門卒者庸知公不與司馬子㣲之流注来人間乎頋安得而見之也書中書除目御書𣪚官後右中書除目凡六人所賜𣪚官寔仁宗皇帝親御翰墨為之書而故蔡國文憲公臣郭貫時由治書侍御史遷禮部尚書以從五品秩超授嘉議大夫而居其首一時氣象見扵雲章奎畫藹然虞庭命官之意儒臣之寵未有盛扵此者盖國家以神武不殺奄有四海而典章文物至仁皇而大備鴻儒碩彦遭際聖明並列庶位而臣貫尤以文學老成蒙𬒳優擢如此書曰知人則哲能官人又曰夙夜惟寅直㢤惟清然則非仁皇之聡明睿智弗能以知臣貫非臣貫之寅亮直清不足以堪上命故其厯事三朝致位廊廟卒為名臣豈非簡注有素而自積者厚乎嗚呼鼎湖之龍既逺九原亦不可作抱遺弓而悲風木者尚知以孝為忠思所以引而弗替㢤至正七年十月庚辰布衣臣陳基拜手稽首謹識書太古字說後河東運使髙昌拜住公字太古中朝諸名公為文為銘為詩以彂明其義無餘藴矣復俾基一言以申其說基聞公曽大父鞏昌王大父安懿王咸以純一無偽之徳歴事累朝卒致端拱之治至公之父平章公季父御史大夫祗遹先猷為世大臣而公又克承世澤致位通顯其在中臺為良御史行部為賢使者庸田司復著能聲而任鹺臺也又一時之慎選然則所以紹其家業者亦豈外扵純一無偽純一無偽者何太古之道也夫名者實之賔而字所以敬名也公方嚮用扵時所以奮庸熈帝之載以光扵前人則扵敬名以稱夫寔乎何有公尚勉之㢤䟦學齋侍御張掖劉公洛陽懐古詩右洛陽懐古詩一首西臺侍御張掖劉公之所賤也公以學問政事方用扵時而其為詩清新雅麗有則至以周公卲子對言則先儒之微意而公之學有所本也刻而傳之豈惟洛陽之盛事而巳㢤䟦張彦輔畫拂郎馬圖至正壬午予客亰師而拂郎之馬適至其龍鬃鳯臆磊落而神駿者既入天廐備法駕而其繪以為啚傳諸好事者則永嘉周冰壷道士張彦輔並以待詔尚方名重一時然氷壷所作識者固自有㝎論至扵彦輔以其觧衣盤礴之餘自出新意不受覉紲故其超逸之勢見扵毫楮間者往往尤為人所愛重而四方萬里亦識九重之天馬矣此卷乃其最得意者俯仰八九年復扵頋仲瑛氏䖏見之追懐疇昔重為増慨韓文公有云千里馬常有伯樂不常有吁世豈惟無伯樂㢤雖欲求如彦輔之圖冩俊骨亦不可復得仲瑛其可不寳而玩之乎䟦西園雅集啚故宋駙馬都尉王公晉卿西園之集亦盛矣盖非駙馬之賢不足以致諸老非諸老不足以成西園之勝然則戚畹之貴不足為駙馬榮而其名垂不朽者政以其能文好士耳吁自昔王公大臣孰無園池水竹之樂百世之下能使人臨文興慨甚謂世道之盛衰人物之消長扵是乎在則夫斯圖之見重扵世又豈惟以西園而巳㢤䟦康里承旨遺墨古故翰林學士承旨康里公遺墨四帖其後兩帖乃公在宣文閣時所書以遺基而基轉以予頋君仲瑛者今年孟春過玉山草堂仲瑛出以見示伏而玩之恍如見公與王右軍父子翺翔扵天門鳯閣之上而蛟龍鸞鵠為之先後也九原不可復作尚幸數從仲瑛㳺時一披展俯仰今昔得不重為増慨乎䟦貫酸齋書歸去来辭酸齋公如冥鴻逸驥不受矰􅌳覊靮而其蟬蛻穢濁逍遥放浪而興造物者㳺近世蓋未有能及之者其自謂平曰不冩古今人詩章而獨慕陶靖節之為人而書其歸去来辭觀者殆不可以尋常筆墨蹊徑求之也至正十年五月二日臨海陳基識傳傳道人傳傳道人者名道清字隱陽燕人也嘗以皂􅊢給事中書刑部積勞當食九品祿㑹河南有以詿誤徴繋請室者若干人道人獨哀其非辜每加存恤未㡬詔赦出之尋許令還官扵是皆私徳道人而道人亦雅知河南風土之勝又幸有東道主乃謀扵父兄妻子不逺千里謁告往訪之既至争迓之于門相與道舊故甚懽又将有以厚餽之居無何偶行關陕間值黄冠師而與之語囙請寓宿師與之端坐竟夕不寐俄黙然若有㑹扵其心者乃賦五字詩二首語皆超悟所謂黄冠師不知其爲何如人也旦日遂易𥘉服還謝舎主人悉辝其所餽不受且曰吾平生雖未始讀書然亦嘗聞漢之絳侯矣勇足以将百萬之軍而怯不堪一獄吏榮為萬乗之卿相而辱不迨一匹夫此無它知進不知退也子䓁固非絳侯之倫然不幸而逮捕則無以異使吾以嚮之侵辱絳侯者以侵辱子獨不得千金歸遺父兄妻子乎頋義有所不忍也吾聞古之有道者祿以萬鍾位之上卿而不頋今吾徒用一皂􅊢舎去繩墨質鈇之役而以虚無為本清净為宗其自視雖不敢遽與古之有道者齒然去就輕重孰與勇怯榮辱相尋扵死生得䘮而不知者嗚呼吾尚安用君之所餽為㢤乃去入嵩山受隂符道徳南華諸書扵陳錬師居八年不與父兄妻子音問相接父兄妻子亦莫知其所在也洛陽之三井洞實故劉尊師錬丹䖏道人輒囙故阯築環堵坐其中率百餘日不出好事者或往候之亦不與之語獨見御史斡勒公允常環偉特逹器識絶人心竊慕焉而公亦喜其不務為詭異之行誕㓜之言以驚世駭俗囙折節與之交公甞語之曰吾非好為是驅馳也徒以君親之㤙未報耳他日倘遂吾初心則葛巾杖屨相從扵山顛水澨不難矣道人方闢真舘扵洛城之東則欣然曰大夫進足以為邦家之光退不失扵泉石之榮故曰㓛成名遂身退天之道後三十年當候公扵此矣時予客公所因與道人善見其語黙止作無異庸衆人然不飲酒不茹葷而神全氣澤其中之所存盖有異扵人者故予樂為之道也賛曰昔金源氏之時有徤卒曰颵腿王者𥘉不識字一旦舉筆成章時人以為得道稱之曰王先生平章趙公間間名重當世尤雅敬之今道人之出䖏大畧與先生相近而御史公之學問政事与夫㓛名未艾視趙公且将無媿然急流勇退之志㢤者過焉故予並著于篇以伺云哀辭葉孝墅哀辭並序葉孝墅世居天台少孤雅志好學既冠㳺亰師見項君子虚子虚與葉氏世有婣好而孝墅執子弟之禮惟謹相與甚懽子虚儒者而隐扵黄老以醫名亰師亰師之人無貴賤賢愚皆趋之孝墅與之周旋應接竟曰不倦而能安澹泊服勤苦聲色勢利服玩宴樂舉無所嗜獨尚儒術善楷書好醫藥錬金石草木為丹劑號能精絶不輕售人子虚甚器重之孝墅既早失父母幸有兄弟然皆未有子去年兄若弟不逾月俱䘮訃至孝墅哀慟歐血仆地頃之復蘇然竟以是弗𧺫子虚亦固知其不可救而生之之心未已尚恐已見或弗及欲致它醫孝墅曰使世無良醫則巳如有之豈復有賢扵秦醫緩者耶然膏肓之疾雖緩有所不能為公今之緩也吾之疾公莫之為况它醫耶夫人窮則號父母吾今無父母矣公獨非吾父母頋力有不可為者豈非天耶獨念吾兄弟無後吾死亦無後吾宗亦何至是耶雖然是亦天耳吾之命信懸扵天矣尚何言耶尚何言耶嗚呼何其言之悲乎始余居里巷時聞葉氏世有令徳及與孝墅友又信其為佳子弟俱㽞亰師見其趣舎之不苟言行之有制未甞不與子虚稱之而人亦莫不稱之也意其必有所樹立克享前人之徳乃今不幸而兄弟相繼以死夫有佳子弟如孝墅而弗克夀世有令徳如葉氏而弗克有後此天者之所以不可必而君子之所哀也故為作哀辭世之知孝墅者固已同予哀矣其不知者尚囙辭以見之其辭曰爾車非不利兮又循循其擇路既膏舝又挟輈兮馬􅋮首其欲鶩鼂出門以就軌兮夕亡輻而失馭何殃慶之不以其類兮俾若人而弗祚生何恃而何怙兮死曷往而曷歸尚魂氣之流通兮覧舊丘而下之哀若人而不可復見兮耿予懐而増悲夷白齋藁外集卷終, WYG: ''}
