  - {type: variant, offset: 0, length: 977, content: 夷白齋藁卷之十七臨海陳基著金華戴良編序頋友文字序吳下縛茟生曰顧輔字友文其縛筆視近世吳興諸名家不多譲間請余講其字而序之其名若字盖夲乎魯曽子所謂君子以文㑹友以友輔仁之言也曽子之言尚矣余請􅈬生之業而為之說可乎昔之善言書者盖以刀稍喻筆焉故揚子雲曰刀不利筆不銛而獨加諸砥信乎刀不利雖有桓公之葱文王之録太公之闕闔閭之干将莫耶曽不足以刜秋蓬剪腐卉尚奚耴其㫁犀象屠蛟龍而鋒不剉乎筆不銛雖有文犀之植象齒之管秋兎之翰豊狐之柱縁飾則不啻侈矣以之為書則偃仰乖方向背離軆從横牽掣舉不適人意而書之道㡬息矣然則砥削者固輔刀筆之羙器也士之為士也亦然不博之以文則學無所殖不輔之以友則徳無從立故詩曰朋友攸攝攝以威儀孔子曰朋友切切偲偲楊子曰朋友以磨之友也者其又士之砥削乎甚矣㢤生之業克稱乎其字也是故非學不足以為士非友不足以立徳非言不足以垂世非筆所傳者不博而筆也者又士之所以羽之翼之左之右之以圖不朽者也噫生也不徒名其名将思有以行其行不徒字其字将思有以事其事不徒藝其藝将思有以試其試吾聞之有為者亦若是生之業既切扵士之用生之字復切扵士之學則余以士勉生世之樂与人為善者得無以為過乎昔者庖丁好道而進扵技今生之業非直觧牛者比也又庸知其非好道者然則余勉之也非過也李僉事政蹟序至正十二年春朝鮮李公仲善以浙西道㢘訪僉事分憲吴下督行省兵禦海㓂未㡬淮右妖㓂竊彂屠郡縣殺守宰攻䧟湖㐮蔓延江東西羽書絡繹告急無虚日人心震懾吳為江表大郡介居水陸之衝東濵鉅海南控甌粤西連荊䠂無髙山大谷以為之阻東南所賦水土百物吳為特盛倉廩府庫之所儲偫歲輸亰師以供天地神明之祀軍國之須與夫民人之所恃以為存者當務之急宜莫如城而吳城故閎壮周餘四十里舊阯僅存謀繕完之伇最鉅承平曰乆民習宴安不可與慮始議下衆口交怨公乃因父老而諭之曰國家以熈洽之仁汪濊之澤休飬生息尔父兄子弟乆矣一旦盗𧺫倉猝淮䠂間環地數千里生民塗炭其故何㢤城郭廢而兵革不戒也今吾受天子命除民所疾苦目睹無城之害而不與尔父兄圖之有如事不可測噬臍之咎将誰任之吾聞之備豫不虞政之善訓也故曰有備無患今吾用尔力新尔城深尓池整齊守具豈惟倉廪府庫是頼尓子子孫孫将永其利乃計城文尺視民貲多寡募工分築有差民始翕然趋事施楨幹審榘度萬杵齊奮殷若雷動公不憚暑暍親出入版築間勞撫士卒以恵濟威以勤率惰鉅萬之費非常之㓛三月而畢公既率有司筮日告神又具牛酒犒士卒謹成事禮也方是時㓂入杭繼入湖入常燒民廬劫庫蔵縦兵剽掠烽燧四𧺫鉦鼔, WYG: ''}
