  - {type: variant, offset: 0, length: 946, content: 夷白齋稿𥙷遺樂府詠歸操呉人沈仲說搆亭曰詠歸每服田之暇輒絃歌其中盖将有感扵曽點氏之言意也為一闋俾絃而歌以自適云我朝于田我暮于室曷以自娯有琴有瑟我服惟春我樂惟親我欲浴乎沂濆匪舟兮孰先我津我欲風乎舞雩匪若人兮孰為我徒我葺我廬我讀我書我啜有菽我饌有𬞞我非悦此新搆我詠歸兮匪夕伊晝我非愛彼流水吾褰衣兮欲沿其沚聖如可作兮吾從夫子玉山辭為頋仲瑛作山嵁嵁兮磅礴太古木葱葱兮雲英英而欲雨日朝出兮在户先輝輝兮水流其下匪君子兮夫誰與處采我蘭兮為佩褰我荷兮為盖從子于山兮聊逍遥以䘚歳望仙詞為陸叔陽道士作木蕭蕭兮中洲雲慘慘兮山幽仙之人兮其耒逰卑真詮兮慰所求翩然駕鶴兮不可以乆㽞倚天風兮特悵望以夷猶呉儂謡至正十四年呉歳饑秋七月海道都漕運萬户府逹魯花赤明善公為糴米賑之呉民感徳歌是以頌城上日出行且趨呉民負米懽且呼漕府君侯長萬夫糴米食儂如哺雛君侯運粟輸京都都人食稅復衣租又以餘力甦焦枯連年和糴喧九衢呉儂有粟不得餔遂令斗米如斗珠不貴楮幣貴青蚨郷村白屋多逃逋尫羸操瓢行塞途㣲矦哀儂釡生魚嗷嗷枵腹多作莩昨日児飢泣嗚嗚今日飰飽走匍匍君侯長漕非剖符不忍赤子坐艱虞使君㱕朝掌訏謨濟世昇平樂有餘天下米賤酒可沽上及父母下妻孥天子行當錫鋒車君侯幸勿遲其驅逺歸曲陸乗車水乗舟関河何綿綿波浪復悠悠車行阻雪舟阻氷陸憂豺狼水鯢鯨我生不學慿河術柰何欲與重險争朝辤舟暮辤馬鶺鴒相呼在原野白魚可烹雀可炙諼草羅生滿堂下離倫婦有婦見夫乆貧辤去後夫至顯宦感而作我弗干人兮我讀我書日不能具餐兮又無完𥜗雖云至貧兮匪謂之病何以自腴兮惟道之為信爾婦誠愚兮不見燕燕之于飛胡違乎大倫兮乃甘學買臣之妻我一日官榮兮印綬赫若爾母我尤兮我不爾怍吁嗟宋女兮何遼以邈群珠碎傷呉帥潘元紹衆妾作潘七妾皆青年絶色善纂組歌詞因潘出軍恐致疑皆自經繡紋刺綺春纎長蘭膏􆁖鬂瓊肌香芳年艶質媚花月三三兩兩紅鴛鴦翠靴踏雲雲帖妥海棠露濕胭脂朶冶情紛作蝶戀春新曲從翻玉連瑣畫堂銀燭天沉沉揚眉一咲輕千金明珠買得緑珠心欲揮魚膓掃妖彗主君勿疑心似醉一宵痛擊群珠碎門前䥫騎嘶寒風竒勲觧使歸元戎俠客行俠客双鹿盧鵜膏淬銛鍔試舞出嚴城群寇膽盡落從軍行関河鼎沸慘民生志士麄豪氣不平誓掃攙搶安郡邑長驅鐡騎事􅌹征古詩五言京回徐翁招飲園亭初歸自神京歴碌辭逺道適過故人居嘉樹䕃芳草􅋢此時雨歇綠隂净如掃君子謝軒冕泉石遂幽討清吟對琴尊暢飲, WYG: ''}
