  - {type: variant, offset: 2161, length: 1, content: 一, WYG: 力母升于堂朝日有光崇肴于俎實酒于觴孫拜起舞婦與在行酒旨肴嘉母樂且康中堂何有有絲有竹琴瑟管籥繁音妙曲間以金石鏘之佩玉黄耉鮐背維母是祝載彈載詠再歌再絃母醉且飽母喜且言母曰孫孝母曰婦賢宜爾蠶于室宜爾榖于田爾孫爾婦式如母之年西村之墅美德方甫西村之墅有稷有黍誰其藝之維德方甫維甫在潁式田以處入奉烝嘗出具樽俎以歆我祖考以侑我賓侣潁水悠悠載泳載游或杭以葦或方以舟或汎幽渚或浮中流以御我田祖以貽我麳麰甫之出矣載縻好爵聖亦有言耕不如學人情為田有耨斯穫以詒我後昆以承我先覺古詩五言秋懐寒暑有代謝人事亦推移蹉跎慨疇昔俛仰今復兹籬落萎秋蔓餘葩含夕姿造物諒難窮吾生知有涯皎皎碧山阿依依芳桂枝相從恐遲暮悵望起遐思其二}
