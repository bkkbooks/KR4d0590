  - {type: variant, offset: 5921, length: 3, content: 悅作暢, WYG: 以宜于四時者它日從彦清游尚能為之賦云綠隂亭記綠隂亭者界溪顧君進道宴游之亭也進道中呉故衣冠之族好學喜靜而不肖于祿仕其所居雖逺去城邑而無髙山深林之阻于是引水以為池聚石以為山嘉木美竹之植既扶蘇而䓗蒨竒花異卉之茂又敷榮而靚深于是戸庭不出而得園池之勝者意惟斯亭為然盖寒暑之時不同昏旦之氣亦異攬清輝而撫流芳固隨物而寓懐即景以成趣于春夏之交時雨霽而風日好林館邃而芳草榮則綠隂之勝又為斯亭之最焉爾時進道角巾藜杖日與二}
