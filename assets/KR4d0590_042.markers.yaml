  - {type: variant, offset: 6380, length: 1, content: 患, WYG: 年復于顧仲瑛氏處見之追懐疇昔信為増慨韓文公有云千里馬常有伯樂不常有吁世豈惟無伯樂哉雖欲求如彦輔之圖寫俊骨亦不可復得仲瑛其可不寶而藏之}
  - {type: page-break, offset: 6380, content: '', id: KR4d0590_WYG_037-38b, image: WYG1222/WYG1222-0391d.png}
  - {type: variant, offset: 6382, length: 0, content: '', WYG: 跋西園雅集圖故宋駙馬都尉王公晉卿西園之集亦盛矣盖非駙馬之賢不足以致諸老非諸老不足以顯西園之勝然則戚畹之貴不足為駙馬榮而其名埀不朽者政以其能文好士耳吁自昔王公大臣孰無園池水竹之樂百世之下能使人臨文興慨甚謂世道之盛衰人物之消長于是乎在則夫斯圖之見重于世又豈惟以西園而已}
  - {type: page-break, offset: 6382, content: '', id: KR4d0590_WYG_037-39a, image: WYG1222/WYG1222-0392a.png}
  - {type: indent, offset: 6383, content: 　, id: KR4d0590_krp_042-bkkind1808}
  - {type: variant, offset: 6383, length: 1, content: 患, WYG: 跋喀喇承㫖遺墨故翰林學士承㫖喀喇公遺墨四帖其後兩帖乃公在宣文閣時所書以遺基而基轉以予顧君仲瑛者今年孟春過玉山草堂仲瑛出以見示伏而玩之恍如見公與王右軍父子翺翔于天門鳯閣之上而蛟龍鸞鶴為之後先也九原不可復作尚幸數從仲瑛游時一披展俯仰今昔得不重為感慨}
  - {type: page-break, offset: 6383, content: '', id: KR4d0590_WYG_037-39b, image: WYG1222/WYG1222-0392b.png}
  - {type: variant, offset: 6385, length: 1, content: 作, WYG: 跋貫酸齋書歸去来辭酸齋公如冥鴻逸驥不受繒繳羈靮而其蟬蛻穢濁逍遙放浪而與造物者游近世盖未有能及之者其自謂平日不寫古今人詩章而獨慕陶靖節之為人書其歸去来辭觀者殆不可以尋常筆墨蹊徑求之也至正十年五月二日臨海陳基識傳傅道人傳傅道人者名道清字隠陽燕人也甞以皂隸給事中書刑部積勞當食九品祿會河南有以詿誤逮繫請室者若干人道人獨哀其非辜毎加存䘏未㡬詔赦出之尋許會還官于是皆私徳道人亦雅知河南風土之厚又幸有東道主乃謀于父兄妻子不逺千里往訪之既至爭迓迎之相與道舊懽甚又將厚餽之居無何偶行闗陜間遇黃冠師而與之語因請寓宿師與之端坐竟夕不寐俄黙然若有會于其心者乃賦五字詩一首語皆超悟所謂黃冠師不知其為何許人也旦日遂易初服還謝主人悉辭其所餽不受且曰吾平生雖未始讀書然亦甞聞漢之絳侯矣勇}
  - {type: page-break, offset: 6385, content: '', id: KR4d0590_WYG_037-40a, image: WYG1222/WYG1222-0392c.png}
