  - {type: variant, offset: 5875, length: 4, content: 二字乙轉, WYG: 暢茂長幼提携相與攀髙岑撫長松而懽忻愛洽之情油然于山水間則斯游也非惟窮耳目之勝而已宜其賔客觀感一時之趣從旁執筆畫以為圖而能詩者又從而賦詩焉盖景安仁而好禮尤厚于族人想其嵗時臈社宴集于家披是圖而玩之則所謂珠宫紺宇太湖天平或髙出雲漢之表或俯矚履舄之下者皆可坐而致之卧而游之于是慨時序之代謝追登臨于往昔而愛洽懽忻發于性情形諸詠謌不能自己則凡覽之者皆將為之賦詩而况于其賔客㢤基越絶之鄙人也奔走千里弗克盡其懽忻愛洽于親戚者亦多矣故不能不申一言以致其羨慕之私焉至正六年丙戌五月既望書送趙平甫序州與縣均之為民父母也然昔以為縣而今乃以州陞之則其位既隆而其責加重故由大府史而賔于州者恒什百于縣之典史于是有假典史之選而佐于縣由縣而復陞于州者焉夫自大府積勞而賔于縣又自縣積勞而賔于州也佐于長史處既隆之位任加重之責盖亦難矣然而老于力筆者或上下其}
  - {type: page-break, offset: 5875, content: '', id: KR4d0590_WYG_037-15a, image: WYG1222/WYG1222-0380a.png}
