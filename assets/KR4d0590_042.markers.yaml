  - {type: variant, offset: 5587, length: 5, content: 九原泉作當, WYG: 睢州雪中步允常御史韻隠隠高城下五更飄飄墜雪細聞聲花開草木春輸巧光燦樓臺月讓明太史預占}
  - {type: variant, offset: 5593, length: 4, content: 地後十二, WYG: 榖瑞先農應報嵗功成誰知萬里關山外親伴觀風使者行徐州日上彭城獨倚樓關河迢遞水􅆰流不因躍馬江東去安得歌風沛上游草帶虞姬亡日淚山餘亞父病時愁如何舞罷鴻門劒不向咸陽一少留至日淮陰道上年年至日}
