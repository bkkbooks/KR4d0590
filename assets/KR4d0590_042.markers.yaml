  - {type: variant, offset: 3214, length: 329, content: 慕師之風往來精舍爲方外遊後十一至順二年辛未無二年二字桑門契如如作山三前一州之信女金氏周州信女金周氏徐氏黃氏前二世以甲乙守之無此六字前三而律不嚴律作傳前六以貴胄從學考亭業儒出仕朱子且姻而師也生稟淑靈無也稟二字前七幼篤慈忍少長事事親克孝祖及父兄孝且恭前八於杭之南屛願以無此十四字初服而師事焉山前九年二十有八有作又具戒具領戒言首謁無涯際公首作次於婺之智者無此五字一言懸解言作語前十繼見鐵山璚公繼作更前十一以至正元年辛巳正作元無辛巳二字八月二十四日委二十作廿委化作化示寂珠圜玉潤潤作潔前十二遂建塔山之西麓塔下有於字夏臈夏作僧後一己丑師之上首弟無己丑師之上首六子一恆字弟子作其徒不遠千里無此四字後二出處大槩無大槩二字徵文爲記爲記作記之勒諸貞石以昭示無此九字方來後四云有, WYG: 天}
