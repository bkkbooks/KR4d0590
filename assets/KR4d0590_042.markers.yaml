  - {type: variant, offset: 6149, length: 0, content: '', WYG: 得其趣之真得其趣矣而猶不能已于言盖終身不言而未始不言也莊周氏之所謂和以天倪而非予之所敢知也雖然白野不必言矣吾將從正卿坐斯亭詠靖節詩以酒觴士元相與乘和平之氣游無何有之鄉而後忘言之境庶可黙會也正卿曰善因書以為悠然亭記至正}
  - {type: page-break, offset: 6149, content: '', id: KR4d0590_WYG_037-24a, image: WYG1222/WYG1222-0384c.png}
