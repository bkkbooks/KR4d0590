  - {type: variant, offset: 5645, length: 0, content: '', WYG: 時周品物精英千古𦙍貞忠重尋漢武登封處御道西風有路通次韻鋼字為拜太古運使賦平生忠義結中腸力剸蛟犀始見鋼水部分曹仍案節尚書入奏擬懐香蹔垂鴻鵠青𠖇翅不負蒹葭白露霜咫尺星辰催聴履肯教供奉殿西廊次韻酬鄭彦章運使使君擬卜水南居負郭良田二頃餘但使有溪堪種竹不愁無地可藏書衣冠洛社期諸老祖帳都門憶二疏頭戴角巾收芋栗秋風吾亦愛吾廬東平道上征客東平聴曉鐘出門殘月尚朦朧一輪紅日生滄海萬文丹霄聳岱宗不為山靈迴俗駕敢從漁父問形容何當結屋嚴巖下學種徂徠百尺松濟州蕭蕭僕馬别神州俛仰乾坤一敝裘慷慨不為投筆計飄零􅆰作曳裾游雲飛故國無來雁冰解長河有去舟}
  - {type: page-break, offset: 5645, content: '', id: KR4d0590_WYG_036-25b, image: WYG1222/WYG1222-0368d.png}
