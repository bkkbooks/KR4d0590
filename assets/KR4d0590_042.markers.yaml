  - {type: variant, offset: 5631, length: 3, content: 四後九, WYG: 高人在上頭不向終南通㨗徑要將砥柱鎮中流世間豈識維摩病方外真從慧逺遊明日匆匆遇江去尺書聊以寄綢繆五月五日淮陰五月五日淮陰郡半雨半晴城上樓菖蒲泛酒我無分楊栁繫船君且留西日照人生别思南風吹笛帶邊愁明朝必上洪河去欲采芙蓉不自由舟中束書又上李膺舟共溯黃河最上流自笑久為吳下客誰知重向}
