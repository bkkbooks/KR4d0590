  - {type: variant, offset: 5573, length: 1, content: 爛, WYG: 送年華題龍門山圖曽過龍門山下寺畫圖渾似昔年遊秋聲夜動千尋木雲氣時騰百丈湫魏國祠前烟草緑逺公岩畔石泉流隠君最有登臨趣拄杖相期到上頭至正丁亥四月二十三日允常御史有事于先塋甫竣事而甘雨}
  - {type: page-break, offset: 5573, content: '', id: KR4d0590_WYG_036-18a, image: WYG1222/WYG1222-0365a.png}
  - {type: variant, offset: 5575, length: 0, content: '', WYG: 人以為孝感所致皆為賦詩美之而屬予為之倡佳城􅆼窕白雲中華表前瞻一徑通千載有功歸紀信九原無計起文翁龍門春湧桃花浪洛浦秋寒麥秀風近日繡衣來拜掃孝思忻至雨濛濛丁亥嵗河南自正月至七月無雨流民相屬于道哭聲滿野不忍聞之慟哭秋原何處人哭聲直上澈蒼旻謀生不及官倉䑕轉死終為客路塵憔悴幾家猶貢蜜蒼皇諸硐又爭銀緑衣陳事無年少徒爾區區索鬼神阿婆抱子婦將車骨肉誰甘棄道途使有賈生應慟哭惜無鄭俠為傳圖身抛田里魂俱喪目㫁關山淚已枯自笑腐儒難用世}
  - {type: page-break, offset: 5575, content: '', id: KR4d0590_WYG_036-18b, image: WYG1222/WYG1222-0365b.png}
