  - {type: variant, offset: 5895, length: 2, content: 蓋吹, WYG: 然而霜露既降溪谷蕭條其蔚然森茂挺然髙出雲漢之表者殆莫與松為伍于是浩乎其相激沛乎其莫之遏渢渢乎颯颯乎如百水之源崩迸洶歘流而入巫峽轉瞿塘下江漢滔滔乎其莫知所極也於斯時也吾知彦清仰而視俯而聽庶㡬與南郭子綦𨼆几而游于灝氣之初將嗒焉不知孰為我孰為吾而予也又何足以知之㢤雖然夫鼔元氣而成}
  - {type: page-break, offset: 5895, content: '', id: KR4d0590_WYG_037-18b, image: WYG1222/WYG1222-0381d.png}
  - {type: variant, offset: 5898, length: 3, content: 作爲聲, WYG: 彚者果孰為之機括乎故張之則溢萬壑而不以為}
  - {type: substitution, offset: 5899, original: 爲, replacement: 為, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-19875}}
  - {type: variant, offset: 5902, length: 0, content: '', WYG: 餘翕之則不盈一掬而不以為不足然要其歸則未始翕而亦未始不張且翕也今彦清以英邁之氣勇往之􅐾出而周旋乎世故酧酢乎}
