  - {type: variant, offset: 6362, length: 0, content: '', WYG: 世想慕其為人忻忻然願為執鞭而不可得者徒以受人之財與金耳某也身處布衣之賤迹固抱關之陋困亦甚矣然幸不鼓刀市井為狗屠得以句讀訓詁為人童子師旦夕備甘脆養老母不啻足矣顧以年兼喜懼人子之心有不忍言者間託友人買山擬預營夀藏不意聞之執事執事不謀親友遂探私帑得錢若干緡介朱君犯炎暑風雨走横山購得之執事之義髙矣執事周人之義類此亦多矣執事讀古人書豈聞魏公子之風而興起乎然執事寡嗜欲薄富貴樂恬靜方將棄田宅挈妻孥入山林躬耕採藥蟬蛻穢濁以浮游塵埃之外使世復有侯生者流執事將無所用之然吾觀執事必不屑以魏公子輩自期而某亦豈敢妄以侯生之流自待㢤然侯生不以監門困故而受財魯連不以却秦有功而受金彼固皆天下之士也而某何敢望焉若夫聶政市販困汙之人耳卒不以母故而受人之金某自總角從父師讀誦詩書習聞前言往行粗知貴義賤利之說執事與某非有葮莩之親某于執事非有纎芥之勞徒以家貧母老念先事為備遂辱執事遺以山山之直雖不及百金然人有徳于其親則于金何有向也知貴義而賤利今也利執事之山而受之執事不暇顧傷惠而與某某又不暇䘏傷廉而取之執事且傷廉之事市販之人不肯為執事師古人學古道豈宜以某之故而被傷惠之名乎執事視財甚輕視義甚重然吾聞之義莫大于愛人執事愛人以徳而使某蹈傷廉之失而為軹深井里人所笑亦豈執事意乎今以山直錢若干并據文納上執事聽其言察其心歸其錢于私帑然後以據文擲與則執事之賜厚矣否則并其文不敢望􅈤􅈤之私惟執事諒之題跋書舒穆嚕氏家譜後昔金源氏代遼有國甞易其貴族之姓舒嚕為舒穆嚕氏其子孫䇿勛天朝散處四方率以武功顯若今雲南元帥存道公及平江萬户伯璣公是已然存道公甞將文衡于四川行省及其請于朝而復姓也故國子監丞莆田陳公衆仲序之甚詳今伯璣之姓雖未及復然其譜而存之豈亦有所待也夫凡其世次之隆勲伐之盛諸公論之備矣予獨推本而言之者盖亦表其姓之所自云爾書故御史鄭公從之嵩山五詩後右嵩山五詩故監察御史洛陽鄭公從之棄官學道之時手書其所作也昔漢梅子真為南昌尉數上書譏刺權奸不見納遂棄妻子去九江時人傳以為仙公當至元全盛時非若西都之季而時相用事非有元始專政之大惡其為御史又非南昌尉所可同日而語故以直道見機亦棄妻子著道士服為黄冠師終其身不還鄉里其去就之際視子真有甚焉者然子真之議論風裁先于漢書班班可攷千載之下尚想見其為人今公之所建明未知太史氏悉得書之與否尚幸其蟬蛻穢濁髙世絶人之概見于詩者真與嵩髙之氣相盤薄世之側媚取容持祿固位者聞公之風亦可以少愧矣雖然子真去後人或見其變姓名為呉市門卒者庸知公不與司馬子微之流往来人間乎吁顧安得而見之也書中書除目御書􅄆官後中書除目凡}
