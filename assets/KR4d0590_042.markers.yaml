  - {type: variant, offset: 6391, length: 5, content: 爲方來吿云, WYG: 將百萬之軍而怯不堪一獄吏榮為萬乘之卿相而辱不迨一匹夫此無它知進不知退也子等固非絳侯之倫然不幸而逮捕則}
  - {type: substitution, offset: 6391, original: 爲, replacement: 為, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-19875}}
  - {type: substitution, offset: 6394, original: 吿, replacement: 告, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-19642}}
  - {type: indent, offset: 6396, content: 　, id: KR4d0590_krp_042-bkkind1811}
  - {type: variant, offset: 6398, length: 0, content: '', WYG: 異使吾以向之侵辱絳侯者以侵辱子等獨不得金以貽父兄妻子乎顧義有所不忍也吾聞古之有道者祿以萬鍾位之上卿而不顧今吾徒一皂隸舍去繩墨質鈇之役而以虛無為本清淨為宗其自視雖不敢與古人之有道者齒然去就輕重孰與勇怯榮辱相尋于生死得喪而不知者嗚呼吾尚安用君之所餽為哉乃去入嵩山受隂符道徳南華諸書于陳鍊師居八年不與父兄妻子音問相接父兄妻子亦莫知其所在也洛陽之三井洞係故劉尊師鍊丹處道人遂因故址築環堵坐其中不出好事者或往候之亦不與之語獨見御史沃哷公允常環偉特達器識絶人心竊慕之而公亦喜其不務詭異之行誕幻之言以驚世駭俗因折節與之交公甞語之曰吾非好為是驅馳也以君親之恩未報耳他日倘遂吾初心則葛巾杖履相從于山巔水澨不難也道人擬闢真館于洛城之東謂之曰大夫進足以為邦家之光退不失于泉石之榮故曰功成名遂身退天之道後三十年當候公于此矣時予客公所因與道人善見其語黙止作不異衆人然不飲酒不茹葷而神全氣澤其中之所存覺有異于人者故予樂為之道也賛曰昔金源氏之時有健卒曰颵腿王者初不識}
