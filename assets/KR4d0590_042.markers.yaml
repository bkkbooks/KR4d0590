  - {type: indent, offset: 6361, content: 　　　　　　　　　　　　, id: KR4d0590_krp_042-bkkind1801}
  - {type: variant, offset: 6361, length: 0, content: '', WYG: 敷風日晴美其蒸如霞既穠且郁天發其葩灼灼麗姝爛雲錦以為居此豈避秦之子而彼美人者得以挹其芳而玩其華耶生乃止客取酒劇飲日且下舂俱藉草卧花下須臾月白風露在草樹間夜氣襲人生因暫起有頃復覔過客而客忽不見潦時水至生往率農人田于其野至暮而歸則聞有鼔枻欵乃于烟波莽蒼外者生乃謌陶淵明詩以和之然其人卒不可得而見或謂向者之客盖仙云嘻若生者亦豈仙之徒歟生好經史百氏與夫法書名畫古玩之屬左右羅列日與友人徜徉其中雖昏旦異氣寒暑時殊而水木禽魚之趣無時而不寓于目意有所適則發為詞詩間有傳于人世又若有幸生太平無事時粗以衣食有餘取樂于此者皆上之所賜然終莫知其為何如人也赤城樵者聞于夷白子因述而記之知還亭記西夏吉祥文卿謝官茶陵居洛陽里第扁其燕休之亭曰知還盖取晉陶靖節之言也翰林待制大梁呉公以小篆題其榜徵予文以記之夫以靖節之脫洒不羈博學厲操使出而致用則其效可以返淳風于千古振大雅于末季所謂羲皇之上者不止北窗之下矣不幸而遇衰世仕不足以屑其意則寧浮游塵埃之外以庶㡬夫不逺復之義夫豈其獲已哉今文卿生靖節不可得之時而又器局過人鳴珂曳組世有膴仕顧不乘清飈憑灝氣去而叅鵷鴻于九重友鸞鳯于阿閣而乃遺榮髙蹈浩然賦歸左右琴書沾沾自適是盖學靖節而過焉者固非流俗徇祿忘反者所可同日而語也雖然方今聖明在上求賢若渇非若彼時有一靖節而不為用自以山林有志之士莫不以功名自奮思有所樹立矧文卿家世顯榮年當强仕固宜以退為進不宜遽自棄也若夫優哉游哉聊以卒嵗庸伺他日未為晚也因書以為記至正七月六月朔旦書與沈存齋書昔者魏公子無忌食客三千人名冠諸侯及其為趙赴秦軍也無一人為公子畫策而謀却秦以存趙者獨夷門監者侯生生固不受公子財者也嚴仲子以諸侯之卿相不逺千里奉白金為軹深井里人聶政之母夀政辭之趙亡四十萬之衆不能解邯鄲之圍魯仲連以東海布衣掉三寸舌與魏將軍新垣衍極言秦帝之害秦軍聞之為却五十里平原君奉千金為夀不受而去嗚呼三子者或以謀或以勇或以口辯較其所為雖或未合于大義然其奮不顧身為人排患解紛報仇讎使天下}
