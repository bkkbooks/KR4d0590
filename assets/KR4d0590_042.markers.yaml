  - {type: variant, offset: 5994, length: 8, content: 嗇作奢三四後六內, WYG: 居盈而不矜持虛以守實主靜以制動以庶㡬于不溺此不泥彼而能與物推移者故予樂為之記也志靜亝記京兆杜徵君嘗過會稽朱子安民于呉門而題其所居之室曰志靜亝客有見而疑之以為子安方與呉人雜處于賈區中其丹樓畫閣鱗次而櫛比明珠文貝誇多而競靡者非金張之廛則陶朱之里加以以車服軒冕之旁午歌童舞姬之雜遝子安于此宜朝夕弊弊焉疲精神役心思計得喪較銖黍之不暇而其心之所之顧不在于彼而在于此吁此焉足以知子安㢤夫逃乎空虛形槁木而心死灰者舎動以求靜者也應事物而接人情跡闤闠而心山林者主靜以制動者也舍動以求靜其功足以善其身主靜以制動其效足以及乎物子安盖甞求隂陽五行于黃帝岐伯之書精工巧聖神于秦胡越人之術其用將以善身乎抑以及物乎夫及乎物不物于物也不物于物者非志于靜者不能也况子安之左琴右書何歉于金張筆牀茶灶何羨夫陶朱法書名畫之巻舒何慕于軒冕商彛周鼎之羅列何事于謌舞之左右則其不容一物于常惺惺之際者其亦主于一而無它適焉爾予懼疑者之終不釋也故為之記使書于徵君之亝以示之悠然亭記毗林錢君士元博雅嗜古世居馬跡山之内}
