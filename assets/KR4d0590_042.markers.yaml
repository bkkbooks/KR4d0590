  - {type: variant, offset: 5654, length: 0, content: '', WYG: 鷗浩歌擊楫江南去孰謂赤松非我儔淮陰侯廟慷慨論兵笑沐猴盡將生死付鄼侯手提漢鼎歸真主眼見黃旗出偽游此日王孫􅆰故國何年漂母葬荒丘英雄自古多遺恨腸㫁秋風楚水流渡江憶京師故人一别神京嵗已闌故人回首路漫漫淮南美酒誰同飲江左青}
