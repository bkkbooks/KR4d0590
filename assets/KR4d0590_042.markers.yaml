  - {type: variant, offset: 5871, length: 0, content: '', WYG: 力于畎畆暇日鄉之老者率其子弟相與誦詩讀書而其人皆知講說周公孔子以相尚予生九年而孤又九年出游四方不得安于田里以朝夕承敎及粗有知而歸先生長者多已謝世其遺風餘韻幸而可見者尚賴其詩之存盖予於雙谿而有得焉予既手錄其書乃從而嘆曰嗟乎古者天子之巡狩也太師陳詩以觀民風焉是以孔子删詩凡行役之大夫放逐之臣子閭巷婦女蒭蕘遺逸之詞悉取而列諸國風者將使人因其情性本其風土而觀其習俗之美惡政事之得失也周衰聖人不作采詩之官廢作者始自成家家自為法辭愈工而氣愈䠞世逾降而情逾偽尚何俗之可觀政之可攷哉故予厯觀近世之詩重有感于吾鄉諸老雙溪之作者盖以其發于喜怒哀樂之正本乎習俗風土之美歌詠周孔之言以敎其子弟親其親而長其長樂其樂而事其事遡而求之古詩之源可見也予以不得親登其門為憾又惜采詩之官未設序而藏之以俟知者送髙孟賔歸永陵後序古者男子有所事也其所事在于天地四方故其生也桑弧蓬矢以射天地四方者志其所有事也是故成童而敎先幼儀而後六藝既冠而成人則責以男子之事故三十則理男事焉男事理則可以出而行其志故四十始仕則方物出謀發慮五十則服官政七十則致仕焉然則人之生也無一日不敎其長也無一日而不學及其措諸事也亦無一日而非其所敎所學者是故近而君臣父子夫婦昆弟朋友之所以為懿詩書禮樂之所以為敎逺而天地日月星辰之所以運行風雨霜露隂陽寒暑之所以變化江海河岳之所以廣大皆其躬行寔履深明熟察而非有待于外者也故曰叅其化于天地而無悖行其道于四方而無惑男子之始終其所事不既備矣乎今之人則不然其所謂幼儀父兄不必知也所謂六藝老師宿儒不必能也而况于其所事乎况于無悖無惑乎嗚呼敎之不行學之不講亦已久矣士之生于斯世茍有志于天地四方以求其所事其可不自力乎是故弗敎則已苟敎焉非古之所敎弗敎也弗學則已茍學焉非古之所學弗學也茍敎矣學矣而猶有所未自信者則出而游于通都大邑天下人物之所㑹交于豪杰卓越之士以増益其所未至者焉然後求其所事于天地求其所事于四方其庶㡬不悖不惑乎余甞有志于是矣而未能致其力吾友永嘉髙君則誠博學而强識其弟孟賔將東歸海上盖所謂歸而求之有餘師者其行也將以是驗之孟賔之得於其兄者亦有以教我乎因書于末簡以致予私焉送申屠彦徳序祕書少監金華黃先生之宦游浙東西也四方學者各以本經来受業會稽申屠彦徳則以春秋之學以為髙第登先生之門也後先生稱彦徳不置口而某固願與之游及来呉門訪故監書博士柯公敬仲而彦徳客于其館始相識于是脩同門之好甚懽也方是時士罷科舉之習一時作者以古雅相尚而彦徳詩文一出爭相傳誦然日不廢三傳及諸儒所為說以研精宣聖筆削之㫖及賔興之制復行彦徳挾所有以往毎方出塲屋同輩谷以其文相示莫不推服彦徳而有司者顧屈之于乙榜僅以恩例署歙縣敎諭夫士之為學亦正義不謀利明道不計功而已故其得所願于時則進而行其志其未得所願也則退而求諸已茍去而奉􅇼豆玉帛周旋尼父之庭深衣大帶率諸生誦其詩讀其書于朱夫子之里則又有所不讓也且基常游歙矣歙之為邦在萬山中水清而駛故家遺俗喬}
