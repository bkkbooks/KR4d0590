  - {type: variant, offset: 5925, length: 3, content: 三前四, WYG: 友生徜徉于此或彈琴或簫鼔或賦詩飲酒而凡世間之榮辱得失不少置毫髪于胸中不亦善歟夫景勝則神超神超則理融進道盖甞學道而造于此乎使進道而果造于此則其充然自得于禽飛魚泳之際者殆與造物生生之妙流行于無窮盖無時不在綠隂中也豈特春夏之交而已㢤雖然陽徳方亨草木咸若進道得以仰事俯育之餘優游無事于亭以留連其光景于故園喬木之下者亦知其所事乎然則進道以綠隂為樂而吾黨又能執筆以陶寫其所以為樂者皆幸生太平之時也是不可以無述因書以記之}
