  - {type: substitution, offset: 5636, original: 游, replacement: 遊, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-17515}}
  - {type: indent, offset: 5637, content: 　, id: KR4d0590_krp_042-bkkind1605}
  - {type: variant, offset: 5637, length: 0, content: '', WYG: 關山雨足天無暑原野風高麥有秋永夜雲霄看不厭相從意欲問牽牛五月平原百草香泊舟高岸已斜}
  - {type: page-break, offset: 5637, content: '', id: KR4d0590_WYG_036-23a, image: WYG1222/WYG1222-0367c.png}
  - {type: variant, offset: 5638, length: 0, content: '', WYG: 河流浩蕩來西極山勢逶迤接太行墅老張燈風雨夕商人吹笛水雲涼共憐此地頻來往把酒長謌一慨慷河陰蕭條城郭河陰縣河水乗船似泛槎峭壁有人居洞穴平川無玉種桑麻滿天急雨寒欺客捲地長風夜走沙回首太行山下路豈無騏驥困鹽車昨夜關河風雨橫今朝凉思颯成秋沙頭浪湧千堆雪山頂人牽百丈舟願與王遵同叱馭不隨庾亮漫登樓君看平地風波惡積石猶應是穏流虎牢關連山回抱鬱嵌崟百戰英雄不可尋西極河流行地逺中州風氣入關深逢時豈乏留侯䇿事主難忘紀信心千古虎牢形勝地憑高回首一長吟洛口今朝鼓棹清河口即上高丘望孟津多情芳草似南國滿目好山如故人文愧陸機還入洛才非范叔漫游秦袖中獨有河清頌莫惜吹嘘上紫宸法王寺白雲相送度高崗行盡松聲到上方山掩地靈秋寂寂天開岳色曉蒼蒼石根藥采菖蒲秀林下經翻貝葉香乞取龍溪泉一勺仰松堂上禮􅆰王崇福宫西風吹老碧天秋䇿杖尋真處處游太室山前逢啟母少姨峯頂候浮丘穿林雲逐丹光起出洞泉和藥氣流白髪祠官談往事夕陽西去水悠悠承天宫四面雲開翡翠屏路隨飛鳥入青㝠巢由隠去山増秀申甫生時岳降靈露采松花秋}
  - {type: page-break, offset: 5638, content: '', id: KR4d0590_WYG_036-23b, image: WYG1222/WYG1222-0367d.png}
