  - {type: indent, offset: 6363, content: 　, id: KR4d0590_krp_042-bkkind1802}
  - {type: variant, offset: 6363, length: 1, content: 處, WYG: 人所賜􅄆官實仁宗皇帝親御翰墨為之書而故蔡國文憲公臣郭貫時由治書侍御史遷禮部尚書以從五品秩超授嘉議大夫而居其首一時氣象見于雲章奎畫藹然虞廷命官之意儒臣之寵未有加于此者盖國家以神武不殺奄有四海而典章文物至仁皇而大備鴻儒碩彦遭際聖朝並列庶位而臣貫尤以文學老成蒙被優擢如此書曰知人則哲能官人又曰夙夜惟寅直㢤惟清然則非仁皇之聰明睿智弗能以知臣貫非貫之寅亮直清不足以堪上命故其厯事三朝致位廊廟列于名臣豈非簡注有素而所積者厚乎嗚呼鼎湖之龍既逺九原亦不可作抱遺弓而悲風木者尚期以孝為忠思所以引而弗替云至正七年十月庚辰布衣臣陳基拜手稽首謹識書太古字說後河東運使髙昌拜珠公字太古中朝諸名公為文為詩以發明其義無餘藴矣復俾某一言以申其說某聞公曽大父鞏昌王大父安懿王咸以純一無偽之徳厯事累朝卒致端拱之治至公之父平章公季父御史祇遹先猷為世大臣而公又克承世澤致位通顯其在中臺為良御史行部為賢使者庸田司復著能聲而仕鹺臺也又稱一時之慎選然則所以紹其家業者亦豈外于純一無偽純一無偽者何太古之道也夫名者實之賔而字所以敬名也公方嚮用于時所以奮庸熙帝之載以光于前人則于敬名以稱夫實乎何以公尚勉之㢤跋學齋侍御張掖劉公洛陽懐古詩洛陽懐古書西臺侍御張掖劉公之所賦也公以學問政事方用于世而其為詩清新雅麗有則至以周公邵子為言則先儒之微意而知公之學有所本也刻而傳之豈惟洛陽之盛事而已哉跋張彦輔畫拂郎馬圖至正壬午予客京師而拂郎之馬適至其龍鬃鳯臆磊落而神駿既入天廏備法駕而其繪以為圖傳諸好事者則永嘉周冰壺道士張彦輔以待詔上方名重一時然冰壺所作論者固自有定論至於彦輔以解衣盤礴之餘自出新意不受羈紲故其超軼之勢見于毫楮間者往往尤為人所愛重而四方萬}
