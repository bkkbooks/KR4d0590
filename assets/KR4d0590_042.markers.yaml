  - {type: variant, offset: 5857, length: 0, content: '', WYG: 也勝匹馬向江東中牟客路茫茫日易晡白沙衰草下飢烏為詢今日中牟令曽有飛蝗入境無杞縣杞縣南來麥未青馬蹄無奈曉凌兢問君今日寒多少雨過園林盡未冰竹雀圖兩兩野田雀雄鳴顧其雌青春風日好來哺竹間兒夷白齋稿外集巻上欽定四庫全書夷白齋稿外集巻下元陳基撰序玉山草堂分韻書序予與玉山隠君别四三年聞其與會稽楊鐵厓遂昌鄭有道匡廬于鍊師苕溪剡九成吳僧琦元㙸日有詩酒之娛而其更倡迭和之見于篇什者往往傳頌于世而予也以汗漫之役溯河洛上嵩岳厯關陜北游而客京師度居庸計其所跋涉不啻萬}
  - {type: page-break, offset: 5857, content: '', id: KR4d0590_WYG_036-33a, image: WYG1222/WYG1222-0372c.png}
