  - {type: indent, offset: 5624, content: 　, id: KR4d0590_krp_042-bkkind1600}
  - {type: variant, offset: 5624, length: 0, content: '', WYG: 𤓰州題江風山月亭結屋高臨楊子津江風山月坐相親魚龍未欲烟波蟄鴻雁先驚關塞春有客貢琛來海島何人挂席上峩岷江心五鼓鐘聲動喚起扶桑日一輪送琳上人歸南岳高人二月歸南岳共向東風折柳枝萬里故山飛錫近一江春水渡杯遲碧雲不賦湯休句斑竹應敷帝子祠尚恐諸方㕘未徧葛洪川上重為期江上客舍曉來江上雨濛濛煙火蕭條客舎中風急最憐巢幙燕春寒猶滯寄書鴻紛紛洲渚魚鹽聚厯厯東南貢賦通萬里乾坤一羇旅濁醪今夕與誰同江上坐雨寄鄭山人蕭蕭風雨動經旬二月江城未見春鴻雁不傳天末信烟波愁絶渡頭人誰家楊栁啼黃鳥何處汀洲采白蘋慚愧江南庾開府暮年詞賦轉清新江邊二月東風鸎喚人踏青游女滿江濱栁迷楊子津頭路山掩潤州城裏春望㫁碧雲情縹緲歌殘緑水意逡巡無由一向江南去相伴汀洲采白蘋聞道聞道出師湘水頭東南賓主盛才猷勿令下失蒼生望實恐上貽黃屋憂雨裛漢旌休漫濕瘴深蠻峒未全收致身報主男兒事莫信平生馬少遊送人之南江南春水浴飛鳬栁葉半青楊葉疎送客又逢巫峽雨移家莫就武昌魚鷓鴣啼處難行路鴻雁歸時好寄書若過長沙逢賈傅憑君為我問何如江月樓中天樓閣蔚嵳峩良夜其如水月何雪浪逺從三峽至露華偏傍九霄多道人宴坐修禪觀游子登臨聴棹歌曽是水晶宫裏客倚}
