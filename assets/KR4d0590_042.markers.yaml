章陳氏豫章作南康二前十一無松梓梓作柏四前一至正十五年夏四十五年夏四月作乙月也未夏五前五賊復至無賊字賊大至賊作寇前十衆皆疑其詐無皆字公獨決聽之決作采後一公命訪其屍無命字後八盜弄庫兵掩我不盜弄庫兵掩作僣弄備神器撓後十一不動聲氣氣作色五前十求升斗之祿祿作粟前十二聖世所以食賢材聖世作朝廷二一一前十忻公咲隱忻作訢二前三治郡甚勞苦外過外過從作盍往散適從後八性之診之曰性上有請字後十故病蹷耳蹷作厥三前二侯不勁捍捍作悍四前一鄭林鄭作鄧步驟中鸞和之音鸞和二字乙轉前七信夫而留之夫下有顧字後七畀以今額畀作俾後十一兼同知無兼字五後八惟人實叅之無惟字後九是以爲秉彝無以字六後五參政元鼎公鼎下有脫歡二字後七親與士大夫大夫作卒後九道由淮楚由作經二三二後八九精於猗頓含菽縕親而親之安其孝也絮美於紆朱懷金飮水甘於列鼎縕袍華於佩玉三前五剏常平際留之倉際作濟前十二至正十年月空格作蜡朏二字後一落成於月於下有明年如三字月下有望字後十徙治要害地害下有之字後十二而神者無者字四前四庚寅月空格作暢朒二字後二心止於符乎符作無五後九孰得而禦之乎無乎字二四二前四故正己必以道己下有者字前七西門氏之於佩韋氏之於作萊蕪之前十一宜邇之事父宜下有乎字後三以有餘補不足足下有依乎中庸而已六字三後七太素靈樞樞下有內經二字四前四東埜之南榮東上有於字因名其軒軒作居前六乃其釣游之處也無之字後六知其植之之自自下有爾字二五一前九顧挈妻子顧作爰前十一室之內一上有其字後至不死之藥死作老後五而不知而作殊後九十以質之於有道者無於字云下有至云正壬辰玄月甲子八字二前十一以爲景蒙吿佛之吿下有也學二字徒有香嚴師者真知師者下有在松江殆竹者也四字三前四歲時來歸歸作登後一居高則體夷則神當重體夷二字鬯四前四余於張氏張氏作濟和前五吳興山水之國吳興作江南國作奥前十, WYG: 覽}
