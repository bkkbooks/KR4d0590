  - {type: variant, offset: 6150, length: 0, content: '', WYG: 三年仲秋日嘉樹軒記山隂朱君子安所居之庭有嘉樹焉天台陳基見而美之子安曰子亦知其樹乎夫方産于山林也莫不萌于尺寸而至千㝷為匠氏所知則取而用之為明堂為宗廟不為匠氏所知則老于丘壑而已或者又厄于山石困于巖穴䠞縮擁腫巻曲偪仄而不得遂其性否則病于戕賊欲効其用如柤梨橘柚而不可得均之為樹也而有幸不幸焉今斯樹之植于庭雖未必其為匠氏所取然亦逃于擁腫䠞縮偪仄巻曲與夫戕賊之患而愛䕶之仁均于造物溉灌之澤饒于雨露縱未能上干霄漢映蔽日月然視老于丘壑者亦或有間矣基聞其言而有感焉士之産于空谷有乘風雲之會佐時龍之運}
