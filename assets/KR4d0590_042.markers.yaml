  - {type: variant, offset: 5872, length: 1, content: 冰, WYG: 相望文獻有足徵者而其人於當世儒宗尤深慕金華先生之文足以發明朱夫子之道故以予之愚亦因幸先生而不見鄙夷于歙而况彦徳乎顧以朝夕之養不能一日舍去以後彦徳于歙而脩基之所不逮也于其行輒序以送之且以謝不敏于歙之大夫士云送鄭君舉游金陵序昔六朝之都金陵也當南北分裂之餘士生其間盖欲為司馬子長萬里之游而不可得庸詎知千數百年之後天下混一車書大同有如今日者而能文好游之士過其故都徘徊感慨以弔其殘烟衰艸之墟乎然秋髙氣清登石城而望長江西来朝宗于海而湘潭巴蜀之山雲影出没至于淮南艸樹青青如薺秦淮晴波縈縈如帶猶足以想見昔時龍蟠虎踞之勝固一時之壯㢤况大江而南物阜人繁天子命執法大臣臨而治之以至繡衣峩豸之英皆極一時之選寔東南人物之都㑹也而其所職又以進賢退不肖為務是以山林之士有志當世者莫不願與之交此永嘉鄭君舉所以有金陵之游也吾聞王良善御馬者也然非千里之馬雖良亦無所用其御矣今有千里之馬于此良其舍之㢤雖然游金陵者衆矣固有登髙覽古慷慨悲謌隠于桑樞甕牖以樂周孔之道有欲御之而不可得者君舉試一訪焉它日歸而為予道之送葛子充序金華周君子宦游呉門俄病暍而舌黒醫者以為不治其友龔君師徳更訪予里人葛君子充診之則曰是在醫書顧諸公不察耳以法治之隨愈周君既深徳子充因屬予序以送之夫醫固儒者之事也素問内經雖不能必其出于黃帝岐伯之手然五臟百骸脈絡血氣之在人身而與天地隂陽五行寒暑相為禪續消息其言至精而理至密盖去性命為不逺也秦和扁鵲倉公華陀之書雖不}
  - {type: page-break, offset: 5872, content: '', id: KR4d0590_WYG_037-11b, image: WYG1222/WYG1222-0378b.png}
  - {type: page-break, offset: 5872, content: '', id: KR4d0590_WYG_037-12a, image: WYG1222/WYG1222-0378c.png}
  - {type: page-break, offset: 5872, content: '', id: KR4d0590_WYG_037-12b, image: WYG1222/WYG1222-0378d.png}
  - {type: page-break, offset: 5872, content: '', id: KR4d0590_WYG_037-13a, image: WYG1222/WYG1222-0379a.png}
  - {type: indent, offset: 5873, content: 　, id: KR4d0590_krp_042-bkkind1666}
  - {type: variant, offset: 5874, length: 0, content: '', WYG: 見然張長沙論述于其前劉河間張宛丘李東垣發明于其後此數君子者皆以博學審問之功而造夫神聖工巧之域天下之能事畢矣故為醫者不讀劉張諸公之書則何以推明長沙之論不明長沙之論則何以通素問内經之㫖素問内經之㫖不察則夫所謂五臟百骸脈絡血氣與夫天地隂陽五行寒暑相與禪續而消息焉者何由測其微而探其頤㢤吁為是術者亦不易矣世之庸工俗師自號為醫為専門者不過以京局古方相授受而已求其如子充者豈易得㢤盖子充之醫本于素問内經上下于四三君子之書毫分縷悉以明夫天地隂陽五行寒暑之禪續而察夫五臟百骸血氣之消息其用心精且専矣猶以為未足則遍游四方博訪名公相與講究其所未至故其切脈計方譬之養由基之于射發則無不破的焉此周君所以深德子充也夫吾聞子充之事醫始以事親而終以濟人固未始一日而非儒者之事也然其活人亦衆矣何獨周君徳之乎夫貪功責報與夫背恩而反仇焉者固不大相逺然以醫自多而終至于殺人者聞子充之風亦可以少愧矣予既重周君之請又嘉子充之醫道本于儒者于是乎書嚴氏游靈巖詩序中呉以水為國而靈巖獨髙雲漢之表珠宫紺宇浮屠氏寔有之然琴臺硯池􅓏廊香徑所以資耳目之勝尚厯厯呉宫之舊憑髙而望則姑蘇之麋鹿茂苑之烟草逺在指顧中而天平之朝嵐暮靄太湖之風帆浪舸變化而出没者又近在履舄之下盖東南之偉觀也二月仲春嚴公景安與其族人子弟汎舟海上西行百餘里侍其季父来游時雨既降草}
  - {type: page-break, offset: 5874, content: '', id: KR4d0590_WYG_037-13b, image: WYG1222/WYG1222-0379b.png}
