  - {type: indent, offset: 5879, content: 　　　　　　　　　, id: KR4d0590_krp_042-bkkind1667}
  - {type: variant, offset: 5880, length: 0, content: '', WYG: 尺使民不得通其情迫于衰耄者帷知避害而趨利不復顧事之得失有能惠然以民之休戚為己任使其長吏不失譽于上而其民無怨讟于下則人之賢不肖何如㢤呉興趙君平甫試吏其鄉厯蘇州府史為杭錄事司及明象山縣典史今以都目選賔於越之諸暨州夫給事與三大府更}
  - {type: indent, offset: 5881, content: 　, id: KR4d0590_krp_042-bkkind1668}
  - {type: variant, offset: 5881, length: 2, content: 後八, WYG: 司一縣悉著賢能聲今去而之山水之邦佐其賢良之長而治夫淳美之俗攄其應劇之才而施之以暇裕將見其賢聲大行于越而著于東南其可施者當不止于一州一縣而已彼拘于刀筆牽于利害者豈可同日而語㢤于其行呉中善詩者咸謌以餞屬予為之序送李崇道詩序予客洛陽識李君崇道于御史幹勒公允常座中見其風神秀整舉止不凡意其為貴游公子也退而察其所職乃知其為儒家子用父廕而為河南司獄且三年于此矣予因益器重之盖河南隸土中而其民稱近古然自饑饉洊臻始有失業而麗于法者兼旁近山谷産物為白金亡命之徒相聚而冶于其間嵗不下數千人往往因利而競輒白晝相戕甚至血流洛水盡赤然則司獄于此自非老于事者鮮不以為難矣今李君以一命書生而年又甚少顧乃處之裕如不啻游刃于有餘之地者亦必有其道矣予甞聞洛人謂君廉而不矯惠而不近名民之逮繫者悉哀矜而善處之疾與之藥饑與之食寒暑為之備多出私帑久而不倦恒誦仁人君子存心濟物之言以自勉且曰氓之獲戾而至于斯彼固不幸也亦豈有司者之幸乎吾本吾公而已又遑恤其它鳴呼不亦善乎未㡬以秩滿將謁選天官洛人以其必顯庸于其時也咸賦詩以贈屬予為之序記萬壑松濤軒記郜君彦清宦游東南樂呉興山水之勝卜築弁山之陽而名其宴休讀書處曰萬壑松濤夫天地之氣噫而為風其始也發于太虛既而}
