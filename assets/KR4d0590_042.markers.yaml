  - {type: indent, offset: 5870, content: 　, id: KR4d0590_krp_042-bkkind1665}
  - {type: variant, offset: 5870, length: 0, content: '', WYG: 年丞相府選監修國史府椽史淮南施君克讓乘傳至呉慎其事也既竣事明年春戒遷薦紳大夫咸賦詩以美之意若曰丞相勲足以輔成王業功足以保衛社稷力足以制法成治而智足以尅敵出竒既登名太常則賞田之法宜有加無征此國家所以勸大臣丞相所以奉祭祀者也其使人于此豈直責以廩人之事而已哉亦將因此以視年之豐凶人之休戚益思懋厥功以埀休無窮也然則美克讓者非私克讓也美丞相之善使人也丞相使人不直責以廩人之事而事集此克讓所以為賢也方今丞相枋國立賢無方薄海内外士之負才實者並升中朝盖彬彬焉克讓年盛志銳而材又最良其從事相府也盖所謂生于伯樂之廏長于匠石之園矣其進而顯榮也殆鷙鳥舉而風迫之矣他日乘堅策駿鳴珂曳紱復以使事南遷薦紳之在呉者尚能捧巵酒為克讓懽以慶丞相之得士也至正十三年癸巳三月既望序送髙進道序聊城髙君進道侍其先大夫員外公寓呉最久公中朝夙望風裁峻整居家尤嚴肅進道兄弟侍立終日非有故不輒去左右當是時縉紳先生謝官于朝而休老于呉者相望然皆推公為前輩無日不相過從部使者及四方宦游之士道經呉率就造見戸屨至不可容于是進道兄弟雍容于揖讓樽俎間動中矩度而進道又特以博古好學雅為諸公所知間欲屈置椽曹辭弗就及公捐館一時諸老亦相􅁇淪謝其子弟往往通顯莫不交薦進道進道方僦居水竹間環堵蕭然貧寠日甚人以為難而進道讀書時為鼓琴宴如也今年夏廣西部使者不逺數千里移書来呉辟進道為椽史于是常所往来者相與具車馬勸進道駕而進道夷然若有不屑焉者乃相與言曰先大夫以閎毅正直之材有志當世不幸廢于疾及門之士資話言而往猶足以濟時善俗况進道以克肖之子朝夕奉先人之訓而周旋左右者乎然隠淪不仕豈先大夫所以有志于當世之意乎且經邦之道莫大于風紀而風紀之要莫難于得人今聖天子得賢部使者於廣西部使者又得賢僚吏於幕下進道行矣推事親之道以事君推脩身之道以治人將見進道無負于部使者而部使者無負聖天子矣于是勸進道行者咸賦詩以餞之而屬天台陳基為之序雙谿詩序予鄉去城百五十里而遙大率深山長谷土田之利薄嵗所入自供公上之外僅足以給衣食以故民無贏餘而得}
