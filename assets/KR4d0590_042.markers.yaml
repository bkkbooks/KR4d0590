  - {type: indent, offset: 6358, content: 　, id: KR4d0590_krp_042-bkkind1800}
  - {type: variant, offset: 6360, length: 0, content: '', WYG: 間雖韋衣之士有所不及也世言三代為將道家所忌然鄧禹將百萬之衆未甞妄殺一人自謂必有興于後世者累世寵貴果如其言方國家經營四方神武不殺君上世以忠事君克有樹立成平既久子孫祇承世祿以孝事親上棟下宇俯仰無怍引而弗替崇勲之澤駸駸乎其未艾也彼若考作室既底法厥子乃弗肯堂矧肯構者亦可以知所愧矣至正七年五月甲子記之桃源小隠記界溪距呉城之東五十里其水深廣其土肥衍民有耕于其上者自號界溪生人從而稱之而不及其姓甞讀晉人所記桃花源而慕之且曰安得若人者與之游乎于是環其廬皆種桃而扁曰桃源小隠客有過而為之賦者曰仲春之月桃}
