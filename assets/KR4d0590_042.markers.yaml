  - {type: indent, offset: 5867, content: 　　　　　　　　　　　　　　, id: KR4d0590_krp_042-bkkind1664}
  - {type: variant, offset: 5868, length: 0, content: '', WYG: 人之處于是者僉以為難而君也佐煩夥之邑不急以民不緩以僨事居勢偪之位不嫚以長傲不阿以辱身三年之間不强民以敬而民敬不徼民以愛而民愛不要民以思而民思嘻善之足以動物也若是乎君顧不以習聞于家庭者為己足周旋于朝夕者為己至而諰諰焉若將益充其所以孝所以忠與夫弟且信者以雲漢為康衢朝廷為熟路而其所謂不負丞者未足為君頌也然詩者所以宣有徳序者所以紀其善呉之大夫士于君亦厚矣故予不敢讓而樂為之書送施椽史詩序國家世臣賞田多在呉嵗有廩人之事則遣使督之至正}
  - {type: page-break, offset: 5868, content: '', id: KR4d0590_WYG_037-4b, image: WYG1222/WYG1222-0374d.png}
