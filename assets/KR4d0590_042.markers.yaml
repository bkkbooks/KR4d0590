  - {type: variant, offset: 3544, length: 1403, content: 人云作古世家舊族舊作右卽有入空懷寶無卽字懷作探後四五厥躬退藏於蜜無厥躬二字蜜作密下有之志二字後七由天台鴈蕩無此五字職此可徵職作觀後八吁夫豈偶然而已無吁夫而已四字哉服師之服居師之無此八字居甲乙之傳乙作剎後十因恆之請而爲之無因恆之請而五字書其末也其作抑後十一是歲七月旣望無此六字四前三舊邑澉浦舊作屬前四有司防禦防作備前五勇果果作智前九怙終稔惡終作强前十二鹽筴之正正作征後十幷勒之石之作諸二七一前八厎厲激卬厎厲作砥礪前九讀書之舍舍作齋書紳齋無齋字後四循之如榘彠榘彠作矩矱後十一審度於榘彠榘彠作矩矱二前一以行蠻貊者無者字皆書紳書下有諸字前三在於言行之間而無矣字已矣三前十二作諸佛寺寺作事後一文書訥拜淮南行訥下有適字省後九寫銅像銅作斯古者古上有嘗考二字四前三蓋無所祈穀實所作非前三聖天子養天作世五後一公懋賢懋下有之字二八一前八歲方冬方下有隆字後八室屋之敗者屋作廬後十二掊刻之􅖈􅖈作孽加以武斷之斧斤武斷作戕斵二後十皡皡齋無齋字子幸爲吾記之無幸字三後八以爲季周吿云云下有至正庚子辜月朔七字後十一螟􅏑賊蝝􅏑作蟊四前一終歲之勤勤作功前七夭死死作閼後三滎腧滎作榮後五穎者實堅者好焉者作而實二字二九二前九三咲之外矣無矣字後三分治吳下下作中後九不逮吳下時無下字後十二幸爲吾記之無吾字三前五唐中興唐下有室字四前九猶嘯猶作亦嘯下有嘯乎嘯乎四字伯剛自處剛下有所字後十一非禮學學作樂六前十一余則爲之無則字後一旣已有其所貴無已其二字後二而猶不忘其所賤無所字後七僅存於百戰之餘無者字者後八所素抱負者無所字三十一前十一李君德真無君字一戊申戊作庚五前十亦同其心而已矣無矣字三一二前五自勗云爾無爾字前九爲苗􅖈者􅖈作􅖈四後六積雪至膝膝作腰三三一後一寺廟亦廢寺下不空格後六至正正作元後八張公空格作某後九張公鎭杭空格作士德二前一文烈烈下有伯字後一王父子王上有於字後四尸而祝之無之字後五歷代賢聖賢聖二字乙轉後七倂刻之之下有俟祭歌以侑爵六字三前三究厥施究作寵後九尤善古賦善作喜五前十二適葛大裕無大字後一稷穆穰稚种無稷字穆下有秩字後二來乞銘乞下有予字後八姪天騏壙銘騏作麒壙下有志字六前七明年月日空格作八三兩字委之委作萎七前一表先君子墓者表之者欲表先德三四一前十一大小方圜圜作圓二前十亦視義而後受視作相後二撫兄子子下有弟子二字三前十四十年四作三五後一所不苟取者取作玩三五一後六臨難而辱國而作以三前二徐君孟達壙銘無君字壙下有志字外集一前九妾薄命薄命妾前十一十八許隣里八作六二十會葭莩二十作十八後四乾坤大無垠大作浩憑高騁遐觀遐作遊後十一十二惟願各弩力願作思弩作努二前三奈何至中葉至中葉作中葉來前九薄酒不堪飲不堪飮作難過唇何以銷我憂我作羈後二不覩主人面逆旅未覿面返遭邑犬怒獰厖忽噑怒僕夫亦已疲疲作痡後三已飽復何慕已作旣何作奚後七苦厭天地窄天地作覆載後十頻歲値大水大水作天潦三前二三荏平荏作茌前七薄暮至穀城至作抵黃石去已久去作翁久作邁前八從横從作縱卓哉張留侯留侯作公子視秦如孩嬰秦作嬴前九莫敢爭爭作攖取公履公作翁前十徘徊撫松柏徘徊撫作延竚對後一紆餘餘作徐後三晴旭生木末生作吐四前二桑田眇何許眇作渺前三乘間作盜賊盜賊作鼠狗前六一昨始入舟昨始離夾溝前九文章與元氣與作卽後二躋攀上平路平作車後六誓志如金石如作類後八爲舅作衣裳作作製五前六靈草毓三秀草作芝前九仲也復爲邑復爲作陞宰前十共下白玉墀下作拜河水昔橫溢昔作近前十一十二坐令齊魯俗化爲無此十字蠻與夷後九素娥一何好好作情六前五, WYG: ''}
