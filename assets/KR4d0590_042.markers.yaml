  - {type: variant, offset: 5639, length: 0, content: '', WYG: 釀風翻蕊笈夜談經何當結屋蒼厓曲手植菖蒲九節青轘轅逺游重到洛陽城又向登封道上行路入轘轅秋更險雲收太室雨初晴千重灌木漫山碧百道飛泉繞澗鳴欲訪巢由渺何許􅆰餘潁水照人清嵩高厚徳巍巍鎮土}
