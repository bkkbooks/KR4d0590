  - {type: variant, offset: 5858, length: 0, content: '', WYG: 里方挈挈焉觸寒暑犯霜露之不遑又何由持杯酒濡翰墨詠謌揮洒以厠諸君子之列耶今年孟春予還自北方隠君首以書見招過草堂為旬日之留于時鐵厓去講春秋于松江泖澤之上有道隠居呉城天宫里元㙸亦歸天平之龍門而九成則出入漕臺執文櫝以理公家之務朝夕與予為侣者主則隠君客則鍊師也予竊念三數年来馳驅辛苦幸而来歸而隠君能以水竹琴書相慰藉而諸君子者乃出處不齊不復如疇昔雅集之盛方俛仰寤嘆慨然興懐而豫章熊松雲婁江陸良貴適至隠君乃列綺席設芳俎于碧梧翠竹間相與投壺雅歌飲酒懽甚且即席賦詩而以碧梧棲老鳯凰枝為韻予探得老字餘則各有所屬詩皆成獨松雲子飲酣長嘯上馬馳去分得棲字不賦云尊賢堂分韻賦詩序玉山髙士世為中吳巨族居崑山界溪之陽其先君子好道家清淨之說甞以所居為真館髙士嗣葺之年未及老輒委家事于其子退治一室環以水竹中蓄琴書圖畫古玩之屬而扁其堂曰尊賢徜徉宴息意泊如也髙士少負竒才既不屑于用世乃取黃帝老莊之書讀之而奉釋氏不殺生之戒惟謹毎遇生辰輒不茹葷不飲酒杜門却掃焚香清坐嵗以為常今年孟春予過其堂適值其謝客之日以予辱有雅故且婣故獲與觀其長幼登降儀容之盛髙士子仲瑛晉道皆能文而好禮而其孫元成則又予友于君彦誠之髙第弟子也相與舉觴稱慶禮畢有頃姆抱三嵗兒奉巵酒跪進髙士前芝蘭玉樹未足以喻其秀盖髙士之曽孫也于是髙士命左右實俎豆潔罍􅕌相與為文字飲髙士既懽甚而其子若孫班班就序長者舉觥少者起舞髙士亦忘其為尊且老談笑之餘發為謳歌至夜分不輟于是仲瑛請􅀆韻賦詩以紀其事予竊以為髙士享有五福樂及孫曽顧不為其所得為而乃味道徳之膄享仁者之靜守之以儉行之以慈而仲瑛昆季又能窮行孝弟以志為養則其度越流俗豈不萬萬哉因以洪範所謂夀福康寧攸好徳為韻予得康字既為之詩又為之序云送長洲縣丞歸詩夫裒衣峩冠乘堅策肥馳騖仕宦之林而有貴夫世之佳公子者盖以其習聞于家庭者非忠於其君則孝於其親也非弟于其長則信于其友也其周旋于朝夕則威儀之度進退之容射御之文應對之節又皆可以莅官而臨民者也使之出而從政殆猶駕熟路之車騁康衢之駿而予也則于長洲丞西夏遷家訥君見之盖君之上世鳴玉紆組埀休著烈代不乏}
