  - {type: variant, offset: 5576, length: 4, content: 十二後二, WYG: 將餘論擬潜夫興慶池層城佳氣日高浮花萼樓臺在上頭鶴駕六盤猶避暑龍池九月未知秋青山排闥當窓見金水飄香入地流麋鹿不收瑤草碧太平恩澤滿秦州陳留人物東都迹已陳行過古邑為逡巡石經毎愛中郎字墊角猶傳處士巾曠世逸才名在耳百年明哲道全身飄零笑我成何事}
  - {type: page-break, offset: 5576, content: '', id: KR4d0590_WYG_036-19b, image: WYG1222/WYG1222-0365d.png}
