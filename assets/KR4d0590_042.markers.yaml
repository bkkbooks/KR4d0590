  - {type: variant, offset: 6357, length: 2, content: 茲茲, WYG: 為子孫者如文英廷方之不忘其本居風紀者如沃哷君之惇尚古道李君之知所勸相為有司者如郭董二君之克恭所事則萬安之松楸將人人為之封植益久而不廢尚可斧斤耒耜之為患哉公父子世濟忠貞太史有傳神道有碑家世有乘載兹不贅書特書其復塋嵗月為將来告云是嵗丁亥十月丙子記崇勲堂記遼之右族厯金入國朝惟舒穆嚕氏之後為最盛支分蔓衍散處北南若河南都府所屬千夫長元善君者其一也君上世佐太祖皇帝起朔方駿功偉烈不克殫記逮世祖皇帝平一海内受命武臣分鎮天下要害處顧惟河南地廣以逺且屬四方之中昔人所恃以為金城湯池者雖鞠為荒壤然表裏山河自若也故既立萬夫長俾元勲總蒙古軍世守之又以虎符金章職長千夫授君上世其責任不亦隆且重哉此其所以先大父即所居之堂而名曰崇勲也今年夏五月予與御史沃哷君允常過洛水之南遙望里第喬木叅天穹墉傑屋巋焉其中及至君衣疏布出肅客無毫髪貴介習于時方居先夫人之憂而先大夫即世久矣升其堂見埀白老母坐堂上則君之祖夫人也因相率舉酒為夀有頃君之女出拜客禮畢退立太夫人之側婉淑有度又頃之姆抱幼子甫三嵗秀目廣額楚楚不凡則君之子也坐定太夫人從容問勞悃悃欵欵精神氣貌如五十許人時已年八十有六矣樽豆既設君周旋降登上奉太夫人下接賔客而懽忻愛洽之情藹然于威儀動}
