  - {type: variant, offset: 5652, length: 1, content: 李, WYG: 不妨攜酒獨登樓彭城關山嵗晚日沈陰獨上彭城思不禁河水東來非禹蹟民風南去拂淮陰英雄已堕陳平計志士徒憐亞父心自古人臣難去就悲謌一曲倚嶔崟吕梁扁舟又向吕梁舟浩蕩中流看翠微濁浪滿河冰亂走黃雲垂地雪交飛本身誤叱王遵馭涉世頻沾阮籍衣日暮不須吹短笛沙鷗猶恐未忘機邳州邳州城下片㠶收滿眼山川生古愁人間客子復來此圮上老翁何處游青雲無路逐黃鵠滄海有波隨}
