  - {type: variant, offset: 6399, length: 0, content: '', WYG: 一旦舉筆成章時人以為得道稱之曰王先生平章趙公閑閑名重當世尤雅敬之今道人之出處大畧與王相似而允常公之學問政事與夫功名未艾視趙公可以無愧且有急流勇退之志焉故予並著于篇以伺云哀詞葉孝墅哀詞並序葉孝墅世居天台少孤雅志好學既冠游京師見項君子虚虚與葉氏世有婣好而孝墅執子弟之禮惟謹相與甚懽子虛儒者而隠于黃老以醫名京師京師之人無貴賤賢愚皆稱重之孝墅與之周旋應接竟日不倦而能安淡泊服勤苦聲色勢利服玩宴樂舉無所嗜獨尚儒術善楷書好醫藥煉金石草木為丹劑號精絶不輕與人子虚甚器重之孝墅既蚤失父母幸有兄弟然皆未有子去年兄若弟俱喪訃至孝墅哀慟嘔吐仆地頃之復蘇然竟以是不起子虚亦知其不可救而生之之心未已尚恐已術或弗及欲延訪他醫孝墅曰使世無良醫則已如有之豈復有賢于秦醫緩者耶然膏肓之疾雖緩有所不能為公今之緩也吾之疾公且莫之為况他醫耶夫人窮則呼父母吾真呼父母矣公如吾父母顧力有不能者豈非天耶獨念吾兄弟無後吾死亦無後吾宗亦何至是耶是亦天耶吾之命信懸于天矣尚何言耶尚何言耶嗚呼何其言之悲乎始余居里巷時聞葉氏世有令徳及與孝墅友又信其為佳子弟俱留京師見其取與之不茍言行之有度未甞不與子虛稱之而人亦莫不稱之也意其必有所恃立克享前人之徳乃今不幸而兄弟相繼以死夫有佳子弟如孝墅而不克夀世有令徳如葉氏而竟無後此天道之所不可必而君子之所以深哀也故為作哀詞世之知孝墅者固已同於哀矣其不知者尚因詞以見之其詞曰爾車非不利兮又循循其擇路既膏舝又挾輈兮馬驤首其欲騖朝出門兮以就軌夕亡輻而失馭何殃慶之不以其類兮俾若人而弗禄生何恃而何怙兮死曷往而曷歸尚魂氣之流通兮覽舊邱而下之哀若人而不可復見兮耿予懐而増悲夷白齋稿外集巻下}
