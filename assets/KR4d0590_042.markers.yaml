  - {type: variant, offset: 5655, length: 0, content: '', WYG: 獨自看滿目波濤紅閃日中天樓閣翠生寒吳關入望庭闈近欲問飛仙借羽翰草堂隱君家住玉山阿新築茅堂繞薜蘿翡翠飛來春雨歇麝香眠處落花多竹枝已聴巴人調桂樹仍聞楚客歌明日扁舟入州府不堪離思隔滄波碧梧翠竹堂玉山窈窕地仙居翠竹參差問碧梧夜靜簾櫳人度曲春深庭院鳯將雛瑤華散席侵棋局瓊露分香落酒壺見說秋來更瀟洒四簷虚籟雜笙竽漁莊何處林塘好卜鄰清江繞屋淨無塵定巢新燕渾如客汎渚輕鷗不避人楊栁飛花香作雪鱸魚上釣白于銀春風無限滄浪意欲向汀洲賦采蘋次韻答陸養正幽居瀟灑傍溪湄雅好惟收魏晉碑千樹好花閒對酒一簾春雨細論詩耽書爾欲師𤣥晏鼓棹吾將學子皮滿地緑陰春寂寂永謌伐木眇予思留别錢伯行落花時節下江潯掃榻相延竹滿林盡日雄談驚四座百年高義重千金挂㠶南浦春風起剪燭西窓夜雨深别後相思隔城市五湖烟樹碧森森留别陸養正我愛陸郎才思清新詩落筆使人驚不材謬忝為師友高義多慚若弟兄江上烟波催去鷁雨餘春樹亂啼鶯定知明日􅆰齋裏坐對停雲憶士衡送于子都赴陜西同知公子承家列俊髦尚書奉國著賢勞棠餘分陜千年樹水落洪河萬頃濤地勢下窺崤黽固天文西入斗牛高關}
