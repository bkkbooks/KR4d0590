  - {type: variant, offset: 5859, length: 8, content: 作賢才日死作死義, WYG: 而君因其先大夫之澤効官倉庾而来也始則人敬之終則人愛之去則人思之胡為其能爾哉盖長洲為邑麗于大府賦夥而訟煩丞之為職所以貳令位美而勢偪}
