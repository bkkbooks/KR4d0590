  - {type: line-break, offset: 0, content: '', id: KR4d0590_SBCK_035-1a01}
  - {type: variant, offset: 0, length: 1537, content: 夷白齋藁卷之三十五臨海陳基著金華戴良編祭文祭故平章榮禄張公文嗚呼謂天無為而生公耶則公之噐量超乎䓁夷謂天有為而生公耶則公之志業不冝遽止扵斯夫力足以任天下之重而明足以燭事理之微竒謀足以坐制千里之敵而英略足以立决兩陣之機卑譲足以延攬四方之俊而威武足以雄驅百勝之師㤙信足以得三軍之死力而仁勇足以拯萬妵之顛危而天不假年痛罹此極使千尋之木弗能扶大厦之傾萬斛之舟弗克濟蒼生之溺此天者之所以不可必而君子之所以長吁而太息鸞鳯豈不祥扵梟獍麒麟豈不仁扵虎狼蛟龍豈不神扵螻蟻稂莠豈足侔扵稲梁今妖鳥得以賊祥禽醜􅖈得以辱仁類蠕動得以制介族之長惡草得以為良苗之害豈天未厭亂而仁者不必夀耶抑民之無禄而淪胥以死者不必救耶何公之不幸一至扵此而天之蒼蒼竟孰尸其咎耶然公能以貴下賤而不能屈身以從賊能以仁伐不仁而不能臨難而辱國能厲聲罵賊而不能與之俱生能視死如歸而不能食不義之食盖公之生也民有父母國有股肱公之死也豪傑失倚賴君子失依慿獨忠肝義膽通神明而貫金石英聲盛烈掀天地而震雷霆上可以争光扵曰月下可以垂休扵汗青此所謂沒而不朽者在公可以無憾矣然復讎之義不舉則終天之恨不平四郊之冦壘不除則九泉之精爽不寜某䓁之所以尤痛哭流涕而不能自已者以首見招扵舘下繼辱薦扵朝廷義雖均扵僚佐㤙難忘扵死生既不能漆身吞炭報知扵國士又不能奮推操匕以効死扵賊庭惟鞠躬盡瘁恪勤扵王事夙興夜寐勉強以力行臨風一奠盖上為軍國慟而下以哭吾黨之情祭斡勒㢘使文嗚呼哀㢤公止斯耶豈天惡正直神好詭随耶讜言無避者恒不利扵世而秉心忠亮者不必期頥耶将蒼蒼者不足信而吉㓙禍福𥘉莫知其所尸耶公之剛膓疾惡得扵天者獨厚及以言得罪戾扵人者又何其顛且危耶如使正色以立朝眀目而張膽則英風偉烈夫豈𥙷其闕而拾其遺耶及權倖誤國是非乃明而天不假年果孰嗇其施耶豈謇謇匪躬者道不昌皎皎不汚者數必竒耶凡有識之士莫不聞風而扼腕况某也辱知扵公又特殊扵䓁夷耶託交二十餘契闊三千餘里始終䟽數如一朝夕豈非生同年學同業而道同師耶持莭南来庶㡬相見以慰離索又豈非以一葦可杭在浙水之東西耶豈期一疾不𧺫遽罹此極而終天永訣孰謂魂氣無所不之耶夫忠義足以正風紀氣節足以厲㢘隅此所謂沒而不朽者将百世以為期耶頋親老子㓜而琴亡人逝然質之天道則仁者有後固不可得而欺耶某也義當匍匐撫棺就次以哭知已之私念竊忝王官駿奔戎旅所不能自致者死者豈必無知耶衘哀致誠往伸一奠天乎痛㢤孰使泣涕之漣洏耶尚饗夷白齋槀拾遺故徐君孟逹壙銘吴人徐君孟逹諱元震世居常熟之虞山考諱敬故益陽知州妣虞氏封東海郡君初益陽府君之官于朝也君以俊造㳺成均為博士弟子員精敏竒偉最為府君所鍾愛故徽州路儒學教授甫里陸公徳元時客京師嘗見而奇之元統𥘉府君出知眀之昌國州需次里中君以佳子弟出入府君左右進止不凡教授公見而喜曰此子真千里駒也吾屬意久矣遂贅以為壻陸氏家素醇儉教授公尤慎重務以詩書承家君既贅事教授公如事府君先意承顔委曲備至且以時莭省府君扵昌國尋遭郡君之喪哀毀盡禮居乆之教授公捐館君獨以身任遺孤之責􅍖抱扶持俾娶且有子而陸氏之業因賴以弗墜人謂教授公有後君之力也及府君以疾終益陽君迎柩歸常熟之先壟親戚賔友送車雲集凡塟祭百需視力所得為而哀禮兼盡君俶儻有卓識雅重然諾樂赴人之急遇事立決㡬警絶人而以仁厚将之雖委身閭里不屑仕進而其英風駿望偉然於搢紳公卿間與人交不以䟽數為厚薄臨財不苟惟義之所在方復營别業扵松江笠澤之上聚書教子歲時伏臘幸粗有餘将与所知優㳺卒歲俄一疾不𧺫遂以至正十五年七月七日卒扵家得年四十有七妻名仲端有婦徳子男二人長曰𬗟湜毅好學次曰朂幼而克肖女一人適同郡曺玄越七日丁酉𬗟奉柩葬扵吴縣靈巗郷陳灣東横山之原嗚呼君託人之孤急人之急刻身謹行始終無怍而天不假年夀不稱徳此君子之所以哭之之慟也臨海陳基辱知君特厚義當銘其壙銘曰維孟達父世呉人有寸弗施善其身託人遺孤力千鈞之死無怍勒貞珉有孔勿替在後昆, WYG: ''}
