  - {type: variant, offset: 1807, length: 0, content: '', WYG: 躡雲根栖顥氣而洞庭之峯巒姑蘇之臺榭皆在指顧中親庭一室蓋可朝徃而夕返也未幾季野北㳺京師余亦泝河雒上嵩岳過秦漢之故都訪鄒魯之遺迹復自鄭浮孟津道河内踰汲郡逹燕趙與季野㑹炊不暇熟又復度居庸出雲中涉灤水抵上京校其所歴亦可謂逺矣平生故舊獨我兩人相與為休戚闗山蕭條僕馬悴瘏而心神夣寐未始不與白雲相徃來於勾吳中也去年冬予還山房今年夏假館笠澤而季野方備宿衛於内廷仰清塵於警蹕蓋未獲相從於某丘某水之樂余毎獨與其賓客一二人登其樓挾飄風於寥廊撫夷曠於川原而季野之英標逸致宛在眉睫間蓋余與季野齒同志同道又同而去就有不可得而茍同者則亦各安其所遇爾乃為賦飛雲樓詩一章以自見且書以寄季野使知余登臨而有夙者之思也詩曰樓居何所曰惟雲只余也何思曰惟親只我居我處與雲上下朝吾出㳺夕反親舎雲乎天飛子也中路顧瞻山河蒙犯霜露匪雲則飛實心之馳匪心之馳實親之懐我登髙丘望彼逺海歸歟親庭胥樂壽豈安素堂詩序安素之時義亦逺矣日月星辰安素而麗乎天河岳丘陵安素而麗乎地君臣父子夫婦兄弟朋友安素而麗乎人日月星辰以明為素河岳丘陵以静為素君臣以義父子以仁夫婦以别兄弟以序朋友以信為素日月星辰安其素則天道清河岳丘陵安其素則地道寧君臣父子夫婦兄弟朋友安其素則人道順日月而薄蝕星辰而失度河流而逆岳鎮而動丘陵而變遷君臣而疑父子而離夫婦而亂兄弟而乖朋友而詐則天變於上}
