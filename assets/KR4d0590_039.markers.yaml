  - {type: variant, offset: 0, length: 709, content: 夷白齋稿𥙷遺目錄樂府詠歸操玉山辭為頋仲瑛作望仙詞為陸叔陽道士作呉儂謡逺歸曲離倫婦群珠碎傷呉帥潘元紹衆妾作俠客行從軍行古詩五言京回徐翁招飲園亭秋曰鄭明徳林居分題劍池送夏副樞分得萬字送王副樞送髙郵縣尹何士敬送謝元功訪北寺無言講主小丹丘對雨懐元功大掾玄懿大魁興懐寄元善經歴敬甫郡司與戴叔能㳺寳積山寺宿西方丈次韻張士行陳庻子天平山中三題詠楊山人號山隣別周文逹錄判竹里子伍大夫祠官祭作九月十二日感懐示姪麟柳胥古詩七言送髙元善太守赴任杭州宋劉凝之騎牛圖虞克用山居圖西老園圖本長老秋山圖詩巢提兵餘杭作桂珠謡律詩五言送梅同知任杭和庻子學士靈巗山即事二首律詩七言次韻懐華㓜武送馬易之代祀海岳次韻謝叅政送錢㕘軍秋日與張士行㳺虎丘送劉郎中山中與戴叔能對榻登呉横山望東洞庭登楞伽石湖上觀音巖石湖與戴叔能同舟懐雪坡大叅至正乙已四月廿七日與家兄上冡石湖洎逰諸山二首舟中與家兄叙別聞庻子遷城居送嘉定偰知州歸呉送信道元還呉興楊墳寺長律春日泛石湖絶句古意採桒女天屏山龍門靈巖山琴䑓支硎山寒泉花鹿山石屋夾浦石塘石門画江邊梅陳惟允畫夢醒渡江過石湖登楞伽五月調兵赴杭嘉等䖏四首雞冠次韻虞隱君堪潘閫掾糓雨中見寄十絶謝沈仲說送酒次費圜韻送江西丁省郎赴京奏捷本長老紅蕉圖劉司馬山居至正乙未志異九月十日也由范荘過天平至南峰放鶴亭予卧病呉中家兄命從子慶来省巳因㱕賦此送之憶横山親墓石湖僧舎二首賛戴九靈先生像賛雜著郷飲田刑平編志頌沈蘇州評華莭婦序通鑑續編序送張州尹序送虞勝伯序送劉廷傑序和靖先生年譜序送鎦治中詩序贈盛㫁事詩序送邵同知序送湯都事序送張徳常序送禇士文序記呉縣脩學記常熟州脩學記守約齋記小丹丘記墓志銘鄭國公并夫人合葬墓志銘王處士墓志銘傳傅古民傳夷白齋稿𥙷遺目錄, WYG: 鄉}
