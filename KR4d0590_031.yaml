front:
  text: 夷白齋藁卷之三十一
  hash: sha256:c17c53c32fa8a21472ce350a6e82ebec23a6f516a875da99b98e226c75f394c7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_031-1a}
body:
  text: 臨海陳基著金華戴良編記退思齋記會稽蔡君彥文由諸生起憲曺歷郡漕史辟掾行中書擢江浙行樞密府為都事所至以材諝賢勞著稱蓋三十餘寒暑矣今年踰五十經儒緯律師古不少懈敏事力行未嘗擇利害及退而思則又未嘗不拊躬自訟者其自刻勤篤概如此嘗讀書至晉士貞子所稱荀林父之事君也進思盡忠退思輔過因歎曰此春秋之賢大夫所以為社稷之衛者乎吾雖無能為役嘗受教于君子矣乃自題其藏修逰息之處曰退思齋以余辱有一日之雅俾申其説而記之夫士之為士也孰有大于事君者乎其所思也孰有先于君之事乎思者何思所以獻其可而替其否也君好賢吾思進之惟恐其或不先也君好佞吾思逺之惟恐其或後也君惡諌吾思犯之惟恐其或隱也君喜讒吾思去之惟恐其或弗亟也充此類也亦可謂盡忠矣于是退而思曰吾所進果眀且哲乎吾所逺果便且巧乎吾所犯果直道而所去果變白為黑易是為非者乎吾輔過也類此其殆庶幾矣又退而思曰吾責難于君者欲其盡君道也吾盍盡其道乎君有闕吾思盡其忠矣吾有闕將孰盡乎吾師古人焉爾此彥文之于林父所以善師古也善師古者無它亦拊躬自訟而巳然余聞之賢不肖異思彼思招人之過以為直利口捷給以為辨從臾比周視喜怒為毀譽以為智此所謂小忠大忠之賊也林父疾之如仇讎賤之如禽犢惡之如鬼蜮如虺蜴者也彥文之所以勉其在此而慎其在彼朝焉而兢夕焉而惕閔閔焉不遑啓處者蓋將奉以周旋盡忠社稷師古之力也詩云髙山仰止景行行止書以為記非徒以私彥文也亦將以自朂云爾至正二十年五月甲子記志學齋記士之志學猶農夫之志于耕焉易其田疇修其強畔先之以耒耜申之以耰鋤而參之以錢鏄時其農祥晨正以樹藝之凡庶草惡莠非其種與夫百螣之為苗􅖈者耘耔之茠刺之勿使滋且息焉然後榖之庭者碩堅者好而蒸嘗薦饗衣食之源不匱詩云曽孫不怒農夫克敏甚矣學之有類乎耕也古之聖人無不學堯學乎尹夀舜學乎務成跗文王學乎師尚父武王學乎郭叔孔子之學無常師然要其歸則祖述堯舜憲章文武也唐虞以降聖人有其德無其位言焉而為天下法者其孔子乎故士弗學則已學則必學孔子焉學孔子者無它亦猶農夫之師后稷而已故曰積耨耕為農夫積禮義為君子孔子三十而立四十而不惑五十而知天命六十而耳順七十而從心所欲不踰矩皆由十五志學以積之彼學奕秋之為數者亦必專心致志而後得焉今吾為孔子之徒誦孔子之言豈訓詁而已哉文詞而巳哉博聞強記夸多鬪靡而已哉由灑掃應對積而至于窮理正心始以成己終以成物此孔子之所以詒謀千載者也傳曰人一能之己百之人十能之己千之雖愚必眀雖柔必強甚矣學之有類乎耕也行中書掾古滕卜君師顔以志學名齋雖鞠躬王事戮力戎行而藏焉修焉逰焉息焉之志未始不閔閔焉如農夫之望歲師顔之志亦尚矣夫人情為田禮以耕之義以種之講學以耨之而異端百家之説為我庶草惡莠百螣者又耘耔之茠刺之惴惴焉惟恐其滋且息焉歲云秋矣庭者碩矣堅者好矣孔子之所謂立立此者也所謂不惑不惑此者也知天命知此者也耳順順此者也從心所欲從此者也始無扞格不勝之憂卒兑過時難成之患近不汨沒于㓛利逺不躐等乎空虛窮則遁世而無悶逹則化民而成俗此學之所積如衣食之源生生而不匱甚矣學之有類于耕也師顔于此奉以周旋蓋將積之以化民成俗者也書以遺之以勸同志尚安以舍己之田耘人之田哉卧雲軒記行中書右丞吳陵王公即居苐東偏築室若干楹壘石為小山引水為池沼藥畦花徑紆餘委折朝光暮景與雲日爭變化間與所知角巾逍遙引觴淋漓酣歌夷猶浩然有脫屣軒裳蟬蛻冨貴之意嘗自誦曰世無赤松子則范少伯張子房何如人也因自題其顔曰卧雲軒黃鶴山人最善畫凡卉木煙霞山光水色可以狀夫軒之勝者慮無不曲盡其態士大夫因相與傳玩之且曰王公古之人傑也曩在畎畞已有憂天下之心今以內聖外王之學尊主芘民之道出將入相為時宗臣蓋布衣之極矣于是一丘一壑以卧雲自髙不亦冝乎又曰夫雲隨時而隱見因人而卷舒者也故在泰山則觸石而起膚寸而合不崇朝而雨于天下在赤松則御之以上下為雨師以事神農在少伯子房則乘之以從勾踐髙祖談王伯為萬乘師由神農至今不知綿歷哉千百載矣黃帝氏嘗以紀官保章氏嘗以占歲漢世祖氏嘗以命臺今公所處則少伯之位所行則子房之道所掌則黃帝氏之官所致以為豐穰則保章氏之歲所䇿勳以圖不朽則世祖氏之臺也由是而觀赤松不可及矣然為雨師以福四海是未嘗忘乎斯世也少伯子房冝無所可否矣然三致千金之産是貨殖之流公之所不屑焉者也若夫閉門辟榖若無意乎世間之事矣然卒以計㝎太子安劉氏此社稷之臣公之所欣欣慕焉者也彼南陽東山之徒識者不以其堅卧為髙而以其復起為賢九原可作公其與之乎吾聞之古之君子動不違乎時靜不外乎物故散之則彌綸覆六合雲之迹也斂之則消液入無形雲之心也迹可畫也而况可言乎雖然姑為記之以待忘言者至正二十三年歲癸卯四月乙巳臨海陳基記深雪軒記浮屠師金上人主嘉禾之天寧寺作室于方丈而堊之因名曰深雪軒或者議焉曰深雪云者唐詩人之語也上人遊戲翰墨簸弄萬物以陶寫其性靈其于詩人所謂前村深雪者斡泰和于歲寒運天機于言表蓋必默有以會于其心者矣非徒堊其室之謂也又曰上人禪者也禪之祖有侍立少林而積雪至膝者上人宴坐斯軒澄觀物𥘉豈欲神而明之而與其祖者相忘于無色無聲無垢之天乎或又曰詩人之所謂託乎物者也禪者之所立外乎物者也今上人之名軒其託物乎則上人外物久矣其外物乎則所謂默會于前村相忘于少林者皆未易以淺近窺也由是而觀雪一而已而有詩人禪者之意上人合以名其軒蓋非得巳也而或者議焉又豈得巳乎嗚呼以不得巳之言議不得巳之名名可議也而非名者意在言表無色無聲無垢不可得而議也然則議其可名者而其不可名者它日更僕而議之可乎上人曰唯唯因為記或者之言書之軒中以伺上人字西白吳郡人為之記者夷白居士臨海陳基也至正二十三年四月既望記夷白齋藁卷之三十一
