front:
  text: 夷白齋藁卷之十九
  hash: sha256:a4a2309990054dabc8e6f16a79a818e8ab11e8959b2ae1bed6840cf9788848bb
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_019-1a}
body:
  text: 臨海陳基著金華戴良編序送陳景𥘉序君子之為僚吏得賢公卿而事之則政斯舉矣今海道都萬户眀善公之政揔漕臺也屬海寇之餘糧艘陷沒者參半漕民比户告病公奉聖天子命以漕事為已任甫下車問事緩急審次第而為之令行禁止雷動山立東南列郡侯伯受牒聽令惟謹一時僚吏莫不爭自激昂願以材自效譬猶營壘士卒一經李光弼號令氣色乃益精眀其轉旋闔闢之機所以為國家軍儲深長計者固皆出于公之眀斷而其從容贊相動適事冝非賢僚吏亦何足以處公幕下此陳君景𥘉所以得事賢公卿之道景𥘉瑰瑋闊逹雅有器局起家憲曺由蘇杭二大府史遷漕府所至皆以材能為長吏所信任聲稱藉藉久矣自國家以海為漕渠歲轉東南之租賦每以春夏由吳門趣直沽履洪濤如平地視萬里猶咫尺上而佩金符綰紫綬而為萬夫長下而職之書佐餽餉而居幕府者皆安然囿于皇靈之內雖有深涉之勞而無不虞之變蓋八十餘年于此矣及一旦鯨鯢悍然不安天常慿陵鼓舞風掀浪擲堅舟利楫糜爛韲粉于狼狽之頃董漕大臣素以豪傑自許者顛頓辟易蹙縮而無所措其銼衄亦甚矣繼其後者徒手以承其弊春夏兩漕亦欲以時逹亰師非有明斷如公者紀綱乎其上贊襄得人如景𥘉等周旋乎其下則洪濤萬里無脛而欲行無翼而欲飛亦誠不易矣然則平居無事人材若無與于世至于倉卒之中利害叵測然後得人則濟非人則否噫中流失舟一壷千金豈虛語哉今景𥘉書滿將調閫外之勢視漕臺益崇使移事漕長之道以事連率折衝畫諾遊刃于有餘之地則閭外之政亦斯舉矣異日又移此以逰外廷升中朝莫不皆然則享榮名躋膴仕非景𥘉而誰歟于其行也吳之大夫士咸賦以餞之屬余為之序送哲上人序吳門哲上人事其師學出世間法居城東祚真蘭若自刻甚清苦今年冬將挈缶錫之四方參大浮屠以竟其學士大夫與上人善者咸賦詩以餞之上人吳人也吳為沃壤其人喜事佛好施豫佛之徒往往飾宫廬崇塔廟有餘力輒買良田厚積藏資懋遷以為常産不朽計蓋其習俗所尚非一日矣自兩淮用兵資糧器械百物之需取于吳者無慮十八九民力滋耗事佛庸少懈而佛之徒亦方僕僕與其民奔赱有司出賦稅以給公上閔閔焉惟恐不及是懼昔之所常産今適足以為患浮屠寶坊魚鼓絶響平時纍數百人為徒者至是皆相率引去祚真城東小蘭若爾其師弟子顧優遊無事俯焉夙夜惟知有出世間法上人有將浩然四方從大浮屠逰視其去􅈬若無豪髮世纍者蓋上人之師弟子不求多于世彼為常産計者皆求多者也求而不知止患孰甚焉今四方名山具存而其叢林凋落亦如吳之所謂寶坊乎抑猶有異時規矩弗墜也然向之特盛者莫如吳興錢唐吳門既爾錢唐亦從可知上人此行將何所適乎吾聞浮屠氏之法無中邊無彼此求之者無逺無近混物我于一途等虛空為法界然後不舉足而四方見前此古之所謂逰乎方之外者也上人不求多于世斯行也將無入而不自得尚奚以業林之規矩墜弗墜為哉上人字古心其師則元明其號也送陳希文北上序人之厭江湖者則思山林厭山林者則思城郭居城郭者則思遊乎通邑名都以日充其所見聞譬猶魚之處池沼則慕湖陂處湖陂則慕江海處江海則又欲脫鱗鬛生羽翰絶雲霓負青冥以逹乎天地而止焉亰師士大夫之天池也士之生乎斯世苟耳目聰眀心志卓犖手足無拳攣之疾肩背無傴僂之患賤不至于馬醫辱不至于奴隸貧不屑為販賈工祝之事非詩書之言不習非禮義之地不踐非逢掖之服不服非章甫之冠不冠言可以信乎朋友貌可以接乎公卿大夫氣可以折衝乎尊爼智可以效官使于駿奔執事之間乃可汗漫于江湖栖遲于山林浮湛于城郭居卑而處汙局縮而偃蹇徒資於姍笑于僕妾甚無謂也故必扷泥塗擊奔飈左攀鱗右附翮翩翩焉揚揚焉翺翔乎帝鄉徘徊于清都如吾友陳君希文者豈不卓然瑰瑋之士哉希文之志則壯矣顧余與希文生同妵居同里學同業而年又差長疾不至于拳攣而不得道希文以為先患不至于傴僂而不得從希文以為後賤有甚于馬醫辱不翅于奴隸貧雖欲為賈販工祝而不可得徒亦服逢掖冠章甫居則誦詩書行則稽禮義踽踽以自信倀倀而無徒其視希文去而折衝乎尊爼希效于駿奔執事者殆猶斥鷃鼓翼蓬蒿之下而不知九萬里鵬之一息也尚安敢語天池哉余不能俯首帖耳以􅗲幸天池之有力者徒因希文行書以為貺朱氏格致餘論序余觀古人以方術相授受多不苟扁鵲古之良醫也遇長桑君十餘年而始得其禁方長桑君豈古愛方者哉徒欲授之得人以活人爾昔宋氏渡江良醫之在中州者曰河間劉守真氏戴人張子和氏真㝎李明之氏三家之學同出于黃帝扁鵲而其用則有攻輔之不同者蓋所遇之時然也宋末江南之人惟羅太無氏之傳得其宗太無逮事穆陵國亡退處民間未嘗輕以醫語人而人亦卒未有能師之者烏傷儒者朱君彥修飭身礪行有古君子之風而尤好醫方術嘗讀素問而歎曰此載道之書也顧非儒者不能讀而醫固儒者之事也古之號為良醫者皆有師今之為醫不必師徒守故方以幸人之不死者非醫之罪也醫之無師久矣嗚呼吾尚忍為是哉乃彂憤求師不逺千里赱吳楚不能得患至杭有言羅氏者君候之纍數十往不得見君因旦日往立于其門日且暮不少動羅察其意篤始引見之與語大説乃盡以三家之旨告之并授之書且曰熟此可以活人矣君謝曰諾遂以書歸讀之反覆尋繹上逹于靈樞太素內外甲乙之書以及百家無不貫穿而得其精且微者積以歲月然後出而視人之疾如是而生如是而死無不切中一時學者故方之習亦因以丕變君遂以國醫名東南而三家之學不專于中州而君老矣門人往往請著書乃托其歷試而驗者論次而筆存之捴凡若干卷夫羅氏不輕以語人而君得之亦不易冝其信之篤用之精而為書又足以傳諸其徒而淑諸其人君與羅氏視古人皆可以無愧矣余雖未及識君幸因其髙第弟子趙君以德而得見其書以德俾為序乃述其授受淵源之自使讀書知醫不可以無師而得師尤不昜云羅氏名知悌君名震亨至正十五年正月甲子序送韋道寧詩序韋君道寧世為中州衣冠家由浙西憲曺辟吏昆山常熟兩州有能聲浙西部使者賢而薦之為福建奏差將行中吳大夫士與道寧善者送之南門之外有酌道寧酒而為之言者曰道寧起憲曺執文書事兩州長吏所食升斗祿耳而獨以潔廉有吏能為部使者所知蓋道寧讀書通古今為詩文奕奕有風氣啜菽飲水而牛羊之飬弗過焉其素所藴蓄者未昜以淺近窺也福建古大閩地秦漢以來始列中國今天下一家四夷八蠻九貊百粵皆隸職方而福建于閩為土中江浙行省所統大藩閩特大以逺部使者職耳目任風紀于此視他道尤重奏差古行人之職也凡部使者有事于行御史府及中臺或四方各道奏差悉主之非明憲度習文法善辭令飾威儀者不足以堪之道寧起身憲曺則憲度明矣辟吏兩州則文法習矣讀書通古今則辭令善矣而又將之以潔廉本之以孝敬是行也吾見其出入部使者從事間以事使行御史府中臺四方各道其周旋有禮進退有容應對從容中矩此皆其素所藴蓄者等而上之殆無施不可夫豈惟行人而已乎閩雖逺且阻然號樂土道寧以賢能見辟固不敢以逺自憚亦不徒以土為樂盛年勤王事脫身簿書從賢部使者為僚從皆父母之所説者于是華其行者咸賦詩以贈之屬余為之序左丞潘公射吳江佛寺浮圖詩序吳江華嚴寺有矢著浮圖鐡鎖上不至顛者若干尺世傳金人渡江及宋人西出師元兵南征過此皆射焉歲久矢弊寺僧更設一矢以存故事上下二百餘年矣往來觀者相指示然卒未有復出竒試抽矢以擬其後者今年夏中書右丞潘公將兵過其下時夜漏下二刻月驂驂見浮圖上矢影公異之乃顧左右取弓矢一彂正中其顛舉軍皆賀且曰公天威也好事者爭為歌詩以壯之夫弧矢所以威天下然天下不患無良弧矢患無善用弧矢者耳故無飛衛雖有燕角之弧朔蓬之簳不能以貫懸蝨雖有蚡胡之笴肅慎之砮不能以穿楊葉射不足以中戟牙雖有烏號越棘象弭繡質將見蒼黃失錯蒲服銼衄且不暇尚何威之有哉吾故曰不患無良弧矢患無善用弧矢者耳今公位兼將相勇冠三軍其視飛衛飬叔僅一藝爾將不足為公道然浮圖倚天聳若千仞雖素百彂百中苟非天晶日明將不敢輒自出竒與昔人爭必中之鋒于上下二百餘年之間乃今按兵澤國彀弓持滿水光迷冥夜氣寥閴公獨賈勇萬夫控弦一彂而能自決竒中使爭快覩之人伏公為天威夫豈偶然也哉世無飛衛飬叔而公固善用弧矢者也昔南霽雲為睢陽乞師賀蘭不從因彂憤射浮圖示必滅賀蘭天下至今義之今公豈狃于必中徒取以驚動一時資好事者為美談而巳亦示為國家必誅無道而征不庭也冝好事者聞而壯之謂非公不足以弧矢之利非弧矢不足以顯公之㓛公固不以㓛自居然天方用弧矢以㝎四方飛衛飬叔既不可復作公其可不自愛乎雖然士有以忠信為甲胄禮義為干櫓不操弓而鄰國畏不挾矢而天下威利倍于弧矢㓛顯于百彂百中此周公之所吐哺而公所冝為國逺謀者余不佞敢與國人稱願之而公尚無以謙讓未遑為也至正十六年六月既望序夷白齋藁卷之十九
