front:
  text: 夷白齋藁卷之二十二
  hash: sha256:e0f7e0d0dcad1dfc0d4619b0acc3b59d45babf81b49481bc26cf54e0bd471583
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_022-1a}
body:
  text: 臨海陳基著金華戴良編序程禮部集序文豈易言也哉國家混一百年能言之士莫不各以其所長馳騁上下以鳴太平之盛求其雄深奧衍跌宕離倫施之訓謨薦之聲詩自出機杼與漢西京唐元和宋慶曆以來諸作者爭衡千數百載而天下聲文為之丕變則蜀郡虞公豈非偉然命世君子哉當是時豫章揭公亦以其峻潔之詞更相振耀海內爭師宗之並稱曰虞揭而文章之盛極矣至元重紀元之𥘉余至亰師虞公已退居田里久矣幸辱拜揭公而與其賔客者遊故禮部貟外郎新安程君則虞公之所雅敬而揭公所尤畏厚者也君盛年時挾所有客亰師介然自持不苟務造請居窮守約人所不能堪而未嘗一日不鑽研六藝紬繹百家漱滌刮磨與古為徒蓋性能而好之之篤如此非直事剽竊衒華藻以馳騖聲勢而巳撡筆入館閣得官殊不以崇􅋻利鈍為意故仕而貧益甚至語文章則二公賔客槩莫能與之爭鋒余嘗評其文如泰山之松氣凌青雲天風夜驚萬籟並作側耳而聽猶季札適魯而聞雅奏莆田陳公衆仲以文章名家亦以吾言為然使鳴太平以盡其所長蓋百鳥之孤鳯也然寒飢困頓三十年守常調如一日而介然不苟之風與詞俱厲不少衰年踰六十甫入直翰林尋教國子拜南行臺監察御史擢禮部為尚書郎方將頡兩制大其聲音以鳴其所未鳴者而君老矣間奉使江南欲解圭紱還朝廷求先人墓廬為首丘計而道梗不能歸竟客死錢唐之西山之僧舍余赱吊其喪且臨壙哭之曰天能窮其身而不能使其文不工能使其道不大行于丗而不能使其文不傳嗚呼悲矣先二十年余哭莆田于亰師今君之沒又哭之斯文之緒豈遂終絶也哉門人張吳同里且親收拾遺藁會粹為三十八卷與同門臨安胡世顯校正刻之以余辱有忘年之好屬為之序君名文字以文自號黟南生云至正二十二年十一月丁未序孟待制文集序國朝之文凡三變中統至元以來風氣開闢車書混同搢紳作者與時更始其文如雲行雨施􅗈霈萬物充然其有餘也延祐𥘉繼體之君虛己右文學士大夫涵煦乎承平鼓舞乎雍熙誓以所長與世馳騁黼黻帝載鋪張人文號極古今之盛然厲金石以激和平之音肆雕鐫以篆忠厚之璞而峭刻森嚴殆未昜以淺近窺也天曆之際作者中興上探詩書禮樂之源下泳秦漢唐宋之瀾擺落凡近憲章往哲緝熙皇墳光並日月登歌清廟氣陵騷雅由是和平之音大振忠厚之璞復還其用力也如藺相如抗身秦廷全璧歸趙嗚呼其難矣哉今翰林待制孟君砥礪成均激昻俊造于斯時也固已步趨延祐之轍而先後之矣乃敡厯省臺左章右程問其職則輔闕而拾遺也詢其業則稽古而立言也人方汲汲我獨熙熙衆皆碌碌我則舒舒于是又奉其所謂忠厚和平者綢􅓎于詩書周旋于禮樂浸淫于秦漢優柔于宋唐身勤而詞愈修迹顯而業益專髮種種而志彌厲雖劫以兵衆不變也其用心亦精矣文章與時升降故氣勝則野詞勝則巧要非人之所能為也天也今孟君之文棄峭刻而就和平却雕鐫而趨忠厚毅然于三變之後操不野之音寶不朽之璞若固有之充是道也吾知其全璧而歸無憾矣詩文揔若千首釐為若干卷序而存之以伺知者君名昉字天暐西人也至正十二年十一月已未序金他粹編序宋髙宗承祖宗之緒雖間關播越退保江南然與漢光武不階尺土者異矣而靖康之敵又非新室赤眉之北南渡將相肺腑爪牙之臣亦非若曩時馮異仗劒而崛起者加以重熙纍洽仁漸摩浸漬淪膚浹髓垂二百年一旦兩宫蒙塵宗社為墟中原父老日夜欷歔思宋不減三輔然光武弟徒步南陽左祖一呼盡𣸪髙皇帝舊物其故何哉蓋光武知人眀見萬里髙宗舉國聽于權臣故回溪之敗馮異之罪小朱仙鎮之捷嶽飛之㓛大光武不以一挫之失忘逺圖故異卒以再造之㓛興漢室髙宗不能因戰勝之鋒用嶽飛而徇主和之議任秦檜故以恢復自任者適足以媒忌嫉之口以忠貞許國者卒無以逃煆錬之禍夫所貴乎中興之主者不以其能雪父兄之恥光武考之烈乎今舉垂成之業而棄之使馮異君臣專美于千載嶽飛父子㗸冤于地下此孝子忠臣所以讀金他粹編者未嘗不為髙宗惜也飛父子沒餘二十年孝宗受禪其孫珂實始以籲天辨誣録詣闕訴上由是詔賜墳廟復爵位頒封諡祿遺孤時髙宗為太上皇猶及見之吾意其北望舊亰必恨不誅秦檜以謝天下嗚呼巳無及矣編捴若干卷今江浙行中書平章政事兼同知行樞密院事吳陵張公命斷事官經厯吳郡朱元佑重刻且曰西湖書院嶽氏故第也冝序而藏諸至正二十三年三月甲子左右司郎中臨海陳基序飛雲樓詩并序浮光王君季野由其先公參政賜苐吳門群公子幼學長娶不出吳境而季野别業于是有在笠澤者矣參政公宦業焜耀事親尤盡孝季野蓋酷似之故遊釣所至輒不忘其親此飛雲之樓所以作也豫家天台少以賤貧赱四方每東望白雲輒興狄公太行之思嘗竊歎曰狄公社稷臣也吾何為者乃妄自擬狄公尋復自念古今賢不肖窮逹雖殊然人子之于親寧有二致耶乃奉母來吳名其室曰白雲山房季野翩翩貴介顧能折莭好學日與布衣韋帶之士遊雖以豫之無似既辱與之交又數要豫登其樓以共適其適江湖際天上下一色相與上地變于下人變于中甚矣哉素之不可以不安也方今聖神御天賢智在位五典從而百揆敘三光明而九土平君子于是退而歸曽閔事親之孝服冀缺夫婦之敬篤夷齊兄弟之讓尚孔子子産叔牙夷吾朋友之風熙熙焉施施焉安其素于其中田之廬如金君伯祥者亦可謂太平之幸民矣易曰父父子子兄兄弟弟夫夫婦婦而家道正又曰君子思不出其位其其不謂是歟天台陳基升其堂而樂之乃作詩曰莫髙者天日月麗焉莫厚者地河嶽位焉俯仰兩間惟人實參之厥有恆德是以為秉彜君子允蹈斯曰安素以家則正以國則衮爰治我廬爰闢我室以敦我宗姓以樂我姻戚爰樹我桑爰藝我稷以製我衣褐以為我酒食天之與我惟曰有常分聖亦有言遁世而無悶匪髙曷以覆匪厚曷以載庶幾夙夜永底無悔息耕亭詩有序余讀豫章鄭士亨氏息耕亭記見君子有髙丗之志焉士亨篤學力行為文章一夲于古使出而鳴國家之盛則其志之所存豈徒言哉今退而耕于野艾蓬蒿斬藜藿為亭以息其勞朝則服田事夕則誦詩書六藝之文以求周公孔子之道而其自附古人猶有取于擊壤翁嘻翁固髙丗之士也哉吾聞后稷之治穡茀豐草剃稂莠去蟊賊然後苗之彂者堅秀者好而秋之穫冨焉士之于道也亦然斥申韓茀豐草也距楊墨剃稂莠也排佛老去蟊賊也于是禮以耕之義以種之而人情之田斯闢矣士亨之治穡不戾于后稷則其于道也固擊壤翁之道矣余未能士亨以究其説于其歸也賦息耕亭詩詩曰我耕于野穮之蓘之我田既臧我苗日滋爾狼爾莠尓螟爾􅭈不務去之為苗之賊我田既登我稷惟馨維春維秋以嘗以蒸維我百榖匪種曷獲維我百骸匪勤曷息勤之以時息之以所式歌我詩以御田祖送脫歡參政詩有序參政元鼎公以勳閥世胄折莭講學江漢間與寒畯韋布之士角藝有司擢髙苐為天子門生鬱然以文學政事名當世由州縣厯郎署積官位執政皆在江西省用兵以來親與士大夫同勞苦凡十閲寒暑文武忠孝精敏絶人至正壬寅冬十一月入亰師道由淮楚獲納交下執事終日論談非古今理亂則政事得失溫乎其容藹乎其言浩乎其有源委也基遊四方且老矣辱知公卿亦不為少獨恨見公之晚山東羣盜告平公買馬束􅏻治行甚遽基惜其去不敢留因賦詩以泄其思詩曰相見各云遲相别何太遽依依淮陰郭望望山東路山東路已平萬里接神亰衣冠朝鳯闕鴈行皆弟兄故舊驚還喜華髮今如此留得寸心丹歸來奉天子夷白齋藁卷之二十二
