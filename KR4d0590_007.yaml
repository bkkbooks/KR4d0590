front:
  text: 夷白齋藳卷之七
  hash: sha256:d2da5cf94aef2edaa5800b164b9e9675cee88e2e5e5ded7d8953acf71b593016
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_007-1a}
body:
  text: 臨海陳基著金華戴良編律詩七言秋日雜興五首彈鋏歸來歎薄逰西風吹老黑貂裘裁詩見慰慚錢起掃榻相延愧隱侯擬學楚人歸種橘虛勞蜀客望牽牛五湖煙景依然在還許扁舟伴白鷗關山搖落鴈飛遲江漢飄零有所思倦客自憐蘇季子故人誰問介之推露催絡緯窗間織風緝蠨蛸户外絲獨荷慈親念逰子倚門日日數歸期江頭久客日思家坐覺徴霜上鬢華莭序又催秋後燕風光爭彂雨前花倦逰已夢莊生蝶不飲何憂廣客蛇怪底朝來衣袖薄一川白露下蒹葭一夕西風木葉飛畫梁落月淡餘輝銀燈夜照還家夢金剪秋裁寄逺衣霜信早隨新鴈至素書深訝故人稀無因為謝東曺掾鱸熟􅐜香莫便歸明河如練月娟娟坐對清光只自憐衣久不知沾白露夢回猶記到鈞天汝南遺老推黃憲海內諸公憶鄭虔萬里歸來無寸輔論交慚愧到忘年寄沈仲説二首欲采芵蓉寄所思秋江風露正離離每因見月懷玄度可但看詩説項斯溪上燕辝華屋早槎頭魚上碧波遲太平無事差科了歸共原泉理釣絲野人籬落並江濆竹裏流泉竹外雲好學槖駝惟種樹莫誇司馬最能文小橋斜接漁樵路落日爭呼寫鶩群獨憶詠歸亭上客久留城府思紛紛次韻金上人見詒屏迹吳淞江水頭勞君歲晚逺相求擬為葛井三生夢更作曺溪一宿留挂錫好依黃葉寺題詩曽到白蘋洲它年重約吳門道杯度秋風不用舟寄家兄敬德庭闈一月違溫凊兄弟終年歎别離落日有時成獨立秋江無處不相思雲邊白鴈𥘉傳信籬下黃花預有期甚欲卜居依北郭故人誰送草堂資次韻吕彥貞西池風日何瀟灑公子不來誰共逰樵䛴漁唱互斷續山色湖光相蕩浮經秋華屋辝飛燕隔水好花如莫愁腸斷濯纓亭下路籬傍猶繫散人舟歸燕年年此日便知歸欲去仍依舊壘飛故國㝎知通碧海秋風應不到烏衣吳宫避火驚前夢衛幕營巢悟昔非莫笑野人門巷小杏花春雨得泥肥用秋日雜興韻作逰仙詩五首飛佩飄飄入逺逰青藜為杖鹿為裘采芝歌逐秦遺老辟榖心期漢列侯又見秋風歸乙鳥幾看春雨戰蝸牛有時濯足溪頭晚一曲滄浪不動鷗幽泉怪石好栖遲鍾鼎無勞入夢思每把素書間裏讀細將玄牝靜中推溪頭斫竹裁龍琯石上栽松引兔絲去去盧敖同汗漫十洲三島與君期鵬鷃髙低各自飛龍泉何必吐光輝三林樹下曽餐玉千仞岡頭好振衣抱犢書存人見少昆崘桃熟客偷稀仙家不是無樓觀底事公孫不肯歸中宫姹女最嬋娟何意東君不見憐貞潔正同秋後月澄清直似水中天每持玉節朝群帝自掃丹臺揭寸虔臣妾自知無所覬願君安夀樂千年白雲深護地仙家千樹玗琪老歲華羽客穿林收桂實山童和露采松花煙梳瑶草柔如髮石赱蒼藤曲似蛇記得夜來歸路險翻江風雨撼秋葭寄玉山江上秋隂十日多思君不見奈愁何風髙澤國來鴻寫雨入汀洲落芰荷公子文章裁瑞錦美人衣袖剪輕羅畫船亦欲溪頭去聽唱花問緩緩歌次韻鄭遂昌奉謁范魏公祠皇皇卷服儼専祠生氣渾如未死時天下㓛名韓相並關西威烈夏人知英雄未盡匡君策父老頻瞻出牧旗昭代尚賢嚴祀事詩人聊得薦江蘺白芙蓉生嗔青女太精神玉立西風不受塵秋水洗粧朝白帝露盤和淚泣銅人清涵漢武池中影淡寫崔徽鏡裏真腸斷深宫舊時伴年年相望越溪濵次韻錢伯行白芙蓉帝子西逰太液池一杯秋露為君持空令越女羞容貌不與唐昌共夲支婭姹最憐無語處風流全在半開時自移長信宫中去學得班娘淡畫眉婁江即事二首簡郭義仲瞿惠夫秦文仲陸良貴蒹寄顧草堂婁江江上樓居好滄海海頭城邑新蠻郎打鼓爭起柂鮫客捧珠來售人風燈照人不數點霜月湧波才一輪人生會合豈易得看劒引杯寧厭頻秋風已過菊花期笑把婁東酒一巵徘徊月色樓中滿顛倒天光水底移夢熟已知鼇背穩詩成偏憶虎頭癡明朝又鼓吳松柂應采芙蓉寄所思次韻仲説喜陳叔方過東林隱居二首州府尋常數往回江湖相見重徘徊殺雞不為林宗至拜母曽期范式來烏鳥暮栖池上樹兒童晴掃竹間苔明朝又入城闉去一幅蒲帆帶雨開空林風日變隂晴散策相從欵欵行心戀白雲飛處近眼隨孤鳥沒邊明敢期諸葛隆中卧且學龐公壟上耕老覺丈人才力健浩歌一曲大江橫次韻鄭遂昌喜雪二首簡白野監司瓊霙著地不沾塵玉樹臨風欲照人千古賦髙梁苑調一枝梅冠漢宮春占年已喜無時癘祈榖何須拜水神却憶上畨裁詔處瑶階飛絮白于銀澤國雲同氣若蒸賦成應不為憎蠅花間端木皆為瑞露滳金盤欲化氷甲觀影搖鳷鵲樹銀床聲斷轆轤繩懸知水部明于晝錯認瑤臺皓月叔送曹宗爰愛此丹山五色毛綵衣初翦映仙桃奉親喜有銀絲鱠贈别慚無金錯刀洲渚春深生杜若江湖波暖漲蒲萄王褒擬奏賢臣頌肯學山人索價髙次韻懷彥誠沙棠為槳木蘭橈别後令人瘦沈腰采蕺暫歸靈越去栽桃重赴武陵邀醉乘蓮葉春波闊夢落􅉉花夜雨飄猶記共遊鳴玉洞滿山明月共吹簫次韻待琦上人不至羡君方外得詩流杖錫相從海上留白鶴一聱寥廓曉滄波千頃洞庭秋鹿門未遂龐公隱蓮社行尋慧逺遊望望佳人期不至碧雲迢遞迥添愁次韻懷玉山滑滑春泥滿郡城出門騎馬不堪行未能學道從緱母且𣸪忘憂對麯生流水小池垂釣影春風深巷賣花聲停雲賦罷心如渴安得滄浪濯我纓陸氏别業窈窕西池一徑通赤闌如畫倚晴空風微燕雀飛塵外日淨龜魚在鏡中入谷謾夸盤往𣸪卜鄰冝住瀼西東緑隂滿地新荷彂猶勝開尊飲碧筒寄仲説自昔龐公少入州偶因人事亦綢􅓎慈烏舊止庭前樹拱木新悲宰上秋雨露山空驚物候江湖風急滯書郵此心酷似長庚月永夜相思爛不收寄玉山二首我愛玉山佳樹林草堂終歲有餘隂巢安翡翠春雲暖窗護芭蕉夜雨深寶篆焚香留睡鴨綵箋行墨寫來禽萬竿修竹休教洗日日平安報好音碧梧翠竹日扶踈長夏髙堂可宴居霅上故人時載酒山隂道士近無書蒼頭掃石安碁局稚子穿花奉板輿若見惠休煩問訊碧雲詩句㝎何如水木清華亭小酌栁隂門巷雨初晴蓮葉田田著處生濁酒且容嵇叔夜名歌不數米嘉榮波紋瑩逐微風起霞彩紅兼落日明水木清華賔主勝莫孤詩社舊時盟仲説留陳公原余往訪之孝子之廬何處覔陳公原上白雲深山林不受炎歊氣雨露能生怵愓心流水到城無二里長松出屋揔千尋􅖋莪自昔多遺恨三𣸪猶令淚滿襟留宿陳公原五月城東訪隱淪衡門留榻與僧鄰長林爭宿此山鳥短棹獨歸何處人松蘿繞屋月當户楊栁夾溪風滿津杖策從今來往熟草堂猿鶴未應嗔題陳公原仲説所居壁忽憶美人來碧山松桂滿林幽且間論心合在羲軒上浪迹漫居夷惠間夜雨思親雲氣白秋風泣血土華殷歲寒有約從諸老采藥携棊日往還夷白齋藁卷之七
