body:
  text: 夷白齋稿輔遺目録樂府詠歸操玉山辭為顧仲瑛作望仙詞為陸叔陽道士作吳儂謡逺歸曲離倫婦群珠碎傷吳帥潘元紹衆妾作俠客行從軍行古詩五言京回徐翁招飲園亭秋曰鄭明德林居分題劍池送夏副樞分得萬字送王副樞送髙郵縣尹何士敬送謝元功訪北寺無言講主小丹丘對雨懷元功大掾玄懿大魁興懷寄元善經歷敬甫郡司與戴叔能遊寶積山寺宿西方丈次韻張士行陳庶子天平山中三題詠楊山人號山鄰別周文逹録判竹里子伍大夫祠官祭作九月十二日感懷示姪麟柳胥古詩七言送髙元善太守赴任杭州宋劉凝之騎牛圖虞克用山居圖西老園圖本長老秋山圖詩巢提兵餘杭作桂珠謡律詩五言送梅同知任杭和庶子學士靈巗山即事二首律詩七言次韻懷華幼武送馬易之代祀海嶽次韻謝參政送錢參軍秋日與張士行遊虎丘送劉郎中山中與戴叔能對榻登吳橫山望東洞庭登楞伽石湖上觀音巖石湖與戴叔能同舟懷雪坡大參至正乙已四月草七日與家兄上冡石湖洎逰諸山二首舟中與家兄敘別聞庶子遷城居送嘉定偰知州歸吳送信道元還吳興楊墳寺長律春日泛石湖絶句古意採桑女天屏山龍門靈巖山琴臺支硎山寒泉花鹿山石屋夾浦石塘石門畫江邊梅陳惟允畫夢醒渡江過石湖登楞伽五月調兵赴杭嘉等處四首雞冠次韻虞隱君堪潘閫掾穀雨中見寄十絶謝沈仲説送酒次費圜韻送江西丁省郎赴京奏捷本長老紅蕉圖劉司馬山居至正乙未志異九月十日也由范莊過天平至南峰放鶴亭豫卧病吳中家兄命從子慶來省巳因歸賦此送之憶橫山親墓石湖僧舍二首贊戴九靈先生像贊雜著鄉飲田刑平編志頌沈蘇州評華莭婦序通鑑續編序送張州尹序送虞勝伯序送劉廷傑序和靖先生年譜序送鎦治中詩序贈盛斷事詩序送邵同知序送湯都事序送張德常序送禇士文序記吳縣修學記常熟州修學記守約齋記小丹丘記墓志銘鄭國公并夫人合葬墓志銘王處士墓志銘傳傅古民傳夷白齋稿輔遺目録
