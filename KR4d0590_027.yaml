front:
  text: 夷白齋藁卷之二十七
  hash: sha256:0172035deeba1a71181852085350c3fc591fe307e3e48cf488b0dfcbae50e913
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_027-1a}
body:
  text: 臨海陳基著金華戴良編記書紳齋記中吳衣冠之族曰海虞徐氏其入仕中朝出任牧伯者曰故益陽知州子孫多好學從余㳺者曰𬗟緬之父曰孟逹甫居松陵笠澤間蓄書數千卷教其子𬗟恪承父志匠厲激卬號佳子弟請余扁其讀書之舎且求文以記之余既扁之曰書紳齋又從而為之記曰昔者七十子之徒學於孔子孔子教之以六藝而六藝之文見扵經傳者無慮千萬數然䆒其歸卒不過於謹言行而已顓孫氏居七十子之中盖巳身通六藝而孔子荅其問行也始之以言忠信申之以行篤敬終之以立則見其參於前在輿則見其倚扵衡噫此數言者豈直顓孫氏所冝書諸紳㢤凡為人子為人臣為人兄弟朋友者舉冝書之盖仰之如日星循之如榘彠銘之如几杖戒之如槃杅動勤焉勉勉焉不可以斯湏離者也聖人既沒忠信之路塞於楊墨篤敬之塗蔽扵佛老百家之說叅前倚衡之昭然者隐扵詞章訓詁之習盖千有餘年矣濂雒考亭羣夫子者作實始紹隆騶孟氏一髮千鈞之緒使塞者闢蔽者顯隐者著而荀卿氏楊雄氏韓愈氏之属扶持排斥而㓛未集者至是而後集盖建諸天地而不悖質諸鬼神而無疑百世以俟聖人而不惑者也今吾與𬗟朝而學夕而思仰照扵日星審度扵榘彠擇路扵忠信問塗扵篤敬入求以事親出求以事君内求以仁兄弟外求以交朋友近求以行州里遠求以行蠻貊者皆書紳君子叅扵前倚扵衡者也𬗟尚念之讀笠澤所蓄之書昌海虞所居之族嗣益陽所遺之業亦在於言行之間而巳矣乃誦所聞以告之囙書以為記亦将以自朂云緬字公逺余則韋羗山人陳基也至正十五年十一月甲子記水雲亭記都水庸田使西夏楊公雙泉涖官吳門寓茅有池焉池上為亭雕甍錯栱締構偉麗中設匡牀左右圖書筆硯叅置嘉華羙竹香草之属冬則撤南户斵木為䟽承以素楮水光雲影顛倒几席頋而樂之囙名其亭曰水雲今江浙行中書平章康里眀徳公實手題其扁公既刻置亭中復俾其客臨海陳基為文以記之夫水光俳佪雲影下上君子觀乎朱子方塘之詩有以見夫心之體焉是心也人皆有之朱子獨先得其所同然者爾故昔之觀扵川上者曰悠然而虚者與神謀淵然而静者與心謀今公退扵休沐逍遥斯亭讀古人之書求古人之心廓乎有容湛焉不昧萬物交乎前吾不随以遷衆慾誘乎外吾不從以化舉天下之物孰足以諭之其惟水與雲乎盖水以清為軆雲以潔為質清者不瀆潔者不汙君子思所以神眀其徳而與昔之賦方塘觀川上者夷猶容與同㳺乎顥氣之始必於此焉觀之可也公名亭之義亦逺矣雖然水不徒清所貴乎利世也雲不徒潔所貴乎澤物也今公以耳目近臣權衡水政財成北利輔相歲㓛始扵江湖達扵四海譬猶泰山之雲起扵觸石合扵膚寸及其從龍鼔風雷周八極為雨以潤澤天下則其為利也斯溥矣詩云維其有之是以似之遂書以為記至正十四年夏四月戊戍記光福觀音顯應記吳郡城西六十里光福寺銅像觀音以宋康㝎元年六月廿三日示現故吳人囙以是日為觀音初度焉故事凡雨暘祈祀必迎入郡城去年秋苦雨都水庸田使西夏文書訥平江路達魯花赤西夏六十捴管大名髙履迎寓卧佛寺設齋蕆事靈貺昭灼是歲號大有年既繪像刻諸石又蠲寺之雜役且勒文以記之今年春雨滋甚迎禱輒應夏淫雨継至農人告病復以六月戊戍迎銅像百官有司岀郡西門稽首賔迓冐暑徒行即承天寺止焉越十三日癸丑適為示現之辰江浙行中書右丞西域買术丁都水庸田使文書訥海道都漕運萬户燕山脫因平江路逹魯花赤六十捴管髙履岀俸金大集緇流作諸佛寺文書訥拜淮南行省叅知政事将行㝷製法衣傳之玉環以衣之監脩國史椽淮南施允恭時以使事在吳暏兹殊勝謹奉母命捐俸度工以黃金飾全像慈相端嚴寳冠有煒行殿内外備極瑰麗四衆圍繞天人具瞻香華紛郁幢旛旖旎鈘螺鼔鍾鏗鍧震動如是三旬有二日而放大光眀者二六月庚子七月戊申也隂霾屏除陽徳焜耀全吳之壤懽聲並作有年之慶復兆扵茲七月辛亥自城還光福百官有司寅餞如初禮道路之人目撃儀容莫不改觀昜視蒲伏讃歎以為希有允恭復俾善畫者冩銅像勒之羙石以章顯應之實古者水旱之祭曰雩禜或城門㦯山川㦯岳鎮㦯海瀆或社稷郡縣則祭其界内所得祭者焉及佛氏以圓通威力方便慈悲利益群品在吳則銅像盖自前代以来碑刻所載歴歴可攷以今觀之其蹟尤著冝吳人事銅像如事山川岳鎮海瀆社稷而禮有加焉為民上者從其俗而嚴其事盖無所祈榖實弭疵癘致豐穰以為聖天子養元元無疆惟休之計也是不可以無紀銅像示現之顛末見扵舊刻者茲不復云至正十四年歲甲午秋七月白雲窓記鄱陽章君彦復以漕府史就養吳中即所居慶壽堂西偏之室掲故吳興趙魏公所書白雲二字扵窓間囙名其室曰白雲窓彦復博雅好脩每讀書至堯舜之孝弟夫子之忠恕與夫趙少師司馬公之格言未嘗不反覆致思至大書扵壁以備瞻省平居無所嗜獨喜畫草木花實𬞞茹之属每畫尋自賦詩信筆輒有趣好事者多傳以為玩性廓落喜與朋友討論前言徃行意氣㫪容與物無迕用是搢紳大夫樂與之㳺其能言者皆為之賦白雲窓詩而未有為之記者間謂余曰吾先大父由曺之䠂丘避河決徙鄱陽囙家焉先府君青陽縣尹既捐舘舎踐霜露濡衘恤罔極獨賴母夫人康強頋禄薄未足以備甘膬然飲水啜菽粗盡其歡猶愈扵先府君之不待扵今者此名窓之義子幸為吾記之昔者狄公登太行而望河陽也盖猶有詩人陟阽之思焉然後世之凡思其親者必託雲以為諭雖以余之不敏亦以白雲名其山房雲何與扵人之親㢤使吾扵親朝而岀暮而歸口焉而滋味適軆焉而輕暖𥙿𧺫居焉而温凊節色焉而愉容焉而婉烝烝焉無㦯違扵志則雲也果何與乎親及一旦南赱越西適䠂北首燕趙舉目千里孰為親舎於斯時也頋瞻山河俳佪而不忍去者獨見夫雲而巳彦復盖嘗以公事驅馳扵䠂越燕趙之郊乎自其大父南遷而先人之廬不在䠂丘先府君捐舘而慈親之舎不在鄱陽當其匹馬之踟蹰山川之蕭條仰瞻飛雲反頋左右吾知其望吳門猶狄公之望河陽也雲乎果無與扵親乎且狄公之忠義昭乎日月㓛烈著乎社稷徳澤周乎四海百世之下有志之士聞其風而興𧺫者盖将勉焉以晞其萬一今彦復服膺前言而知夲乎孝弟篤躬往行而知由乎忠恕其於狄公盖所謂聞其風而興𧺫者也然余未足以言之姑即其名窓余所以名山房者申其義以為之記云虞麓精舎記常熟實孔子髙第弟子言偃氏子㳺之郷而海虞則吳之名山仲雍之墓與世傳太公望之石室在焉州人徐君公懋世居山之麓其先大父益陽府君𧺫家儒林歴官中外而虞山之族日繁以昌公懋嘗介其從弟公逺以虞麓精舎圖示余且曰願有記也余辱交府君父子最宻雅知公懋賢其讀書精舎工文辭以舉進士為業有日矣余聞之君子居必擇郷逰必就士昔者七十子事夫子扵洙泗其擇郷且就士亦至矣然夫子沒弟子各以所學為諸侯師而西河之民至有疑子夏扵夫子者而其學遂流而為荘周氏之徒子㳺特𧺫吳中北學扵中國卒以文學得聖人之一軆百世之下觀其服膺夫子之言則曰君子學道則愛人小人學道則昜使也其耴人則澹臺氏也其為邑雖武城之小必教以禮樂也攷其言簡昜者宏以逹䟽通者髙以暢䆒其為人則所謂敏扵聞道而學之得其精華者豈欺我㢤今公懋生乎文學之里則郷不待擇也尚志澹臺氏之流則士不待就也入乎耳武城之聲洋洋也著乎心洙泗之言鑿鑿也布乎四軆西河之人弗疑也形乎動静荘周氏之徒不能蠱而惑之也夫為名族之人居名山之麓飲名山之水而能使國人稱而願之曰子㳺之郷有學府君之後有人嗚呼豈不賢㢤彼文辞之工否進士之利不利抑末也不足為公懋道道其擇郷就士之說囙公逺以復之余不敏他日問津川上命駕虞麓覧仲雍之流風攷太公之遺跡徘徊言氏之郷以訪其故宅囙假宿精舎尚能為公懋更僕論之夷白齋藁卷之二十七
