front:
  text: 夷白齋藁卷之二十七
  hash: sha256:0172035deeba1a71181852085350c3fc591fe307e3e48cf488b0dfcbae50e913
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_027-1a}
body:
  text: 臨海陳基著金華戴良編記書紳齋記中吳衣冠之族曰海虞徐氏其入仕中朝出任牧伯者曰故益陽知州子孫多好學從余遊者曰𬗟緬之父曰孟逹甫居松陵笠澤間蓄書數千卷教其子𬗟恪承父志匠厲激卬號佳子弟請余扁其讀書之舍且求文以記之余既扁之曰書紳齋又從而為之記曰昔者七十子之徒學於孔子孔子教之以六藝而六藝之文見于經傳者無慮千萬數然究其歸卒不過於謹言行而已顓孫氏居七十子之中蓋巳身通六藝而孔子答其問行也始之以言忠信申之以行篤敬終之以立則見其參於前在輿則見其倚于衡噫此數言者豈直顓孫氏所冝書諸紳哉凡為人子為人臣為人兄弟朋友者舉冝書之蓋仰之如日星循之如矩彠銘之如几杖戒之如槃杅動勤焉勉勉焉不可以斯須離者也聖人既沒忠信之路塞於楊墨篤敬之塗蔽于佛老百家之説參前倚衡之昭然者隱于詞章訓詁之習蓋千有餘年矣濂雒考亭羣夫子者作實始紹隆騶孟氏一髮千鈞之緒使塞者闢蔽者顯隱者著而荀卿氏楊雄氏韓愈氏之屬扶持排斥而㓛未集者至是而後集蓋建諸天地而不悖質諸鬼神而無疑百世以俟聖人而不惑者也今吾與𬗟朝而學夕而思仰照于日星審度于矩彠擇路于忠信問塗于篤敬入求以事親出求以事君內求以仁兄弟外求以交朋友近求以行州里遠求以行蠻貊者皆書紳君子參于前倚于衡者也𬗟尚念之讀笠澤所蓄之書昌海虞所居之族嗣益陽所遺之業亦在於言行之間而巳矣乃誦所聞以告之因書以為記亦將以自朂云緬字公逺余則韋羌山人陳基也至正十五年十一月甲子記水雲亭記都水庸田使西夏楊公雙泉涖官吳門寓茅有池焉池上為亭雕甍錯栱締構偉麗中設匡牀左右圖書筆硯參置嘉華美竹香草之屬冬則撤南户斫木為疏承以素楮水光雲影顛倒几席顧而樂之因名其亭曰水雲今江浙行中書平章康里眀德公實手題其扁公既刻置亭中復俾其客臨海陳基為文以記之夫水光俳佪雲影下上君子觀乎朱子方塘之詩有以見夫心之體焉是心也人皆有之朱子獨先得其所同然者爾故昔之觀于川上者曰悠然而虛者與神謀淵然而靜者與心謀今公退于休沐逍遙斯亭讀古人之書求古人之心廓乎有容湛焉不昧萬物交乎前吾不隨以遷衆欲誘乎外吾不從以化舉天下之物孰足以諭之其惟水與雲乎蓋水以清為體雲以潔為質清者不瀆潔者不汙君子思所以神眀其德而與昔之賦方塘觀川上者夷猶容與同遊乎皓氣之始必於此焉觀之可也公名亭之義亦逺矣雖然水不徒清所貴乎利世也雲不徒潔所貴乎澤物也今公以耳目近臣權衡水政財成北利輔相歲㓛始于江湖達于四海譬猶泰山之雲起于觸石合于膚寸及其從龍鼓風雷周八極為雨以潤澤天下則其為利也斯溥矣詩云維其有之是以似之遂書以為記至正十四年夏四月戊戍記光福觀音顯應記吳郡城西六十里光福寺銅像觀音以宋康㝎元年六月草三日示現故吳人因以是日為觀音初度焉故事凡雨暘祈祀必迎入郡城去年秋苦雨都水庸田使西夏文書訥平江路達魯花赤西夏六十捴管大名髙履迎寓卧佛寺設齋蕆事靈貺昭灼是歲號大有年既繪像刻諸石又蠲寺之雜役且勒文以記之今年春雨滋甚迎禱輒應夏淫雨繼至農人告病復以六月戊戍迎銅像百官有司出郡西門稽首賔迓冒暑徒行即承天寺止焉越十三日癸丑適為示現之辰江浙行中書右丞西域買术丁都水庸田使文書訥海道都漕運萬户燕山脫因平江路逹魯花赤六十捴管髙履出俸金大集緇流作諸佛寺文書訥拜淮南行省參知政事將行尋製法衣傳之玉環以衣之監修國史椽淮南施允恭時以使事在吳暏兹殊勝謹奉母命捐俸度工以黃金飾全像慈相端嚴寶冠有煒行殿內外備極瑰麗四衆圍繞天人具瞻香華紛郁幢幡旖旎鈘螺鼓鍾鏗鍧震動如是三旬有二日而放大光眀者二六月庚子七月戊申也隂霾屏除陽德焜耀全吳之壤歡聲並作有年之慶復兆于茲七月辛亥自城還光福百官有司寅餞如初禮道路之人目擊儀容莫不改觀昜視蒲伏讃歎以為希有允恭復俾善畫者寫銅像勒之美石以章顯應之實古者水旱之祭曰雩禜或城門或山川或嶽鎮或海瀆或社稷郡縣則祭其界內所得祭者焉及佛氏以圓通威力方便慈悲利益群品在吳則銅像蓋自前代以來碑刻所載歷歷可考以今觀之其迹尤著冝吳人事銅像如事山川嶽鎮海瀆社稷而禮有加焉為民上者從其俗而嚴其事蓋無所祈榖實弭疵癘致豐穰以為聖天子養元元無疆惟休之計也是不可以無紀銅像示現之顛末見于舊刻者茲不復云至正十四年歲甲午秋七月白雲窗記鄱陽章君彥復以漕府史就養吳中即所居慶壽堂西偏之室揭故吳興趙魏公所書白雲二字于窗間因名其室曰白雲窗彥復博雅好修每讀書至堯舜之孝弟夫子之忠恕與夫趙少師司馬公之格言未嘗不反覆致思至大書于壁以備瞻省平居無所嗜獨喜畫草木花實𬞞茹之屬每畫尋自賦詩信筆輒有趣好事者多傳以為玩性廓落喜與朋友討論前言往行意氣㫪容與物無忤用是搢紳大夫樂與之遊其能言者皆為之賦白雲窗詩而未有為之記者間謂余曰吾先大父由曺之楚丘避河決徙鄱陽因家焉先府君青陽縣尹既捐館舍踐霜露濡銜恤罔極獨賴母夫人康強顧祿薄未足以備甘膬然飲水啜菽粗盡其歡猶愈于先府君之不待于今者此名窗之義子幸為吾記之昔者狄公登太行而望河陽也蓋猶有詩人陟阽之思焉然後世之凡思其親者必託雲以為諭雖以余之不敏亦以白雲名其山房雲何與于人之親哉使吾于親朝而出暮而歸口焉而滋味適體焉而輕暖𥙿起居焉而溫凊節色焉而愈容焉而婉蒸蒸焉無或違于志則雲也果何與乎親及一旦南赱越西適楚北首燕趙舉目千里孰為親舍於斯時也顧瞻山河俳佪而不忍去者獨見夫雲而巳彥復蓋嘗以公事驅馳于楚越燕趙之郊乎自其大父南遷而先人之廬不在楚丘先府君捐館而慈親之舍不在鄱陽當其匹馬之踟蹰山川之蕭條仰瞻飛雲反顧左右吾知其望吳門猶狄公之望河陽也雲乎果無與于親乎且狄公之忠義昭乎日月㓛烈著乎社稷德澤周乎四海百世之下有志之士聞其風而興起者蓋將勉焉以晞其萬一今彥復服膺前言而知夲乎孝弟篤躬往行而知由乎忠恕其於狄公蓋所謂聞其風而興起者也然余未足以言之姑即其名窗余所以名山房者申其義以為之記云虞麓精舍記常熟實孔子髙第弟子言偃氏子遊之鄉而海虞則吳之名山仲雍之墓與世傳太公望之石室在焉州人徐君公懋世居山之麓其先大父益陽府君起家儒林歷官中外而虞山之族日繁以昌公懋嘗介其從弟公逺以虞麓精舍圖示余且曰願有記也余辱交府君父子最密雅知公懋賢其讀書精舍工文辭以舉進士為業有日矣余聞之君子居必擇鄉逰必就士昔者七十子事夫子于洙泗其擇鄉且就士亦至矣然夫子沒弟子各以所學為諸侯師而西河之民至有疑子夏于夫子者而其學遂流而為莊周氏之徒子遊特起吳中北學于中國卒以文學得聖人之一體百世之下觀其服膺夫子之言則曰君子學道則愛人小人學道則昜使也其耴人則淡臺氏也其為邑雖武城之小必教以禮樂也考其言簡昜者宏以逹疏通者髙以暢究其為人則所謂敏于聞道而學之得其精華者豈欺我哉今公懋生乎文學之里則鄉不待擇也尚志淡臺氏之流則士不待就也入乎耳武城之聲洋洋也著乎心洙泗之言鑿鑿也布乎四體西河之人弗疑也形乎動靜莊周氏之徒不能蠱而惑之也夫為名族之人居名山之麓飲名山之水而能使國人稱而願之曰子遊之鄉有學府君之後有人嗚呼豈不賢哉彼文辭之工否進士之利不利抑末也不足為公懋道道其擇鄉就士之説因公逺以復之余不敏他日問津川上命駕虞麓覽仲雍之流風考太公之遺迹徘徊言氏之鄉以訪其故宅因假宿精舍尚能為公懋更僕論之夷白齋藁卷之二十七
