front:
  text: 夷白齋藁卷之十一
  hash: sha256:2e8607babfb6e8cf6e7f6fec54890ddee482afc14e6f0b9a62bfe3aa40fbdc2b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_011-1a}
body:
  text: 臨海陳基著金華戴良編長律送頋用之知階州磊落階州尹風流淮海人剖符新出牧觀國早充賔愷悌臨民意賢勞報主身威儀何逮棣辞氣𣸪恂恂河水遙通漢天文逈入秦度関鷄戒曉行路斗移春鸚鵡如人巧蒲萄勝酒醇王遵方叱馭張翰肯思􅐜斧扆憂黎庶銓衡重守臣致身湏老錬報政莫逡廵送謝叅軍十八韵帷幄掄材日君侯許國年三呉脩職貢六合倚蕃宣絳灌功難並龔黄政獨賢金湯新設險琴瑟重張弦借冦心離切安劉䇿最全肻甘周顗泣勇著祖生鞭殺氣連區夏妖氛亘海壖丹心期捧日赤手欲擎天緑愛蘇堤栁紅依庾幕蓮此行真特逹臨别更㽞連夜蹙西湖席春廽震澤船輕風催觧䌫落日慘離筵浩蕩十年客衰遲百慮牽眼青慚阮藉頭白事孫堅迹忝摳機近㤙沾雨露偏委身同草莾報主乏埃㳙知已青雲上忘形太古前願君容一壑随分老林泉安童右丞挽詩我昔逰亰邑公方振羽儀諌垣推謇諤經幄重論思國器魁羣彦風猷竦百司讜言從迕物直道不容私落落匡君略桓桓輔世姿太阿元自利白璧夲無疵河潰圗身禦嵩頺誓手支此心叅日月沒齒却磷緇民亦多勞只天胡不愸遺扶顛摧柱石謀國毁蓍龜垂死猶憂主平生不負知頋兹忠孝訓與爾子孫期謚法原終始㤙光邁䓁夷哀榮増感慨存沒繋安危墓木秋應拱風塵日未衰傷心行道者和淚讀豊碑郜同知挽詩循吏古稀有斯人今亦亡䰟應歸海岱身巳葬桐郷官近二千石年㡬八十霜秋風悲拱木愛日在甘棠賔客羊求軰児孫王謝郎史臣司衮鉞冝與彂幽光聮句至正十一年正月一日遂昌鄭元祐龍門僧良琦臨海陳基聯句送匡廬道士于彦成歸越兼簡蕭靖復盧益脩歲朝逢王春雨雪暗呉下行人當眀彂祐别𬒮慘莫把飄颻賀監舟基蹀躞靈運馬山驛梅始繁琦溪船浪仍打行紓荘舄唫祐去結逺公社禹穴紬奥編基蘭亭集群雅神運鶴􅌁朗風摽鵞經冩祐雙鳬継遐躅千秋祝純嘏基信慿囬潮尾春融枯樟骻祐越臺瞰蓬􅌡胥濤駕龕赭基白戦隠鞍甲緑醑酣􅊦斚祐智嚢倒精悍詞鋒彂侈哆琦蕭臺多神仙盧敖夲静者道樞混溟涬語穽脫謑髁祐但令冠峩峩肯羡綬若若滄海等稊米黄金真土苴接䍦或露髮短褐不掩踝捷若矢離弦勇如金躍冶青雲步伊始白雪和殊寡基土膏動句萌春情滿原野琦桂樹謌詎已栁枝折難舎基别夢梁月堕清談松風灑琦蓬藋既可居蘆菔自堪鮓基望望玉山阿来期卜燈灺祐絶句髙郵湖春深湖水漾汀洲耿七公祠在上頭蒲㠶十幅東風順眀日還君到䠂州次韻吳江道中兩䄂清風身欲飄杖藜随月步長橋仙人有約歸林屋共飲甘泉聴玉簫次韵臨平道中仗筞從軍事戰征簡書人畏漢章程去年此日山前路十萬妖兵一皷平題柯博士畫竹群玉仙人佩水蒼金莖分露服琳琅曽将天上昭華琯吹作飛龍奉玉皇題宋陵梅竹圖自從廷論主和親毛頴陶泓入御頻數葉寒梢吹欲折争教扶𧺫北枝春題摩癢馬圖将軍日日過南山射虎原頭暮未還獨繫驊騮枯樹下秋風摩癢箭瘢班題寒林讀書圖側耳幽泉入窈㝠近人嘉樹欝空青掛冠擬事陶貞白學注神農本草經題畫馬圗殷郎妙冩三神駿髣髴一嘶風滿林如此權竒世常有可䏻當價不論金題倪元鎮畫西池亭舘帶芙蓉雲水蒼茫一萬重此日畫圖看不足滿簾秋雨夢呉淞次韻劉徳方經厯白露池塘點翠荷越羅衣䄂覺秋多棃園弟子今華髮唱得開元供奉謌次韻送彦成玉山石路穿雲海湧山朝来爽氣有無間獨憐禹穴清狂客買得扁舟載酒還著屐溪頭日日過驪駒謌断柰君何虎丘山下東流水争佀春愁一半多戯和玉山韻西子湖邊蘇小宅錦官城裏薛濤家来時荳蔲𥘉含蘂别後菖蒲又著花媿我風情如栁絮多君才思佀春江無端飬得秦吉了日日呼人向碧窓東林蘭若題謝仲和墨竹謝家公子晉風流寫竹渾如黄澹㳺道人相對東林下滿室清飈生素秋踈篁翆著滄洲雨老樹青含太古春想見觧衣盤薄䖏爲渠爛熳寫天真題蒲栁鸎鶺圖髙栁風葉繁短蒲春露薄爲問出谷心何如在原樂題畫山茶折枝江梅與水仙難兄𣸪難弟一節傲冰霜無心媚桃李題月季花折枝啚瑞葉時時緑靈葩月月紅天非私雨露人自競春功臨平氛霧不見人晨曦忽生嶺倉卒過臨平舟眠猶未醒騷悼鶴文并序世稱浮丘伯善相鶴浮丘伯相鶴如伯樂之相馬所貴乎良馬者不以其䏻千里乎而鶴固仙者之驥一舉而千里者也然世無浮丘伯而鶴之䏻千里者豈少㢤彼羅而致之以充耳目之翫者雖復寵之乗軒食以厚禄亦從耴其羽毛之貞白音聲之髙逺舉止之馴雅非以其能千里也甚者鎩冲天之翮辱青雲之姿傍徨蹙恧使與鷄鶩争稻稷競膻腥以支朝夕之困而燕雀從旁鼓翼且得以俾倪而竊咲之矣是以神銷色沮敞惘低摧秋髙露零引吭長嘆若将求哀扵人而卒無知其意者嗚呼夫有仙驥之材千里之志縦世無浮丘伯亦豈無好事者如支道林矜其懊惋飬其羽翼以遂其軒舉乎然而不少隐忍䘚以憤懣失軄偃蹇無憀悒鞅不樂而化悲夫故余為文以悼之雖不敢自附上皇樵人若乃繾綣悲傷愍其不幸則亦庶㡬勒銘之遺意云尓其辞曰吁嗟鶴兮孰使有千里之質而不翔寥廓乎彼夭鳥獲貰扵硩蔟氏兮而尓鶴不逭夫矰繳乎汩鷄鶩使旅飲食兮孰若集華池而逰于甸也指幽樊媟以萃止兮孰若挟飄風而薄雲漢也浮丘邈其弗頋兮信斯生之不㳤彼支公或可幸而覬兮頋狷焉不屑此汙瀆載營魄邅其道扵冥漠兮秉眀心逝将焉告山川紆曲兮天地圜方尓神㳺兮紛翩翩乎帝郷濁世多患兮天上差樂御飛仙而下上兮羗鳯蹌而龍躍嗟尔鶴兮孰從而訊之生亦曷喜兮死亦曷悲茍庶乎其一致兮則余又奚愴怳而歔欷代弔岳飛文亘天地而長存兮惟孝與忠叅日月以齊明兮惟徳與㓛昔有宋之多賢兮禮彬彬其在魯彼絳灌或弗喻乎文兮随與陸豈良扵用武何夫子之英傑兮文與武其並施篤忠孝以為輿兮載功徳以驅馳當建炎之播越兮遵典午之遺轍豈将相之無其人兮夫子獨臨危而激烈友萇弘扵千載兮偕吳胥而上下猗嫖姚豈獨方略兮矧孫吳又長扵用寡使君王而不忘嘗膽兮則㓛業豈卑扵范蠡使左右而不信夫讒賊兮則斯讎豈容湏㬰而緩死彼便巧固不足誅兮此廷臣豈皆不㳤壊長城曽不少救兮棄神州逝将誰復嗚呼自古皆有死兮余獨扵夫子而永傷谷可變而爲陵兮海可化而爲桒炳父子之昭昭兮盖弥乆而有耿光弔遺墳扵西湖兮作新廟扵北山跽陳辭而敬酹兮􅏮生氣之桓桓弔徐節孝先生文歲行聿其将暮兮弭余節于淮之隂出郭門而望九原兮羌獨慕夫子而悲唫吾嘗竊觀乎聖門兮毎服膺扵曽氏後若人盖千載兮夫子實匑匑乎踐履嗟事親莫先養志兮夫子一何其恂恂謂事死有甚事生兮夫子盖已質之扵鬼神充百行扵一原兮其所養者正直炳文質之彬彬兮信有言者有徳昔有宋之重熈兮曰惟以孝爲治聖人作而萬物覩兮鳯鳥豈得髙飛而逺逝紛束帛又加璧兮眷側席扵丘園育菁莪沒齒郷校兮禮彌至而道弥尊少余粤在束髮兮知嘉言之是服謂君子之思孰先扵善兮斯奉盈而執玉歲冉冉其不與兮汩余未知所之叱其馭扵九坂兮柰何不畏隕踣而顛躋奉遺軆而過夫子之里兮懔淵深而冰薄反余躬其或庶㡬兮尚惓惓扵先覺率寮友而拜遺墓兮羞秋菊而薦寒泉仰泰山而企喬岳兮誓有永而無諼清暉樓辞并序吳興沈仲説父學古有文事大毋無間言所居東林有樓曰清暉金華王君子充記之以文予因推夲其志而為之辞曰東林兮北渚有樓兮式宴以䖏楶不雘兮丹不塗梠圜不過規兮方以為榘環之兮樹竹繚之兮蘭杜白雲兮在上原泉兮在下仰挟烟月兮俯臨風雨山之峯兮水之浦緑宛宛兮清暉暉其承宇入事有親兮出㳺有所昬兮旦寒兮暑温清適兮時以序原有秔兮隰有稌軒有􅍪兮肴有羜汲清流兮甘如乳搴幽芳兮菲菲􅊞予鳴琴兮酌醑樂清暉兮受天之祐歸鶴觧并序吳沈仲子以所畜雙鶴善鳴者遺其婣魯施氏至則喑不類常時且相頋低徊若悵焉有懐奮之意魯施氏閔之復以歸仲子則忻然鳴且舞不輟赤城山樵見而感之乃為作歸鶴觧客有羽衣玄裳過予而言曰吾胎化之属也家扵青田毓貞姿扵浮曠挺孤摽扵飛翰囙金氣而乗火精兮禀陽徳而長年世宗長扵羽族兮躬服馭扵神仙接帝子之蜺旍兮乗大夫之華軒參鸞鵠扵阿閣兮簉鵷鷺扵九天挟浮雲而凌飛霞兮㳺清都而朝上玄頋嘗脫飛弹扵桂陽撫故郷扵華表横江湖而徘徊望青冥之縹緲渴想瑶池之泉飢憶璚田之草金風颯而知秋玉露零而知曉感蕙帳之夜空悵昆丘之路杳羙荀瓌之純孝樂蘇耽之好道託軒墀以並萃期歲寒以相保矧義侔金石之固契恊芝蘭之深始不間扵青蠅兮終靡惑扵孔壬念懿親扵疇昔脩雅好扵方今辱使者以将命遺公子以好音予自慚扵徴羽彼過重扵兼金扵是影遲遲扵中路情慘慘扵故林曰曈曈以乍晞雲屏屏而載隂意欲往而復止目反頋而哀唫眷碧􅜲以嘿嘿盼翠竹以喑喑豈伊人之不㳤頋睽離之莫任幸幡然而見惻獲遂予之𥘉碩覧歸塗而聮翩尋前盟以繾綣慕求友之鸎鸎􅊞子飛之燕燕将翡翠以戯苕偕鳯鳥以翔甸豈汩沒扵鷄羣終羽儀扵霄漢惟吾子之好脩秉中心之孔嘉假清言以逹志庶察予之匪它諒去􅈬之不茍誓卒歲以婆娑予方俛焉以荘聽客忽不知其所之但聞九臯之餘音如助予之齎咨夷白齋藁卷之十一
