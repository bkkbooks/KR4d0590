front:
  text: 夷白齋藁卷之十一
  hash: sha256:2e8607babfb6e8cf6e7f6fec54890ddee482afc14e6f0b9a62bfe3aa40fbdc2b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_011-1a}
body:
  text: 臨海陳基著金華戴良編長律送顧用之知階州磊落階州尹風流淮海人剖符新出牧觀國早充賔愷悌臨民意賢勞報主身威儀何逮棣辭氣𣸪恂恂河水遙通漢天文逈入秦度關雞戒曉行路斗移春鸚鵡如人巧蒲萄勝酒醇王遵方叱馭張翰肯思􅐜斧扆憂黎庶銓衡重守臣致身須老錬報政莫逡巡送謝參軍十八韻帷幄掄材日君侯許國年三吳修職貢六合倚蕃宣絳灌功難並龔黃政獨賢金湯新設險琴瑟重張弦借冦心離切安劉䇿最全肻甘周顗泣勇著祖生鞭殺氣連區夏妖氛亘海壖丹心期捧日赤手欲擎天緑愛蘇堤栁紅依庾幕蓮此行真特逹臨别更留連夜蹙西湖席春廽震澤船輕風催解纜落日慘離筵浩蕩十年客衰遲百慮牽眼青慚阮藉頭白事孫堅迹忝摳機近恩沾雨露偏委身同草莾報主乏埃涓知已青雲上忘形太古前願君容一壑隨分老林泉安童右丞挽詩我昔逰亰邑公方振羽儀諌垣推謇諤經幄重論思國器魁羣彥風猷竦百司讜言從忤物直道不容私落落匡君略桓桓輔世姿太阿元自利白璧夲無疵河潰圗身禦嵩頺誓手支此心參日月沒齒却磷緇民亦多勞只天胡不愸遺扶顛摧柱石謀國毁蓍龜垂死猶憂主平生不負知顧兹忠孝訓與爾子孫期諡法原終始恩光邁等夷哀榮增感慨存沒繫安危墓木秋應拱風塵日未衰傷心行道者和淚讀豐碑郜同知挽詩循吏古稀有斯人今亦亡魂應歸海岱身巳葬桐鄉官近二千石年幾八十霜秋風悲拱木愛日在甘棠賔客羊求輩兒孫王謝郎史臣司衮鉞冝與彂幽光聮句至正十一年正月一日遂昌鄭元祐龍門僧良琦臨海陳基聯句送匡廬道士于彥成歸越兼簡蕭靖復盧益修歲朝逢王春雨雪暗吳下行人當眀彂祐别𬒮慘莫把飄颻賀監舟基蹀躞靈運馬山驛梅始繁琦溪船浪仍打行紓莊舄吟祐去結逺公社禹穴紬奧編基蘭亭集群雅神運鶴􅌁朗風摽鵝經寫祐雙鳬繼遐躅千秋祝純嘏基信慿回潮尾春融枯樟胯祐越臺瞰蓬􅌡胥濤駕龕赭基白戰隱鞍甲緑醑酣􅊦斚祐智囊倒精悍詞鋒彂侈哆琦蕭臺多神仙盧敖夲靜者道樞混溟涬語穽脫謑髁祐但令冠峩峩肯羡綬若若滄海等稊米黃金真土苴接㒿或露髮短褐不掩踝捷若矢離弦勇如金躍冶青雲步伊始白雪和殊寡基土膏動句萌春情滿原野琦桂樹歌詎已栁枝折難舍基别夢梁月墮清談松風灑琦蓬藋既可居蘆蔔自堪鮓基望望玉山阿來期卜燈灺祐絶句髙郵湖春深湖水漾汀洲耿七公祠在上頭蒲帆十幅東風順眀日還君到楚州次韻吳江道中兩袖清風身欲飄杖藜隨月步長橋仙人有約歸林屋共飲甘泉聽玉簫次韻臨平道中仗策從軍事戰征簡書人畏漢章程去年此日山前路十萬妖兵一鼓平題柯博士畫竹群玉仙人佩水蒼金莖分露服琳琅曽將天上昭華琯吹作飛龍奉玉皇題宋陵梅竹圖自從廷論主和親毛頴陶泓入御頻數葉寒梢吹欲折爭教扶起北枝春題摩癢馬圖將軍日日過南山射虎原頭暮未還獨繫驊騮枯樹下秋風摩癢箭瘢班題寒林讀書圖側耳幽泉入窈冥近人嘉樹鬱空青挂冠擬事陶貞白學注神農本草經題畫馬圗殷郎妙寫三神駿髣佛一嘶風滿林如此權竒世常有可能當價不論金題倪元鎮畫西池亭館帶芙蓉雲水蒼茫一萬重此日畫圖看不足滿簾秋雨夢吳淞次韻劉德方經厯白露池塘點翠荷越羅衣袖覺秋多梨園弟子今華髮唱得開元供奉歌次韻送彥成玉山石路穿雲海湧山朝來爽氣有無間獨憐禹穴清狂客買得扁舟載酒還著屐溪頭日日過驪駒歌斷奈君何虎丘山下東流水爭似春愁一半多戲和玉山韻西子湖邊蘇小宅錦官城裏薛濤家來時豆蔲𥘉含蘂别後菖蒲又著花愧我風情如栁絮多君才思似春江無端飬得秦吉了日日呼人向碧窗東林蘭若題謝仲和墨竹謝家公子晉風流寫竹渾如黃淡遊道人相對東林下滿室清飈生素秋踈篁翆著滄洲雨老樹青含太古春想見解衣盤薄處為渠爛熳寫天真題蒲栁鶯鶺圖髙栁風葉繁短蒲春露薄為問出谷心何如在原樂題畫山茶折枝江梅與水仙難兄𣸪難弟一節傲冰霜無心媚桃李題月季花折枝啚瑞葉時時緑靈葩月月紅天非私雨露人自競春功臨平氛霧不見人晨曦忽生嶺倉卒過臨平舟眠猶未醒騷悼鶴文并序世稱浮丘伯善相鶴浮丘伯相鶴如伯樂之相馬所貴乎良馬者不以其能千里乎而鶴固仙者之驥一舉而千里者也然世無浮丘伯而鶴之能千里者豈少哉彼羅而致之以充耳目之玩者雖復寵之乘軒食以厚祿亦從耴其羽毛之貞白音聲之髙逺舉止之馴雅非以其能千里也甚者鎩沖天之翮辱青雲之姿傍徨蹙恧使與雞鶩爭稻稷競膻腥以支朝夕之困而燕雀從旁鼓翼且得以俾倪而竊笑之矣是以神銷色沮敞惘低摧秋髙露零引吭長嘆若將求哀于人而卒無知其意者嗚呼夫有仙驥之材千里之志縱世無浮丘伯亦豈無好事者如支道林矜其懊惋飬其羽翼以遂其軒舉乎然而不少隱忍卒以憤悶失職偃蹇無憀悒鞅不樂而化悲夫故余為文以悼之雖不敢自附上皇樵人若乃繾綣悲傷愍其不幸則亦庶幾勒銘之遺意云尓其辭曰吁嗟鶴兮孰使有千里之質而不翔寥廓乎彼夭鳥獲貰于硩蔟氏兮而尓鶴不逭夫矰繳乎汩雞鶩使旅飲食兮孰若集華池而逰于甸也指幽樊媟以萃止兮孰若挾飄風而薄雲漢也浮丘邈其弗顧兮信斯生之不淑彼支公或可幸而覬兮顧狷焉不屑此汙瀆載營魄邅其道于冥漠兮秉眀心逝將焉告山川紆曲兮天地圜方尓神遊兮紛翩翩乎帝鄉濁世多患兮天上差樂御飛仙而下上兮羌鳯蹌而龍躍嗟爾鶴兮孰從而訊之生亦曷喜兮死亦曷悲茍庶乎其一致兮則余又奚愴恍而歔欷代弔嶽飛文亘天地而長存兮惟孝與忠參日月以齊明兮惟德與㓛昔有宋之多賢兮禮彬彬其在魯彼絳灌或弗喻乎文兮隨與陸豈良于用武何夫子之英傑兮文與武其並施篤忠孝以為輿兮載功德以驅馳當建炎之播越兮遵典午之遺轍豈將相之無其人兮夫子獨臨危而激烈友萇弘于千載兮偕吳胥而上下猗嫖姚豈獨方略兮矧孫吳又長于用寡使君王而不忘嘗膽兮則㓛業豈卑于范蠡使左右而不信夫讒賊兮則斯讎豈容須臾而緩死彼便巧固不足誅兮此廷臣豈皆不淑壞長城曽不少救兮棄神州逝將誰復嗚呼自古皆有死兮余獨于夫子而永傷谷可變而為陵兮海可化而為桑炳父子之昭昭兮蓋彌久而有耿光弔遺墳于西湖兮作新廟于北山跽陳辭而敬酹兮􅏮生氣之桓桓弔徐節孝先生文歲行聿其將暮兮弭余節于淮之隂出郭門而望九原兮羌獨慕夫子而悲吟吾嘗竊觀乎聖門兮每服膺于曽氏後若人蓋千載兮夫子實匑匑乎踐履嗟事親莫先養志兮夫子一何其恂恂謂事死有甚事生兮夫子蓋已質之于鬼神充百行于一原兮其所養者正直炳文質之彬彬兮信有言者有德昔有宋之重熙兮曰惟以孝為治聖人作而萬物覩兮鳯鳥豈得髙飛而逺逝紛束帛又加璧兮眷側席于丘園育菁莪沒齒鄉校兮禮彌至而道彌尊少余粵在束髮兮知嘉言之是服謂君子之思孰先于善兮斯奉盈而執玉歲冉冉其不與兮汩余未知所之叱其馭于九坂兮奈何不畏隕踣而顛躋奉遺體而過夫子之里兮凛淵深而冰薄反余躬其或庶幾兮尚惓惓于先覺率寮友而拜遺墓兮羞秋菊而薦寒泉仰泰山而企喬嶽兮誓有永而無諼清暉樓辭并序吳興沈仲説父學古有文事大毋無間言所居東林有樓曰清暉金華王君子充記之以文豫因推夲其志而為之辭曰東林兮北渚有樓兮式宴以處楶不雘兮丹不塗梠圜不過規兮方以為矩環之兮樹竹繚之兮蘭杜白雲兮在上原泉兮在下仰挾煙月兮俯臨風雨山之峯兮水之浦緑宛宛兮清暉暉其承宇入事有親兮出遊有所昏兮旦寒兮暑溫清適兮時以序原有粳兮隰有稌軒有􅍪兮肴有羜汲清流兮甘如乳搴幽芳兮菲菲􅊞豫鳴琴兮酌醑樂清暉兮受天之祐歸鶴解并序吳沈仲子以所畜雙鶴善鳴者遺其姻魯施氏至則喑不類常時且相顧低徊若悵焉有懷奮之意魯施氏閔之復以歸仲子則欣然鳴且舞不輟赤城山樵見而感之乃為作歸鶴解客有羽衣玄裳過豫而言曰吾胎化之屬也家于青田育貞姿于浮曠挺孤摽于飛翰因金氣而乘火精兮稟陽德而長年世宗長于羽族兮躬服馭于神仙接帝子之霓旍兮乘大夫之華軒參鸞鵠于阿閣兮簉鵷鷺于九天挾浮雲而凌飛霞兮遊清都而朝上玄顧嘗脫飛彈于桂陽撫故鄉于華表橫江湖而徘徊望青冥之縹眇渴想瑶池之泉飢憶璚田之草金風颯而知秋玉露零而知曉感蕙帳之夜空悵昆丘之路杳美荀瓌之純孝樂蘇耽之好道託軒墀以並萃期歲寒以相保矧義侔金石之固契協芝蘭之深始不間于青蠅兮終靡惑于孔壬念懿親于疇昔修雅好于方今辱使者以將命遺公子以好音豫自慚于徴羽彼過重于兼金于是影遲遲于中路情慘慘于故林曰曈曈以乍晞雲屏屏而載隂意欲往而復止目反顧而哀吟眷碧􅜲以默默盼翠竹以喑喑豈伊人之不淑顧睽離之莫任幸幡然而見惻獲遂豫之𥘉碩覽歸塗而聮翩尋前盟以繾綣慕求友之鶯鶯􅊞子飛之燕燕將翡翠以戲苕偕鳯鳥以翔甸豈汩沒于雞羣終羽儀于霄漢惟吾子之好修秉中心之孔嘉假清言以逹志庶察豫之匪它諒去􅈬之不茍誓卒歲以婆娑豫方俯焉以莊聽客忽不知其所之但聞九臯之餘音如助豫之齎咨夷白齋藁卷之十一
