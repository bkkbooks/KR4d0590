front:
  text: 夷白齋藁卷之五
  hash: sha256:c15a5e1377a7f94abf4a4d932cc1bd086d8dfe571e3f15d4f1af6ad529deb662
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_005-1a}
body:
  text: 臨海陳基著金華戴良編古詩七言椘州舊將歌椘州舊將守椘城身與羣凶殊死爭父母遭烹妻子戮終天之恨何時平近從王師却征椘歸尋父母身死所忍疼刺血漬白骨髑髏無言淚如雨烹父之卒今尚存恐懼𣸪讎前自陳將軍謝卒汝勿畏我志為國非為親群凶所重在其首汝輩區區𣸪何有若令殱戮止渠魁親骨有知當速朽將軍將軍孝且忠天地有盡悲無窮吾聞古有王陵母仗劒殺身成漢功東臯隱者詩為范思賢作錢塘隱者東臯子讀書賣藥青門裏云是前朝防禦孫至今住近蒲橋市蒲橋東頭楊栁青門前好山終日橫承家善起小兒疾好古不求當世名韓康之後誰流亞宋清巳矣無來者世上如今市道人紛紛見彈思梟炙眼明有此東臯生百年義重黃金輕江湖放浪詩千首風月徘徊鶴一聲顧余亦是忘機客買藥青門始相識為君長嘯上東臯極目千峰倚空碧次韻玉山倡和詩東方日出浴咸池夸父追之死不歸彼仙之人列與莊寓言非寓狂非狂維南有箕不簸揚此語在詩理不爽彼幻乃尓為譸張鳯凰飄飄千仞翔蝨也蠢蠢獨處襠秋風八月霜露涼芙蓉始花水滿塘美人贈我明月璫何以報之白玉觴舉觴不飲意氣揚出門一笑江泱泱人言名教樂未央明哲所貴唯守常安用策勛封醉鄉我聞夏殷時聖亦師務光宓子乃得友鳴琴不下堂人生莫歎居無儔林宗乃為叔度留李膺亦𣸪同仙舟平生癡絶顧虎頭我歌此曲君聽否為君更賦逍遙逰次韻垂虹橋泊舟倡和何年伐石駕危橋鯨浪翻江白雨飄勢控三吳虹倒影氣吞七澤水通潮重淵有怪犀難照蔓草無名火不燒伯國黃金開鑄像王門白玉想為標㓛成海上身先退膾熟江東興可邀歲月幾何流水逝山川如舊古人遙鴻飛矰繳何由篡鶴去樊籠不可招浩蕩扁舟歸鑑曲寂寥方丈似中條越人尚以雞為卜椘俗相傳鵩類自把文章論倚伏敢將交態較淳澆五湖煙景隨時異萬里風萍觸處漂却憶春暉樓上去為君裁取玉為簫分題賦得太湖送鄭同夫朝飲太湖水暮詠太湖秋太湖三萬六千頃七十二峰居上頭上稟咸池五車氣下浸日月涵斗牛鴟夷之舟從此逝㓛成身退合天道聲名萬古齊伊周江東步兵輕冕旒長揖齊三歸故丘蓴羔鱸膾何足道上與造物同遨逰唐家拾遺巢許流躬耕湖上食杞菊不與濁世俱況浮三人之生不並世出處雖異心則侔至今血食太湖上上下雲氣乘蒼虬今君遙别太湖渚鼓枻三髙祠下路借得龍威一席風送君彭蠡湖頭去送毛生歸越昔人受易田王孫孟喜梁丘同一門卓哉古學貴師授愛尓毛生敏而秀侍父居官千里餘從師問業三冬後越王臺上瞰滄溟百川趨之終不盈毛生東歸究源委看見陽烏海底生織錦篇絡緯秋啼金井根佳人當窗織鳯麟流雲拂拭春無痕頃刻化作鴛鴦文銀漢含風星斗搖虛空迸出黃盤雕為君裁作宫錦𫀆奪得當年廬肇幖妾家夲住牽牛渚與君誤結同心縷人間乃多離别苦夢落陽臺不成兩腸斷無心為君織向君拋却支機石何時頭戴蓮花巾相伴雙成禮白雲青絲絡馬頭送李彥章青絲絡馬頭逰宦古蘇州蘇州城東萬斛舟前年運粟直沽口送别江亭折楊栁承恩頭插上陽花錫宴尊傾光祿酒江上今年楊栁黃辟書千里有輝光勇騎閫外將軍馬飽食閩中荔子漿閩中女兒歌白苧把酒勸君為君舞將軍好文不好武自古閩中稱樂土送李景先録判閶門栁枝短君行不可緩贈君不折楊栁枝勸君飲此金屈巵丈夫將身誓許國安用當歌傷别為青絲絡鞚黃金勒逰宦鄱陽山水國何處春風最憶君琵琶洲上䕷蕪碧送讓還吳西風蕭蕭鴻鴈鳴行子悠悠隨斾旌百年衣食仰奔赱四海甲兵紛戰爭猥將筆札事卿相叨備戎行陪俊英軍中草檄吾何有馬上操觚汝所能人稱阿買八分好我愛永興戈法精吾女咿嚘學言語汝兒讀書知姓名中年竊祿正為此使有石田歸力耕汝今還家我羇旅各勸加餐調寢興升堂再拜謁從母兒妹踉蹌欣赱迎扁舟石湖上先隴霜露既降草木零丁寧為我戒樵牧慎勿剪傷松柏青我𣣔還山結茅屋五嶽逍遙期向平乞身時宰苦未許南望白雲勞我情謝從義參軍自亰師還言中書危參政見問且訝無書因述詩寄謝參軍過我夷白菴為言廊廟髙巗巗故人誰為國柱石臨川先生危大參猥蒙問及且見訝十載尺書無一緘憶昔相從客燕趙削去涯岸無猜嫌辱陪五更佐三老勸講六經陳二南御史不容丞相忌司隸側目宫臣讒脫身黨籍赱吳椘託迹丘園求孔聃孰令展禽三見黜自分嵇康七不堪平生不解帶刀劔晚歲強使聞韜鈐髀銷怕騎將軍馬面皺羞著從事衫折衝師旅非夙習奔赱戎行真可慚危言重畏速官謗微祿不逮供親甘慰情屢抱鞶絲女與國未辦添丁男胡為長年在道路席不暇暖突不黔幾回乞身向藩省未許曝背歸茅簷終當投核謝寮友徑去結屋依山嵐鄙夫出處蓋如此為報先生聊口占先生事業則異是論道經邦民具瞻早令四海偃兵甲盡遣百姓趨農蠶時和歲豐我所願切成身退公當諳它年若訪赤松子一笑相逢掀紫髯孟冬觀淮水孟冬日日東風狂長淮水與風爭強層濤如山勢欲立怒潮􅊇上相頡頏大舟亂流流轉急人馬蟻集駭欲僵篙師捩抱誇好手迎風簸浪抑且揚小舟徑渡矜勇捷翩如一葉凌空翔須臾掀舞浪花裹廽瀾百折爭低昻我聞夏后分四瀆百川受職皆循良邇來洪河恣陸梁清濁混殽隳舊防昨者王師扼淮口坐制鯨鯢如犬羊天吳罔象不敢動河失故道誰之殃漢武當年塞瓠子勞民兆亂紛搶攘中原父子化魚鱉至今千里無耕桑我欲訴帝敕河伯便𣸪故道安天常清者自清濁者濁勿冒約束于明章不然帝怒速致討河伯戮死吁誰傷鄭遂昌以趙魏公所題髙尚書畫遺沈東林要豫賦詩髙俠髙俠畫無敵魏公之書何可得半幅冰紈不盈尺千年老幹化虬龍氣挾太隂雷雨黑彼美幽篁尤正直挺身故有千鈞力赤松子孤竹君鄙夫與尓情最親逍遙嵗晚東林下杖策相從鄭子真題五王逰春圖五王坊宅五雲中天仗時來駐六龍君王不廢家人禮兄弟惟知友愛隆每日朝回從飲博今日胡為逺遊樂曲江池上杜陵南花氣醺人栁隂薄天子無為四海平梨園法曲教新聲救時宰相寧憂此誤國姦邪計己萌當年若寶千秋鏡友愛如𥘉無嬖幸只緣聲色解移人萬里蒙塵蜀山永一幅丹青感慨多開元事業竟如何自古宴安為鴆毒至今荆棘嘆銅駝題馬都事夀椿堂堂前古椿樹問年不知數葉葉芘芝蘭枝枝承雨露椘南之種昔同根淮海移栽子𣸪孫共持春酒為親夀但碩親年如此椿椿隂滿地休教掃留與年年蔭萱草夷白齋藁卷之五
