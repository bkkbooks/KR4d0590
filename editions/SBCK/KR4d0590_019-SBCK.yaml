front:
  text: 夷白齋藁卷之十九
  hash: sha256:a4a2309990054dabc8e6f16a79a818e8ab11e8959b2ae1bed6840cf9788848bb
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_019-1a}
body:
  text: 臨海陳基著金華戴良編序送陳景􅀄序君子之為僚吏得賢公卿而事之則政斯舉矣今海道都萬户眀善公之政揔􅈇䑓也属海㓂之餘糧艘䧟沒者叅半􅈇民比户告病公奉聖天子命以􅈇事為已任甫下車問事緩急審次第而為之令行禁止雷動山立東南列郡侯伯受牒聴令惟謹一時僚吏莫不争自激昂願以材自效譬猶營壘士卒一􅀴李光弼􅃅令氣色乃益精眀其轉旋闔闢之機􅀁以為􅀦家軍儲􅀷長計者固皆出扵公之眀㫁而其􅀙容賛相動􅃴事冝非賢僚吏亦何􅁕以䖏公幙下此陳君景􅀄􅀁以得事賢公卿之道景􅀄瑰瑋闊逹雅有器局􅁸家憲曺由蘇杭二大府史遷􅈇府􅀁至皆以材􅀎爲長吏􅀁信任聲􅁛藉藉乆矣自􅀦家以海爲􅈇渠􅀊轉東南之租賦毎以春夏由吳門趣直沽履洪濤如平地視萬里猶咫尺上而佩金符綰紫綬而爲萬夫長下而職之書佐餽饟而居幕府者皆安然囿扵皇靈之内雖有􅀷渉之勞而無不虞之變盖八十餘年扵此矣及一旦鯨鯢悍然不安天常慿􅁜鼔舞風掀浪擲堅舟利楫糜爛韲粉扵狼狽之頃董􅈇大臣素以豪傑自許者顛頓辟易蹙縮而無􅀁措其剉衂亦甚矣繼其後者徒手以承其􅁦春夏兩􅈇亦欲以時逹亰師非有明断如公者紀綱乎其上賛襄得人如景􅀄䓁周旋乎其下則洪濤萬里無胫而欲行無翼而欲飛亦誠不易矣然則平居無事人材若無與扵世至扵倉卒之中利害叵測然後得人則濟非人則否噫中流失舟一壷千金豈虚語㢤今景􅀄書滿􅀅調閫外之势眡􅈇䑓益崇使移事􅈇長之道以事連率折衝畫諾㳺刄扵有餘之地則閭外之政亦斯舉矣異日又移此以逰外廷升中朝莫不皆然則享榮名躋膴仕非景􅀄而誰欤扵其行也吳之大夫士咸賦以餞之属余為之序送􅈒上人序吳門哲上人事其師學出世間法居城東祚真蘭若自刻甚清苦今年冬􅀅挈缻􅃬之四方叅大浮屠以竟其學士大夫與上人善者咸賦詩以餞之上人吳人也吳為沃壌其人喜事佛好施予佛之徒往往飾宫廬崇塔廟有餘力􅂺買良田厚積蔵資懋􅁶以為常産不朽計盖其習俗􅀁尚非一日矣自兩淮用兵資糧器械百物之需􅂑扵吳者無慮十八九民力滋耗事佛庸少􅈈而佛之徒亦方僕僕與其民奔赱有司出賦稅以給公上閔閔焉惟􅂲不及是懼昔之􅀁常産今􅃴􅁕以為患浮屠寳坊魚鼔􅅸響平時累數百人為徒者至是皆相率引去祚真城東小蘭若爾其師弟子頋優㳺無事俛焉夙夜惟知有出世間法上人有􅀅浩然四方􅀙大浮屠逰視其去􅈬若無豪髮世累者盖上人之師弟子不求多扵世彼為常産計者皆求多者也求而不知止患孰甚焉今四方名山具存而其叢林凋落亦如吳之􅀁謂寳坊乎抑猶有異時規矩弗墜也然向之特盛者莫如吴興錢唐吳門既爾錢唐亦􅀙可知上人此行􅀅何􅀁􅃴乎吾聞浮屠氏之法無中邊無彼此求之者無逺無近混物我扵一途䓁虚空為法界然後不舉􅁕而四方見前此古之􅀁謂逰乎方之外者也上人不求多扵世斯行也􅀅無入而不自得尚奚以業林之規矩墜弗墜為㢤上人字古心其師則元明其􅃅也送陳希文北上序人之厭江湖者則思山林厭山林者則思城郭居城郭者則思㳺乎通邑名都以日充其􅀁見聞譬猶魚之䖏池沼則慕湖陂䖏湖陂則慕江海䖏江海則又欲脫鱗鬛生羽翰􅅸雲蜺負青􅁳以逹乎天地而止焉亰師士大夫之天池也士之生乎斯世苟耳目聦眀心志卓犖手􅁕無拳攣之疾肩背無傴僂之患賤不至扵馬醫辱不至扵奴􅀠貧不屑為販賈工祝之事非詩書之言不習非禮義之地不踐非逢掖之服不服非章甫之冠不冠言可以信乎朋友貌可以接乎公卿大夫氣可以折衝乎尊爼智可以效官使扵駿奔執事之間乃可汗漫扵江湖栖遟扵山林浮湛扵城郭居卑而䖏汙局縮而偃蹇徒資於姍咲扵僕妾甚無謂也故必扷泥塗擊奔飈左攀鱗右附翮翩翩焉􅀭揚焉翺翔乎帝郷徘􅆦扵清都如吾友陳君希文者豈不卓然瑰瑋之士㢤希文之志則壮矣頋余與希文生同妵居同里學同業而年又差長疾不至扵拳攣而不得道希文以為先患不至扵傴僂而不得􅀙希文以為後賤有甚扵馬醫辱不翅扵奴􅀠貧雖欲為賈販工祝而不可得徒亦服逢掖冠章甫居則誦詩書行則稽禮義踽踽以自信倀倀而無徒其視希文去而折衝乎尊爼希效扵駿奔執事者殆猶斥鷃皷翼蓬蒿之下而不知九萬里鵬之一息也尚安敢語天池㢤余不􅀎俛首帖耳以􅗲倖天池之有力者徒因希文行書以為貺朱氏格致餘論序余觀古人以方術相授受多不苟扁鵲古之良醫也遇長桒君十餘年而始得其禁方長桒君豈古愛方者㢤徒欲授之得人以活人爾昔宋氏渡江良醫之在中州者曰河間劉守真氏戴人張子和氏真㝎李明之氏三家之學同出扵黃帝扁鵲而其用則有攻􅀘之不同者盖􅀁遇之時然也宋末江南之人惟羅太無氏之傳得其宗太無逮事穆􅁜􅀦亡退䖏民間未甞䡖以醫語人而人亦卒未有􅀎師之者烏傷儒者朱君彦脩飭身礪行有古君子之風而􅀹好醫方術甞讀素問而歎曰此載道之書也頋非儒者不􅀎讀而醫固儒者之事也古之􅃅為良醫者皆有師今之為醫不必師徒守故方以倖人之不死者非醫之罪也醫之無師乆矣嗚呼吾尚忍爲是㢤乃彂憤求師不逺千里赱吳䠂不􅀎得患至杭有言羅氏者君􅀱之累數十徃不得見君囙旦日徃立扵其門日且暮不少動羅察其意䔍始引見之與語大說乃盡以三家之􅈲告之并授之書且曰熟此可以活人矣君謝曰諾遂以書歸讀之反覆尋繹上逹扵靈樞太素内外甲乙之書以及百家無不貫穿而得其精且微者積以􅀊月然後出而視人之疾如是而生如是而死無不切中一時學者故方之習亦因以丕變君遂以􅀦醫名東南而三家之學不專扵中州而君老矣門人徃徃請著書乃摭其歴試而驗者論次而筆存之捴凡若干卷夫羅氏不􅁿以語人而君得之亦不易冝其信之䔍用之精而爲書又􅁕以傳諸其徒而㳤諸其人君與羅氏視古人皆可以無愧矣余雖未及識君幸因其髙第弟子趙君以徳而得見其書以徳俾為序乃述其授受淵源之自使讀書知醫不可以無師而得師尤不昜云羅氏名知悌君名震亨至正十五年正月甲子序送韋道寧詩序韋君道寧世為中州衣冠家由浙西憲曺辟吏崐山常熟兩州有􅀎聲浙西部使者賢而薦之為福建奏差􅀅行中吳大夫士與道寕善者送之南門之外有酌道寧酒而為之言者曰道寕起憲曺執文書事兩州長吏􅀁食升斗禄耳而獨以潔㢘有吏􅀎為部使者􅀁知盖道寕讀書通古今為詩文奕奕有風氣啜菽飲水而牛羊之飬弗過焉其素􅀁藴蓄者未昜以淺近闚也福建古大閩地秦漢以来始列中􅀦今天下一家四夷八蠻九貊百粤皆􅀠軄方而福建扵閩為土中江浙行省􅀁統大藩閩特大以逺部使者職耳目任風紀扵此視他道尤重奏差古行人之職也凡部使者有事扵行御史府及中䑓􅂉四方各道奏差悉主之非明憲度習文法善辞令􅅚威儀者不􅁕以堪之道寜起身憲曺則憲度明矣辟吏兩州則文法習矣讀書通古今則辞令善矣而又􅀅之以潔㢘本之以孝敬是行也吾見其出入部使者􅀙事間以事使行御史府中䑓四方各道其周旋有禮進退有容應對􅀙容中矩此皆其素􅀁藴蓄者䓁而上之殆無施不可夫豈惟行人而已乎閩雖逺且阻然􅃅樂土道寜以賢􅀎見辟固不敢以逺自憚亦不徒以土爲樂盛年勤王事脫身簿書􅀙賢部使者爲僚􅀙皆父母之􅀁􅀃者扵是華其行者咸賦詩以贈之属余爲之序左丞潘公射吳江佛寺浮圖詩序吳江華嚴寺有矢著浮圖鐡鏁上不至顛者若干尺世傳金人渡江及宋人西出師元兵南征過此皆射焉􅀊乆矢弊寺僧更設一矢以存故事上下二百餘年矣徃来觀者相指示然卒未有復岀竒試抽矢以擬其後者今年夏中書右丞潘公􅀅兵過其下時夜漏下二刻月􅆖􅆖見浮圖上矢影公異之乃頋左右􅂑弓矢一彂正中其顛舉軍皆賀且曰公天威也好事者争爲謌詩以壮之夫弧矢􅀁以威天下然天下不患無良弧矢患無善用弧矢者耳故無飛衛雖有燕角之弧􅃋蓬之簳不􅀎以貫懸蝨雖有蚡胡之笴肅慎之砮不􅀎以穿楊葉射不􅁕以中㦸牙雖有烏􅃅越􅁄象弭繡質􅀅見蒼黃失錯蒲服剉衂且不暇尚何威之有㢤吾故曰不患無良弧矢患無善用弧矢者耳今公位兼􅀅相勇冠三軍其視飛衛飬􅅩僅一藝尔􅀅不􅁕爲公道然浮圖􅀝天􅋍若千仞雖素百彂百中苟非天晶日明􅀅不敢􅂺自岀竒與昔人争必中之鋒扵上下二百餘年之間乃今按兵澤􅀦彀弓持滿水光迷􅁳夜氣􅋁閴公獨賈勇萬夫控弦一彂而􅀎自决竒中使争快覩之人伏公為天威夫豈偶然也㢤世無飛衛飬􅅩而公固善用弧矢者也昔南霽雲為睢陽乞師賀蘭不􅀙因彂憤射浮圖示必滅賀蘭天下至今義之今公豈狃扵必中徒􅂑以驚動一時資好事者為羙譚而巳亦示為􅀦家必誅無道而征不庭也冝好事者聞而壮之謂非公不􅁕以弧矢之利非弧矢不􅁕以顯公之㓛公固不以㓛自居然天方用弧矢以㝎四方飛衛飬􅅩既不可復作公其可不自愛乎雖然士有以忠信為甲胄禮義為干櫓不操弓而隣􅀦畏不挟矢而天下威利倍扵弧矢㓛顯扵百彂百中此周公之􅀁吐哺而公􅀁冝為國逺謀者余不佞敢與國人􅁛願之而公尚無以謙讓未遑為也至正十六年六月既望序夷白齋藁卷之十九
