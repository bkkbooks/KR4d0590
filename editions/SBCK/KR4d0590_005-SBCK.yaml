front:
  text: 夷白齋藁卷之五
  hash: sha256:c15a5e1377a7f94abf4a4d932cc1bd086d8dfe571e3f15d4f1af6ad529deb662
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_005-1a}
body:
  text: 臨海陳基著金華戴良編古詩七言椘州舊􅀅謌椘州舊􅀅守椘城身與羣兇殊死争父母遭烹妻子戮终天之恨何時平近􅀙王師却征椘歸尋父母身死􅀁忍疼刺血漬白骨髑髏無言淚如雨烹父之卒今尚存􅂲懼􅂧讎前自陳􅀅軍謝卒汝勿畏我志為國非為親群兇􅀁重在其首汝輩區區􅂧何有若令殱戮止渠魁親骨有知當速朽􅀅軍􅀅軍孝且忠天地有盡悲無窮吾聞古有王􅁜母仗劒殺身成漢功東臯隐者詩為范思賢作錢塘隐者東臯子讀書賣藥青門裏云是前朝防禦孫至今住近蒲橋市蒲橋東頭楊栁青門前好山终日横承家善􅁸小児疾好古不求當世名韓康之後誰流亞宋清巳矣無来者世上如今市道人紛紛見彈思鴞炙眼明有此東臯生百年義重黄金􅁿江湖放浪詩千首風月徘􅆦鶴一聲頋余亦是忘機客買藥青門始相識為君長嘯上東臯極目千峰倚空碧次韵玉山倡和詩東方日出浴咸池夸父追之死不歸彼仙之人列與荘寓言非寓狂非狂維南有箕不簸􅀭此語在詩理不爽彼幻乃尓為譸張鳯凰飄飄千仞翔蝨也蠢蠢獨䖏襠秋風八月霜露涼芙蓉始花水滿塘美人贈我明月璫何以報之白玉觴舉觴不飲意氣颺出門一咲江泱泱人言名教樂未央明哲􅀁貴唯守常安用筞勛封醉郷我聞夏殷時聖亦師務光宓子乃得友鳴琹不下堂人生莫歎居無儔林宗乃為􅅩度㽞李膺亦􅂧同仙舟平生癡􅅸頋虎頭我謌此曲君聽否為君更賦逍遥逰次韻垂虹橋泊舟倡和何年伐石駕危橋鯨浪翻江白􅀨飄􅀔控三吳虹倒影氣吞七澤水通潮重渊有怪犀難照蔓草無名火不焼伯􅀦黄金開鑄像王門白玉想為標㓛成海上身先退膾熟江東興可邀􅀊月㡬何流水逝山川如舊古人遥鴻飛矰繳何由簒鶴去樊籠不可招浩蕩扁舟歸鑑曲􅄫寥方丈佀中條越人尚以鷄為卜椘俗相傳鵩類自把文章論倚伏敢􅀅交態較淳澆五湖􅃄景随時異萬里風萍觸䖏漂却憶春暉樓上去為君裁􅂑玉為簫分題賦得太湖送鄭同夫朝飲太湖水暮詠太湖秋太湖三萬六千頃七十二峰居上頭上禀咸池五車氣下浸日月涵斗牛䲭夷之舟􅀙此逝㓛成身退合天道聲名萬古齊伊周江東􅇍兵􅁿冕旒長揖齊三歸故丘蓴􅅅鱸膾何􅁕道上與造物同遨逰唐家拾遺巢許流躬畊湖上食杞菊不與濁世俱況浮三人之生不並世出䖏雖異心則侔至今血食太湖上上下雲氣乗蒼虬今君遥别太湖渚鼓枻三髙祠下路借得龍威一席風送君彭蠡湖頭去送毛生歸越昔人受易田王孫孟喜梁丘同一門卓㦲古學貴師授愛尓毛生敏而秀侍父居官千里餘􅀙師問業三冬後越王臺上瞰滄溟百川趋之终不盈毛生東歸䆒源委看見陽烏海底生織錦篇絡緯秋啼金井根佳人當窓織鳯麟流雲拂拭春無痕頃刻化作鴛鴦文銀漢含風星斗揺虚空迸出黄盤鵰為君裁作宫錦􅂁奪得當年廬肇幖妾家夲住牽牛渚與君誤結同心縷人間乃多離别苦夢落陽臺不成兩腸断無心為君織向君抛却支機石何時頭戴蓮花巾相伴􅀟成禮白雲青􅁝絡馬頭送李彦章青􅁝絡馬頭逰䆠古蘇州蘇州城東萬斛舟前年運粟直沽口送别江亭折楊栁承㤙頭挿上陽花􅃬宴尊傾光禄酒江上今年楊栁黄辟書千里有輝光勇􅀐閫外􅀅軍馬飽食閩中荔子􅄴閩中女児謌白苧把酒勸君為君舞􅀅軍好文不好武自古閩中􅁛樂土送李景先録判閶門栁枝短君行不可緩贈君不折楊栁枝勸君飲此金屈巵丈夫􅀅身誓許􅀦安用當謌傷别為青􅁝絡鞚黄金勒逰䆠鄱陽山水􅀦何䖏春風最憶君琵琶洲上䕷蕪碧送讓還吳西風蕭蕭鴻鴈鳴行子悠悠随斾旌百年衣食仰奔赱四海甲兵紛􅀾争猥􅀅筆札事卿相叨􅇱戎行陪俊英軍中草檄吾何有馬上操觚汝􅀁􅀎人稱阿買八分好我愛永興戈法精吾女咿嚘學言語汝児讀書知姓名中年􅀼禄正為此使有石田歸力畊汝今還家我覉旅各勸加飡調􅆍興陞堂􅄪拜謁􅀙母児妹踉蹌欣赱迎扁舟石湖上先隴霜露既降草木零丁寜為我戒樵牧慎勿剪傷松栢青我􅁒還山結茅屋五岳逍遥期向平乞身時宰苦未許南望白雲勞我情謝􅀙義叅軍自亰師還言中書危􅂙政見問且訝無書囙述詩􅀉謝叅軍過我夷白菴爲言廊廟髙巗巗故人誰爲􅀦柱石臨川先生危大叅猥􅀩問及且見訝十載尺書無一緘憶昔相􅀙客燕趙削去涯㟁無猜嫌辱陪五更佐三老勸講六􅀴陳二南御史不容丞相忌司􅀠側目宫臣䜛脫身黨籍赱吴椘託跡丘園求孔聃孰令展禽三見黜自分嵇康七不堪平生不觧帶刀劔晚􅀊強使聞韜鈐髀銷怕􅀐􅀅軍馬面皱羞着􅀙事衫折衝師旅非夙習奔赱戎行真可慚危言重畏速官謗微禄不逮供親甘慰情屢􅈽鞶􅁝女與􅀦未辦添丁男胡爲長年在道路席不暇暖突不黔㡬囬乞身向藩省未許曝背歸茅簷终當投覈謝寮友􅈳去結屋依山嵐鄙夫岀䖏盖如此為報先生􅂓口占先生事業則異是論道􅀴􅀖民具瞻早令四海偃兵甲盡遣百姓趋農蠶時和􅀊豐我􅀁願切成身退公當諳它年若訪赤松子一咲相逢掀紫髯孟冬􅀚淮水孟冬日日東風狂長淮水與風争強層濤如山􅀔欲立怒潮􅊇上相頡頏大舟􅅍流流轉急人馬螘集駭欲僵篙師捩抱誇好手迎風簸浪抑且􅀭小舟􅈳渡矜勇捷翩如一葉􅇒空翔湏􅁷掀舞浪花裹廽瀾百折争低昻我聞夏后分四瀆百川受軄皆循良邇来洪河恣陸梁清濁混殽隳舊防昨者王師搤淮口坐制鯨鯢如犬羊天吴㒺象不敢動河失故道誰之殃漢武當年塞瓠子勞民兆亂紛搶攘中原父子化魚鱉至今千里無畊桒我欲愬帝􅃙河伯便􅂧故道安天常清者自清濁者濁勿冐約束于明章不然帝怒速致討河伯戮死吁誰傷鄭遂昌以趙魏公􅀁題髙尚書􅀞遺沈東林要予賦詩髙侠髙侠􅀞無敵魏公之書何可得半幅冰紈不盈尺千年老幹化虬龍氣挟太隂雷􅀨黒彼羙幽篁尤正直挺身故有千鈞力赤松子􅀌竹君鄙夫與尓情最親逍遥嵗晚東林下杖筞相􅀙鄭子真題五王逰春圖五王坊宅五雲中天仗時来駐六龍君王不􅆸家人禮兄弟惟知友愛隆每日朝囬􅀙飲愽今日胡為逺㳺樂曲江池上杜􅁜南花氣醺人栁隂薄天子無為四海平棃園法曲教新聲救時宰相寜憂此誤國奸邪計己萌當年若寳千秋鏡友愛如􅀄無嬖倖只縁聲色觧移人萬里䝉塵蜀山永一幅丹青感􅁣多開元事業竟如何自古宴安為鴆毒至今荆􅁄嘆銅駞題馬都事夀椿堂堂前古椿樹問年不知數葉葉芘芝蘭枝枝承雨露椘南之種昔同根淮海移㦳子􅂧孫共持春酒為親夀但􅂅親年如此椿椿隂满地休教掃㽞與年年䕃萱草夷白齋藁卷之五
