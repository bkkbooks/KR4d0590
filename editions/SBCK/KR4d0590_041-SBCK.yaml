front:
  text: 夷白齋稿􅀘遺
  hash: sha256:7a491b8e11132aefce0e86a50052c937816ce6249d305c2841af18de66118d35
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_041-1a}
body:
  text: 樂府詠歸操呉人沈仲􅀃搆亭曰詠歸每服田之暇􅂺絃歌其中盖􅀅有感扵曽􅀧氏之言意也為一闋俾絃而歌以自適云我朝于田我暮于室􅂚以自娯有琴有瑟我服惟春我樂惟親我欲浴乎沂濆匪舟􅀆孰先我津我欲風乎舞雩匪若人􅀆孰為我徒我葺我廬我讀我書我啜有菽我􅄿有􅂼我非悦此新搆我詠歸􅀆匪夕伊晝我非愛彼流水吾褰衣􅀆欲沿其沚聖如可作􅀆吾􅀙夫子玉山辭為頋仲瑛作山嵁嵁􅀆磅礴太古木葱葱􅀆雲英英而欲雨日朝出􅀆在户先輝輝􅀆水流其下匪君子􅀆夫誰與處采我蘭􅀆為佩褰我荷􅀆為盖從子于山􅀆聊逍遥以䘚歳望仙詞為陸叔陽道士作木蕭蕭􅀆中洲雲慘慘􅀆山幽仙之人􅀆其耒逰􅂌真詮􅀆慰所求翩然駕鶴􅀆不可以乆㽞􅀝天風􅀆特悵望以夷猶呉儂謡至正十四年呉歳饑秋七月海道都漕運萬户府逹魯花赤明善公為糴米賑之呉民感徳歌是以頌城上日出行且趨呉民􅀒米懽且呼漕府君侯長萬夫糴米食儂如哺雛君侯運粟輸京都都人食稅復衣租又以餘力甦焦枯連年和糴喧九衢呉儂有粟不得餔遂令斗米如斗珠不貴楮幣貴青蚨郷村白屋多􅏉逋尫羸操瓢行塞途㣲矦哀儂釡生魚嗷嗷枵腹多作莩昨日児飢泣嗚嗚今日飰飽走匍匍君侯長漕非剖符不忍赤子坐艱虞使君㱕朝掌訏謨濟世昇平樂有餘天下米賤酒可沽上及父母下妻孥天子行當錫鋒車君侯幸勿遲其驅逺歸曲陸乗車水乗舟関河何綿綿波浪復悠悠車行阻雪舟阻氷陸憂􅉘狼水鯢鯨我生不學慿河術柰何欲與重險争朝辤舟暮辤馬鶺鴒相呼在原野白魚可烹雀可炙諼草羅生滿堂下離倫婦有婦見夫乆貧辤去後夫至顯宦感而作我弗干人􅀆我讀我書日不能具餐􅀆又無完􅃭雖云至貧􅀆匪謂之病何以自􅃾􅀆惟道之為信爾婦誠愚􅀆不見燕燕之于飛胡違乎大倫􅀆乃甘學買臣之妻我一日官榮􅀆印綬赫若爾母我尤􅀆我不爾怍吁嗟宋女􅀆何遼以邈群珠碎傷呉帥潘元紹衆妾作潘七妾皆青年􅅸色善纂組歌詞因潘出軍恐致疑皆自經繡紋刺綺春纎長蘭膏􆁖鬂瓊肌香芳年艶質媚花月三三兩兩紅鴛鴦翠靴踏雲雲帖妥海棠露濕胭脂朶冶情紛作蝶戀春新曲􅀙翻玉連􅃈􅀞堂銀燭天沉沉􅀭眉一咲輕千金明珠買得緑珠心欲揮魚膓掃妖彗主君勿疑心似醉一宵痛擊群珠碎門前䥫􅀐嘶寒風竒勲觧使歸元戎俠客行俠客双鹿盧鵜膏淬銛鍔試舞出嚴城群寇膽盡落從軍行関河􅂦沸􅆭民生志士麄豪氣不平誓掃􅍴搶安郡邑長驅鐡􅀐事􅌹征古詩五言京回徐翁招飲園亭初歸自神京歴碌辭逺道適過故人居嘉􅀣䕃芳草􅋢此時雨歇綠隂净如掃君子謝軒冕泉石遂幽討清吟對琴尊暢飲還自考逹㢤松雲翁逍遥詎知老秋日鄭明徳林居疋馬走城市不知秋巳深晨興訪南郭落葉滿空林窈窕藜藿逕蕭條松桂林相逢遂忘返白雪有餘音分題劍池送夏副樞劍斮山石石㫁餘劍痕􅂕池􅂥海眼絶壁㧞天根鹿盧卷晴若崑崙翻積厚早弥冽汲深夕不渾上馴伏丘乕下飲垂澗猿君行心不渝瑩澈鑑兹源分得萬字送王副樞匠石􅀵棟梁所貴得楨榦君侯廊廟具㧞一勝千萬夙膺國士知食􅀰官飯真純謝彫琢俶儻去崕㟁宥宻佇勲賢行㢤慰宵旰送髙郵縣尹何士敬淮海作邑還故郷故郷百戰餘四野草茫茫我甞過維舟湖傍充膓拾生藜􅀍体無完裳日求魚蝦利夜依蘆葦目非人形見此心孔傷非無親戚人遭兵盡逃亡貴者為乗車事侯五賤者􅊢殘䘚􅀒戈服戎行貴賤各有役衣食刀窮老不休息遑恤懐舊􅆠近䝉新有司督課􅇵驅羊吾餘脫身向乕狼骨􅁏雄僅存魂魄尚驚惶􅀁覬在矜閔憲章今君尹兹邑錦衣晝生光撫摩宜有術字育豈無創痍軰大小安農桒未春給牛種先秋謹堤防寛猛務緩急斯􅁢􅆇勿令厭鄊里勿令輕善良坐収平易功令聞堂秋風吹江漢呉楚渺相望丈夫貴􅀣立䟦渉諒何妨送謝元功有引予與桐川錢君成夫同在江浙分省幙君與予言浙東西􅀁交之賢必首及謝元功今年予自淮南使呉越過杭詢元功巳為故祕書卿宣城貢公寓苐之在海寕者因公􅀄捐舘有師弟之義為􅀴紀其喪也悵怏不及相見比予還呉門元功不逺數百里訪予扵旅寓手錄其為詩文示讀乃知君之言可信予㳺四方所相知而好者貢公所與同幕而相得者錢君今公巳矣錢君又在淮楚江湖􅄫寞之濵方以􅆻元功為喜兹又告別不能留而巳夫情也賦以送之故覼縷云士生穹壌間所需莫如友予與錢貢㳺紅顔今白首貢公青雲􅄊聲價齊北斗平生經濟畧棄置十八九緘封天人榮遺言殆芻狗錢君廊廟姿不在宣城後髙科􅀄拾芥大雅超擊􅇲吐氣騰虹霓落筆粲瓊􅅼連年辱同事南北共奔赱情深肺腑親􅀔􅇵左右手謝于兩卿間氣誼無薄厚生者各異縣死者未丘首求我衰老際驩甚忘新乆纍然大布衣言若不出口坐論當世事徃徃辰及酉哆若囊出物鉅細無不有䄂中文一編渾淪却雕鏤置之几席間光彩生甕牖前徴桐川言可以慰衰朽今晨忽告別䌫觧呉門柳􅀅行謁上相慷慨攄抱􅀒移書分省垣誰能甘畎畝我病弗克餞話酌河梁酒黽勉納鄙詞中悁聊為剖訪北寺無言講主秋風日蕭爽散䇿入空林有竹心巳清無言意彌深􅄂花不容把踈磬有餘音逍遥毗盧境落景駐遥岑小丹丘對雨懐元功大􅁺玄懿大魁江湖秋巳深城郭氣弥欎晨興獨延佇雲容四郊宻急雨洒空際長風恣飄忽爽氣浮四簷秋聲肅群物黄葵神獨王時菊情更逸物理有􅃜盈人情互信屈二子殊未来興懐詎云畢興懐􅀉元善經歴敬甫郡司晨興寓公舘獨居無與儔撫事感時邁懐人慨川流髙子􅅛偉器倜儻富材猷王君卓越姿精白動王侯兩兩瑛璚瑶一一􅃢瑚鈎持以奉君子永言無悔尤使莭感于邁􅁁城肅豼貅多病去請告却掃謝鳴騶獨慙樗散質黽勉副咨諏昔為􅀝玉葭今為無匹儔踽踽孰余侣倀倀良自羞仲夏積􅍂潦凉飈颯驚秋征斾行復還采薪亦巳􅪜既為卿相知寕忌社稷􅁨按牘紛鞅掌吏卒日呀咻遟君同料理肅駕勿遲㽞與戴􅅩能㳺寳積山寺宿西方丈上冢桃塢原尋僧寳華麓舟泛石湖清茗煮韽泉綠山空木巳落天髙氣弥肅松月有餘輝共向西巖宿次韻張士行陳庻子天平山中三題山居有餘樂縦逰良不􅀌生多濟勝具豈辤􅁕力劬䖏䖏青蓮座人人僧寳珠雨花無宿蒂玉􅀣盡新株品題經閣老人境兩俱殊勞生局形跡矯首􅓽踟蹰昭明寺我覧天池作名篇如刻珉蹇予亦何為未甞造其濵清時入朗詠洒然清我神何當託髙翮去訪觧空人天池田家近芒種客至巳黄昏開門列芳席稍稍羅盤飧忠厚有餘訓詩書彌􅀁敦琴詠衡門下聊復却塵煩范荘詠楊山人號山隣城市恒苦隘入山卜佳隣不求言語好自愛風土淳與山日相親便是擇里仁知翁折行軰近得離世人自云䘮亂乆俱非太平民所願休兵甲畊鑿不辤貧別周文逹錄判僕本匪才承乏江浙樞府都事今杭錄事判官周文逹以簿書從事幙下􅀅十稔為至正乙巳僕奉丞相命校藝秋闈而文逹寔給事焉事竣􅀅還呉門文逹惓惓焉兾一言為別因賦古􅃟四韻塞其意云黄葉滿洲渚秋風生薄寒今夕復何夕弭棹浙江干頋我今皓首羡子尚紅顔戀戀綈袍意臨分重􅀝䦨竹里子猗歟竹里子㡬世家擕李晝永竹成林林深净無滓清風日蕭森鳴鸞多好音平安有消息歳寒同此心伍大夫祠官􅀕作惟孝可報親惟忠可匡君忠孝在天地千古猶生存故國有遺廟血食吾呉民􅎛􅄴肅致奠恍覩貞烈魂九月十二日感懐示姪麟流光巳深秋重陽過三日衡門寡儔侶獨坐誰與適豈無妻與妾亦復少顔色頼有阿咸賢相知共休戚柳胥水墅何為名緑楊遶堤滸哀㢤伍大夫忠魂吊無􅀁空遺江上潮懣氣作吞吐回望闔閭城蒼􅃼隔􅃄霧古詩七言送髙元善太守卦任杭州髙侯別我錢唐去雨暗江城秋欲暮憶􅀙傾盖楚公門握手論交如有素羡君家世為牧守出典方州人􅋢慕楚公賔客君最先日把詩書佐神武折衡師旅文字間飲馬長江竟飛渡􅃧下三軍皆乕勇幕中一􅁺驚鸞翥開口瀾翻􅀃劉項抵掌縦横論遷固我時落魄大布衣公亦招徕俾馳騖西樞上馬常並轡南省聞雞復聮歩我曽記侯松雲巢侯亦醉我芙蓉署交情過辱如兄弟話別愁聞戒徒御南風九月無秋聲積雨三呉靄氛霧侯乘髙車駕五馬方靣公卿加禮數錢唐兵革嗟屢經民社誅求尚無度省中􅀰署盡知巳左右樞機當要路雖云􅀔分有上下若語同寅實親故古来太守二千石今則藩翰深􅀝注東南􅀁重在保障繭絲區區何足務曲令市井復承平莫遣湖山廢逰豫為謝分垣馬左司使便無令惜書䟽宋劉凝之􅀐牛圖穎川劉翁厭􅀐馬去作匡廬牧牛者手招五老日㗸山脚踏烏犍泥没踝天聖君臣仁且賢翁獨胡為甘棄捐致君堯舜荷時傑尚友巢許安吾天翁朝出逰歸巳暮􅋨挿山花向何䖏柳隂殘照尚分明安用蒼頭􅋚前路蒼頭引牛翁不知牛亦無心隨所之醒時不記醉㱕路翁心自信無他岐當時好事圖踪跡千載流傳増歎息如今馬上看青山不似􅀐牛有顔色虞克用山居圖克用一字勝伯雍公之玄孫斈士之􅀙姪也玉堂仙人虞學士家住青城洞天裏一隨雲霧起􅀙龍遂掌絲綸佐天子五色製成雲錦章黼黻王度虞唐自􅀐黄鵠㱕帝郷蜺旌羽盖叅翺翔空留舊宅青城下草木猶含雨露香諸孫乆作東呉客每憶青城歸未得故人焦粲妙丹青為寫山居張素璧學士今陪石與丁徃来多在芙蓉城五嶽文人時送迎他年或復㳺人世應與諸孫宴㡢亭西老園圖神仙中人世稀有少小結交今白首昔年同謁西王母飲以不死長生酒酒􅋨只嫌穹壌窄翻身少試􅀴綸手却尋女媧􅀘天䖏弥縫罅􅂩填諸漏紛紛濁世混􅆇否豈耰鋤與箕帚酒醒一咲忘妍醜天地為家日月牖我昔住近空明天紅塵失脚五十年與君道學無始先􅓽􅂑蓮花作酒船蕋珠官中鶴息仙結習同探玄中玄相從宴坐西老園脫離世故追羲軒本長老秋山圖青山青入空紅􅀣照山紅白雲掩冉青蓮官得非天台華頂峰太古削出金芙蓉上人深居山㡬重足跡不與人間通迩来流漫天南東與世髙談臨濟宗時時飛錫洞庭野或東或西無定蹝我欲􅀙之􅄅何許昨日􅀉書索吾語披圖恍欲􅇒風雨上人無心我無句有山便與山作主無山亦可隨方住吾為上人作是􅀚物我相忘吾與汝詩巢杜侯􅄝詩乆成癖所得名萹如拱璧起居飲食與詩俱自以詩巢號居室我聞上世皆巣居未有詩書誰與娯耕田鑿井無知識渇則飲􅀆飢則食杜侯仕宦㳺廟廊出有車馬居髙堂何用􅂑巣之偪側無乃嗜詩如稲梁古詩三百淳且古上述陶唐訖神禹後来作者非不多律以康衢無足􅂑杜矦所尚今非古大義人人存肺腑苟能以古律今人孰謂塗人異堯禹杜矦杜矦爾誠賢坐我與侯聴􅂑無臭無聲萹提兵餘杭作黄埃漲天􅄥曜靈夜吠天犬如雷聲掃空􅍴搶五百丈四海􅂦沸何由平孫呉穣苴早昧學忍擲宣毫事横槊本憐墊溺垂手援危事那堪務掎角勉呼卒旅結陣行什什伍伍分干旌雖云兵者古凶􅄊詎敢黷武窮蒼生鳥翔蛇蟠紛起陸御枚火攻機貴速勦除魁醜一鼓桴立决雌雄奚待卜夥㢤萬命繇元戎長驅凱旋非是功要令郡邑緫寕謐辟􅂖自甘從赤松桂珠謡一名桫欏子至正壬辰九月望夜半􅀙空堕下廣寒宫前秋色老桫欏子結虬枝杪剛風吹顫玉蟾丹桂經霜香似掃雪㕙提杵􅃻丁東驚落蠙璣銀􅊴空羿妃孀居不遑惜蚌胎撒下塵寰中五絲可穿雲纚纚顆顆圎明蕩秋水若逢湘女採蘭逰定向波心綴成珮月光如練鋪晴霄世人拾玩英瓊瑶􅀣根呉質睡未醒粉霞綬冷花飄遥律詩五言送梅同知任杭籍甚梅通守才名属盛年官聮唐刺史家世漢神仙郡有湖山勝身承雨露偏新吟與遺􅋢到䖏共流􅀓和庻子學士􅂕巗山即事二首髙山􅇒絶頂習静借僧房湖繞􅆂空閣雲埋響􅓏廊數朝人跡㫁千載伯圖荒吊古并書景吟詩送夕陽雲山静飬痾禅榻􅀝松蘿毎見青猊座無聞白苧歌琴䑓惟鳥哢􅇵浩波律詩七言次韻懐華㓜武滑滑春泥滿郡城出門􅀐馬不堪行未能學道􅀙緱母且復忘憂對麯生流水小池垂釣影春風深巷賣花聲停雲賦罷心如渇安得滄浪濯我纓送馬易之代祀海岳老矣文園馬長卿九重天上直承明長門賦罷黄金賤宣室㱕来白􅄠生海岳祝釐紆使節江湖懐友劇心旌十年一見非今雨買得鱸魚為子烹次韻謝叅政送錢㕘軍淮南不為桂枝㽞老我曽同李郭舟漢􅀅又開新幙府桐川寕憶舊莵裘功名同􅀝匡衡切詞賦深知􅁃信愁一片􅀌雲是親舎定依楚尾望呉頭秋日與張士行㳺虎丘十五年前此地㳺化人城􅊴俯滄洲靈池有眼還通海頑石無心亦􅀧頭故國山川呉伯業名家䑓沼晋風流明朝又上􅆂空閣一􅄃江湖萬里秋送劉􅀰中呉下衣冠盡楚材隴西勲業冠雲䑓􅀰官幕府芙蓉秀覇主江山錦綉􅄏地􅀔東南吞百粤天威咫尺近三台從容延閣論思舊早晚鋒車趣召来山中與戴􅅩能對榻楞伽石湖上也六朝古寺白雲封黄葉堆門路㡬重下界􅃄雲秋一棹上方鐘鼓月千峰道人語黙天機熟詞客􅀙横賦茟雄老我平生貪佛日一龕蕭洒慕何顒登呉横山望東洞庭一上尭峯望洞庭東山咫尺􅀔堪􅇒橘林霜老金千顆紺􅊴雲蔵翠㡬層吊古獨耒尋晋宋酌泉誰與別淄澠戴顒自是忘機者相約同叅大小乗登楞伽千尺懸厓手自攀上方塔廟􅀝孱顔村村黄葉寺􅁁寺䖏䖏白雲山外山車馬趨城塵泱漭􅃄霞鋪地錦斕斒東南勝槩秋如􅀞賸得山翁倒載還石湖上􅀚音巖􅀘陀山枕海波寛古洞誰移此地安巖下碧潭長浸月雲根瑶草不知寒棲篁鸚鵡呼人語伏磵蜿蜒聴法蟠嵲屼石橋方廣路也湏一度恣盤桓石湖與戴􅅩能同舟懐雪坡大叅乗時􅀕掃匪㳺盤故舊相携盡楚冠兵革􅀾争雖未息湖山陶㕐有餘􅂬輞川賔客惟裴迪江左功名獨謝安想見鳯皇池上路秋風吹珮玉􅃢􅃢至正乙已四月廿七日與家兄上冡石湖洎逰諸山石湖觧䌫日髙㫪同上靈巗㝡上峰紺􅊴下臨波萬頃琴䑓髙入翠千重客因弔古頻登閣僧為迎官誤擊鐘一碧五湖如鏡净扁舟㱕計不難􅀙右登􅂕巗古木蒼藤開寺門清泉白石駐華軒丹青不改天平廟閥閱猶知慶暦尊四靣峯巒旗鼔列一村桒柘子孫蕃皇皇卷服餘生氣再拜令人愧後昆右天平謁范祠舟中與家兄叙別􅀴年兄弟隔呉淞一日相思意萬重上冡石湖欣共載尋僧山寺復相􅀙新墳已洒春前涙舊物猶餘刼後松公事相牽又離别江湖何䖏採芙蓉聞庻子遷城居二老相看如弟兄十年事主况同盟不誇跡黍金閨近最喜班聮玉署清焚却銀魚當遂􅀮􅀐㱕白鹿有餘荣鑑湖一曲他年事期看荷花靣􅆕生送嘉定偰知州偰家公子狐白裘两度出為江海州誅求不廢農桒業撫字曽分社稷憂公勤守職古能吏清白􅀓家漢列侯老我叨居玉堂署送君欲泛練川舟歸呉送信道元還呉興楊墳寺千里歸来滿靣塵垂虹亭下覔閒人自慙元亮為官􅂴却喜湯休淂句新夜雨西窓談舊約春風南浦問通津他年翔鳳山居裏㝎借禅床􅀉幻身長律春日泛石湖木蘭人稳載出郭蕩鷗沙碧浪重湖滿青山疊岸賖望帘懐竹葉舉槳撥桃花落絮魚吹逺㳺􅁝燕拂斜蘋香含宿雨杏艶奪朝霞恰恰聞鶯侣纎纎透荻芽東風騁吟興聊尔荅年華絶句古意折栁繋離舟栁短舟難繫頼有枝上花風吹送君去採桒女採桑葉盈筐􅅙飢㱕恐晚鴛機羅錦􅃭生世不經眼天屏山龍門兩崖竪棖臬峭若􅄦斧鑿神魚此飛過蜿蜒露頭角􅂕巖山琴䑓峯頂鼔絲桐韻雑松風瀉至今千載餘猶有烏啼夜支硎山寒泉一􅂀銀潢流浸濕雲根冷風逆皺文漪瀉下青天影花鹿山石屋山骨作棟梁莓苔􅀞青綠八窓夜不扃借與白雲宿夾浦松江頭起䖏笠澤波相連自昔輿梁圯誰来一濟川石塘湖波渺無極鯨背跨長虹不假秦鞭力終成抵障功石門千室縁隄次邪嬴聚石門青帘招逺睇繋棹緑楊根画逺峰隔塵喧閑花淡心素翛然竹數竿引凉娯晝坐江邉梅裏心􅈽貞素江雪立挺挺無􅀙􅀉逺人照水澹寒影陳惟􅁢畫逺別匡廬雲雅冝事耕耘農􅂩坐􅀣底讀書疑似君夢醒夣醒西齋暁懐人正􅄫寥不堪窓外雨滴滴在芭蕉渡江千里長風萬斛舟颿飛天塹浪花秋中原烽燧消耒未擊楫空慙祖豫州過石湖千頃㣲茫一棹秋白鷗樷􅂻謾夷猶蒹葭兩岸山如許何䖏堪尋范蠡舟登楞伽慿􅞿登登紫翠巔此身髙出萬家􅃄群峰􅈝立湖波上玉井明開太華蓮五月調兵赴杭嘉等䖏五月農家正力耕不堪田䑕食苗萌羽書昨報轅門急情感元戎合調兵肅肅兵行餉糗儲可容野掠不寕居拯民水火湏當亟要息風塵大憝除令符五月領三軍拂拂南薫觧垢氛從此蚩尤旗盡捲炎荒一掃犬羊群暑炎南國􅀬如湯鎧甲師徒整伍行盻及凱還抛重􅀒呉山結屋卧方床雞冠不是長安闘血鮮猩紅露洗暮秋前司晨不觧惟呈色空戴峩然古進賢次韻虞􅀮君堪潘閫􅁺􅂖雨中見􅀉十􅅸虞卿潘令緫能文􅆻結情親若弟昆昨日雨中能過我憶君無語到黄昬呉箋新製玉鸞紋衝雨殷勤􅀉蓽門燕子不来人獨立自拈湘管認啼㾗東風吹雨冷蕭齋數日泥深無賣柴何必民心怨枯槁九重膏澤降天街柳條綠妥水平堤茅屋隂隂濕燕泥自料封侯巳無分煙蓑雨笠合幽棲鏡中短􅄠日毿毿情緒如絲未吐􅅙杳杳旌旗愁欲破兩年有警在淮南􅔄事東皇苦恡晴眼中春色可憐生夜来一覺羅浮夢翠羽梅梢故故鳴東家結屋朝築基西家織錦夜鳴機人生活計不可缺我獨纍纍無所歸我家舊在赤城傍數畝山田一草堂記得雪中隨射獵弋鳬掩兎過崇岡曽隨射獵過崇岡薄暮歸来煮酒香豈料青山不相識草堂􅃄㓕石田荒春水漪漪􅃞麹塵春郊花柳織成茵明朝寒食清明近愧我東西南北人謝沈仲􅀃送酒次費圜韻雙榼青衣饋合􅌚羅浮春色照杯柈梅花窓下東風別今夜吹人不敢寒送江西丁省􅀰赴京奏捷西省􅀰官定百蠻黄􅈋瘴􅂻喜生還盡平南海鯨鯢窟㱕奏中天虎豹関本長老紅蕉圖霞絢酣紅勝海榴層層蓮瓣出重樓道人色相皆成幻翠葉􅀙渠不柰秋劉司馬山居機雲入洛名為累賈誼浮湘志莫酬何似當年陶靖莭一官彭澤便㱕休至正乙未志異九月十日也日光畫晦黒雲堆甲􅀐虗空似徃回又有流星西北堕大如盤磬響如雷由范荘過天平范家門巷緑隂濃棟􅀣花飄㡬信風自咲㣲官苦覊􅅞看山惟獨後諸公至南峰放鶴亭天峯紫翠列天屏石逕苔花汚􅄚青為念仙禽覊不得縦他飛去剰􅀌亭予卧病呉中家兄命􅀙子慶来省巳因㱕賦此送之猶子吾家千里駒窮冬問疾到中呉明朝又鼔松江舵離思紛紛滿五湖汝叔今年五十強姪児十九氣方剛經書自是傳家事要見丹山出鳳皇至正甲辰憶横山親墓石湖僧舎親葵呉山歳巳深秋霜春露毎驚心青青長養松杉􅀣牧子樵童幸莫侵山護招提紫翠連湖光一鏡到門前白頭便盍抛塵鞅来向禅房借榻眠賛戴九􅂕先生像賛仁義為􅅚身之具忠信為奉國之資飫乎詩書其旨也永發乎文章其聲也希天􅀅以其藴至和之粹則必擁腫其本而卷曲其枝陶當世之懿則必翔而後集覧徳輝而下之若人也盖􅀅視時為去就而以道為樞機者欤雑著郷飲田先王之道見扵記禮家書盖其跡爾鄊飲酒其一也三代以降好名之君不求其本􅀼􅀼然徒舉其迹而行之世之知禮者固巳執筆而議其後矣宋三百年文治之盛盖彬彬焉君子猶以為未能復古其流風遺俗之見扵郷者盖猶􅁕徴如四明飲酒有田是也及運去物改禮壊樂崩為民上者徴求而已耳召發而巳耳関决趣辦而巳尓至扵郷飲禮􅀋以為老生之常談時政之不足務而郷飲之田寕兼併扵浮屠氏之手而弗顧好禮者雖欲復覩先王之迹而不可得庸詎知蔡君彦文起家郡吏乃能毅然以禮為已任而浮屠氏亦不得不以田来㱕禮之可以服人也如是㢤田既㱕矣又庸知後之君子不因是而復覩先王之跡也㢤然則君之扵禮盖義形扵色者也䓁而上之使得為其所得為凡禮之所在其有不毅然者乎故余扵是田重有感扵先王之蹟刑平編志予􅀚刑平一編見君子有憂世之志焉盖刑者民之司命祖宗之􅀁哀矜而惻怛者也承乎之日有司務守文墨奸吏因縁為市率舞智飾巧以徼一切之利由是曲直混殽是非紕謬而獄市日益以煩司􅀠不必問御史不必言而薦紳先生顧諰諰焉操董狐之筆㫁士師之案信已枉罰餘􅇳毅然以懲徃􅂆来為已任如故學士承旨長沙歐陽公侍講學士豫章掲公其扵斯世一何憂之至耶天暦中詔修經世大典而歐陽公以藝文少􅁥掲公以奎章閣授經􅀰寔預執筆属在秋官因攟摭國􅀄以来記載若令申諸書及文武百司吏牘之可徴者作憲典廿有二篇上稽唐律旁引百家而卒折之以經義炳如也方是時執翰劄以􅀙者皆天下文學之􅃟而今禮部貟外􅀰新安程君尤雅為二公􅀁器重諸所論著悉與聞而掦㩁焉二公既没君乃手輯遺稿廿有五章并五刑獄空等論六章為一卷題曰刑平尋自為之引杭郡守呉􅁜謝侯請􅈓置西湖書院属予序之三代而降言治者無如漢唐或大綱舉或萬目張要其㱕皆以經術㕘律令也文影之間貞觀之日㡬致刑措盖亦盛矣今二公之脩憲典折衷衆議一本諸經務以是是非非公天下其憂世之志殆欲使吾君為堯舜由此推之則刑措之效豈直漢唐而巳㢤然則二公之志非是編不著是編也非程君不存刻而傅之則謝侯又􅀅樂與天下共之是固皆有憂扵斯世者􅀂夫二公論著之旨與刑平之􅀃見扵程君􅀁自引兹不著著君子憂世之志與侯􅈓梓歳月傳之學官則予不敢多譲扵是書頌沈蘇州泰山喬柯遇般郢則堂而建都邑冀北良乗遭方歅則追飈風而躡浮雲之人也冠以蠏豸而不能信其骨鯁委之銅虎而未能攄其拊循是猶松之遇般郢馬之遭方歅也然二千石不足以大其設施三尺法不足以騁其精神必也任重之器為棟梁扵大厦致逺之姿豈可服塩車而居後塵耶評華莭婦守莭難扵死莭良以守者身未亡而心先亡與其殞身扵頃刻未􅀂死心扵悠乆故曰慷慨殺身易也華婦陳守莭青年以抵老其艱􅉝無頼亦備甞矣蘇属國北海十九稔文丞相兵馬司五祀同一死其心者傳云忠臣烈女不二天庸併論之序通鑑續編序宋司馬文正公編次資治通鑑㫁自周威烈王訖于五代其㫖㣲矣考亭朱夫子因通鑑舊文別定義例為綱目以正百王之大統由是千三百六十二年理亂廢興之迹世儒所甞論議而不能無異者至是而後有以折其衷此著作之事學者所冝世守而勿失者也近世東陽金先生病劉氏外紀之不本扵經而是非或繆扵聖人乃􅫵摭通鑑以前由威烈王上至唐堯者􅆲為前編出入經史百氏而一以尚書為主其事著矣若夫盤古以下逮于髙􅉝述作之家􅀋為世逺而難言然百家􅀁記豈無近理而可徴者自五代而降宋三百年度越漢唐而其世運有盛衰夷夏有消長帝王􅀅相禮樂刑政有得有失此後之君子所宜執筆而為之論著者也然非貫穿古今不足以渉群籍之涯非捴括機要不足以綜萬事之統非深造義理之㣲不足以識是非之正此吾友陳君子經續編之作所以為不苟也盖子經之先大父祕􅁥公以宋遺老􅀮居四明山中甞推宗綱目著書以紀歴代之統其先君子教授表章家學訓􅇚惟謹子孫束􅄠受是書即知先志􅀁屬甞甲以為圖傳諸同志且敷為筆記一百卷蔵于家矣今又上論盤古逮于髙􅉝下據三史㑹于有宋或近理而有徴或損繁以致約前乎唐堯者既有以􅀘其未俻後乎五代者又有以嗣其方来北事扵通鑑較義扵綱目斟酌前編而不必苟同至扵尊正統以定萬世之大分則考亭夫子之特筆秘􅁥府君之遺意子經父子世守而㒺敢失焉者其考覈之精􅂑􅃕之審固非區區謏聞者􅀁能盡識然舉其一而其餘者可以􅀋見昔司馬遷論太史公所次舊聞成一家言後世稱為良史子經此萹豈非師古人而明先志乎傅之學者當為前編並存然則序而歸之以伺知者余固不得以苟譲為也送張州尹序常熟言子㳺氏之郷也子㳺當春秋之季列國争衡而其為武城􅈗獨尊信孔子之言弦歌禮樂以教之及漢興収秦民扵百戰之餘而相國曹叅獨師事蓋公用其清静之􅀃以治齊而齊大治夫清静之說與君子之道不同然馴而致之亦足以勝殘去殺與民休戚則夫學子㳺之學仕子㳺之郷而􅀁以迓續愛人之休烈扵變易使之淳風顧不益簡且易乎然百戰之鋒或不戢扵秦漢争衡乏􅀔或不殺於列國扵斯時也欲治之以清静而不先教之以禮樂乎則機軸其空瘡痍未復故今日之務莫要扵教民莫艱扵拯民苟非仁足以周撫字智足以遏強禦才足以綜繁􅇵㢘足以律頑貪而又􅀅之以老成強之以精力如保定張侯庸道者亦烏足以守北門之鏁鑰奠水陸之咽喉􅆑翼生民股肱藩省也㢤今日用侯與侯之為今日用殆非徇其名而巳盖􅀅有以収其實也吾聞之十室之邑必有忠信常熟為呉大州薦紳之徒豈無忠信非公事不至尹之室如澹䑓子羽者乎斯行也吾知不待蓋公而州治矣申公有云為治不至多言顧力行何如耳矦尚勉乎㢤送虞勝伯序故宋太師虞雍公以雄姿偉略佐宋中興出入􅀅相垂三十年其經國大業之著扵章䟽忠貞氣節之形扵奏對太史氏􅀁錄盖班班焉有志之士聞其風者猶足以興起而况覩其全書者乎其書舊􅈓蜀中巳而燬于兵四世孫寳慶通判􅀅復刻之湖南弗果五世孫叅政當國􅀄尤䔍意扵此㑹故人眉州史孝祥守興化聞黄伯固家實有之求之不能得至六世孫學士遭逢盛際復以文章致位通顯其侍書奎章閣時甞属閩校官謝中物色之中至閩適閩武官有購得之者􅀅資以見學士未㡬學士歸田里尋捐舘舎自是書之存亡無復以為意者矣與予友者曰堪字勝伯扵公為八世孫一介布衣困窶無聊自其以上居呉呉子弟之與儕軰者徃徃厭棄筆硯不屑事父兄故習自􅀒以班仲叔者無慮十六七否則亦􅀼自縁飾為公孫子不成其敝猶足以舞文巧詆與郷里少年争長雄勝伯之計顧不出此獨折節以紹隆家學經紀遺書為巳任間聞松江俞子中為呉理官時得其書扵魯人賈景荘氏􅀅親徃求之斯行也天或未喪扵斯文乎必有以遂其賢子孫之所求矣吾聞之君子之澤五世而斬勝伯去公八世矣斯文也猶􅀅頼之以弗墜韓愈氏有言莫為之後雖盛而不􅀓勝伯􅀁謂善為人後者非耶扵其行呉之能言者率為詩以相之属予序之送劉廷傑序嘉興判官劉君廷傑􅀅之官與之㳺者咸賦詩以餞余因酌之酒而為之言曰里人有生子而甚愛之者求善嫗字之而得隣婦焉婦以身任愛子之託扵人凡子之飽飢燠寒喜戚咲啼一是以其父母之心為心子有不􅀗其所欲而癢痾痛疾或􅀙而萌焉則其責悉歸扵婦而婦盖不得以隣自狎而或敢少措㡬㣲不滿之辭扵其間㢤是婦也不過受傭扵人傭直滿則復去為隣非􅀂士大夫委質為臣属則終身焉如女子之事其夫然者則夫受民社之􅀉扵時而民之飽飢燠寒喜戚􅀏啼視隣婦之字夫人之愛子者為何如㢤盖一郡之責在於長吏苟得其人則或無􅀁事乎其佐苟用其人而未得則為之佐者可不慎選乎此廷傑之行􅀁以為不苟也廷傑世為肅慎氏少宿衛鎮南王藩邸今􅀙平章政事呉􅁜公出入文武兩府以材能為公所器重凡􅀅相公卿四方聘問之使之徃来與夫薦紳士夫之􅁱容扵公之門者必廷傑乎􅀅命或進或退􅂉先或後得其宜則尊卑有序緩急稱情而輕重無或乖乎分不得其宜則禮失其序事戾乎情而言與分乖故非習於禮練於事逹乎分者莫克為之今廷傑扵此盖恢恢乎有餘也然則舉是措之扵郡其復有出扵尊卑緩急輕重之外者乎矧嘉興之民飢者待哺寒者待衣戚而啼人或莫知其所䘏喜而􅀏人或莫知其所􅂆日夜喁喁焉開口以望慈父母求善嫗以字之也乆矣廷傑行㢤吾知不待長吏而東南郡佐以治行􅁛者必廷傑也今之從政而以隣自狎者皆是尚烏足為廷傑告云詩凡若干首繫于下方至正庚子九月壬辰序和靖先生年譜序故宋侍講尹和靖先生甞寓平江虎丘之西庵後人因築祠祀之國􅀄祠廢有司遷麗郡城尋請署額為書院因名曰和靖且置師弟子貟以先生之道教之而先生之道見於門人祁君寛所記語錄􅀂干卷前山長沈維時既巳􅈓之書院矣其出處始終言行本末著扵黄君士毅所纂年譜頋未之刻焉今山長葉顒實始出俸廪為之倡而儒士陸寕因率同志若干人裒錢以相之用是譜與語錄並傳而先生之道益著矣初先生棄舉子之業而􅀙程􅅩子也豈非􅁒聞聖賢之道乎及遭難靖康脫身劉豫間関百罹誓死不屈當是時也知不辱師門而已焉太師張公浚趙公􅂦之倫交口論薦不絶扵朝玄纁束帛之使趣召赴闕者相属扵道盖非先生之志也及屢召屢辤䘚辤弗獲遂以布衣入侍􅀴帷為帝者師其􅂆講也每齋宿而後進深覬所言悟主以利天下此則師門之志而先生奉以周旋盖所謂不失其正者也然張趙二公去位秦檜以議和􅀼柄而君子小人遂與夷夏同盛衰而宋之為宋盖可知巳先生獨毅然不顧上䟽切諌且移書責檜皆不報此其自任以天下之重何如也而道之不行盖非先生之不幸也扵􅃧先生之道不必行扵秦檜先生之譜不必不傳扵後世盖譜傳則道􅀓秦氏之子其如天下後世㢤先生家世爵里與師友授受之懿在列傳墓誌伊洛淵源語錄皆可考是譜也盖攟摭諸書叅以已聞而先後次苐之俾百世之下誦其詩而讀其書者􅀚乎此亦可以由階及户而窺其奥矣維時顒皆郷貢進士云至正􅉝丑二月癸未序送鎦治中詩序自兵興以耒所在文武百司知守章程䘏民􅀮夫田婦桒不廢生聚者呉越數郡而已彼城邑丘􅇕蒿莱蔽野􅉘狼虎貙之属呼曹命群以荐食生人者又何其烈也􅀅相公卿日夜身先士旅沐雨櫛風以與此􅀋﨑嶇百􅀾者夫豈為室家計㢤列郡長佐所與周旋駿奔視百􅀾雖不同然附摩有重輕設施有緩急非素與國家同休戚謹法度而識情偽者則或未足以勝其任也姑以杭秀二郡言之呉􅁜謝矦豈弟温文有良吏之風故俾守杭以股肱藩國而京口鎦君出儒入墨機辯䟽通故俾為治中以副之而杭以治秀之為郡在蘇杭之間􅀒海控江出其租庸以佐軍國盖重地也僉謂永嘉陳君師古􅋢人䔍信不回委以民社宜無與譲遂由行中書貟外􅀰擢同知都事又以鎦君為賢俾去杭與共治焉夫豈故為是紛更也㢤亦以父兄子弟夫婦長㓜安生聚力田桒務其什一以供公上恢復之基庻㡬在此􅀾之力也然􅀾可以捍患不可以致治任致治者其惟大夫士乎彼驅民扵􅉘狼虎貙之口者其不仁亦甚矣今欲反其不仁而治之無他亦在扵輕重緩急之間而已鐂君甞協恭所以與謝侯収治効扵杭其扵緩急輕重盖習聞而身試焉者今去而之秀使協恭陳君其無異謝矦則治秀如治杭無二道也謝矦方入叅帷幄與公卿􅀅相左􅁠衡右規矩以激昻文武百司之執事鎦君􅆒歴二郡有如疇庸考績宜不在他有司之後况以武捍患以文致治譬猶使舟人操舟車人御車苟各務盡其所長則未有一日而不千里者也鎦君勉乎㢤與君善者咸分題賦詩以華之余不佞故為之序至正辛丑二月丁酉贈盛㫁事詩序余辱以末僚承乏呉􅁜公幕下其所以比肩而從事者行中書省貟外􅀰桐川錢君行樞宻院都事秦郵盛君㑹稽蔡君也三四人者生不同里閈業不共師友喜怒􅋢憎不均嗜欲一旦共官守服官政論議趨舎舉措謀為亦何有扵世㢤頋不苟同以徇􅀔不求異以徼名譬之五音必調以琴瑟則怗懘消而和平作矣盖天下之事是是而非非固無所容其心也公方合四方俊英􅅛傑之士率貙乕驃悍梟雄之􅀅苦心勞思誓先天下為社稷生民削除􅍔孽非細務也吾等出焉不能擐甲胄操干櫓與猛士銳䘚争一决之鋒扵疆圉間入焉不能興利除害進賢退不肖效㣲勞扵廊廟之上又可不協恭盡力去嫌逺疑黜比暱布公道庻㡬禆􅀘􅁝毫扵幕下乎盖公之奉國與吾等事公以􅀔分言則子弟之扵父兄也以休戚言則心腹肘腋衆竅百骸無一非要害者此吾三四人所素同心榮瘁死生以之自信不疑非一朝夕矣黽俛鞠躬夜以継旦然而不敢自必其􅂉濟否也今年秋盛兄由都事擢断事官仍以職事􅊢杭分樞府實公所論也盖國之大事在兵兵之大紀在法法之得失在人苟得人矣則綱而理之其要舉扵上張而翕之其事存於下然属任之顓責成之厚非素清謹明恕守正不囘如君者亦或未足以堪其命也由是而言則銓量予奪或輕或重視幕府為何如㢤雖然凡文武百度鉅細緩急幕府莫不預聞而畫諾焉今君所職固前日相與協恭盡力所謂以琴瑟調五音消其怗懘底扵和平者也彼同舟遇風呉越相救况子弟之事父兄肘腋之衛腹心在吾等實不啻乎推是道也雖不敢必其或濟與否然無所容心扵是是非非在此而不在彼吾等與君尚敢不益務自勉乎㢤同幕之士用韓詩分韻賦五言六韻為君贈而錢君倡之臨海陳基序之至正􅉝丑七月甲子也詩曰銀鞍白玉珂􅁝鞚黄金絡同趍紫􅅔署共入紅蓮幕衆馬敢睎􅂹累鷙不如鶚一舉空冀群􅂯舉翀􅋁廓天髙霜力劲日净秋容薄君家漢廷尉朂㢤諒無怍送邵同知序越在禹貢掦州之域距杭裁百里前代士大夫厭居侍從者多求􅀘外服而好事者又多喜杭越山川風物之勝其能言者又各為詩文誇羙之如唐元白諸公是也國家承平百年尤慎守倅之選然士大夫求􅀘外者或多喜請越至語杭則或有難色盖杭在東南號為一都㑹天下所謂聲色伎巧竒珍綺麗之物可以娯耳目適口體者舉集其市然物盛人衆奸偽亦滋出股肱近臣或枋政藩輔或持部使者節威行福隨聲与􅀔角守倅吏民之本也今進則承風旨徇要束退則具文書備稽考又退則送徃劳来或恕失一􅋨飽之􅌚扵人是務士大夫起布衣至守倅亦榮矣然時異事殊慎黜陟者固莫嚴扵守倅爲守倅者槩莫難扵杭杭豈􅃍不如越㢤􅀔有使之然者則其流風不得不與之俱靡爾及四方有變杭亦荐遭兵燹向之所謂耳目口體之奉舉集其市者至此亦澌盡扵是而愛吏民之􅀉眎承平無事時宜益難矣淮南邵君師賢由治中進同知郡事其閔閔焉日與執事最下者協恭守長拊摩瘡痍内則實儲偫餽􅁁外則繕城壘戒非常供億紏紛以夜継旦殆四閱寒暑矣然而未始有難色者盖方靣􅀅相以生人欣戚爲己任其率下也不務苟承風旨具文書賔客徃耒亦不敢屑屑焉責􅋨飽之􅌚扵有司其鞠躬盡瘁者惟民所好􅁖時其緩急而先後之此今日之務􅀅相之所責成而師之所不敢不勉也師賢亦何容其心㢤亦盡其在已者而巳爾今年春􅀅相多其能復舉之倅越越與杭雖皆楊州之域相去僅百里然其人有老死不識聲􅊶􅇊巧珍綺靡麗者尤其賢者服詩書賤者力田畒老老而長長百世不能易也扵􅃧越其猶有先王之遺風乎故承平以来越㝡號易治任􅀉守倅者亦㝡號得人今越與杭民力俱澌盡然為之上者信能因其俗而以義使之則易治之風越猶有不待甞而後􅂆者師賢勉乎㢤扵其行為賦詩送之而書以為序送湯都事序呉與越唇齒之國也承平無事時脩二千石職貢而已一旦群醜怙終所至騷動呉獨不愛三江五湖之利結驩四方豪雋折莭與士大夫同勞苦戮力方面股肱天下頼之越以勾踐遺民日夜􅀍堅執銳與猛士勁䘚争先赴死以捍禦浙水東上流逋誅之敵如浙西有警􅂺提枹鼓走聴約束雖蹈水火弗頋也越中或有緩急則䥫􅀐戈船水陸赴援恐後盖天下以呉為股肱呉以越為唇齒越以􅀅為司命而幙府又􅀅之肘腋心膂也然為越選重􅀅易為􅀅求賢佐難盖舉古者或迂扵事守文者或繆扵情知常者未必知變善㫁者不必善謀兼是數者之長而又俶儻知大体􅆒歷樞省受知公卿而不矜為苟同者其惟行樞宻都事湯君乎君字仲舉淮南人昔為行省属椽時㑹越有變甞攘臂起行問出萬死不顧一生倉卒决利害以定之今也從容赴越􅀅任肘腋心膂之􅀉扵幙府視昔倉卒定變之時事􅀔不同然使主􅀅総大綱湯君理百度言聴計納克盡所長􅀅事或曰州視縣雖巳崇然同知為貳職縣視州雖益卑然尹為長吏尹之職固顓矣然自辰及酉弊弊焉率以事􅊢大府雖飢渇不暇飲食乆之僅得以最考称扵時由是言之為尹孰與佐州為貳職亦較然明矣夫鞠躬州縣與偃蹇布衣出處固大不侔矣然使事親讀書無或慊扵心又庸知造物者非􅀁以玉成之也㢤又曰夫祿所貴子逮養者以其能推以及民也徳常為縣治行可􅁛其殆知所推乎自兵興以来芻粮􅄊械水陸􅀾攻之具􅂑給扵州者不一而足而奸吏並縁為市又貿貿焉日夜侵牟朘剥乎其間田里之民噢咻呻吟而䘚未知所休息者由上之人不知所以推之之道也徳常既知推之扵縣矣則夫舉而錯之扵州譬之醫者之用藥取其巳驗之方而試之則必未有痿而不起傴而不信者也徳常勉乎㢤吾恐是州同知之席不暇暖而有司者􅀅不得以尋常繩尺較歳月扵徳常矣予与徳常善故扵其行以或者之言告之然不以頌而以規者盖知之深所以望之厚也送禇士文序始予未識禇士文氏見其手書宋真文忠公所撰居官四箴筆力峻整􅀻􅀼􅋢重之及與士文友又知其言行文學皆不苟也􅂐􅀠扵書爲最古習之者必其人之師古者也濮陽呉孟思師故吾衍子行子行之書號師古孟思學之終身不變士文之書扵孟思不少譲孟思巳矣今之􅀁謂師古者非士文其誰歟余生也後不及見子行幸甞與孟思善孟思以書知名貧約自􅀅平居鄉里獨喜赴人之急世之知孟思者獨其書而已至其爲人知者或鮮也孟思沒吾乃今得士文焉士文扵書􅂑法秦相斯漢中􅀰邕唐令陽冰諸家罷精神二十年為人書古今文章􅈓金石徃徃傳諸好事者夫篆􅊢書之不絶如綫士文師古獨不􅈈嗟乎慕古人而不巳見有師古人者如見古人焉此余之􅀁以愛重士文者乎士文以書㳺公卿大夫間公卿大夫之為詩為文􅁛道其為人者口相属聲相和也然則世之不知士文者盖鮮矣余雖不足以知士文然方資士文以師古而士文持州判官牒􅀅赴官海寕而余不得㽞也士文甞以蔡氏書融㑹成章所謂舉子業試有司不利間用薦者授鄱陽邑丞尋以材略佐軍中朝廷錄其勞授之今職士文之行也謂余曰吾方有吏責扵時子幸愛厚我獨無一言以辱􅀻我乎余應曰諾盖余與士文皆師古者而士文之書獨為著稱夫文忠公百世之師也而士文又雅好書其箴其言曰㢘曰仁曰公曰勤此四三言者實律已撫民存心莅事者之規矩􅁠衡也士文書其辭則必師其心師其心者善師古者也以此為吏不既茂矣乎與士文交徃者率賦詩以贈余因為之序記呉縣脩學記平江属縣麗郡城者二縣皆有學而今三皇廟實宋景祐間呉縣與學官舊址也其徙今郡城西賔興坊廟序齋庖凡四十餘楹則紹定初縣令趙善翰實改卜焉淳祐之際縣令趙汝趾更繕完之國朝混一郡縣通祀孔子而呉縣學至正七年逹魯花赤馬祖憲甞一修葺十九年縣尹張􅀴斵石作櫺星門甚偉而廟學更十餘寒暑摧圯就壓槩未遑有植其仆而剔其螙者兹縣尹楊侯由行中書􅁺史以闓敏亮達膺是選甫下車即謁先聖先師環視内外慨然以振興為巳任頋教官方虗席而學廪告乏且乆適郷貢進士呉興莫孜客呉郡侯雅知其賢因折節以學事委之遭時多故民罷扵力役侯徒手扵百廢之餘計未知所出間謂孜曰呉民雖困顇苟以義􅂆之冝無不用命者賢父兄察侯意􅀁属咸奮曰吾侯為政殆知􅀁謂後先緩急者乎夫禮義之可以為國也乆矣矦今不鄙夷呉民而欲以禮義畜之甚盛舉也故宋太師魏國文正公九世孫范廷珎等率緡錢合五千有竒為􅁱學費未㡬縣之浮屠氏􅂕巖寺住持標䓁謂其徒曰吾與儒者雖異師然衣且食焉日與編户之甿俱以什一之賦徭于縣幸天恵賢侯非唯編户者有頼吾徒亦􅀼有休利焉彼編户者不敢自愛其力以佐矦興學吾䓁獨敢􅀻愛其力乎亦相勉以貲若干緡来􅂇侯曰吾事其殆庻㡬矣乃擇縣曽勤練有幹局者司其出納侯辰入暑縣事退􅂺至學親較百工惰勤以程督之中為大成殿後為明倫堂傍為两廡為齋廬規制大略悉遵紹定之舊而以堅撤腐以直支傾材必貞工必良視馬侯所脩或有間矣其周之而為官墻􅂂之而為階戺缺者􅀘之漏者覆之隉阢者填之使安夷之使平其丹堊之澷漶者飾而新之两序􅀙祀先賢像剥落而􅘬昧者更繪而神明之扵是上棟下宇内垣外墉奠者益崇以嚴弊者益完以好入其廟儼乎其有臨也升其堂肅乎其有容也師生教飬秩乎其有序也􅀴始至正甲辰蜡月壬寅訖扵明年如月甲子既竣事侯率僚佐行􅇚奠禮退集師弟子貟講六藝之文因歎曰吴為縣地方百里學官與縣治俱麗郡城而境内之人散䖏山澤有不得朝夕肄業於學者亦多矣乃呼其父兄而告之若曰吾欲俾若里有社社有學學有師以教若子弟可乎皆應曰諾居無何百里之内孩頌相聞口誦詩書而身踐儒行者相属於道隣州呉江之民曰奚士龍聞而慕之割􅀻田九十畝有竒来㱕以􅁇􅅒稍于學侯亦弗之拒也訓􅋚鄧徳基黄本䟽其事請書于石吾聞學校廢興視守令之賢否此古今􅃀論也承平以来為守若令者不駿奔扵期㑹則攘臂扵賦歛鞠躬扵簿書盖八十年扵此矣其不以文具視學校者㡬何人㢤及天下有變向之所謂駿奔攘臂且鞠躬焉者䘚莫知􅀁以救之楊侯起家為材􅁺一命縣長吏當百􅀾創痍之際視承平􅀁不暇者􅀂可以少緩而侯頋汲汲焉束帶詣學正色一呼應者如響而異端之徒隣州之民不謀而至者恐後禮義之足以感人也盖若是方是時郡守馬君以師帥之軄綱理乎其上楊矦以縣大夫与丞鄭翀簿王造典史舒昉劉惟志􅂆相乎其下上下一徳求學校之無興不可也使凡職守令者皆知不以文具待學校而長民者必以禮義先天下而天下有不足平者矣楊矦爲縣未朞月而善政􅀋此者不一而足以不繫扵學故不書侯名􅃔字好徳鄱陽人董是役者縣曹史李質沈瑞學吏樊龍也至正二十四年五月辛巳言巳常熟州脩學記常熟儒學宋端平􅀄縣令王爚實重脩距今若干歳而常熟陞縣爲州又若干年矣至元皇慶間州人楊麟楊鳯曹南金再力新之自是又若干年至正庚子教授天台陳聚以教養餘力莭縮衆費即其弊螙者而繕且葺焉越二年今守禦元帥兼知州事海陽盧侯視事之日即謁先聖先師環睹廟學思有以振其􅆸墜方是時兵興民困侯知其不堪命乃呼麾下而謂之曰吾與若属扞兹土方面􅀅相不以吾為不省辱委之民社而民社􅀁先者曰學校吾􅀅用􅀂属力斯事其無乃以吾為厲巳乎皆曰斯盛舉也敢不唯命扵是輸財運甓執斧操墁者奔走後先惟侯所欲為凡前人之所巳葺而不能不圯缺與未及修而在所不容巳者冝其緩急而次苐之内而禮殿論堂傍而兩廡齋舎外而櫺星學㦸門與夫丹陽公洎后土氏之有祠采芹之有亭小大畢舉該費錢如干緡皆捐巳俸與學官無􅀁與庀役如干工悉給軍伍而民不知擾工既訖功侯率同僚以時奠謁享獻有容師弟子貟教飬有􅀁士民具瞻咸曰始侯為州􅀅首繕州城以衛吾父兄令領􅀖伯又飾儒宫以教吾子弟侯有徳扵吾州甚厚盍有紀述以圗不朽乎乃伐石来徴文為記􅀼甞􅀚春秋之法常事不書非常事而後大書特書屢書不一書之常熟在古爲要荒之地在春秋爲丹陽公言偃子㳺之郷在今爲呉甸名邑凡郡縣通禮孔子而常熟由宋端平迄今廟學亦㡬偐矣然承平之日海内晏安民無􅀾闘之虞邑無桴鼓之警搢紳君子仕文學之里役易使之民其視今日爲何如及天下兵興􅀁在城邑爲􅇕生民淪胥水火其幸而免者不鞠爲魚􅁏足矣尚遑恤夫學校之廢興也㢤矦起家武弁身擐甲胄手執干戈戮力與􅄷讐􅀾甃完城堡爲國藩屏此其職也至扵學校承平大夫尚或有􅀁不暇而矦扵多事之秋乃能不煩學官不勤民力親率師徒致力扵此而完且速􅀂是是非􅀁當書者乎吾聞州之民有利學田而奪之者聞侯之風其必有興感者焉夫正其經界謹其出納使􅀕祀以時教飬有方此矦有繫扵學者謹述之以示也他羙政亦夥當委之載茟者兹不悉云守約齋記聖人之道髙矣逺矣七十子之徒學焉而僅得其一體曾氏之子專用心扵内􅀚其言行之存扵問荅者殆以守約爲本乎守約云者反而求諸巳之謂也夫爲學而不知反而求之其不務爲空虚髙逺者㡬希太尉府􅁺史淮南姚君伯升以守約名其居南行䑓治書侍御史周公伯温既爲篆其顔以余辱有一日之雅又俾文申其義予以爲聖人之道如天之髙也如日月之逺也三千之徒莫不峩冠裒衣濟焉􅀅焉以並㳺乎申夭之際日夜俛焉孜卒不過各得其一躰而曾氏之子在三千之徒獨以魯稱頋知以約自守悛焉以夜􅁇旦不敢少有騖髙忽近之心故一貫之㫖卒用是而心領神㑹扵一唯之頃然則守約云者曽氏之子􅀁以學聖人之律令歟始吾辱與伯升㳺迨今且十閱寒暑矣而其容貌之魁偉望之者知其為逺大君子也乆而與之䖏則持心也謹而恪操已也卑而譲出詞也謙而退修已也果而銳其反而求之扵巳也益䔍施之於事也益謙舉而措之扵物也益恕􅀁謂君子篤已之學或其庻矣乎嗚呼聖人不復作矣士生乎百世之下欲求聖人扵百世之上􅃕曽氏之子吾無望焉然欲學曽氏之學者盍以守約為􅁠衡姑用為記小丹丘記予五世祖由永嘉徙台之臨海距城百里而逺臨海之山大率自天台支分綿綿延延若萬馬東奔而飲于海予家實在焉予蚤􅀌不逮事先君子甫児時即有四方之役道過天台不復能記憶少長閱天下圖經􅀁載始知天台為名山而予家去山之逺近了不能隃度也豈惟山㢤宗族婣黨親䟽穉耊要亦不能盡悉郷人有自東而西㳺偶與之接者聲相劳苦乃或始知其䟽戚逺近否則不相知者十七八予少以貧賤役四方乆居于呉婚娶于呉育子女于呉衣帛食稲于呉母没􅁙于呉之壌㒒妾厮飬皆呉人盡室皆呉語而予獨操越音于其間予􅀁䖏亦豈得巳乎㢤覉旅四方食飲服御與呉人異者或鮮矣四方之人遂皆以呉人目之而予老且仕不出呉境吾自視亦呉人而已乎今年春予於􅀁居西偏治廢圃可半畝即其中陋屋三數椽稍治葺之因扁曰小丹丘昔晋孫興公賦天台有曰仍羽人扵丹丘後之人遂以丹丘為天台之別􅁛予今扁之盖猶有昔人不忘其土之意乎予生於台台之戚婣少長不必親也予長於四方而呉之家室子女不必䟽也而治圃也何以丹丘為㢤且予五世祖家臨海而五世之上不必知也予今居呉而後扵予者亦不必其知也凡人五世而親盡親盡則塗人而巳自予以徃未能為􅂗人則或猶用知者故予扵圃焉發之予扵圃不遑締搆之事屋上棟下宇皆仍舊稍加塗墍者予􅀁能也江湖好事者或持梧桐篠簜橘柚芭蕉薝蔔萱蘭之属耒則雜藝扵圃客自淮海遺以兩鶴甚潔白可翫同門友起居􅀰金華戴􅅩能善為古文詞予求為之記而又自志云云者恐人不知予非呉人而後之人不知吾為台之人故詞繁而不暇畧爾墓志銘鄭國公并夫人合葬墓志銘公諱懋字徳懋宋末避難通州因占籍焉父道榮贈㕘知政事榮陽郡公母王氏榮陽郡夫人公少負氣豪宕以信義稱扵人妻夫人戴諱妙寕嚴重寡言執􅅙織麻枲以奉􅀕祀賔客號盡婦道今呉王居郷時公常􅀙之㳺夫人間􅀼視知其非凡謂其子元明曰此人豪也盍謹事之且為次子元紹求昏至正癸巳王舉義兵江淮間公首率元明䓁居麾下夫人内則綜家事給餉餽親製􅀾士之服窮晝夜不倦外則撫士䘚如已子人皆樂為之用今江浙左丞吕公珍来自興化夫人見其俶儻因為公言公與語大恱即分授以兵使事楚國公俾居左右而属任之無何公以疾卒秦郵之東郭年六十有四元明以兵事嚴藁􅁙海􅁜之茅山及師渡江元明䓁奉夫人居吳時年㡬六十祁寒盛暑織絍不廢雖貴且富服御飲食如平時獨好施予鄰里有不給者賑之恐後呼元明䓁誨之曰􅀂等由布衣起畎畝遭遇非常克有今日吾聞之大丈夫所自許者忠與義耳尒苐盡力事上母曠乃職貽吾憂以至正甲辰正月得疾元明元紹朝夕侍湯藥弗違左右夫人力疾語之曰我疾殆無他􅀂䓁受重􅀉勿以我故怠乃事也乙巳八月有司論功封爵公贈榮禄大夫淮南行中書省右丞追封鄭國公夫人封鄭國太夫人命下病已亟即呼元明䓁曰妻祔于夫禮也􅀂父􅁠厝淺土其􅀅有待乎今仕于吳􅀂䓁親則胏附任則股肱義不可去墓在泰非吾􅀁以即安也我死必與􅀂父合葬于吳此吾志也是年十月廿五日卒于正􅆍享年六十有六子男十人長元明榮禄大夫江浙等䖏行中書省右丞兼同知樞宻院事次元紹昭勇􅀅軍江浙行樞宻院判官餘皆先卒孫男十三人女六人元明䓁告遷公柩遵治命也􅀄夫人之䘚也基赱弔焉右丞與院判奉其客樞密都事㑹稽姜漸之状泣拜而言曰元明之先實宋魏王廷羙十世孫宋亡避地通州當是時先祖年甫十三匿姓潘氏所因以為嗣戴亦宋宗室外孫元明䓁遭時多故未遑請於上復姓氏今不幸先夫人奄棄諸􅀌雖纍然齊絰不敢忍死去苫塊然合塟之命不敢忘也今謹奉先公之柩至矣卜以是年十一月甲申合􅁙于長洲縣習義郷上苧之原􅄑吾子哀而銘之基觀自古豪傑舉事率不階尺土而妻勉其夫父勸其子䘚以義氣相許與成大業兹因公夫婦父子而􅀚今之世豈偶然㢤乃按状為銘曰奕宋胄匿姓民間低佪草野備甞艱艱提擕二季擇主而􅀙曰有内􅂇克昌厥宗子服戎行母躬􅅙織以給餽餉以供矢石有来孔武眎如已子曰惟二季無間兄弟天啓吳􅀖臣忠母貞生膺顯爵殁垂令名我作銘詩以告来裔上苧之原有崇弗替王處士墓志銘至正二十六年歳次丙午六月庚辰王處士卒于盤門之寓廬基蒲服赱就位哭弔王遣内史諮議某元禮典喪事越六日元禮以状授予為銘維夏五䖏士􅆍疾王命基走其門問状時處士巳不能言顧侍旁老婢使億度欲言之意若曰臣幸老王土死無憾矣基以其言復王哀之即命善醫候疾今不幸由是不起而基官太史銘固其職不敢辤乃序而銘之處士諱鑑字明卿姓王氏世為真定晉州之安平人曽祖用祖彬考􅈘台州寕海丞妣畢氏䖏士少侍父官江南遂􅀮居呉門娶李氏子男一人曰淳先廿五年䘚故今無子䖏士病且革以畢夫人弟之孫為後名継善扵是䖏士年七十有三矣王命有司買地呉縣靈巖郷穔山之原􅁙之時七月丁酉也初江南内附中原士大夫多不樂仕南方寕海府君以􅀅仕􅀰任吉安路安逺縣丞獨歎曰臣子豈可以卑小官憚逺渉而使逺人不䝉朝廷之恵乎即馳至縣縣入争裒金銀以獻府君謝不受召其人慰遣之三年遷平江吳縣尹以善理民著稱未㡬㑹京部以前除州縣官多躐䓁著令咸降二䓁府君巳受七品秩因改授􅀅仕佐􅀰徽州路休寕縣主簿遭母喪時丁􅁨未著令君曰吾扵母而不盡吾情何以教民乎即觧官持服去服闋轉登仕􅀰台州寕海縣丞治行如在呉縣時府君年未五十即謝事居呉時天下承平南服無事四方衣冠皆樂居吳中䖏士日侍府君左右入則躬定省職温清出則􅀙搢紳諸老講經義為文詞俊邁機警為同軰所推服及基㳺吳時䖏士年已五十餘議論風采髙明倜儻朋友過門無少長皆樂與傾盡家貧無甔石之儲應門獨一老婢客至􅂺扣鄰家門問酒酒至􅂺對客􅇵飲酒盡再謀雅善談論然不及時事亦未始以一毫私已事干人如此者終其身處士少與弟鈞同學扵燕至順改元鈞舉進士及第終沈丘縣尹府君以鈞貴追贈􅀙仕􅀰真定路安平縣尹妣畢氏封宜人處士遯跡江湖􅀮徳弥耀中外論薦前後章皆不報処士平生博學為文章多不留稿特􅋢唐人近體詩時有􅀁賦詠皆平實沉毅如其為人晚年貧益甚莭益堅閉門獨居足跡不出門者二十年晏如也王初入吳獨求處士之廬而訪之䖏士與言皆仁義為得民心之本甚嘉納焉甞語人曰王處士吾友也故其䘚之日用深悼之且曰王處士以節義髙天下然貧無以為喪凡送葬䘏家有司悉任之嗚呼此䖏士之所以髙天下也是宜銘曰鳴呼處士受材孔良出言􅁢􅆇遇興廟廊而不膺棟梁懐璧而蔵嗚呼其可傷傳􅀓古民傳傅古民者金華人也善方數尤􅃉鍼術里中長者如故侍講黄公最慎許可頋折節與古民善在朝與公卿言輒􅁛道古民古民亦雅欲逰京師行至毘􅁜㑹公請老㱕江南古民亦弗果行遂以醫知名蘇常間倫軰因徃徃推重古民遇竒疾必引與㕘决每議論出入􅂕樞太素言無所譲人用益多之初古民至㑹稽見老翁病僂伏行市中甚苦群児聚􅀚狎咲之古民惻然曰此所謂戚施不能仰者也頋蒼頭耴鍼砭視其俞刺之有頃翁徐起信背掉臂挺然以去若無􅀁甚苦者時宣城貢公泰甫爲郡理官聞而異之已而貢女之子病風搦亟迎視之古民曰此客􅀬干正氣法當􅌊以散之用其言而愈去年冬予婦有疾􅀱古民胗之曰此胃口蓄􅀬故病脾痛善嘔而食不下噎炙中脘砭上脘尋交􅌊以􅀘瀉之時方雨雪或難之古民曰此拘士之論逹者不耴也由是病旋已古民療疾多竒驗􅁼此古民性簡直不苟合至用其術鮮或能過之也夷白子曰宋南渡時金華傅氏聚族數百口緦服同㸑世稱為義門國初有以嵊縣尹致仕與里人王鏡潭俱淂鍼法扵故竇文正公者盖古民之先大父也王氏有子亦克世其業然論五診乃適度量規矩􅁠衡繩墨以別百病傅氏尤有􅀁授云夷白齋稿􅀘遺
