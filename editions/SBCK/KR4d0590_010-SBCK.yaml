front:
  text: 夷白齋藁卷之十
  hash: sha256:c5928c083028810d03e7a7524d6c92b7a61f6a7da7229c93639db26e143ac068
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_010-1a}
body:
  text: 臨海陳基著金華戴良編律詩七言送彌陁保世衡聞人徳機二觧元赴省試一舉収㓛古􅀾場計偕同上􅂵薇傍手攀明月分仙桂􅁕躡青雲見玉皇髙第世推唐甲乙直言人比漢賢良明年晝錦歸来日一色㤙袍雨露香送丁太􅀄嘉徳常二貢士赴省試兩賢携手上南宫掛席関河得便風欲把妵名題甲乙湏􅀅文字决雌雄一􅀴昔向江東學萬里今看兾北空遥想殿頭臚唱畢五雲佳氣欝葱葱送牛述善􅀰中還朝萬栁亭􅁁酒一杯馬蹄踏雪上金臺天門星應郎官至海岱春随使節囬宣室􅂧陪前席問上林曽壓衆芳開諸公若話東南事䠂澤無冰有草莱一自淮安使江南舟次通州􅀉同幕諸公頻年共入嫖姚幙此日先乗使者舟海色曉迎龍虎莭天光寒動鷫鸘裘山川咫尺分呉䠂河漢尋常近斗牛南鎻堰頭官栁􅀣春風相約繋驊騮狼山山色碧崔嵬秋半􅀙軍臘底囬夀酒欲歸吴下獻使星新自䠂州来江城見月思聮句驛路逢春擬􅀉梅只待年頭便相㑹賸拌懐􅈽為君開由通州渡江白首􅁿抛種樹書謾陪帷幄強馳驅半竿紅日辞淮甸一席清風上海虞欲向中流安砥柱恨無長劒斬鯨魚晚投言子祠前路坐聽弦謌意有餘福山港口待潮呉山如􅀞䠂江平消得􅀌㠶半日程潮落沙頭􅂊一尺舟停江口復三更時清不識風波險世亂方知性命􅁿坐擁貂裘待明彂臨流空愧魯連生癸卯二月十一日官軍彂呉門去年移戍秋􅀅半今􅀊渡江春正分􅀳􅀦偏禆歸宿􅀅漢庭旗鼓属元勲戈船十萬盡犀弩銕􅀐三千皆虎賁却咲髙陽老狂客謾慿口舌下齊軍二十日福山港􅀉省院諸友漢􅀅西征肅羽儀簡書日日有程期東溟潮上犀船彂南斗星横虎莭移青入䠂封山􅀧點白添吳鏡雪絲絲羙人宴罷芙蓉署一色銀花翠壓枝舟中看虞山有感一望虞山一悵然䠂公曽此􅀅樓􅂳閒関百􅀾􅂢軀地慷慨􅀌忠罵冦年填海欲衘精衛石驅狼願假祖龍鞭至今父老猶垂涙花落春城泣杜䳌二十二日狼山口􅀚兵官軍野次狼山口銕􅀐犀􅂳盡虎貙杼軸萬家供餽餉旌旗千里亘江湖􅂰行擬伏諸侯􅀅面􅅞行申兩􅀚誅淮海父兄争鼓舞􅀅軍􅂲是漢金吾逰狼山寺三首天風吹上狼山頂看見扶桒日出􅀄淮海北来吞兩䠂江湖南去控三吳珠宫貝􅊴馮夷宅古木蒼藤帝釋居為訪祖龍鞭石䖏拇窠履迹㝎何如鯨波渺􅄅四無涯閶闔天低手可排一塔􅀝空􅇒浩刼兩潮争港撼層崖半晴半雨龍歸海衝暖衝寒鴈度淮安得乞身依佛日遍尋靈迹訪齊諧五峯相頋若枝撑力障狂瀾與海争下界人居龍伯􅀦上方僧住􅆊王城佛庖香訝山無蕨公膳腥嫌市有蟶王事匆匆􅀐馬去落花啼鳥揔関情􅀉朱佑之􅀴歴老我思歸卧􅂵霞多君䏻賦吐天葩十年跡忝嫖姚幕千里身􅁿􅀶望槎䠂甸風髙塵沒馬蘇堤春暖栁蔵鴉何時共喚西湖酒爛醉􅀌山䖏士家􅀉張長年都事南省郎官也好竒文章欲以古為師獨来䠂澤􅀙戎地長憶吴門並馬時二月西湖春爛熳百年北海酒淋漓此心頗與君同調一曲荷花􅀊晚期二十六日自通州赴淮安海虞城外􅀴旬泊狼五山前信􅀫㽞六計西来思撓䠂三軍左􅃝願安劉龍光夜吐雌雄劒魚尾朝衘甲乙舟今白南風催掛席浪花飛雪打船頭􅀉夏仲信太守韓壁翁􅀴歴姚伯􅅩照磨淮海從征道路長羙人千里遥相望無錢太守客盈座好事􅀰官書滿床花氣曉迷三竺寺栁隂晴繋六橋航懸知小隊行春䖏露􅊜馬蹄芳草香髙郵湖夜行天明過寳應秦郵城外望安冝㠶飽風􅁿似馬馳三十六湖春欲暮一千餘里客来時背人鴻鴈歸何急近海魚塩利不貲農事及時兵有律便無神寳尓何疑二十九日至淮安城南十五里述懐欲向江湖覔釣磯此心長與事相違添丁未辨盧仝計􅄸老空知伯玉非淮甸草肥宛地馬䠂州人著漢官衣􅀅軍奏罷平西捷還許山翁倒戴歸到南鎻􅀉分省同官故人近在淮隂郡未見先馳尺素書知已毎漸齊鮑叔論文只許漢相如便湏為我占烏鵲不用呼童烹鯉魚自咲近新頭盡白強顔􅀐馬事穣苴三月十五日由淮安使江南别同官三月淮南栁色深相看去住兩􅀜心鸎囙求友聲逾切鴈為離群思不禁芳草􅀅春青䠂甸暮雲含雨碧呉岑遂初亦有平生賦何事驅馳雪滿簮三月二十五日由呉門使􅎨昔年戍浙今移䠂新􅀊趋吳􅂧使杭南北此身皆客計東西何䖏是吾郷野花送别紛紛落官桞縈愁故故長謾道五湖春色好為誰銷得􅁂􅁁霜閏三月四日夏仲信太守邀逰飛来峯和頋子􅀴照磨韵千岩萬壑響奔雷分得西天小朶来雲氣滿林山韞玉松隂繞寺榻生苔􅃄霞逺跡何當遂猿鶴㽞人未擬囬今日使君蘇白軰醉歸城路近三台飛盖今朝天笁寺泛舟昨日小蓬莱五馬旌斾三月暮四山􅃄霧一時開蒼藤古木蔵靈鴛􅅸壑奔流吼怒雷使節行行趋兩䠂碧雲逥首欝崔嵬分省諸公邀西湖宴集湖上相逢宴屢開􅂵薇花下約同来水光醸緑凝謌䄂山色分青入酒杯蛺蝶影随羅扇動琵琶聲逐􅀞船囬獨憐英骨埋芳草南拱枝頭蜀鳥哀閏三月七日過三塔寺㽞别寛老軺車来往每匆匆此夕相看一咲同軒外竹添千箇緑樹頭花吐萬年紅茶烹日鑄龍分水榻近雲巢鶴語風梔子雨肥蕉葉大恨無佳句續韓公閏三月七日泊舟三塔寺新仲銘長老出城相看我愛水西新仲銘道空諸友說無生出城看客意最古把笔賦詩才更清杜若洲􅁁春􅁒暮鴛鴦湖上雨初晴十載間闊重相見深杯寕惜為君傾呉江釣雪灘頭蹔艤舟晴虹千尺飲長流吐吞日月天無際出沒魚龍地欲浮濟世誰當扶砥柱乞身吾盍老滄洲裁書為問天随子􅂎菊荒来又㡬穐初八日阻風宿吳江無礙寺龍伯㽞人蹔艤舟偶過西寺得詩流僧窓􅃄景五湖晚澤􅀦雨聲三月秋我欲棄官来釣雪誰䏻作賦共登樓此身何日都無礙共向毗盧性海逰西寺送信道元長老還吳興楊墳寺翔鳯山前水亂流垂虹亭畔月如鈎賦詩不數湯休軰入社獨慙元亮儔夜雨西窓重剪燭春風南浦共維舟它年一榻封禺下咲傲􅀎容此客否次韵謝元懿移居後見􅀉羡君早學公孫龍堅白囙時辨異同狡兎窟多寕逺害鷦鷯技小不禁風山林夢􅄰随䴢鹿賔主情懷類駏蛩頼有平生周閣老時時分禄餉而翁手種新松引舊蘿人間得失䓁南柯粟儲已罄琴書在家具不如車兩多短屐肯嫌苔􅈳滑髙軒時向席門過新詩恵我皆珠玉報乏瓊瑶柰若何夷白齋藁卷之十
