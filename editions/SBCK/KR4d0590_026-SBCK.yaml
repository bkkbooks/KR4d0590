front:
  text: 夷白齋藁卷之二十六
  hash: sha256:fb6e31e102199e419171ab654bf9505147afb3fd2a67aa0ff45f7bf5fe88d1d5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_026-1a}
body:
  text: 臨海陳基著金華戴良編記思善堂記勾吳張熈載氏力田事親扵松􅁜同里有郷黨薦紳之譽嘗讀書至公父文伯之母􅀁謂民勞則思思則善心生而歎曰羙㢤乎其言之也孔子之使弟子志之其有以夫乃即􅀁居扁曰思善堂且謂余曰願為之記夫人位乎兩間􅀁謂善者與生俱生也然中人以下㦯不􅀎不淪胥委靡而為其土􅀁遷故心之善惡生扵民之勞逸民之勞逸原扵土之沃瘠是以䠂有桂林之饒江湖之利其民侈靡而不務夲趙有邯鄲之冨四通之衢其民矜飾而喜逐末唐獨以土瘠民貧其人皆勤儉而質朴憂深而思逺故聖王之用民也有貴乎瘠土焉勾呉今之䠂趙也陸海之産夥扵桂林􅅷遷之貨盛扵邯鄲其土盖可知矣而􅄄衣皮冠唅菽飲水之民若熈載者頋諰諰焉曰以孝弟力田為務若􅀅自食其力如蟋蜶詩人之􅀁賦者噫豈聞陶唐氏二遺風而興起乎盖不淪胥扵其土而􅀎蚤夜乎其思此中人之􅀁難而君子之􅀁與也使勉焉弗􅀞循之有序則近之事親逺之事君無適而不與善者周旋扵洞洞屬屬之間而薦紳之譽􅀅不止扵郷黨矣易曰素履徃無咎熈載其尚念之至正十二年冬十月甲子記鋉雪軒記人恃五榖以生而世之􅄝茶如五榖者豈以其􅀎蠲昬滯􅇚煩壅亦飬生者之助乎昔陸羽既著茶􅀴張又新之徒復祖述羽論水之品第有二十而雪水則其殿也吳郡囙了堂上人少㳺四方學出世聞法而嗜茶則不啻如羽焉既歸老其郷而其郷之水冝茶且麗又新􅀁記有若虎丘松江者殆與南零恵山相伯仲上人頋舎不耴而獨􅀼竊焉有事扵品苐之殿者以自名其軒曰錬雪且上人􅄝茶如五榖盖不可一日輟者也然猶必待有雪而後錬之豈命軒之意乎盖嘗􅀙上人而論茶矣井焉而新薪焉而火活始也爽朗乎若晴空之行浮雲終也􅁿盈乎如白花之耀陽春或薄者為沫厚者為餑紛綸汹歘與雪同物故茶之蠲煩釋滯猶雪之􅁜弭毒害也煩滯􅇚而後五榖之㓛全猶毒害弭而後萬物之天遂也故不必虎丘松江而水之品存斯善乎水者也不待涸隂沍寒而雪之用􅁕斯善乎雪者也而其􅀁以䟽靈源溉舌本浸􅁋乎禪恱之味䇿勲乎飬生之外斯善助五榖者也正使世復有羽􅀅􅈲焉而心味之不暇尚奚品苐之殿云乎㢤然此亦自有色香味者而言之尔當其未始有色香味也真妄􅑡合名實交丧果孰為雪孰為非雪乎故即是軒而觀謂上人􅀁錬為雪固不可謂之非雪亦不可意頋安得六根互用舌頭具眼者與上人言之至正十二年十二月廿有一日韋羌山人夲源禪院記距黄巖州治之南五里有山曰􅀛山延祐間大比丘無住禪師㝎公居之州人李竹心氏黄克仁氏許野夫氏孟􅄫菴氏皆慕師之風往来精舎為方外逰至順二年辛未枽門契如知師雅有延待十方雲水之意爰即舊圖新得地南隴之半而遷焉州之信女金氏周氏徐氏黄氏施錢刻木肖圓通大士􅁚荘嚴崇奉蔚為寳坊今􅀁謂本源禅院世以甲乙守之者也師慮衆集而食不􅁇則事􅈥群居而律不嚴則業堕既買田若干畞擇其徒㢘畏通練者主其入又􅀊推一人為衆􅀁服者居首座凡禪誦動作威儀之則一遵百丈清規而九旬之夏􅁱持惟謹盖師族居州之西橋髙曽祖皆以貴胄􅀙學考亭朱子且􅊚而師也生禀㳤靈㓜篤慈忍少長事祖及父兄孝且㳟旣終飬􅂺蟬蛻萬縁謁方山寳公扵杭之南屏願以􅀄服而師事焉山器而度之時年二十有八具戒首謁無涯際公扵婺之智者一言懸觧頓造玄関􅁇見鐵山璚公而歸老是山􅁕不越閫者垂三十載以至正元年辛巳八月二十四日委化闍維之日珠圜玉潤名曰舎利者無筭遂建塔山之西􅅢春秋七十有三夏臈四十五後八年己丑師之上首弟子一恒不逺千里介其􅀙文煥以院之始末師之出䖏大梁徵文為記勒諸貞石以昭示方来按􅀛山即委羽山俗􅀁謂俱依山者也道家者流號為天下第二洞天云有真人嘗􅁿舉扵此今師以世家舊族即有入空懐寳厥躬退蔵扵􅁡始也捋以滅迹韜光終也遂以順縁闡化扵是崇基易構宅勝面陽佛燈照大有之天梵宇廓空明之境凡挈瓶錫背笈篋由天台鴈蕩而来者至是如歸人謂俱依之兆職此可徴吁夫豈偶然而巳㢤為其後者服師之服居師之居尚知培夲濬源蹈䂓迪矩使無上福田利益羣品則甲乙之傳其未艾乎庸囙恒之請而為之書若夫工之鉅細費之多寡其末也茲可以略云是􅀊七月既望省委官河南杜君政蹪記至正十二年壬辰春海㓂􅊞􅈇運汝㓂䧟湖㐮蔓延江東西江浙行中書省出師捕禦選材略素著者􅇱瀕海要害地嘉興為郡負海控江左拱錢唐右連吴㑹而其地若海塩舊邑澉浦黄灣境接島夷商通卉服大艘鉅舶與醜類鯨鯢相出沒有司防禦雖不敢􅈈尚慮勢庳事緩思得勇果有器局者捴之而行省難其人河南杜君由吉安路緫管府知事寓杭慷慨論海事其言剴切行省聞之大說遂命君乗傳涖澉浦往来黃灣䓁地以警非常凡以海為事者皆􅀠焉君入郡擇􅀎吏自随甫至首誅􅇯殘無頼素為民患者海昌群盗怙终捻􅁖已乆至是亦殄㓕逺近聞夙莫不慴伏平章㝎㝎公多其為勞以名酒錫以束帛金帶君念習海之民貧不安業則易變今欲弭盗而不知息民知息民而不知减塩筴之正薄商旅之稅猶治疦而不察其端雖有善藥無如之何也乃條其事以聞行省􅀙之未㡬㓂入杭湖常三路相􅁇失守浙右騷動㓂退生民塗炭者十八九君􅀁涖之地綿亘三百里獨晏然無􅂲民父兄相語曰生我者父母衛我者杜君也君曽大父元帥公䇿勛先朝開閫河南河北大父嘉議公湖南宣慰使司同知元帥府事父儒林公河南行中書省左右司貟外􅀰剖符授􅃏奕世載徳君伯仲鳴玉曵紱後先踵武今君扵此特以行省之命折衝一時保􅁵一境而􅀎恪㳟給興利除害使民不忘若是有如執干戈以衛社稷俾克配其前人則其大書特書屡書不一書者豈不卓然偉丈夫㢤故既述民父兄之意又推夲君先世大略并勒之石庶上之人欲知君者扵此有徴焉君名字云十三年癸巳月日記天恵賢首教寺記吳門天恵賢首教寺郡沙門如山安公之􅀁建也公世居松􅁜家本士族父吴伯熈甫隐居奉佛毋王氏崇信惟謹及公之生母感異夢爰在稺􅀊性禀殊倫少長出則服膺世典入則䔍意真乗父母察其不群聴以出家􅀶訪名師不計寒暑徧􅊥祕義尤嗜華嚴理暢心融殆若天授間讀大報㤙䓁篇而嘆曰吾佛􅀁說廣大悉備眷求其端實在孝敬扵是食粗衣菲而心專扵色飬錙積寸累而志扵報本既由儉勤得致饒益則以其贏購地扵郡城之東廣袤若干歩度材庀工作菴以居日益月増廓而為寺􅀴始扵年月落成扵年月門闥閎麗殿􅆍􅃉深講堂言言東西有序以至栖􅀴之閣選物之場方丈之室與凡齋庖庫􅁃其法􅀁冝有者靡不備完公扵此身先戒律率徒閲蔵􅀴梵並宣雜華芬郁荘嚴殊勝士民具瞻前僉行宣政院事張公嘉乃休績為請扵帝師寵􅃬今名俾為十方禮聘清􅈵䟽主之嫡傳者開山演教既竣事尋以寺之顛末徵文以為記世言浮圖氏善以小致大以難致易盖用力勤者其㓛􅀶刻意專者其効速矧其心懷頋復嗇巳厚親肇開圎頓之門永表􅇷逺之地迓續華嚴之奥學紹隆賢首之正宗且未始持簿赱民間資銖􅁰之􅂇扵人若安公者非用力勤而刻意專者乎為其徒而居其居者皆知以弘道報夲為務囙其􅀁以成嗣而繕葺之則無福田仰以衍無彊之丕祚俯以荅罔極之􅀻㤙而吴門之有天恵天恵之宗賢首􅀅與東南列刹競爽無窮􅀁謂㓛之􅀶者日以興効之速者日以固此盖公之志而余之􅀁樂道也故為之書使勒貞石云至正十二年月日記夷白齋藁卷之二十六
