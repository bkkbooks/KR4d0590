body:
  text: 臨海陳基著金華戴良編頌平江路達魯花赤西夏六十公紀績碑頌今天子御極之十有七年為至正六年詔公卿輔弼之臣若曰朕􅀅以天下之治責成守令尓尚各舉􅀁知以稱朕意扵是皆拜手稽首曰􅄑甚臣䓁不佞敢不慎擇其人以無負聖天子嘉恵元元之意乎既退咸以四方萬􅀦至扵荒外守圡之臣莫不各以其職宣布上㤙時莭貢水土百物以供郊廟社稷神眀之祀而平江為郡控帶䠂越􅀁部四州二縣地方千里海陸之産饒於古􅀦家􅀁恃以為奉祀根夲􅀁繫實異他壤職師帥任保􅁵扵此者􅀹難其選居乆之有以西夏六十公子約之賢爲言者宰相曰是故同知濠州有徳扵民者乎此長者可以復眀詔矣即奏爲平江路達魯花赤時至正九年也公方持江西部使者莭命下即由豫章趣吳郡長民者方臨人以嚴而刀筆吏規規守文不知大体公因憮然歎曰此風其可長乎不戢􅀅敗吾政乃以旦日謁先聖先師飭學官増弟子貟禮聘名師用月書季考之法程試之􅂑其中式者􅀘郡曺吏尋飾學宫墻廣倉􅁃以儲廪粟買學宫南廢囿作靈星門以正廟貌公餘政􅂩􅂺呼吏属鴈行立􅀙容爲言脩身理人之術出入􅀴史上下古今亹亹不倦日以爲常郡諸生化之争自激卬以眀􅀴􅂑進士髙第者至是彬彬焉公方務與民興利除害㑹有詔罷長生牛水深圍長蕩之属省憲遣官與公循行其地而崑山嘉㝎瀕海事故之由病民者為尤甚公囙自念使民安其田里而無愁歎之聲者二千石之事也今聖天子下寛大之詔茍不以斯時悉除民􅀁疾苦後悔􅀅焉及囙䟽其害力請而免之吳介居東南道路之􅍋喉有田者常賦之外又以餘苗供郡城與吳江平望水陸驛傳勞来之需公曰此非政之善者也乃以􅀊餘官糧變錢為子毋月耴其贏以次責郡曺吏主其費􅃅曰祇待民大稱便海運梗於盗行省諉公按兵崐山之劉家港公身先士卒􅓍力海事春夏兩􅒩皆以時逹亰師淮石冦􅀼彂攻䧟江東西郡縣浙右騷動省憲􅇂吴郡募民大興築城之役周餘四十里費且鉅萬然皆不仰之官属方盛暑公不忍其重困語及輒泣下且時身出入版築間勞苦之海盗復犯崐山公募民為兵選官吏之家居者分守郡城時門之啓閉以備非常􅀄冦之入杭也行省徴冨民引兵入援公曰蘇杭唇齒不應禍且及應之則民不堪命囙彂􅀁募義兵五百人赴之未㡬冦䧟常􅁇入湖烽燧漲空鉦鼓四起羽書告急者相望資糧兵械什器之求絡驛道路人心恟恟公晝則関決趣辨供億紛紜夜則申嚴約束以死自􅊎民頼以無􅂲居乆之朝廷除行省臣不逺數千里率䝉古軍備禦吴郡巳而省臣調他省江浙行中書囙􅊾公兼制軍事公鞠躬夙夜與士卒同勞苦然不動聲色而賞罰􅃅令視前十倍居民安業逺近稱之使者間奉詔募民輸粟佐江西軍視多寡􅀘官有差列郡承風應募比至呉公懇懇爲使者言吳民困扵和糴百需米價踴貴斗至錢若干緡小民艱食無頼方彂官倉振糶之實無以應募使者感公言遂以􅀁餘告身還朝廷時論偉之先是搉酤官止􅀵其稅後公􅀻讌賀更耴酒酤户吏徒並縁乗􅂩甚者至破民之産公議立罷之征止常稅而已公學醇識正性尚寛和聴政決獄務夲􅀴義而叅之以章程秉志忠貞􅈓身㢘恕而􅀅之以勤敏起家諸生官至二千石而退然身若不勝衣始公之下車也士仰其徳乆之吏服其􅀎其􅀎終也民安其業宰相奏公治行最東南詔嘉之特命増公秩復公位三年吴人室家相慶曰聖天子以公保艾我百妵三載告終引例當代復詔以公􅀻我使吾入有父毋出有司命俯仰六載夷險一莭晏然不與隣郡之民俱冐矢石殞鋒鏑膏血塗野草者聖天子之賜也盍刻石載徳以昭示無極且公旦暮入叅廟廊進陞䑓閣勲随位崇爵與徳稱其大書特書屢書不一書者太史氏之聀也乃具状授余俾論著公治吴善政􅈓而頌之以無忘聖天子之賜公以成均上舎生􅇚􅄄授濠州同知調南平浦城二縣長轉南陽府同知冨寜庫提舉尋改同知都􅈇運事由歸徳知府拜􅁥察御史又江西廉訪副使除今職云頌曰明明天子子恵兆民孰宣上恩曰在守臣芒芒彊理廣禹舊蹟孰先農人布時􅁰稷濟濟在廷奉詔拜手慎肅乃僚􅅖求逺􅂑九州立牧施及八荒各聀方物時莭来王睠兹吳㑹東南奥區厥土塗泥化為上􅃾豈伊人㓛勝扵地力諄諄徳音斯民之則孰􅀅明命往綏兹土􅈽其嬰孩授之父母宰相薦公天子曰冝彼誠長者朕用勿疑始而吳政逞以刑罰始而吳吏拘以文法公寛理之訓之􅀴義大者賔興小者試吏詵詵多士更化翕然飾其儒宫以表化源公教既施民瘼斯究田疇淪胥驛犒何有公承寛詔上䟽貸租使者勞来責之吏胥海冦梗􅈇公威却之船粟億萬往實亰師蠢尓妖冦蜂起蟻聚蔓㳂江南屠州䧟府公城郡載髙其雉公厲郡兵載􅁬其士吳城匪城公仁可慿吳兵匪兵公義可乗公哺我飢公拯我溺去其蟊賊滋我稼穡羽撽交馳以急告公徴求調彂斯萬不同公曰䘏㢤此皆王事敢不鞠躬夙興夜寐有卓治行上逹九重天子曰都子懋乃功有臣若斯冝在左右重憂吳人失賢太守詔増公秩詔復公位以公􅀻吳實天子意公之為吏如漢龔黄公嬰其變彼􅃴治康公之愛民如鄭􅀦僑始不忍欺終安其教公㽞拊我公勿去我公不我遺我忍公舎公恵在人公勲在石天子用公眎此成績海道都􅒩運萬户府達魯花赤脫囙公紀績頌天下之本在亰師亰師􅀁仰在海運海運􅀁恃在舟楫舟楫之利􅀁以濟不通然振古以来有天下者未有道海為渠轉􅈇東南億萬之粟灌注天府以備粢盛禄禀軍旅之儲如今日之盛者也盖世祖皇帝閎規大略􅀁以為聖子神孫萬世無􅆠之計殆天授之非人力也一旦有司撫字乖方鯨波鼓怒􅊞我糧道堅舟利楫蒼黄失錯鞠為􅁅燼扵斯時也軍􅀦大計茍非得人以濟之則祖宗七八十年振古􅀁未有之利􅀅有臨流浩歎而巳頋何益扵事㢤此海道都􅈇運萬户府達魯花赤脫囙公􅀁冝大書特書屢書不一書者也􅀄海道之失利也聖天子圖新􅈇政而難其人廷議奏曰今樞宻院㫁事官臣脫囙俶儻喜事忠謹􅅸人讀書知古今達事變􅇮執法御史府讜論不囬天下偉之臣䓁敢昧死請以􅈇事属脫囙詔曰可時至正十二年三月也先是每兩􅒩事竣􅒩民率以􅒩􅂩備器械舟弊必先期􅀘製謹風信也自海道有變糧艘䧟沒者叅半㑹公下車申嚴約束且迫􅒩期衆皆廪廪不知􅀁為公乃下令俾買吳䠂商船往来江湖之􅂅售者并日兼工益小為大且戒曰事貴神速慮多決少兵家􅀁忌此􅈇事吾以軍法治之敢有不用命者乎兩􅒩頼之􅌰皆以時達直沽公用事精勇􅁼如此上大恱詔賜上尊酒副之束帛公曰此特事之權爾非􅀴乆利也易曰通其變使民不倦今􅈇民告病舟楫不飭危道也變而通之其在斯乎乃移文平江嘉興湖州松江諸路府選民力之勝任者􅀘充􅈇户是時鯨波告息新􅈇之民利渉無虞囙為之用而軍􅀦大計􅀁謂萬世無􅆠者克復舊常褒勸之禮視前有加而公之事集矣公雖任專海道然茍以恵生民利社稷者知無不為去􅀊秋吳民阻飢公彂漕帑糴粟以振之今年春陽山愚民􅀼彂縦火剽掠鼔行趋郡西門公身先有司􅀙數􅀐出萬死不頋一生殺􅀗甚衆居民按堵省憲聞之皆遣使来賀十五年八月詔拜公為江浙行中書叅政事捴制軍民保􅁵東吳仍􅇂􅈇運事寵賚優渥昭懋績也􅈇民囙有作而言者曰公糴粟振民民誦之以詩公殄賊安民民􅈓之以石公重興􅈇政恢復海道制權冝如裴耀卿謀􅀴乆如劉晏䖏身清潔仕不廢學如韓滉唐有三人􅀝為鄼侯皆以􅒩運致位宰相公今之鄼侯也三人之長公實兼之而頌聲不作非曠典歟且公居􅒩䑓則功在海運位執政則志存藩省異日登台輔秉機要則又􅀅以徳加天下區區之頌扵公何有㢤雖然無言不詶無徳不報詩之善􅀴也乃礱徴文論著公􅒩政頌之公字眀善世為􅀩古部人頌曰昔秦輓粟􅈇運乃興一石之利百斛費并漢唐治之陸運水行􅀒檐操舟乗湍跨􅁜其一􅂉穿襃斜􅂉歴底柱􅂉鑿三門􅂉役女婦百險備更萬夫疾首庸錢千計得不盈鬴其二大㢤皇元天闢􅈇渠匪陸以阻弗川以紆扵廓靈海括坤之區嘘噏百源卑以自居其三維皇道之濟險以徳海若駿奔馮夷􅓍力掖我靈䑼賛我文鷁一波不興萬里斯息其四直沽之口析木之津糧艘㑹同伐鼓􅞹􅞹六軍騰驩萬妵交欣飽我糗粻樂此冨殷其五大略宏規善建不㧞詒謀無􅆠振古莫越孰􅀭鯨波百怪並彂其六燔我樓櫓梗我糧道出沒濤風犯我城堡彼方雷咆此寜電掃孰乖拊循致此俶擾其七既劫之舟又􅟃之粟上􅇅粢盛下􅃜禀禄軍無見糧民食半菽憂貽當宁議諏秉軸其八事有非常得人斯濟孰實堪之惟脫囙氏昔居諌垣􅎨言不諱使長􅈇䑓庶展才智其九君命既加公責斯厚金符虎莭銀章􅀛紐秩長萬夫􅀔崇列守公辰在公公退及酉其十公行雷動公止山立公令一申公事畢集以兵治􅒩以權濟急勇輸軍儲注實亰邑其十一帝命偉之寵􅃬有加公曰斯權􅀴乆則􅄼法貴變通户别䓁荖損上益下斥寡􅈬多其十二􅒩民核實舟楫利完春餽夏餉風往浪旋轉粟如山弗危以顛佽飛在後陽侯在前其十三昔焉効􅊇今則􅂇順威徳􅀁加載以眀信威徳伊何不驕不吝眀信伊何克㢘克慎其十四天子曰嘉事立㓛成授以執政􅅩諸外廷拜命分曺􅇂餉治兵公文且武公􅁢且平率我􅈇事衛我蒼生其十五公今在外保􅁵吳土邑有長城民有父母公行居中進位台輔室有棟梁榖有甘雨其十六邑􅀓輿誦野播民謡􅂉聞郷校􅂉采芻蕘謳謌㓛徳喜歎賢勞爰勒貞珉永􅁇風騷其十七銘頥菴銘山下有雷其象謂何曰維頥爾二陽四隂中虚外實下動上止天地飬物洪纎動植莫之有紀財成輔相聖人之㓛亦正而巳莫不飲食君子莭之其生也舒莫不言語君子慎之其徳不􅀌上棟下宇動息莭宣式燕以居在已則􅁉及物斯􅄎惟聖之徒茍舎其亀又拂厥􅀴征言滋惑居則觀象動則玩占惟􅁻是􅃴勿朶爾頥寜捫尓舌貞㢤不忒我作銘詩敢告執事庶㡬無斁貞白室銘并序昔江浙行中書叅知政事太原王公以忠貞清白勤勞王家其嗣季野用世家子入備宿衛未㡬以㤙授成都府判官需次扵吳即笠澤别業治燕止之室髙為尺者九廣加髙之一尺環室之内皆飾以楮西北南設小榻而以吉貝之精好者為簾扵其東出入者由焉季野夙興冠衣謁家廟禮畢趣退而休扵斯圖書琴筞惟意之􅀁􅃴而雅喜與搢紳章甫者商確今古詠謌風雅曰以為常入其室者如在在積雪之中而幽懐静趣殆不知有塵世也囙題其顔曰貞白属其友韋􅆧山人陳基為銘銘曰其心貞其室白端厥居匪徒飾不緇磷視其跡勒斯銘永無斁吳興沈仲􅀃得蘇長史舊硯名滄浪池臨海陳基爲之銘有蘇滄浪之硯泓乎池方以􅈬矩圎弗規潤爲文章炳其垂惟􅀃尚友不詭随尚寳用旃永弗􅈥緩軒銘并序吳郡隐君子沈仲說甫以訥名齋既自爲之箴復以緩名其軒属余爲之銘曰古之君子夙夜孜孜居則三省行則􅄪思下堂而傷􅁕者數月猶有憂色佩韋以自戒者百世而名不衰既恂恂乎捫舌之誨復懔懔乎􅂂冰之規勿行而使手􅁕無措勿言而使駟馬莫􅇷故奔車之上無仲尼覆舟之下無伯夷我思古人勤謹是飭濟以和緩剛柔兼克我行勿趋篤敬以為輿我言勿尤執禮以為樞勿亟勿徐以道乎中庸之塗嗚呼非若人是朂而誰與箴潜心閣箴并序吳郡陸飬正扁其齋閣曰潜心徴言扵余囙誦􅀁聞為箴以告之曰物無二夲人無二心孩提之童純乎堯舜也兎􅆯武夫文王莫欺逹巷黨人孔子莫違也飛㢘􅁖来非不􅁕箕子比干非有餘也道之則蒼舒庭堅反是則檮杌饕餮也君子潜心注行前言善乎吾師不善吾戒也楊墨學仁義似是而實非老子言道徳紅􅂵之亂朱也必出門使民如雍之事斯語參前􅀝衡如師之書諸紳嗚呼敬之其殆庶㡬也賛劉文正公小像賛并序丗祖皇帝有帷幄之臣曰故太保劉文正公間關金季䖏君子之􅀁不得已則裂冠薙髪寄跡浮圖老子法中亦有􅀁不頋一旦乗風雲之㑹􅇜興王之運一言􅁛旨則不頋萬死一生以野服冐艱險備頋問亦有􅀁不避及大勲已集四海一家坐而論道得君子之時則建國􅃅㝎都邑頌章服立朝儀事無鉅細以身任之亦有􅀁不譲盖公之學内聖而外王公之道􅏉佛而歸儒其事業則尊主而芘民也祖宗以馬上得天下而公首以詩書基治道􅀦家以百戰㝎萬方而公獨以不殺啔上􅂨中綂至元以来開􅀦元老出䖏始終􅇷配古人天下識與不識皆曰王佐之材則公也雖欲謙退不居可乎自古王伯之業有君而無臣固不可有臣而無君亦不可故非世祖之雄畧英断不䏻以用公非公之應變􅀶聞不􅁕以佐世祖噫古之􅀁謂窮則獨善其身逹則兼善天下非公而誰歟今淮南行中書省照磨曰惟敬者公之裔也以公小像示余余作而歎曰九原可作吾􅀙之矣乃載拜而賛曰心晋道安迹唐李泌道該百氏而通學䆒天人而祕齊有夷吾則􅁛伯漢有子房則成帝始􅏉佛老盖無為而無不為終佐唐虞亦正其義不謀其利置之丘􅐿則赤松為朋巢由為徒居乎廟堂則黄河如帶泰山如礪不知者求公圖􅀞之間其知者索我形骸之外嗚呼盖未易以測其際也謝叅政小像賛觀其容豈有憂扵斯世也察其心盖有求扵千載也其行也若思其㳺也若有􅀁之受君之赤子而乳哺之其樂也熈熈其䖏若黙其出也惟道是􅃴故論扵帷幄也弗忒其見善也如有􅀁弗及其好賢也如有􅀁弗立故施扵廊廟也弗以緩而先急紹乃烈祖友時卿輔左文右武以復王土人之望也如百榖之扵甘雨嗚呼吾聞跡雖纓扵軒冕心不忘扵山林若人也斯可與齊得䘮而同古今矣乎月上人􅀞像賛以上人為天台氏耶則赤手􅅮空了無􅀁著以上人為非天台氏耶則開口􅀃教無非糟粕當其雨華堂上聴赤髭大士授記則百年老蜯出眀珠及白玉峯頭為一切衆生􅀃法則萬古冰輪湧􅋁廓此為伯眀月公之相豈可以世諦語言隃度耶蘇昌齡小像賛以方寸之心而苞括宇宙以七尺之軀而馳騁古今聳聱名扵廟朝之上匿光耀扵西澗之潯舎兾北空群之􅁕而弗御棄鄧林擎天之􅆬而弗尋豈伯樂之志而匠石之心也耶雜著原器贈葉照磨徳新天下之器有大小而其為制有程度宫室聱樂衣服舟車皆器也先王之制宫室其用材也必使大者為柱小者為楔長者為榱短者為楶為侏儒而後上棟下宇之器備至扵聱樂衣服舟車之器亦莫不皆然否則琴瑟乖張柱楔異施布帛􅓎用水陸易置以之居則不􅀎除風雨調則不䏻和音吕服則不䏻禦寒暑乗之則不䏻任重以逹諸天下而器非其器矣先王之制􅀦也亦然人之為人也不一其材而􅀦之用材也不一其􅀎視其長短大小旁羅而並蓄之使職其職者各盡其力而責其成善制􅀦者也吾為天下誦斯言乆矣鄱陽葉君徳新結􅄠讀父兄書既長以六藝百家自縁飾􅀙東諸侯㳺為郡府史藉藉有聲流軰間吾嘗聞其在甌越時佐郡理官治獄活不當死者數百人甌越間人至今稱之及余以樞宻都事左右司貟外􅀰待罪江浙行文武兩府而徳新由􅈇史辟􅁺行中書辱同在幕下徳新出則操章程叅紀律􅀙􅀅相征討不廷雖犯霜露冐矢石不避入則與􅀰吏百執事進退廟堂鞠躬盡疩務是是非非以忠􅀁事俯仰六七年如一日未甞以利害為趋舎余甞為之語曰徳新有用之器也今年􅀅相多其勞承制擢徳新行中書賔属為照磨余又欣然謂僚友曰方面大臣夙興夜寢思欲與四方士大夫共天下股肱之寄猶宫室之扵材木聱樂之扵琴瑟衣服之扵布帛舟車之扵水陸不啻也徳新以其􅀁􅈽􅀒従容扵其規矩尋尺抑􅀭􅁿重之中殆琴瑟之􅃴耳柱楔之中度布帛之便躰舟車之服習有素者乎充是以往䓁而上之盖無施而不可也嗟乎使天下之制􅀦者舉􅀎使大小􅃴度長短中程職其職者各得盡其􅀎則士之如徳新者不可勝用矣作原器至正二十二年六月庚子臨海陳基􅄒諭圃文永嘉余唐卿父寓扵越治圃號菜薖夷白子為著諭圃文俾執事者􅀊時申圃政備菜薖氏掌故之一菜薖氏之圃在越桐桂里􅀊仲春土膏脉起􅀅有事焉先期具畚鍤羞酒事明日盛服謁后土氏東嚮立召圃之老者拊茠具告之若曰嗚呼若知菜之為用乎先王為耒耜教樹藝五榖五􅂼實並殖焉太史公書􅁛千畒薑韭其人䓁封君龔遂令民種䓗夲五十韭薤畦各一宋宇種菜品三十閔仲􅅩飯友無菜仲􅅩固誠貞士㢤夫圃與農㓛角故􅀊無榖曰飢無菜曰饉甚矣水旱蟲厲凡以賊吾圃者弗可以弗戒又曰若属老吾圃習圃事勿恣捕兎敗吾􅀲勿私利盗錢耗吾薑勿縦逸馬踐吾葵勿茍媚馬齒苦苣辱吾嘉􅂼俾芹可以獻吾君菜可以享吾師韭可以餉吾賔蘋蘩可以􅗲福扵我􅄦神吾用有常慶若亦永與有利又曰吾貴弗逮龔葛氏敢忘此味冨弗擬封君􅂚敢慢此色貧弗譲仲􅅩氏之徒􅂚敢少斯圃然有圃貴有政無政則捕兎弗禁􅁀扵水逸馬弗虞烈扵旱盗􅀼弗戢酷扵蟲癘馬齒之害弗勝茂草􅀊不告饉而圃巳墟矣嗚呼禍福若是其昭昭也吾申用􅂋告若尚慎聴毋忽往率乃属力圃事用底有秋以無諭童文有序陳子之居有畜犬日走雞群衝冐馳突縦横自肆鷄不勝其横則蒼黄鼓翼錯愕呌􅃅若求哀扵人者陳子閔焉命童設閑以衛之僮􅂉􅈈則其横愈甚乃為文諭僮俾母忽以貽雞害其辞曰后皇育物莫靈者人惟人配天莫貴者仁人必有家家必有畜彼畜焉依􅀠扵僮㒒惟犬司夜厥警有常惟鷄司晨厥聲孔臧晝夜是需有如水火􅀁貴相生不􅂑相旤昔人有犬乳而求食雞哺其児以朝以夕今我有雞三五為曺恃僮為命載啄載遨僮食主禄當役主役惟是犬鷄豈有僮職犬夜而􅃅人誰爾憎雞旦而鳴人誰弗興雞􅂉失旦其責斯厚犬而失盗其罪孰宥今雞孔時人焉是頼犬而􅁀之僮忍弗戒惟犬與鷄固皆人畜飲不同牢食不共粟昔更哺児今更相賊豈余匪徳抑僮罔飭僮而弗恭鷄犬乃攻攻而弗禁咎則由僮僮軄不􅁱鷄失其􅀁主不率僮怨􅀅誰䖏爾犬與鷄扵僮何有一安扵栖一謹扵竇我非􅀻鷄僮勿縦犬以是示諭僮敢不勉􅀃舟贈謝􅀙義吳􅁜謝侯守杭之三年擢讃太尉府為諮議叅軍其赴吴也臨海陳基合僚若千人耴杭湖山之􅉞麗與前代名蹤勝迹之可賦者分題迭詠餞侯扵舟囙指舵而告之曰侯亦知舟之為用乎夫舟􅀁以􅍱川而濟險者也其􅀁任亦重矣然必有􅀁需而後可以致其用焉舟之􅀁需其􅁼不一而曰楫曰檣曰颿皆有職扵舟者也舉是數者各職其職矣然而不聽命扵舵則進而􅂉却行而􅂉掣未見其䏻濟也夫舵者固舟之司命乎天下之渉海者必由江河彼瞿唐灔澦龍門底柱其􅀹險者也雖有兼舟利楫而􅀁需􅂉勿􅇱茍􅇱矣而操之􅂉不得其要則亦不敢以言濟其􅂉倖而濟焉非舟之福也夫川有逺近而舟則有小有大舟之大者其任重川之逺者其人衆彼吳越之人相救如左右手者操之得之要也舟中之人皆敵􅀦者不得其要而操之而移左置右又􅂉不䏻無偏重也盖操舟固難而無偏重者為􅀹難非惟古為然也今則􅀹然也謝侯文武忠孝為􅀦股肱既以身先舟人鼓枻扵吳興停撓扵檇李矣及弭擢扵錢唐夷猶扵藩方播循良以為風泳豈弟以為波而淪胥扵溝壑者莫不待侯而后濟而侯盖未始有難色也今也􅂺師帥之良任帷幄之崇又􅀅身先舟人操江河司命之舵運吳越左右之手救中流遇風之人以􅍱諸海舉焉而措之冝益無難者矣盖任重而不偏則致逺也不泥雖􅂉龍門在前灔澦在後然使綏以􅀅之翕而張之重以持之險而夷之未必非舟福也凡分題賦詩以壮矦之行者皆同舟之人期必濟扵侯者也侯尚無以不難為難也㢤至正二十一年二月丁酉郡東門舟中冩丁彦眀字􅀃淮南丁公彦明問其字之義扵余余為之􅀃曰君明鑑鑑􅀁以辨妍媸也人情莫不喜妍而惡媸彼邹忌之羙不及徐公亦逺矣然内而妻妾外而賔客􅂉􅀻焉􅂉畏焉􅂉有求焉􅌰莫敢為質言者及窺鑑而視則其不及也瞭焉夫鑑􅀄何容其心㢤亦無􅀻無畏無􅀁求而已前志有之以銅為鑑可正衣冠以古為鑑可知興替以人為鑑可眀得失彼邹忌之鑑何鑑也曰人鑑也何以知之盖事之有是非人之有善􅁖猶貌之有妍媸也彼辨妍媸者必以鑑猶察是非擇善􅁖者必以理理者天之􅀁以予人人之􅀁以為鑑也明者無􅀁容心扵是是非非善善惡惡之天也嚮使邹忌朝服而衣冠縁飾而自矜興焉而不窺鑑􅆍焉而不自思則忌也􅀅終身以羙驕天下而齊之君臣未可知也及一旦窺鑑而妻妾賔客舉不􅁕以蔽其天而齊􅀦因庶㡬矣燕趙韓魏聞之扵是相率朝齊而六􅀦之臣皆自以其明不如忌忌之鑑夫豈異扵人㢤亦不蔽其天者而已丁君結􅄠􅀙戎受之􅀅相起家列校服勞王官而未嘗以材武器􅀎自表襮其鑑之得扵天者厚矣盍甞觀扵内外䟽戚亦有􅀻已畏已有求扵已者乎反而窺之亦無􅀁容心扵其天者乎古之君子􅂉佩弦􅂉佩韋􅂉銘諸器物皆􅀁以去其蔽扵人而充其得扵天者也今也奉以周旋不假諸物而是是非非善善惡惡之天不過囙其名字而充之不益親且切乎􅀭子雲有言晞􅂹之馬亦􅂹之乗也晞顔之人亦顔之徒也彦明其尚睎㢤至正二十一年五月甲子􅀃鶴瓢􅀃瓢與鶴非同􅀋也而鶴之􅁛烏乎始始乎形之肖尔瓢之種瓠也而瓢之制烏乎始始乎始用瓢者尓均之為瓢也然使其種大而實五石祗見其瓠落無􅀁容未必其􅀎用也惟其小也而又肖夫鶴盖小者人之􅀁易習鶴者人之􅀁同愛以易習肖同愛嗚呼吾知其弗棄矣吳門李士明得鶴瓢扵青城山道士道士以瓢自随􅀄不虞其予士眀士眀之未始與道士接亦不虞其得是瓢瓢乎果孰生尓孰肖尓而去􅈬亦孰主張尓乎吾聞昔有辞天下而受瓢者夫以天下易一瓢其􅀁耴亦廉矣然亦不以有瓢為樂而卒棄之今士眀之得是瓢既服用之又圖其状詠謌之不少置若􅀅終身樂有是瓢者士眀之扵瓢誠厚矣雖然蔵舟扵壑夜半有力負之而走士眀之弗棄瓢士眀之責也士眀亦知自盡其責而已尓而其責有弗在士眀者亦不暇扵瓢計也夷白齋藁卷之十二
