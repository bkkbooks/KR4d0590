front:
  text: 夷白齋藁卷之十八
  hash: sha256:2550c08322f26a2052a583b2ede79d7a96ab7d31b543e8e6a4a1f93139050bc0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_018-1a}
body:
  text: 臨海陳基著金華戴良編序送邹􅁺史還江西序昔邹君弘道之先大父教授君以􅀎詩知名故􅀦子監丞莆田陳公甞欲薦之詞林未果而教授君卒扵家余與教授君逰時弘道方與其弟工文辞為舉子業未㡬余㳺北方弘道以賢􅀎書薦扵郷尋與計偕上春官與數十百人角勝負及天子臨軒䇿士弘道遂以進士擢髙䓁得官歸江南余在亰師亰師之人知余與教授君友莫不為余道弘道之賢而余故雅知教授君平生冝有令孫如弘道者獨念教授君積徳誠使假之以年則其見弘道褒然舉首扵數百人之中為天子門生克有成立以為郷里榮頋非邹氏祖孫非常之慶耶弘道之禄不逮大父矣然擢第為名進士居官為良有司辟行省為材􅁺史凡􅀁以為􅀭名顯親計者未始一日不奉以周旋教授君雖死亦可以無憾矣今弘道為西省使者告糴扵吳呉父母之􅀖也弘道不敢以使者自居獨身岀入民間與民為市􅀁糴雖不貲而人曽不知擾往往相謂曰鄒􅁺史不以官戾民夫豈以郷里故耶彼以􅖑牒迫民以刑憲臨民且旦夕遣吏呌􅅝􅈥突雖雞狗不得寜者此其以他使者待吳人固冝尓耶抑和糴以􅇱軍餉其事急其􅀔逼有不得不尔耶今􅁺史君為隣省告糴父母之􅀖固自與他使者不侔然他使者亦以和平待民以優賈誘民而民雖朘削亦􅀅樂與為市夫以和糴為民而使民不堪命亦豈使者之事也􅁺使君讀前史至唐元和以来和糴之害甚扵稅賦恨不奮臂出其間與當時廷臣共諍之頋肯以告糴譁然而駭以病其郷里父兄子弟耶掾史君公平㢘恕使得行其志扵時則其張之翕之左之右之􅀅無施不可告糴特細事尔其使還江西也吴之善扵詩者咸賦之余辱與弘道故故又為之序云至正十四年夏五月甲申送夲上人東歸序余郷本上人立中為浮屠松江衣粗食糲䆒心禪理蚤夜刻身甚力間出與大夫士揚㩁古文藝肆筆為詩章奕奕有竒氣遍訪浙東西諸名山長老大浮屠莫不以禮引接之余聞上人之賢有日矣今年上人来吳門始相見握手繾綣問郷曲里社孰逺孰近孰䟽孰戚乃知其與余世有婣童稚時往来田間出入桒梓未必不相識及各之四方􅀁學異師􅀁服異業􅀁趋異塗一旦卒然見面不相知名非假文字之慇懃語言之悃欵則余与上人不㡬終身為胡越之人乎上人貌甚偉氣甚温志甚慤開口論文字上下􅀙横反覆空有卒弗畔乎理與之居同帝食同鼎飲同器雖終身不厭余方資上人以逰乎方之外上人頋以大母之䘮􅀅東歸臨海省父母因奉襄􅁙事徴余言以為别夫去閭巷逺親戚二十年服浮屠之服誦浮屠之言冝亦浮屠而已矣今病心勞形不逺千里赱山川冐霜露辛苦蒲伏以庶㡬其生敬死哀之心夫豈直以詩章自雄徒􅂑如么弦孤韻瞥入人耳之為貴㦲世盖有墨名而儒行者吾扵上人又何間焉上人歸矣郷里之老者死壮長衰與上人逰者皆異時田間之童稚桑梓之少年也然亦有邂逅不相識者乎上人以親而歸余以親而㽞髙雲􅀌飛懐彼故岑此人情之􅀁以不忘土也為我謝昆弟曰我廬舎藝我􅁰稷余􅀅奉老母歸田里啜粟水飲優逰卒􅀊以樂其志矣送張知事序浙水西諸郡出稅賦奉􅀦家多寡固有差然近􅀊兵興資糧兵械什器百物之需率耴之平江嘉興松江盖此二路一府無平原大陸山林之阻非若錢唐吳興毗􅁜壌地與微饒義興㓂􅔯兇㜸出沒之境相接溝塍甽澮井分碁置大川小源興三江五湖相出入人居其土歩非舟楫莫濟使車驛傳之塗往来北南千里一􅁤四頋皆沙洲浦溆藿蒲菰葦鳬鷖鴈騖之區􅃄波莾蒼舉目無際烏合蟻聚之徒相煽誘肆妖毒攻䧟城池􅀁在崩潰相望獨此二路一府以水為封域利城守不利野􅀾僅以地􅀔得完然用是水陸之餫饟士卒之調彂器械百物之徴求不責他郡而區區彈丸之地日給月供家罷户耗而與被㓂之􅀖俱弊矣獨􅄑各得賢師帥拑循其父兄勉焉鞠躬竭力公上松江眂二路又僻在泖陂並海之陬其地非川陸之􅍋喉羽書璽莭非有故不至其民勤扵農桒使􅀊無水旱螟􅭈之之菑加以賢師帥字飬不苛則其俗􅃅昜治大名張君師明由􅀶士弟子貟為侍儀司舎人再調而為其府知事師明讀書逹古今識事變且刻身㢘謹與其􅀙弟户部􅀰中師􅁢俱有聲扵時其以􅀙事居幙府賛師帥布聖天子㤙徳扵用兵伐叛之時使其民宴然益知尊其君親其上雖有供億之虞而無枹鼔之警則師明之賢􅀅與其師帥並􅁛東南而融顯光大且權輿扵此矣扵其行呉之􅀎詩者咸賦之属序之至正十四年十月􅃋旦序友迂軒文集序􅀦家承平百年公卿大夫以文章政事􅁸成均者盖彬焉今都水庸田使宣城貢公之為􅀶士弟子貟也即學古工文詞同舎諸生皆自以為不及方是時先集賢文靖公與中朝學士先生並以老成魁􅀫待詔詞垣言道術則夲周公孔子孟軻言文學則由賈􅁩董仲舒劉向司馬遷班固韓愈歐陽脩之倫一時作者祖􅄒詩書憲章禮樂為聲詩則薦之郊廟為典䇿則施之朝廷皆􅀶綜古今成一家言盖三光五嶽混一之氣至是而極盛矣公以搢紳佳子弟岀入諸老先生閒折莭以纂言脩業為務及觧􅄄授官遂供奉翰林累遷為翰林待制􅀦子司業間以理官岀讞紹興路獄三年政􅃅平􅁢延祐以来諸老先生􅁛有後者惟文靖而公遂以文章政事名天下矣及皇上虚心儒學銳意中統至元之治宰相以公學問􅁕以􅀴緯人文政事􅁕以羽翼王化乃擢公為吏部􅀰中尋拜監察御史又由小宗伯轉兵部侍􅀰風猷氣望蔚然為儒林之冠而成均得人殆不徒以文章鳴􅀦家之盛􅀁謂文靖之後有人至而益信矣且自古􅀎言之士如賈􅁩之論治道董仲舒之䆒天人劉向之明􅀴術司馬遷班固之􅄒史韓愈之原道皆奥衍宏深為一王泫然皆不得乆居朝著見諸事惟其􅀁傳者獨空言而巳惟歐陽氐以文章顯其詞令褒貶既敷之扵訓誥伸之扵典謨􅋚揚諷諭復著之扵雅頌奏之扵神眀而其聲光位势又得與韓范冨諸公並􅁛為人傑今公以文章政事駸嚮用致位通顯其言婉者冝頌穆如清風之中人也直者冝諍凛乎箴砭之切軆也叙理􅅍則眀白而朗暢陳道義則委折而沖融大者可以著詞令述褒貶小者可以廣􅋚􅀭形諷諭盖􅀅益使聲光焜耀位􅀔隆重而文靖有後之言不獨信扵今傳之後世亦且􅁕以耴徵矣公之為都水使者至吳也基􅀗觀豫章塗貞􅅩良􅀁編友迂軒集若干卷因論次􅀁知為序以質之扵當世知言君子公名師泰字泰甫友迂軒其自􅃅云至正十四年十月庚子序奉親圖詩序恱堂禪師顔公迎其母扵僅昌􅀦之翁洲築室平江之崑山資福寺西數百武􅇱飬惟謹及為大浮屠領資福徒属晝夜演佛事猶勤勤不􅈈母子禮母氏年八十餘童顔稚齒􅁸居飲食歩履益康強公每侍側下氣愉色惟母意􅀁欲盖公不以浮屠儉其親親亦終身安其志欣然樂而忘郷里母氏以髙壽終公病心戚容哀毀不􅀎堪乃命善畫者􅀞其為飬如平生卷舒瞻省以慰罔極噫此仁人之孝子之􅀁以厚其親者公獨異浮屠㦲浮屠書有孝子􅀴言孝甚􅇱彼以空虚為禪文字為教者扵孝㦯不暇惟律以五戒為首猶有一舉􅁕不敢忘父母之義故昔之浮屠有棄住持獨身歸織屨飬母僧史書其事至今傳詠不衰公氣岸魁壘應物機警日與其徒􅀃出世間法而不徒以空虚為事至扵飬生送終之責不以出世間而㦯慊焉則又若一舉􅁕不敢忘父母者世以􅇚子扵親二本豈其然㢤公逰乎方之外而雅與搢紳大夫為文字交縉紳大夫樂為詩以􅁛道之盖􅀅貽後之續僧史者考焉余與公皆東州人故為之序至正十四年九月既望序贈曽彦魯序西夏長壽君景仁以湖廣行省理問􅀁知事乗傳使吳􅃴母夫人病中滿黄彂外且劇景仁以為憂問醫扵庸田副使髙公公以魯君彦魯薦彦魯診脉曰此得之脾冒濕􅀬投藥療之即瘉景仁思欲以言侈其恵余雅知景仁事親孝而彦魯為大府史以醫逰公卿間其􅁸人之疾如此皆可書乃為之言曰昔者先王設醫師掌醫之政令凡􅀖之有疾病者造焉則使醫分而治之􅀊終則稽其醫事以制其食而五味五榖五藥之齊存乎神農子儀之術五氣五聲五色之審存乎扁鵲之伎而九竅九蔵之􅀱存乎秦和岐伯榆拊之数然自秦滅典籍而醫方亦與聖人之􅀴並􅆸至漢興廣開獻書之路使謁者陳農求遺書扵天下作史者􅂑以列諸藝文而與六􅀴百家之書並傳扵後丗者皆李柱􅀦之􅀁校也夫脈有􅀴絡骨髄隂陽表裏之殊藥有五苦六辛水火之濟而醫有箴石湯火酒醪之用囙脈以視病之淺深在􅴪理者以湯熨之在血脉者以箴石攻之在腸胃者以酒醪治之此皆神農子儀扁鵲秦和歧伯榆拊之倫􅁸度量立規矩􅁛權衡案縄墨與天地叅爲生人萬世之計而漢淳于公張長沙近世劉河間張易水李東垣之徒守之以爲律令者也故醫之用藥猶吏之用法藥以去病法以除弊盖禮不􅁕而後法施猶飬不􅁕而後藥用焉今彦魯之禄不制以醫事軄守不掌扵醫師而􅀖之有疾者造之􅂲後不待􅀊終而其􅁸人之病如􅁸景仁之母夫人者皆可稽也然䆒其業方以儒術縁飾吏事而刑名法家之說習之如習神農子儀之書其執文牘佐郡長吏除民􅀁疾苦又若用湯火箴石之属以去癘疾也今書滿􅀅辟􅈇府史使由此而升則其登顯仕食厚禄如太倉令長沙守者殆猶䇿􅀦馬以􅃴燕薊非一日千里不止也昔之論為國者盖以醫􅂑諭焉故余因景仁之意申而言之非敢為彦魯告告其知彦魯者必以吾言為弗戾云夷白齋藁卷之十八
