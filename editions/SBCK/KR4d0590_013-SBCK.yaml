front:
  text: 夷白齋藁卷之十三
  hash: sha256:b1b40765d7a32826121493a92fd2f47dad8d9386d5e2e67985dd89c37a47a4f0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_013-1a}
body:
  text: 臨海陳基著金華戴良編序逰虎丘圖詩序至正十年秋翰林待制宣城貢公泰甫使江南眀年春使還過吴而聞􅀦子司業之命遂避傳舎寓白鶴之真館不終日而吳之大夫君子脩容于下執事者冠盖相属于暮之春風日柔暢相與登海湧峰頫劒池坐生公之䑓據小吳之軒覽長洲之故苑撫姑蘇之䑓榭而瑶林綠甸川魚雲鳥之出沒飛動者皆在欄楯之下扵是却匏竹進翰墨酣謌淋漓竟夕忘返公既属睢陽朱澤民氏筆之為圖復用澤民壁間舊題五言四韵為詩以倡之而苕溪郯九成沈自誠新安胡茂深赤城鄭䝉泉公之壻張士恭甥阮文銳余伯氏敬徳咸属和焉揔凡若干首尋以首簡授余曰子冝為序公以􅀴濟之學為天子頋問之臣雄文碩望師表儒林海内之士仰喬岳瞻景星之曰乆矣吾黨徒用區區文藝乃得接餘論扵山水間不亦盛乎且㑹合之不可常昔之人盖有當驩而悲者矣今環橋門而望公者殆百榖之扵甘雨也吾徒未􅀎脫鱗介生羽翰又安得乆􅀙公㳺乎雖然唐楊少尹之歸自朝廷也好事者誇其餞之盛謂其繪以為圖而當時君子又嘉其去就􅁼漢兩䟽作為文章榮耀千載今公之司業成均楊少尹之軄也而其功名事業人且望其䓁兩䟽而上之則異日請老而歸也尚􅀎􅀙君扵某丘某水以觀都門祖張之圖而為公賦之也至正十一年夏四月􅃋旦序玉山名勝集序中吳多宴㳺之勝而頋君仲瑛之玉山佳䖏其一也頋氏自辟疆以来好治園池而仲瑛又以􅀎詩好禮樂與四方賢士大夫㳺其􅈵臺燠館華軒羙榭卉木秀而雲日幽皆􅁕以彂人之才趣故其大篇小章曰文曰詩閒見曽出而凡氣序之推􅁶品彚之囬薄晴晦明之變幻叵測悉牢籠摹状扵更倡迭和之頃雖復體製不同風格異致然皆如文繒貝錦各出機杼無不純麗瑩縟酷令人愛仲瑛既㑹稡成卷名之曰玉山名勝集復徴余文以為序夫世之􅀉情山水間者多矣然好事者扵昔人别墅獨喜稱王氏之輞川杜氏之樊川豈非以當時物象見扵倡酬者厯厯在人耳目乎然輞川賔客獨稱裴迪而樊上翁則不過時召暱宻往逰而已今仲瑛以世族貴介雅有器局不屑扵進􅂑而力之􅀁及獨喜與賢士大夫盡其驩而其操觚弄翰觴詠扵此視樊上翁盖不多譲而賔客倡酬之盛較之輞川􅂉者過焉嗟乎後之視今亦猶今之視昔使異曰玉山之勝與兩川别墅並存扵文字間則斯集也詎可少㢤扵是乎言送黄徳廣序余與黄君徳廣同以東州之人逰中吳山水間吴之大澤曰具區周逥五百里灝溔潢􅃞混無端倪而其山則洞庭夫􅎛靈巖天平之屬髙卑俯仰為態不一而皆出沒掩暎乎其上朝光暮景與雲物争變化盖東南之竒觀也吳為郡物盛人衆賦夥而訟繁凡􅀠其土者率鞠躬盡瘁不遑夙雖有好事者亦不􅀎輟餘晷而樂山水也四方之道吳者冠盖相屬然非北之燕薊則南適閩越又孰􅀎齎糗糧以事無益之逰乎故窮吳中山水之勝自非卑閒無事如吾兩人則舉莫之􅀎也余甞與徳廣汎舟過梅里登海虞出三江之口頋瞻山川之蒼􅃼俯仰千載扵湏􅁷而聖賢之遺跡厯厯可考也盖江湖之間厥土塗泥踵行喙息之民罷耒耜而給饟餽恒􅁦􅁦以終日則吾兩人之􅃴非惟其賔客者不􅀎雖其父兄子弟亦不暇以爲也人常苦扵貧賤而吾乃以賤貧得自肆扵山水而徳廣固非乆貧且賤者也今秊秋徳廣有力者爲之先􅀅脫鱗介生羽翰去我而弗頋也噫向也舉吳之人不得爲吾兩人之㳺今也非惟吾不􅀎強徳廣而㽞之徳廣雖欲爲吾㽞不可也然則出䖏􅄐合非惟吾兩人不􅀎自知雖古之君子亦不􅀎必也徳廣行矣余􅀅入山益深入林益宻他日徳廣以其􅈽負有􅀁遇而㱕􅂉者不忘而欲求余扵藜藋之下則以是為之旌矣囙書以貺之送丁經歴序吳在禹貢􅀭州之􅏾其藪則具區土地塗泥而田則下下也吳之土不如雍州之黄壤其田不及豫州之中上而其賦視梁州乃在下之上者徒以人工脩之而其水淺土薄固自與中州大不侔也庸詎知古今殊時風氣異冝塗泥之土貢倍扵黄壤下下之田賦浮扵上上而人之工果􅁕以勝地力㢤夫息人工以飬人善為􅀦者也窮地力以害人賊夫􅀦者也吳之不愛其工以奉上也乆矣而其害有若長蕩華蕩之屬積水為陂激風濤黿鼉蛟螭率醜􅁼居之􅆑育子孫以専其利使神農執未后稷秉耜亦末如之何而有司什一之征􅀊有常筭驅民扵不測之淵為之上者縮手弗顧而􅀴歴丁君獨閔然思有以極之推是心也其殆古之􅀁謂遺愛乎􅀄君之至吳也民有謌者曰吳之土􅀆淖而卑吳之田􅀆淪為湖陂我田于湖􅀆官剥我肌昔神禹􅀆手駢􅁕躓􅀅以厚吾之生􅀆今反病之我欲上訴􅀆天不可躋我欲淪死􅀆不忍子與妻吁嗟儂􅀆何以生為君聞之曰有是㢤吾聞苛政猛扵虎此非虎之􅀹者乎夫使田野無愁歎之聲二千石之軄也今吾来佐長吏布㤙澤而民困若是􅀅何以上報天子乃獨䟽其事上之巳而上詔郡􅀦除民􅀁疾苦而吾獨賴君之言有􅀁休息又􅁔曰原則有􅁰水則有魚昔云不􅁕今乃有餘隰則有秔水則有魴人言之􅆇我以為慶又胡可忘扵是皆以君為長者而吳猶有泰伯仲雍之遺民焉扵君之代而歸也書以志吳人之意至正十一年九月甲子送劉志伊序山川之秀鍾扵物者為珠玉鍾於人者為文章然求玉者必扵崐崘流沙萬里之外求珠者必扵南海蛟龍不測之淵不如是則無以擇其精而致其多而文章在天地間尤難精而不易得者也三代而降文章與時髙下而秦漢魏晋唐宋之文見扵文選文粹文鑑者後人即其成書上下千數百年以觀其制作之變而不知當時采摭之精有不易以􅀊月計也然則搜羅纂述以為一代人文之乗而欲與前代之成書並存不癈而不之乎文章之崐崘作者之南海求之而􅀎盡大觀而無憾也難矣􅀦家以三光五嶽混一之氣涵煦六合而百年文物之盛著扵文類者亦可以㮣見然夜光之璧照乗之珠縦不横委扵道亦豈無待賈而未售者此冝春劉君志伊􅀁以北赱亰師南浮江淮上而朝廷之著作下而山林之論述兼儲並錄日益月増如猗頓之扵貨不埓富扵王公不已也噫志伊之用心亦勤巳㢤然尚勿為鄭人買櫝而還珠亦勿為魏人之以玉為石而棄之則􅀁得誠精且多矣扵其歸也序以贈之横山紀行詩序吳郡沈仲􅀃甫由長洲先塋鼓拖而西出胥門過石湖省母夫人之墓扵横山之陽道路􅀁厯輙頋瞻哀慕而其低佪窹歎之形諸言者皆成韵語時余辱與同載間亦有􅀁賦其甥吕彦貞悉手錄之揔若干首夫吟詠情性莫過於詩然三百篇皆夲性情而􅀹感人者無如蓼莪盖父母之徳昊天罔極人子烝烝色飬尚不􅁕以報其萬一而况乎不得終飬者其心為何如此君子􅀁以三復流涕而不忍讀之也今仲􅀃天性醇孝篤學好問而又􅇜時太平克承世澤其視􅖋莪之時不侔矣然而既怙且恃以鞠拊畜育者仲􅀃皆蚤失之而其頋焉復焉腹焉者獨賴祖母之存今亦已矣雖􅂧生事死􅁙無􅂉遺憾而仲􅀃豈忍一日忘其親㢤是以頋􅃁舎扵長洲踐雨露扵横山仰天宇之澄鮮撫原野之夷曠而風木寒泉之感見扵銜恤茹哀者雖欲不為詩不可也嗚呼之為用在扵成孝敬厚人倫彼百鍜為字千錬成句勤則勤矣扵情性何有㢤昔孫興公賦詩以伸罔極之痛識者謂有􅖋莪之遺思焉而歐陽􅅩弼居憂君子盖有􅇂其作詩者余雖非識者仲說固興公之徒歟世有君子如蘇長公則仲􅀃賢扵􅅩弼矣余既囙彦貞􅀁録用崔正言紀行詩軆編彚之又喜仲􅀃􅀁作夲扵性情扵是乎書送粹上人詩序粹上人由天台􅅸海泝江歴叅浙水西諸名山而雅喜與賢士大夫逰聲稱藉甚余嘗見其風神秀朗如寒潭秋月進退作止修整閒暇固已􅀻􅀼異之矣久之􅀅還山讀書宻邇親舎庶㡬朝夕以報頋復之㤙其徒不􅀎奪之也榗紳先生聞其行争為謌詩以偉之以余辱与上人交俾為之序昔之知言君子謂浮圖氏之書過扵荘墨申韓而與易論語合余甞􅀼疑之及觀其大報㤙諸篇則其教人率先孝敬乃知世之論佛類以其恠幻訑􅗦而其徒好略文字以為髙去孝敬以為逹者皆過也今上人學禪而不略文字為􅇚而知孝且敬又􅀅歸而益求其􅀁以與易論語合以充其大報㤙云者盖五常之道不二之法未始不本扵人心茍䆒其歸雖同其中而異其外可也上人勉乎㢤庸敢叙贈詩者之意書之首簡以授之夷白齋藁卷之十三
