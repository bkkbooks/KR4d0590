front:
  text: 夷白齋藁卷之三十一
  hash: sha256:c17c53c32fa8a21472ce350a6e82ebec23a6f516a875da99b98e226c75f394c7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_031-1a}
body:
  text: 臨海陳基著金華戴良編記退思齋記㑹稽蔡君彦文由諸生􅁸憲曺歴郡􅈇史辟􅁺行中書擢江浙行樞宻府為都事􅀁至以材諝賢勞著􅁛盖三十餘寒暑矣今年踰五十􅀴儒緯律師古不少􅈈敏事力行未嘗擇利害及退而思則又未嘗不拊躬自訟者其自刻勤篤㮣如此嘗讀書至晉士貞子􅀁􅁛荀林父之事君也進思盡忠退思􅀘過囙歎曰此春秋之賢大夫􅀁以為社稷之衛者乎吾雖無􅀎為􅃥嘗受教扵君子矣乃自題其蔵􅁱逰息之䖏曰退思齋以余辱有一日之雅俾申其􅀃而記之夫士之為士也孰有大扵事君者乎其􅀁思也孰有先扵君之事乎思者何思􅀁以獻其可而替其否也君好賢吾思進之惟􅂲其􅂉不先也君好佞吾思逺之惟􅂲其􅂉後也君惡諌吾思犯之惟􅂲其􅂉隠也君喜䜛吾思去之惟􅂲其􅂉弗亟也充此類也亦可謂盡忠矣扵是退而思曰吾􅀁進果眀且􅈒乎吾􅀁逺果便且巧乎吾􅀁犯果直道而􅀁去果變白為黒易是為非者乎吾􅀘過也類此其殆庶㡬矣又退而思曰吾責難扵君者欲其盡君道也吾盍盡其道乎君有􅊴吾思盡其忠矣吾有􅊴􅀅孰盡乎吾師古人焉爾此彦文之扵林父􅀁以善師古也善師古者無它亦拊躬自訟而巳然余聞之賢不肖異思彼思招人之過以為直利口捷給以為辯􅀙㬰比周視喜怒為毀譽以為智此􅀁謂小忠大忠之賊也林父疾之如􅄷讎賤之如禽犢惡之如􅄦蜮如虺蜴者也彦文之􅀁以勉其在此而慎其在彼朝焉而兢夕焉而􅅥閔閔焉不遑啓䖏者盖􅀅奉以周旋盡忠社稷師古之力也詩云髙山仰止景行行止書以為記非徒以私彦文也亦􅀅以自朂云爾至正二十年五月甲子記志學齋記士之志學猶農夫之志于畊焉易其田疇脩其彊畔先之以耒耜申之以耰耡而叅之以錢鏄時其農祥晨正以􅀣藝之凡庶草惡莠非其種與夫百螣之為苗􅖈者耘耔之茠刺之勿使滋且息焉然後榖之庭者碩堅者好而烝嘗薦饗衣食之源不匱詩云曽孫不怒農夫克敏甚矣學之有類乎畊也古之聖人無不學堯學乎尹夀舜學乎務成跗文王學乎師尚父武王學乎郭􅅩孔子之學無常師然要其歸則祖述堯舜憲章文武也唐虞以降聖人有其徳無其位言焉而為天下法者其孔子乎故士弗學則已學則必學孔子焉學孔子者無它亦猶農夫之師后稷而已故曰積耨耕為農夫積禮義為君子孔子三十而立四十而不惑五十而知天命六十而耳順七十而􅀙心􅀁欲不踰矩皆由十五志學以積之彼學奕秋之為數者亦必專心致志而後得焉今吾為孔子之徒誦孔子之言豈訓詁而已㢤文詞而巳㢤􅀶聞強記夸多闘靡而已㢤由洒掃應對積而至扵窮理正心始以成己終以成物此孔子之􅀁以詒謀千載者也傳曰人一􅀎之己百之人十􅀎之己千之雖愚必眀雖柔必強甚矣學之有類乎畊也行中書􅁺古􅅬卜君師顔以志學名齋雖鞠躬王事戮力戎行而蔵焉脩焉逰焉息焉之志未始不閔閔焉如農夫之望􅀊師顔之志亦尚矣夫人情為田禮以耕之義以種之講學以耨之而異端百家之說為我庻草惡莠百螣者又耘耔之茠刺之惴惴焉惟􅂲其滋且息焉􅀊云秋矣庭者碩矣堅者好矣孔子之􅀁謂立立此者也􅀁謂不惑不惑此者也知天命知此者也耳順順此者也􅀙心􅀁欲􅀙此者也始無扞格不勝之憂卒兑過時難成之患近不汨沒扵㓛利逺不躐䓁乎空虚窮則遯世而無悶逹則化民而成俗此學之所積如衣食之源生生而不匱甚矣學之有類扵耕也師顔扵此奉以周旋盖􅀅積之以化民成俗者也書以遺之以勸同志尚安以舎己之田耘人之田㢤卧雲軒記行中書右丞吳􅁜王公即居苐東偏築室若干楹壘石為小山引水為池沼藥畦花逕紆餘委折朝光暮景與雲日争變化間與􅀁知角巾逍遥引觴淋漓酣謌夷猶浩然有脫屣軒裳蟬蛻冨貴之意嘗自誦曰世無赤松子則范少伯張子房何如人也囙自題其顔曰卧雲軒黄鶴山人最善􅀞凡卉木􅃄霞山光水色可以状夫軒之勝者慮無不曲盡其態士大夫因相與傳玩之且曰王公古之人傑也曩在畎畞已有憂天下之心今以内聖外王之學尊主芘民之道出􅀅入相為時宗臣盖布衣之極矣扵是一丘一壑以卧雲自髙不亦冝乎又曰夫雲随時而隐見囙人而卷舒者也故在泰山則觸石而􅁸膚寸而合不崇朝而雨扵天下在赤松則御之以上下為􅀨師以事神農在少伯子房則乗之以􅀙勾踐髙祖談王伯為萬乗師由神農至今不知綿歴㦲千百載矣黃帝氏嘗以紀官保章氏嘗以占􅀊漢世祖氏嘗以命臺今公􅀁䖏則少伯之位􅀁行則子房之道􅀁掌則黄帝氏之官􅀁致以為豊穰則保章氏之􅀊􅀁䇿勲以圖不朽則世祖氏之臺也由是而觀赤松不可及矣然為雨師以福四海是未嘗忘乎斯世也少伯子房冝無􅀁可否矣然三致千金之産是貨殖之流公之􅀁不屑焉者也􅀂夫閉門辟榖若無意乎世間之事矣然卒以計㝎太子安劉氏此社稷之臣公之􅀁欣欣慕焉者也彼南陽東山之徒識者不以其堅卧為髙而以其復􅁸為賢九原可作公其與之乎吾聞之古之君子動不違乎時静不外乎物故散之則弥綸覆六合雲之跡也歛之則消液入無形雲之心也迹可􅀞也而况可言乎雖然姑為記之以待忘言者至正二十三年􅀊癸卯四月乙巳臨海陳基記深雪軒記浮屠師金上人主嘉禾之天寧寺作室扵方丈而堊之因名曰􅀷雪軒􅂉者議焉曰深雪云者唐詩人之語也上人㳺戯翰墨􅉫弄萬物以陶冩其性靈其扵詩人􅀁謂前村深雪者斡泰和扵􅀊寒運天機扵言表盖必黙有以㑹扵其心者矣非徒堊其室之謂也又曰上人禪者也禪之祖有侍立少林而積雪至膝者上人宴坐斯軒澄觀物􅀄豈欲神而明之而與其祖者相忘扵無色無聲無垢之天乎􅂉又曰詩人之􅀁謂託乎物者也禪者之􅀁立外乎物者也今上人之名軒其託物乎則上人外物乆矣其外物乎則􅀁謂黙㑹扵前村相忘扵少林者皆未易以淺近窺也由是而觀雪一而已而有詩人禪者之意上人合以名其軒盖非得巳也而􅂉者議焉又豈得巳乎嗚呼以不得巳之言議不得巳之名名可議也而非名者意在言表無色無聲無垢不可得而議也然則議其可名者而其不可名者它日更僕而議之可乎上人曰唯唯囙為記㦯者之言書之軒中以伺上人字西白吳郡人為之記者夷白居士臨海陳基也至正二十三年四月既望記夷白齋藁卷之三十一
