front:
  text: 夷白齋藁卷之二十一
  hash: sha256:5ade00c4547484f7cdf89024e31598c1826546f0686af5723e3a0c3a90ff39a2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_021-1a}
body:
  text: 臨海陳基著金華戴良編序送􅁴上人序昔内翰􅀽文清公之歸老四明也章甫搢紳與夫佛老氏之徒仰喬岳而瞻景星者慮無不登其門焉盖其學問之􅀶洽議論之源委文章之雄且􅀷蔚然師表一世而吾郷􅁴上人宗聖實與及門者也公既厭棄人間丗上人挈瓶錫西􅍱錢唐聞大浮屠忻公咲隐倡道金􅁜因不逺数千里徃􅀙之㳺方是時中朝鉅人執法南行臺如濟南張公夢臣東平王公􅁇學並慕晋宋王謝孫許習鑿齒之倫與支道林釋道安軰往来文采之相輝聲詩之迭和亦一時儒釋流風之勝也㢤上人扵是獲望其精光閒其餘論退而叅之以儒墨慱之以騷雅間以􅀁長􅉫弄雲月陶冩性靈徃徃為諸公􅀁􅁛賞始侍故侍講金華先生黃公扵錢唐㑹上人自金􅁜来觧行李出􅀁作余􅀙而諷詠之飄飄然有􅇒虚御風之意余故以心敬而貌随之矣未㡬余􅀙北方囬寓吳門聞上人居錢唐佛寺衣麤食糲晝夜脩持甚力㦯長跪頂佛竟夕不􅄰其刻苦猜嚴如此囬視向来罷精神雕琢世諦語言為文詞􅀅厭悔且不暇又安知世間􅀁謂榮瘁寵辱為何如事耶今年夏上人来自吴興年且六十矣與之坐道舊故語離濶乃知其徒強上人主寺廣化山而非其志也頃之尋還吴興徵言以為别自文清以来數十年間諸老淪謝殆盡而金華先生亦不可復作矣其門人賔客散之四方兵後相見亦有如吾兩人者乎上人始以文字為禅恱終以脩持為義諦又終也不􅀎不為其徒􅀁強吾聞之安時䖏順古之􅀁謂縣觧也上人歸見吳興陸使君吳别駕為我謝曰治郡甚勞苦外過􅀙欲得詩僧齊已之流信道原􅁴宗聖其人也至正十八年夏五月夷白道人陳基序贈醫學提舉張性之序先王設醫師掌醫之政令與冢宰之属並􅀠天官􅀊終則稽其醫事而以十全為上其責亦甚重矣漢興史官論次百家而李柱􅀦􅀁校醫方事術亦得與六藝之文並守扵王官及宋蘇長公軰論秦漢間得失引醫為諭而卒歸之扵清净天下至今誦之近世河間劉氏戴人張氏東垣李氏二三子者作推明漢張太守之學上逹扵淳于公秦越人而卒折之以黃帝岐伯之書然其術不務為苟同盖時之先後㦯殊人之氣禀亦異治之之法譬之兵焉曰攻曰守未昜以一律論也大江之南士以醫名家者冝莫盛扵呉而劉李二三子者之傳亦莫盛扵今日余獨恠夫公侯􅀅相薦紳大夫與夫編户之氓無問智賢愚不肖凡語醫必曰張君性之行省承制拜官又獨署性之提舉江浙醫學俾掌醫政而守王官物議無不韙之者盖以性之之醫事稽之則其􅀵全功扵人者非一日矣今年夏行樞宻断事官淮南唐侯伯剛病憤懣舌本強澁手􅁕痺不仁㦯以為中風性之診之曰此痰蓄扵中浸􅁋扵脉絡赱注扵四肢莭宣失度天和錯繆故病蹷耳非中風也法當理氣氣理則升降條逹憤懣自平如其言而愈盖性之用藥如唐侯之用法法貴乎防未然藥貴乎治未病昔子産治鄭孔明治蜀寛猛嚴恕酌時之中以防範庶民猶扁鵲之􅇊随俗為變以虞人之夭札也今性之治侯疾亦猶侯不劲捍以徼一切之功不猗違以徇難犯之􅀔視民􅀁毒螫者謹除而去之噫性之固難􅀎矣唐侯亦豈易為㢤盖論病以及􅀦原診而知政此醫之善物也序而傳之豈徒以溢羙性之而巳盖􅀅質之唐侯而與吾黨􅀙政者揚搉焉此余之􅀁不敢以苟譲為也至正十八年七月丙辰序送周信夫序太尉府妙蕳属僚淮南周君信夫由行樞宻断事官􅀴厯進辟􅁺史至正十八年八月二日也断事官夏侯仲信唐侯伯剛旦日赱樞府揖吾黨而進之曰僕䓁辱待罪樞属頋􅀁資以辰入酉歸鄮鄮焉曰與攘臂乎桎梏枘鑿間求􅀁以折其􅂨而不可以斯湏㦯􅂺者周君也今引而􅅩諸三事之庭知人之眀則信無遺鑑矣然吾獄有􅀁可疑事有􅀁未􅁢是非紛黒白混殽􅀅奚􅀁諮决乎語未既臨海陳基與􅀴歴髙君元善都事王君敬甫謝之曰侯之言固當矣而㦯者猶有􅀁未喻也夫操黜陟以進退一世之人物者􅀄奚容其心㢤亦曰公而巳爾昔者信夫甞以摳府􅁺與吾黨􅀙事平章榮禄公矣其䖏心也恕其率已也嚴以鞠躬以趋事也整而暇其執筆以疇容議法賞必公罰必當殆權之􅁿重度之扵長短而規矩之扵方圎也文深而無害事脩而不伐正色而不可干以􅀻及署􅀴厯司畫諾俾羽翼侯䓁不啻如左右手此榮禄公之􅀁属任而信夫之􅀁奉以周旋者也今太尉以武濟時以文􅀴􅀦不愛玉帛與馬招来賢俊四方竒俛之士聞風而至者相望也列辟庶僚乃有忠謹老成如信夫者譬猶􅀦馬之在范廐材木之産鄭林􅇍驟中鸞和之音曲直適鈎縄之数而不使之叅緑耳以騁康荘友豫章而薦宗廟不㡬乎貴逺而賤迩徇其名不閱其實乎况馬蹄可以踐霜雪􅀊寒然後知松栢此􅁺史之辟其属任有重扵􅀴歴者故不暇為侯䓁計也夫物理有􅁿重人事有長短應務有方圓執權度規矩之中而􅀅之以嚴恕申之以整暇信夫其有彼此之間㢤泰之􅀄九㧞茅茹以其彚征吉伯樂在前侯䓁不􅀎狎信夫而㽞之矣匠石在後信夫行有待扵諸公也侯曰子之言辯矣冝述以為序扵是乎書西湖書院書目序杭西湖書院宋季太學故阯也宋渡江時典章文物悉􅊞汴亰之舊既巳裒集􅀴史百氏為庫聚之于學又設官掌之今書庫板帙是也徳祐内附學􅆸今為肅政廉訪司治􅀁至元二十八年故翰林學士承􅈲東平徐公持浙西行部使者節即治􅀁西偏為書院祀先聖先師及唐白居易宋蘇軾林逋為三賢後為講堂旁設東西序為齋以䖏師弟子貟又後為尊􅀴閣閣之北為書庫實始収拾宋學舊板設司書掌之宋御書石􅀴孔門七十二子􅀞像石刻咸在焉書院有田􅀊􅀵其入以供二丁􅅒膳及書庫之用事逹中書􅂌以今額且署山長司存與他學官埓扵是西湖之有書院書院之有書庫實昉自徐公此其大較也由至元迄今嗣持部使者莭扵此者春秋􅃋望􅄒徐公故事未之􅂉改也獨書庫􅀊乆屋弊板闕􅂉有􅀁未暇抗民好事者間以私力􅀘治之而事尋中止至正十七年九月尊􅀴閤壊書庫亦傾圯今江浙行中書平章政事兼同知行樞宻院事吳􅁜張公甞力而新之頋書板散失埋沒􅀁得瓦礫中者徃徃刓毀蠧剥至正二十一年公命􅁵􅀘之俾左右司貟外􅀰陳基錢用壬率其事尤工扵是年十月一日􅀁重刋􅀴史子集欠􅊴以板計者七千八百九十有三以字計者三百四十三萬六千三百五十有二􅀁繕􅀘各書損裂澷滅以板計者一千六百七十有一以字計者二十萬一千一百六十有二用粟以石計者一千三百有竒木以株計者九百三十書手刋工以人計者九十有二對讀校正則餘姚州判官宇文桂山長沈􅁉廣徳路學正馬盛紹興路蘭亭書院山長􅇒雲翰布衣張庸齋長宋良陳景賢也明年七月二十三日訖工􅅚司書秋徳桂杭府史周羽以次編􅀋􅍥之􅀴閣書庫秩如也先是庫屋洎書架皆朽敗至有􅂑而為薪者今悉告完既竣事公俾為書目且序其首并刻之庫中夫􅀴史􅀁載皆厯古聖賢建中立極􅁱己治人之迹後之為天下􅀦家者必扵是乎􅂑法焉傳曰文武之道布在方冊不可誣也下至百氏􅀁述必有禆世教然後興聖􅀴賢傳並存不朽秦漠而降迄唐至于五季上下千數百年治通有得失享國有短長君子皆以為繫乎書籍之存亡豈欺也㢤宋三百年大儒彬彬軰出務因先王之跡推而明之其道大著中更靖康之變凡詩書禮樂百王相沼以為􅁤範者随宋播越㽞落東南國初􅀵拾散亡僅存十一扵千百斯文之緒不􅅸如綫西湖書院庫其一也承平以来士大夫家誦而人習之非一朝夕矣海内兵興四方騷動天下簡􅁽􅀁在㦯存㦯亡盖未可知也杭以崎嶇百􅀾之餘而宋學舊板卒頼公不亡基䓁不佞亦辱與事者手訂而目讐之惟謹可謂􅄑矣嗟乎徐公􅀵拾扵北南寧一之時今公繕完扵兵革搶攘之際天之未丧斯文也􅂉尚在乎序而傳之以告来者不敢讓也至正二十二年八月丙子序弔徐莭孝先生序至正二十二年􅀊壬寅臨海陳基辱與桐川錢用壬俱以右司貟外􅀰待罪江浙行中書秋九月同叅平章吳􅁜公軍事扵淮陰冬十月十五日同率僚友出郡東門行三数里謁古儒先生莭孝徐公之墓偕行者江浙行樞宻院㫁事官秦都元輔行摳宻都事淮南湯鼎江浙行中書通事西夏王相嘉世禮􅁺史吴􅁜楊揖洎淮南行中書照磨惟揚劉惟敬實在焉城事甫觧嚴積雨乍霽霜氣始肅周視原野皆遺燹􅆸壘異農村漁市樵蹊牧􅈳與販夫賈竪相徃来通有無貿易者四皆是也今鞠為丘墟平䠂望坡陀􅁸伏皆殘阡敗冢狐兔岀没無禁古今􅁜谷變遷不知更㡬􅅍離其生食厚封都顯爵建旄樹纛以貴冨􅑞當時没以侯王公卿禮􅁙者不知㡬人矣百世之下頋獨求前代一老儒先生丘墓􅀁在匍匐載拜奉牲酒薦享如弟子北面事其師然􅂲後荒榛莾蒼間㫁刻􅀅仆相與赱其下藉草跪誦三復欷歔不􅀎休至有感慨泣下者日且暮各上馬歸明日相見猶歎慕不􅂺口好事者形扵詠􅁔得詩若干首属基為之序夷白齋藁卷之二十一
