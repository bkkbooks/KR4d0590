front:
  text: 夷白齋藁卷之二十八
  hash: sha256:e58b1549f90c8568e849e6d70adbcd16ba8f8a2dccfd3431364785cda64766b8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_028-1a}
body:
  text: 臨海陳基著金華戴良編記聴雪齋記西夏鄔宻公寓第在吳門天宫里其東偏有屋六楹樸而不陋公即南榮為小齋西為壁北為户䟽其東南以楮承之中無長物左右琴書晏如也􅀊方冬公端居肅容虚心無為與造物者㳺俄聞中庭桂樹間索索然有聲􅁸而視之則積雪在地皜然矣公囙援琴鼓之客有􅀱公扵門者公揖使坐且謂之曰客亦知好此乎客曰僕東海之鄙人也何􅁕以知之雖然公􅀁鼓白雪之曲也僕不敏請為公和之客逡巡􅈬席囙謌曰白雪􅀆交下羙人􅀆獨䖏􅀊晏􅀆何􅀁娛撫陽春􅀆容與陽春􅀆遟遲白雪􅀆飛飛彼羙人􅀆勞我思巾余車􅀆往􅀙之端余居􅀆正余􅁭若有聞􅀆青桂林桂􅀣􅀆後凋撫白雪􅀆逍遥時至正十四年十二月也風林亭記延􅁜徐君元度􅁸家儒林為時名卿擢司農為都事身顯而家益貧其嗣子仲剛勉焉􅀎以幹蠱克家自奮田疇之荒者治之室屋之敗者葺之問又属余為文以記其無􅃬里苐之風林亭余不得辞也無􅃬為州在東南山水間物崖之夥最扵他壌百里之内第宅園池甲乙相望譬諸木焉斧斤弗侵而牛羊之牧罕至深仁厚澤休養生息扵承平之曰乆矣及貪冐之蠹􅎯扵中掊刻之􅖈攻扵外加以武断之斧斤蹂以椎剽之牛羊而百年之植夲深而末茂者殆􅀅翦而棄之卒未知􅀁以扶持之者斯亭也都事君之􅀁釣逰而其風林之薈蔚水木之清華則􅀁謂異時承平之植也都事君以官為家出入中外垂二十年其間田園第宅百里相望庻㡬萬一不鞠為斧斤牛羊之墟者㡬何人㢤都事君以此計彼孰得孰失固巳較然不置毫􅄠芥蔕於胸臆間矣庸詎知貴介子弟有􅀎卓然自振不與流俗淪胥扵委靡之中治田葺屋式克負荷而其餘力又􅁕以洒掃園池以待都事君之老如仲剛者乎昔唐􅅊應物百世之士也入則應制叅扈􅀙出則􅀭節為刺史秩比漢二千石亦可謂顯矣然毎休沭㦯不知􅀁扵歸退與諸生假寓僧廬單衾陶器悠然自􅃴而􅀁謂共愛風滿林云者乃其居善福精舎時詩語也今都事君為天子職文書賛大農䓁而上之則於韋侯也何有異日倦逰請老觧章綬還朝廷角巾南邁旦暮􅀙賔客子弟􅄃清風扵家林觀生意之流動而承平百年休養生息之僅存扵牛羊斧斤之餘者某丘某水尚􅄑無恙此則君之􅀁有而韋侯之􅀁無也余雖未􅀗登斯亭然嘗辱與都事君逰既喜君之有子又慶其􅀅有以歸老也故為之記使刻之亭中以伺焉皥皥齋記余友陳季周氏嘗謂余曰吾生扵泰伯仲雍之郷而讀周公孔子騶孟氏之書盖士之為學亦貴王賤覇而已囙自題其􅀁居之齋曰皥皥齋旌吾志也子􅄑為吾記之昔者泰伯仲雍適吳吴民義而􅀙之斯民也盖殺之而不怨利之而不庸日遷善而不知為之之民也及文武成康之徳洽乎四海周公孔子之教後先􅁇作而吳之君子至有北學扵中􅀦而得聖人之一體者余嘗浮三江道五湖登夫􅎛望洞庭訪三譲之祠弔虞山之墓意畔田鑿井擊壤而䛴帝力者盖猶有先王之遺民焉嘗試問之而未之見也今蓽門圭竇唅菽緼絮之民乃有絃謌周公詠歎孔子充然若有􅀁得而不知其􅀁以然而然如季周者斯非遺民之俊秀者乎余乃今失之扵彼而得之扵此矣盖君子􅀁過者神上下與天地同流故舜畊歴山而田者譲畔陶河濵而器不苦窳孔子之立之斯立道之斯行綏之斯来動之斯和皆莫知􅀁以為之者也吳為泰伯端委治禮之􅀦則其􅀁過而化􅀁存而神者冝何如㦲噫孔子旣没百有餘􅀊而騶孟氏作貴王賤覇之學幸而復明不幸而不得致齊梁之君為湯武變驩虞之民為皥皥然百世之下有志之士讀其書而論其世者尚知舎驩虞而趨皥皥則其過化存神之見扵詞氣間者不徒為空言而已矣方今聖神在上堯父舜子而周孔其臣舉一世而甄陶之而詩書六藝之化彬彬也季周以泰伯仲雍遺民之秀讀周公之書誦孔子之言而學騶孟氏之學豈直以其皥皥者自得而已亦􅀅褒然舉首思以貴王賤覇之􅀃獻之天子而與斯民同皥皥也此騶孟氏憂世之心而有志之士􅀁冝勉焉者故為之記使書于齋之壁以為季周告云種徳堂記君子之種徳猶農夫之種榖視地肥磽而糞之時其蚤晚而藝耨之凡豐草稂莠螟􅏑賊蝝之為苗害者必謹耰耡錢鏄祈禳而務去之人徒見其秋而穫冬而蔵養老而長㓜渇飲而飢食生生而不匱而不知其終􅀊之勤曽不以水旱凶菑而輟其来耜也故曰居一􅀊種之以榖十􅀊樹之以木百􅀊来之以徳盖人非榖無以為食非木無以備器用非徳無以遺子孫故種徳非君子不􅀎而君子有貴有賤有顯有隐其跡雖不同而其􅀁以遺子孫則一而巳􅀄世祖皇帝以好生之徳涵煦六合時則用帷幄儒臣而㕘以黄帝雷公之術施鑱石鍼刺以濟人之夭死天下􅃅為神人者故内翰廣平竇文正公其人也㳺其門者曰金華王鏡潭氏小心謹畏十有六年而始得傳其術及其倦逰歸江南銳意以活人為事囙即蘭臯舊隐扁其堂曰種徳雖浮湛里閈不事造請然人以疾求之者日衆間近之旁郡㦯逺則過浙水西户外之屨􅀁至輒無􅀁容竇氏之學遂大行東南不問貴賤皆曰王鏡潭今之竇公也盖鏡潭之業既精而䖏心􅀹不苟惟精也故􅀎活人惟不苟也故以徳自許余雖不及識鏡潭幸嘗辱與其子珎􅀦瑞逰見其按滎腧辨脉絡引鍼􅌊艾以療人之疾往往萎者􅁸僂者伸噢咻呻吟者更􅇚焉以㤗猶農之茀豊草薙稂莠祛蟊賊除螣蝝而嘉榖之頴者實堅者好焉然後知鏡潭之後有人而竇氏之傳未艾也且竇公以術而顯鏡潭以術而隐其活人雖巳衆然身不都好爵口不享厚禄出不乗髙車居不御華卷其􅀁以遺子孫者安在君子曰厚施而不食其報必有興者嗚呼王氏其可量㢤􅀦瑞俾余爲之記乃推夲其先世之􅀁以遺子孫者􅂧之詩云子子孫孫勿替引之敢申以爲􅀦瑞告云同樂堂記吳􅁜謝侯􅀙義由檇李移守錢塘假老氏開元宫東偏之廬以寓焉且題其顔曰同樂堂徴余文以記之昔者孟子囙齊宣王之好樂謂樂無古今之殊而民則有欣戚之異者由與民同樂不同樂故也余則以為孟子之言不獨謂樂也謂凡踵行喙息之民莫不皆有飲食男女聲色之欲使為之上者皆􅀎與之同焉則民亦􅀅以其􅀁欲同扵上矣苟顓一己之奉而視民之休戚不啻如越人視秦人之􅏂瘠則亦􅀅以秦越人視其上此三代之民􅀁以至􅀾􅀦時不以三代之君親其上者由其不以三代之民畜其下也三代而降南靣之君慨然知誦孟子之遺書務懲􅀾􅀦之覆轍而􅁒以三代之民畜其民者漢宣帝其君也其言曰庻民􅀁以安其田里而無歎息愁恨之心政平訟理也與我共此者其惟良二千石乎嗚呼民無歎息愁恨之心則樂矣然亦非必寒而衣之飢而食之勞而佚之也亦平其政使遂其性理其訟勿戾其生而止爾苟政之不平訟之不理則民不堪命雖日奏韶濩而舞干羽適􅁕以滋其疾首而蹙頞尔尚何同樂之有㢤漢宣承武帝之後海内虚耗獨􅀎先民之憂後巳之奉謂守令為吏民之夲囙乆任而責成之卒用是以致中興之盛焉然當是時􅃅􅁛良吏如朱邑龔遂之流􅀁謂與帝共此者也亦不過躬行儉約使民安土樂業而已今天下兵興生民罷􅁦其閔閔焉望治之心猶農夫之望􅀊也錢塘為東南一都㑹由吳越錢氏及宋三百年以至􅀦家混一以来休養生息非一朝夕其屋邑市井之蕃珠玉綺繍之冨侯固不得而見之矣而資梁屝􅋰兵械什器百物之需則未有甚扵斯時者也侯寅而入酉而歸食不暇甘扵其口寝不遑安扵其席亦可謂勤且疩矣然上也日以漢宣之業望其君下也不敢以秦越之人視其民而中也則諰諰焉以昔之良吏責其身使左而右之張而翕之勿替而引之則政平訟理其效可變歎息為謳謌易愁恨為鼓舞亦在扵上之人責成何如爾夫使中興之業不顓扵漢良吏之盛無愧扵朱邑龔遂之流未必不由生民樂業致也侯尚勉乎㢤囙為記其名堂之義使凡㳺扵斯讌扵斯者知侯之志盖有在云侯刻躬儉約忠厚信讓盖詩之􅀁謂豈弟君子也至正二十年夏五月戊子臨海陳基記夷白齋藁卷之二十八
