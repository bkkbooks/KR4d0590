front:
  text: 夷白齋藁卷之九
  hash: sha256:9b369fab7ff94954095f367b54141d846e6b7718d5625fd070bfaf4c676fa242
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_009-1a}
body:
  text: 臨海陳基著金華戴良編律詩七言次韻髙元善􅀰中見􅀉律詩二首憶昔同叅㕐鶩群每􅀅騷雅佐人文詩成嶰谷鳴風竹琴罷瀟湘夢水雲南浦􅄐情波浩渺北山歸思日紛紜可憐滿地秋如錦只有黄花好􅀉君詩酒相􅀙􅀊已賖幽居人擬地仙家別来九陌風塵外望㫁五湖􅃄水涯書􅈬蜀牋文勝錦宴歸漢署㡌簮花它年􅂉遂投竿志著我穐江􅀝釣槎元善甞俾余記其􅀁居松雲巢􅁇辱以詩為謝囙次韵荅之蕭蕭素􅄠魯東家豈有文章競綵霞髙世羡君期太白寓言容我詫南華神栖五老仙為侣夢繞三珠玉作葩為問松雲在何許此中非近亦非賖舟中讀漢武帝紀髙皇馬上争天下丞相飬民方致賢帝業不曽階尺土兒孫何以筭緡錢長生始誤神僊術巫蠱終虧父子天可惜春秋二三筞獨㽞􅀛鑑後人􅀓次韵葉徳新江上􅀚兵一水朝宗控百川著鞭此日許誰先手麾貔虎風生海膽落鯨鯢劒􅀝天潮汐怒随龍變化雲山髙作鳯飛騫元戎一鼓収南服持奉吾君億萬年三塔寺江湖四月半隂雨山寺今朝方喜晴杖􅃬入城非避客琅玕繞屋正啼鸎寳樹著花當座落蒼龍分水入厨清為㽞一榻雲深䖏共話三生石上盟過夲􅁴寺懐欲了庵長老三過堂前􅀊屢過阿師行道近如何僧中此日如公少方外向来名軰多一室寳􅃄飄艾納六時花雨落芬陀寺門晝掩如廷尉滿地松隂覆雀羅􅀉頋髙士每憶吳門頋辟彊舊開池舘帶滄浪緑波芳草盟鷗鷺錦瑟玉笙悲鳯凰座客詩成誰最好故人酒後我多狂扁舟来往鵷湖上老倒猶䏻賦草堂􅀉鄭明徳牢落乾坤獨鄭䖍丘園風雨故依然腹蔵元晏書千卷身受滕君宅一􅌀雲卧蝶迷遺世夢林居鶴避煮茶􅃄楊雄自昔多竒字老我猶乗載酒船過三塔湾㽞題緑水灣頭維􅀞舫白雲堆裏訪禪林上方樓閣丹青古下界蛟龍窟宅深五月鸎聲山􅄫􅄫一簾雨氣竹森森地靈不受昆眀刼㽞得長松捴十尋再用韵荅鄭先生錬石無心􅀘漏天幽栖環堵獨蕭然松蘿雨後生朝菌藜藿年深沒故􅌀􅁕濯滄浪池上水衣薫豕蝨竇中􅃄林居似厭城南淺重擬歸乗谷口船用韵荅沈仲説結客東吴憶盛年多君燕䖏毎超然千金昔棄朱公産一畞今無許子􅌀濯􅁕洞庭天拍水掛帆笠澤栁含烟相逢一咲榮枯外猶勝虚乗訪戴􅂳􅀉錢成夫貟外千里􅀙軍客䠂州故人吴下獨維舟関山别後郷書少淮海平来相業優龍虎帳中勞逺望鳯凰池上莫多㽞平生愛殺韓司馬老我何妨譲一頭􅀉蔡彦文都事蔡子才多病亦多尺書千里慰蹉跎同逰蹔阻紅蓮幕相􅀉慚無􅂵玉珂交義人人推管􅇹新詩字字擬隂何淮南賔客如君少未許淹㽞桂樹謌九日百年鼎鼎成何事九日匆匆不在家莫遣秋風吹短㡌羞􅀅白􅄠對黄花詩囙排悶􅂓時賦酒為銷愁尔謾賖欲向䠂城髙䖏望不堪離思滿天涯九日簡同幕諸公兼􅀉吳中兄弟官舎蕭條淮水濵一樽九日謾相親那知黄菊籬􅁁客不咲􅂵薇花下人秋􅁂白嗔烏㡌側衰顔紅愛緑醅新中吳兄弟應相憶悵􅀝秋風北望頻阻風仲舉舟中小酌千里旌旗暎日紅一天秋雨忽􅄥濛郷書未有東南信客路不堪西北風泛水芙蓉依繡幕背人鴻㕐避雕弓淮南酒薄猶堪飲時􅂧相􅀙共一中墻角種菊三四夲頗可􅀚一官迢逓客天涯頗􅁴穐来興味佳有菊便同陶令宅無錢誰咲杜􅁜家幽叢宻護霜前葉嫰蘂􅁿含雨後花頼有新詩相料理淮南酒薄不堪賖淮隂雜詩五首千里相逢淮海濵一枝誰􅀉嶺梅春老来易感山陽笛年少休􅁿跨下人失侣㕐如秦逐客畏寒花似䠂遺民每過百􅀾瘡痍地立馬西風為損神疋馬淮隂秋􅂧冬每尋陳跡不匆匆下郷賔客貧無行南郭先生老病聾漢室㓛髙羞絳灌射陽門貴擬騫弓至今七尺城東墓一酌寒泉感慨中落木蕭蕭鴈度河西風嫋嫋水増波甘羅營裏秋聲急韓信城頭月色多淮市有魚􅂓可食䠂山無桂不湏謌古今無限関心事付與當年春夢婆江左妖氛掃未清山東􅉘虎又縦横欲令斥堠収烽火湏挽天河洗甲兵老馬獨嘶時北望賔鴻相喚盡南征腐儒媿乏匡時術搔首風前百感生兵火燒殘百草根人􅃄無􅂧萬家村黄金莫鑄忠臣骨白馬空招帝子䰟易水有情人巳逝睢陽無援事難論何當親斬樓蘭首仗莭歸朝報至尊􅀉吴中分幕諸同志故人入幕蘇臺上老我􅀙軍䠂澤隈江海十年同聽雨関山千里獨持杯􅁁書到日多慿鴈驛使来時好􅀉梅慙愧􅂵􅅔花畔侣却依南斗望三台寒菊遍開可喜謾向隣翁覔菊栽晚花踈蘂一時開寒欺䠂澤三秋露暖透山陽十月雷多事狂蜂忙采去惱人􅁿蝶競飛来蕭齋對此渾無頼莫怪頻傾濁酒杯􅀉唐伯剛㫁事官寒菊花開照眼新客窓風物未全貧旋賖陶令樽中酒敢比羲皇世上人官事有程仍咲傲郷書無便任囙循故人十月錢塘路誰謂城西探小春􅀉陳庶子叅軍兼簡饒介之􅀰中䠂天漠漠水迢迢千里懐人不自􅂓帷幄喜聞延曲􅊇行間􅀼恭事嫖姚江空不采芙蓉􅀉􅀊暮唯謌桂樹招華盖仙翁如見問為言髀肉近都銷􅀉謝􅀙義叅軍兼簡唐伯剛㫁事江左風流謝使君賦詩渾似􅇹叅軍一麾舊作錢塘守萬里新空冀北群官栁枝枝垂䠂岸賔鴻箇箇入吳雲題書為報西樞彦十月山陽尚有蚊􅀉周信夫王􅅩眀二長史帷幄賢勞夙夜賔古今儒律兩彬彬漢庭重厚唯斯老江左寜馨尚㡬人霜落吳門天接水雷鳴䠂澤雨連旬黄梁酒熟淮魚白南􅀦穐風不愛􅐜􅀉錢伯行檢校葉徳新􅁺史少日錢君同汗漫中年葉􅁺共翶翔北窓坐傲羲皇世南省行陪漢署􅀰笠澤芙蓉秋萬頃䠂天鴻鴈日千行㓜輿若許歸巖壑便結茅齋野水􅅖􅀉沈逹卿陳子方二理問二妙相看如弟兄白鷗波上忝同盟老来轉􅁴􅁭期好别後令人鄙吝生萬里􅆛貅方北戍九秋鴻鴈盡南征洞庭橘熟香醪嫰心渇應憐阮􅇍兵和周太常􅀉貢祕卿詩五首兩翁臺閣廽翔日千載文章全盛時太史世家羣彦服中􅀰筆法九重知西清近識天顔喜南海遥分漢節持􅀴幄論思深有待未容采藥訪安期二老故郷江漢東两家文獻夙相同吴関望􅊴聮歸轡閩海勤王謝轉蓬禮秩漢郊脩雍畤道宗魯􅀦仰亀􅀩共􅀅千古文章印力障狂瀾洗陋風世路閒関嘆百離斯文誰與挈綱維近聞東觀除書下未􅁴南冠寵數卑政􅀝􅅩孫興禮譲終知汲黯繫安危漢廷獻納湏公䓁一代儀刑奕世垂詞源變化共神謀一洗人間蚍與蜉老来頗厭干戈盛此去㝎分宵旰憂舘閣􅀴􅀓劉向業関河人望李膺舟白首自慚無寸􅀘謾随行伍事防秋平生筆諌栁公權鶴􅄠還朝各皓然榱桷棟梁収􅂲後麒麟鸞鳯覩争先太常議禮推王肅金匱紬書待馬遷慚愧當年秦逐客只慿魂夢到鈞天夷白齋藳卷之九
