front:
  text: 夷白齋卷之二十
  hash: sha256:324527c85a2fdcd8486b31c446f8b994b6d1f9be7e324fe95061cd75aeadfcd8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_020-1a}
body:
  text: 臨海陳基著金華戴良編序陳惟寅字序豫章陳氏二丈夫子奉母夫人居呉門貧而善飬曰汝秩字惟寅者其長也間謂余曰吾名與字夲乎虞書命伯夷作䄮宗之言盖寅者敬也子􅄑為吾序之昔唐虞君臣告戒之際反覆丁寧不越乎敬而已方其命九官也有司空而降凡二十有二人其言敬者不一而􅁕然至扵䄮宗則先之以夙夜惟寅申之以直㢤惟清終之以欽㢤此三言者雖若專為伯夷而彂然推而言之則自洒掃應對至扵窮理正心由修身齊家逹扵治􅀦平天下未有不以敬為夲者也􅀴禮三百曲禮三千一言以蔽之曰母不敬故居則如對越上帝出則如見大賔坐則如尸立則如齋行則如執玉如奉盈無時而不敬也近之事親逺之事君内之扵兄弟外之扵交友入之扵州里岀之扵蠻貊舎則善其身用則顯其親無事而不敬也盖敬以直内則清明在躬伯夷以之交神明禹以之宅百揆后稷以之播百榖契以之敷五教臯陶以之明五刑䕫以之諧八音以至扵垂扵益扵龍莫不皆然故曰敬也者君子􅀁以成始成終也彼受玉不敬晋侯之􅀁以無後執幣不敬若敖氏之􅀁以滅􅀅事不敬郤氏之􅀁以亡受脤不敬成子之􅀁以不反嗚呼敬㢤不可不務也惟寅年甚富行甚方植志而不囬強學而有文扵其字非直羙􅁛謂而已盖􅀅奉以周旋焉故余申其義以告之詩云夙夜匪􅈈惟寅其尚懋㦲瞻雲軒詩序吳郡金伯祥氏家故士族而好施予其以善士􅁛扵郷沒而葬吴江乆詠郷之韓墅者伯祥之先君子也其改􅁙吳縣横山之吳巷村内翰金華先生黃公實志其墓焉伯祥居松江笠澤間力田教子益務以善世其家家去韓墅財數百武然水淺土薄四顧皆陂田塗潦沮汝㵕溢耒耜之涂牛羊之􅈳又出沒旁午在五患之􅀁必遷者也横山在太湖上與郡西南衆山相旁礡距笠澤不下七十里然土益厚水益深草木益豊茂盖樂丘也伯祥始不忍委其親扵五患之區遷而得善地終舎近􅈬逺又非其􅀁得已者毎􅀊時上塜㗸哀茹恤踐霜露撫松梓輒徘􅆦不忍去嗟乎人子之扵親􅀁謂不􅀎自已者盖至此而後見焉既結廬墓旁以備風雨又即其南榮為軒曰瞻雲是雲也即狄公登太行而望河陽之雲也河陽之雲親之􅀁舎橫山之雲親之􅀁蔵古今殊時存沒異感然雲之􅀁在親之􅀁在也親之􅀁在雖亡猶存雖古猶今也彼觸石而􅁸膚寸而合不崇朝而雨扵天下無它亦和氣之􅀁積爾和氣之積在天為慶雲為甘雨在人為忠臣為孝子唐有狄公猶天之有元氣也金氏世積善曽大父甞舉進士金華先生曰引而勿替必有興者然則覧是軒而賦詩者豈直山川草木一泉一石之勝而巳㦲力田􅁕以􅇷飬教子􅁕以厚本積之也乆彂之也漸先生之言其尚有徴乎詩凡若干首為之序者韋􅆧山人陳基也送浦朝宗序余甞讀太史公書見其傳仲尼弟子獨子㳺為吳人盖泰伯仲雍未􅏉吴時吳為古要荒之地其俗盖可知矣及泰伯端委弁冕而以禮治之其後延􅁜季子又承其流風譲􅀦春秋時觀其聘魯而聞樂審賢而知政魯衛齊晉之大夫盖未有􅂉之先者降至子㳺北逰洙泗比肩七十子之徒北面以事孔子而與卜子夏同以文學得聖人之一軆則吳之多士其􅀁由来者乆矣吾聞之學莫乎近其人子㳺已矣其嘉言善行見扵聖門師友之問荅千世之下四海之内凡讀其書者皆知有􅀁興􅁸况生乎其郷者乎况弦謌其文學以教其子弟者乎此浦君朝宗之行君子􅀁以樂為之道也夫子㳺之文學非今之􅀁謂文學也朝宗盖嘗觀其論子貢之門人而求其夲之則無之􅈲矣夲者何聖賢大學之道􅀁謂正心脩身推而至扵治􅀦平天下者也子㳺之郷實惟海虞仲雍之墓在焉朝宗今受文學精舎之聘率其子弟出則􅀙仲雍之遺民入則誦孔氏之遺書而觀其師友之問荅先其小者近者而其大者逺者弗外焉則子㳺之文學其庶㡬乎書曰惟斆學半朝宗其勉之南䑓御史大夫西夏永年公勲徳詩序集慶古秣􅁜之地控扼險阻外連江淮内據湖海自昔三光五嶽之氣瓜分幅裂而􅀴營四方者未甞不恃此以為根夲􅀦家奄有六合方嶽􅀁在維藩維翰而集慶尤為要㑹之地扵是建行䑓置執法由御史大夫而下設官眂中䑓控制三省綱紀十道責至重也自江淮盗􅁸兵連不觧資糧器械軍旅百需悉仰東南而東南􅀁頼以為長城之􅀔者行䑓爾行䑓之􅀁􅀝藉如衣之有領􅁇之有綱者御史大夫爾用是今江南䓁䖏行御史大夫西夏永年公由淮南行中書平章蕳在上􅂨特膺是命時至正十五年夏四月也甫下車凡前政之不便扵民者悉更張之六月淮西㓂渡江攻䧟太平縦兵四劫潜趣集慶攻南門属方盛暑官無見糧公晝夜申嚴約束躬擐甲胄冐矢石誓戮力與城始終賊因逡廵蹙縮相率引去秋七月賊復至又敗之九月賊大至圍城四面凡七日公身先士卒出萬死不頋一生且􅀾且守賊鋒大剉先是淮西義兵元帥陳也先率其徒渡江屯集慶城南之板橋行䑓用言者計命也先與官軍並征太平已而我師失利也先䧟賊賊質其妻子使爲先鋒務必􅂑集慶也先素服公威信輸密欵願擒首賊以自効衆皆疑其詐公獨决聴之無惑下俾官軍與也先表裏合攻遂生擒偽元帥郭張二人及其餘偽官甚衆殺死者無􅄸因乗勝逐北皷行趣太平且旦暮克復而也先爲郷兵誤殺舉軍痛惜之公命訪其屍收􅁙且錄其子弟贍其徒衆士氣復大振公沈黙寡言寛厚有器識度量􅅸人年十五六時出入帷幄輒負公輔之望二十有三出長饒州路恵政大著民至今頌之不衰􅆒厯䑓省出臨方面遇大事决大謀雍容片言無不厭服其在行䑓風厲各道屏除姦慝廪廪大人君子之風每軍中獻捷必面引俘囚詳錄之無状者戮詿誤者縦之使復業民頼以全活者不可勝計嗚呼􅀦家承平無事時公卿大臣無事可見一旦亡命之徒盗弄庫兵掩我不􅇱􅀁至披靡而公以元勲世胄獨當東南一面紀綱之􅀉蜂蟻小醜乗釁窺伺而􅀎先之以威信申之以持重隐然長城之􅀔自若也使秉􅀦之鈞端捴庶政􅀁謂垂紳正笏不動聲氣而措天下扵泰山之安盖入則周公召公出則方􅅩名虎非公其誰與歸東南大夫士嗟嘆不􅁕而詠謌之者在公特一事爾然舉一事而公􅀴國大略可以類見此詩之􅀁以作也詩不可以無序扵是乎書至正十五年十二月甲子謹序丁仲徳歸飬序吴郡丁仲徳氏以儒術緣飾吏事甞㳺崐山幕府尋給事􅈇䑓属僚之香糯􅀁雖浮湛簿書而􅀎随事委曲機括轉旋如駿馬在前􅁿車在後而王良造父為之左右焉甞因􅈇事至集慶龍灣鎮江寧􅀦嘉興諸郡咸為文以旌其􅀎用是合􅈇臺官属既益賢仲徳且争欲食之以禄任之以事而仲徳辞弗􅈬㦯問之仲徳曰吾母老矣使舎朝夕之飬以􅀙公卿大夫求升斗之禄頋不􅁕以為吾親一日之膳耶夫禄者聖世􅀁以食賢材非徒以飬人之有親者也今吾賢不如古人材不如今人而徒幸有老母苟焉不頋義而􅈬之夫食人之食當事人之事苟食矣而㦯怠焉親之食其􅀅吐之乎此吾之􅀁以安吾菽水之飬飬雖薄不猶愈扵吐之者乎君子聞之莫不多仲徳之善飬而􅀎言者皆喜為之賦詩吾聞猗頓之冨侯王莫尚也至扵飬則不如曽子焉季子之禄動以萬鍾曽子委而弗頋然後世未有以無禄議曽子者君子之飬苟以禄則五鼎之味厚扵菽水曽氏之子其􅀙季氏乆矣仲徳結􅄠㳺州縣出入􅈇䑓又􅄑有知已欲食之以禄常人之情孰不藉此以為父母驩仲徳獨計不出此而􅀼􅀼然以材不及為觧盖仲徳之飬不在禄頋母志何如尔以志飬志此猗頓之􅀁以不及曽子也世盖有善學枊下恵者丁氏之子其殆庶㡬乎詩凡若干首繫于左夷白齋藁卷之二十
