front:
  text: 夷白齋藁卷之八
  hash: sha256:7c4d666215e4d8db021d9f96c9fe8b1c420af19f83fe658ca49ab1d3f59c2e4c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_008-1a}
body:
  text: 臨海陳基著金華戴良編律詩七言次韵鄭有道喜王季野府判南歸二首故人日下拜官歸河水南来佀帶圍筞馬逺㳺天府勝食魚偏愛錦江􅏂􅅙叢故􅀦山猶在望帝荒祠鳥自飛萬里欲􅀅慈母線芙蓉城裏製春衣海榴花放客南歸喬木叅雲揔十圍緑蟻奉親浮臘味黄羊充饌割秋􅏂㤙承閩􅀦榮三釡心切灤都望六飛錦里它年湏報政中天風露􅊜朝衣次韵伯行投贈存齋風捲浮雲雨㓕埃栁隂池舘白蓮開放舟有客尋源至問字何人載酒来剡曲願􅀙安道隐茂􅁜空歎長卿才角巾􅀊晚東林下短策逍遙􅇍􅂵苔三用韵喜季野歸手􅄃繁弱接忘歸燕山射獵雪打圍駞鳴關口曉風急馬牧原頭春草􅏂郷􅀣喜瞻親舎近蜀人争􅀱使皇飛慷慨平生王子贛􅁬身叱馭肯沾衣􅀉季野積雨東臯如早秋公子不来令我愁題詩每憶許玄度賣藥敢期韓伯休栁隂繫䌫水數尺竹裏讀書風滿樓長夏林塘何􅀁佀浣花溪上瀼西頭次韵劉徳方􅀴歴綺席無塵宴景光佳人宫様學時粧座􅀓白雪髙難和澗采香芹净可湘綠水紅蓮新􅈇幕􅂵薇青􅃈舊朝郎鳯凰城裏曽聮􅀐一路看花到上陽送徐勉之慈湖書院山長兩度秋風刷羽儀一官江海尚棲遲簿書舊屈諸侯􅁺􅀴術今為學者師天上文章囬北斗人間聲教極東夷慇懃束帶􅅩堂日􅅸學慿􅀅已易推送錢士􅀎建昌知州建昌使君􅀎且賢青春結客五雲􅁁致身得近二千石事主巳垂三十年天削匡廬開菡蓞月明彭蠡浸婵娟行春䖏䖏花如錦􅃭袴謌中􅍋管弦送王夀翁歸閩十日􅁿飈送海舟七閩南去近東甌掉頭欲學孔巢父飬子不慚陳太丘蠣房石暖随時采崖􅁡風酣帶露収故園歸老平生願殊勝官封萬户侯次韵荅秦文仲二首艤舟復向三江口載酒欣逢二仲来丘園束帛已加璧􅀅相求賢無棄才栁色緑欺頭上雪桃花紅映掌中杯也應别後無知已􅀙此柴門不浪開婁江繋䌫巳十日故舊獨逢秦與文氣壓元龍餘子服賦髙司馬九重聞西山拄笏􅂓容我東閤招賢欲待君觧却金貂換官酒賞花時節正春分婁江雜詩二首􅀞鷁東来肅斾旌郊原十日喜春晴彎弓看堕雲边翮􅀐馬同登海上城欲向草莱詢隐徳每囙稼穡見民情自慚肉食還無􅀘慟哭空悲漢賈生百雉堅城鎮海頭霜風中夜肅貔貅乾坤浩蕩鯨波息井邑蒼茫蜃氣浮民瘼東来皆可念妖氛西望未全収􅀅軍莫負黄金印一鼓歸封萬户侯與文學古秦文仲逰至正􅀚西郭維舟水滿津􅀙容鄭圃得尋真蓬莱路隔人間世桃李花開刼後春風雨􅂉聞蛟杼響弦謌曽與草堂隣交㳺不沗羊求軰􅀊晚相期跡未泯次韵荅秦文仲郭羲仲聮句見寄客路尋常江海上春光強半雨聲中習池無酒醉山簡蓮社有心期逺公香燼旋温婆律火茶􅃄􅁿颺石楠風不囙二仲聯詩至安得􅀙容一咲同次韵錢都事誠夫海上書事左掖􅀰官漢客卿樓船頻􅍱海濤平夢􅀐鸞鵠三山近膽落鯨鯢一劒横南斗星移天使下東吳兵振島夷驚湏君早决平妖筞仗節歸朝奉聖明送誠夫使吳門􅇂􅈇事蒹􅀉分院同幕諸公掛帆南斗略扶桒奉使寕辞道路長轉􅈇􅂧輸滄海粟勤王争羡􅂵藢􅀰風生漢節蛟龍避花繞吴宫雨露香同幕故人如見問為言相憶􅁂毛蒼春日邵氏園池􅄫寞園林帶夕暉昔年曽此戀芳菲栁塘水暖鴛鴦浴花􅈳風酣蛱蝶飛蔓草拂衣人不翦􅀞梁無主燕空歸洛陽池舘関興􅆸我欲春山賦采薇送胡宣使赴都進表使者樓船上九天鯨波不動一㠶懸表章入奏三千里海宇中興億萬年夏后山川仍職貢漢家勲業重安􅁁遥知此去多㤙澤㡌壓宫花􅃬讌還送髙􅁸文歸越兼簡陳伯昻王彦強昔年同客百花洲繡幕朱簾暎綺樓􅀊月㡬何成契闊兵戈相見獨綢繆開樽坐對呉山雨掛席行歸禹穴秋最憶吾宗陳伯子咲談真有晋風流甫里祠前憶舊盟朝湌把菊暮􅐜􅅅忘形直到􅁑天氏共飲况有申屠生古来結交貴知已亂後離别難為情西風又鼓濤江柂王衍為君􅀟眼明􅀉楊文舉􅀴歴㑹稽􅀙事獨逶迤拄笏西山秀入眉欲振家聲遵伯􅁸不􅀅文法泥宗師風塵此日淹騏􅂹霄漢它年見羽儀一曲桓伊江上笛夜深應有老龍知􅀉頋仲贅為問平生頋文學離居近日􅂧如何秋髙禹穴䆠情薄雨過越山詩興多乆客念君髭未白􅀙君老我􅁂先皤鑑湖一曲元無恙􅀊晚相期載酒過次韵謝捴管送梅州判還崑山􅀞船檛鼓待潮囬山色㽞人不受催官酒醉淹羅䄂􅊜離筵愁聽竹枝哀秋風老憶淮南桂暑雨晴収海上埃莫學君家子真叟變稱名姓不歸来次韵謝侯􅀉梅州判昔日吾宗陳太丘為言梅福政偏優陳都事元禮嘗權知崑山州事魚塩争集海市曉鷄犬不驚田社秋奕世羡君仍吏隠一㕓老我欲歸休裁書更謝錢塘守佳句難􅀅雜佩酬次韵謝侯書懐使君五馬早承㤙􅃭袴聲􅀓逺近村可為長生居鄭圃每囙清嘯過蘇門香凝燕􅆍秋􅀅肅露浥銀床井不渾同樂堂中賔客盛旋烹新茗當開尊十一月晦與同幕諸公登南髙峯囙過湖上小集二首共上南屏第一層海風吹􅁂雪鬅鬙山盤地脉来天目城􅈽江流佀蔣􅁜近郭晝行多畏􅍑並湖寒盡未収冰􅀝闌閑􅀃承平事知是昆明刼外僧落日湖頭艤􅀞船買魚沽酒不論錢共過天下登臨地却憶􅀦家全盛年縁水暎霞紅勝錦逺山凝黛􅌿如􅃄相携此夕干戈際一聽笙謌一慨然正月五日省院諸公飲呉南城每囙公事少􅀙容今日􅀓杯興頗濃飲散城南催畫鷁夢囬江上聽踈鐘長風萬里飄歸鴈疊浪千層駭蛰龍同幕故人期不至曉山囬首欝巃嵸泊舟垂虹橋訪南北兩山寺候蔡都事彦文泰伯城中不少㽞垂虹橋畔却維舟佛灯下照蛟龍宅蓮社平分㕐鶩洲王事有程塵没馬僧心無垢月􅆂秋多情為待同袍者遍􅀝䦨干不下樓次韵彦文􅀉謝省院諸公二首西山雪後色愈妍拄笏相看每自憐豈有異才叅廟略謾陪時俊列賔筵玉笙錦瑟㽞人醉翠葉銀花壓㡌偏却咲當年潘􅀐省為誰􅀟鬢早皤然此日東吳接勝逰風流欲與古人儔城南官酒春􅀄熟湖上魚罾晚未収才媿機雲還入洛切髙絳灌重安劉謀叅帷幄輸公軰巢父歸歟盍掉頭次韻孟天偉􅀰中看潮十首海上初看一線低湏􅁷排突與山齊平吞百粤天為塹雄障全吴石作堤浩浩鯨波流佀帶紛紛蝸角闘如鷄世間别有風濤險莫向平途信杖藜天風吹海恣崩奔一擲坤維势欲翻正尓断鼇安地軸可容持鼓過雷門驚濤怒激英靈氣斜日潜銷壮士䰟却咲故都閑士女治逰歸去近黄昏江源来自歙山幽潮势慿􅁜江上頭􅂵盖黄旗収王氣素車白馬踏清秋至今故老猶興慨自古忠臣不自謀渺􅄅雲􅁁􅀌鳥沒豈知人世有㤙讎八月十八怒潮生猛扵突􅀐白於繒風掀雲島神龍化雷吼天門赤鯉騰樓船入海仙難問䲭革浮江史可徴􅀭旗勇踏濤頭去除却吴児世不䏻千古英雄恨未銷海風吹上浙江潮怒驅􅆛􅍑誰􅀎敵雄壓鯤鯢不敢驕􅂿浪掀旗空逺迓臨流􅂢􅃑若為招扁舟浩蕩身先退輸與陶漁共采樵雪湧潮頭萬疊多秋風奰贔吼靈鼉直疑碧海金鼇擲􅂧􅂲隂山銕􅀐過勾踐㓛名今􅄫寞麻姑消息近如何慿君更闡神明力翻却蓬莱弱水波秋風釃酒待潮生渾似羅江吊屈平地下有靈驅海若人間無主聽阿衡㤙讐莫辨君親分忠倿難逃今古評􅄫寞長洲赱麋鹿不堪眀月櫂歌聲千古東南詫海潮摩挲強弩未全銷氣乗日月分盈縮聲振山河欲動揺擊楫中流謌慷慨􅀝䦨斜日􅁂飄蕭錢塘官酒秋仍緑更與靈胥酹一瓢風􅁸城南思􅃤悽獨携長劒􅀝長堤未談秋水驚河伯先跨濤江掣海鯢力障狂瀾扶砥柱手揮妖祲豁坤􅌼東流不盡凭䦨意長咲歸来日已西毎囙潮􅀱卜災祥今􅀊潮頭百尺強千犀弩彂鯨鯢吼兩乳峯開龍鳯翔乗槎直欲訪河鼔懸水不湏誇吕梁徙􅀝江亭吾已老海風吹面􅄠蒼浪夷白齋藁卷之八
