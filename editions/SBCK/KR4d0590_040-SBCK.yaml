body:
  text: 陳基傳呉人尤義撰陳基字敬初台之臨海人父祥多聞好學而尤善老子清净之􅀃平居常黄冠鹿裘與方士㳺没時基年甫九歳越五年母夫人姜氏即命與兄聚􅀙師扵杭又四年􅀙金華黄文獻公溍受業至正仍紀元之元年􅀙文獻㳺京師授經筵檢討其徒有為御史者以言責􅖴扵基謂並后為致亂之本囙草諌章力陳其失兾君覺悟以正始也而上方溺愛詰知其由欲寘基扵罪怒且不可測遂引避南歸于郷奉母夫人西至呉教授諸生備養惟謹為詞必務上法三代下軼漢唐東南聲文為之丕變逺近學者争師之户外之􅋰恒滿属南州用兵朝廷開行樞宻府鎮撫南服起基為都事轉江浙行中書省貟外􅀰俄陞􅀰中時平章張士信統兵鎮杭基以本職參佐道之以正杭有岳飛墳蕪穢弗㳟乆矣基追慕興慨以状請于朝俾與厯代忠臣並列春秋致􅀕尋自為文刻石墓上以表其功西湖書院舊有經史書板兵後零落無㡬即白平章出官錢􅀂干補綴成帙夫以天理民􅃔泯亂之秋干戈相尋日不暇給基乃賛佐餘力為其􅀁得為使聖經賢傳復明扵當時崇徳報功無媿扵徃昔雖武夫悍卒聞下風而望餘光亦知有􅀁興起擴而充之是大有功扵名教也未㡬由杭来呉叅太尉軍府事及太尉自王扵呉群下同聲賀之而基獨諌止太尉欲殺之不果巳而超授内史遷學士院學士階通奉大夫覃恩二代凡飛書走檄碑銘傳記多出扵其手基毎以為憂而未敢以為榮也今國家命􅀅平呉臣多見誅戮而晏然無恐朝論多基之能尋名入預修元史書成賜金而還洪武三年十月壬午以疾䘚扵常熟縣河陽里之寓舎得年五十有七娶王氏先四年卒無子以弟之子訥為後女四人長適呉昱次車􅁢次幼皆庻出基平居慎重寡黙與物無競家人㒒􅊢未甞見其疾言􅃍色宗族故舊自浙東来依率飬育奨􅂆俾各有成士有才可用必引而進之有䘮不能舉者為買棺歛㤙意過扵平生方太尉僚屬強占民廬基獨以巳俸買宅天心里即舊屋數楹稍加塗塈環藝花卉之属號小丹丘休沐之暇􅂺與客尚羊其中啜茗清吟議論古今出入經史百氏危坐終日歳時有事扵祖禰始殺牲以展其孝敬􅀄非薄扵友也呉國􅀅亡食􅁏者咸惴焉恐蹈􅂦鑊君子謂基宜保終吉巳而果然噫父母全而生之子全而歸之􅀂基者其亦可謂克全而無憾者今蔵于家有夷白齋稿二十卷􅀚其文雄而氣髙可以黼黻皇猷敷陳帝業而乃使㽞滯江湖之上驅馳戎馬之間竟賫志以没兹其可惜也夫
