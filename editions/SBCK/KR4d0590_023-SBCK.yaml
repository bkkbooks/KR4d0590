front:
  text: 夷白齋藁卷之二十三
  hash: sha256:f2ef96bcaeb3e20267b825cee716eee9ffcb14bb676b0ce1f658358baef5d271
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_023-1a}
body:
  text: 臨海陳基著金華戴良編記雪屋記顧君進道寓書笠澤之上而謂予曰吾幸以太平之民􅀗扵畊釣之餘􅀙事某丘某水之樂而其􅀁謂水竹禽魚凡以資耳目之玩者子嘗執筆而賦之矣今吾即􅀁居東偏闢室曰雪屋杗楶不斵尚樸也丹雘不施尚質也覆而為宇環而為堵䟽而為牖宻而為奥皆飾以堊者尚素也入吾屋者晃然如積雪之爛扵目焉囙以為名者尚白也然未有為之記者敢復以煩執事者可乎夫雪之時義亦逺矣詩詠之春秋書之風人賦之慮無不極其􅈲而予也又何以加焉頋惟進道實吴鉅族環溪而居甲第相望故家喬木之下孰不以華靡事歸之而其寒暑昏旦􅀁恃以為蔵􅁱㳺息者曽不以雕斵丹臒為羙而上棟下宇專勝扵桐軒藥砌緑隂翠而之中者不過曰樸曰質曰素曰白而巳至比物興諭又獨有􅂑扵玄冬之雪吁何􅀁尚與人異㢤况鳴玉紆朱乗堅筞駿上可以狎聲势扵王公下可以振光耀扵閭黨進道皆不屑為之而退焉一室􅅯蹇肥遯章甫逢掖之與俱雅曲素琴之是􅃴其貞風靖操殆􅀅蟬蛻溷濁而與詩之􅀁詠春秋之􅀁書風人之􅀁賦者歸㓗扵􅀊寒而後已其視同流合汙檏遬淟涊而不知反其􅀄服者若􅀅凂焉又詎可以同時而語㢤此其􅀁謂雪屋庶㡬進道之志也吾聞有道者之端居也無􅀁待扵外而虚室生白焉進道盖甞與有道者㳺尚何以予言爲㢤請以是爲記愛曰堂記松􅁜扵和仲躬畊以飬其父母予友錢君伯行題其􅀁居曰愛曰堂且徴予文以記之昔者􅀭雄氏有言事父母自知不􅁕者其舜乎不可得而乆者事親之謂也故孝子愛曰羙㢤乎何其言之不詭扵聖人也夫天下孰有親扵父母而戚扵人子者乎然父毋之年有喜有懼而人子之心則有幸有不􅄑焉故曽子之善飬志者􅀎知其不可復者而先施也季路之興感扵風木者欲致飬而親不待也與其冨貴而不待孰若貧賤而先施此孝子之心􅀁以不􅀎自己也盖注而復来者日也衰而不可復盛者人也往而復来者無紀極衰而不可復盛者猶湏􅁷知此則百􅀊之中無非可愛之曰一曰之内無非致愛之時是心也夫人有之聖人獨先得其􅀁同然耳彼具聖人􅀁同然之心而弗知踐焉不有其身者也不有其身者自暴自棄者也今既不甘扵自暴亦不安扵自棄而又遭世承平安居畎畞出不驅馳扵王事入遂承顔扵朝夕上棟下宇俯仰具慶而温凊滫瀡之職無慊焉昔之仁人孝子克全斯樂者盖鮮矣和仲抑何其􅄑歟然天下之􅄑不可以乆居人子之心不可以不懼知懼然後知愛然後知不􅁕此􅀭雄氏􅀁以善原聖人之心而錢君又善私㳤楊氏而錫類扵和仲也吾聞顔淵之孝精於猗頓含菽緼絮美扵紆朱懐金和仲其尚勉㢤至正十年夏五月戊午崑山州重建城隍廟記江南既入軄方而崑山寔呉壮邑元貞初縣陞為州皇慶中徙治太倉而城隍之神寓祠扵興徳廟延祐丙辰夏旱判官馬祥禱雨輒應乃改祠于海寜寺􅀴蔵殿泰㝎甲子逹魯花赤道僧實始建廟然亦草創而已至正丁丑史侯元章来為是州首恤民隐均賦役嚴教條朞月之間威肅恵鬯凡前政􅃅為難理者侯皆優為之而崑山之治遂為江南州牧􅁛首扵是大新孔子廟􅁱州治増剏常平際㽞之倉皆不勞而事集乃相神宇爰圖改作而州人顧瑛以故衣冠家畊隐界溪之陽人以長者􅁛之聞侯之意則欣然以廟事為已任盖前十年時瑛嘗夢與神接神語若曰􅀊在攝提龍御扵斗必有良牧式康式阜吾宫當犬汝其左右汝尚識旃及是􅃴符􅀁夢然則􅆸興之故神者固己㝎之乆矣先是州治之前無正路侯至始除地為平橋以通車馬之往来而廟故在州之東南地既湫隘制亦簡陋乃更擇地西南􅁲曰以遷焉度材庀工􅀴始扵至正十年月落成扵月前為正殿後為神寝棟宇穹如門廡翼如昔所未備令皆完羙神明之居扵斯為􅁛為屋若干楹而􅀁費一出扵瑛焉州人士因争持牲酒来享且曰吾州非惟生齒之衆貢賦之夥甲扵郡而地瀕大海風檣浪舶出没島夷卉服之境朝彂而夕至盖要􅊣之地也今天幸恵賢侠既飾署居以衛我復興學校以教我蓄義粟以活我吾方恃侯以為金城湯池而侯頋以金湯之固神而明之式佑民社垂休無窮郷之善士又􅀎聞義而􅁸趋事如歸是使吾父兄子弟世世依神以徼福者皆侯之賜也乃相與伐石来求文以為記予聞城隍之神肇自吳越其来乆矣崑山由縣陞州且􅀙治要害地神之為祠冝不可緩然上下數十年而始大扵今豈􅀁謂􅆸興之故神者㝎之已乆而史侯之賢不獨生民是依而神者亦􅀙有賴乎史侯為州設施次第要為審􅀁重􅁿者然廟為伇最鉅而瑛也獨奮不煩有司而成之速工之羙若此盖上以善勸下下以善應上感孚之理固自有不可遏也史侯善政可書者不一其不繋扵廟者兹得以略云是􅀊庚寅月記虚齋記有為黄老之學曰虚齋者莫知其為何許人也􅂉見而難之者曰夫積氣為天風雨霜露寒暑皆天也積塊為地山川丘􅁜草木皆地也人具百骸九竅以屈伸呼吸乎兩間殆與積塊者同類耳果何獨以為虚乎虚齋曰嘻若何言之悖乎夫人囿形扵兩間固無異扵山川丘􅁜草木也其􅀁以屈焉伸焉呼焉吸焉扵其中而􅀎与造物者超鴻濛混希夷㳺扵太無之家而周流扵風雨霜露寒暑之表者盖必有神而眀之者矣神而明之者何虚以待物者也故曰唯道集虚此吾􅀁以齋其心乎此吾􅀁以一厥志聽止扵耳心止扵符乎此吾􅀁以虚室生白其猶日月星宿之有光耀扵積氣之中者乎是道也顔氏之子得扵仲尼者也荘周氏􅀁以浮㳺乎人間世者也若何言之悖乎客唯而退虚齋子亦儵焉不知其􅀁在㦯云匡廬道士有曰于太虚者世傳以為異時􅀅家子好侠任氣有口辯􅀎文章扵書無􅀁不讀自以為才髙不為世用遂著道士服為黃冠師注来呉越最為玉山隐君􅀁知吁此豈即其人非耶予聞其言之合扵道也故錄以記思順堂記吳郡袁氏居長洲之蛟龍浦者世為衣冠之族與吾友者曰可立實􅀎以勤儉好學自振先人之廬悉以讓其昆弟而自卜築吳江之同里奉母氏居焉既名其堂曰思順又属予彂其義以記之昔者聖人繫易至大有之上九曰天之􅀁助者順也人之􅀁助者信也履信思乎順又以尚賢也是以自天祐之吉無不利也盖上九䖏大有之極而􅀎下􅀙六五君子􅁚之則克以盈滿為戒謙退自􅀅况天之􅀁助恒在扵崇善而崇善之至又莫大扵尚賢乎且君子居大有之時固當用其剛眀之徳岀時遏惡􅀭善代天工飬庶類然非大車以載如九二公用享扵天子如九三匪其彭如九四厥孚交如如六五則不􅀂􅀄九之無交害上九之自天祐也今可立以頴㧞之姿駿彂之氣使其明目張膽髙視闊歩如名駒利器得以折衝馳騁扵大有為之世則其材􅁕以任重忠􅁕以守莭謙􅁕以制盛孚􅁕以交上下昔人􅀁以駕􅁿車就熟路遇盤根錯莭而鋒不少剉者非若人之徒歟乃今逺去江湖卜居清曠蓄書数千卷樂與賢大夫士攷論前言徃行以飬親教子為務察其心之􅀁思殆􅀅仰􅀗助扵天跡其身之􅀁履又􅀅俯􅀗助於人斯堂也盖􅀁謂固忠厚以為基闢仁義為戸樹禮譲以為墉廣孝敬以為奥守之以恭儉恃之以悠乆而積善之慶庶㡬日與父父子子兄兄弟弟夫夫婦婦周旋扵壼閾之中而天者且弗􅀎以奪之而况扵人乎然有大者不可以盈故受之以謙今可立既克以大有而作室其子復知以謙為肯構則思順之澤如水之有源其来也孰得而禦之乎詩曰樂只君子保艾爾後又曰子子孫孫勿替引之是為記夷白齋藁卷之二十三
