front:
  text: 夷白齋藳卷之七
  hash: sha256:d2da5cf94aef2edaa5800b164b9e9675cee88e2e5e5ded7d8953acf71b593016
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_007-1a}
body:
  text: 臨海陳基著金華戴良編律詩七言秋日雜興五首彈鋏歸来歎薄逰西風吹老黒貂裘裁詩見慰慚錢􅁸掃榻相延媿隠侯擬學䠂人歸種橘虚勞蜀客望牽牛五湖􅃄景依然在還許扁舟伴白鷗関山揺落鴈飛遲江漢飄零有􅀁思倦客自憐蘇季子故人誰問介之推露催絡緯窓間織風緝蠨蛸户外􅁝獨荷慈親念逰子􅀝門日日數歸期江頭乆客日思家坐覺徴霜上􅁂華莭序又催秋後燕風光争彂雨前花倦逰已夢荘生蝶不飲何憂廣客蛇怪底朝来衣䄂薄一川白露下蒹葭一夕西風木葉飛􅀞梁落月淡餘輝銀燈夜照還家夢金剪秋裁寄逺衣霜信早随新鴈至素書深訝故人稀無囙為謝東曺掾鱸熟􅐜香莫便歸明河如練月娟娟坐對清光只自憐衣乆不知沾白露夢囬猶記到鈞天汝南遺老推黄憲海内諸公憶鄭䖍萬里歸来無寸􅀘論交慚愧到忘年􅀉沈仲說二首欲采芵蓉􅀉􅀁思秋江風露正離離每囙見月懷玄度可但看詩􅀃項斯溪上燕辝華屋早槎頭魚上碧波遅太平無事差科了歸共原泉理釣􅁝野人籬落並江濆竹裏流泉竹外雲好學槖駞惟種樹莫誇司馬最􅀎文小橋斜接漁樵路落日争呼㕐鶩群獨憶詠歸亭上客乆㽞城府思紛紛次韵金上人見詒屏迹吳淞江水頭勞君􅀊晚逺相求擬爲􅁑井三生夢更作曺溪一宿㽞掛錫好依黄葉寺題詩曽到白蘋洲它年重約呉門道杯度秋風不用舟􅀉家兄敬徳庭闈一月違温凊兄弟終年歎别離落日有時成獨立秋江無䖏不相思雲􅁁白鴈􅀄􅀓信籬下黄花預有期甚欲卜居依北郭故人誰送草堂貲次韵吕彦貞西池風日何瀟灑公子不来誰共逰樵䛴漁唱互断續山色湖光相蕩浮􅀴秋華屋辝飛燕隔水好花如莫愁腸断濯纓亭下路籬􅅖猶繋散人舟歸燕年年此日便知歸欲去仍依舊壘飛故􅀦㝎知通碧海秋風應不到烏衣吳宫避火驚前夢衛幕營巢悟昔非莫咲野人門巷小杏花春雨得泥肥用秋日雜興韵作逰仙詩五首飛佩飄飄入逺逰青藜為杖鹿為裘采芝謌逐秦遺老辟榖心期漢列侯又見秋風歸乙鳥㡬看春雨􅀾蝸牛有時濯􅁕溪頭晚一曲滄浪不動鷗幽泉怪石好栖遲鍾鼎無勞入夢思每把素書閑裏讀細􅀅玄牝静中推溪頭斫竹裁龍琯石上㘽松引兎絲去去盧敖同汗漫十洲三島與君期鵬鷃髙低各自飛龍泉何必吐光輝三林樹下曽湌玉千仞岡頭好振衣􅈽犢書存人見少崐崘桃熟客偷稀仙家不是無樓觀底事公孫不肯歸中宫姹女最嬋娟何意東君不見憐貞潔正同秋後月澄清直佀水中天每持玉節朝群帝自掃丹臺掲寸䖍臣妾自知無􅀁覬願君安夀樂千年白雲深護地仙家千樹玗琪老􅀊華羽客穿林収桂實山童和露采松花􅃄梳瑶草柔如􅄠石赱蒼藤曲佀蛇記得夜来歸路險飜江風雨撼秋葭􅀉玉山江上秋隂十日多思君不見柰愁何風髙澤􅀦来鴻㕐雨入汀洲落芰荷公子文章裁瑞錦羙人衣䄂剪􅁿羅􅀞船亦欲溪頭去聽唱花問緩緩謌次韵鄭遂昌奉謁范魏公祠皇皇卷服儼専祠生氣渾如未死時天下㓛名韓相並関西威烈夏人知英雄未盡匡君筞父老頻瞻出牧旗昭代尚賢嚴祀事詩人􅂓得薦江蘺白芙蓉生嗔青女太精神玉立西風不受塵秋水洗粧朝白帝露盤和淚泣銅人清􅆂漢武池中影淡寫崔徽鏡裏真腸断深宫舊時伴年年相望越溪濵次韵錢伯行白芙蓉帝子西逰太液池一杯秋露為君持空令越女羞容貌不與唐昌共夲支婭姹最憐無語䖏風流全在半開時自移長信宫中去學得班娘淡􅀞眉婁江即事二首簡郭義仲瞿恵夫秦文仲陸良貴蒹􅀉頋草堂婁江江上樓居好滄海海頭城邑新蠻􅀰打鼓争􅁸柂鮫客捧珠来售人風燈照人不數􅀧霜月湧波才一輪人生㑹合豈易得看劒引杯寜厭頻秋風已過菊花期咲把婁東酒一巵徘􅆦月色樓中滿顛倒天光水底移夢熟已知鼇背穏詩成偏憶虎頭癡明朝又鼓吳松柂􅀿采芙蓉􅀉􅀁思次韻仲􅀃喜陳􅅩方過東林隠居二首州府尋常數往囬江湖相見重徘􅆦殺雞不為林宗至拜母曽期范式来烏鳥暮栖池上樹児童晴掃竹間苔明朝又入城闉去一幅蒲㠶帶雨開空林風日變隂晴散筞相􅀙欵欵行心戀白雲飛䖏近眼随􅀌鳥沒􅁁明敢期諸􅁑隆中卧且學龐公壟上畊老􅁴丈人才力徤浩謌一曲大江横次韻鄭遂昌喜雪二首簡白野􅁥司瓊霙著地不沾塵玉樹臨風欲照人千古賦髙梁苑調一枝梅冠漢宮春占年已喜無時癘祈榖何湏拜水神却憶上畨裁詔䖏瑶階飛絮白扵銀澤國雲同氣若蒸賦成應不為憎蠅花間端木皆為瑞露滳金盤欲化氷甲觀影搖鳷鵲樹銀床聲㫁轆轤繩懸知水部明扵晝錯認瑤臺皓月􅅩送曹宗爰愛此丹山五色毛綵衣初翦暎仙桃奉親喜有銀􅁝鱠贈别慚無金錯刀洲渚春深生杜若江湖波暖漲蒲萄王褒擬奏賢臣頌肯學山人索價髙次韵懐彦誠沙棠為槳木蘭橈别後令人瘦沈腰采蕺蹔歸靈越去栽桃重赴武􅁜邀醉乗蓮葉春波闊夢落􅉉花夜雨飄猶記共㳺鳴玉洞滿山明月共吹簫次韻待􅄾上人不至羡君方外得詩流杖錫相􅀙海上㽞白鶴一聱寥廓曉滄波千頃洞庭秋鹿門未遂龐公隐蓮社行尋慧逺㳺望望佳人期不至碧雲􅣖遞迥添愁次韵懐玉山滑滑春泥滿郡城出門􅀐馬不堪行未䏻學道􅀙緱母且􅂧忘憂對麯生流水小池垂釣影春風深巷賣花聲停雲賦罷心如渇安得滄浪濯我纓陸氏别業窈窕西池一􅈳通赤䦨如􅀞􅀝晴空風微燕雀飛塵外日净􅀛魚在鏡中入谷謾夸盤往􅂧卜隣冝住瀼西東緑隂滿地新荷彂猶勝開尊飲碧筩􅀉仲說自昔龐公少入州偶囙人事亦綢􅓎慈烏舊止庭前樹拱木新悲宰上秋雨露山空驚物􅀱江湖風急滯書郵此心酷似長庚月永夜相思爛不収􅀉玉山二首我愛玉山佳樹林草堂終􅀊有餘隂巢安翡翠春雲暖窓護芭蕉夜雨深寳􅂐焚香㽞睡鴨綵牋行墨寫来禽萬竿脩竹休教洗日日平安報好音碧梧翠竹日扶踈長夏髙堂可宴居霅上故人時載酒山隂道士近無書蒼頭掃石安碁局稚子穿花奉板輿若見恵休煩問訊碧雲詩句㝎何如水木清華亭小酌栁隂門巷雨初晴蓮葉田田著䖏生濁酒且容􅄞􅅩夜名謌不數米嘉榮波紋􅉷逐微風􅁸霞彩紅兼落日明水木清華賔主勝莫􅀌詩社舊時盟仲􅀃㽞陳公原余往訪之孝子之廬何䖏覔陳公原上白雲深山林不受炎歊氣雨露􅀎生怵愓心流水到城無二里長松出屋揔千尋􅖋莪自昔多遺恨三􅂧猶令淚滿􅁭㽞宿陳公原五月城東訪隐淪衡門㽞榻與僧隣長林争􅀫此山鳥短棹獨歸何䖏人松蘿繞屋月當户楊栁夾溪風滿津杖筞􅀙今来往熟草堂猿鶴未應嗔題陳公原仲􅀃􅀁居壁忽憶羙人来碧山松桂滿林幽且閑論心合在羲軒上浪跡漫居夷恵間夜雨思親雲氣白秋風泣血土華殷􅀊寒有約􅀙諸老采藥携棊日往還夷白齋藁卷之七
