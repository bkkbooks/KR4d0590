front:
  text: 夷白齋藁卷之三十三
  hash: sha256:23a7dd296192173e38c6c2675c204fcc87026416b5f86d509ee68c4626375249
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_033-1a}
body:
  text: 臨海陳基著金華戴良編碑精忠廟碑自古􅀅相㓛臣身任社稷安危而存沒始終之際􅅒然有君子風百世之下至以其墳廟􅆸興觀時政之得失如故宋太師忠武岳鄂王者豈非以其人死而不朽而人心天理固自不可泯㢤􅀄王之没也盖二十有一年孝宗嗣位實始以禮􅁙王父子扵杭錢唐縣西湖之北山王之孫制帥甫尚書珂相􅁇請扵朝賜㓛徳寺曰褒忠衍福且剏祠墓側賜額曰精忠尋置田若干畞蘇之崑山以奉烝嘗咸淳戊辰四世孫運幹通復置吳興田若干畞命僧甲乙主之運去物改寺廟亦􅆸大徳卒丑子孫之在江州義興者相與裒財率力繕葺復完乆之䟽属有為浮圖氏者盡翦棄前人􅀁封殖而􅀊時􅀁恃以􅇷養厚本者至是復委地矣泰㝎改元寺主僧可觀獨以祠事不復為已憂朝夕扶服赱公卿士庶間盖十有三年為至元仍紀元之六年庚辰郡􅀴歴李全􅀄嘉其義募郡人力而新之盖亦勤矣至正十九年己亥十二月妖㓂犯杭先是行省左丞相逹實帖木児公與太尉吳􅁜張公以兵属本省平章政事兼同知行樞宻事張公鎮杭由冬及春㓂百方攻城不利乃縦兵四掠燒民廬彂冡墓三月􅉝丑大􅀾數合是夕㓂潰斬首數千級生擒者以萬計㓂平吳􅁜公命即故阯作新廟􅀴始扵月日落成扵月日中為正􅆍凝土為王像而配享者子則宋忠州防禦使􅁇忠侯雲􅀅則宋閬州觀察使文烈張憲而下各就序前闢廟門東西為兩廡後為燕􅆍則祀王父母洎夫人餘四子武略郎雷中大夫霖朝奉􅀰震脩武􅀰霆女與諸孫咸仕焉閎􅃉靚嚴視前有加而栖僧之廬􅀱賔之舘昔之􅀁嘗有者今無不􅇱仍命僧甲乙守之而蘇湖之田則俾郡守謝莭量其出納著成䂓刻之碑隂毋令擅有侵耗焉甫竣事平章公率僚佐致􅀕廟廷且曰世以鄂王㓛名位望與張魏公浚䓁並為中興名􅀅至論文武仁智用兵如神慨然以恢復之㓛自任忠義之言流出肺腑則諧􅁑武侯以来不多見也當其長驅中原轉􅀾千里此其心豈忍斯湏忘君父之辱㢤使天而克終其志則祖豫州不􅁕多道而秦檜乃忍使其自壊萬里長城如劉宋之殺檀道濟扵是兩宫䰟魄卒􅀙晉懐敏扵地下而神州宗社鞠為丘墟此誰之罪歟我􅀦家恩覃異代王父子以至部􅀅既巳䟽封列爵光賁泉壌而太史氏又論次其行事列而為傳矣獨其忠貫日月勲重丘山始終大節事関世教在􅀕法􅀁當尸而祝之社而稷之者盖􅊴如也乃上䟽朝廷請與山川群望歴代賢聖忠烈之在祀典者並著令甲􅀁以照往烈勸方来禮也公俾書廟􅆸興􅀊月扵石基不敢辞乃作詩併刻之其詞曰昔宋中葉􅀦􅇍危宗廟共守九鼎移兩宫蒙塵四海悲王獨自誓扶􅁸之河潰華坼徒手支長驅中原屢搴旗敵氣巳奪赱且罷讎執耻雪復舊畿忠孝要與靈胥期䜛臣居中肆罔欺勲業垂成俄復􅈥長城自壊大厦欹耿耿忠誠天地知西湖之曲北山陲􅄦神護此南拱枝爰作新廟􅀝翠微子祔而食􅀅校随白蘋為羞雜江蘺吳田有稷牲膾肥擊鼔考石吹叅差王乗雲車駕文螭左右列祖參兩儀麾叱靈霳命􅀨師福澤下土年榖滋鈞天無䜛究厥施盍配羣望歆無違墓誌銘陳隐君墓誌銘隠君諱謙字子平妵陳氏吳人也甫児時即知事父母三十始受室悛悛色養退則率諸生講􅀃周孔孟荀壹是以􅁱身事親為務年踰五十父母尚無恙父疾革思鱖隐君進鱖父沒遂終身不忍食鱖事兄訓謹甚訓字師敬為吏不務苟同在兩浙醝臺時嘗粥􅀁乗馬書􅀞器物属錢􅀁知贏什一自給􅀁知死妻操錢子母歸師敬師敬謝曰生享其利死餒其孤此市道吾弗為乃悉以錢丐之及書滿徒􅇍歸吳下則甚窶隐君曰吾兄􅀎若是復何憂乃力苦周旋惟兄􅀁欲爲人謂師敬爲吏㢘君實有以左右之亰口孫子翼與隐君爲忘年交貧有女不􅀎嫁隐君許助之後十餘年孫病篤隐君曰吾死欲見孫君地下即持貲赱亰口爲畢嫁事􅀄隠君事林䖏士寛寛強隐君以業試有司隐君勉就塲屋属吏卒搜撿懐挟者待士甚無状囙歎曰道䘮至此尚可以徼倖失得爲㢤即罷歸盡棄舉子習折莭屏除世好潜心六藝㫄􅄃百家而卒守之以約嘗􅀙師敬北客揚潤南寓杭累數􅀊不與人事接獨日􅀙搢紳髙世之士揚確論議爲文章馳騁上下尤善古賦及古今軆詩詭麗春容詞辯鋒出不少譲故内翰蜀郡虞公金華黄公今晉寕張公與諸老之在朝者交口論薦隐君冝在著廷與鳴太平之盛隠君力謝乃心行省承制署師敬由􅁺史陞照磨佐分省軍事扵常之無􅃬間謁告歸里第㑹郡事蹙語妻曰吾分必死矣謂隐君汝無官守冝自為計隠君曰兄在吾何􅀁之有頃兵突至迫師敬隠君以身翼蔽之兵怒斥引出隐君復求入見師敬已殪即匍匐伏屍哭甚哀遂并遇害師敬妻王氏與老奴王乙亦自􅀴死旦日門人范文絅訪其隣知隐君兄弟皆死状囙泣求屍􅀁得之篠橋下水中猶兄弟相􅀝立故人成元章白其事幙府為具棺歛且求其子詒属陳氏扵是隐君年六十七矣文絅奉二君􅁙吳縣天平山先隴側實至正丙申二月癸亥也隐君娶頋氏亦篤婦道先卒生子一詒女二長􅃴范伯暠次􅃴阮文通隐君􅀁著述甚冨兵後散亡獨􅀁著周昜觧詁及古今雜詩二十四首得之􅁅燼中不燬越七年詒奉文絅状来請銘基哭曰隐君兄弟存時時人為之語曰陳氏之子一儒一吏孝友豈弟今不幸俱遇兵死豈善不􅁕恃㢤且人孰不死而人獨哀隐君者哀其義不苟生死不求幸而免也嗚呼隐君之志亦烈矣乃論次其言行為銘銘曰其學也匪榖其集也擇木載翔載伏而巢以義覆孰仁其雏猗徳不􅀌我作銘詩以敦薄夫不亦悲夫䖏士􅀽君墓誌銘䖏士諱徳昌字子潤妵袁氏其先汴人宋􅀄以進士􅁸家曰仲賢仲賢之後有提􅀧亰西刑獄者扵䖏士為六世祖建炎間渡江居吳今長洲之蛟龍浦有東袁有西袁盖以其􅀁居别之東􅀽有静春先生􅀶學好著書家居不言禄實䖏士之諸父䖏士則􅀁謂西􅀽者也曽大父諱邁大父諱義父諱英彂䖏士身長七尺状貌甚偉天性醇厚讀書務眀大義縱觀前史知古今理􅅍人物賢愚遭時治平雅意肥遯世居沃壌深病流俗侈靡之習嘗曰吾家夲儒業賴祖宗餘澤有屋可以蔽風雨薄田可以供􅀕祀遺書可以教子孫浮湛郷里偃仰卒􅀊不啻􅁕矣獨念先大父好施予今力雖不及幸􅀊無水旱螟螣公上之湏粗畢􅇷飬之禮不􅆣子弟之教不􅆸尚􅀎莭衣食為親朋一日之懽每􅀊時伏臈斗酒相勞雖無兼珎之膳殺雞飯黍亦􅁕以娛親属有不􅀎自振者周之無吝色嘉時吉日則與􅀁知放舟吳淞甫間尋前代名賢遺迹逍遥容與有曠世相感之意嘗誦仲長綂樂志論而歎曰人生行樂耳縦冨貴何為㢤至正六年卒扵家得年五十有五以九年􅁙吳縣胥臺郷穹隆山職塢之原娶朱氏子男三人曰禮曰信曰良女二人適􅁑大􅁉朱珎孫男五人稷穆穰稚种女三人仲子信好學而尚文雅䖏士既􅁙之明年信奉清江李衍之状来乞銘南渡以来中故家如􅀽氏者固不少然求其䖏身脩徳苟可以及其親属朋友者掇口軆之養為之􅂲後用此終其身如䖏士者盖􅀅以是遺其子孫也夫嗚呼是冝􅖳銘曰維逢也時有藴弗施維蔵也固有蔚斯樹維銘也弗忘有後斯永慶姪天騏壙銘天麒陳氏子年十九其父伯淳命至杭見其族伯父基時同来者􅅩姪九人㽞而不歸者五人天麒最少而知務學問基扵伯淳同髙祖而天麒之祖諱屺為人信厚以言行重州里天麒兄弟三人天麒寔嫡且長其来杭也基擇師俾習舉子業未㡬基使吳門属天麒受詩扵㑹稽趙夲􅀄俄得軟脚疾即卧不􅀎行金華醫者趙以徳􅐷之曰此痿痺少年得老疾雖多投藥無益冝耴􅭀薟草九蒸暴為丸服之藥未成而疾告革基使還急召醫治之百方不能得竟死即寓舎買棺歛属時用兵又暑熾甚用是不免扵水火函骨􅀉􅄌濟僧廬尋􅁙杭北山岳武穆王墓􅅖若干􅇍扵是年二十矣死以至正二十二年六月二十一日􅁙以明年月日銘曰芝蘭斯植霜露委之璞玉甚羙伊孰燬之生非不㳤命有短􅁱􅁙近忠烈庶亦無尤嗚呼哀㢤墓表秦君墓表淮南秦君沒􅁙崐山恵安郷南岡之原門人私謚曰孝友先生監察御史張君士堅題其墓曰孝友先生之墓君諱玉字徳卿其先塩城人四世祖統制府君慶扈宋南渡囙家崇明東沙曽大父棟大父梁㳺太學為上舎生父庚咸淳末試通州第一入􅀦朝徙居崐山之太倉遂隐不仕君八􅀊孤即知家世夲末既長浸􅁋􅀴史百氏獨不喜為舉子業家居講授二十年事母兄盡子弟道母頋氏終未􅁙比卒哭里中遺火逼君廬君伏柩號􅅸火為自㓕族有據其田者君弗與較更歸之劵嘗道得遺金亟訪還其主僕間執盗之竊布帛者君縦之使去扵是皆伏君為長者􅀁論著有詩繤例大學中庸標􅀃雜録澷藁若干卷州部使者察君卓行􅀅䟽上褒旌論薦之君意不屑也至正四年三月二十有四日卒扵家年五十有三配顔氏子男二人曰約有文學曰璧先卒女二人長􅃴厶次先卒秦氏自統制府君而降皆􅀎世其學君雖晦弗售然卒以孝友為郷先生亦無憾矣余雖不及識君辱與其子約逰約泣謂余曰先君子之墓未有表表先君子墓者莫子爲冝遂爲之書以告其後人云夷白齋藁卷之三十三
