front:
  text: 夷白齋藁卷之十一
  hash: sha256:2e8607babfb6e8cf6e7f6fec54890ddee482afc14e6f0b9a62bfe3aa40fbdc2b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_011-1a}
body:
  text: 臨海陳基著金華戴良編長律送頋用之知階州磊落階州尹風流淮海人剖符新出牧觀􅀦早充賔愷悌臨民意賢勞報主身威儀何逮棣辞氣􅂧恂恂河水遙通漢天文逈入秦度関鷄戒曉行路斗移春鸚鵡如人巧蒲萄勝酒醇王遵方叱馭張翰肯思􅐜斧扆憂􅀺庶銓衡重守臣致身湏老錬報政莫逡廵送謝叅軍十八韵帷幄掄材日君侯許􅀦年三呉脩職貢六合􅀝蕃宣絳灌功難並龔黄政獨賢金湯新設險琴瑟重張弦借冦心􅄐切安劉䇿最全肻甘周顗泣勇著祖生鞭殺氣連區夏妖氛亘海壖丹心期捧日赤手欲擎天緑愛蘇堤栁紅依􅁃幕蓮此行真特逹臨别更㽞連夜蹙西湖席春廽震澤船􅁿風催觧䌫落日􅃤離筵浩蕩十年客衰遲百慮牽眼青慚阮藉頭白事孫堅迹忝摳機近㤙沾雨露偏委身同草莾報主乏埃㳙知已青雲上忘形太古前願君容一壑随分老林泉安童右丞挽詩我昔逰亰邑公方振羽儀諌垣推謇諤􅀴幄重論思􅀦器魁羣彦風猷竦百司讜言􅀙迕物直道不容私落落匡君略桓桓輔世姿太阿元自利白璧夲無疵河潰圗身禦嵩頺誓手支此心叅日月沒齒却磷緇民亦多勞只天胡不愸遺扶顛摧柱石謀􅀦毁蓍􅀛垂死猶憂主平生不􅀒知頋兹忠孝訓與爾子孫期謚法原終始㤙光邁䓁夷哀榮増感慨存沒繋安危墓木秋應拱風塵日未衰傷心行道者和淚讀豊碑郜同知挽詩循吏古稀有斯人今亦亡䰟應歸海岱身巳葬桐郷官近二千石年㡬八十霜秋風悲拱木愛日在甘棠賔客羊求軰児孫王謝􅀰史臣司衮鉞冝與彂幽光聮句至正十一年正月一日遂昌鄭元祐龍門僧良􅄾臨海陳基聯句送匡廬道士于彦成歸越兼簡蕭靖復盧益脩􅀊朝逢王春雨雪暗呉下行人當眀彂祐别􅃑􅃤莫把飄颻賀監舟基蹀􅉜靈運馬山驛梅始繁􅄾溪船浪仍打行紓荘舄唫祐去結逺公社禹穴紬奥編基蘭亭集群雅神運鶴􅌁朗風摽鵞􅀴冩祐雙鳬継遐躅千秋祝純嘏基信慿囬潮尾春融枯樟骻祐越臺瞰蓬􅌡胥濤駕龕赭基白􅀾隠鞍甲緑醑酣􅊦斚祐智嚢倒精悍詞鋒彂侈哆􅄾蕭臺多神仙盧敖夲静者道樞混溟涬語穽脫謑髁祐但令冠峩峩肯羡綬若􅀂滄海等稊米黄金真土苴接䍦􅂉露􅄠短􅄄不掩踝捷若矢離弦勇如金躍冶青雲􅇍伊始白雪和殊寡基土膏動句萌春情滿原野􅄾桂樹謌詎已栁枝折難舎基别夢梁月堕清談松風灑琦蓬藋既可居蘆菔自堪鮓基望望玉山阿来期卜燈灺祐􅅸句髙郵湖春深湖水􅃞汀洲耿七公祠在上頭蒲㠶十幅東風順眀日還君到䠂州次韻吳江道中兩䄂清風身欲飄杖藜随月􅇍長橋仙人有約歸林屋共飲甘泉聴玉簫次韵臨平道中仗筞􅀙軍事戰征簡書人畏漢章程去年此日山前路十萬妖兵一皷平題柯􅀶士􅀞竹群玉仙人佩水蒼金莖分露服琳琅曽􅀅天上昭華琯吹作飛龍奉玉皇題宋􅁜梅竹圖自􅀙廷論主和親毛頴陶泓入御頻數葉寒梢吹欲折争教扶􅁸北枝春題摩癢馬圖􅀅軍日日過南山射虎原頭暮未還獨繫驊騮枯樹下秋風摩癢箭瘢班題寒林讀書圖側耳幽泉入窈㝠近人嘉樹欝空青掛冠擬事陶貞白學注神農本草􅀴題􅀞馬圗殷􅀰妙冩三神駿髣髴一嘶風滿林如此權竒世常有可䏻當價不論金題倪元鎮􅀞西池亭舘帶芙蓉雲水蒼􅃼一萬重此日􅀞圖看不􅁕滿簾秋雨夢呉淞次韻劉徳方􅀴厯白露池塘􅀧翠荷越羅衣䄂􅁴秋多棃園弟子今華􅄠唱得開元供奉謌次韻送彦成玉山石路穿雲海湧山朝来爽氣有無間獨憐禹穴清狂客買得扁舟載酒還著􅄚溪頭日日過驪駒謌断柰君何虎丘山下東流水争佀春愁一半多戯和玉山韻西子湖􅁁蘇小宅錦官城裏薛濤家来時荳􅅳􅀄含蘂别後菖蒲又著花媿我風情如栁絮多君才思佀春江無端飬得秦吉了日日呼人向碧窓東林蘭若題謝仲和墨竹謝家公子􅀳風流寫竹渾如黄􅌿㳺道人相對東林下滿室清飈生素秋踈篁翆著滄洲雨老樹青含太古春想見觧衣盤薄䖏爲渠爛熳寫天真題蒲栁鸎鶺圖髙栁風葉繁短蒲春露薄爲問出谷心何如在原樂題􅀞山茶折枝江梅與水仙難兄􅂧難弟一節傲冰霜無心媚桃李題月季花折枝啚瑞葉時時緑靈葩月月紅天非私雨露人自競春功臨平氛霧不見人晨曦忽生嶺倉卒過臨平舟眠猶未醒騷悼鶴文并序世稱浮丘伯善相鶴浮丘伯相鶴如伯樂之相馬􅀁貴乎良馬者不以其䏻千里乎而鶴固仙者之􅂹一舉而千里者也然世無浮丘伯而鶴之䏻千里者豈少㢤彼羅而致之以充耳目之翫者雖復寵之乗軒食以厚禄亦􅀙耴其羽毛之貞白音聲之髙逺舉止之馴雅非以其􅀎千里也甚者鎩冲天之翮辱青雲之姿􅅖徨蹙恧使與鷄鶩争稻稷競膻腥以支朝夕之困而燕雀􅀙旁鼓翼且得以俾倪而􅀼咲之矣是以神銷色沮􅐞惘低摧秋髙露零引吭長嘆若􅀅求哀扵人而卒無知其意者嗚呼夫有仙􅂹之材千里之志縦世無浮丘伯亦豈無好事者如支道林矜其懊惋飬其羽翼以遂其軒舉乎然而不少隐忍䘚以憤懣失軄偃蹇無憀悒鞅不樂而化悲夫故余為文以悼之雖不敢自附上皇樵人若乃繾綣悲傷愍其不幸則亦庶㡬勒銘之遺意云尓其辞曰吁嗟鶴􅀆孰使有千里之質而不翔寥廓乎彼夭鳥獲貰扵硩蔟氏􅀆而尓鶴不逭夫矰繳乎汩鷄鶩使旅飲食􅀆孰若集華池而逰于甸也指幽樊媟以萃止􅀆孰若挟飄風而薄雲漢也浮丘􅊬其弗頋􅀆信斯生之不㳤彼支公􅂉可幸而覬􅀆頋狷焉不屑此汙瀆載營魄邅其道扵冥漠􅀆秉眀心逝􅀅焉告山川紆曲􅀆天地圜方尓神㳺􅀆紛翩翩乎帝郷濁世多患􅀆天上差樂御飛仙而下上􅀆羗鳯蹌而龍躍嗟尔鶴􅀆孰􅀙而訊之生亦􅂚喜􅀆死亦􅂚悲茍庶乎其一致􅀆則余又奚愴怳而歔欷代弔岳飛文亘天地而長存􅀆惟孝與忠叅日月以齊明􅀆惟徳與㓛昔有宋之多賢􅀆禮彬彬其在魯彼絳灌􅂉弗喻乎文􅀆随與陸豈良扵用武何夫子之英傑􅀆文與武其並施篤忠孝以為輿􅀆載功徳以驅馳當建炎之播越􅀆遵典午之遺轍豈􅀅相之無其人􅀆夫子獨臨危而激烈友萇弘扵千載􅀆偕吳胥而上下猗嫖姚豈獨方略􅀆矧孫吳又長扵用寡使君王而不忘嘗膽􅀆則㓛業豈卑扵范蠡使左右而不信夫讒賊􅀆則斯讎豈容湏㬰而緩死彼便巧固不􅁕誅􅀆此廷臣豈皆不㳤壊長城曽不少救􅀆棄神州逝􅀅誰復嗚呼自古皆有死􅀆余獨扵夫子而永傷谷可變而爲􅁜􅀆海可化而爲桒炳父子之昭昭􅀆盖弥乆而有耿光弔遺墳扵西湖􅀆作新廟扵北山跽陳辭而敬酹􅀆􅏮生氣之桓桓弔徐節孝先生文􅀊行聿其􅀅暮􅀆弭余節于淮之隂出郭門而望九原􅀆􅆧獨慕夫子而悲唫吾嘗􅀼觀乎聖門􅀆毎服膺扵曽氏後若人盖千載􅀆夫子實匑匑乎踐􅂂嗟事親莫先養志􅀆夫子一何其恂恂謂事死有甚事生􅀆夫子盖已質之扵􅀑神充百行扵一原􅀆其􅀁養者正直炳文質之彬彬􅀆信有言者有徳昔有宋之重熈􅀆曰惟以孝爲治聖人作而萬物覩􅀆鳯鳥豈得髙飛而逺逝紛束帛又加璧􅀆眷側席扵丘園育菁莪沒齒郷校􅀆禮彌至而道弥尊少余粤在束􅄠􅀆知嘉言之是服謂君子之思孰先扵善􅀆斯奉盈而執玉􅀊冉冉其不與􅀆汩余未知􅀁之叱其馭扵九坂􅀆柰何不畏隕踣而顛躋奉遺軆而過夫子之里􅀆懔淵深而冰薄反余躬其􅂉庶㡬􅀆尚惓惓扵先􅁴率寮友而拜遺墓􅀆羞秋菊而薦寒泉仰泰山而企喬岳􅀆􅊎有永而無諼清暉樓辞并序吳興沈仲説父學古有文事大毋無間言􅀁居東林有樓曰清暉金華王君子充記之以文予因推夲其志而為之辞曰東林􅀆北渚有樓􅀆式宴以䖏楶不雘􅀆丹不塗梠圜不過規􅀆方以為榘環之􅀆樹竹繚之􅀆蘭杜白雲􅀆在上原泉􅀆在下仰挟􅃄月􅀆俯臨風雨山之峯􅀆水之浦緑宛宛􅀆清暉暉其承宇入事有親􅀆出㳺有􅀁昬􅀆旦寒􅀆暑温清􅃴􅀆時以序原有秔􅀆隰有稌軒有􅍪􅀆肴有羜汲清流􅀆甘如乳搴幽芳􅀆菲菲􅊞予鳴琴􅀆酌醑樂清暉􅀆受天之祐歸鶴觧并序吳沈仲子以􅀁畜􅀟鶴善鳴者遺其婣魯施氏至則喑不􅁼常時且相頋低徊若悵焉有懐奮之意魯施氏閔之復以歸仲子則忻然鳴且舞不輟赤城山樵見而感之乃為作歸鶴觧客有羽衣玄裳過予而言曰吾胎化之属也家扵青田毓貞姿扵浮曠挺􅀌摽扵飛翰囙金氣而乗火精􅀆禀陽徳而長年世宗長扵羽族􅀆躬服馭扵神仙接帝子之蜺旍􅀆乗大夫之華軒􅂙鸞鵠扵阿閣􅀆簉鵷鷺扵九天挟浮雲而􅇒飛霞􅀆㳺清都而朝上玄頋嘗脫飛弹扵桂陽撫故郷扵華表横江湖而徘􅆦望青􅑡之縹緲渴想瑶池之泉飢憶璚田之草金風颯而知秋玉露零而知曉感􅈍帳之夜空悵昆丘之路杳羙荀􅉞之純孝樂蘇耽之好道託軒墀以並萃期􅀊寒以相保矧義侔金石之固契恊芝蘭之深始不間扵青蠅􅀆終靡惑扵孔壬念懿親扵疇昔脩雅好扵方今辱使者以􅀅命遺公子以好音予自慚扵徴羽彼過重扵兼金扵是影遲遲扵中路情􅆭􅃤扵故林曰曈曈以乍晞雲屏屏而載隂意欲往而復止目反頋而哀唫眷碧􅜲以嘿嘿盼翠竹以喑喑豈伊人之不㳤頋睽􅄐之莫任幸幡然而見惻獲遂予之􅀄􅂅覧歸􅂗而聮翩尋前盟以繾綣慕求友之鸎鸎􅊞子飛之燕燕􅀅翡翠以戯苕偕鳯鳥以翔甸豈汩沒扵鷄羣終羽儀扵霄漢惟吾子之好脩秉中心之孔嘉假清言以逹志庶察予之匪它諒去􅈬之不茍誓卒􅀊以婆娑予方俛焉以荘聽客忽不知其􅀁之但聞九臯之餘音如助予之齎咨夷白齋藁卷之十一
