front:
  text: 夷白齋藁卷之二十四
  hash: sha256:0cb1543664f371e659f448fe107269be4536adcc54eaf4945c31e2971816f27e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_024-1a}
body:
  text: 臨海陳基著金華戴良編記春暉楼記呉郡崑山之界溪有園池曰玉山佳䖏隐君子頋仲英甫之别業也山之西為草堂堂之北為春草池跨池為屋以蔵法書名畫如昔人之舫齋者舫上構重屋曰春暉楼与􅀁謂湖光山色者相值仲英曰率其子若孫為壽扵其親畢輒與賔客者沉吟六義為詩以􅃴登臨之􅃐甞誦唐貞曜先生孟郊氏㳺子吟而有感焉既以春暉名楼且徴予文以為記嗟乎世之難遇者太平人之至樂者具慶故風人之歎恒不􅁕扵􅀁遭而天下之情莫不願扵逮飬彼重堂層軒廽廓􅃨舘与夫珎禽異卉世之好事者皆可以力致至扵俛仰四世具慶一門行無覉旅之思居有園池之勝盡天下逮飬之樂無風人不􅁕之歎此盖非人之􅀁􅀎必者雖萬乗之卿相不可強而致也然則太平之士如仲瑛者亦可謂樂其心不違其志矣而登臨容與頋猶有感扵春暉豈􅀁謂愛日之心自知不􅁕者乎然是楼也廣不四楹髙不十仞近則綽阜之坡陀馬鞌之􅒞崪逺則海虞之綿延揚城之鉅浸與夫洞庭陽山朝光暮景出沒變化凡為其賔客者皆執筆而賦之矣余獨推夲名楼之義而為之記云至正十年十一月甲子也佩韋齋記呉興郯九成氏以瓌瑋􅀶辯㳺公卿間而其為詩清峻粹宻有作者之遺音焉甞自以狷急思􅀁以懲艾而庶㡬夫書紳之義者其要莫如緩乃即􅀁居闢室為齋曰佩韋盖尚志西門氏范莱蕪之􅀁以垂休千載者也以予辱有一日之雅俾為文以記之余聞之目短扵自見故觀面者必以鏡智短扵自知故正己必以道人受天地之中以生性固無不善也然古之君子必佩玉器物必有銘亦以氣禀之㦯拘而􅀁以謹其非辟之入者必託物以為儆也然則西門氏之扵佩韋其猶正􅂡􅄠者之扵鏡乎抑柔不茹剛不吐仲山甫之見稱扵尹吉甫而寛猛相濟孔子之􅀁以善鄭子産者也君子亦中庸而己特逺云乎㢤况思無邪者詩之善􅀴也温柔敦厚詩之善教也九成盖甞優柔詠歎而有得夫六義之􅈲冝邇之事父逺之事君無適而不得性情之正而託物為鑑頋猶有待扵韋則其􅀁以窮窮乎擇地而趋而敬以為輿恂恂乎捫舌之規而禮以為樞其扵言行悔尤何如㢤嗚呼西門氏之為莫欺范莱蕪之貞莭􅅸俗固百世之賢大夫君子也前志有之以長續短以有餘􅀘不􅁕九成以之因書以為佩韋齋記存存齋記沈君仲説隐居扵吳㑹畊學扵笠澤廬於陳公之原而皆名其室曰存存齋盖􅂑易大傳之語而陳公原之廬樸而不陋簡而有容甍不加雕椽不加斵而室之制具焉盖沈氏世有詩書之澤而其先隴􅀁在土厚水深松柏薈蔚斯齋也在墓之左環以流水繚以林薄遥岑緑野星拱繍錯而􅀊時霜露之感油然扵寒泉風木間仲說曰子盍為吾記之盖余辱以賔友之末甞执巵酒為祖夫人壽及夫人年终九袠仲􅀃持承重之䘮扵此又甞即其䖏而吊焉俯仰生事死􅁙之際敬飬至而哀禮盡仲說􅀁以培其夲而濬其源者非一日矣且成性存存道義之門聖人讃易之辭􅇚之者曰知禮存性而道義出盖學以知之知也孝以履之禮也性由此存道由此出而行之皆􅃴扵冝吾㮣於仲說事親之始終見之則扵斯齋也可無言乎噫以簡樸之室廬居􅀷厚之水土仲說􅀁以永孝思也以存存之聖謨承詩書之世澤仲説􅀁以垂後昆也後之人第毋以華易樸以繁易簡則沈氏之興未艾矣是為記至正十一年秋七月癸酉静逺齋記吳郡于正夫少喜醫方術其壮也遂以醫名家搢紳大夫樂其慎扵術也題其居曰静逺齋人囙以静逺稱之成都府判官浮光王季野甫由其先公叅政賜第扵吳因家吴中尤折莭与正夫㳺且属余為文以彂明静逺之義而記之夫􅀁謂非寧静無以致逺諸葛武侯戒其子以􅁱身飬徳成學廣才者也百世之下讀其書者至􅂑其言以為學者之標的吁豈欺也㢤正夫醫家者流其為務非必􅁱身飬徳成學廣才而名其齋者頋有耴扵静逺之旨豈有􅀃乎盖聖人立醫師掌醫之政令而與天官􅃁宰並列扵周禮其事則出扵宓羲神農黄帝其書則存扵太素靈樞皆聖人仁民愛物之心􅀁寓也夫以五味五榖五藥飬其病以五氣五聲五色眡其生死兩之以九竅之變􅂙之以九蔵之動此豈慆慢險躁者之􅀁􅀎彷彿㢤故必静以致之精以研之而後深且逺者可庶㡬也吾聞上醫醫􅀦其次醫人又聞逹則為良相不達則為良醫三代而降以良相而醫國者武侯也以良醫而醫人者扁鵲也武侯以道静以脩身扁鵲以術随俗為變昔者庖丁好道而進扵技使正夫之扵術亦猶庖丁之治牛則其去道且不逺而扁鵲乎何有囙書以為静逺齋記梓軒記吳郡徐君孟逹東埜之南榮有樹曰梓因名其軒曰梓軒昔孟達之先外舅陸君静逺以儒起家為徽州路學教授東埜乃其釣㳺之䖏也是樹也余盖見其手植俯仰二十餘年其拱把者忽欝然數十尺矣夫梓殷人上之詩人詠之周書以之命萹周禮以之命工夫豈以其為木之長其材貞其質實而不剥乎是故為棟梁則可以营都邑建眀堂為琴瑟則可以奏韶武薦郊廟然非遇夫良工則亦操斧過之而弗頋耳吁梓之時用亦大矣且始也吾與公㳺而見其萌今也吾與其子若壻逰而見其長使雨露之飬克遂乎其天培植之㓛不戾乎其性則其堅宻羙澤益壽且孳世有􅀴􅀦如梓材辨器如梓人則其貞且不剥者􅂉者不與樗櫟同棄扵操斧之手亦未可知然棄与不棄物之幸不􅄑存焉吾獨愛其春而榮夏而茂秋而落冬而實而吾與二三子鳴琴讀書扵此庶㡬充然若有得扵生物之妙者則前人之封殖以庇其夲根豈直􅀁謂無忘角弓而巳㢤詩云維枽與梓必㳟敬止囙為乏記使二三子知其植之之自至正十一年冬十月也貞吉齋記吾友陸飬正飾宴休之䖏扵􅆍室之側西東為户北南為牖中設匡牀而屏其東琴書圖畫筆牀茶􅍳古玩好之属叅差離列而嘉木之植曰橙曰石楠敷榮恱茂無不可愛盖室雖不廣而其資以為蔵脩㳺息者慮無不􅇱以余辱有一日之雅俾審其其義而扁之余以為飬正之名􅀂字皆岀扵易􅁚之頥是齋也冝扁曰貞吉飬正曰善囙請余記之夫易之言貞􅁻盖不止扵頥然盈天地之間凡有血氣者莫不有待扵飬而聖人實財成輔相而左右之故頥之道在扵莭飲食慎言語盖飲食以飬體言語以飬徳其事至近而􅀁係甚大君子之􅀁以莭且慎者欲其􅀁飬皆􅃴扵正己者正則及扵物者無不正矣此頥之貞吉􅀁以為可尚也且物畜然後可飬故受之以頥今飬正之􅀁恃以為飲食男女百物之需者皆前人之􅀁畜也前人之􅀁以遺飬正豈徒充口體恱耳目宴安其起居而巳㢤飬正扵此誠􅀎弹琴讀書詠􅁔古人以師其行義左圖右史想像古人以法其威儀而其動息莭宣無􅃴不由扵正則􅀁謂貞吉者􅀅日周旋扵飲食男女言語動作之間而前人之􅀁遺引而勿替而其􅀁以自飬者又可推以及人矣夫吉者何福也劉子曰􅀎者飬之以福飬正其尚勉之若夫推明震下艮上之義以告之則余既為序矣兹不復云至正十一年十一月甲子記夷白齋藁卷之二十四
