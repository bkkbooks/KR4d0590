front:
  text: 夷白齋藁卷之三十
  hash: sha256:b18274294f5199908943ccd0de397363063b91bd7979eea44299aae60b6eaa59
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_030-1a}
body:
  text: 臨海陳基著金華戴良編記重􅁱三皇廟記自􅀦都至扵郡縣前代􅀁通祀者社稷孔子而巳其祀伏羲神農黄帝為三皇建廟立師壹倣儒學􅀕用春秋之季月而以醫者主之則􅀦朝之制也平江為東南甲郡廟之􅀄剏頋不􅁕以􅁛神眀之居大徳辛丑郡侯岳烈始即吳縣故阯遷而大之至順􅉝未郡推官李君徳真至正丁亥郡守蕭君義更相繕葺而廟與學遂為他郡之冠至正戊戍今江浙行中書省左右司􅀰中吳􅁜周侯仁實守吳郡吏肅民勸為時良牧而尤以興學報夲為先務醫學教授郡人林君以義奉以周旋􅀅事惟謹几􅀕祀之品物師徒之􅅒稍與夫金帛之岀納周侯責成乎其上林君克任乎其下而銖􅁰之積絲寸之累幸粗有嬴則又諰諰然圖􅀁以興其􅆸而􅀘其􅁦由丁亥至今蕭李二君之􅀁􅀴營塗塈中之而為殿堂旁之而為兩廡為先賢祠為齋舎為庖湢前之而為三門為靈星之門為宫墻為井亭覆者腐柱者蠧而甃者亦䟽以缺矣由是􅁱其大不遺乎其細治其内必務乎其外其為􅃥也靈星之門為最鉅門舊以木為之今則易之以石閎偉尊嚴人用改觀而神眀之居至是而益􅁛矣庀工扵二十年庚子四月戊子告成扵八月戊申事既就竣學之人相與伐石来徴文以為記昔者孔子刪書㫁自唐虞以下及繫周易則歴序庖犠神農黄帝而太史公􅀁紀三皇氏見扵史記與今之􅀁祀者不同然自書契以来􅀁謂上古聖神継天立極開物成務復有盛扵繫辞之􅀁􅁛者乎􅀦家損益百王修崇祀典而醫家者流囙得奉牲幣粢盛􅇼豆百物之儀與郡邑守長駿奔升降薦獻廟廷如博士諸生之事先聖先師者始扵􅀦都逹扵天下而周侯職長承宣林君事顓醫教􅀎以其力之􅀁及為其􅀁得為而人存政舉􅁕以迓續前猷風勵来􅈒若此是皆有可書者用不辞而為之記俾歸而刻之杭州路重􅁱仁和縣記杭属縣附郭者二仁和與錢塘也仁和在吳越時為錢江縣宋興􅀦􅀄始易今名縣故在餘杭門之内紹興間縣令孫廷直嘗徙治招賢坊其遷麗大府之南左偏而與錢唐縣四隅録事司並列為東西序則皇朝大徳之際也至元仍紀元之五年己丣縣逹魯花赤宻児可馬嘗因其舊而繕完之距令盖二十餘年矣上棟下宇内垣外墉騫撓陊剥凛乎其􅀅壓而卒未有剔其蠹而支其傾者至正二十年庚子捴管吳􅁜謝侯莭脩舉庶政務以先後為次苐環視列􅇬􅀁冝振而新之者殆莫斯為甚爰命度材賦㓛而逹魯花赤北庭伯嘉訥侯韙之同知捴管府事邵君勝祖治中劉君克忠同力而賛之中為治事之㕔㫄為兩廡右為架閣庫前為縣門屋以間計者二十有三其増創則退食之堂居㕔之後幕賔之舎居㕔之左屋以間計者九傳階為䦨楯周扵外者為之墉以丈計者一百五十有竒椅榻之具皿器之需與凡􅀁冝有者莫不畢備是􅃥也􅀴始扵閏月丙寅告成扵九月庚申工以日計者一百一十有五用錢以緡計者若干董其事者主簿王欽謁文以爲記者縣逹魯花赤長安尹髙􅅮也杭爲東南㑹府省憲百執事實涖焉承平以来聀守令而司民社者非無器望材􅀎之選也然往往鞠躬扵簿書駿奔扵期㑹攘臂扵賦歛獄訟紏紛之末而􅁦􅁦焉覬􅀊月以俟踐更者相望也由是視公宇不啻如傳舎尚遑䘏其危且壓㢤乃今公不重費民不勤勞而植撓扶騫剔蠧而支傾者頋有待扵兵革荐興之際盖往者之􅀁忽来者之􅀁戒政之善訓也侯既不以傳舎視官府矣居其居而職其職者苐毋以踐更玩吏民則仁和其庻㡬乎書以􅂌之俾刻諸石嗣而葺之者尚有考云松雲巢記松可巢乎曰可上古未有宫室民居橧巢之上則松可巢也雲可巢乎曰可昔李白樂廬山五老之勝嘗賦詩曰吾􅀅此地巢雲松則松與雲皆可巢也夫巢扵未有宫室之世則有巢氏之民皆是矣後世既易之以宫室而其人復有巢者乎堯之時有巢父焉堯之野無遺賢彼父者惡得而巢乎盖上有堯為之君下有舜咎繇為之臣父雖賢列之百執事亦八元八愷之倫爾矧其時己治其民已安如父者非不得己而後巢者也以堯之世為可巢而巢焉斯其􅀁以為善也若白者又惡乎而巢耶尚論其世則白去父逺矣夷考其人則亦百世之士也使白居百執事之間則黼蔽人文弥綸帝載雖未􅁕以致其君扵唐虞然傳之後世亦豈易以淺近窺㢤惟其一遇時君遂擯不用扵是與賀知章司馬子微之属汗澷扵江湖神逰乎八極此其得已非得已盖可知矣然五老松雲一􅀴品題千載之下膾炙人口是以世之􅉞瑋闊逹閎曠而不覊者每誦其詩若見其人雖復跡顯􅀔崇而蟬蛻汙濁之心未嘗不與造物者㳺扵有巢氏之始就余􅀁知而言如髙侯元善􅆒歴樞省其跡顯矣名利勲賢其􅀔崇矣然室居委巷而不以為隘地逼郛鄙而不以為陋方構亭鑿池環藝花竹且自題曰松雲之巢每退自休沭輒弹琴賦詩徜徉乎其中而禽魚下上光景岀沒不越户庭而城市山林翛然異觀侯􅀅自附扵李白歟則率百執事之賢日㳺廊廟之上其岀䖏與白異矣􅀅自託扵巢父之流歟則飲食􅁸㞐未􅂉一日而去宫室也然則巢惡乎而在盖侯之巢不松而髙不雲而深不上古而安不五老而勝而亦未始不偃仰扵松雲逍遥扵上古而超然扵五老也盖居廊廟之崇而志在林壑䖏宫室之奥而情􅀉物表故以侯為附李白者固失之矣以侯為託巢父者亦未為得也余􅀅杖䇿以􅀙侯扵不夷不恵之間侯其許之乎侯應曰諾因書以為記矦燕人也今為淮南行中書左右司􅀰中余則韋􅆧山人陳基云六柳荘記昔者陶靖節旣已不屑為縣令浩然賦歸與造物者㳺扵羲皇之上矣其視世之軒裳圭組聲色子女與夫宫室狗馬之奉不啻如腥羶􅁾腐蟬蛻而去之唯􅂲其㦯染已也然而猶以五柳自􅃅彼五柳者亦何與乎靖節重􅁿㦲近世徐節孝以至行髙天下􅀁居有二栁因自比靖節而流風遺韵至今不衰檇李沈君逹卿􅁸家儒林踐􅏡臺省由丞相􅁺􅄪遷拜南行臺監察御史尋軄法行中書為理官其出䖏與靖節異矣􅀁居有六栁亦遂以名其廬曰六栁荘其扵靖節亦豈聞其風而興􅁸者乎逹卿由布衣㧞畎畒靖莭以世胄􅀣風烈莭孝以至行立師道皆人􅀁難􅀎者逹卿為親而仕且三十寒暑矣其識量髙明論議倜儻盖古之遺直也今以三尺為己任出入廟堂廷争曲直面折是非務必當而後己其為事盖亦人􅀁不易者而逰卿䖏之如公輸引繩動中程度然退則蕭然一室左琴右書間與賔友引觴酣嬉上下古今而言不及世事扵是六栁者亦遂􅀅與二栁相望扵五栁間由是而觀雖子其同而黜其異可也且靖節百世之士也世不得而用之莭孝獨行之士也世莫得而遺焉逹卿用世之士也頋􅀁用何如爾古今人不必同不必不同要其歸卒無不同者君子亦同其心而巳矣逹卿殆􅀁謂善學栁下恵者非耶􅂉曰莭孝之栁􅂢扵靖莭者三逹卿之栁多扵節孝者四其不同較然矣而子獨以為同何也嗟乎栁豈以多少為㢤頋􅀁以相望扵栁之外者非􅂉者􅀁知也逹卿曰善遂記之夷白齋藁卷之三十
