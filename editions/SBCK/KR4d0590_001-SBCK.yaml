front:
  text: 夷白齋藁卷之一
  hash: sha256:424a27bb4082302287bbdcdadee067d172f28371d15f76c2169779f8192ca9f3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_001-1a}
body:
  text: 臨海陳基著金華戴良編賦别知賦送王子充紛吾好兹良友􅀆慮無逺之不求匪夫人之不衆􅀆􅆧獨愛子之好􅁱廸仁義以為塗􅀆挟忠信以為輈朝縦鞚扵齊魯之郊􅀆夕􅆓洄扵洙泗之流登泰華以望八荒􅀆薄青冥而上逰抉雲漢而分天章􅀆􅀅黼黻扵皇猷􅍑豹怒而當􅀜􅀆呌帝閽而無由出國門而南鶩􅀆逝􅀅返扵故丘曰國家之耴士􅀆盖亦有夫常度筞騄耳而駕􅁿車􅀆矧􅀙容扵熟路秋風􅁸而江水波􅀆􅀊月聿其云暮鴻羽用而為儀􅀆廓雲逵而軒翥謇予生之孑孑􅀆何􅍱世之孔囏馳予椉扵九衢􅀆太行剨其在前豈王良之不善御􅀆反予躬之㦯愆昔韓愈之魁傑􅀆感二鳥扵潼関汨予黤黲而無􅁼􅀆又何􅁕以永歎属吾友之逺别􅀆申一言以自朂倘夙好之不替􅀆尚候子扵空谷蟬賦笠澤之野夏無鳴蟬嘉木欝其如雲衆鳥雑而争喧維嵗行之在丣景風生扵樹顛劃􅈽葉以髙噪復慿虚而浩歎赫乎對趙盾之日悽焉訴齊女之􅁈盖非金而非石亦非管而非弦變化乗乎氣侯音奏發乎自然􅀄而聴之若流泉之含清風㵼疾瀬而為湍徐而察之如靈􅁝之抽獨薾引餘緒之緜緜若乃微雨乍止涼颷满園陽舒隂伏雲霽曰鮮擇脩幹以仰集盻柔柯而延緣㦯嘒嘒而弥厲􅂉琅琅而未闌暁咽碧梧之露夕唫琪樹之􅃄興玊署之秋懐警金閨之晝眠韻欲㫁而復續喙蹔黙而逾宣􅀅自鳴其不平意有蓄而莫傳者乎盖萬物蠕動品異􅀋殊維尓蟬之為物何賦形之􅆌如始並育扵汙濁卒獨慕夫清虚􅆧含氣而飲露曽不豐而不􅃾奚斧蟲之稔毒恒不利尓軀豈文惡太著尓首綏飾􅀆物忌太㢘尓不􅁰食􅀆居忌太儉尓不巢息􅀆衆忌太信尓守不忒􅀆性忌太潔尓蛻無跡􅀆嗟乎尓有五徳又復善鳴激中林之逸響振寥廓之餘聲縱有惬扵人耳寜無迕扵物情尓其謝髙枚扵靈囿託茂􅀣扵郊坰藉流暉扵叢薄䕃清樾扵廣庭于以安貞而養素于以逺害而全生然周詩詠其􅀿時漢冠尚其􅀎介集弁則前史徵祥偷安則昔人垂戒盖進則􅀭扵聲眀退則㳺扵塵外雖隐見之有時亦􅃐舎之無悔也樂府白鴈操梁君出獵其臣公孫襲善其君之聴其言而作有群白鴈王其戈諸蠢彼行者王其􅇚諸匪伊是􅇚惟王之徳王徳伊何曰齊景公一言之善上格帝衷人獵得獸扵言何有王獵得言王千萬年鴻鵠操晉平公浮于西河感􅊑人固桒好士之言而作鴻鵠于飛以翮非毳君子好士冝别其􅀋鵠蜚冲天其有以夫美㢤山河守以士夫孰謂彼夫言有􅈲夫崇丘􅀉倪元鎮丘崇崇􅀆下有流水􅀣森森􅀆匪櫟伊梓彼檪孳􅀆且夀梓棄為薪􅀆扵材何有造物孔仁􅀆􅀅焉歸咎山髙􅀉陸玄素謂山髙􅀆其上有天謂地厚􅀆其下有泉天不可􅅩􅀆地不可極我思古人􅀆為之太息古之人􅀆謂誰山之中􅀆水之湄􅀌舟􅀆容與俯狎歩兵􅀆仰拓鴟夷非夫人􅀆尓曷􅀙之春草辭為延􅁜華彦清氏作當軒不栽花只種忘憂草栽花􅂲傷春草根草色年年為親好東方日出芳菲菲堂上阿㜷堂下児兒来為夀阿㜷喜何用逺逰千萬里春草種易生春暉報難極不􅀅春草報春暉且著春衣舞春日舞春日樂無殃阿㜷夀與春日長教人愛殺雙胡蝶􅀊􅀊飛来入􅀞堂㕐􅀌飛為徐夫人作鴈􅀌飛在何􅀁一在江之南一在河之滸江南一去不􅂧歸河水悠悠自東注結􅄠􅀙君作夫婦豈料􅀌飛失儔侣夫為忠臣妾貞女忍昔聞之今自許我􅁒同歸泉下土翼下之雏誰與哺日暮不離河之洲日出飛飛愛毛羽毛羽幸無矰繳傷翼下之雏乃可防慈烏曲為沈仲􅀃作慈烏尾畢逋朝夕相呼浦尓雏今日慈烏一何樂飛向樹頭兼屋角飛去飛来鳴且啄門前忽有吏手奉篚與筐中有兩東帛爛爛生天光孫也出見吏􅄪拜升毋堂祖母康强年九十受帛拜天仰天立太平㤙澤髙年及歡樂盈門動郷邑慇懃裁剪製為衣長短扵身無不冝毋著衣孫􅁸舞日日見烏来反哺萬嵗千秋荷明主黄雀行黄雀何飛飛雄鳴呼雌野草低暮歸莫向空城栖空城挟彈多小児朝飛莫傍東家屋東家鷙鳥食尓肉不信只看梁上燕昨日飬雏今不見不信更看桒間雉綺翼􅄐褷􅀲中死東家公子非少㤙彼鷙不仁誰敢嗔吁嗟尓生亦甚㣲彼鷙不仁謹避之鷄鳬行鷄與鳬皆鷇育鳬愛水逰鷄愛陸鳬昔未辨雌與雄母不頋之雞為伏雞渇不飲飢不啄以腹抱鳬誰敢觸鳬脫鷇雞鼓翼日日庭中求􅁰稷啄啄呼鳬使之食鳬羽日䙰褷一朝下水不頋雞雞在岸鳬在水賦性夲殊徒尓耳雞知為毋不知鳬恨不随波共生死白頭公詞杜􅁜三月春風暖燕語鶯啼雜弦管落花撩亂紫騮嘶平樂歸来酒尊滿􅀨㯤風篁忽已秋幽鳥多情亦白頭不随翡翠樓中宿却愛鴛鴦水上逰春去秋来不知老安樂即多憂患少綺窓深䖏語言竒付與紛紛秦吉了刈草行原上秋風吹百草半青半黄色枯槁城頭日出光杲杲腰鎌暁􅂿城門道門頭草多露未晞尓鎌利鈍尓自知一人刈草一馬肥馬不􅏂􅀆人受笞城中官廐三萬疋一疋日飱禾一石新城行舊城城舊人民新新城城新無舊人舊城城外兵一觧新城城中齊覆瓦萬瓦鱗鱗次第成􅀅軍令巖鷄犬寜􅀅軍愛民如愛子百賈皆集新城市浙米淮塩兩相直椘人之弓椘人得何時四海無荆􅁄北賈販南南販北見月行在家見明月誰論圓與缺他郷見月明却驚􅃜又盈世間児女不知愁夜夜月明同上樓那知此夕遥相望樓上徘􅆦不惆悵人生願與月同圓不願别􅄐年􅂧年此身捴為飢寒逼奔走東西與南北它郷見月與家同慟哭亦無阮嗣宗裁衣曲慇懃織紈綺寸寸成文理裁作逺人衣縫縫不敢遲裁衣不怕剪刀寒􅀉逺唯憂行路難臨裁更憶身長短只􅂲逿城衣帶緩銀燈照壁忽垂花萬一衣成人到家征夫歎世上父毋心貴男不貴女生女不過嫁夫家生男可以當門户東家有女不嫁夫夜夜織帛輸官租西家有男雖娶婦􅀊􅀊􅀙軍身荷殳有夫不若無夫樂無婦何如有歸惡却羡林間百鳥飛雌雄相呼不蹔離征婦怨征人娶征婦誓􅁒同甘苦征婦嫁征夫心期事舅姑舅姑在堂夫逺戍􅁒􅀉征衣不知䖏裁衣不􅀉􅂲夫寒有婦容易無夫難人生莫作征人婦夜夜裁衣淚如􅀨逿城曲莫啔匣中鏡怕見頭上雪莫放弦上箭怕射邉城月边城月􅇅還􅂯圓頭上􅄠白何由玄君不見自古邉城有餘樂夜月聮詩畫棊槊至令月照郾城頭相國㓛名齊斗牛夷白齋藁巷之一
