front:
  text: 夷白齋藁卷之四
  hash: sha256:8679b29ecd7531ec97c92760950b6a6bbebcd0e8ffab601925461d8875833388
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_004-1a}
body:
  text: 臨海陳基著金華戴良編古詩五言公退述懐鷄鳴戒徒御日入返柴荆素無希世心亦復勞其形間関用武日百役有期程空言不􅁕施退省汗沾纓中衢積塗潦滑滑不堪行振轡筞羸馬一歩一􅇒兢入門無它慮偃卧就南榮永媿逃名侣冥栖無􅀁營成夫􅁱􅀁居屋成赱筆戯贈我昨戾東椘君方客中吴我至已授舘君来始營居我屋雖湫隘可以置琴書並軒五六尺種菊三四株公退即就寝㦯擬陶潜徒君居擇髙明􅂗塈加􅕋蒢背隂而面陽中宻而外䟽昔聞真如室八寳羅明珠天女散妙花綽約麗且姝今􅁒人其人必且廬其廬去草當去根愛屋庸愛烏我器若鉊刀僅堪一割需君材如太阿可制千扵莬利鈍逈不侔􅃐舎冝爾殊雖居市􅌀内各在東西隅朝㳺􅂉同幙暮歸仍異塗終然念覉旅時􅂧枉軒車摘我黄金英浮君白玉壷議輪天人際咲傲羲皇􅀄􅎘生有妙理不飲􅂧何如次韵荅趙夲􅀄肅肅霜露下蕭蕭鴻鴈征春􅀙越城戍秋随淮甸行觧却紫霞佩换得曼胡纓覬酬一飯㤙遑恤千載名新詩辱逺􅀉金石鏗有聲􅁒報乏瑶玉臨風空􅂧情海安過牐得風出爛泥洪舟過海安牐路轉爛泥洪水行九十里泱􅐯趋秦潼月黒星漢髙四頋無人蹤縱有百丈彈不如數尺蓬是時天宇霽餘霞散晴空篙師無它術仰面呼南風夜乆水鳥鳴岀沒西􅂧東其聲􅁼人嘔見者思挽弓吾聞亦駭異莫䆒􅁻與㓙得非卑濕區池汙蚊蜹鍾暑夕􅏐人膚蜂蠇尚可容此鳥􅃅蚊母吐蚊利扵蜂往往陂澤内雌呼命其雄春氣一以和託巢蘆葦叢此鳥信可憎彼蚊欣未逢􅀁憂亡命徒手刄匿草中晝伏夜狙伺為毒甚斯蟲我方事師旅禁暴哀人窮此軰倘不除癘民安有終􅀁過戒吏卒反覆開盲聾尓實􅇱官守責在兵與農自古䖏邉圍盗戢商乃通陽徳始彂生人事冝肅雍簡書雖有程我行憂慮􅀙歎息長路人何由辭轉蓬聽謌水調有感江流清復清江草接江亭何人謌水調餘韵入青冥􅁔者不知苦聽者有餘情坐令離别客白􅄠鏡中生翠􅀨亭華構帶􅁱竹窃窕清湖潯時雨積空翠綺䟽生晝隂飛盖集芳侣鳴珂雜春禽中有􅀌栖鳯懐㢤多好音下塘道中謝村舟行謝村路却訪義橋營妖骨埋荒草秋風洗􅂧腥青山不改色紅樹逺含情當日聞風鶴俱疑是晉兵塘西牽舟復揺櫓日出還亭午風逓五林秋雲挟塘西雨盈盈採蓮槳坎坎迎神鼓對此􅁒忘歸停撓更容與東阡喧呼東阡道蒼皇競明彂萬斧入中林千夫編鉅筏関山日顦顇世路増騷屑此物諒何􅀹徒以材見伐南潯南潯古名鎮欝為商賈區今日㽞兵戍壁壘控江湖遥空含鴈鶩秋波秀芙蕖此地為邉圉何方非畏塗荷葉蒲昔年荷葉浦椎剽伏蒲萑日夕相狙伺承平為禍患兹辰乃夷坦悉歸畊釣間但聞明月夜時唱采菱還中塘道中鳯口溪塢晚含風山營夜依谷栖鳥息復驚歸雲㫁還續􅀞舸止宵征連艫㗸尾宿戍鼓雜鳴笳秋聲一何肅東塘􅁿舟下溪口却轉東塘路鷄犬近相聞漁樵逺城戍雖􅀴䘮􅅍後漸有承平趣䖏䖏白蘋花家家紅槿樹大麻大小兩麻村中蔵萬家塢樹連超山雲草著髙亭􅀨地力本冝農民風近知武欲問漢文翁何時復淳古􅊶家堰依依楊栁津靡靡􅊶家堰水岀鳯溪口山聳臨平面地􅀴兵甲餘人佀官軍徤往􅀊羽書頻今年魚米賤上塘道中尹山人傳周􅁻甫遺墓在勾吳蕭條入墟里泱􅐯帶􅃄蕪豈伊􅁎臣裔散落䖏江湖負耒林丘下容非隐者徒吳江城邑帶秋水盈盈笠澤湄西風一夜􅁸鴻鴈盡南飛晋日東曺掾唐朝左拾遺長揖謝軒冤悠悠千載期垂虹橋出郭雨如注入舟天􅁒低飛梁跨雲渚嵽嵲亘長霓三江風水急五湖􅃄月迷夙昔鴟夷子扁舟此入齊平望下田不憂旱髙田正冝􅀨四野己􅁕霖三吳復無暑盂酒及豚蹄盤羞雜鷄􅁰擊鼓樂社翁燒燈御田祖嘉禾欝欝由拳縣亭亭檇李城秦漢相吞噬吳越競戈兵靡靡風露夕離離禾􅁰生千載陸夫子遺書昭日星石門迢迢石門路冉冉􅃄村暮􅆌􅆌櫂謌聲泠泠不知䖏水宿信風波宵征犯霜露自愧匪賢勞何由拯􅀺庶崇徳崇川據四衝城郭開莾蒼水陸飛蒭粟軒車逓英蕩民和州牧賢􅀨􅁕田苗長我欲艤芳舟相尋慰懐想長安上堰如上山下堰如下􅁜躋攀劇分寸􅅖徨加􅀾兢有形必有役無寵亦無驚為謝津頭吏誰是魯連生題蘇昌齡西澗詩意啚圖乃黄子乆􅀁􅀞子乆自識云華陽逋客作逍遥西澗翁汗漫華陽客渇飲杖頭瓢醉卧溪畔石澄觀無聲􅃐黙聽寜有跡舉目雲鳥飛側耳川流激人􅄜静踰聞天機動弥􅄫􅁳搜属意匠繪冩遺刻􅀞此客不可作斯翁老無敵窹寐西澗啚令人心莫􅊇題黄侍講􅀁著王友樵先生墓銘後隐君千載士太史百世師􅈓辭銘友樵其言玉無疵我􅀚讀騷作古道殊未衰斯人不可見斯文其永垂夷白齋藁卷之四
