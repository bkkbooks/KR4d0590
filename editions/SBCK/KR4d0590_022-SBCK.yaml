front:
  text: 夷白齋藁卷之二十二
  hash: sha256:e0f7e0d0dcad1dfc0d4619b0acc3b59d45babf81b49481bc26cf54e0bd471583
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_022-1a}
body:
  text: 臨海陳基著金華戴良編序程禮部集序文豈易言也㢤􅀦家混一百年􅀎言之士莫不各以其􅀁長馳騁上下以鳴太平之盛求其雄深奥衍跌宕􅄐倫施之訓謩薦之聲詩自出機杼與漢西京唐元和宋慶暦以来諸作者争衡千數百載而天下聲文為之丕變則蜀郡虞公豈非偉然命世君子㢤當是時豫章掲公亦以其峻潔之詞更相振耀海内争師宗之並􅁛曰虞掲而文章之盛極矣至元重紀元之􅀄余至亰師虞公已退居田里乆矣幸辱拜掲公而與其賔客者㳺故禮部貟外􅀰新安程君則虞公之􅀁雅敬而掲公􅀁􅀹畏厚者也君盛年時挟􅀁有客亰師介然自持不苟務造請居窮守約人􅀁不􅀎堪而未甞一日不鑚研六藝紬繹百家漱滌刮磨與古為徒盖性􅀎而好之之䔍如此非直事剽竊衒華藻以馳騖聲􅀔而巳撡筆入舘閣得官殊不以崇􅋻利鈍為意故仕而貧益甚至語文章則二公賔客槩莫􅀎與之争鋒余甞評其文如泰山之松氣􅇒青雲天風夜驚萬􅄜並作側耳而聴猶季札􅃴魯而聞雅奏莆田陳公衆仲以文章名家亦以吾言為然使鳴太平以盡其􅀁長盖百鳥之孤鳯也然寒飢困頓三十年守常調如一日而介然不苟之風與詞俱厲不少衰年踰六十甫入直翰林尋教􅀦子拜南行䑓監察御史擢禮部為尚書􅀰方將頡兩制大其聲音以鳴其􅀁未鳴者而君老矣間奉使江南欲觧圭紱還朝廷求先人墓廬爲首丘計而道梗不􅀎歸竟客死錢唐之西山之僧舎余赱吊其䘮且臨壙哭之曰天􅀎窮其身而不􅀎使其文不工􅀎使其道不大行扵丗而不􅀎使其文不傳嗚呼悲矣先二十年余􅂘莆田扵亰師今君之沒又􅂘之斯文之緒豈遂終􅅸也㢤門人張吳同里且親收拾遺藁㑹粹爲三十八卷與同門臨安胡世顯校正刻之以余辱有忘年之好属爲之序君名文字以文自􅃅黟南生云至正二十二年十一月丁未序孟待制文集序􅀦朝之文凡三變中綂至元以来風氣開闢車書混同搢紳作者與時更始其文如雲行雨施􅗈霈萬物充然其有餘也延祐􅀄􅁇體之君虚己右文學士大夫􅆂煦乎承平鼓舞乎雍熈誓以􅀁長與世馳騁黼黻帝載鋪張人文號極古今之盛然厲金石以􅈭和平之音肆雕鐫以􅂐忠厚之􅒄而峭刻森嚴殆未昜以淺近闚也天暦之際作者中興上探詩書禮樂之源下泳秦漢唐宋之瀾擺落凡近憲章徃哲緝熈皇墳光並日月登謌清廟氣􅁜騷雅由是和平之音大振忠厚之􅒄復還其用力也如藺相如􅎨身秦廷全璧歸趙嗚呼其難矣㦲今翰林待制孟君砥礪成均􅈭昻俊造扵斯時也固已􅇍趋延祐之轍而先後之矣乃􅆒厯省䑓左章右程問其職則􅀘􅊴而拾遺也詢其業則稽古而立言也人方汲汲我獨熈熙衆皆碌碌我則舒舒扵是又奉其􅀁謂忠厚和平者綢􅓎扵詩書周旋扵禮樂浸􅁋扵秦漢優柔扵宋唐身勤而詞愈脩跡顯而業益專髪種種而志彌厲雖劫以兵衆不變也其用心亦精矣文章與時升降故氣勝則野詞勝則巧要非人之􅀁􅀎為也天也今孟君之文棄峭刻而就和平却雕鐫而趋忠厚毅然扵三變之後操不野之音寳不朽之􅒄若固有之充是道也吾知其全璧而歸無憾矣詩文揔若千首􅁵為若干卷序而存之以伺知者君名昉字天暐西人也至正十二年十一月已未序金佗粹編序宋髙宗承祖宗之緒雖間関播越退保江南然與漢光武不階尺土者異矣而靖康之敵又非新室赤眉之北南渡􅀅相肺腑爪牙之臣亦非若􅇮時馮異仗劒而崛起者加以重熈累洽仁漸摩浸漬淪膚浃髄垂二百年一旦兩宫􅀩塵宗社為墟中原父老日夜欷歔思宋不减三輔然光武弟徒歩南陽左祖一呼盡􅂧髙皇帝舊物其故何㢤盖光武知人眀見萬里髙宗舉􅀦聴扵權臣故囬溪之敗馮異之罪小朱仙鎮之捷岳飛之㓛大光武不以一挫之失忘逺圖故異卒以􅄪造之㓛興漢室髙宗不􅀎因􅀾勝之鋒用岳飛而狥主和之議任秦檜故以恢復自任者􅃴􅁕以媒忌嫉之口以忠貞許􅀦者卒無以􅏉鍜錬之禍夫􅀁貴乎中興之主者不以其􅀎雪父兄之恥光武考之烈乎今舉垂成之業而棄之使馮異君臣專羙扵千載岳飛父子㗸􅁈扵地下此孝子忠臣􅀁以讀金佗粹編者未甞不為髙宗惜也飛父子沒餘二十年孝宗受禪其孫珂實始以􅈼天辨誣錄詣􅊴訴上由是詔賜墳廟復爵位頒封謚禄遺􅀌時髙宗為太上皇猶及見之吾意其北望舊亰必恨不誅秦檜以謝天下嗚呼巳無及矣編捴若干卷今江浙行中書平章政事兼同知行樞宻院事吴􅁜張公命㫁事官􅀴厯吴郡朱元佑重刻且曰西湖書院岳氏故第也冝序而蔵諸至正二十三年三月甲子左右司􅀰中臨海陳基序飛雲樓詩并序浮光王君季野由其先公叅政賜苐吴門群公子㓜學長娶不出呉境而季野别業扵是有在笠澤者矣㕘政公䆠業焜燿事親􅀹盡孝季野盖酷似之故㳺釣􅀁至輒不忘其親此飛雲之楼􅀁以作也予家天台少以賤貧赱四方每東望白雲輒興狄公太行之思甞竊歎曰狄公社稷臣也吾何為者乃妄自擬狄公尋復自念古今賢不肖窮逹雖殊然人子之扵親寧有二致耶乃奉母来吳名其室曰白雲山房季野翩翩貴介頋􅀎折莭好學日與布衣韋帶之士㳺雖以予之無似既辱与之交又數要予登其楼以共適其􅃴江湖際天上下一色相與上地變扵下人變扵中甚矣㢤素之不可以不安也方今聖神御天賢智在位五典􅀙而百揆叙三光明而九土平君子扵是退而歸曽閔事親之孝服冀缺夫婦之敬䔍夷齊兄弟之譲尚孔子子産􅅩牙夷吾朋友之風熈熙焉施施焉安其素扵其中田之廬如金君伯祥者亦可謂太平之幸民矣易曰父父子子兄兄弟弟夫夫婦婦而家道正又曰君子思不出其位其其不謂是歟天台陳基升其堂而樂之乃作詩曰莫髙者天日月麗焉莫厚者地河岳位焉俯仰兩間惟人實叅之厥有恒徳是以為秉彜君子􅁢蹈斯曰安素以家則正以􅀦則衮爰治我廬爰闢我室以敦我宗姓以樂我婣戚爰樹我桒爰藝我稷以製我衣􅄄以為我酒食天之與我惟曰有常分聖亦有言遯世而無悶匪髙􅂚以覆匪厚􅂚以載庶㡬夙夜永底無悔息畊亭詩有序余讀豫章鄭士亨氏息畊亭記見君子有髙丗之志焉士亨䔍學力行為文章一夲扵古使出而鳴􅀦家之盛則其志之􅀁存豈徒言㢤今退而畊扵野艾蓬蒿斬藜藿為亭以息其勞朝則服田事夕則誦詩書六藝之文以求周公孔子之道而其自附古人猶有􅂑扵擊壌翁嘻翁固髙丗之士也㢤吾聞后稷之治穡茀豊草薙稂莠去蟊賊然後苗之彂者堅秀者好而秋之穫冨焉士之扵道也亦然斥申韓茀豊草也距楊墨薙稂莠也排佛老去蟊賊也扵是禮以畊之義以種之而人情之田斯闢矣士亨之治穡不戾扵后稷則其扵道也固擊壤翁之道矣余未􅀎士亨以䆒其說扵其歸也賦息畊亭詩詩曰我畊扵野穮之蓘之我田既臧我苗日滋尔狼尔莠尓螟尔􅭈不務去之為苗之賊我田既登我稷惟馨維春維秋以甞以烝維我百榖匪種􅂚獲維我百骸匪勤􅂚息勤之以時息之以􅀁式謌我詩以御田祖送脫歡叅政詩有序叅政元鼎公以勲閥世胄折莭講學江漢間與寒畯韋布之士角藝有司擢髙苐為天子門生欝然以文學政事名當世由州縣厯􅀰署積官位執政皆在江西省用兵以来親與士大夫同勞苦凡十閱寒暑文武忠孝精敏􅅸人至正壬寅冬十一月入亰師道由淮䠂獲納交下執事終日論談非古今理􅅍則政事得失温乎其容藹乎其言浩乎其有源委也基㳺四方且老矣辱知公卿亦不為少獨恨見公之晚山東羣盗告平公買馬束􅏻治行甚遽基惜其去不敢㽞因賦詩以泄其思詩曰相見各云遟相别何太遽依依淮陰郭望望山東路山東路已平萬里接神亰衣冠朝鳯􅊴鴈行皆弟兄故舊驚還喜華髪今如此㽞得寸心丹歸来奉天子夷白齋藁卷之二十二
