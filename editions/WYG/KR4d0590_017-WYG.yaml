front:
  text: 之聲接吳壤浙右騷動呉獨以公故無恐公廉明敏斷行事適機宜申嚴約束日夜循行井里㰱血矢衆務僇力以身殉國用命者賞無狀者誅忼慨激烈士氣丕振吳民老稚相慶有歌曰公城我城公厲我兵公用法平又歌曰公保我妻孥公衛我室家公我父母報公何有君子曰李公其古之遺愛乎何輿人頌之如子産也天子聞之賜公爵優二等盖將因是而大公之賜始於吳逹之天下而輿人之頌史且不勝書矣噫李公其真古之遺愛乎乃論次公政績為之序以慰吳人感戴之意以布之四方以侈公之徳惠樂為天下道也至正十三年春三月書
  hash: sha256:77a648becca32b18856d5b4a897a6f86be1bf2d677b14a636b3f91cabcfe1250
