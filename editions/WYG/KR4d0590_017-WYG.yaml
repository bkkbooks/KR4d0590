  - {type: page-break, offset: 82, content: '', id: KR4d0590_WYG_017-5b, image: WYG1222/WYG1222-0272b.png}
body:
  text: 崔衢州政績詩序淮右妖冦為難禍延江東西守吏號能執干戈衛社稷者衢有崔侯焉初賊䧟徽饒乗勝入衢之開化踞縣治燒民居縱肆刦掠冦常山及江山時侯以同知升搃管設方畧利器械備禦惟謹至正十二年閏三月也未幾賊遁獨開化失守二十餘日居民驚散者復完聚也噫嘻衢之民其善知侯矣國家承平日久民不知兵一旦變起不測所在肝腦塗地井邑丘墟禍亦慘矣誠使撫字得人政平訟理則民入有父母出有司命而金湯之固不在堅城深池而天下乂安矣今衢有賢侯誠宜璽書褒奬増秩賜金以風邦邑乃嗟嘆不已而詠歌之其亦有待於觀風之使乎且聞賊在開化時獨不毁崔侯之碑衢城火獨侯之第無恙則天之眷祐賢侯將使人感之如狄使君而反風㓕火之異又將愛之如劉太守也余不佞敢論列咏詩者之意為之序以慰衢父兄夫豈惟侯之故哉亦樂為天下道也至正十三年八月既望書送陳惟允序予友陳惟允世家閬州七世祖宋宣和間進士歴朝散大夫居南康遂為南康人其先君子天倪甫師事故内翰臨川吳文正公誦詩書百家之言以隠徳終於吳家徒四壁獨遺書數百巻母夫人日夜督惟允與兄惟寅誦習之二子遂復儒業起家從容文藝出入縉紳大夫間而惟允尤善鼓琴擬古人摹寫山水木石為屏障瑰詭怪竒可愛今年春將去吳徃金陵因北上京師從四方名人魁士振纓儒林揚聲藝苑以其所能自見母兄樂其志既諏吉束裝以戒其行且以余同姓雅知其兄弟賢屬以一言壯行色噫世之飽梁肉襲紈綺入則華堂大厦出則結駟聨車果何如人哉然不易世子孫或飢寒困踣或為屠販為奴𨽻甚至為溝中之瘠者又孰使之然哉盖富貴無常不可恃也陳氏由閬州徙南康又自南康寓於吳門俛仰數世徒以朝散府君遺澤綿綿亘延至惟允兄弟孤落貧寠亦甚矣然猶知讀父書躬孝友駸駸信讓能文章為佳子弟先民有言損之而益敗之而成苦之而樂此造物者之於人所謂砥鏃而括其羽也今惟允以孝友為鏃以文藝為羽以孤落為砥以貧寠為括其材精其器利其去而與英俊角技能殆養由基之於射發則無不破的者惟允行哉嗣先君子之業慰母夫人之志迓續朝散府君之遺緒常所徃來者咸賦詩以宣揚之矣余不佞敢申一言以為序至正十四年春二月甲午書送李徳中序國家歲漕東南之粟每春夏由吳門抵直沽以億萬計今年夏漕府史宣城李君徳中以次當行吳之君子與徳中善者咸送之婁江之上且賦詩以華之盖徳中以江左衣冠家少從其鄉先生今兵部貢公伯仲㳺且宻精敏練逹克己清謹事賢漕長為良吏有多士之譽斯行也當見兵部公為我謝曰聖君賢相紹隆大業廓滄溟為餉道利舟楫為車馬其視秦之飛芻輓粟漢之負担千里唐之陸運水行率數十鍾而致一石者其得失不翅千萬矣間者又大興農政遣使江淮募民入耕大河之南遼水之東置庸田漕運司使地有餘利民有餘力功成事集將見中土之粟又百倍東南矣今歲可省夏運若干萬分饟淮楚因時變通以賛漕事此千載一時有志之士於此執文書叅幕府矢先士大夫僇力如徳中者兵部公顧不喜歟况公以班馬之倫居列卿之位且世為太史氏感明良之相逢覩庶政之畢舉與中朝能言者並為文章頌吾君之徳美吾相之功鏗鍧炳熠埀休無極嗚呼盛哉斯人臣之幸際也徳中行矣漕事告竣讌勞禮畢從兵部公優㳺咏嘆當筆受以歸貽東南人共歌之余不佞亦何幸獲覽焉夷白齋稿巻十七欽定四庫全書夷白齋稿巻十八元陳基撰
