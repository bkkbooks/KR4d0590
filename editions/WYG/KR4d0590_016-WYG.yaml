body:
  text: 序送張郎中詩序户部郎中大名張君師允以銓選使江西也道過吳吳大夫士之從户部君㳺者冠盖相望户部君皆折節禮下之及其將西行也大夫士之能言者各賦詩合古今體凡如干首俾予為序以送户部君禮也昔户部君以進士取科甲盖嘗擐忠信之甲胄執禮義之戈矛用其全鋒以與天下士决勝負矣其裒然而舉首也雖有勇如賁育急與之角力不敢敵其入翰林為史官由太常拜御史秉筆定褒貶執法論是非凜凛乎良史諍臣之風雖刼以衆沮之以兵弗動也及遷尚書為户部郎不逺數千里使江西右持衡左操權以銓量行省之人物其軒輊予奪皆懸户部君之手是行也意其必乗堅車擁髙盖聨駟結靷負弩矢前驅以夸耀四方乃今屏徒從撤儀衛謙撝卑譲自視若諸生日以禮接大夫士殷勤之懽惴惴焉惟恐失其心是念夫力能以布衣掇巍科魁天下士秉筆為史官執法為諍臣而不敢以尚書郎天子使者而失大夫士之心豈大夫士之力勇于賁育其勢加于兵衆哉盖大夫士禮之所在也噫禮之可以為國也素矣户部君不失大夫士心舉而措之則操軒輊以予奪天下之人物盖恢恢乎其有餘矣然士不以予奪為軒輊而以禮為去就者豫章徐孺子其人也户部君行矣銓選事竣舎車而徒步豫章溯孺子之遺風亦有下榻如陳仲舉者乎詩云髙山仰止景行行止户部君能以禮接大夫士則陳仲舉不得專美千古矣至正十三年三月甲午序白羊山紀㳺詩序勾吳沈髙士仲説澄靖寡欲誦詩書百家之言以孝義稱于鄉居祖夫人憂廬于墓側既免䘮隠居畊釣以山水自娛毎衣鹿裘着葛巾過天平謁范魏公祠徘徊不忍去間行其傍林塢得地曰白羊山而愛之將結茅讀書以求其志乃三月既望挈所知楚人朱安道舟行數百里至其處仰瞻天宇之髙俯瞰時物之暢追泰伯之遺風弔闔廬之故墟引筆賦詩搃凡若干首余得而諷詠之既嘉其㫪容閒逺有超世越俗之思又念不得從仲説䕃長松藉豊草歌考磐之篇咏伐木之章以寄情烟雲水石間然魏公之流澤未冺天平之白雲可望也它日命車白羊之麓欵門處士之廬而某丘某水將因詩以揬其勝則是詩不可以無序故樂為之書送趙知州序吳郡屬部由縣而升州者呉江其一也雖地方百里大抵具區之濱重湖複陂浸淫泱漶引三江而歸之海水之所不及者然後人得以藝其上故必謹隄防設機械率老稚疲筋力敝敝焉日與水争利幸天無淫雨歲之所入僅以輸租税供徭役否則溝塍畎澮淪胥為洪濤人困力殫而有司十一之征上下交病矣其州治又居水陸之咽喉符節羽檄旁午繹絡防守供億百倍他邑故任師帥於此者視他州亦難其人必徳足以宣教化才足以寄民社明足以聼獄訟敏足以裕軍諝而又濟之以亷行之以恕如前知州燕山趙侯其庻幾也初侯之下車也當國家責成守令之時侯首勸農桑均賦役飭學校簡詞訟以崇本抑末為務設施次第恪守章程及南北徵兵調發無虚日侯鞠躬夙夜弗遑寢食而民不廢耕桑官不缺餽餉使車馹傳擐甲胄援桴鼓之屬肩相摩而踵相接者不失勞來之禮噫侯可謂克稱責成之意矣三年政成解印綬戒車馬還京聖君賢相方綜核名實勵精為治若侯者考績酬庸將進而與中朝公卿大夫接武周行以熈庻務皆分内事不敢為侯頌獨論次侯在官盡賢師帥之職既以餞侯之行復以慰州人之思禮也送徐仲剛詩序無錫兩君子其一曰徐君元度仕為王官居京師有聲其一曰倪君元鎮隠居求志著書自善余皆辱交而仲剛徐君之子倪君之婿也徐君俶傥好義博雅有識度與名公巨卿㳺意氣許可有國士風倪君讀古人書忘飢渴為文章有魏晉間人氣韵其髙不仕之莭漢東都士大夫不是過也兩人者所趋不同要其歸激昻砥礪不與流俗同汨沒然兩家用是日益貧徐君㣲禄自養倪君嗜書自娱其子弟各習知其父意仲剛獨瓌竒敏給好禮而文居則從婦翁學為詩出則從父㳺於宦夫生長為名父之子出處問學不離二父之間仲剛之得於天者深而失於人者鮮如是哉雖富貴利逹不足為仲剛道然奉以周旋弗敢失墜此季文子所以為魯之賢大夫也仲剛勉乎哉凡與兩君子契厚者咸賦詩以美仲剛而屬余為之序送剡九成詩序至正十三年夏五月海漕發吳門漕府史吳興剡君九成實賛幕府吳士大夫僉賦詩以餞其行且曰去年春海冦犯崑山襲餫饟慿陵作氣勢以抗逆官軍淮右狂孽浸延江浙羽書徵發驛騷道路無虚日人心洶洶乆矣頼天子神聖賢相忠良命廉能果毅之臣搃漕事分遣將帥出師四討蚊蚋螻螘蠢動無知以次殱蕩海冦聞風率醜迯匿蒼皇䠞縮願宥罪自新用是人心之憂更釋然以喜九成博古通今器局𢎞逺論議慷慨為詩章居然作者乃今職文書賛海漕進無金革矢石之虞退無父兄妻子之慮左川后右海若風恬浪平一日千里而億萬之粟上以祀天地宗廟百神下以禄三公九卿百執事内以給宿衛外以足軍旅者不日逹京師春餫甫至夏饟踵來此國家萬世無疆之休臣子僇力報効之日也上尊之貺宫錦之榮視昔有加而九成仰則瞻都國之雄俯則覽山河之壯感聖澤之汪濊侈文物之隆盛所謂詩章九成之所長者將與中朝能言之士嗟嘆不足而詠歌之以極陳所遭之美異日南還解行李出所有吾黨好事者將争先覩之為快九成無以謙讓未遑為辭也送徐叔良序豫章徐君叔良從其鄉先生楊顯民氏學在京師也客翰林待制武威余公所而雅與新安程君以文善予雖不識顯民幸因程君而識武威公武威公視顯民雖出處不侔要與程君皆强志篤學為文章不詭仁義叔良㳺三君子間駸駸言行讀書作古今體詩不蹈時俗軌轍及武威公出僉浙東憲事未幾去官居淮西余亦親老還江南叔良與程君留京師京師之士非程君行輩則與叔良年相若率彬彬向用程君仕宦二十年業逾精身逾勞而志不少衰需次翰林為屬官老且至矣叔良學顯民氏學為武威公客又從程君居輦下借勢王公大人希進取宜無難者獨辛苦憔悴由京師數千里過吳門將歸豫章不果又復如京師噫是固學古之道者也吾聞古之道不足取於今然乎否耶雖然湥山之木巨細林立匠石操斧斤過之必取其堅實美澤中廟廊都邑之用者而木之堅實美澤恒出於風霜摧枯拉朽之餘盖損者益之本敗者成之基此造物者之所以玉成萬物也士之困窮憂患頓踣無聊所以動其心忍其性庸詎知非造物之意乎方今聖君在御賢相在朝左䋲墨右䂓矩以待天下之人材梁棟榱桷各随其器而任用之岩穴之材如顯民者將不得棄於斧斤之外則摧而踰堅枯而彌實拉朽而益美且澤者為何如也然則造物之所以司繩墨職䂓矩者之計久矣兹因叔良行以此謝程君并以為叔良贈云贈盧仲章詩序天台盧仲章以能刻金石為印章知名士大夫間士大夫之樂道仲章者咸貺之以詩仲章亦何能致多若是哉夫工商梓匠邦國之用器械之備養生送終之不可以或缺者也必服牛馬越川谷逹陵陸窮深極逺於中國而後可以通有無利器用而乃宫室具焉然而商不齒於士大夫工不得列衣冠之末何哉所業不同而所趨者異也今仲章之藝以為工乎則大夫士之所齒以為商乎則衣冠之所樂道而與進之不服牛不駕馬無陵陸之勞無川谷之險而亦以其藝交於中國其為用雖若無取於養生送終然大夫士似亦不可少焉噫仲章之藝亦善矣古者諸侯謂之章大夫謂之印今者夫人而用之矣仲章以其藝㳺於公卿大人之門而切切然從大夫以求其言何為也哉兹者有請於予也因書以歸之夷白齋稿巻十六欽定四庫全書夷白齋稿巻十七元陳基撰序顧生文字説序吳下縛筆生曰顧輔字友文其紥筆視近世吳興諸名家不多讓間請予説其字而序之其名若字盖本乎魯曽子所謂以文㑹友以友輔仁之言也曽子之言尚矣余且就生之業而為之説可乎昔之善言書者盖以刀弰喻筆焉故揚子雲曰刀不利筆不銛而獨加諸砥信乎刀不利雖有桓公之慈文王之琢太公之闕闔閭之干將莫耶不克以剸秋蓬剪腐卉尚奚取其斷犀象屠蛟龍而鋒不剉乎筆不銛則雖文犀之植象齒之管秋兎之毫豐狐之腋縁飾亦云侈矣以之為書則偃仰乖方向背失體縱横牽掣舉不適人意而書之道幾息矣然則砥削者固輔刀笔之美器也士之為士也亦然不博之以文則學不能殖不輔之以友則徳無從立故詩曰朋友攸攝攝以威儀孔子曰朋友切切偲偲揚子曰朋以磨之友也者其為士之砥削乎甚矣哉生之業克稱乎其字也是故非學不足以為士非友不足以立徳非言不足以埀世非筆所傳則不博而筆也者又士之所以羽之翼之左之右之以圗不朽者也噫生也不徒名其名將思所以行其行不徒字其字將思所以事其事不徒藝其藝將思所以試其試吾聞之有為者亦若是生之業既切於士之用生之字復切於士之學余且以是為生勉世之樂與為善者得無以為過乎昔庖丁好道而進乎技今生之業非直解牛者比也又庸知其非好道者然則予勉之也非過也李僉事政績序至正十二年春朝鮮李公仲善以浙西道廉訪僉事分憲吳下督行省兵禦海冦未幾淮右妖孽竊發屠郡邑殺守宰攻䧟湖襄蔓江東西羽書旁午告急無虚日人心洶洶吳為江表大郡界居水陸之衝東濱巨海南控甌粤西連荆楚無髙陵大谷以為之阻東南所賦水土百物吳為特盛倉廩府庫之所儲塒嵗輸京師以供天地神明之祀軍國之需與夫民社之所恃以為重者當務之急宜莫如城而吳城故閎壯周圍四十里舊址頽圮謀繕完之役最巨承平日久民習宴安不可與更始議下衆口交怨公乃集父老而諭之曰國家以熈洽之仁汪濊之澤休養生息爾父兄子弟久矣一旦冠起倉卒淮楚間環地數千里生民塗炭其故何哉城郭廢而兵革不飭也今吾奉天子命軫民生疾苦目惻無城之害而不與爾父兄圗之如事勢叵測噬臍之悔將誰任之吾聞備禦不虞政之善訓也故曰有備無患今吾用爾力新爾城深爾池整飭守具豈惟倉廪府庫是頼爾世世子孫將永利之乃計城丈尺視民產多寡募工分築有差民翕翕然趋事設楨幹審矩度萬杵齊奮殷若雷動公不憚暑暍親出入版築間勞撫士卒以恵濟威以勤率惰巨萬之費非常之功三月而竣公既統有司筮吉告神又具牛酒犒士卒報成事禮也方是時冦入杭繼入湖常燒民廬舎刦庫獄縱四掠熢燧熾甚退猶亡匿山谷間侯曰民不復業邑誰與守即馳至縣招集撫慰而赦其脇從者奉詔㫖也市井無頼勒取民財弗得則誣以賊執送之官侯察知其奸悉放之民用無寃死者尋督兵討捕獲首賊張嗣七等餘党復散入徽饒出沒不常其壤地與衢犬牙相錯開化為衢之咽喉浙東有衢猶門之有户也侯以開化失守則衢存亡未可保乃益募兵分守要害地已而賊復至侯率兵拒戰破之七月侯還至郡分省以冦未平復檄侯追捕八月敗賊於茗坑殺賊百餘首生擒十有二人分省多侯功賞勞有加九月賊勢復盛鼓行過富樓侯督軍民夾擊斬首四百餘獲方普徳一百十九名賊勢乃衰衢得以安邑父兄既刻石紀侯之績復相謂曰侯始通守吳邦屬四方多故首興學校以教吾子弟嵗旱則禱雨祈穀以活我老稚冦至則躬擐甲胄冐矢石出萬死不顧一生以捍衛我井邑侯治郡為賢牧守討賊為良將帥進不貪功退不狥私不虐無辜不專威福折衝果毅而濟之以廉和侯之徳非石不傳盖詩所以美盛徳歌休功而鉦鼓
