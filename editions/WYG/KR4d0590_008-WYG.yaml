seq: 8
front:
  text: 鄭有道喜王季野府判南歸二首故人日下拜官歸河水南來似帶圍策馬逺㳺天府勝食魚偏愛錦江肥蠶叢故國山猶在望帝荒祠鳥自飛萬里欲將慈母線芙蓉城裏製春衣
  hash: sha256:4f51c889781a05109ccb9e5c2a31107f6c292b9699d4d05d2692384bc11d5ded
body:
  text: 其二海榴花放客南歸喬木㕘雲摠十圍緑蟻奉親浮臘味黄羊充饌割秋肥恩承閩國榮三釡心切灤都望六飛錦里他年須報政中天風露濕朝衣次韻伯行投贈存齋風捲浮雲雨滅埃栁隂池館白蓮開放舟有客尋源至問字何人載酒來剡曲願從安道隠茂陵空嘆長卿才角巾嵗晚東林下短策逍遙步紫苔三用韻喜季野歸手攬繁弱接忘歸燕山射獵雪打圍駝鳴闗口曉風急馬牧原頭春草肥郷樹喜瞻親舎近蜀人爭候使星飛忼慨平生王子贛奮身叱馭肯沾衣寄季野積雨東臯如早秋公子不來令我愁題詩每憶許𤣥度賣藥敢期韓伯休栁隂繫纜水數尺竹裏讀書風滿樓長夏林塘何所似浣花溪上瀼西頭次韻劉徳芳經歴綺席無塵晏景光佳人宫様學時粧座傳白雪高難和澗采香芹淨可湘緑水紅蓮新漕幕紫薇青瑣舊朝郎鳯凰城裏曽聮騎一路㸔花到上陽送徐勉之慈湖書院山長兩度秋風刷羽儀一官江海尚棲遲簿書舊屈諸侯掾經術今為學者師天上文章囘北斗人間聲教極東陲殷勤束帶升堂日絶學憑將已易推送錢士能建昌知州建昌使君能且賢青春結客五雲邊致身得近二千石事主已垂三十年天削匡廬開菡蓞月明彭蠡浸嬋姢行春處處花如錦襦褲歌中咽管絃送王夀翁歸閩十日輕颷送海舟七閩歸去近東甌棹頭欲學孔巢父養子不慚陳太丘蠣房石暖隨時采崕蜜風酣帶露収故園歸老平生願殊勝官封萬戶侯次韻答秦文仲􅋈舟復向三江口載酒欣逢二仲來邱園束帛已加璧將相求賢無棄才栁色緑欺頭上雪桃花紅映掌中杯還思别後無知已從此柴門不浪開其二婁江繫䌫已十日故舊欣逢秦與文氣壓元龍餘子服賦髙司馬九重聞西山拄笏聊容我東閣招賢欲待君解却金貂換美酒賞花時節正春分婁江雜咏畫鷁東來肅斾旌郊原十日喜春晴彎弓㸔墮雲邊翮騎馬同登海上城欲向草萊詢隠徳每因稼穡見民情自慚肉食毫無補慟哭空悲漢賈生其二百雉堅城鎮海頭霜風中夜肅􅆛貅乾坤浩蕩鯨波息井邑蒼茫蜃氣浮民瘼東來皆可念妖氛西望未全収將軍莫負黄金印一鼓歸封萬户侯同文學古秦文仲㳺至正觀西郭維舟水滿津從容鄭圃得尋真蓬萊路隔人間世桃李花開劫後春風雨或聞蛟抒響絃歌曽與竹堂隣交㳺不忝羊求輩嵗晚相期跡未泯次韻答秦文仲郭羲仲聮句見寄客路尋常江海上春光强半雨聲中習池無酒醉山簡蓮社有心期逺公香燼旋温婆律火茶烟輕颺石楠風不因二仲聮詩至安得從容一笑同次韻錢都事誠夫海上書事左掖郎官漢客卿樓舡頻涉海濤平夢騎鸞鵠三山近胆落鯨鯢一劍横南斗星移天使下東吴兵振島夷驚君須早决平妖䇿杖節還朝答聖明送誠夫使吴門督漕兼寄分院同幕諸公掛㠶南斗畧扶桑奉使寜辭道路長轉漕復輸滄海粟勤王爭羡紫嶶郎風生漢節蛟龍避花繞吴宫雨露香同幕故人如見問為言相憶鬂毛蒼春日邵氏園池寂寞園林帶夕暉昔年曽此戀芳菲栁塘水暖鴛鴦浴花徑風酣蛺蝶飛蔓草拂衣人不剪畫梁無主燕空歸洛陽池館闗興廢我欲春山賦采嶶送胡宣使赴都進表使者樓舡上九天鯨波不動一帆懸表章入奏三千里海宇中興億萬年夏后山川仍職貢漢家勛業重安邊從知此去多恩澤㡌壓宫花錫宴還送髙起文歸越兼柬陳伯昂王夢强昔年同客百花洲繡幕珠簾映綺樓嵗月幾何成契濶兵戈相見獨綢繆開樽坐對吴山雨掛席行歸禹穴秋最憶吾宗陳伯子笑談真有晉風流其二甫里祠前憶舊盟朝飡杞菊暮蓴􅃵忘形真契葛天氏共飲况有申屠生古來結交貴知已亂後相别難為情西風又鼓濤江柂王衍為君雙眼明寄楊文舉經歴㑹稽從事獨逶迤拄笏西山秀入眉欲振家聲遵伯起不將文法泥宗師風塵此日淹騏驥霄漢他年見羽儀一曲桓伊江上笛夜深應有老龍知寄顧仲賢為問平生顧文學離羣近日復如何秋髙禹穴宦情薄雨過越山詩興多久客念君髭未白從君老我鬢先皤鑑湖一曲元無恙嵗晚相期載酒過次韻謝摠管送梅州判還崑山畫舡撾鼓待潮囬山色留人不受催官酒醉淹羅袖濕離筵愁聼竹枝哀秋風老憶淮南挂暑雨晴收海上埃莫學君家子真叟變稱名姓不歸來次韻謝侯寄梅州判昔日吾宗陳太丘為言梅福政偏優陳都事元禮常權知崑山州事故云魚鹽爭集海市曉雞犬不驚四社秋奕世羡君仍吏隠一㕓老我欲歸休裁書更謝錢塘守佳句難將雜佩酬次韻謝侯書懐使君五馬早承恩襦褲聲傳逺近村可為長生居鄭圃每因清嘯過蘇門香凝燕寢秋將肅露挹銀牀井不渾同樂堂中賔客盛旋烹佳茗當開樽十一月晦與同幕諸公登南髙峯因棹湖上小集二首共上南屏第一層海風吹鬢雪鬅鬙山盤地脈來天目城抱江流似蔣陵近郭晝行多畏虎並湖寒盡未收氷倚闌閒説承平事知是毘盧劫外僧其二落日湖光􅋈畫舡買魚沽酒不論錢共過天下登臨地却憶國家全盛年緑水映霞紅勝錦逺山凝黛澹如烟相攜此夕干戈際一聼笙歌一慨然正月五日省院諸公飲吴南城每因公事少從容今日傳杯興頗濃飲散城南浮畫鷁夢囬江上聼疎鐘長風萬里飄歸雁叠浪千層駭蟄龍同幕故人期不至曉山囬首􅊊巃嵸泊舟埀虹橋訪南北兩寺候蔡都事彦文泰伯城中不少留埀虹橋畔却維舟佛燈下照蛟龍宅蓮社平分雁鶩洲王事有程塵沒馬僧心無垢月涵秋多情為待同袍者徧倚䦨干不下樓次韻彦文寄謝省院諸公西山雪後色逾姸拄笏相㸔每自憐豈有異才㕘廟畧漫陪時俊列賔筵玉笙錦瑟留人醉翠葉銀花壓㡌偏却笑當年潘騎省為誰雙鬢早皤然其二此日東吴接勝㳺風流欲與古人儔城南美酒春初熟湖上魚罾晚未收才愧機雲還入洛功髙絳灌重安劉謀㕘帷幄輸公輩巢父歸歟盍掉頭次韻孟天偉郎中㸔湖十首海上初㸔一線低須臾排突與山齊平呑百粤天為塹雄障全吴石作堤浩浩鯨波流似帶紛紛蝸角鬪如雞世間别有風濤險莫向平途信杖䔧其二天風吹海恣崩奔一擲坤維勢欲翻正爾㫁鰲安地軸可容持鼓過雷門驚濤怒激英靈氣斜日潛消壮士魂却笑故都閒士女冶逰歸去近黄昏其三江源來自歙山幽潮勢憑陵江上頭紫葢黄旗收王氣素車白馬踏清秋至今故老猶興慨自古忠臣不自謀渺渺雲邊孤鳥没豈知人世有恩仇其四八月十八怒潮生猛於突騎白於繒風掀雲島神龍化雷吼天門赤鯉騰樓舡入海仙難問䲭革浮江史可徵揚旗勇踏濤頭去除却吴兒孰可能其五千古英雄恨未消海風吹上浙江潮怒驅􅆛虎誰能敵雄壓鯨鯢不敢驕踏浪掀旗空逺迓臨流捐袂若為抬扁舟浩蕩身先退輸與陶漁共采樵其六雪湧潮頭萬叠多秋風飄撃吼靈鼉直疑碧海金鰲擲復恐隂山鐵騎過勾踐功名今寂寞麻姑消息近如何憑君更騁神明力翻却蓬萊弱水波其七秋風酬酒待潮生渾似羅江吊屈平地下有霛驅海若人間無主聼阿衡恩仇莫辨君親分忠佞難逃今古評寂寞長洲走麋鹿不堪明月掉歌聲其八千古東南詫海潮摩娑强弩未曽銷氣乗日月分盈縮聲振山河欲動揺撃楫中流歌慷慨倚闌斜日鬢飄蕭錢塘美醖秋仍緑更與靈胥酬一瓢其九風起城南思慘悽獨攜長劍倚長堤未談秋水驚河伯先跨濤江掣海鯢力障狂瀾扶砥柱手揮妖祲豁坤倪東流不盡凭䦨意長嘯歸來日已西其十每因潮候卜灾祥今嵗潮頭百尺强千犀怒發鯨鯢吼兩乳峯開龍鳯翔乗槎直欲訪河鼓懸水不須誇吕梁徙倚江亭吾已老海風吹靣髪蒼蒼夷白齋稿巻八欽定四庫全書夷白齋稿巻九元陳基撰律詩七言次韻高
