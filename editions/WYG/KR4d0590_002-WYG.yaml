canonical_identifier: bkk:krp/KR4d0590/WYG/v1/juan/2
seq: 2
front:
  text: 梧桐墮金井寒螿泣露叢離居千里外一夕生秋風秋風忽已暮離索邈何處獨寐在重幃相從乃中路
  hash: sha256:4cefc8d91fb9675471e97b478dabe056ca4c40cab19a9f755ef5d606f023db97
body:
  text: 其三秋夜何迢迢迢迢不能寐起坐彈孤琴聊寫千古意鳴鳯乆寂寥猗蘭亦憔悴徃聖既莫作後賢孰為繼獨憐商山翁去去復遐逝空谷亦何有紫芝且可餌如何末路中亦墮留侯計羽翼倘不成鴻鵠恐埀翅茍可利生民寧辭暫紆轡區區後世名于翁何足計其四秋水不可涉美人安得從眷彼芙蓉花盈盈秋水中非無舟與楫所畏有蛟龍臨流不能採零落委芳叢其五羣動夜己息秋聲來何從仰視天宇高微雲邈無蹤明月在庭户河漢上縱横既莫知所始何由究其終我獨絃我琴微風入疎桐寫作清商調感慨意無窮其六昨日苦炎暑端居厭煩渇手短河漢高井深轆轤折此夕秋己清一洗塵世熱紈扇委深笥輕羅換疏葛天運無停機人生自悲悦急景一為遷流芳遂衰歇洞庭生微波明河湛秋月落葉辭故枝驚鴻亦飄忽為謝同心友胡為乆離别其七我有一樽酒獨酌不成懽豈無骨月親悠悠隔河山亦有同心友合併良獨難古人千載上世逺不可攀何如與明月徘徊松桂間月既知愛我流輝照衰顔我亦知愛月托心同嵗寒長願玉宇淨河漢生微瀾四海仰餘照親友各平安夜夜見明月人人無苦難此月不可負此樽不可乾天地等逆旅年華若驚湍古人雖云逺其言美芝蘭舉觴以和之對月更盤桓讀國語成周昔重幣欲以母權子用以實府藏為計無乃鄙塞川以為潢川竭潢亦毁至哉單穆公論列一何偉當世不見用後王宜鑒此厲王怒聞謗乃使衞巫監欲逞一已私冀彼萬口箝防民甚防川川壅宜早决民言苟不宣禍至恐為烈先王置謗木慮政有缺佚瞽史與矇叟賦誦左右規百工及庶人人賤言不廢聖亦擇蒭蕘賢當聽耆艾詠史百金購馬骨為計良己疎如何不嵗間一至三馬俱燕昭亦中主謀國乃不愚一聴郭隗言虚心闡良圖黄金築高臺束帛走中區瑶房間璚館窈窕貯名姝五鼎列珍饌駟馬駕華車今年迎樂毅明嵗迓由余秦城百二險六國日丘墟燕小獨後亡得士諒非虚昔者智襄子獨擅六晉彊一舉滅范氏再舉圍晉陽韓魏為執轡意氣何揚揚以水灌人邑自負莫能當誰知不旋踵身死國遂亡恃力不務德覆滅乃其常吾憐晉陽圍沈竈且産鼃不没僅三板民志卒無他乃知繭絲利不如保障多邯鄲非不實民膏鬰峩峩走逺不趨近君子意無那先王有所屬尹慈與民和智氏不好德獨奈晉陽何懷美人次友人韻出門日初昕入門日己隂懷彼千載人勞我一寸心嵗月忽云邁江湖一何深北度限太行南㳺阻桂林既負慷慨懷肯羨詭遇禽取此獨繭絲中有太古音寫作梁甫調嘆息淚沾襟待王子充不至屏跡逺城闕幽棲向林阿永懷同心友褰衣起婆娑憶昨走京邑彌年阻關河結客燕趙間頗覺增悲歌逸驥卸羈紲㝠鴻辭網羅所念聖哲逺中心覺無那夏屋廕嘉木芳池發新荷須君此弭節日夕共委蛇夏日喜友見訪兀兀少寤語悠悠多逺懷斂跡昉初夏凝神企心齋美人忽至止良友與之偕閴然類逃虚跫爾覯所諧跡邇志彌愜情敦禮無乖衣褐貴懐璧屬辭慚類俳積雨霽初夕清飈掃餘霾願言念幽獨日此憩高懷投贈同志仲夏暑氣溽平居愛高明奈此西日炎四壁鬰如蒸鳥雀亦苦熱羣飛繞簷楹念彼縞衣侣引吭一長鳴諒非丘樊姿緬懷霄漢情高槐蔚成幄稍稍清風生嘉卉亦自媚為我顔色赬攬物感時序興言揺心旌美人一水間累日廢逢迎投此以贈之聊復慰屏營次吕彦貞韻衛國不好士養鶴皆乘軒夏禹后之聖匍匐拜昌言峩峩十二樓上有孤鳯鶱覽德一下之顧肯栖于樊世無倜儻人嗟此復誰論洪河西北來萬里日趨奔學海有源委黽勉宜自敦况有典型在共此北海尊分省同幕諸公小集日出諸公館眷言欲何為名法非素習吏牘漫紛披况當兵戈際生民屬瘡痍愧非適時器徒蒙君子知今夕復何夕羣彦辱追隨繫馬及亭午開軒納凉颸須臾急雨至四座却莆葵呼吸異舒慘俯仰閱盈虧舉杯酌芳醪聊以􅇺衰遲知己諒難酬厚顔祇忸怩梅南書隠為上虞俞氏賦草木本無心人情殊所托豈伊臭味同政爾高風格眷彼東山陲貞葩爛林壑攬此亦奚為幽栖逺城郭玉立衆芳先氣壓羣卉弱詒謀豈無意迓續斯有覺圖書目前陳琴瑟時間作寤寐賢聖俱起坐塵坌却故俗仰堯封名山餘禹鑿擬賦嵗寒詩莫負花前約夏日齋居用蔡彦文韻微生一世間俯仰異今昨嘯傲羲軒際慷慨孫吳畧趨舍雖或殊浮薄得無怍含靈屬憔悴畏途乃盤錯視天河漢高涉海波濤惡三徑日蕭蕭五湖烟漠漠浩蕩魚鳥適偃蹇騏驥縛衆卉萋更碧孤芳萎已落動植迭榮悴崇深遂飛躍自得静中趣却慕方外樂况非軒冕姿謬膺菲葑托已與向平期終赴名山約分省早集懐同志諸公間嵗涉戎旅終年逺丘壑一為塵網嬰竟負烟霞約今日適公署時暑秋己薄山翠落簷楹湖光映簾幙同袍二三侣分攜異今昨畏途屬賢勞端居念離索蹉跎愧衰暮黽勉叅畫諾臨事每參差憂時空謇諤覽兹山水勝寫我情緖惡遲子蚤旋歸開酲共斟酌樓居樓居屬朱夏宴寢宜清晝㣲雨散空靄遥峰獻餘秀深巷頗紆轍良朋亦時覯尚論黄虞前足以發蒙陋何當稅塵鞅逺跡栖雲岫為謝荷鋤翁遲種南山豆彦文㸃兵餘杭富陽賦詩見示因次其韻四首出門難行路四郊人跡疏畏虎如畏賊餐米如餐珠驅車候明發㸃兵歴邊隅誓将殄妖氛聞者喜復歔誰能行伍間奮身先萬夫使者有所適陸行復乗舟迢迢餘杭道泛泛富陽流盡瘁乃明訓宴安匪良謀不貴徇名禄所期無悔尤自古君臣際同樂必同憂天髙河漢秋月白風露凉引弓激長矢願言射天狼仰天叱熒惑却立麾欃槍誓将七尺軀為此百夫防孤忠一以奮萬死庸何傷生民苦塗炭羣妖方弄兵大将肅旗鼓三軍嚴視聴所重奉天討慎勿妨農耕鯨鯢示兩觀熊虎行四征努力平南服以之答聖明分署望鳯凰山秋氣日以佳㣲雲不成雨青山天際来與我為賔主飛龍及舞鳯突兀在庭户須臾霧靄收草樹粲堪數蹇予麋鹿姿詎意嬰圭組䠞縮累天真驅馳漫塵土偶坐屬無喧晴容湛空宇欲去復徘徊此意當誰與西齋對雨次彦文韻江雨水雲國隂晴無定期靡靡嵗將晏悠悠夜何其驚飈一以勁落葉漫紛披人情異舒慘物運互推移君子懷端居𤣥覽乆忘疲客至即共飲酒行勿停巵奕勝不取速句巧寧厭遲霜橙眩餘緑秋菊含晚姿豈不念儔侣日夕共委蛇所覬葆冲和勿復費幽思池上空池約光景皎皎無緇粼性潔不容滓體虚能照人古人以水鑑鑑心不遺身所以解纓侣亦欲濯其塵纓解復可結塵汚不可清凝觀池上者當知清濁音對菊我有舊栽菊蕪穢北山隅朅來三十載誰復䕶根株非但嵗月乆况兹川路殊憶昔少壯時親愛日懽娛每逢佳節至掇英汎樽壺持杯送飛鳥飲畢卧蘧蒢今晨屬遲暮目斷歸雲孤終然嗜眞實時復過君廬送邵同知分韻得來字我折錢塘柳君上越王臺越臺今寂寞昔人安在哉空餘鏡湖水蕩漾小蓬萊千巖雨新霽萬壑浄無埃山色時時好荷花面面開流芳殊未歇爛漫待君來次韻沈仲説答蔣子忠遺山水便面詩端居宴修景尚論天人際紈扇逺寄將咫尺山水麗出入懷袖中盈盈落空翠樂此虞舜琴傲彼羲皇世穆如來清風妙與天者契夷白齋稿巻二欽定四庫全書夷白齋稿巻三元陳基撰古詩五言發
