seq: 9
front:
  text: 元善郎中見寄二律憶昔同參雁鶩羣每將騷雅佐人文詩成嶰谷鳴風竹琴罷瀟湘夢水雲南浦離情波杳𣺌北山歸思日紛紜可憐滿地秋如錦只有黄花好寄君
  hash: sha256:58cca7e59813b41c2717624db719b8d6095c657519a49a8b676b69e086e447f5
body:
  text: 其二詩酒相從嵗已賖幽居人擬地仙家别來九陌風塵外望㫁五湖烟水涯書就蜀箋文勝錦宴歸漢署㡌簮花他年或遂投竿志著我秋江倚釣槎元善嘗俾余記其所居松雲巢繼辱以詩為謝因次韻答之蕭蕭素髪魯東家豈有文章競綵霞髙世羡君期太白寓言容我詫南華神栖五老仙為侣夢繞三珠玉作葩為問松雲在何許此中不逺亦非賖舟中讀漢武帝紀髙王馬上爭天下丞相養民方致賢帝業不曽階尺土兒孫何以筭緡錢長生始悮神仙術巫蠱終虧父子天可惜春秋二三䇿獨留龜鑑後人傳次韻葉徳新江上觀兵一水朝宗控百川著鞭此日許誰先手麾􅆛虎風生海胆落鯨鯢劍倚天潮汐怒隨龍變化雲山髙作鳯飛騫元戎一鼓収南服持奉吾君憶萬年三塔寺江湖四月半隂雨山寺今朝方喜晴杖錫入城非避客琅玕繞屋正啼鶯寳樹著花當座落蒼龍分水入厨清好留一榻雲深處共話三生石上盟過本覺寺訪了庵長老無垢堂前曽屢過阿師行道近如何僧中此日如公少方外向來名輩多一室寳烟飄艾納六時花雨落芬陀寺門晝掩如廷尉滿地秋隂覆雀羅寄顧高士每憶吴門顧辟疆舊開池館帶滄浪緑波芳草盟鷗鷺錦瑟玉笙悲鳯凰座客詩成誰最好故人酒後我多狂扁舟來往鵷湖上老到猶能賦草堂寄鄭明徳牢落乾坤獨鄭䖍丘園風雨故依然腹藏𤣥晏書千巻身受滕君宅一㕓雲臥蝶迷遺世夢林居鶴避煮茶煙揚雄自昔多竒字老我猶乗載酒舡過三塔灣留題緑水灣頭維畫舫白雲堆裡訪禪林上方樓閣丹青古下界蛟龍窟穴深五月鶯聲山寂寂一簾雨氣竹森森地霛不受昆明刧留得長松喜十尋再次韻答明徳煉石無心補漏天幽栖環堵獨蕭然松蘿雨後生朝菌藜藿年深沒故㕓足濯滄浪池上水衣薫豕虱竇中烟林居似厭城南淺重擬歸乗谷口舡用韻答沈仲説結客東吴憶盛年多君燕處每超然千金昔棄朱公産一畝今無許子㕓濯足洞庭天拍水掛㠶笠澤栁含烟相逢一笑榮枯外猶勝虚乗訪戴舡寄錢成夫員外千里從君客楚州故人吴下獨維舟闗山别後鄉書少淮海平來相業優龍虎帳中勞逺望鳯凰池上莫多留平生愛殺韓司馬老我何妨讓一頭寄蔡彦文都事蔡子才多病亦多尺書千里慰蹉跎同㳺暫阻紅蓮幕相寄慚無紫玉珂交義人人推管鮑新詩字字擬隋何淮南賔客如君少未許淹留桂樹謌九日百年忽忽成何事九日匆匆不在家莫遣秋風吹短帽羞將白髪對黄花詩因撥悶聊時賦酒為消愁亦漫賖欲向楚城高處望不堪離思滿天涯九日柬同幕諸公兼寄吴中兄弟官舍蕭條淮水濵一樽九日漫相親那知黄菊籬邊客不笑紫薇花下人秋鬢白嗔烏帽側衰顔紅愛緑醅新吴中兄弟應相憶悵倚秋風北望頻阻風仲舉舟中小酌千里旌旗映日紅一天秋雨忽濛濛郷書未有東南信客路不堪西北風泛水芙蓉依繡幕背人鴻雁避雕弓淮陽酒薄猶堪飲時復相逢共一鍾墻角種菊三四本頗可觀一官跋涉客天涯頗覺秋來興味佳有菊便同陶令宅無錢誰笑杜陵家幽叢宻護霜前葉嫩蕋輕含雨後花賴有新詩相料理淮南酒薄不堪賖淮隂雜詠千里相逢淮海濵一枝誰寄嶺梅春老來易感山陽笛年少休輕跨下人失侣雁如秦逐客畏寒花似楚遺民每過百戰瘡痍地立馬西風為損神其二匹馬淮隂秋復冬每尋陳跡意忡忡下郷賔客貧無行南郭先生老病聾漢室功高羞絳灌射陽門貴擬騫弓至今七尺城東墓一酌寒泉感慨中又落木蕭蕭雁渡河西風嫋嫋水増波甘羅營裡秋聲急朝信城頭月色多淮市有魚聊可食楚山無桂不須歌古今無限闗心事付與當年春夢婆又江左妖氛掃未清山東豺虎又縱横欲令斥堠収烽火須挽天河洗甲兵老馬獨嘶時北望賔鴻相喚盡南征腐儒愧乏匡時術搔首風前百感生又兵火燒殘百草根人烟無復萬家村黄金未鑄忠臣􅇧白馬空招帝子魂易水有情人已逝睢陽無援事難論何當親斬樓蘭首仗節歸朝報至尊寄吴中分幕諸同志故人入幕蘇臺上老我從軍楚澤隈江海十年同聼雨闗門千里獨持杯適書到日多憑雁馹使來時好寄梅慙愧紫薇花畔侣却依南斗望三台寒菊徧開可喜漫向隣翁覔菊栽晚花疎蕋一時開寒欺楚澤三秋露暖透山陽十月雷多事狂蜂忙采去惱人輕蝶競飛來蕭齋對此無聊賴莫怪頻傾濁酒杯寄唐伯剛㫁事寒菊花開照眼新客忩風物未全貧旋賖陶令杯中酒敢比羲皇世上人官事有程仍笑傲郷書無便任因循故人十月錢塘路誰謂城西探小春寄陳庶子㕘軍兼柬饒介之郎中楚天漠漠水迢迢千里懐人不自聊帷幄喜聞延曲逆行間幸忝事嫖姚江空不采芙蓉寄嵗暮惟歌桂樹招華葢仙翁如見問為言髀肉近多消寄謝從義㕘軍兼柬唐伯剛㫁事江左風流謝使君賦詩渾是鮑㕘軍一麾舊作錢塘守萬里新空冀北羣官栁枝枝垂楚岸賔鴻个个入吴雲題書為報西樞彦十月山陽尚有蚊寄周信甫王叔明二長史帷幄賢勞夙夜賔古今儒律兩彬彬漢廷重厚惟斯老江左寜馨有幾人霜落吴門天接水雷鳴楚澤雨連旬黄粱已熟淮魚白南國秋風時憶蓴寄錢伯行檢校葉徳新椽史少日錢君同汗漫中年葉椽共翺翔北忩坐傲羲皇世南省行陪漢署郎笠澤芙蓉秋萬頃楚天鴻雁日千行幼輿若許歸岩壑便結茅齋野水傍寄沈達卿陳子方二理問二妙相看如弟兄白鷗波上忝同盟老來轉覺襟期好别後令人鄙吝生萬里􅆛貅方北戍九秋鴻雁盡南征洞庭橘熟香醪嫩心渇還思阮步兵和周太常寄貢祕卿詩五首兩翁臺閣逥翔日千載文章全盛時太史世家羣彦服中郎筆法九重知西清近識天顔喜南海遙分漢節持經緯論詩深有待未容採藥訪安期又二老故郷江漢東兩家文獻夙相同吴闗望闕聮歸轡閩海勤王謝轉篷禮秩漢郊修雍畤道宗魯國仰龜蒙共將千古文章印力障狂瀾洗陋風又世路間闗嘆仳離斯文誰與挈綱維近聞東觀除書下未覺南冠寵數卑政倚叔孫興禮讓終知汲黯係安危漢廷獻納須公等一代儀刑奕世垂又詞源變化共神謀一洗人間蚍與蜉老來偏厭干戈熾此去定分宵旰憂館閣經傳劉向業闗河人望李膺舟白首自慚無寸補漫隨行伍事防秋又平生筆諫栁公權鶴髪還朝各皓然榱桷棟梁収恐後麒麟鸞鳯覩爭先太常議禮推王肅金匱紬書待馬遷慚愧當年秦逐客只憑魂夢到鈞天夷白齋稿巻九欽定四庫全書夷白齋稿巻十元陳基撰
