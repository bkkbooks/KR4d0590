body:
  text: 律詩七言送彌陁保世衡聞人徳機二解元赴省試一舉收功古戰場計偕同上紫㣲傍手攀明月分仙桂足躡青雲見玉皇髙第世推唐甲乙直言人比漢賢良明年晝錦歸來日一色恩袍雨露香送丁太初嘉常二貢士赴省試兩賢攜手上南宫掛席闗河得便風欲把姓名題甲乙須將文字决雌雄一經昔向江東學萬里今㸔冀北空遙想殿頭臚唱畢五雲佳氣􅊊葱葱送牛述善郎中還朝萬栁亭前一酒杯馬蹄踏雪上金臺天門星應郎官至海岱春隨使節囬宣室復陪前席問上林曽壓衆芳開諸公若話東南事楚澤無氷有草萊自淮安使江南舟次通州寄同幕諸公頻年共入嫖姚幙此日先乗使者舟海色曉迎龍虎節天光寒動鷫鸘裘山川咫尺分吴楚河漢尋常近斗牛南鎖堰頭官栁樹春風相約繫驊騮又狼山山色碧崔嵬秋半從軍臘底囬夀酒欲歸吴下獻使星新自楚州來江城見月思聮句馹路逢春擬寄梅只待年頭便相㑹欣將懐抱為君開由通州度江白首輕抛種樹書漫陪帷幄强馳驅半竿紅日辭淮甸一席清風上海虞欲向中流安砥柱恨無長劍斬鯨魚晚投言子祠前路坐聼絃歌意有餘福山港口待潮吴山如畫楚江平稍得孤帆半日程潮落沙頭纔一尺舟停江口復三更時清不識風波險世亂方知性命輕坐擁貂裘待明發臨流空愧魯連生癸夘二月十一日官軍發吴門去年移戍秋將半今嵗渡江春正分晉國偏禆歸宿將漢廷旗鼓屬元勛戈舡十萬盡犀弩鉄騎三千皆虎賁却笑髙陽老狂客漫憑口舌下齊軍二十日福山港寄省院諸公漢將西征肅羽儀簡書日日有程期東溟潮上犀舡發南斗星横虎節移青入楚封山㸃㸃白添吴鏡雪絲絲美人宴罷芙蓉署一色銀花翠壓枝舟中㸔虞山有感一望虞山一悵然楚公曽此將樓舡間闗百戰捐軀地忼慨孤忠罵冦年填海欲銜精衛石驅狼願假祖龍鞭至今父老猶垂淚花落春城泣杜鵑二十二日狼山口觀兵官軍野次狼山口鉄騎犀舡盡虎貙杼軸萬家供餽餉旌旗千里亘江湖膝行擬伏諸侯將西縛宜申兩觀誅淮海父兄爭鼓舞將軍定是漢金吾㳺狼山寺天風吹上狼山頂㸔見扶桑日出初淮海北來呑兩楚江湖南去控三吴珠宫貝闕馮夷宅古木蒼藤帝釋居為訪祖龍鞭石處拇窠履跡定何如其二鯨波𣺌𣺌四無涯閶闔天低水可排一塔撑空凌浩劫兩潮爭港撼層崖半晴半雨龍歸海衝暖衝寒雁度淮安得乞身依佛日徧尋靈跡訪齊諧其三五峯相顧若支撑力障狂瀾與海爭下界人居河伯國上方僧住棾王城佛庖香訝山無蕨公膳腥嫌市有蟶王事匆匆䇿馬去落花啼鳥不勝情寄朱佑之經歴老我思歸臥紫霞多君能賦吐天葩十年跡沗嫖姚幕千里身輕博望槎楚甸風髙塵没馬蘓堤春暖栁藏鴉何時共倒西湖酒爛醉孤山處士家寄張長年都事南京郎官也好竒文章欲以古為師獨來楚澤從戎地長憶吴門並馬時二月西湖春爛縵百年北海酒淋漓此心頗與君同調一曲梅花嵗晚期二十六日自通州赴淮安海虞城外經旬泊狼五山前信宿留六計西來思撓楚三軍左袒願安劉龍光夜吐雌雄劍魚尾朝啣甲乙舟今日南風催掛席浪花飛雪打舡頭寄夏仲信太守韓璧翁經歴姚伯升照磨淮海從征道路長美人千里遙相望無錢太守客盈座好事郎官書滿牀花氣曉迷三竺寺栁隂晴繫六橋航懸知小隊行春處露濕馬蹄芳草香髙郵湖夜行天明過寳應秦郵城外望安宜㠶飽風清似馬馳三十六湖春欲暮一千餘里客來時背人鴻雁歸何急近海魚鹽利不貲農事及時兵有律便無神寳亦何疑二十九日至淮安城南十五里述懐欲向江湖覔釣磯此心長與事相違添丁未遂盧仝計筭老空知伯玉非淮海草肥宛地馬楚州人著漢官衣將軍奏上平西捷還許山翁倒載歸到南鎖寄分省同官故人近在淮隂郡未見先馳尺素書知己每慚齊鮑叔論人只許漢相如便須為我占烏鵲不用呼童烹鯉魚自笑近來頭盡白强顔乗馬事穰苴三月十五日由淮安使江南别同官三月淮南栁色深相㸔去住兩闗情鶯因求友聲逾切雁為離羣意不勝芳草將春青楚甸暮雲含雨碧吴岑遂初自有平生賦何事馳驅雪滿簪三月二十五日由吴門使杭昔年戍浙今移楚新嵗趨吴復使杭南北此身皆客路東西何處是吾郷野花送别紛紛落官栁縈愁故故長漫道五湖春色好為誰消得鬂邊霜閏三月四日夏仲信太守邀㳺飛來峯次顧子經照磨韻千岩萬壑响奔雷分得西天小朶來雲氣滿林山韞玉松隂帀寺榻生苔煙霞竒跡何時遂猿鶴留人未擬囬今日使君蘓白輩醉歸城路近三台其二飛葢今朝天竺寺泛舟昨日小蓬萊五馬斾旌三月暮四山煙霧一時開蒼藤古木藏靈鷲絶壑奔流吼怒雷使節行行趨兩楚碧雲囬首􅊊崔嵬分省諸公邀集西湖湖上相逢宴屢開紫薇花下約同來水光釀緑凝歌袖山色分青入酒杯蛺蝶影隨羅扇動琵琶聲逐畫舡囬獨憐忠骨埋芳草南拱枝頭蜀鳥哀閏三月七日過三塔寺留别寛長老軺車來往每匆匆此夕相㸔一笑同軒外竹添千個緑樹頭花吐萬枝紅茶烹日鑄龍分水榻近雲巢鶴語風梔子雨肥蕉葉大愧無佳句續韓公閏三月八日泊舟三塔寺新仲銘長老出城相㸔我愛水西新仲銘道空諸有話無生出城㸔客意最古把筆題詩才更清杜若洲邊春欲暮鴛鴦湖上雨初晴十載間闗重相見深杯寜惜為君傾吴江釣雪灘邊暫泊舟晴江千尺飲長流吐呑日月天無際出没魚龍地欲浮濟世誰當扶砥柱乞身吾合老滄洲裁書為問天隨子杞菊荒來又幾秋初八日阻風宿吴江無礙寺龍伯留人暫􅋈舟偶過西寺得詩流僧忩烟景五湖晚澤國雨聲三月秋我欲掛冠來釣雪誰能作賦共登樓此身何日都無礙共向毘盧性海㳺西寺送道元信長老還吴興楊墳寺翔鳯山前水亂流垂虹亭畔月如鈎賦詩不讓湯休輩入社惟慚元亮儔夜雨西忩重剪燭春風南浦共維舟他年一榻封禺下笑傲能容此客否次韻謝元懿移居後見寄羡君早學公孫龍堅白因時辨異同狡兎窟多寜逺害鷦鷯枝小不禁風山林夢寐隨麋鹿賔主情懐類蟋蛩幸有故人周閣老時時分祿餉而翁其二手植新松引舊蘿人間得失付南柯粟儲已罄琴書在家具不如車兩多短􅄚肯嫌苔徑滑髙軒時向席邊過新詩恵我皆珠玉報乏瓊瑤奈若何夷白齋稿巻十欽定四庫全書夷白齋稿巻十一元陳基撰
