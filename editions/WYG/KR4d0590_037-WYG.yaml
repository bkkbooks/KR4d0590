body:
  text: 祭故平章榮禄張公文嗚呼謂天無為而生公耶則公之器量超乎等夷謂天有為而生公耶則公之事業不宜僅止于斯夫力足以任天下之重而明足以燭事理之㣲竒謀足以坐制千里之敵而英畧足以立决兩陣之機謙讓足以延攬四方之俊而威武足以雄驅百勝之師恩信足以得三軍之死力而仁義足以極萬姓之顛危而天不愸遺痛罹此極使千尋之木弗能扶大厦之傾萬斛之舟弗克濟蒼生之溺此天道之所以不可必而君子之所以長吁而太息鸞鳯豈不祥于梟獍麒麟豈不仁于虎狼蛟龍豈不神于螻蟻莨莠豈足侔于稻粱今妖鳥得以賊祥禽醜􅖈得以辱仁類蠕動得以凌介族之長惡草得以為佳禾之害豈天未厭亂而仁者不必夀耶抑民之無禄而淪胥以死者不必救耶何公之不幸一至于此而蒼蒼彼天竟孰尸其咎耶然公能以貴下賤而不肯屈身以從賊能以仁伐不仁而不能臨難而辱國能厲聲罵賊而不能與之俱生能視死如歸而不能食不義之食盖公之生也民有父母君有股肱公之死也豪杰失倚賴君子失依憑獨忠肝義膽通神明而貫金石英聲盛烈掀宇宙而震雷霆上可以爭光于日月下可以垂休于汗青此所謂沒而不朽者在公可以無憾矣然復讐之義不舉則終天之恨不平四郊之冦壘不除則九泉之目不瞑某等之所以痛哭流涕而不能自已者以首見招于麾下繼辱荐于朝廷義雖均于僚佐恩難忘于死身既不能漆身吞炭報知于國士又不能奮椎操匕効死于賊庭惟鞠躬盡瘁恪勤于王事夙興夜寐勉强以力行臨風一奠上以為軍國慟而下以哭吾軰之情祭沃哷亷使文嗚呼哀哉公止斯耶豈天惡正直神好詭隨耶讜言無避者恒不利于世而秉心忠亮者不必期頤耶將蒼蒼不足問而吉凶禍福初莫知其所尸耶公之剛腸嫉惡得于天者獨厚及以言得罪戾于人者又何其顛且危耶如使正色以立朝明目而張膽則英風偉節夫豈補其缺而拾其遺耶及權倖悞國是非乃明而天不假年果孰嗇其施耶豈謇謇匪躬者道不昌皎皎不汚者數必竒耶凡有識之士莫不聞風而扼腕况某也辱知于公又特殊于等夷耶托交二十餘年契濶三千餘里始終疏逖如一朝夕豈非生同年學同業而道同師耶持節南來庶幾相見以慰饑渴又豈非以一葦可杭在浙水之東西耶豈期一疾不起遽罹此痛而終天永訣孰謂魂氣無所不之耶夫忠義足以正風紀氣節足以厲亷隅此所謂没而不朽者將百世以為期耶顧親老子㓜而琴亡人逝質之天道則仁者有後固不可得而欺耶某也義當匍匐撫棺就次以哭知已之私念竊忝王官駿奔戎旅所不能自致者死者豈必無知耶銜哀致誠徃申一奠天乎痛哉孰使涕泣之漣洏耶尚饗原闕夷白齋稿拾遺徐君孟達壙銘吳人徐君孟達諱元震世居嘗熟之虞山考諱敬益陽知州妣虞氏封東海郡君初益陽府君之官于朝也君以俊乂游成均為博士弟子員精敏瑋琦最為府君所鍾愛故徽州路儒學教授甫里陸公徳元時客京師見而竒之元統初府君出知明之昌國州需次里中君以佳子弟周旋府君左右進止不凡教授見而喜曰此子真千里駒也吾屬意乆矣遂納以為婿陸氏家素淳儉教授公尤慎重務以詩書承家君既入贅事教授公如事府君克意承順委曲偹至且以時節省府君於昌國尋丁郡君之憂哀毁盡禮居久之教授公捐舘君獨以身任遺孤之責保抱扶持俾娶且有子而陸氏之業因賴以弗墜人謂教授公有後君之力也及府君以疾終益陽扶柩歸塟常熟之先隴親朋送者雲集凡塟祭百需視禮所得為哀禮兼盡君俶儻有卓識雅重然諾樂應人之急遇事立决機警絶人而以仁厚將之雖委身閭里不屑仕進而英風駿望卓然于縉紳公卿間與人交不以疏數為厚薄臨財不茍惟義之所在方營别業于松江笠澤之上聚書教子歲時伏臘幸麤有餘將與所知優游以卒歲不幸一疾不起以至正十五年七月七日卒于家得年四十有七妻名仲端有婦徳子男二人長曰緬果毅好學次曰朂㓜而克肖女一人適同郡曺元越七日丁酉緬朂奉柩塟于吳縣靈岩鄉陳灣東横山之原嗚呼君托人之孤周人之急刻身砥行始終無怍而天不假年夀不稱徳此君子所以哭之慟也臨海陳某辱知君特厚義當銘其壙銘曰維孟達父世吳人有才弗施善其身托人遺孤力千鈞之死無怍勒貞珉有孔勿替在後昆夷白齋稿巻三十五欽定四庫全書夷白齋稿外集巻上元陳基撰古詩四言題朱買臣負薪讀書圖我樵于山我負于路讀書自娛匪鼂伊暮靡咈爾心重失我度我印既纍我綬斯若爾毋我尤我不爾怍彼美宋女亦遼以邈古詩五言妾薄命妾本良家女錢塘江上居生來不出户只學繡羅繻父母偏愛惜無異掌中珠十八許隣里二十㑹葭莩低頭奉箕帚和顔事舅姑誰知輕薄壻零落在中途結髪願偕老寧不共馳驅昔有梁上燕托身君子廬今如水上萍飄泊任江湖自嗟妾命薄忍死亦須臾生女為人婦願嫁得其夫嫁夫一失所不如棄路隅春日江上海宇屬清晏乾坤大無垠憑高馳遐觀臨流滌煩塵雲日湛初霽山水蕩餘春陽徳舒桑和品彚競妍新矯矯雲端翮洋洋藻中鱗感彼翔泳適悟茲涵煦均良時不再得芳年難重臻願言乗清颷邈哉霄漢津發大都結髪事書史及壯服冠裳逺遊至京師永言觀國光叨逢堯舜時拔擢登明堂佩以明月珠被之雲錦章驅車未及門平地生太行丈夫慕前修出處豈有常但念平生友惜别衢路旁惟願各努力矯首永相望涿州仲冬過漁陽風日正凄厲嗟此豪俠窟自古稱壯麗煌煌神堯業起自艱難際奈何至中葉四海皆鼎沸良由開元主養虎以自噬惜哉曲江公忠言亦何濟居人一何幸屬此承平世畊牧畿甸門聖澤湛汪濊連山接神皋旭日生爽氣獨憐去國人南北從此逝任丘迢迢去京國行行適任丘城郭何蕭條關山良阻修日入就逆旅燈火稍綢繆薄酒不堪飲何以消我憂㝠㝠天際鴻沈沈波上鷗往者固莫追來者當自謀獻州驅車官道旁四野積陰沍中路忽改轍前行屢回顧遙瞻獻州城未至日已暮﨑嶇丘隴間足趼不容錯須臾近烟火謂可􅇺情慮不覩主人面反遭邑犬怒僕夫亦已疲黽勉羞草具飢來罄一飡已飽復何慕阜城憶昔日下歸已甘棲遯跡胡為負初志三嵗四行役我馬不及秣我僕不遑息荏苒嵗月暮展轉憂患迫朝行過阜城原野霜露白一身如鴻毛苦厭天地窄凌州曉出凌州南晝行泥淖中一步一踟蹰四顧心忡忡牽車誰氏子自言業為農頻嵗值大水田廬為之空家有白髪親日食憂不充辛苦事商旅庶以供饔飱維人生兩間所貴親愛鍾貧賤茍知養奚必禄位豐丈夫畏天命敢不哀人窮生世苦不偶何由恤瘝痌荏平客行荏平道日出天皎皎泰山何巖巖雲開豁穹昊生逢全盛世悲歌入燕趙跋踄雖辛苦愛此風日好關河路緜緜江湖雲渺渺嘆息梁父吟慷慨令人老穀城山晨興發東阿薄暮抵穀城黃石去已久兹山尚崢嶸伊昔秦漢時豪杰紛縱橫卓哉張留侯視秦如孩嬰奮椎博浪沙賁育莫敢爭顧獨奉公履俛焉若諸生授書何必多恍惚通神明卒為帝者師功成業顯榮飄飄逺遊子天寒獨遐征徘徊撫松柏俛仰有餘情舊縣披衣聴雞鳴膏車待明發蕭條古東阿雉堞帶殘月紆餘入空谷躑躅尋舊轍前瞻閴無人四顧皆積雪悲風泱漭至僕夫慘不悅馳驅二十里晴旭生木末稍忻山色佳緩轡行復輟我生何不辰奔走恒歉歉賦命與仇謀艱危難具說蹉跎三十餘益嘆身世拙豈無浮海志實恐甘㫖缺緬懐古聖賢感激中腸熱汶上我行汶水上解纓濯煩塵閔子安在哉流波尚潾潾子昔當衰世不肯從陪臣我幸遭盛時言歸事吾親泰山雖云高希之在其人恭惟無間言敢不書諸紳施家莊陸行已兼旬嵗暮成勞苦積雪兼層冰跬步憂齟齬暝投施家莊居民喜相語累日陰沍消舟行了無了勇辭所乗車側耳聴柔櫓棹歌雜吳謳頗覺􅇺羇旅人言前年夏洪河走平楚漕渠當其衝漫漶不可禦民廬悉漂沈桑田渺何許所以亡命徒潜踪匿蘆渚乗間作盜賊往往遭殺擄我方為飢驅願言適樂土中原不稼穡去去復何所徐州一昨始入舟遙望徐州郭水行已信宿甫至城下泊洪濤激長空驚風怒相薄乾坤無端倪雲水互叅錯初疑鯨鯢鬭復恐蛟鼉躍篙師為蒼茫客子俱駭愕傷哉楚君臣霸圖已寂寞空餘蘇公樓突兀倚寥廓徐人昔恃公安若山與岳文章與元氣萬古相磅礴大河失故道崩奔勢逾虐生人化魚鼈中州廢耕鑿安得不世才為君拯民瘼九原何茫茫可愛不可作蓋都子倀倀蓋都子牽車渡河水河水結成冰亂石森齒齒父後子居前父輊子輒軒寒風切肌骨手足為拘攣躋攀上平路不敢復回顧未憂子力疲當念父辛苦龍橋婦婉孌龍橋婦空閨何惻惻夫婿弱冠餘南征死鋒鏑但見隣人歸不知夫蹤跡委身奉舅姑誓志如金石朝採陌上桑暮向忩間織織成錦回文無處寄消息織成雙鴛鴦無復合歡夕何如織縑素裁剪信刀尺為舅作衣裳為姑辦飲食分韻得老字華軒列綺席嘉樹蔭芳草愛此時雨歇緑陰凈如掃君子謝軒冕逍遙遂幽討有瑟復有琴自歌還自考達哉松雲翁狂歌不知老送王本初縣尹兼簡本中知州憶昔至正初北遊客京師辱交伯仲間日夕相追隨磊落青雲器聨翩丹鳯姿愧無高山調酬君白雪詞俛仰八九載南歸滄海涯竊聞霜臺上風猷夙綱維允矣伯氏賢克當明主知仲氏貳安陸重為人所推中朝名公後復始非君誰前年復至京伯也官于磁治州如室家拊民若嬰兒靈草毓三秀瑞麥生兩岐伯也置不言獨咏豐年詩凜凜君子風不啻先公為政成報天子寵錫多光輝人言古循吏龔黃邈難追孰知忠厚化昔聞今見之仲也復為邑鄆城鬱巍巍朝廷重守宰簡書有程期一門雙南金共下白玉墀又如兩騏驥為主効驅馳河水昔橫溢生人四流移乗間為冦攘觸罪姦有司坐論齊魯俗化為蠻與夷今君寄民社所念當在兹願試父兄術為民瘳瘡痍君服亦已華君佩何陸離朝發江之滸暮宿河之湄行當見伯氏為我道暌違清樾堂詩為沈重說賦君子締新構樂此靜者心徳陽一以亨衆木蔚成陰攬物感流景當軒理素琴永懐烏鳥情肯為遊子吟回颷薄煩暑靈雨洒中林為君賦行葦願言酬徳音時重說祖夫人年九十被賜帛之恩故末章及之釣月軒開門得新月褰衣涉芳沚我意不在魚投竿聊爾耳素娥一何好娟娟映秋水重惜此流輝徘徊殊未已東原行天寒日晷促車行何轆轆大車利宵征小車宜早宿使君徒從多使君號令肅何如原野間年豐秋有粟古詩七言題趙千里江山秋晚圖秋山遙遙秋水濶秋風冉冉生蘋末夕陽逺樹集歸鴉慘淡人家帶林樾我聞趙家父子工丹青劃然見此心目俱開明人間何處有此境無乃瀟湘與洞庭白波青嶂天冥冥熟視彷彿聞秋聲依微曙色生浦漵又似滄浪歌濯纓東吳陸君好竒古何從得此歸囊楮我亦從此時一覩為君題詩三太息良工良工心獨苦七月望日值雨宿窖中西游復入河東路複巚重岡愁屢度崎嶇五里不到河忽雷椎山雨如注須叟百水爭怒流澒洞有若龍騰湫熊羆遁藏虎豹伏魑魅亂呌狐狸愁我馬一步一回首陰風吹人股為慄破㡌籠頭衣露肘疾呼東來皓首翁問勞慰我心忡忡相延入谷已暝黑下馬共栖營窟中不知今夕復何夕俯仰人間長太息勞生何苦為形役歸有衡門可容滕贈黄瑞卿有序禄命有書尚矣唐太常博士嘗刋定而敘之然論長平坑卒南陽貴士則深斥其三刑六合之非至昌黎韓子於李虚中則盛稱其以人始生年月所值日辰推其貴賤壽夭百不失一然則果何如哉蓋博士之論夫子罕言命之意也韓子之說則不知命無以為君子之意也然五行之變化支干之相生相尅孰為勝衰孰為休咎茍能精之則其理有足徴者雖所罕言而亦詎可不知也哉松陵黃瑞卿以禄命之術游江湖間予既贈之以詩又推本其說書之其詩曰客有談天姓黄氏沛若銀河瀉秋水五星厯厯方寸間指掌人生究終始曽將異術干王公一過冀北凡馬􅆰識人須識貧賤中豈以世態論窮通九重方貴凌雲賦我獨胡為守環堵便將出處問黃生不用長安尋季生潼關河渾渾關崿崿太古已來神禹鑿前車未行後車却去馬一鳴後馬愕自從虎視􅁇龍興周道不復如砥平至今惟有秦川路千里秋風落葉聲送陳仲寶還江州陳君五十頭未白邂逅都門始相識陸乗車馬水棹舟跋涉山川共南適苦甘飢飽朝夕同語黙寢興情性通萬里相將彌兩月君住西江我浙東况我與君同姓氏長者稱兄少為弟舟中不必分楚越席上惟應敘年齒君言我鄉風俗淳義門亦有同宗人祖孫共居已九世伯仲相親如一身男耕女織嵗復嵗不減昔日張公藝一牢犬食毎相呼仁信真能馴異類我聞此語喜不忘把酒酌君謌忼慷平生亦有敦睦志心實念之身未遑此日與君言復别君向潯陽我歸浙一尊何處又相逢回首關山見明月題畫南歸道中作太行西來天漠漠朔風攬􅆰雪初落層冰峩峩路犖确大車小車行復却微茫野店是誰家隠見青帘隔林薄行人嵗暮欲何之小憇茅簷良不惡寒日苦短路苦長蹇驢凌兢牛凍僵停車暫秣炊未熟聊飲一尊歌慨慷蒼皇結東戒徒御目送飛雲還故鄉西遊
