front:
  text: 故鄉西遊我昔驅羊腸披圖萬里心茫茫人生出處無定據憂樂相乗寧有常君不見重耳當年伯業昌險阻艱難曽備嘗丈夫有事在四方蓬矢桑弧那可忘連山高高上無極仰視青天不盈尺俛覽可以窮九域我疑山霛應上訴帝遣夸娥運神力又疑蓬萊脫左股萬里飛來倚􅆰碧乾坤一色雲𠖇𠖇急霰始集雪又零依依渡橋者誰子隠隠操舟如送迎萬壑千岩深且窈兩兩相將事幽討若非淮南訪八公定是匡廬尋五老意匠經營妙入神披圖想像皆天真人間何處有此境我欲從之一問津
  hash: sha256:08a6269196474bc7f0084faee1390cbae7fce28b234c38484741802b3bbf01cc
