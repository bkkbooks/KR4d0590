body:
  text: 律詩五言八里莊寄吳中兄弟晚泊清淮口臨風一振衣長河吞巨海平楚没斜暉未覺鯨波險惟憂羽檄飛故園兄與弟歡樂嘆多違定陶世路怜多患斯人劇倒懸虚移河内粟實若没陽田聖主憂民日諸公奉使年萬方心似渴雨露尚中天夏夜懐李尚志蟋蟀已在壁煩暑猶未歇離索感時序憂端難㫁絶緑樹含微風明河湛新月念子行未歸徘徊至明發土壕夕憩土壕村主人顔色温子孫供洒掃兄弟具盤飱故國甘棠在名家棣萼存相傳惟孝悌珍重久彌敦題閿鄉驛匹馬秦川道西游奈逺何客星秋入斗候館夜臨河地勢關頭險秋先嶽面多永懐楊太尉清白志難磨其二為問西來使長安去幾何檄書飛僰道征戍動交河鸚鵡承恩舊蒲萄入貢多平生二鳥賦感慨未能磨函關水宿煩津吏山行信館人度關車躑躅入谷馬逡巡石戴泥中轍風驚塞外塵憂時非肉食華髪為誰新其二萬里西游客歸期趁早鴻澗泉明曉練山果落秋紅鳥度烟嵐外人行泥淖中前途逢馹使立馬問關東其三稍稍聞人語遲遲進馬蹄雨深分陜路雲隔度關遲間道曽歸璧交情獨戀綈蕭條王伯略惆悵入題詩永昌陵洛水南來近嵩高北望遙墓無羣木拱山罷百靈朝玉碗人間出金鐙地下銷夕陽移越路煙草更蕭蕭虎牢關匹馬東歸客﨑嶇過虎牢地分周鄭險天入宋梁高俛視泥無轍前驅舝載膏殷勤關下吏相送出城臯過江澤國長雲雨春山半有無江源起巴蜀地勢控荆吳客舎依蛟館蠻商雜賈胡明時方利涉吾道未乗桴其二江漢思神禹乾坤仰帝堯信知滄海大能受百川朝萬國車書廣三吳地利饒獨憐南浦鴈箇箇上雲霄久雨自從甲子雨不見有晴時南國皆雲氣陽臺眇夢思蛟龍爭窟宅鳥雀戀籓籬去去扶揺上飛騰有所之其二久雨妨農事那堪夜復晨雲浮滄海日花誤洞庭春行路悲游子匡時仰大臣未甘栖遯跡霄漢有通津晴雨後江逾緑春深天尚寒晴光分浦漵曉色變峯巒海内長為客天涯獨倚闌封書寄鴻雁聊以報平安金山寺突兀金山寺蕭條古佛居雲堂依水府花雨散􅆰虛方丈諸天外浮圖浩刼餘十年遊此地今日重躊躇又雨春草碧芸芸春江日易曛鮫人長織杼神女又行雲風水隨鷗宿烟沙與鴈分逺游頭欲白慚愧卓文君安國寺古寺依修竹春池繞緑蒲世塵無處著僧迹與雲孤日暖烏争樹風輕燕引雛久知方外樂來此一踟蹰定陶今日南風正揚㠶過定陶郊原連薺麥井邑帶波濤衆鳥晴爭宿孤舟晚更操裁詩聊自􅇺不必問香醪晴風雨夜來急波濤今復平路從關下險山向洛中明嵗稔征徭緩時平去就輕愧無封禪䇿聊欲頌河清洛口不學尸鄉隠重為宛洛遊波光依岸轉㠶影帶雲收豈有相如賦􅆰餘季子裘青雲有知己意氣若為酬白楊河晚泊白楊河堅冰奈爾河畏途愁落景歸夢隔滄波古渡淮人語商船楚客謌晨興羞覽鏡白髪近來多崔鎮草草趨崔鎮悠悠憶帝鄉星辰依魏闕風土入淮陽逐客行無馬居人飯有魴年華催獻嵗歸得拜高堂次韻答陸養正之子過從久情親若輔車衣冠雖混俗詩禮貴承家舟泊松江雨門連笠澤霞十年來往地俯仰一興嗟律詩七言題陸氏别業夾溪楊柳恣欹斜流水春來淺帶沙韋曲桑麻如杜曲魏家池館接姚家高低亂舞風前蝶紅白爭開雨後花安得草堂江上住爛題新句送年華題龍門山圖曽過龍門山下寺畫圖渾似昔年遊秋聲夜動千尋木雲氣時騰百丈湫魏國祠前烟草緑逺公岩畔石泉流隠君最有登臨趣拄杖相期到上頭至正丁亥四月二十三日允常御史有事于先塋甫竣事而甘雨作人以為孝感所致皆為賦詩美之而屬予為之倡佳城􅆼窕白雲中華表前瞻一徑通千載有功歸紀信九原無計起文翁龍門春湧桃花浪洛浦秋寒麥秀風近日繡衣來拜掃孝思忻至雨濛濛丁亥嵗河南自正月至七月無雨流民相屬于道哭聲滿野不忍聞之慟哭秋原何處人哭聲直上澈蒼旻謀生不及官倉䑕轉死終為客路塵憔悴幾家猶貢蜜蒼皇諸硐又爭銀緑衣陳事無年少徒爾區區索鬼神阿婆抱子婦將車骨肉誰甘棄道途使有賈生應慟哭惜無鄭俠為傳圖身抛田里魂俱喪目㫁關山淚已枯自笑腐儒難用世漫將餘論擬潜夫興慶池層城佳氣日高浮花萼樓臺在上頭鶴駕六盤猶避暑龍池九月未知秋青山排闥當窓見金水飄香入地流麋鹿不收瑤草碧太平恩澤滿秦州陳留人物東都迹已陳行過古邑為逡巡石經毎愛中郎字墊角猶傳處士巾曠世逸才名在耳百年明哲道全身飄零笑我成何事慚愧九原泉下人睢州雪中步允常御史韻隠隠高城下五更飄飄墜雪細聞聲花開草木春輸巧光燦樓臺月讓明太史預占年榖瑞先農應報嵗功成誰知萬里關山外親伴觀風使者行徐州日上彭城獨倚樓關河迢遞水􅆰流不因躍馬江東去安得歌風沛上游草帶虞姬亡日淚山餘亞父病時愁如何舞罷鴻門劒不向咸陽一少留至日淮陰道上年年至日在庭闈今嵗飄零獨未歸雲物不殊鄉國異江山雖好故人稀檄飛河隴仍防冦兵振衡陽未解圍憂國腐儒頭已白倚闌無語立斜暉𤓰州題江風山月亭結屋高臨楊子津江風山月坐相親魚龍未欲烟波蟄鴻雁先驚關塞春有客貢琛來海島何人挂席上峩岷江心五鼓鐘聲動喚起扶桑日一輪送琳上人歸南岳高人二月歸南岳共向東風折柳枝萬里故山飛錫近一江春水渡杯遲碧雲不賦湯休句斑竹應敷帝子祠尚恐諸方㕘未徧葛洪川上重為期江上客舍曉來江上雨濛濛煙火蕭條客舎中風急最憐巢幙燕春寒猶滯寄書鴻紛紛洲渚魚鹽聚厯厯東南貢賦通萬里乾坤一羇旅濁醪今夕與誰同江上坐雨寄鄭山人蕭蕭風雨動經旬二月江城未見春鴻雁不傳天末信烟波愁絶渡頭人誰家楊栁啼黃鳥何處汀洲采白蘋慚愧江南庾開府暮年詞賦轉清新江邊二月東風鸎喚人踏青游女滿江濱栁迷楊子津頭路山掩潤州城裏春望㫁碧雲情縹緲歌殘緑水意逡巡無由一向江南去相伴汀洲采白蘋聞道聞道出師湘水頭東南賓主盛才猷勿令下失蒼生望實恐上貽黃屋憂雨裛漢旌休漫濕瘴深蠻峒未全收致身報主男兒事莫信平生馬少遊送人之南江南春水浴飛鳬栁葉半青楊葉疎送客又逢巫峽雨移家莫就武昌魚鷓鴣啼處難行路鴻雁歸時好寄書若過長沙逢賈傅憑君為我問何如江月樓中天樓閣蔚嵳峩良夜其如水月何雪浪逺從三峽至露華偏傍九霄多道人宴坐修禪觀游子登臨聴棹歌曽是水晶宫裏客倚闌來此重婆娑寄了即休長老躭躭浮玉倚滄洲八十高人在上頭不向終南通㨗徑要將砥柱鎮中流世間豈識維摩病方外真從慧逺遊明日匆匆遇江去尺書聊以寄綢繆五月五日淮陰五月五日淮陰郡半雨半晴城上樓菖蒲泛酒我無分楊栁繫船君且留西日照人生别思南風吹笛帶邊愁明朝必上洪河去欲采芙蓉不自由舟中束書又上李膺舟共溯黃河最上流自笑久為吳下客誰知重向洛陽游關山雨足天無暑原野風高麥有秋永夜雲霄看不厭相從意欲問牽牛五月平原百草香泊舟高岸已斜陽河流浩蕩來西極山勢逶迤接太行墅老張燈風雨夕商人吹笛水雲涼共憐此地頻來往把酒長謌一慨慷河陰蕭條城郭河陰縣河水乗船似泛槎峭壁有人居洞穴平川無玉種桑麻滿天急雨寒欺客捲地長風夜走沙回首太行山下路豈無騏驥困鹽車昨夜關河風雨橫今朝凉思颯成秋沙頭浪湧千堆雪山頂人牽百丈舟願與王遵同叱馭不隨庾亮漫登樓君看平地風波惡積石猶應是穏流虎牢關連山回抱鬱嵌崟百戰英雄不可尋西極河流行地逺中州風氣入關深逢時豈乏留侯䇿事主難忘紀信心千古虎牢形勝地憑高回首一長吟洛口今朝鼓棹清河口即上高丘望孟津多情芳草似南國滿目好山如故人文愧陸機還入洛才非范叔漫游秦袖中獨有河清頌莫惜吹嘘上紫宸法王寺白雲相送度高崗行盡松聲到上方山掩地靈秋寂寂天開岳色曉蒼蒼石根藥采菖蒲秀林下經翻貝葉香乞取龍溪泉一勺仰松堂上禮􅆰王崇福宫西風吹老碧天秋䇿杖尋真處處游太室山前逢啟母少姨峯頂候浮丘穿林雲逐丹光起出洞泉和藥氣流白髪祠官談往事夕陽西去水悠悠承天宫四面雲開翡翠屏路隨飛鳥入青㝠巢由隠去山増秀申甫生時岳降靈露采松花秋作釀風翻蕊笈夜談經何當結屋蒼厓曲手植菖蒲九節青轘轅逺游重到洛陽城又向登封道上行路入轘轅秋更險雲收太室雨初晴千重灌木漫山碧百道飛泉繞澗鳴欲訪巢由渺何許􅆰餘潁水照人清嵩高厚徳巍巍鎮土中一元磅礴氣鴻濛靈雲作雨秋歸洞列嶂朝真曉映􅆰利澤四時周品物精英千古𦙍貞忠重尋漢武登封處御道西風有路通次韻鋼字為拜太古運使賦平生忠義結中腸力剸蛟犀始見鋼水部分曹仍案節尚書入奏擬懐香蹔垂鴻鵠青𠖇翅不負蒹葭白露霜咫尺星辰催聴履肯教供奉殿西廊次韻酬鄭彦章運使使君擬卜水南居負郭良田二頃餘但使有溪堪種竹不愁無地可藏書衣冠洛社期諸老祖帳都門憶二疏頭戴角巾收芋栗秋風吾亦愛吾廬東平道上征客東平聴曉鐘出門殘月尚朦朧一輪紅日生滄海萬文丹霄聳岱宗不為山靈迴俗駕敢從漁父問形容何當結屋嚴巖下學種徂徠百尺松濟州蕭蕭僕馬别神州俛仰乾坤一敝裘慷慨不為投筆計飄零􅆰作曳裾游雲飛故國無來雁冰解長河有去舟此日山東無李白不妨攜酒獨登樓彭城關山嵗晚日沈陰獨上彭城思不禁河水東來非禹蹟民風南去拂淮陰英雄已堕陳平計志士徒憐亞父心自古人臣難去就悲謌一曲倚嶔崟吕梁扁舟又向吕梁舟浩蕩中流看翠微濁浪滿河冰亂走黃雲垂地雪交飛本身誤叱王遵馭涉世頻沾阮籍衣日暮不須吹短笛沙鷗猶恐未忘機邳州邳州城下片㠶收滿眼山川生古愁人間客子復來此圮上老翁何處游青雲無路逐黃鵠滄海有波隨白鷗浩歌擊楫江南去孰謂赤松非我儔淮陰侯廟慷慨論兵笑沐猴盡將生死付鄼侯手提漢鼎歸真主眼見黃旗出偽游此日王孫􅆰故國何年漂母葬荒丘英雄自古多遺恨腸㫁秋風楚水流渡江憶京師故人一别神京嵗已闌故人回首路漫漫淮南美酒誰同飲江左青山獨自看滿目波濤紅閃日中天樓閣翠生寒吳關入望庭闈近欲問飛仙借羽翰草堂隱君家住玉山阿新築茅堂繞薜蘿翡翠飛來春雨歇麝香眠處落花多竹枝已聴巴人調桂樹仍聞楚客歌明日扁舟入州府不堪離思隔滄波碧梧翠竹堂玉山窈窕地仙居翠竹參差問碧梧夜靜簾櫳人度曲春深庭院鳯將雛瑤華散席侵棋局瓊露分香落酒壺見說秋來更瀟洒四簷虚籟雜笙竽漁莊何處林塘好卜鄰清江繞屋淨無塵定巢新燕渾如客汎渚輕鷗不避人楊栁飛花香作雪鱸魚上釣白于銀春風無限滄浪意欲向汀洲賦采蘋次韻答陸養正幽居瀟灑傍溪湄雅好惟收魏晉碑千樹好花閒對酒一簾春雨細論詩耽書爾欲師𤣥晏鼓棹吾將學子皮滿地緑陰春寂寂永謌伐木眇予思留别錢伯行落花時節下江潯掃榻相延竹滿林盡日雄談驚四座百年高義重千金挂㠶南浦春風起剪燭西窓夜雨深别後相思隔城市五湖烟樹碧森森留别陸養正我愛陸郎才思清新詩落筆使人驚不材謬忝為師友高義多慚若弟兄江上烟波催去鷁雨餘春樹亂啼鶯定知明日􅆰齋裏坐對停雲憶士衡送于子都赴陜西同知公子承家列俊髦尚書奉國著賢勞棠餘分陜千年樹水落洪河萬頃濤地勢下窺崤黽固天文西入斗牛高關東故舊如相問委羽山深學種桃南歸道中作陸乘車水乗舟關河何緜緜波浪復悠悠車行阻雪水阻冰陸憂豺虎水鯨鯢我生不學馮河術奈何欲與重險爭朝辭舟暮騎馬鶺鴒相呼在原野白魚可烹雀可炙諼草羅生滿堂下長律上西臺大夫韓公二十韻昭代推賢佐明公最絶倫異材鍾海岳間氣毓星辰世濟忠貞美身膺褒寵頻棟梁元有器社稷豈無臣暫出司天憲遄歸乗國鈞鋒車朝象闕玉漏赴雞晨膚寸雲初起茫洋氣已勻風霜成雨露秋日變陽春出入方周召功名邁甫申廟謨惟密勿王業在經綸近拔囊中頴旁羅席上珍但令材並入行見俗還淳葑菲秋仍緑菁莪晚更榮高明誠樂育幽側㑹求伸上客爭趨薊鯫生獨過秦朅來瞻泰華直欲小峩岷江漢成漂泊丘園愧隠淪新豐喜有酒京洛漫多塵五鳯深黃閣三台近紫宸扶揺難自致搔首望高旻江亭江水出峩岷江亭俯要津諸侯皆職貢百粤漫風塵恩詔傳中使遐方倚外臣出師勞上將入幕羨嘉賓聞道元戎死頻傷義士神三軍宜雪恥百戰莫憂身巫峽長多雨瀟湘已暮春鼎魚何足制奏凱勿逡巡送錢伯舉出判衢州客舎依慈母多君若弟兄庭闈交定省閭巷遞逢迎夜雨敦朋好春風動宦情金尊泛綺席玉漏下層城吏隠當年世功曹足令名不徒招爽氣直欲樹風聲滄海鯤鵬化朝陽鳯鳥鳴明時須努力應不負平生絶句水殿納凉圗白苧衣裳懶自裁手搖羅扇此徘徊水晶宫殿涼風少欲勸君王築露臺戲嬰圖懐抱提攜笑語温好花折得帶晴暾后妃别有房中樂宜爾螽斯樂子孫蜀葵花水晶宫裏是仙鄉新製黃裳怯嫩凉獨倚西風無與語漫將心事訴朝陽雞冠花緑陰庭下露華晞一色腥紅映舞衣疑是仙家丹熟後靈雞服得也能飛桃花翡翠落花庭院颺游絲春在夭桃人未知翡翠飛來成久立太平風景日遲遲倦繡宫門深鎖晝偏長懶把春雲繡作裳恨不將身化蝴蝶長隨飛絮近君王蓼花雪姑紅蓼花開水滿洲西風吹夢不成秋銜泥不及三春燕兩兩巢君翡翠樓田橫墓一門兄弟王齊中恥與羣臣事沛公五百餘人同日死也勝匹馬向江東中牟客路茫茫日易晡白沙衰草下飢烏為詢今日中牟令曽有飛蝗入境無杞縣杞縣南來麥未青馬蹄無奈曉凌兢問君今日寒多少雨過園林盡未冰竹雀圖兩兩野田雀雄鳴顧其雌青春風日好來哺竹間兒夷白齋稿外集巻上欽定四庫全書夷白齋稿外集巻下元陳基撰序玉山草堂分韻書序予與玉山隠君别四三年聞其與會稽楊鐵厓遂昌鄭有道匡廬于鍊師苕溪剡九成吳僧琦元㙸日有詩酒之娛而其更倡迭和之見于篇什者往往傳頌于世而予也以汗漫之役溯河洛上嵩岳厯關陜北游而客京師度居庸計其所跋涉不啻萬餘里方挈挈焉觸寒暑犯霜露之不遑又何由持杯酒濡翰墨詠謌揮洒以厠諸君子之列耶今年孟春予還自北方隠君首以書見招過草堂為旬日之留于時鐵厓去講春秋于松江泖澤之上有道隠居呉城天宫里元㙸亦歸天平之龍門而九成則出入漕臺執文櫝以理公家之務朝夕與予為侣者主則隠君客則鍊師也予竊念三數年来馳驅辛苦幸而来歸而隠君能以水竹琴書相慰藉而諸君子者乃出處不齊不復如疇昔雅集之盛方俛仰寤嘆慨然興懐而豫章熊松雲婁江陸良貴適至隠君乃列綺席設芳俎于碧梧翠竹間相與投壺雅歌飲酒懽甚且即席賦詩而以碧梧棲老鳯凰枝為韻予探得老字餘則各有所屬詩皆成獨松雲子飲酣長嘯上馬馳去分得棲字不賦云尊賢堂分韻賦詩序玉山髙士世為中吳巨族居崑山界溪之陽其先君子好道家清淨之說甞以所居為真館髙士嗣葺之年未及老輒委家事于其子退治一室環以水竹中蓄琴書圖畫古玩之屬而扁其堂曰尊賢徜徉宴息意泊如也髙士少負竒才既不屑于用世乃取黃帝老莊之書讀之而奉釋氏不殺生之戒惟謹毎遇生辰輒不茹葷不飲酒杜門却掃焚香清坐嵗以為常今年孟春予過其堂適值其謝客之日以予辱有雅故且婣故獲與觀其長幼登降儀容之盛髙士子仲瑛晉道皆能文而好禮而其孫元成則又予友于君彦誠之髙第弟子也相與舉觴稱慶禮畢有頃姆抱三嵗兒奉巵酒跪進髙士前芝蘭玉樹未足以喻其秀盖髙士之曽孫也于是髙士命左右實俎豆潔罍􅕌相與為文字飲髙士既懽甚而其子若孫班班就序長者舉觥少者起舞髙士亦忘其為尊且老談笑之餘發為謳歌至夜分不輟于是仲瑛請􅀆韻賦詩以紀其事予竊以為髙士享有五福樂及孫曽顧不為其所得為而乃味道徳之膄享仁者之靜守之以儉行之以慈而仲瑛昆季又能窮行孝弟以志為養則其度越流俗豈不萬萬哉因以洪範所謂夀福康寧攸好徳為韻予得康字既為之詩又為之序云送長洲縣丞歸詩夫裒衣峩冠乘堅策肥馳騖仕宦之林而有貴夫世之佳公子者盖以其習聞于家庭者非忠於其君則孝於其親也非弟于其長則信于其友也其周旋于朝夕則威儀之度進退之容射御之文應對之節又皆可以莅官而臨民者也使之出而從政殆猶駕熟路之車騁康衢之駿而予也則于長洲丞西夏遷家訥君見之盖君之上世鳴玉紆組埀休著烈代不乏人而君因其先大夫之澤効官倉庾而来也始則人敬之終則人愛之去則人思之胡為其能爾哉盖長洲為邑麗于大府賦夥而訟煩丞之為職所以貳令位美而勢偪前人之處于是者僉以為難而君也佐煩夥之邑不急以民不緩以僨事居勢偪之位不嫚以長傲不阿以辱身三年之間不强民以敬而民敬不徼民以愛而民愛不要民以思而民思嘻善之足以動物也若是乎君顧不以習聞于家庭者為己足周旋于朝夕者為己至而諰諰焉若將益充其所以孝所以忠與夫弟且信者以雲漢為康衢朝廷為熟路而其所謂不負丞者未足為君頌也然詩者所以宣有徳序者所以紀其善呉之大夫士于君亦厚矣故予不敢讓而樂為之書送施椽史詩序國家世臣賞田多在呉嵗有廩人之事則遣使督之至正十二年丞相府選監修國史府椽史淮南施君克讓乘傳至呉慎其事也既竣事明年春戒遷薦紳大夫咸賦詩以美之意若曰丞相勲足以輔成王業功足以保衛社稷力足以制法成治而智足以尅敵出竒既登名太常則賞田之法宜有加無征此國家所以勸大臣丞相所以奉祭祀者也其使人于此豈直責以廩人之事而已哉亦將因此以視年之豐凶人之休戚益思懋厥功以埀休無窮也然則美克讓者非私克讓也美丞相之善使人也丞相使人不直責以廩人之事而事集此克讓所以為賢也方今丞相枋國立賢無方薄海内外士之負才實者並升中朝盖彬彬焉克讓年盛志銳而材又最良其從事相府也盖所謂生于伯樂之廏長于匠石之園矣其進而顯榮也殆鷙鳥舉而風迫之矣他日乘堅策駿鳴珂曳紱復以使事南遷薦紳之在呉者尚能捧巵酒為克讓懽以慶丞相之得士也至正十三年癸巳三月既望序送髙進道序聊城髙君進道侍其先大夫員外公寓呉最久公中朝夙望風裁峻整居家尤嚴肅進道兄弟侍立終日非有故不輒去左右當是時縉紳先生謝官于朝而休老于呉者相望然皆推公為前輩無日不相過從部使者及四方宦游之士道經呉率就造見戸屨至不可容于是進道兄弟雍容于揖讓樽俎間動中矩度而進道又特以博古好學雅為諸公所知間欲屈置椽曹辭弗就及公捐館一時諸老亦相􅁇淪謝其子弟往往通顯莫不交薦進道進道方僦居水竹間環堵蕭然貧寠日甚人以為難而進道讀書時為鼓琴宴如也今年夏廣西部使者不逺數千里移書来呉辟進道為椽史于是常所往来者相與具車馬勸進道駕而進道夷然若有不屑焉者乃相與言曰先大夫以閎毅正直之材有志當世不幸廢于疾及門之士資話言而往猶足以濟時善俗况進道以克肖之子朝夕奉先人之訓而周旋左右者乎然隠淪不仕豈先大夫所以有志于當世之意乎且經邦之道莫大于風紀而風紀之要莫難于得人今聖天子得賢部使者於廣西部使者又得賢僚吏於幕下進道行矣推事親之道以事君推脩身之道以治人將見進道無負于部使者而部使者無負聖天子矣于是勸進道行者咸賦詩以餞之而屬天台陳基為之序雙谿詩序予鄉去城百五十里而遙大率深山長谷土田之利薄嵗所入自供公上之外僅足以給衣食以故民無贏餘而得盡力于畎畆暇日鄉之老者率其子弟相與誦詩讀書而其人皆知講說周公孔子以相尚予生九年而孤又九年出游四方不得安于田里以朝夕承敎及粗有知而歸先生長者多已謝世其遺風餘韻幸而可見者尚賴其詩之存盖予於雙谿而有得焉予既手錄其書乃從而嘆曰嗟乎古者天子之巡狩也太師陳詩以觀民風焉是以孔子删詩凡行役之大夫放逐之臣子閭巷婦女蒭蕘遺逸之詞悉取而列諸國風者將使人因其情性本其風土而觀其習俗之美惡政事之得失也周衰聖人不作采詩之官廢作者始自成家家自為法辭愈工而氣愈䠞世逾降而情逾偽尚何俗之可觀政之可攷哉故予厯觀近世之詩重有感于吾鄉諸老雙溪之作者盖以其發于喜怒哀樂之正本乎習俗風土之美歌詠周孔之言以敎其子弟親其親而長其長樂其樂而事其事遡而求之古詩之源可見也予以不得親登其門為憾又惜采詩之官未設序而藏之以俟知者送髙孟賔歸永陵後序古者男子有所事也其所事在于天地四方故其生也桑弧蓬矢以射天地四方者志其所有事也是故成童而敎先幼儀而後六藝既冠而成人則責以男子之事故三十則理男事焉男事理則可以出而行其志故四十始仕則方物出謀發慮五十則服官政七十則致仕焉然則人之生也無一日不敎其長也無一日而不學及其措諸事也亦無一日而非其所敎所學者是故近而君臣父子夫婦昆弟朋友之所以為懿詩書禮樂之所以為敎逺而天地日月星辰之所以運行風雨霜露隂陽寒暑之所以變化江海河岳之所以廣大皆其躬行寔履深明熟察而非有待于外者也故曰叅其化于天地而無悖行其道于四方而無惑男子之始終其所事不既備矣乎今之人則不然其所謂幼儀父兄不必知也所謂六藝老師宿儒不必能也而况于其所事乎况于無悖無惑乎嗚呼敎之不行學之不講亦已久矣士之生于斯世茍有志于天地四方以求其所事其可不自力乎是故弗敎則已苟敎焉非古之所敎弗敎也弗學則已茍學焉非古之所學弗學也茍敎矣學矣而猶有所未自信者則出而游于通都大邑天下人物之所㑹交于豪杰卓越之士以増益其所未至者焉然後求其所事于天地求其所事于四方其庶㡬不悖不惑乎余甞有志于是矣而未能致其力吾友永嘉髙君則誠博學而强識其弟孟賔將東歸海上盖所謂歸而求之有餘師者其行也將以是驗之孟賔之得於其兄者亦有以教我乎因書于末簡以致予私焉送申屠彦徳序祕書少監金華黃先生之宦游浙東西也四方學者各以本經来受業會稽申屠彦徳則以春秋之學以為髙第登先生之門也後先生稱彦徳不置口而某固願與之游及来呉門訪故監書博士柯公敬仲而彦徳客于其館始相識于是脩同門之好甚懽也方是時士罷科舉之習一時作者以古雅相尚而彦徳詩文一出爭相傳誦然日不廢三傳及諸儒所為說以研精宣聖筆削之㫖及賔興之制復行彦徳挾所有以往毎方出塲屋同輩谷以其文相示莫不推服彦徳而有司者顧屈之于乙榜僅以恩例署歙縣敎諭夫士之為學亦正義不謀利明道不計功而已故其得所願于時則進而行其志其未得所願也則退而求諸已茍去而奉􅇼豆玉帛周旋尼父之庭深衣大帶率諸生誦其詩讀其書于朱夫子之里則又有所不讓也且基常游歙矣歙之為邦在萬山中水清而駛故家遺俗喬木相望文獻有足徵者而其人於當世儒宗尤深慕金華先生之文足以發明朱夫子之道故以予之愚亦因幸先生而不見鄙夷于歙而况彦徳乎顧以朝夕之養不能一日舍去以後彦徳于歙而脩基之所不逮也于其行輒序以送之且以謝不敏于歙之大夫士云送鄭君舉游金陵序昔六朝之都金陵也當南北分裂之餘士生其間盖欲為司馬子長萬里之游而不可得庸詎知千數百年之後天下混一車書大同有如今日者而能文好游之士過其故都徘徊感慨以弔其殘烟衰艸之墟乎然秋髙氣清登石城而望長江西来朝宗于海而湘潭巴蜀之山雲影出没至于淮南艸樹青青如薺秦淮晴波縈縈如帶猶足以想見昔時龍蟠虎踞之勝固一時之壯㢤况大江而南物阜人繁天子命執法大臣臨而治之以至繡衣峩豸之英皆極一時之選寔東南人物之都㑹也而其所職又以進賢退不肖為務是以山林之士有志當世者莫不願與之交此永嘉鄭君舉所以有金陵之游也吾聞王良善御馬者也然非千里之馬雖良亦無所用其御矣今有千里之馬于此良其舍之㢤雖然游金陵者衆矣固有登髙覽古慷慨悲謌隠于桑樞甕牖以樂周孔之道有欲御之而不可得者君舉試一訪焉它日歸而為予道之送葛子充序金華周君子宦游呉門俄病暍而舌黒醫者以為不治其友龔君師徳更訪予里人葛君子充診之則曰是在醫書顧諸公不察耳以法治之隨愈周君既深徳子充因屬予序以送之夫醫固儒者之事也素問内經雖不能必其出于黃帝岐伯之手然五臟百骸脈絡血氣之在人身而與天地隂陽五行寒暑相為禪續消息其言至精而理至密盖去性命為不逺也秦和扁鵲倉公華陀之書雖不盡見然張長沙論述于其前劉河間張宛丘李東垣發明于其後此數君子者皆以博學審問之功而造夫神聖工巧之域天下之能事畢矣故為醫者不讀劉張諸公之書則何以推明長沙之論不明長沙之論則何以通素問内經之㫖素問内經之㫖不察則夫所謂五臟百骸脈絡血氣與夫天地隂陽五行寒暑相與禪續而消息焉者何由測其微而探其頤㢤吁為是術者亦不易矣世之庸工俗師自號為醫為専門者不過以京局古方相授受而已求其如子充者豈易得㢤盖子充之醫本于素問内經上下于四三君子之書毫分縷悉以明夫天地隂陽五行寒暑之禪續而察夫五臟百骸血氣之消息其用心精且専矣猶以為未足則遍游四方博訪名公相與講究其所未至故其切脈計方譬之養由基之于射發則無不破的焉此周君所以深德子充也夫吾聞子充之事醫始以事親而終以濟人固未始一日而非儒者之事也然其活人亦衆矣何獨周君徳之乎夫貪功責報與夫背恩而反仇焉者固不大相逺然以醫自多而終至于殺人者聞子充之風亦可以少愧矣予既重周君之請又嘉子充之醫道本于儒者于是乎書嚴氏游靈巖詩序中呉以水為國而靈巖獨髙雲漢之表珠宫紺宇浮屠氏寔有之然琴臺硯池􅓏廊香徑所以資耳目之勝尚厯厯呉宫之舊憑髙而望則姑蘇之麋鹿茂苑之烟草逺在指顧中而天平之朝嵐暮靄太湖之風帆浪舸變化而出没者又近在履舄之下盖東南之偉觀也二月仲春嚴公景安與其族人子弟汎舟海上西行百餘里侍其季父来游時雨既降草木暢茂長幼提携相與攀髙岑撫長松而懽忻愛洽之情油然于山水間則斯游也非惟窮耳目之勝而已宜其賔客觀感一時之趣從旁執筆畫以為圖而能詩者又從而賦詩焉盖景安仁而好禮尤厚于族人想其嵗時臈社宴集于家披是圖而玩之則所謂珠宫紺宇太湖天平或髙出雲漢之表或俯矚履舄之下者皆可坐而致之卧而游之于是慨時序之代謝追登臨于往昔而愛洽懽忻發于性情形諸詠謌不能自己則凡覽之者皆將為之賦詩而况于其賔客㢤基越絶之鄙人也奔走千里弗克盡其懽忻愛洽于親戚者亦多矣故不能不申一言以致其羨慕之私焉至正六年丙戌五月既望書送趙平甫序州與縣均之為民父母也然昔以為縣而今乃以州陞之則其位既隆而其責加重故由大府史而賔于州者恒什百于縣之典史于是有假典史之選而佐于縣由縣而復陞于州者焉夫自大府積勞而賔于縣又自縣積勞而賔于州也佐于長史處既隆之位任加重之責盖亦難矣然而老于力筆者或上下其三尺使民不得通其情迫于衰耄者帷知避害而趨利不復顧事之得失有能惠然以民之休戚為己任使其長吏不失譽于上而其民無怨讟于下則人之賢不肖何如㢤呉興趙君平甫試吏其鄉厯蘇州府史為杭錄事司及明象山縣典史今以都目選賔於越之諸暨州夫給事與三大府更一司一縣悉著賢能聲今去而之山水之邦佐其賢良之長而治夫淳美之俗攄其應劇之才而施之以暇裕將見其賢聲大行于越而著于東南其可施者當不止于一州一縣而已彼拘于刀筆牽于利害者豈可同日而語㢤于其行呉中善詩者咸謌以餞屬予為之序送李崇道詩序予客洛陽識李君崇道于御史幹勒公允常座中見其風神秀整舉止不凡意其為貴游公子也退而察其所職乃知其為儒家子用父廕而為河南司獄且三年于此矣予因益器重之盖河南隸土中而其民稱近古然自饑饉洊臻始有失業而麗于法者兼旁近山谷産物為白金亡命之徒相聚而冶于其間嵗不下數千人往往因利而競輒白晝相戕甚至血流洛水盡赤然則司獄于此自非老于事者鮮不以為難矣今李君以一命書生而年又甚少顧乃處之裕如不啻游刃于有餘之地者亦必有其道矣予甞聞洛人謂君廉而不矯惠而不近名民之逮繫者悉哀矜而善處之疾與之藥饑與之食寒暑為之備多出私帑久而不倦恒誦仁人君子存心濟物之言以自勉且曰氓之獲戾而至于斯彼固不幸也亦豈有司者之幸乎吾本吾公而已又遑恤其它鳴呼不亦善乎未㡬以秩滿將謁選天官洛人以其必顯庸于其時也咸賦詩以贈屬予為之序記萬壑松濤軒記郜君彦清宦游東南樂呉興山水之勝卜築弁山之陽而名其宴休讀書處曰萬壑松濤夫天地之氣噫而為風其始也發于太虛既而周于六合其嘘吸于衆竅也盖吹萬不同然而霜露既降溪谷蕭條其蔚然森茂挺然髙出雲漢之表者殆莫與松為伍于是浩乎其相激沛乎其莫之遏渢渢乎颯颯乎如百水之源崩迸洶歘流而入巫峽轉瞿塘下江漢滔滔乎其莫知所極也於斯時也吾知彦清仰而視俯而聽庶㡬與南郭子綦𨼆几而游于灝氣之初將嗒焉不知孰為我孰為吾而予也又何足以知之㢤雖然夫鼔元氣而成萬彚者果孰為之機括乎故張之則溢萬壑而不以為有餘翕之則不盈一掬而不以為不足然要其歸則未始翕而亦未始不張且翕也今彦清以英邁之氣勇往之􅐾出而周旋乎世故酧酢乎萬變盖亦不離于物而亦不撓于物也及其退而休沐于兹焉逍遙澹乎其相忘泊乎其無為其殆有合于此者是則不可以無記也若夫風土之夷曠烟雲之吐納與夫嘉卉美竹芬敷恱茂以宜于四時者它日從彦清游尚能為之賦云綠隂亭記綠隂亭者界溪顧君進道宴游之亭也進道中呉故衣冠之族好學喜靜而不肖于祿仕其所居雖逺去城邑而無髙山深林之阻于是引水以為池聚石以為山嘉木美竹之植既扶蘇而䓗蒨竒花異卉之茂又敷榮而靚深于是戸庭不出而得園池之勝者意惟斯亭為然盖寒暑之時不同昏旦之氣亦異攬清輝而撫流芳固隨物而寓懐即景以成趣于春夏之交時雨霽而風日好林館邃而芳草榮則綠隂之勝又為斯亭之最焉爾時進道角巾藜杖日與二三友生徜徉于此或彈琴或簫鼔或賦詩飲酒而凡世間之榮辱得失不少置毫髪于胸中不亦善歟夫景勝則神超神超則理融進道盖甞學道而造于此乎使進道而果造于此則其充然自得于禽飛魚泳之際者殆與造物生生之妙流行于無窮盖無時不在綠隂中也豈特春夏之交而已㢤雖然陽徳方亨草木咸若進道得以仰事俯育之餘優游無事于亭以留連其光景于故園喬木之下者亦知其所事乎然則進道以綠隂為樂而吾黨又能執筆以陶寫其所以為樂者皆幸生太平之時也是不可以無述因書以記之聽雪亝記顧君仲瑛飭藏修之室于所居小東山之左京兆杜徵君用古隸題其亝曰聽雪徵記于予予惟天地之氣舒而為陽􅃤而為隂潤而為露雨凝而為霜雪而其所以舒所以􅃤而凝且潤者亦何與于人而夫人之情見雨露之濡則神夷覩霜雪之肅則神凜此必有為之真宰于其間者矣且嵗聿云暮雪霰交集君子于此宜感時序之代謝慨物候之變遷退而居重幄襲兼裘徵纎歌選妙舞拊金石之音調管絃之節以樂其樂今也則不然歛容以處其獨潛聰以探其微超超然若逃于虛空薄富貴而安枯槁者夫豈作所謂瀌瀌奕奕霏霏洒洒颺霙而屑玉縁甍而入隙者果足以恱其耳而懌其心乎盖嵗功既成嘉瑞時應出無羈旅跋涉之役入有琴書歌詠之娯而又仰足以致其養俯足以適所育裕于已者不役乎物足于内者無待于外于是怡怡焉衎衎焉與葛天氏之民並游于熙洽之世嗚呼居太平之時聽豐稔之雪其得天者亦厚矣宜其不以人之所樂者以為樂而其已之所適者以自適然則非仲瑛亦何足以語于此哉雖然吾聞井蛙不可以語海夏虫不可以語冰盖拘于墟者猶篤于時也今仲瑛處裕而不嗇居盈而不矜持虛以守實主靜以制動以庶㡬于不溺此不泥彼而能與物推移者故予樂為之記也志靜亝記京兆杜徵君嘗過會稽朱子安民于呉門而題其所居之室曰志靜亝客有見而疑之以為子安方與呉人雜處于賈區中其丹樓畫閣鱗次而櫛比明珠文貝誇多而競靡者非金張之廛則陶朱之里加以以車服軒冕之旁午歌童舞姬之雜遝子安于此宜朝夕弊弊焉疲精神役心思計得喪較銖黍之不暇而其心之所之顧不在于彼而在于此吁此焉足以知子安㢤夫逃乎空虛形槁木而心死灰者舎動以求靜者也應事物而接人情跡闤闠而心山林者主靜以制動者也舍動以求靜其功足以善其身主靜以制動其效足以及乎物子安盖甞求隂陽五行于黃帝岐伯之書精工巧聖神于秦胡越人之術其用將以善身乎抑以及物乎夫及乎物不物于物也不物于物者非志于靜者不能也况子安之左琴右書何歉于金張筆牀茶灶何羨夫陶朱法書名畫之巻舒何慕于軒冕商彛周鼎之羅列何事于謌舞之左右則其不容一物于常惺惺之際者其亦主于一而無它適焉爾予懼疑者之終不釋也故為之記使書于徵君之亝以示之悠然亭記毗林錢君士元博雅嗜古世居馬跡山之内閭其地濵太湖而與夫椒之􅅢相望士元樂與賔友親故游則作亭其間而以悠然名之浙東元帥白野公兼善為之篆燕人正卿士元之婣而白野公之客也每過士元飲于亭上仰見其扁則思白野公不置余雖未識士元而白野公之交予猶正卿也爰屬以記予弗敢辭夫士元之生後靖節千嵗而近其居去靖節千里之逺而名亭獨取其詩之語景而慕之非以其人乎斯亭也俯太湖之蒼茫覽夫椒之嵳峩飛鳥往還與山嵐相􅂞薄悠然之中宛有真趣此靖節所謂欲辨而忘言者也盖象外之象景外之景自然無名太墟無跡言之不足以盡其意噫靖節其殆天游者耶予于白野公無能為役而正卿顧欲為士元推靖節之志言者而為之記豈忘言之中猶有可言者乎夫能言者固難而忘言者為尤難惟其忘言也而後得其趣之真得其趣矣而猶不能已于言盖終身不言而未始不言也莊周氏之所謂和以天倪而非予之所敢知也雖然白野不必言矣吾將從正卿坐斯亭詠靖節詩以酒觴士元相與乘和平之氣游無何有之鄉而後忘言之境庶可黙會也正卿曰善因書以為悠然亭記至正十三年仲秋日嘉樹軒記山隂朱君子安所居之庭有嘉樹焉天台陳基見而美之子安曰子亦知其樹乎夫方産于山林也莫不萌于尺寸而至千㝷為匠氏所知則取而用之為明堂為宗廟不為匠氏所知則老于丘壑而已或者又厄于山石困于巖穴䠞縮擁腫巻曲偪仄而不得遂其性否則病于戕賊欲効其用如柤梨橘柚而不可得均之為樹也而有幸不幸焉今斯樹之植于庭雖未必其為匠氏所取然亦逃于擁腫䠞縮偪仄巻曲與夫戕賊之患而愛䕶之仁均于造物溉灌之澤饒于雨露縱未能上干霄漢映蔽日月然視老于丘壑者亦或有間矣基聞其言而有感焉士之産于空谷有乘風雲之會佐時龍之運巍然而立于廊廟者有徳行以培其本禮樂以達其枝而光華潤澤又發而為文章之盛然不獲推之于時以致其所以扶顛而持危者有不材而克終其天年如商丘之木有以材為患中道而夭于斧斤如宋荆氏之楸者此其幸不幸視彼何如㢤今也托根于君子之庭不厄于山石不困于巖穴養之以深仁而不徒為商丘之夀沃之以厚澤而不至為宋荆氏之夭庸知其異日不千尋乎又庸知其不為匠氏所取乎然則産于山林而有幸不幸者在于樹之遇弗遇也托于君子之庭而有取不取者在於人之養弗養也吾知養而已又遑計及取不取乎子安曰㫖㢤使我因彼而有得于此者子之言也夫乃謝曰敢不封植此樹以無忘角弓因書以為記范氏復祖塋記故宋贈太師魏國范文正公以上三世墳墓在呉門之天平山至公之薨始葬洛陽萬安山母氏謝夫人之兆其子監簿忠宣恭獻侍郎以下三世皆祔焉中更靖康之亂子孫之在呉者弗獲以時展墓惟顧瞻山河北向流涕而已我世祖皇帝混一四海列聖相承誕敷文徳而尤惓惓焉致意于古今忠臣烈士有功于名敎者故公克與天下之名山大川前代之聖帝明王並登祀典每嵗春秋仲丁有司祇奉中牢致祭惟謹然亦不過即天平之白雲以景其髙山仰止之意而萬安之原至大中八世孫國俊僅一至其地同知徐君景儒為復侵地亦存什一于千百自是又三十九載為至正七年國俊從弟將仕佐郎文英謂其子崑山州敎授廷方曰嗚呼自陵谷變遷以来故家喬木零落殆盡吾子孫幸生聖明以敎治天下之時憑藉餘澤食有義田居有義宅敎有義塾凡養生送死可以無憾而祖宗三百年之丘隴来所恃以為藏者鞠為芻牧之區徐君所封亦已侵削尚安在其為子孫哉洛陽土風號為近古豪民無知可以徳化不可以力爭吾聞御史沃哷君允常居里第日以吾先文正公濟貧活俗之仁自勉而僉事李君公平分憲于洛又常執筆而為公之傳者誠以狀白之必有以矜吾之志也廷方即日具資糧不逺數千里致其父之命于是李君首捐俸金為之倡沃哷君率鄉黨與同知郭君文鼐判官董君鉉奉牲幣為文以祭於墓所所謂豪氏之無知者觀感而化率復徐君所封之舊而其地以畆計者若干既繚以周垣盖之壤樹又築室六楹俾其甥趙氏廬其上甫竣事以基常與觀俎豆玉帛之盛屬書之刻于石以埀不朽竊惟文正公以間生之氣王佐之才致為將相為宋宗臣百世之下誦其詩讀其書者可以立忠信尊君父興王道而致太平故其少而肄業長而從政所至之地遺愛不忘率塑像以為祠勒銘以頌徳顧是窀是穸在其父子平生居官衣冠禮樂之鄉而使斧斤耒耜日相尋于其中豈國家所以尸而祝之以待先賢之意乎􅁇自今為子孫者如文英廷方之不忘其本居風紀者如沃哷君之惇尚古道李君之知所勸相為有司者如郭董二君之克恭所事則萬安之松楸將人人為之封植益久而不廢尚可斧斤耒耜之為患哉公父子世濟忠貞太史有傳神道有碑家世有乘載兹不贅書特書其復塋嵗月為將来告云是嵗丁亥十月丙子記崇勲堂記遼之右族厯金入國朝惟舒穆嚕氏之後為最盛支分蔓衍散處北南若河南都府所屬千夫長元善君者其一也君上世佐太祖皇帝起朔方駿功偉烈不克殫記逮世祖皇帝平一海内受命武臣分鎮天下要害處顧惟河南地廣以逺且屬四方之中昔人所恃以為金城湯池者雖鞠為荒壤然表裏山河自若也故既立萬夫長俾元勲總蒙古軍世守之又以虎符金章職長千夫授君上世其責任不亦隆且重哉此其所以先大父即所居之堂而名曰崇勲也今年夏五月予與御史沃哷君允常過洛水之南遙望里第喬木叅天穹墉傑屋巋焉其中及至君衣疏布出肅客無毫髪貴介習于時方居先夫人之憂而先大夫即世久矣升其堂見埀白老母坐堂上則君之祖夫人也因相率舉酒為夀有頃君之女出拜客禮畢退立太夫人之側婉淑有度又頃之姆抱幼子甫三嵗秀目廣額楚楚不凡則君之子也坐定太夫人從容問勞悃悃欵欵精神氣貌如五十許人時已年八十有六矣樽豆既設君周旋降登上奉太夫人下接賔客而懽忻愛洽之情藹然于威儀動作間雖韋衣之士有所不及也世言三代為將道家所忌然鄧禹將百萬之衆未甞妄殺一人自謂必有興于後世者累世寵貴果如其言方國家經營四方神武不殺君上世以忠事君克有樹立成平既久子孫祇承世祿以孝事親上棟下宇俯仰無怍引而弗替崇勲之澤駸駸乎其未艾也彼若考作室既底法厥子乃弗肯堂矧肯構者亦可以知所愧矣至正七年五月甲子記之桃源小隠記界溪距呉城之東五十里其水深廣其土肥衍民有耕于其上者自號界溪生人從而稱之而不及其姓甞讀晉人所記桃花源而慕之且曰安得若人者與之游乎于是環其廬皆種桃而扁曰桃源小隠客有過而為之賦者曰仲春之月桃始敷風日晴美其蒸如霞既穠且郁天發其葩灼灼麗姝爛雲錦以為居此豈避秦之子而彼美人者得以挹其芳而玩其華耶生乃止客取酒劇飲日且下舂俱藉草卧花下須臾月白風露在草樹間夜氣襲人生因暫起有頃復覔過客而客忽不見潦時水至生往率農人田于其野至暮而歸則聞有鼔枻欵乃于烟波莽蒼外者生乃謌陶淵明詩以和之然其人卒不可得而見或謂向者之客盖仙云嘻若生者亦豈仙之徒歟生好經史百氏與夫法書名畫古玩之屬左右羅列日與友人徜徉其中雖昏旦異氣寒暑時殊而水木禽魚之趣無時而不寓于目意有所適則發為詞詩間有傳于人世又若有幸生太平無事時粗以衣食有餘取樂于此者皆上之所賜然終莫知其為何如人也赤城樵者聞于夷白子因述而記之知還亭記西夏吉祥文卿謝官茶陵居洛陽里第扁其燕休之亭曰知還盖取晉陶靖節之言也翰林待制大梁呉公以小篆題其榜徵予文以記之夫以靖節之脫洒不羈博學厲操使出而致用則其效可以返淳風于千古振大雅于末季所謂羲皇之上者不止北窗之下矣不幸而遇衰世仕不足以屑其意則寧浮游塵埃之外以庶㡬夫不逺復之義夫豈其獲已哉今文卿生靖節不可得之時而又器局過人鳴珂曳組世有膴仕顧不乘清飈憑灝氣去而叅鵷鴻于九重友鸞鳯于阿閣而乃遺榮髙蹈浩然賦歸左右琴書沾沾自適是盖學靖節而過焉者固非流俗徇祿忘反者所可同日而語也雖然方今聖明在上求賢若渇非若彼時有一靖節而不為用自以山林有志之士莫不以功名自奮思有所樹立矧文卿家世顯榮年當强仕固宜以退為進不宜遽自棄也若夫優哉游哉聊以卒嵗庸伺他日未為晚也因書以為記至正七月六月朔旦書與沈存齋書昔者魏公子無忌食客三千人名冠諸侯及其為趙赴秦軍也無一人為公子畫策而謀却秦以存趙者獨夷門監者侯生生固不受公子財者也嚴仲子以諸侯之卿相不逺千里奉白金為軹深井里人聶政之母夀政辭之趙亡四十萬之衆不能解邯鄲之圍魯仲連以東海布衣掉三寸舌與魏將軍新垣衍極言秦帝之害秦軍聞之為却五十里平原君奉千金為夀不受而去嗚呼三子者或以謀或以勇或以口辯較其所為雖或未合于大義然其奮不顧身為人排患解紛報仇讎使天下後世想慕其為人忻忻然願為執鞭而不可得者徒以受人之財與金耳某也身處布衣之賤迹固抱關之陋困亦甚矣然幸不鼓刀市井為狗屠得以句讀訓詁為人童子師旦夕備甘脆養老母不啻足矣顧以年兼喜懼人子之心有不忍言者間託友人買山擬預營夀藏不意聞之執事執事不謀親友遂探私帑得錢若干緡介朱君犯炎暑風雨走横山購得之執事之義髙矣執事周人之義類此亦多矣執事讀古人書豈聞魏公子之風而興起乎然執事寡嗜欲薄富貴樂恬靜方將棄田宅挈妻孥入山林躬耕採藥蟬蛻穢濁以浮游塵埃之外使世復有侯生者流執事將無所用之然吾觀執事必不屑以魏公子輩自期而某亦豈敢妄以侯生之流自待㢤然侯生不以監門困故而受財魯連不以却秦有功而受金彼固皆天下之士也而某何敢望焉若夫聶政市販困汙之人耳卒不以母故而受人之金某自總角從父師讀誦詩書習聞前言往行粗知貴義賤利之說執事與某非有葮莩之親某于執事非有纎芥之勞徒以家貧母老念先事為備遂辱執事遺以山山之直雖不及百金然人有徳于其親則于金何有向也知貴義而賤利今也利執事之山而受之執事不暇顧傷惠而與某某又不暇䘏傷廉而取之執事且傷廉之事市販之人不肯為執事師古人學古道豈宜以某之故而被傷惠之名乎執事視財甚輕視義甚重然吾聞之義莫大于愛人執事愛人以徳而使某蹈傷廉之失而為軹深井里人所笑亦豈執事意乎今以山直錢若干并據文納上執事聽其言察其心歸其錢于私帑然後以據文擲與則執事之賜厚矣否則并其文不敢望􅈤􅈤之私惟執事諒之題跋書舒穆嚕氏家譜後昔金源氏代遼有國甞易其貴族之姓舒嚕為舒穆嚕氏其子孫䇿勛天朝散處四方率以武功顯若今雲南元帥存道公及平江萬户伯璣公是已然存道公甞將文衡于四川行省及其請于朝而復姓也故國子監丞莆田陳公衆仲序之甚詳今伯璣之姓雖未及復然其譜而存之豈亦有所待也夫凡其世次之隆勲伐之盛諸公論之備矣予獨推本而言之者盖亦表其姓之所自云爾書故御史鄭公從之嵩山五詩後右嵩山五詩故監察御史洛陽鄭公從之棄官學道之時手書其所作也昔漢梅子真為南昌尉數上書譏刺權奸不見納遂棄妻子去九江時人傳以為仙公當至元全盛時非若西都之季而時相用事非有元始專政之大惡其為御史又非南昌尉所可同日而語故以直道見機亦棄妻子著道士服為黄冠師終其身不還鄉里其去就之際視子真有甚焉者然子真之議論風裁先于漢書班班可攷千載之下尚想見其為人今公之所建明未知太史氏悉得書之與否尚幸其蟬蛻穢濁髙世絶人之概見于詩者真與嵩髙之氣相盤薄世之側媚取容持祿固位者聞公之風亦可以少愧矣雖然子真去後人或見其變姓名為呉市門卒者庸知公不與司馬子微之流往来人間乎吁顧安得而見之也書中書除目御書􅄆官後中書除目凡六人所賜􅄆官實仁宗皇帝親御翰墨為之書而故蔡國文憲公臣郭貫時由治書侍御史遷禮部尚書以從五品秩超授嘉議大夫而居其首一時氣象見于雲章奎畫藹然虞廷命官之意儒臣之寵未有加于此者盖國家以神武不殺奄有四海而典章文物至仁皇而大備鴻儒碩彦遭際聖朝並列庶位而臣貫尤以文學老成蒙被優擢如此書曰知人則哲能官人又曰夙夜惟寅直㢤惟清然則非仁皇之聰明睿智弗能以知臣貫非貫之寅亮直清不足以堪上命故其厯事三朝致位廊廟列于名臣豈非簡注有素而所積者厚乎嗚呼鼎湖之龍既逺九原亦不可作抱遺弓而悲風木者尚期以孝為忠思所以引而弗替云至正七年十月庚辰布衣臣陳基拜手稽首謹識書太古字說後河東運使髙昌拜珠公字太古中朝諸名公為文為詩以發明其義無餘藴矣復俾某一言以申其說某聞公曽大父鞏昌王大父安懿王咸以純一無偽之徳厯事累朝卒致端拱之治至公之父平章公季父御史祇遹先猷為世大臣而公又克承世澤致位通顯其在中臺為良御史行部為賢使者庸田司復著能聲而仕鹺臺也又稱一時之慎選然則所以紹其家業者亦豈外于純一無偽純一無偽者何太古之道也夫名者實之賔而字所以敬名也公方嚮用于時所以奮庸熙帝之載以光于前人則于敬名以稱夫實乎何以公尚勉之㢤跋學齋侍御張掖劉公洛陽懐古詩洛陽懐古書西臺侍御張掖劉公之所賦也公以學問政事方用于世而其為詩清新雅麗有則至以周公邵子為言則先儒之微意而知公之學有所本也刻而傳之豈惟洛陽之盛事而已哉跋張彦輔畫拂郎馬圖至正壬午予客京師而拂郎之馬適至其龍鬃鳯臆磊落而神駿既入天廏備法駕而其繪以為圖傳諸好事者則永嘉周冰壺道士張彦輔以待詔上方名重一時然冰壺所作論者固自有定論至於彦輔以解衣盤礴之餘自出新意不受羈紲故其超軼之勢見于毫楮間者往往尤為人所愛重而四方萬里亦識九重之天馬矣此巻乃其最得意者俯仰八九年復于顧仲瑛氏處見之追懐疇昔信為増慨韓文公有云千里馬常有伯樂不常有吁世豈惟無伯樂哉雖欲求如彦輔之圖寫俊骨亦不可復得仲瑛其可不寶而藏之乎跋西園雅集圖故宋駙馬都尉王公晉卿西園之集亦盛矣盖非駙馬之賢不足以致諸老非諸老不足以顯西園之勝然則戚畹之貴不足為駙馬榮而其名埀不朽者政以其能文好士耳吁自昔王公大臣孰無園池水竹之樂百世之下能使人臨文興慨甚謂世道之盛衰人物之消長于是乎在則夫斯圖之見重于世又豈惟以西園而已哉跋喀喇承㫖遺墨故翰林學士承㫖喀喇公遺墨四帖其後兩帖乃公在宣文閣時所書以遺基而基轉以予顧君仲瑛者今年孟春過玉山草堂仲瑛出以見示伏而玩之恍如見公與王右軍父子翺翔于天門鳯閣之上而蛟龍鸞鶴為之後先也九原不可復作尚幸數從仲瑛游時一披展俯仰今昔得不重為感慨乎跋貫酸齋書歸去来辭酸齋公如冥鴻逸驥不受繒繳羈靮而其蟬蛻穢濁逍遙放浪而與造物者游近世盖未有能及之者其自謂平日不寫古今人詩章而獨慕陶靖節之為人書其歸去来辭觀者殆不可以尋常筆墨蹊徑求之也至正十年五月二日臨海陳基識傳傅道人傳傅道人者名道清字隠陽燕人也甞以皂隸給事中書刑部積勞當食九品祿會河南有以詿誤逮繫請室者若干人道人獨哀其非辜毎加存䘏未㡬詔赦出之尋許會還官于是皆私徳道人亦雅知河南風土之厚又幸有東道主乃謀于父兄妻子不逺千里往訪之既至爭迓迎之相與道舊懽甚又將厚餽之居無何偶行闗陜間遇黃冠師而與之語因請寓宿師與之端坐竟夕不寐俄黙然若有會于其心者乃賦五字詩一首語皆超悟所謂黃冠師不知其為何許人也旦日遂易初服還謝主人悉辭其所餽不受且曰吾平生雖未始讀書然亦甞聞漢之絳侯矣勇足以將百萬之軍而怯不堪一獄吏榮為萬乘之卿相而辱不迨一匹夫此無它知進不知退也子等固非絳侯之倫然不幸而逮捕則無以異使吾以向之侵辱絳侯者以侵辱子等獨不得金以貽父兄妻子乎顧義有所不忍也吾聞古之有道者祿以萬鍾位之上卿而不顧今吾徒一皂隸舍去繩墨質鈇之役而以虛無為本清淨為宗其自視雖不敢與古人之有道者齒然去就輕重孰與勇怯榮辱相尋于生死得喪而不知者嗚呼吾尚安用君之所餽為哉乃去入嵩山受隂符道徳南華諸書于陳鍊師居八年不與父兄妻子音問相接父兄妻子亦莫知其所在也洛陽之三井洞係故劉尊師鍊丹處道人遂因故址築環堵坐其中不出好事者或往候之亦不與之語獨見御史沃哷公允常環偉特達器識絶人心竊慕之而公亦喜其不務詭異之行誕幻之言以驚世駭俗因折節與之交公甞語之曰吾非好為是驅馳也以君親之恩未報耳他日倘遂吾初心則葛巾杖履相從于山巔水澨不難也道人擬闢真館于洛城之東謂之曰大夫進足以為邦家之光退不失于泉石之榮故曰功成名遂身退天之道後三十年當候公于此矣時予客公所因與道人善見其語黙止作不異衆人然不飲酒不茹葷而神全氣澤其中之所存覺有異于人者故予樂為之道也賛曰昔金源氏之時有健卒曰颵腿王者初不識字一旦舉筆成章時人以為得道稱之曰王先生平章趙公閑閑名重當世尤雅敬之今道人之出處大畧與王相似而允常公之學問政事與夫功名未艾視趙公可以無愧且有急流勇退之志焉故予並著于篇以伺云哀詞葉孝墅哀詞並序葉孝墅世居天台少孤雅志好學既冠游京師見項君子虚虚與葉氏世有婣好而孝墅執子弟之禮惟謹相與甚懽子虛儒者而隠于黃老以醫名京師京師之人無貴賤賢愚皆稱重之孝墅與之周旋應接竟日不倦而能安淡泊服勤苦聲色勢利服玩宴樂舉無所嗜獨尚儒術善楷書好醫藥煉金石草木為丹劑號精絶不輕與人子虚甚器重之孝墅既蚤失父母幸有兄弟然皆未有子去年兄若弟俱喪訃至孝墅哀慟嘔吐仆地頃之復蘇然竟以是不起子虚亦知其不可救而生之之心未已尚恐已術或弗及欲延訪他醫孝墅曰使世無良醫則已如有之豈復有賢于秦醫緩者耶然膏肓之疾雖緩有所不能為公今之緩也吾之疾公且莫之為况他醫耶夫人窮則呼父母吾真呼父母矣公如吾父母顧力有不能者豈非天耶獨念吾兄弟無後吾死亦無後吾宗亦何至是耶是亦天耶吾之命信懸于天矣尚何言耶尚何言耶嗚呼何其言之悲乎始余居里巷時聞葉氏世有令徳及與孝墅友又信其為佳子弟俱留京師見其取與之不茍言行之有度未甞不與子虛稱之而人亦莫不稱之也意其必有所恃立克享前人之徳乃今不幸而兄弟相繼以死夫有佳子弟如孝墅而不克夀世有令徳如葉氏而竟無後此天道之所不可必而君子之所以深哀也故為作哀詞世之知孝墅者固已同於哀矣其不知者尚因詞以見之其詞曰爾車非不利兮又循循其擇路既膏舝又挾輈兮馬驤首其欲騖朝出門兮以就軌夕亡輻而失馭何殃慶之不以其類兮俾若人而弗禄生何恃而何怙兮死曷往而曷歸尚魂氣之流通兮覽舊邱而下之哀若人而不可復見兮耿予懐而増悲夷白齋稿外集巻下
