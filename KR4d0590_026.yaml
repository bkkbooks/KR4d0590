front:
  text: 夷白齋藁卷之二十六
  hash: sha256:fb6e31e102199e419171ab654bf9505147afb3fd2a67aa0ff45f7bf5fe88d1d5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_026-1a}
body:
  text: 臨海陳基著金華戴良編記思善堂記勾吳張熙載氏力田事親于松陵同里有鄉黨薦紳之譽嘗讀書至公父文伯之母所謂民勞則思思則善心生而歎曰美哉乎其言之也孔子之使弟子志之其有以夫乃即所居扁曰思善堂且謂余曰願為之記夫人位乎兩間所謂善者與生俱生也然中人以下或不能不淪胥委靡而為其土所遷故心之善惡生于民之勞逸民之勞逸原于土之沃瘠是以楚有桂林之饒江湖之利其民侈靡而不務夲趙有邯鄲之冨四通之衢其民矜飾而喜逐末唐獨以土瘠民貧其人皆勤儉而質朴憂深而思逺故聖王之用民也有貴乎瘠土焉勾吳今之楚趙也陸海之産夥于桂林𢡟遷之貨盛于邯鄲其土蓋可知矣而褐衣皮冠唅菽飲水之民若熙載者顧諰諰焉曰以孝弟力田為務若將自食其力如蟋蟀詩人之所賦者噫豈聞陶唐氏二遺風而興起乎蓋不淪胥于其土而能蚤夜乎其思此中人之所難而君子之所與也使勉焉弗畫循之有序則近之事親逺之事君無適而不與善者周旋于洞洞屬屬之間而薦紳之譽將不止于鄉黨矣易曰素履往無咎熙載其尚念之至正十二年冬十月甲子記鋉雪軒記人恃五榖以生而世之嗜茶如五榖者豈以其能蠲昏滯釋煩壅亦飬生者之助乎昔陸羽既著茶經張又新之徒復祖述羽論水之品第有二十而雪水則其殿也吳郡因了堂上人少遊四方學出世聞法而嗜茶則不啻如羽焉既歸老其鄉而其鄉之水冝茶且麗又新所記有若虎丘松江者殆與南零惠山相伯仲上人顧舍不耴而獨竊竊焉有事于品苐之殿者以自名其軒曰錬雪且上人嗜茶如五榖蓋不可一日輟者也然猶必待有雪而後錬之豈命軒之意乎蓋嘗從上人而論茶矣井焉而新薪焉而火活始也爽朗乎若晴空之行浮雲終也輕盈乎如白花之耀陽春或薄者為沫厚者為餑紛綸洶歘與雪同物故茶之蠲煩釋滯猶雪之陵弭毒害也煩滯釋而後五榖之㓛全猶毒害弭而後萬物之天遂也故不必虎丘松江而水之品存斯善乎水者也不待涸隂沍寒而雪之用足斯善乎雪者也而其所以疏靈源溉舌本浸淫乎禪恱之味䇿勳乎飬生之外斯善助五榖者也正使世復有羽將旨焉而心味之不暇尚奚品苐之殿云乎哉然此亦自有色香味者而言之爾當其未始有色香味也真妄冥合名實交喪果孰為雪孰為非雪乎故即是軒而觀謂上人所錬為雪固不可謂之非雪亦不可意顧安得六根互用舌頭具眼者與上人言之至正十二年十二月草有一日韋羌山人夲源禪院記距黃巖州治之南五里有山曰龜山延祐間大比丘無住禪師㝎公居之州人李竹心氏黃克仁氏許野夫氏孟寂菴氏皆慕師之風往來精舍為方外逰至順二年辛未枽門契如知師雅有延待十方雲水之意爰即舊圖新得地南隴之半而遷焉州之信女金氏周氏徐氏黃氏施錢刻木肖圓通大士象莊嚴崇奉蔚為寶坊今所謂本源禪院世以甲乙守之者也師慮衆集而食不繼則事墮群居而律不嚴則業墮既買田若干畞擇其徒廉畏通練者主其入又歲推一人為衆所服者居首座凡禪誦動作威儀之則一遵百丈清規而九旬之夏修持惟謹蓋師族居州之西橋髙曽祖皆以貴胄從學考亭朱子且􅊚而師也生稟淑靈幼篤慈忍少長事祖及父兄孝且恭既終飬輒蟬蛻萬緣謁方山寶公于杭之南屏願以𥘉服而師事焉山器而度之時年二十有八具戒首謁無涯際公于婺之智者一言懸解頓造玄關繼見鐵山璚公而歸老是山足不越閫者垂三十載以至正元年辛巳八月二十四日委化闍維之日珠圜玉潤名曰舍利者無算遂建塔山之西麓春秋七十有三夏臘四十五後八年己丑師之上首弟子一恆不逺千里介其從文煥以院之始末師之出處大梁徵文為記勒諸貞石以昭示方來按龜山即委羽山俗所謂俱依山者也道家者流號為天下第二洞天云有真人嘗輕舉于此今師以世家舊族即有入空懷寶厥躬退藏于蜜始也捋以滅迹韜光終也遂以順緣闡化于是崇基易構宅勝面陽佛燈照大有之天梵宇廓空明之境凡挈瓶錫背笈篋由天台鴈蕩而來者至是如歸人謂俱依之兆職此可徴吁夫豈偶然而巳哉為其後者服師之服居師之居尚知培夲濬源蹈規迪矩使無上福田利益羣品則甲乙之傳其未艾乎庸因恆之請而為之書若夫工之巨細費之多寡其末也茲可以略云是歲七月既望省委官河南杜君政蹪記至正十二年壬辰春海寇􅊞漕運汝寇陷湖襄蔓延江東西江浙行中書省出師捕禦選材略素著者備瀕海要害地嘉興為郡負海控江左拱錢唐右連吳會而其地若海鹽舊邑澉浦黃灣境接島夷商通卉服大艘巨舶與醜類鯨鯢相出沒有司防禦雖不敢懈尚慮勢庳事緩思得勇果有器局者捴之而行省難其人河南杜君由吉安路總管府知事寓杭慷慨論海事其言剴切行省聞之大説遂命君乘傳涖澉浦往來黃灣等地以警非常凡以海為事者皆隸焉君入郡擇能吏自隨甫至首誅凶殘無賴素為民患者海昌群盜怙終捻惡已久至是亦殄滅逺近聞夙莫不懾伏平章㝎㝎公多其為勞以名酒錫以束帛金帶君念習海之民貧不安業則易變今欲弭盜而不知息民知息民而不知減鹽策之正薄商旅之稅猶治疦而不察其端雖有善藥無如之何也乃條其事以聞行省從之未幾寇入杭湖常三路相繼失守浙右騷動寇退生民塗炭者十八九君所涖之地綿亘三百里獨晏然無恐民父兄相語曰生我者父母衛我者杜君也君曽大父元帥公䇿勛先朝開閫河南河北大父嘉議公湖南宣慰使司同知元帥府事父儒林公河南行中書省左右司貟外郎剖符授鉞奕世載德君伯仲鳴玉曵紱後先踵武今君于此特以行省之命折衝一時保釐一境而能恪恭給興利除害使民不忘若是有如執干戈以衛社稷俾克配其前人則其大書特書屢書不一書者豈不卓然偉丈夫哉故既述民父兄之意又推夲君先世大略并勒之石庶上之人欲知君者于此有徴焉君名字云十三年癸巳月日記天惠賢首教寺記吳門天惠賢首教寺郡沙門如山安公之所建也公世居松陵家本士族父吳伯熙甫隱居奉佛毋王氏崇信惟謹及公之生母感異夢爰在稚歲性稟殊倫少長出則服膺世典入則篤意真乘父母察其不群聽以出家博訪名師不計寒暑遍探祕義尤嗜華嚴理暢心融殆若天授間讀大報恩等篇而嘆曰吾佛所説廣大悉備眷求其端實在孝敬于是食粗衣菲而心專于色飬錙積寸纍而志于報本既由儉勤得致饒益則以其贏購地于郡城之東廣袤若干步度材庀工作菴以居日益月增廓而為寺經始于年月落成于年月門闥閎麗殿寢邃深講堂言言東西有序以至栖經之閣選物之場方丈之室與凡齋庖庫庾其法所冝有者靡不備完公于此身先戒律率徒閲藏經梵並宣雜華芬郁莊嚴殊勝士民具瞻前僉行宣政院事張公嘉乃休績為請于帝師寵錫今名俾為十方禮聘清涼疏主之嫡傳者開山演教既竣事尋以寺之顛末徵文以為記世言浮圖氏善以小致大以難致易蓋用力勤者其㓛博刻意專者其效速矧其心懷顧復嗇巳厚親肇開圎頓之門永表追逺之地迓續華嚴之奧學紹隆賢首之正宗且未始持簿赱民間資銖黍之助于人若安公者非用力勤而刻意專者乎為其徒而居其居者皆知以弘道報夲為務因其所以成嗣而繕葺之則無福田仰以衍無強之丕祚俯以答罔極之私恩而吳門之有天惠天惠之宗賢首將與東南列剎競爽無窮所謂㓛之博者日以興效之速者日以固此蓋公之志而余之所樂道也故為之書使勒貞石云至正十二年月日記夷白齋藁卷之二十六
