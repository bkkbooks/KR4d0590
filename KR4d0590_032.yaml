front:
  text: 夷白齋藁卷之三十二
  hash: sha256:eee7762b6a9a14bc6584989688860e9def0785261279f4f96a5a0020b0a1e91c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0590_SBCK_032-1a}
body:
  text: 臨海陳基著金華戴良編題䟦䟦陳汝資先生書其弟汝泉詩後余年二十許時及識四明陳先生汝泉翁翁時年巳五十餘矣越二十有七年從其嗣子桱獲觀翁兄教授君所書翁十八歲時侍其先公祕監府君中秋飲酒所賦五言三韵七篇盖翁以學問文章世其家業而老蒼峻潔之氣巳見扵少年如此夫以祕監公為之父教授君為之兄詩章翰墨輝暎扵玉昆金友間而故家文獻隠然未泯扵此盖亦有可徴者矣嗚呼翁今不可復作而嗣子桎伯仲又能以家學為已任引而勿替君子之澤其未艾乎至正二十年九月甲子臨海陳基識䟦李伯時追彘圖蘇長公謂有唐之盛文至扵韓愈詩至扵杜甫書至扵顔真卿畫至扵吳道元天下之能事畢矣識者以為知言宋三百年文章大手筆如歐陽公諸君子不待言矣至扵書畫名品如李伯時軰盖亦極天下之能者今觀蔡君彦文所蔵追彘圖人馬態度極唐人以来畨騎之妙冝其為世所寳玩也至正二十一年五月甲子䟦䟦蘭亭序蘭亭㝎武舊刻承平時亦不多見此本故内翰王公以為趙公閭閒家故物由趙公至今不知更變㡬故矣况趙公之前又所不論耶世傳墨寳所在若有神物訶護之然亦不可以其為迂而不信也蘭亭序既殉葬昭陵天下遂以㝎武夲為書法之宗此夲雖字盡差肥然書家者流觀其位置猶可遡流求源而永和之遺風餘韵隐然可見未可以群議紛紛而遽有所優劣也䟦同别峯講師所蔵蘇文忠公帖蘇長公文章氣節為天下萬世所宗雖尋常往復尺素中而忠君愛國之心未嘗不惓惓也别峯上人逰乎方之外視公遺壘不啻法寳亦可尚㦲跋蘇文忠公自書前赤壁賦余偶過東武山與寳林師語已覺精神蕭散師又岀蘇長公自書前赤壁賦對山展玩無異汎舟從公之快此亦一時之竒遇也䟦饒叅政草書後余嘗怪古人評書而草獨以聖名夫書而至扵聖亦精矣然夷考其人皆有超世絶俗之才不得盡用扵世故扵是焉彂之昔韓文公論書至與堯舜禹湯治天下並稱有以㢤臨川饒公介之學問器識卓然為士大夫翹䠂而其嚮用扵世盖所謂鷙鳥舉而風迫之也書特其餘事耳然近来所書尤瓌詭逸群可喜公豈欲以書擅當世㢤然觀其勢殆不至扵聖不止也書朱雲傳後漢成帝舉天下以聽大将軍王鳯而内寵趙氏史稱其容受直辞豈以其不殺朱雲而云尔乎然劉輔以諌立趙后論為鬼薪王章奏王鳯不忠而抵極刑朱雲獨以廷辱張禹而得不死盖趙氏内嬖也王鳯外戚也張禹師傅也師傳視内嬖外戚其情孰親孰䟽則三人之得罪可從知矣當劉輔之繫祕獄也帝之怒豈􅉝慶忌䓁所能觧㢤然輔所以得减死一䓁者徒以立趙氏非元后意尔及遣㝎陶共王歸國實鳯以計推逺之王章不忍以帝兄弟之親而爲鳯所間乃上奏皆切中鳯罪上亦一時感悟然㝎陶王之势不如鳯加以太后一不食雖百王章鳯無憂矣此鳯之所以偃然居位而章不免扵􅓍也朱雲見劉輔王章皆以言坐張禹以帝師傅與鳯並領尚書略無㡬微匡救意乃彂憤上書願賜尚方斬馬劒㫁佞臣一人以厲其餘其言斥禹不及鳯而所謂臣下得從龍逄比干逰扵地下足矣未知聖朝何如又足以感動上心故􅉝慶忌一叩頭雖攀折殿檻有所不問然則所言親者罪重䟽者罪輕向使雲一言斥鳯則斬馬之剱反以加雲雖欲居鄠田乗牛車從諸生不可得而謂成帝容受直辞可乎嗚呼成帝在位直臣亦不爲少然自劉輔得罪而嗣子不立王章冤死而權移外家雖有不易折檻以旌直臣之言亦善善而不能用惡惡而不能去漢欲不亡得乎當是時朱雲不以諌顯名平陵一匹夫耳雲既以諌顯則華隂守丞嘉雖以薦雲坐罪無憾噫若雲者亦誠忠匹丈夫也㢤書趙冀公墨梅後右故宋趙冀公墨梅石刻在中吳虎丘寺此乃夲監郡西夏六十公子約所蔵以為珎玩者也余嘗觀其新英静秀有冀公少年機警之風其盤根錯節似與金人戦髙頭而横斜勁㧞之势又佀帥突騎應䇿奮擊金人呼聲撼山谷之時其寒梢挺特有直而不屈之態彷彿論李全必叛義形扵色而請兵討賊以安朝廷之氣雖有賁育不能奪也至扵風霜揺落之餘而貞色凛然氣壓群木又儼若筋力既老而衛國之志不衰嗚呼壮㢤公之大節如此亦可謂社稷之臣矣宋自端平以来捍禦淮蜀兩邉非其材館賔客即其偏禆将校當時倚之如長城有以夫惜其兩叅政府而不得安扵朝廷一命右相而不得宅乎百揆而雄材大略一以見之武㓛是猶梅之不得盡其和羔之用而樝梨橘柚之属反得効其滋味扵爼豆聞此豪傑之士所以不能無遺憾也公在淳祐間上䟽論天下事莫先用人用人莫先牧養莫先寛厚今監郡公以寛厚之政治呉吴人恃之如金城湯池使其居朝廷賛百揆遭冀公所不得之時行今日所欲行之志䓁而上之則扵公乎何有且冀公之聲名不待盡而傳監郡公之玩賞不待梅而勝然觀其畫而思其人囙其玩而知其志則斯卷也豈可少㢤夷白齋藁卷之三十二
